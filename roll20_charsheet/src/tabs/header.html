/* ===== PARAMETERS ==========
destinations = the name of the attribute that stores the total quantity
        can be a single attribute, or an array: ['total_cost', 'total_weight']
        If more than one, the matching fields must be in the same order.
    section = name of repeating fieldset, without the repeating_
    fields = the name of the attribute field to be summed
          destination and fields both can be a single attribute: 'weight'
          or an array of attributes: ['weight','number','equipped']
*/

const generateUUID = (function() {
    let a = 0, b = [];
    return function() {
        let c = (new Date()).getTime(), d = c === a;
        a = c;
        let e = new Array(8);
        for (let f = 7; 0 <= f; f--) {
            e[f] = "-0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ_abcdefghijklmnopqrstuvwxyz".charAt(c % 64);
            c = Math.floor(c / 64);
        }
        c = e.join("");
        if (d) {
            for (f = 11; 0 <= f && 63 === b[f]; f--) b[f] = 0;
            b[f]++;
        } else {
            for (f = 0; 12 > f; f++) b[f] = Math.floor(64 * Math.random());
        }
        for (f = 0; 12 > f; f++) c += "-0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ_abcdefghijklmnopqrstuvwxyz".charAt(b[f]);
        return c;
    };
})();

const generateRowID = () => generateUUID().replace(/_/g, "Z");

console.log("Alternity RPG Sheet Workers Loading...");
const repeatingSum = (destinations, section, fields) => {
    if (!Array.isArray(destinations)) destinations = [destinations.replace(/\s/g, '').split(',')];
    if (!Array.isArray(fields)) fields = [fields.replace(/\s/g, '').split(',')];
    getSectionIDs(`repeating_${section}`, idArray => {
        const attrArray = idArray.reduce((m, id) => [...m, ...(fields.map(field => `repeating_${section}_${id}_${field}`))], []);
        getAttrs([...attrArray], v => {
            const getValue = (section, id, field) => v[`repeating_${section}_${id}_${field}`] === 'on' ? 1 : parseFloat(v[`repeating_${section}_${id}_${field}`]) || 0;
            const commonMultipliers = (fields.length <= destinations.length) ? [] : fields.splice(destinations.length, fields.length - destinations.length);
            const output = {};
            destinations.forEach((destination, index) => {
                output[destination] = (idArray.reduce((total, id) => total + getValue(section, id, fields[index]) * commonMultipliers.reduce((subtotal, mult) => subtotal * getValue(section, id, mult), 1), 0)).toFixed(2);
            });
            setAttrs(output);
        });
    });
};

/* ===== SPECIALTY SKILLS DATA MIGRATION ===== */
on("sheet:opened", function() {
	getAttrs(["specialties_migrated"], function(status) {
		if (parseInt(status.specialties_migrated) === 1) {
			return;
		}
		
		// In unit tests, this parses as an empty array [] since the placeholder is commented out.
		// In production, build_sheet.py replaces this comment and array with the actual JSON map.
		const specialtiesToMigrate = /* <!-- SPECIALTY_MIGRATION_LIST_PLACEHOLDER --> */ [];
		
		// Add Psionics explicitly since it maps to multiple targets
		const psionicsTargets = ["PsionicsKnowledge", "PsionicsLaw", "PsionicsLifeScience"];
		
		// Build list of all attributes to fetch
		const oldAttrs = [];
		const newAttrs = [];
		
		specialtiesToMigrate.forEach(function(spec) {
			oldAttrs.push(spec.oldId + "Rank", spec.oldId + "_is_trained");
			newAttrs.push(spec.newId + "Rank", spec.newId + "_is_trained");
		});
		
		oldAttrs.push("PsionicsRank", "Psionics_is_trained");
		psionicsTargets.forEach(function(target) {
			newAttrs.push(target + "Rank", target + "_is_trained");
		});
		
		getAttrs([...oldAttrs, ...newAttrs], function(values) {
			const update = {};
			let migratedCount = 0;
			
			// Migrate standard specialties
			specialtiesToMigrate.forEach(function(spec) {
				const oldRankKey = spec.oldId + "Rank";
				const oldRankVal = values[oldRankKey] !== undefined ? values[oldRankKey] : values[oldRankKey.toLowerCase()];
				const oldRank = parseInt(oldRankVal) || 0;
				
				const oldTrainedKey = spec.oldId + "_is_trained";
				const oldTrainedVal = values[oldTrainedKey] !== undefined ? values[oldTrainedKey] : values[oldTrainedKey.toLowerCase()];
				
				const newRankKey = spec.newId + "Rank";
				const newRankVal = values[newRankKey] !== undefined ? values[newRankKey] : values[newRankKey.toLowerCase()];
				const newRank = parseInt(newRankVal) || 0;
				
				if (oldRank > 0 && newRank === 0) {
					update[newRankKey] = oldRank;
					if (oldTrainedVal !== undefined) {
						update[spec.newId + "_is_trained"] = oldTrainedVal;
					}
					migratedCount++;
				}
			});
			
			// Migrate Psionics
			const oldPsionicsRankVal = values["PsionicsRank"] !== undefined ? values["PsionicsRank"] : values["psionicsrank"];
			const oldPsionicsRank = parseInt(oldPsionicsRankVal) || 0;
			const oldPsionicsTrainedVal = values["Psionics_is_trained"] !== undefined ? values["Psionics_is_trained"] : values["psionics_is_trained"];
			
			if (oldPsionicsRank > 0) {
				psionicsTargets.forEach(function(target) {
					const newRankKey = target + "Rank";
					const newRankVal = values[newRankKey] !== undefined ? values[newRankKey] : values[newRankKey.toLowerCase()];
					const newRank = parseInt(newRankVal) || 0;
					if (newRank === 0) {
						update[newRankKey] = oldPsionicsRank;
						if (oldPsionicsTrainedVal !== undefined) {
							update[target + "_is_trained"] = oldPsionicsTrainedVal;
						}
						migratedCount++;
					}
				});
			}
			
			// Always set migration status to 1 so this doesn't run again
			update["specialties_migrated"] = 1;
			
			if (migratedCount > 0) {
				console.log("Migrating " + migratedCount + " specialty skill values to new deconflicted IDs:", update);
				setAttrs(update);
			} else {
				console.log("No specialty skill values needed migration.");
				setAttrs({ specialties_migrated: 1 });
			}
		});
	});
});

/* ===== COMBAT STEP DIE CALCULATION ===== */
const combatStepMap = {
    '-15': '-11d20', '-14': '-10d20', '-13': '-9d20', '-12': '-8d20', '-11': '-7d20',
    '-10': '-6d20',  '-9':  '-5d20',  '-8':  '-4d20',  '-7':  '-3d20',  '-6':  '-2d20',
    '-5':  '-1d20',  '-4':  '-1d12',  '-3':  '-1d8',   '-2':  '-1d6',   '-1':  '-1d4',
    '0':   '+0',
    '1':   '+1d4',   '2':   '+1d6',   '3':   '+1d8',   '4':   '+1d12',  '5':   '+1d20',
    '6':   '+2d20',  '7':   '+3d20',  '8':   '+4d20',  '9':   '+5d20',  '10':  '+6d20',
    '11':  '+7d20',  '12':  '+8d20',  '13':  '+9d20',  '14':  '+10d20', '15':  '+11d20'
};

function updateAttackMacro(section, rowId) {
    const isStarship = section === 'starshipweapons';
    const prefix = `repeating_${section}_${rowId}_`;
    const s = isStarship ? 'StarshipWeapon' : 'attackform';
    
    // Core attributes to fetch
    const coreAttrs = [
        'name', 'score', 'type', 'range', 'die', 'accuracy', 'sit', 'multi',
        'damageordinary', 'damagegood', 'damageamazing', 'notes'
    ];
    
    // Map to actual Roll20 attribute names
    const fields = coreAttrs.map(attr => {
        let suffix = attr;
        if (isStarship) {
            // Starship specific camelCase
            if (attr === 'name') suffix = 'Name';
            if (attr === 'score') suffix = 'Score';
            if (attr === 'type') suffix = 'Type';
            if (attr === 'range') suffix = 'Range';
            if (attr === 'die') suffix = 'Die';
            if (attr === 'accuracy') suffix = 'Acc';
            if (attr === 'sit') suffix = 'Sit';
            if (attr === 'multi') suffix = 'Multi';
            if (attr === 'notes') suffix = 'Notes';
        }
        return prefix + s + suffix;
    });

    const extraFields = isStarship ? ['WeaponStationO', 'WeaponStationG', 'WeaponStationA'] : [];
    
    getAttrs(['character_name', 'character_id', ...fields, ...extraFields], function(v) {
        console.log(`DEBUG: updateAttackMacro values for ${rowId}:`, v);
        
        const getVal = (suffix) => {
            let actualSuffix = suffix;
            if (isStarship) {
                if (suffix === 'accuracy') actualSuffix = 'Acc';
                else if (suffix === 'name' || suffix === 'score' || suffix === 'type' || suffix === 'range' || suffix === 'die' || suffix === 'sit' || suffix === 'multi' || suffix === 'notes') {
                    actualSuffix = suffix.charAt(0).toUpperCase() + suffix.slice(1);
                }
            }
            const key = (prefix + s + actualSuffix).toLowerCase();
            return v[key];
        };

        const name = getVal('name') || 'Weapon';
        const baseDie = parseInt(getVal('die')) || 0;
        const accuracy = parseInt(getVal('accuracy')) || 0;
        const sit = parseInt(getVal('sit')) || 0;
        const baseMod = baseDie + accuracy + sit;
        
        const dmgO = getVal('damageordinary') || '-';
        const dmgG = getVal('damagegood') || '-';
        const dmgA = getVal('damageamazing') || '-';

        let score = parseInt(getVal('score')) || 0;
        let scoreG = Math.floor(score / 2);
        let scoreA = Math.floor(score / 4);
        
        if (isStarship && !score) {
            score = parseInt(v['weaponstationo']) || 0;
            scoreG = parseInt(v['weaponstationg']) || 0;
            scoreA = parseInt(v['weaponstationa']) || 0;
        }

        const getStepDieRoll = (stepVal) => {
            const clamped = Math.max(-15, Math.min(15, stepVal));
            const sign = clamped >= 0 ? '+' : '-';
            const absStep = Math.abs(clamped);
            if (absStep === 0) {
                return { sign: '+', roll: '0' };
            }
            const dieMap = {
                1: '1d4', 2: '1d6', 3: '1d8', 4: '1d12', 5: '1d20',
                6: '2d20', 7: '3d20', 8: '4d20', 9: '5d20', 10: '6d20',
                11: '7d20', 12: '8d20', 13: '9d20', 14: '10d20', 15: '11d20'
            };
            const die = dieMap[absStep] || '0';
            return {
                sign: sign,
                roll: die === '0' ? '0' : `${die}cs<0cf<0`
            };
        };
        
        const sanitize = (str) => {
            if (!str) return '';
            return str.replace(/\r?\n|\r/g, ' ').replace(/\|\|/g, '|').trim();
        };

        const generateMacro = (mode) => {
            const weaponName = sanitize(getVal('name') || 'Weapon');
            const charName = sanitize(v['character_name'] || 'Character');
            
            const type = sanitize(getVal('type') || '-');
            const range = sanitize(getVal('range') || '-');
            const notes = sanitize(getVal('notes') || '');
            
            const scoreO = score;
            const scoreGVal = scoreG;
            const scoreAVal = scoreA;
            
            // Format command:
            // !aaa-roll [CharName] || [WeaponName] || [Type] || [Range] || [Notes] || [ScoreO] || [ScoreG] || [ScoreA] || [Mode]
            let cmd = `!aaa-roll ${charName} || ${weaponName} || ${type} || ${range} || ${notes} || ${scoreO} || ${scoreGVal} || ${scoreAVal} || ${mode}`;
            
            for (let i = 1; i <= mode; i++) {
                const penalty = (mode > 1) ? i : 0;
                const total = baseMod + penalty;
                const step = getStepDieRoll(total);
                
                cmd += ` || ${step.roll} || ${step.sign}`;
            }
            
            return cmd;
        };
        
        const update = {};
        update[prefix + s + 'macro1'] = generateMacro(1);
        update[prefix + s + 'macro2'] = generateMacro(2);
        setAttrs(update);
    });
}

on('clicked:import_json', function() {
    getAttrs(['import_export_json'], function(v) {
        try {
            if (!v.import_export_json) throw new Error("JSON field is empty.");
            const data = JSON.parse(v.import_export_json);
            const update = {};
            
            const METADATA_MAP = {
                species: {
                    'human': 'Human',
                    'fraal': 'Fraal',
                    'mechalus': 'Mechalus',
                    'sesheyan': 'Sesheyan',
                    'tsa': "T'sa",
                    'weren': 'Weren'
                },
                profession: {
                    'combat-spec': 'Combat Spec',
                    'free-agent': 'Free Agent',
                    'tech-op': 'Tech Op',
                    'mindwalker': 'Mindwalker',
                    'diplomat': 'Diplomat'
                },
                faction: {
                    'orion': 'Orion League',
                    'concord': 'Galactic Concord',
                    'austerity': 'Austerity',
                    'borealis': 'Borealis Republic',
                    'rigunmor': 'Rigunmor Star Consortium',
                    'voidcorp': 'VoidCorp',
                    'thuldan': 'Thuldan Empire',
                    'external': 'External / Independent',
                    'insight': 'Insight',
                    'vanguard': 'Vanguard',
                    'tendril': 'Tendril'
                }
            };
            
            const formatMetadata = (type, key) => {
                if (!key) return '';
                if (METADATA_MAP[type] && METADATA_MAP[type][key]) return METADATA_MAP[type][key];
                return key.split('-').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
            };

            // Map Character Builder JSON to Roll20 attributes
            if (data.bio) {
                if (data.bio.name) update.character_name = data.bio.name;
                if (data.bio.gender) update.gender = data.bio.gender;
            }
            if (data.species) update.race = formatMetadata('species', data.species);
            if (data.profession) update.profession = formatMetadata('profession', data.profession);
            if (data.background) update.career = formatMetadata('background', data.background);
            if (data.faction) update.faction = formatMetadata('faction', data.faction);
            
            // Map Computed AP, Title, and Last Resorts
            if (data.computed) {
                if (data.computed.title) update.character_title = formatMetadata('title', data.computed.title);
                if (data.computed.maxLastResorts !== undefined) {
                    update.lastresortsmax = data.computed.maxLastResorts;
                    update.lastresorts = data.computed.maxLastResorts;
                }
            }
            
            // Try to find XP in computed block, then in root block, then in legacy fields
            const availAP = (data.computed && data.computed.availableAP !== undefined) ? data.computed.availableAP : data.availableAP;
            const effAP = (data.computed && data.computed.effectiveAP !== undefined) ? data.computed.effectiveAP : data.earnedAP;

                const getStat = (statName) => {
                    const base = parseInt(data.abilities[statName]) || 0;
                    const adv = data.advancementAbilities ? (parseInt(data.advancementAbilities[statName]) || 0) : 0;
                    return base + adv;
                };
                if (data.abilities.STR) update.Strength = getStat('STR');
                if (data.abilities.DEX) update.Dexterity = getStat('DEX');
                if (data.abilities.CON) update.Constitution = getStat('CON');

                "aerobatics": "Acrobatics_Aerobatics",
                "daredevil": "Acrobatics_Daredevil",
                "dodge": "Acrobatics_Dodge",
                "fall": "Acrobatics_Fall",
                "zero-g-training": "Acrobatics_ZerogTraining",
                "administration": "Administration",
                "bureaucracy": "Administration_Bureaucracy",
                "management": "Administration_Management",
                "animal-handling": "AnimalHandling",
                "animal-riding": "AnimalHandling_Animalriding",
                "animal-training": "AnimalHandling_Animaltraining",
                "armor-operation": "ArmorOperation",
                "combat-armor": "ArmorOperation_Combatarmor",
                "tactical-armor": "ArmorOperation_Tacticalarmor",
                "propulsion-systems": "ArmorOperation_Propulsionsystems",
                "shields": "ArmorOperation_Shields",
                "athletics": "Athletics",
                "climb": "Athletics_Climb",
                "jump": "Athletics_Jump",
                "swim": "Athletics_Swim",
                "throw": "Athletics_Throw",
                "awareness": "Awareness",

                        update[r20Attr] = "1";

                        update[`${r20Attr}Rank`] = (update[`${r20Attr}Rank`] || 0) + data.skills[skillId].ranks;

                if (data.bio.traits) otherLines.push(`Traits: ${data.bio.traits}`);
                if (otherLines.length > 0) update.other = otherLines.join('\n');
            }
            
            // Map Perks and Flaws
            if (Array.isArray(data.perks) && data.perks.length > 0) {
                update.perks = data.perks.map(p => `• ${p.name || p.id}`).join('\n');
            }
            if (Array.isArray(data.flaws) && data.flaws.length > 0) {
                update.flaws = data.flaws.map(f => `• ${f.name || f.id}`).join('\n');
            }
            
            // Map Movement Rates based on species
            const speciesStr = (data.species || (data.bio ? data.bio.species : 'human')).toLowerCase().replace(/[^a-z]/g, '');
            const movement = {
                human: { Sprint: "20", Run: "12", Walk: "4", EasySwim: "2", Swim: "4", Glide: "0", Fly: "0" },

            };
            const spMove = movement[speciesStr] || movement.human;
            update.Sprint = spMove.Sprint;
            update.Run = spMove.Run;
            update.Walk = spMove.Walk;
            update.EasySwim = spMove.EasySwim;
            update.Swim = spMove.Swim;
            update.Glide = spMove.Glide;
            update.Fly = spMove.Fly;

            update.import_status = "Import successful! ✅";
            setAttrs(update);
        } catch(e) {
            setAttrs({ import_status: "❌ Error: " + e.message });
        }

on('clicked:export_json', function() {
    const baseAttrs = ['import_export_json', 'character_name', 'race', 'profession', 'career', 'Strength', 'Dexterity', 'Constitution', 'Intelligence', 'Will', 'Personality'];
    const skillAttrs = [];
    Object.values(ROLL20_SKILL_MAP).forEach(r20Attr => {
        if (r20Attr.includes('_')) {
            skillAttrs.push(r20Attr + 'Rank', r20Attr + '_is_trained');
        } else {
            skillAttrs.push(r20Attr);
        }
    });
    
    getAttrs([...baseAttrs, ...skillAttrs], function(v) {
        let out = {};
        try {
            if (v.import_export_json) {
                out = JSON.parse(v.import_export_json);
            }
        } catch(e) {
            // Ignore parse errors, start fresh
        }

        if (!out.bio) out.bio = {};
        out.bio.name = v.character_name || out.bio.name || "";
        out.bio.species = v.race || out.bio.species || "";
        out.bio.profession = v.profession || out.bio.profession || "";
        out.bio.background = v.career || out.bio.background || "";

        if (!out.abilities) out.abilities = {};
        if (!out.advancementAbilities) out.advancementAbilities = {};
        
        const handleStat = (r20Val, statName) => {
            const total = parseInt(r20Val) || 0;
            const base = parseInt(out.abilities[statName]) || 0;
            if (base === 0 || total < base) {
                out.abilities[statName] = total;
                delete out.advancementAbilities[statName];
            } else if (total > base) {
                out.advancementAbilities[statName] = total - base;
            } else {
                delete out.advancementAbilities[statName];
            }
        };

        handleStat(v.Strength, 'STR');
        handleStat(v.Dexterity, 'DEX');
        handleStat(v.Constitution, 'CON');
        handleStat(v.Intelligence, 'INT');
        handleStat(v.Will, 'WIL');
        handleStat(v.Personality, 'PER');

        if (!out.skills) out.skills = {};
        if (!out.advancementSkills) out.advancementSkills = {};
        
        Object.entries(ROLL20_SKILL_MAP).forEach(([yid, r20Attr]) => {
            if (r20Attr.includes('_')) {
                const isTrained = v[r20Attr + '_is_trained'];
                const rank = parseInt(v[r20Attr + 'Rank']) || 0;
                const totalRank = (isTrained === 'on' || isTrained === '1' || rank > 0) ? Math.max(1, rank) : 0;
                
                if (totalRank > 0) {
                    const prevTotal = (out.skills[yid] && out.skills[yid].ranks) ? out.skills[yid].ranks : 0;
                    const prevAdv = out.advancementSkills[yid] || 0;
                    const creationRank = Math.max(0, prevTotal - prevAdv);
                    
                    const newAdvRank = Math.max(0, totalRank - creationRank);
                    
                    if (out.skills[yid]) {
                        out.skills[yid].ranks = totalRank;
                    } else {
                        out.skills[yid] = { ranks: totalRank, isBroad: false };
                    }
                    
                    if (newAdvRank > 0) {
                        out.advancementSkills[yid] = newAdvRank;
                    } else {
                        delete out.advancementSkills[yid];
                    }
                } else {
                    delete out.skills[yid];
                    delete out.advancementSkills[yid];
                }
            } else {
                const isTrained = v[r20Attr];
                if (isTrained === 'on' || isTrained === '1') {
                    if (!out.skills[yid]) {
                        out.skills[yid] = { ranks: 1, isBroad: true };
                    }
                } else {
                    delete out.skills[yid];
                    delete out.advancementSkills[yid];
                }
            }
        });

        setAttrs({ 
            import_export_json: JSON.stringify(out, null, 2),
            import_status: "Export successful! ✅"
        });
    });
});
