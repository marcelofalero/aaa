	<script type="text/worker">

/* ===== PARAMETERS ==========
destinations = the name of the attribute that stores the total quantity
        can be a single attribute, or an array: ['total_cost', 'total_weight']
        If more than one, the matching fields must be in the same order.
    section = name of repeating fieldset, without the repeating_
    fields = the name of the attribute field to be summed
          destination and fields both can be a single attribute: 'weight'
          or an array of attributes: ['weight','number','equipped']
*/
const repeatingSum = (destinations, section, fields) => {
    if (!Array.isArray(destinations)) destinations = [destinations.replace(/\s/g, '').split(',')];
    if (!Array.isArray(fields)) fields = [fields.replace(/\s/g, '').split(',')];
    getSectionIDs(`repeating_${section}`, idArray => {
        const attrArray = idArray.reduce((m, id) => [...m, ...(fields.map(field => `repeating_${section}_${id}_${field}`))], []);
        getAttrs([...attrArray], v => {
            const getValue = (section, id, field) => v[`repeating_${section}_${id}_${field}`] === 'on' ? 1 : parseFloat(v[`repeating_${section}_${id}_${field}`]) || 0;
            const commonMultipliers = (fields.length <= destinations.length) ? [] : fields.splice(destinations.length, fields.length - destinations.length);
            const output = {};
            destinations.forEach((destination, index) => {
                output[destination] = (idArray.reduce((total, id) => total + getValue(section, id, fields[index]) * commonMultipliers.reduce((subtotal, mult) => subtotal * getValue(section, id, mult), 1), 0)).toFixed(2);
            });
            setAttrs(output);
        });
    });
};

on('change:repeating_equipment:ItemMass change:repeating_equipment:ItemQty change:repeating_equipment:ItemIsWorn remove:repeating_equipment', function() {
	repeatingSum("EquipmentTotal", "equipment", ["ItemMass", "ItemQty", "ItemIsWorn"]);
});

on('sheet:opened', function() {
	getAttrs(['wealth', 'socialstatus', 'LongNotes'], function(values) {
		if (!!values.wealth) {
			console.log(`Found old Currency data (${values.wealth}), migrating to new Currency fields`);
			setAttrs({
				['repeating_currency_' + generateRowID() + '_wealth']: values.wealth,
				wealth: ''
			});
		}
		if (!!values.socialstatus) {
			console.log(`Found old Social Status data (${values.socialstatus}), appending to Extended Notes field`);
			setAttrs({
				LongNotes: values.LongNotes + `\n\nOld Social Status: ${values.socialstatus}`,
				socialstatus: ''
			});
		}
	});
});

/* ===== SUCCESS SCORE AUTO-CALCULATION ===== */
const attributes = ['Strength', 'Dexterity', 'Constitution', 'Intelligence', 'Will', 'Personality'];

attributes.forEach(attr => {
    on(`change:${attr.toLowerCase()}`, function() {
        getAttrs([attr], function(values) {
            let score = parseInt(values[attr]) || 0;
            let update = {};
            let untPrefix = attr === 'Personality' ? 'Per' : 
                            attr === 'Intelligence' ? 'Int' :
                            attr === 'Constitution' ? 'Con' :
                            attr.substring(0, 3);
            update[`${untPrefix}Unt`] = Math.floor(score / 2);
            setAttrs(update);
        });
    });
});

on("change:actioncheck", function() {
    getAttrs(["ActionCheck"], function(v) {
        let val = parseInt(v.ActionCheck) || 0;
        setAttrs({
            "ActionCheckM": val + 1,
            "ActionCheckG": Math.floor(val / 2),
            "ActionCheckA": Math.floor(val / 4)
        });
    });
});

/* ===== COMBAT STEP DIE CALCULATION ===== */
const combatStepMap = {
    '-15': '-11d20cs<0cf<0', '-14': '-10d20cs<0cf<0', '-13': '-9d20cs<0cf<0', '-12': '-8d20cs<0cf<0', '-11': '-7d20cs<0cf<0',
    '-10': '-6d20cs<0cf<0',  '-9':  '-5d20cs<0cf<0',  '-8':  '-4d20cs<0cf<0',  '-7':  '-3d20cs<0cf<0',  '-6':  '-2d20cs<0cf<0',
    '-5':  '-1d20cs<0cf<0',  '-4':  '-1d12cs<0cf<0',  '-3':  '-1d8cs<0cf<0',   '-2':  '-1d6cs<0cf<0',   '-1':  '-1d4cs<0cf<0',
    '0':   '+0',
    '1':   '+1d4cs<0cf<0',   '2':   '+1d6cs<0cf<0',   '3':   '+1d8cs<0cf<0',   '4':   '+1d12cs<0cf<0',  '5':   '+1d20cs<0cf<0',
    '6':   '+2d20cs<0cf<0',  '7':   '+3d20cs<0cf<0',  '8':   '+4d20cs<0cf<0',  '9':   '+5d20cs<0cf<0',  '10':  '+6d20cs<0cf<0',
    '11':  '+7d20cs<0cf<0',  '12':  '+8d20cs<0cf<0',  '13':  '+9d20cs<0cf<0',  '14':  '+10d20cs<0cf<0', '15':  '+11d20cs<0cf<0'
};

function updateAttackForm(rowId) {
    const prefix = rowId ? 'repeating_attackforms_' + rowId + '_' : 'repeating_attackforms_';
    getAttrs([
        prefix + 'attackformname', prefix + 'attackformscore', prefix + 'attackformtype', prefix + 'attackformrange', prefix + 'attackformnotes',
        prefix + 'attackformdie', prefix + 'attackformaccuracy', prefix + 'attackformsit', prefix + 'attackformmulti', prefix + 'attackformmode',
        prefix + 'attackformdamageordinary', prefix + 'attackformdamageordinarytype',
        prefix + 'attackformdamagegood', prefix + 'attackformdamagegoodtype',
        prefix + 'attackformdamageamazing', prefix + 'attackformdamageamazingtype'
    ], function(v) {
        const baseMod = (parseInt(v[prefix + 'attackformdie']) || 0) + (parseInt(v[prefix + 'attackformaccuracy']) || 0) + (parseInt(v[prefix + 'attackformsit']) || 0);
        const multiMod = (parseInt(v[prefix + 'attackformmulti']) || 0);
        const mode = v[prefix + 'attackformmode'] || '1';
        
        const dmgOrd = v[prefix + 'attackformdamageordinary'] || '0';
        const dmgOrdT = v[prefix + 'attackformdamageordinarytype'] || '';
        const dmgGoo = v[prefix + 'attackformdamagegood'] || '0';
        const dmgGooT = v[prefix + 'attackformdamagegoodtype'] || '';
        const dmgAma = v[prefix + 'attackformdamageamazing'] || '0';
        const dmgAmaT = v[prefix + 'attackformdamageamazingtype'] || '';
        
        const dmgUnit = `[[${dmgOrd}]]${dmgOrdT}/[[${dmgGoo}]]${dmgGooT}/[[${dmgAma}]]${dmgAmaT}`;
        
        let resultsStr = "";
        let damageStr = "";
        
        if (mode === '1') {
            const total = baseMod + multiMod;
            const step = combatStepMap[String(Math.max(-15, Math.min(15, total)))] || '+0';
            resultsStr = `[[1d20cs<1cf>20 ${step}]]`;
            damageStr = `{{damage= ${dmgUnit}}}`;
            setAttrs({ [prefix + 'attackformstepdie']: step });
        } else if (mode === '2') {
            const step1 = combatStepMap[String(Math.max(-15, Math.min(15, baseMod + multiMod + 1)))] || '+0';
            const step2 = combatStepMap[String(Math.max(-15, Math.min(15, baseMod + multiMod + 2)))] || '+0';
            resultsStr = `Control: [[1d20cs<1cf>20]] | 1st: [[$[[0]] ${step1}]] | 2nd: [[$[[0]] ${step2}]]`;
            damageStr = `{{damage 1= ${dmgUnit}}} {{damage 2= ${dmgUnit}}}`;
        } else if (mode === '3') {
            const step1 = combatStepMap[String(Math.max(-15, Math.min(15, baseMod + multiMod + 1)))] || '+0';
            const step2 = combatStepMap[String(Math.max(-15, Math.min(15, baseMod + multiMod + 2)))] || '+0';
            const step3 = combatStepMap[String(Math.max(-15, Math.min(15, baseMod + multiMod + 3)))] || '+0';
            resultsStr = `Control: [[1d20cs<1cf>20]] | 1st: [[$[[0]] ${step1}]] | 2nd: [[$[[0]] ${step2}]] | 3rd: [[$[[0]] ${step3}]]`;
            damageStr = `{{damage 1= ${dmgUnit}}} {{damage 2= ${dmgUnit}}} {{damage 3= ${dmgUnit}}}`;
        }
        
        const macro = `&{template:default} {{name=@{character_name} - ${v[prefix + 'attackformname']}}} {{score= [[@{attackformscore}]]/[[@{attackformscoregood}]]/[[@{attackformscoreamazing}]]}} {{type= @{attackformtype}}} {{range= @{attackformrange}}} {{notes= @{attackformnotes}}} {{results= ${resultsStr}}} ${damageStr}`;
        setAttrs({ [prefix + 'attackformmacro']: macro });
    });
}

on('change:repeating_attackforms:attackformname change:repeating_attackforms:attackformscore change:repeating_attackforms:attackformtype change:repeating_attackforms:attackformrange change:repeating_attackforms:attackformnotes change:repeating_attackforms:attackformdie change:repeating_attackforms:attackformaccuracy change:repeating_attackforms:attackformsit change:repeating_attackforms:attackformmulti change:repeating_attackforms:attackformmode change:repeating_attackforms:attackformdamageordinary change:repeating_attackforms:attackformdamageordinarytype change:repeating_attackforms:attackformdamagegood change:repeating_attackforms:attackformdamagegoodtype change:repeating_attackforms:attackformdamageamazing change:repeating_attackforms:attackformdamageamazingtype', function(eventInfo) {
    const rowMatch = eventInfo.sourceAttribute.match(/repeating_attackforms_([-\w]+)_/);
    if (rowMatch) updateAttackForm(rowMatch[1]);
});

on('change:repeating_attackforms sheet:opened', function() {
    getSectionIDs('repeating_attackforms', function(idarray) {
        idarray.forEach(rowId => updateAttackForm(rowId));
    });
});
