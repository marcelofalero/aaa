
</div>

<script type="text/worker">
    /* Alternity Combat Step Logic — extended range -15 to +15 */
    const stepMap = {
        '-15': '-11d20cs<0cf<0',
        '-14': '-10d20cs<0cf<0',
        '-13': '-9d20cs<0cf<0',
        '-12': '-8d20cs<0cf<0',
        '-11': '-7d20cs<0cf<0',
        '-10': '-6d20cs<0cf<0',
        '-9':  '-5d20cs<0cf<0',
        '-8':  '-4d20cs<0cf<0',
        '-7':  '-3d20cs<0cf<0',
        '-6':  '-2d20cs<0cf<0',
        '-5':  '-1d20cs<0cf<0',
        '-4':  '-1d12cs<0cf<0',
        '-3':  '-1d8cs<0cf<0',
        '-2':  '-1d6cs<0cf<0',
        '-1':  '-1d4cs<0cf<0',
        '0':   '+0',
        '1':   '+1d4cs<0cf<0',
        '2':   '+1d6cs<0cf<0',
        '3':   '+1d8cs<0cf<0',
        '4':   '+1d12cs<0cf<0',
        '5':   '+1d20cs<0cf<0',
        '6':   '+2d20cs<0cf<0',
        '7':   '+3d20cs<0cf<0',
        '8':   '+4d20cs<0cf<0',
        '9':   '+5d20cs<0cf<0',
        '10':  '+6d20cs<0cf<0',
        '11':  '+7d20cs<0cf<0',
        '12':  '+8d20cs<0cf<0',
        '13':  '+9d20cs<0cf<0',
        '14':  '+10d20cs<0cf<0',
        '15':  '+11d20cs<0cf<0'
    };

    function calcStepDie(die, acc, sit) {
        let total = (parseInt(die) || 0) + (parseInt(acc) || 0) + (parseInt(sit) || 0);
        let warning = '';
        if (total < -15) warning = 'MIN (-15)';
        if (total > 15)  warning = 'MAX (+15)';
        
        let clamped = Math.max(-15, Math.min(15, total));
        let step = stepMap[String(clamped)] || '+0';
        
        return { step, warning };
    }

    /* --- Fixed Unarmed row --- */
    on('change:formunarmeddie change:formunarmedaccuracy change:formunarmedsit', () => {
        getAttrs(['formunarmeddie', 'formunarmedaccuracy', 'formunarmedsit'], (v) => {
            const result = calcStepDie(v.formunarmeddie, v.formunarmedaccuracy, v.formunarmedsit);
            setAttrs({ 
                formunarmed_step_die: result.step,
                formunarmed_warning: result.warning
            });
        });
    });

    /* --- Repeating attack form rows (row-scoped via sourceAttribute) --- */
    on('change:repeating_attackforms:attackformdie change:repeating_attackforms:attackformaccuracy change:repeating_attackforms:attackformsit', function(eventInfo) {
        const rowMatch = eventInfo.sourceAttribute.match(/repeating_attackforms_([-\w]+)_/);
        if (!rowMatch) return;
        const rowId = rowMatch[1];
        const prefix = 'repeating_attackforms_' + rowId + '_';
        getAttrs([prefix + 'attackformdie', prefix + 'attackformaccuracy', prefix + 'attackformsit'], function(v) {
            const result = calcStepDie(v[prefix + 'attackformdie'], v[prefix + 'attackformaccuracy'], v[prefix + 'attackformsit']);
            setAttrs({ 
                [prefix + 'attackform_step_die']: result.step,
                [prefix + 'attackform_warning']: result.warning
            });
        });
    });

    /* --- Equipment weight --- */
</script>
