		<div class="sheet-section-customskills">
			<div class="sheet-fullwidth">
				<div class="sheet-row">
				<div class="sheet-col sheet-skilltitle" style="width:185px;">Skill Name</div>
				<div class="sheet-col sheet-skilltitle" style="width:110px;">Ability</div>
				<div class="sheet-col sheet-skilltitle" style="width:65px;">Broadskill</div>
				<div class="sheet-col sheet-skilltitle" style="width:40px;">Rank</div>
				<div class="sheet-col sheet-skilltitle" style="width:90px;">Score</div>
			</div>
			<fieldset class="repeating_customskills">
				<div class="sheet-row">
					<div class="sheet-col" style="width:185px;"><button type="roll" name="roll_CustomSkill"
							value="&{template:default} {{name= @{character_name} - @{SkillName}}} {{score= [[@{SkillO}]]/[[@{SkillG}]]/[[@{SkillA}]]}} {{results= [[?{Situation Modifier|None, 1d20cs<1cf>20|-5 Steps (-d20), 1d20cs<1cf>20-1d20cs<0cf<0|-4 Steps (-d12), 1d20cs<1cf>20-1d12cs<0cf<0|-3 Steps (-d8), 1d20cs<1cf>20-1d8cs<0cf<0|-2 Steps (-d6), 1d20cs<1cf>20-1d6cs<0cf<0|-1 Steps (-d4), 1d20cs<1cf>20-1d4cs<0cf<0|+1 Steps (+d4), 1d20cs<1cf>20+1d4cs<0cf<0|+2 Steps (+d6), 1d20cs<1cf>20+1d6cs<0cf<0|+3 Steps (+d8), 1d20cs<1cf>20+1d8cs<0cf<0|+4 Steps (+d12), 1d20cs<1cf>20+1d12cs<0cf<0|+5 Steps (+d20), 1d20cs<1cf>20+1d20cs<0cf<0|+6 Steps (+2d20), 1d20cs<1cf>20+2d20cs<0cf<0|+7 Steps (+3d20), 1d20cs<1cf>20+3d20cs<0cf<0}]]}} "></button><input
							type="text" name="attr_SkillName" placeholder="Enter Skill"></div>
					<div class="sheet-col" style="height: 2em;">
						<select name="attr_SkillAbility" class="sheet-range">
							<option value="@{Strength}">Strength</option>
							<option value="@{Dexterity}">Dexterity</option>
							<option value="@{Constitution}">Constitution</option>
							<option value="@{Intelligence}">Intelligence</option>
							<option value="@{Will}">Will</option>
							<option value="@{Personality}">Personality</option>
						</select>
					</div>
					<div class="sheet-col" style="width:65px;"><input type="checkbox" name="attr_broadskillknown"
							value="1">Known?</input></div>
					<div class="sheet-col" style="width:40px;"><input type="number" name="attr_SkillRank"
							class="sheet-score" value="0"></div>
					<div class="sheet-col" style="width:90px;"><input type="text" name="attr_SkillO"
							class="sheet-scoredisabled" disabled="true"
							value="(floor((@{SkillRank}*@{broadskillknown}+@{SkillAbility})/(2-@{broadskillknown})))">/<input
							type="text" name="attr_SkillG" class="sheet-scoredisabled" disabled="true"
							value="(floor(@{SkillO}/2))">/<input type="text" name="attr_SkillA"
							class="sheet-scoredisabled" disabled="true" value="(floor(@{SkillO}/4))"></div>
				</div>
			</fieldset>
			<div class="sheet-row">Notes: </div>
			<div class="sheet-row">Broadskill column is to indicate if the broadskill has been learned.</div>
			<div class="sheet-row">Leave rank 0 if the custom skill is a broadskill.</div>
		</div>
		</div>
