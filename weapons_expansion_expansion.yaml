items:
- name: HeadBuster Power Cestus
  pl: '7'
  mass: 2 kg
  cost: $625
  avail: Controlled
  description:
    en: 'The HeadBuster is a powerful power cestus designed for close-quarters combat.
      It offers 4 actions per round, with variable mass head accuracy at range. Skill:
      Unarmed Attack - braw! The wielder can choose to use either his Melee Weapons
      or Unarmed Attack skill when attacking with the HeadBuster.'
    es: 'El HeadBuster es un cestus de fuerza desarrollado para la lucha cercana.
      Ofrece 4 acciones por ronda, con una precisión variable en el cabello a distancia.
      Habilidad: Atacar Sin Arma - Braw! El portador puede elegir usar su arma Melee
      o su habilidad de Atacar sin arma al atacar con el HeadBuster.'
  name_es: Destello de Caballero Puño Cestus
- name: Charge Pistol
  pl: '7'
  mass: 1 kg
  cost: '$500 or #500'
  avail: Common
  description:
    en: The charge pistol is a sturdy, reliable and cheap weapon compared to advanced
      personal weapons. It's popular in many regions.
    es: El arma de batea es una arma robusta, fiable y barata comparada con las armas
      personales avanzadas. Es popular en muchas regiones.
  name_es: Pistola de Carga
- name: ARZ Autorifle
  pl: '7'
  mass: 2.25 kg
  cost: $1,750
  avail: Military
  description:
    en: A lightweight weapon with a high rate of fire intended for assault or support
      roles. The ARZ is one of the most popular designs; originally produced by Karadnya-Brusilev
      of Nariac, it's now manufactured under license in the Thuldan Empire and the
      Solar Unian.
    es: Un arma ligera con un alto índice de tiro diseñada para roles de asalto o
      soporte. El ARZ es uno de los diseños más populares; originalmente desarrollado
      por Karadnya-Brusilev de Nariac, ahora está fabricado bajo licencia en la Empresa
      Solar Uniana y la República de Thuldan.
  name_es: Escopeta ARZ Autorifle
- name: Sabot Rifle
  pl: '7'
  mass: 4 kg
  cost: '#4500'
  avail: Military
  description:
    en: A powerful and hefty weapon designed for demolishing vehicles and the best
      personal armor. Its great slug can make deep impacts on anything. Despite its
      inability to precision, it offers a long-range stoppage force, being a powerful
      but weak weapon.
    es: Una arma poderosa y pesada diseñada para demolir vehículos y la mejor armadura
      personal. Su gran slug puede hacer impactos profundos en cualquier cosa. Aunque
      su falta de precisión le proporciona una fuerza de parada a larga distancia,
      es un arma poderosa pero débil.
  name_es: Rifle de Botín
- name: Laser RIFLE
  pl: '19'
  mass: 4 kg
  cost: '#1,800'
  avail: Military
  description:
    en: The CLR-19 Laser RIFLE from AM. Industries has a mass of 4 kg and is available
      for military use. The payload is coherent light with an accuracy of -1. It has
      3 actions in mode F, the type/firepower is En/0, damage is d6+1w/d6+3w/d4+1m,
      range is 75 cm (20/40/150 meters at PL 19), a hide of none, a clip/charge size
      of 12 shots and a clip/charge cost of $75. The skill required to use it is Modern
      Hanged Weapons-pistol.
    es: El CLR-19 Rifle Láser de AM. Industries tiene una masa de 4 kg y está disponible
      para la milicia. La carga es luz coherente con una precisión de -1. Tiene 3
      acciones en modo F, el tipo/fuerza es En/0, el daño es d6+1w/d6+3w/d4+1m, el
      rango es 75 cm (20/40/150 metros a PL 19), un mástil de ninguno, un tamaño del
      clip/cargue de 12 balas y un coste del clip/cargue de $75. Se requiere el habilidad
      para usarlo es Armas Adheridas Modernas-pistola.
  name_es: Rifle de Láser
- name: CLR-19 Laser RIFLE
  pl: '7'
  mass: 4 kg
  cost: '#1,800'
  avail: Military
  description:
    en: 'The CLR-19 Laser Rifle from AM. Industries is a popular weapon for self-defense.
      It weighs 4kg and costs $1,800. The payload is coherent light, accuracy is -1,
      actions are 3, mode is F, type/firepower is En/0, damage is d6+1w/d6+3w/d4+1m,
      range is 100/600/1500 meters, clip/charge size is 12 shots and the clip/charge
      cost is $75. Skill: Modern Hanged Weapons—rifle'
    es: 'El arma CLR-19 Laser Rifle de AM Industries es un arma popular para la defensa
      personal. Pesa 4kg y cuesta $1,800. La carga es luz coherente, la precisión
      es -1, las acciones son 3, el modo es F, el tipo/fuerza de fuego es En/0, el
      daño es d6+1w/d6+3w/d4+1m, el rango es 100/600/1500 metros, el tamaño de la
      batería/carga es 12 balas y el coste por recargar es $75. Habilidad: Armas de
      cuerpo a cuerpo moderno'
  name_es: ARMA DE FUERZA LASER CLR-19
- name: ThunderCorp Arms
  pl: 7
  mass: 3 kg
  cost: '#1,000'
  avail: Controlled
  description:
    en: A compact Submachine Gun (SMG) with a high cyclic rate of fire. Intended for
      use in close-quarters riot control or police raid situations.
    es: Un subfusil compacto (SMG) con una tasa de disparos cíclica alta. Está diseñado
      para su uso en situaciones de control de la rueda o las carreras policiales
      cerca del lugar.
  name_es: Armas ThunderCorp
- name: ARCHE LX REFLEX Bow
  pl: '7'
  mass: 1 kg
  cost: $650
  avail: Comman
  description:
    en: The ARCHE LX REFLEX Bow is a silent and stealthy bow that deals damage in
      various ways. It carries a Razor-tipped arrow as its payload, making it formidable
      at close range. However, the bow's disadvantage lies in the rate of fire (after
      each 'shot', the user must waste an action to reload another arrow) and its
      size.
    es: El ARCHE LX REFLEX Bow es una arco silencioso y de caza que inflige daño de
      diversas formas. Lleva un flecha con puntizquierda como su carga útil, lo cual
      la hace potente a corta distancia. Sin embargo, el déficit del arco se produce
      en la tasa de disparo (después de cada 'disparo', el usuario debe perder una
      acción para recargar otra flecha) y su tamaño.
  name_es: Arco ARCELIX Reflejos
- name: Incendiary stream
  pl: '7'
  mass: 8.5 kg
  cost: $2,400
  avail: Military
  description:
    en: The Incandescent Firestream is a potent incandescent fire bomb that expels
      an autonomous slug of wax-powder at the target. It boasts superior accuracy
      compared to close range and inflicts unbearable wounds.
    es: El Flujo Inflamable es una bomba de fuego incandescente potente que expulsa
      un frasco de aceite de vidrio autónomo al objetivo. Tiene una precisión superior
      a la cercana y inflige heridas terribles.
  name_es: Corriente ardiente
- name: HAK-59 Quantum Minigun
  pl: '7'
  mass: 2 kg
  cost: '#300'
  avail: Military
  description:
    en: Also known as a particle gun or neutron gun, the quantum minigun produces
      beams of heavy, fast-moving subatomic particles that slag anything they hit.
      The minigun doesn’t have the armor penetration capability of other heavy weapons,
      but its high rate of fire and high damage potential merit respect.
    es: También conocido como arma de partículas o escáner neuronal, el minigún cuántico
      produce ondas de partículas pesadas y fuertes que atraviesan a cualquier cosa
      que impacten. El minigün no tiene la capacidad de penetración de armadura de
      otros armas pesadas, pero su alto índice de tasa de disparo y potencial de daño
      meritos su respeto.
  name_es: Hak-59 Cuchillo Mínigráfico Cuántico
- name: ANTIPERSONNEL ROCKET
  pl: '7'
  mass: 3 kg
  cost: $500
  avail: Military
  description:
    en: 'AVAILABILITY/COST: MILITARY/$500 MASS/WEIGHT: 3 KG/LENGTH: B5 CM PAYLOAD:
      NEUTRON RADIATION TYPE/FIREPOWER: EN/0 DAMAGE: D6W/D6+2W/D8+2W AREA OF EFFECT:
      4M/8M/12M DESIGNED TO KNOCK OUT PERSONNEL WITHOUT DAMAGING VITAL EQUIPMENT,
      THE ANTIPERSONNEL ROCKET DELIVERS A DEADLY BLAST OF NEUTRON RADIATION ON DETONATION.
      LIKE THE ANTI-AIR ROCKET, IT''S AN AREA-EFFECT WEAPON.'
    es: 'DISPONIBILIDAD/COSTO: MILITARIO/$500 PESO MASSE/LONGITUD: 3 KG/B5 CM CARGUE:
      RADIACCIÓN NÚCLEO TIPO/FUERZA: EN/0 DANIO: D6W/D6+2W/D8+2W AREA DE EFECTO: 4M/8M/12M
      SE ESTÁ PROGRAMADO PARA QUEBRAR PERSONAL SIN DAÑAR EL EQUIPO PRIMARIO, EL ROCKET
      ANTIPERSONNEL LE LANZA UNA BLASTA DE RADIACCIÓN NÚCLEO MUY CORTA EN LA EXPLOSIÓN.
      COMO EL ROCKET OTRORREPULSOR, ES UN ARMA DE AREA.'
  name_es: Lanzador de Personas Antipersonal
- name: FaLcoN X GUIDANCE SYSTEM
  pl: '7'
  mass: 0.1 kg/15 cm
  cost: $1,250
  avail: Military
  description:
    en: The FALCONÑ X unit is a laser power designator. Disarming the weapon takes
      two actions - one to set up and another for skill test.
    es: La unidad FALCONÑ X está diseñada para dispositivo láser bajo potencia. Desarmar
      la arma consume dos acciones - una para establecer el disparo y otra para realizar
      la prueba de habilidades.
  name_es: SISTEMA DE DIRECCIÓN FALCOX
