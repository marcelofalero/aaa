{{ define "main" }}
<article class="cf ph3 ph5-l pv3 pv4-l f4 tc-l center measure-wide lh-copy nested-links mid-gray">
    <h1 class="f1 athelas mt3 mb1 tc">Table of Contents</h1>
    <div class="tl mw8 center">
        {{ range .Site.Sections.ByWeight }}
        <section class="mt4">
            <h2 class="f3 b bb b--light-gray pb2"><a href="{{ .RelPermalink }}" class="link black hover-blue">{{ .Title }}</a></h2>
            <ul class="list pl0">
                {{ range .Pages.ByWeight }}
                <li class="pv2 ml3">
                    <a href="{{ .RelPermalink }}" class="link blue hover-dark-blue f4">{{ .Title }}</a>
                    {{ with .Description }}
                    <p class="f6 i mt1 dark-gray">{{ . }}</p>
                    {{ end }}
                </li>
                {{ end }}
            </ul>
        </section>
        {{ end }}
    </div>
</article>
{{ end }}
