<nav class="breadcrumbs" aria-label="breadcrumb">
  <ul id="history-breadcrumbs-list">
    <!-- JS will populate this -->
  </ul>
</nav>

<script>
  (function () {
    const list = document.getElementById('history-breadcrumbs-list');
    if (!list) return;

    try {
      let history = [];
      try {
        history = JSON.parse(sessionStorage.getItem('pageHistory')) || [];
      } catch (e) {
        console.error("Error parsing history from sessionStorage", e);
      }

      const currentLang = "{{ .Site.Language.Lang }}";
      const currentUrl = "{{ .RelPermalink }}";
      // Create a map of all pages on the site, keyed by their TranslationKey
      const translationsMap = {
        {{ range .Site.Pages }}
          "{{ .TranslationKey }}": {
            {{ range .AllTranslations }}
              "{{ .Language.Lang }}": {
                "url": "{{ .RelPermalink }}",
                "title": "{{ .Title }}"
              },
            {{ end }}
          },
        {{ end }}
      };

      const fragment = document.createDocumentFragment();
      const reversedHistory = [...history].reverse();

      reversedHistory.forEach((page, index) => {
        if (index > 0) {
          const sep = document.createElement('li');
          sep.className = "separator";
          sep.innerHTML = '‹';
          fragment.appendChild(sep);
        }

        const li = document.createElement('li');
        const pageData = translationsMap[page.id];

        let targetUrl = "#"; // Default to a safe link
        let targetTitle = page.title; // Use stored title as a fallback

        if (pageData && pageData[currentLang]) {
          targetUrl = pageData[currentLang].url;
          targetTitle = pageData[currentLang].title;
        }

        if (targetUrl === currentUrl && index === 0) {
          li.className = "current-page";
          li.textContent = targetTitle;
        } else {
          const a = document.createElement('a');
          a.href = targetUrl;
          a.textContent = targetTitle;
          li.appendChild(a);
        }
        fragment.appendChild(li);
      });

      list.appendChild(fragment);
    } catch (e) {
      console.error("Breadcrumb rendering error:", e);
    }
  })();
</script>
