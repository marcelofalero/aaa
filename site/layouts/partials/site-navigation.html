<nav class="ph3 ph4-ns w-100 relative" role="navigation" style="min-height: 90px; padding-top: 5px;">
  <div class="nav-flex-container ph2 relative" style="padding-top: 0; padding-bottom: 5px;">
    <div class="flex items-center">
      <a href="{{ .Site.Home.RelPermalink }}" class="f3 fw2 hover-neon-cyan neon-text db no-underline athelas mr4"
        style="line-height: 1.1;">
        {{ with .Site.Params.site_logo }}
        <img src="{{ urls.RelURL . }}" class="w100 mw5-ns" alt="{{ $.Site.Title }}" />
        {{ else }}
        <div class="neon-text-glitch" data-text="Alterated" style="font-size: 0.75rem; line-height: 1;">Alterated</div>
        <div class="neon-text-glitch" data-text="Alternity" style="margin-left: 1rem; font-size: 0.9rem; line-height: 1;">Alternity</div>
        <div class="neon-text-glitch" data-text="Alternative" style="margin-left: 2rem; font-size: 0.9rem; line-height: 1;">Alternative</div>
        {{ end }}
      </a>

      {{ if .Site.Menus.main }}
      <ul class="list pl0 mv0 flex flex-wrap mr3 items-center">
        {{ range .Site.Menus.main }}
        <li class="ml3 f6 fw4">
          <a class="hover-neon-cyan silver no-underline flex items-center transition-all ttu tracked" href="{{ .URL }}"
            title="{{ lang.Translate " pageTitle" . }}">
            {{ .Name }}
          </a>
        </li>
        {{ end }}
      </ul>
      {{ end }}
    </div>

    <!-- Search Input -->
    <div class="search-container-fixed">
      <div class="search-input-inner relative flex items-center">
        <div class="search-input-wrapper relative w-100">
          <span class="absolute left-0 top-0 flex items-center h-100 pl3 pointer-events-none">
            <svg style="width: 0.9rem; height: 0.9rem;" class="neon-cyan o-70" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
            </svg>
          </span>
          <input type="text" id="search-input" placeholder="{{ if eq .Page.Lang "es" }}BUSCAR...{{ else }}SEARCH...{{ end }}" 
                 class="search-input bg-black-60 neon-border-cyan silver f7 ph5 pv1 w-100 outline-0 transition-all focus-neon-glow br-pill"
                 autocomplete="off" style="font-size: 0.7rem; height: 2rem;">
          <kbd class="absolute right-0 top-0 flex items-center h-100 pr3 pointer-events-none silver f7 o-20 dn db-l" style="font-family: monospace;">
            /
          </kbd>
        </div>
        <div id="search-results" class="absolute top-100 right-0 w-100 mt2 z-max hidden overflow-y-auto br2 shadow-5" style="max-height: 300px; min-width: 350px;">
          <!-- Results will be injected here -->
        </div>
      </div>
    </div>
  </div>
</nav>
