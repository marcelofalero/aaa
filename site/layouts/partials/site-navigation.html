<nav class="pv3 ph3 ph4-ns w-100 relative" role="navigation">
  <div class="flex center items-center justify-between w-100">
    <div class="flex items-center">
      <a href="{{ .Site.Home.RelPermalink }}" class="f3 fw2 hover-neon-cyan neon-text db no-underline athelas mr4"
        style="line-height: 1.3;">
        {{ with .Site.Params.site_logo }}
        <img src="{{ urls.RelURL . }}" class="w100 mw5-ns" alt="{{ $.Site.Title }}" />
        {{ else }}
        <div class="neon-text-glitch" data-text="Alterated">Alterated</div>
        <div class="neon-text-glitch" data-text="Alternity" style="margin-left: 2rem;">Alternity</div>
        <div class="neon-text-glitch" data-text="Alternative" style="margin-left: 4rem;">Alternative</div>
        {{ end }}
      </a>
    </div>

      {{ if .Site.Menus.main }}
      <ul class="list pl0 mv0 flex flex-wrap mr3 items-center">
        {{ range .Site.Menus.main }}
        <li class="ml3 f5 fw4">
          <a class="hover-neon-cyan silver no-underline flex items-center transition-all" href="{{ .URL }}"
            title="{{ lang.Translate " pageTitle" . }}">
            {{ .Name }}
          </a>
        </li>
        {{ end }}
      </ul>
      {{ end }}

      <!-- Search Input -->
      <div class="relative flex items-center search-container" style="min-width: 250px;">
        <input type="text" id="search-input" placeholder="Search library..." 
               class="bg-transparent neon-border-cyan silver f5 ph3 pv2 w-100 outline-0 transition-all focus-neon-glow"
               autocomplete="off">
        <div id="search-results" class="absolute top-100 left-0 w-100 mt2 bg-black-90 neon-border-cyan z-max hidden overflow-y-auto" style="max-height: 400px;">
          <!-- Results will be injected here -->
        </div>
      </div>
  </div>
</nav>
