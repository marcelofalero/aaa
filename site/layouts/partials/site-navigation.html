<nav class="pv3 ph3 ph4-ns" role="navigation">
  <div class="flex center items-center justify-between">
    <div class="flex items-center">
      <a href="{{ .Site.Home.RelPermalink }}" class="f3 fw2 hover-neon-cyan neon-text dib no-underline athelas mr4">
        {{ with .Site.Params.site_logo }}
          <img src="{{ urls.RelURL . }}" class="w100 mw5-ns" alt="{{ $.Site.Title }}" />
        {{ else }}
          {{ .Site.Title }}{{ if not .IsHome }} - {{ .Title }}{{ end }}
        {{ end }}
      </a>
    </div>

    <div class="flex items-center">
       {{ if .Site.Menus.main }}
         <ul class="list pl0 mv0 flex flex-wrap">
           {{ range .Site.Menus.main }}
           <li class="ml3 f5 fw4">
             <a class="hover-neon-cyan silver no-underline flex items-center transition-all" href="{{ .URL }}" title="{{ lang.Translate "pageTitle" . }}">
               {{ .Name }}
             </a>
           </li>
           {{ end }}
         </ul>
       {{ end }}
       {{ partial "i18nlist.html" . }}
    </div>
  </div>
</nav>
