<script>
  (function () {
    try {
      const currentPage = {
        // Use TranslationKey as the unique, language-independent identifier
        id: "{{ .TranslationKey }}",
        // Store the title for immediate display, it will be replaced if language changes
        title: "{{ if .IsHome }}Index{{ else }}{{ .Title }}{{ end }}"
      };

      let history = [];
      try {
        history = JSON.parse(sessionStorage.getItem('pageHistory')) || [];
      } catch (e) {
        console.error("Error parsing history from sessionStorage", e);
        history = [];
      }

      // Remove any previous entry for this page using the unique ID
      history = history.filter(page => page.id !== currentPage.id);

      // Add current page to the end
      history.push(currentPage);

      if (history.length > 20) {
        history.shift();
      }

      sessionStorage.setItem('pageHistory', JSON.stringify(history));
    } catch (e) {
      console.error("History tracking error:", e);
    }
  })();
</script>

<script src="/js/table-toggle.js?v={{ now.Unix }}"></script>
