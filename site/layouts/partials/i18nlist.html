{{ if .IsTranslated }}
<div class="flex items-center ml3">
  <span class="f6 neon-purple ttu tracked mr2">{{ lang.Translate "translations" }}:</span>
  <ul class="list pl0 mv0 flex">
    {{ range .Translations }}
    <li class="list f6 fw4 dib ml2">
        <a class="hover-neon-cyan silver no-underline ttu transition-all" href="{{ .RelPermalink }}">{{ .Lang }}</a>
    </li>
    {{ end}}
  </ul>
</div>
{{ end }}
