<div class="table-wrapper">
  <table>
    {{- if .THead }}
      <thead>
        {{- range .THead }}
          <tr>
            {{- range . }}
              <th{{ if .Align }} style="text-align: {{ .Align }}"{{ end }}>
                {{ .Text | safeHTML }}
              </th>
            {{- end }}
          </tr>
        {{- end }}
      </thead>
    {{- end }}
    <tbody>
      {{- range .TBody }}
        <tr>
          {{- range . }}
            <td{{ if .Align }} style="text-align: {{ .Align }}"{{ end }}>
              {{ .Text | safeHTML }}
            </td>
          {{- end }}
        </tr>
      {{- end }}
    </tbody>
  </table>
</div>
