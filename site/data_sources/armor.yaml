      PL 8 - Energy Age:
      - name: Ablative harness
        mass: '2'
        ap: '0'
        lhe: see description
        type: O
        hide: '+3'
        avail: Mil
        cost: '5000'
        description:
          en: "The ablative harness makes use of a field of quantum particles that respond to force or energy by spontaneously transforming into semitangible virtual matter. The harness provides 50 points of protective energy when fully charged. Every point of mortal damage reduces the field by 3 points; every point of wound damage reduces the field by 2 points; and every point of stun damage reduces the field by 1 point. Recharging requires 1 hour per 10 points of field energy. It can be worn with other protection, except body tanks, powered attack armor, deflection harnesses, or any other PL 8 armor."
          es: "El arnés ablativo utiliza un campo de partículas cuánticas que responden a la fuerza o la energía transformándose espontáneamente en materia virtual semitangible. El arnés proporciona 50 puntos de energía protectora cuando está completamente cargado. Cada punto de daño mortal reduce el campo en 3 puntos; cada punto de daño de herida lo reduce en 2 puntos; y cada punto de daño de aturdimiento lo reduce en 1 punto. La recarga requiere 1 hora por cada 10 puntos de energía de campo. Puede usarse con otra protección, excepto tanques de cuerpo, armaduras de ataque motorizadas, arneses de deflexión o cualquier otra armadura de PL 8."
        name_es: Arnés ablativo
      - name: Body tank, over.
        mass: '40'
        ap: '+5'
        lhe: 2d6+1/2d6+1/2d6
        type: G
        hide: '-'
        avail: Res
        cost: '70000'
        description:
          en: "The overland body tank represents the highest achievement in heavy powered armor. It has all the features of a zero-g body tank with higher protection values, but retains a light and streamlined look. It adds a flight-capable, gravity-based engine, allowing its user to soar meters over the ground at up to 100 kilometers per hour for as long as 8 hours."
          es: "El tanque de cuerpo terrestre representa el mayor logro en armaduras motorizadas pesadas. Tiene todas las características de un tanque de cuerpo de gravedad cero con mayores valores de protección, pero mantiene un aspecto ligero y aerodinámico. Añade un motor basado en gravedad con capacidad de vuelo, lo que permite al usuario elevarse sobre el suelo hasta a 100 kilómetros por hora durante 8 horas."
        name_es: Tanque de cuerpo terrestre
      - name: Displacer softsuit
        mass: '3'
        ap: '0'
        lhe: see description
        type: O
        hide: '+4'
        avail: Res
        cost: '7500'
        description:
          en: "This is a CF softsuit with gravitonic circuitry that makes the image of the user appear to blur and shift. This provides protection from weapons that require a direct target, but not against blast radius weapons. It provides a +3 step increase to the wearer's Strength and Dexterity resistance modifiers. After 10 rounds, the charge cell must be replaced (extra cells cost $100). Cannot be used with other armor."
          es: "Este es un softsuit de CF con circuitería gravitónica que hace que la imagen del usuario se vea borrosa y se desplace. Esto proporciona protección contra armas que requieren un objetivo directo, pero no contra armas de área de efecto. Proporciona un aumento de +3 pasos a los modificadores de resistencia de Fuerza y Destreza del portador. Después de 10 asaltos, la batería debe ser reemplazada (las baterías adicionales cuestan $100). No se puede usar con otra armadura."
        name_es: Softsuit desplazador
      - name: Energy web
        mass: '2'
        ap: '0'
        lhe: d6-1/d6-1/d6+2
        type: O
        hide: '+3'
        avail: Mil
        cost: '4000'
        description:
          en: "The energy web is a CF softsuit with an interwoven energy dispersement web. While largely ineffective against physical attacks, it provides excellent protection from energy weapons by dispersing the energy and directing it harmlessly away. It doesn't require a power source, acting like a lightning rod to ground and disperse energy. It cannot be used with other armor."
          es: "La red de energía es un softsuit de CF con una red de dispersión de energía entrelazada. Aunque es en gran medida ineficaz contra ataques físicos, proporciona una excelente protección contra armas de energía al dispersar la energía y dirigirla de forma inofensiva. No requiere una fuente de alimentación, actuando como un pararrayos para conectar a tierra y dispersar la energía. No se puede usar con otra armadura."
        name_es: Red de energía
      - name: Stealth softsuit
        mass: '2'
        ap: '0'
        lhe: see description
        type: O
        hide: '+4'
        avail: Res
        cost: '10000'
        description:
          en: "The stealth softsuit renders its wearer almost invisible. Observers suffer a +3 penalty to spot the user. If noticed, the wearer still receives a +1 resistance modifier increase on attacks directed against them. The charge cell lasts for 2 hours (extra cells cost $100). The suit must be near the body and exposed to operate, so it cannot be used with other armor."
          es: "El softsuit de sigilo vuelve al portador casi invisible. Los observadores sufren una penalización de +3 para detectar al usuario. Si es detectado, el portador todavía recibe un aumento de +1 en su modificador de resistencia contra ataques dirigidos a él. La batería dura 2 horas (las baterías adicionales cuestan $100). El traje debe estar cerca del cuerpo y expuesto para funcionar, por lo que no se puede usar con otra armadura."
        name_es: Softsuit de sigilo
