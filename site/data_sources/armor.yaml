categories:
  all:
    groups:
      PL 0 - Stone Age:
      - name: Hide armor
        mass: '10'
        ap: '+1'
        lhe: d6-3/d4-3/d6-4
        type: O
        hide: '-'
        avail: Any
        cost: '100'
        description:
          en: This armor utilizes the furs and skins of animals, which are stitched
            or fastened together to roughly fit the body of the individual wearing
            it. The protection it provides is minimal, and its use during the era
            is uncommon. This category also includes weaves of thick vegetation made
            into protective garments.
          es: Esta armadura utiliza pieles de animales, que se cosen o sujetan para
            ajustarse aproximadamente al cuerpo del individuo que la lleva. La protección
            que proporciona es mínima y su uso durante esta era es poco común. Esta
            categoría también incluye tejidos de vegetación espesa confeccionados como
            prendas protectoras.
        name_es: Armadura de piel
      PL 1 - Bronze/Iron Age:
      - name: Leather armor
        mass: '7'
        ap: '+1'
        lhe: d6-2/d6-4/d6-4
        type: O
        hide: '+2'
        avail: Any
        cost: '350'
        description:
          en: This protection is easy to craft and maintain, and does a decent job of protecting the wearer from the weapons of the day.
          es: Esta protección es fácil de fabricar y mantener, y hace un trabajo decente protegiendo al portador de las armas de la época.
        name_es: Armadura de cuero
      - name: Helm
        mass: '4'
        ap: '+1'
        lhe: +1/0/0
        type: O
        hide: '-'
        avail: Com
        cost: '200'
        description:
          en: "The center of the sensory organs is treated to extra protection. A helm can't be used with other armor if the armor contains an integral helmet or hood. The Gamemaster can determine that a helm's protection isn't significant in some situations, especially if it is the only armor being worn."
          es: "El centro de los órganos sensoriales recibe protección adicional. Un yelmo no puede usarse con otra armadura si la armadura contiene un casco o capucha integral. El Gamemaster puede determinar que la protección del yelmo no es significativa en algunas situaciones, especialmente si es la única armadura que se lleva."
        name_es: Yelmo
      - name: Shield, small
        mass: '4'
        ap: '0'
        lhe: +1/0/0
        type: O
        hide: '+1'
        avail: Any
        cost: '75'
        description:
          en: A small shield is usually round, about a half-meter in diameter, and worn on the forearm of the secondary hand.
          es: Un escudo pequeño suele ser redondo, de unos 50 cm de diámetro, y se lleva en el antebrazo de la mano secundaria.
        name_es: Escudo pequeño
      PL 2 - Middle Ages:
      - name: Chain mail
        mass: '15'
        ap: '+1'
        lhe: d6-1/d6-4/d6-4
        type: O
        hide: '+1'
        avail: Com
        cost: '750'
        description:
          en: Various types of laminated, scale, brigandine, splint, and banded armor fall under the broad category of chain mail. Formed by linking or sewing metal rings to a plain leather backing, chain mail provides excellent protection against slashing (low impact) attacks. The chain mail suit includes a coif to protect the head.
          es: Varios tipos de armaduras laminadas, de escamas, bergandinas y de tablillas entran en la categoría general de cota de malla. Formada por eslabones o cosiendo anillos de metal a un respaldo de cuero, la cota de malla proporciona una excelente protección contra ataques de tajo (bajo impacto). El traje de cota de malla incluye una cofia para proteger la cabeza.
        name_es: Cota de malla
      - name: Plate, full
        mass: '25'
        ap: '+3'
        lhe: d6+1/d6-3/d6-3
        type: O
        hide: '-'
        avail: Con
        cost: '2000'
        description:
          en: Full plate mail is made from shaped and fitted metal plates riveted and interlocked in such a way as to cover the entire body. Gauntlets, boots, and a visored helmet are included, as well as a layer of thick padding under the armor.
          es: La armadura de placas completa está hecha de placas de metal moldeadas y ajustadas, remachadas y entrelazadas de tal manera que cubren todo el cuerpo. Se incluyen guanteletes, botas y un casco con visera, así como una capa de acolchado grueso debajo de la armadura.
        name_es: Armadura de placas
      - name: Plate, partial
        mass: '20'
        ap: '+2'
        lhe: d6/d8-5/d6-4
        type: O
        hide: '+1'
        avail: Com
        cost: '1000'
        description:
          en: This armor combines a metal breastplate with either chain or brigandine armor. A few metal plates protect vital parts of the body, but not as many are used as in full plate armor.
          es: Esta armadura combina un peto de metal con armadura de malla o bergandina. Unas pocas placas de metal protegen las partes vitales del cuerpo, pero no se usan tantas como en la armadura de placas completa.
        name_es: Placas parciales
      - name: Shield, medium
        mass: '7'
        ap: '0'
        lhe: +2/+1/0
        type: O
        hide: '-'
        avail: Any
        cost: '300'
        description:
          en: A medium shield is heavier than a small shield, and is usually a meter or more in diameter. It can be round or square, though most looked like rounded triangles.
          es: Un escudo mediano es más pesado que uno pequeño y suele tener un metro o más de diámetro. Puede ser redondo o cuadrado, aunque la mayoría parece triángulos redondeados.
        name_es: Escudo mediano
      PL 3 - Age of Reason:
      - name: Leather coat
        mass: '5'
        ap: '0'
        lhe: d6-3/d4-3/d4-2
        type: O
        hide: '+3'
        avail: Any
        cost: '500'
        description:
          en: The cuir bouilli ("boiled leather") coat isn't the best armor, but it's better than nothing in battle. Leather coats have an advantage in being innately concealable; in many societies, the rugged coat is an item of style.
          es: El abrigo de cuero no es la mejor armadura, pero es mejor que nada en la batalla. Los abrigos de cuero tienen la ventaja de ser naturalmente ocultables; en muchas sociedades, el abrigo resistente es un artículo de estilo.
        name_es: Abrigo de cuero
      PL 4 - Industrial Age:
      - name: Flak jacket
        mass: '15'
        ap: '+2'
        lhe: d6-2/d4-1/d6-3
        type: O
        hide: '-'
        avail: Con
        cost: '800'
        description:
          en: While unable to fully absorb the blows of the weapons of the period, the flak jacket is the first armor to seriously inhibit the passage of high impact damage to its wearer. The armor's bulk and mass are its disadvantages.
          es: Aunque no puede absorber completamente los golpes de las armas del periodo, el chaleco antiflac es la primera armadura que inhibe seriamente el paso de daños de alto impacto a su portador. El volumen y la masa de la armadura son sus desventajas.
        name_es: Chaleco antiflac
      PL 5 - Information Age:
      - name: Assault gear
        mass: '10'
        ap: '+3'
        lhe: d6-1/d6-1/d6-1
        type: O
        hide: '-'
        avail: Con
        cost: '1500'
        description:
          en: This is a suit of modern armor, made up of heavy padding, kevlar, and plastic plates. In later ages, kevlar is replaced by carbonate fiber.
          es: Este es un traje de armadura moderna, compuesto de acolchado pesado, kevlar y placas de plástico. En eras posteriores, el kevlar es reemplazado por fibra de carbonato.
        name_es: Equipo de asalto
      - name: Battle vest
        mass: '5'
        ap: '+1'
        lhe: d6-3/d6-2/d4-2
        type: O
        hide: '+2'
        avail: Con
        cost: '600'
        description:
          en: This category includes all the varieties of bulletproof vests that come into use during the latter half of the 20th century. A normal battle vest can be worn under very bulky clothing, but generally it's meant to be pulled over anything else a person might happen to be wearing. Light versions are designed with concealability and comfort in mind. The vest uses strong ceramic-alloy plates sandwiched in a weave of kevlar or (at a higher PL) carbonate fiber to protect the wearer's torso.
          es: Esta categoría incluye todas las variedades de chalecos antibalas que entran en uso durante la segunda mitad del siglo XX. Un chaleco de batalla normal puede usarse debajo de ropa muy voluminosa, pero generalmente está destinado a ponerse sobre cualquier otra cosa que una persona pueda llevar. El chaleco utiliza placas de aleación cerámica fuertes emparedadas en un tejido de kevlar o fibra de carbonato para proteger el torso del portador.
        name_es: Chaleco de batalla
      - name: Riot helmet
        mass: '2'
        ap: '+1'
        lhe: +1/+1/0
        type: O
        hide: '-'
        avail: Con
        cost: '300'
        description:
          en: The riot helmet has a clear plastic visor, offering protection while preserving vision.
          es: El casco antidisturbios tiene una visera de plástico transparente, que ofrece protección al tiempo que preserva la visión.
        name_es: Casco antidisturbios
      - name: Riot shield
        mass: '4'
        ap: '+2'
        lhe: +1/+1/+1
        type: O
        hide: '-'
        avail: Con
        cost: '500'
        description:
          en: This is a high-tech, clear plastic, full-body shield, usually used in conjunction with riot gear.
          es: Este es un escudo de cuerpo completo de plástico transparente de alta tecnología, generalmente utilizado junto con equipo antidisturbios.
        name_es: Escudo antidisturbios
      PL 6 - Fusion Age:
      - name: Assault gear, hvy
        mass: '12'
        ap: '+2'
        lhe: d6-1/d6/d6-1
        type: O
        hide: '-'
        avail: Mil
        cost: '2500'
        description:
          en: This armor resembles PL 5 assault gear in general appearance, but bulletproof CF weave and polymere plates replace much of the padding. It includes a protective hood and attachments for an optional hip-worn respirator. Security forces and paramilitary groups often wear armor of this type.
          es: Esta armadura se asemeja al equipo de asalto de PL 5 en su apariencia general, pero el tejido de fibra de carbonato (CF) a prueba de balas y las placas de polímero reemplazan gran parte del acolchado. Incluye una capucha protectora y acoples para un respirador opcional de cadera. Las fuerzas de seguridad y los grupos paramilitares suelen usar este tipo de armadura.
        name_es: Equipo de asalto pesado
      - name: Attack armor
        mass: '15'
        ap: '+3'
        lhe: d4+1/d6+1/d6-1
        type: O
        hide: '-'
        avail: Con
        cost: '3000'
        description:
          en: The earliest forms of true attack armor are improvements of typical assault gear. A breastplate and helmet of lightweight polymere guards the user's vital areas, while flexible CF weaves cover his limbs.
          es: Las primeras formas de verdadera armadura de ataque son mejoras del equipo de asalto típico. Un peto y un casco de polímero ligero protegen las áreas vitales del usuario, mientras que tejidos de CF flexibles cubren sus extremidades.
        name_es: Armadura de ataque
      - name: Attack armor, pow
        mass: '25'
        ap: '+4'
        lhe: d6+1/d6+2/d6
        type: G
        avail: Mil
        cost: '8000'
        description:
          en: "Powered attack armor includes a small but powerful computer to manage a simple sensor and communication suite. Built-in extra devices include:\nTargeting system: Binoculars reduce long range penalties by 1 step.\nImage enhancement system: Night-vision and infrared goggles reduce penalties due to poor lighting or visual conditions by 1 step.\nCommunication suite: Signal laser and comm gear allow communication over long distances and supervision of remote sensor devices.\nTrauma pack type I: Two trauma packs are attached at the thigh pocket and in the small of the back."
          es: "La armadura de ataque motorizada incluye una computadora pequeña pero potente para gestionar un conjunto simple de sensores y comunicaciones. Los dispositivos adicionales integrados incluyen:\nSistema de puntería: Los binoculares reducen las penalizaciones por largo alcance en 1 paso.\nSistema de mejora de imagen: Las gafas de visión nocturna e infrarrojos reducen las penalizaciones debidas a la mala iluminación o condiciones visuales en 1 paso.\nSuite de comunicación: El láser de señalización y el equipo de comunicaciones permiten la comunicación a largas distancias y la supervisión de dispositivos sensores remotos.\nTrauma pack tipo I: Dos paquetes de trauma están unidos en el bolsillo del muslo y en la parte baja de la espalda."
        name_es: Armadura de ataque motorizada
      - name: Battle jacket
        mass: '8'
        ap: '+1'
        lhe: d6-1/d4+1/d4-1
        type: O
        hide: '+1'
        avail: Con
        cost: '1500'
        description:
          en: A more complete version of the battle vest, this garment includes panels for the thighs and arms, as well as an open-faced hood. It offers significantly more coverage than the vest, but is correspondingly heavier and more awkward. Most battle jackets feature face-seals and attachments for respirators or heating elements.
          es: Una versión más completa del chaleco de batalla, esta prenda incluye paneles para los muslos y los brazos, así como una capucha de cara abierta. Ofrece significativamente más cobertura que el chaleco, pero es correspondientemente más pesada y torpe. La mayoría de las chaquetas de batalla cuentan con sellos faciales y acoples para respiradores o elementos calefactores.
        name_es: Chaqueta de batalla
      - name: CF long coat
        mass: '4'
        ap: '0'
        lhe: d4/d4/d6-2
        type: O
        hide: '+3'
        avail: Com
        cost: '1000'
        description:
          en: In situations when it isn't wise to display heavy armor, a bulletproof coat can be a lifesaver. Designed to resemble a well-made duster or jacket, the CF coat uses extensive weaves of resistant carbonate fibers to defeat slashing weapons and projectiles. The long coat almost touches the ground, and it can pass for a duster or overcoat of some kind.
          es: En situaciones en las que no es prudente mostrar una armadura pesada, un abrigo a prueba de balas puede ser un salvavidas. Diseñado para parecerse a un guardapolvo o chaqueta bien confeccionada, el abrigo de CF utiliza tejidos extensos de fibras de carbonato resistentes para derrotar armas de tajo y proyectiles. El abrigo largo casi toca el suelo y puede pasar por un guardapolvo o sobretodo.
        name_es: Abrigo largo CF
      - name: CF short coat
        mass: '3'
        ap: '0'
        lhe: d4-1/d4-1/d6-3
        type: O
        hide: '+3'
        avail: Com
        cost: '750'
        description:
          en: The CF short coat is designed for situations where discreet protection is needed. It uses extensive weaves of resistant carbonate fibers to defeat slashing weapons and projectiles. The short coat comes down to the waist and can be worn as part of a suit, or as a simple jacket.
          es: El abrigo corto de CF está diseñado para situaciones donde se necesita protección discreta. Utiliza tejidos extensos de fibras de carbonato resistentes para derrotar armas de tajo y proyectiles. El abrigo corto llega hasta la cintura y se puede usar como parte de un traje o como una simple chaqueta.
        name_es: Abrigo corto CF
      PL 7 - Gravity Age:
      - name: Body tank
        mass: '60'
        ap: '+6'
        lhe: 2d4+1/2d4+1/2d4
        type: G
        hide: '-'
        avail: Res
        cost: '25000'
        description:
          en: "The invention of sturdy, small, and powerful servos makes the powered 'body tank' armor possible. Most of the armor consists of neutronite alloy plate, with only a few awkward joints made of flexible carbonate fiber. Systems included in a body tank are:\nTargeting system: Binoculars reduce long range penalties by 1 step.\nImage enhancement system: Night-vision and infrared goggles reduce penalties due to poor lighting or visual conditions by 1 step.\nCommunication suite: Signal laser and comm gear allow communication over long distances and supervision of remote sensor devices.\nTrauma pack type II: One of two trauma packs activates when the suit's occupant suffers damage; the other one is a spare. Mortal wounds are automatically staunched; the wearer doesn't need to make a Stamina–endurance check.\nThreat receiver: An electromagnetic/infrared sensor detects active fire control and rangefinding systems directed at the wearer, who gains a –2 bonus to Awareness checks to detect such threats.\nSmart display: Geomapping system provides a view of the surrounding area, granting the user a –1 bonus to Tactics checks.\nLaser designator: Helmet-mounted device allows the soldier to instantly relay requests for fire support or air strikes through his data uplink.\nBantam launcher: A built-in bantam launcher contains a magazine of four loads."
          es: "La invención de servos robustos, pequeños y potentes hace posible la armadura motorizada \"tanque de cuerpo\". La mayor parte de la armadura consiste en placas de aleación de neutronita, con solo unas pocas articulaciones torpes de fibra de carbonato flexible. Los sistemas incluidos en un tanque de cuerpo son:\nSistema de puntería: Los binoculares reducen las penalizaciones por largo alcance en 1 paso.\nSistema de mejora de imagen: Las gafas de visión nocturna e infrarrojos reducen las penalizaciones debidas a la mala iluminación o condiciones visuales en 1 paso.\nSuite de comunicación: El láser de señalización y el equipo de comunicaciones permiten la comunicación a largas distancias y la supervisión de dispositivos sensores remotos.\nTrauma pack tipo II: Uno de los dos paquetes de trauma se activa cuando el ocupante del traje sufre daños; el otro es de repuesto. Las heridas mortales se detienen automáticamente; el portador no necesita realizar un chequeo de Stamina-endurance.\nThreat receiver: Un sensor electromagnético/infrarrojo detecta los sistemas activos de control de fuego y telemetría dirigidos al portador, quien gana un bono de -2 en los chequeos de Awareness para detectar tales amenazas.\nSmart display: El sistema de geomapeo proporciona una vista del área circundante, otorgando al usuario un bono de -1 en los chequeos de Tactics.\nDesignador láser: El dispositivo montado en el casco permite al soldado transmitir instantáneamente solicitudes de apoyo de fuego o ataques aéreos a través de su enlace de datos.\nLanzador Bantam: Un lanzador bantam incorporado contiene un cargador de cuatro proyectiles."
        name_es: Tanque de cuerpo
      - name: Body tank, recon
        mass: '45'
        ap: '+5'
        lhe: 2d4/2d4/d6+2
        type: G
        hide: '-'
        avail: Mil
        cost: '30000'
        description:
          en: The recon body tank is lighter and more expensive than the regular version, but somewhat more common. The recon body tank features the same onboard systems as the standard body tank.
          es: El tanque de cuerpo de reconocimiento es más ligero y costoso que la versión regular, pero algo más común. El tanque de cuerpo de reconocimiento cuenta con los mismos sistemas a bordo que el tanque de cuerpo estándar.
        name_es: Tanque de cuerpo, recon
      - name: Body tank, zero-g
        mass: '80'
        ap: '+7'
        lhe: 3d4/3d4/2d4+1
        type: G
        hide: '-'
        avail: Res
        cost: '50000'
        description:
          en: "The heaviest armor available at PL 7 is equipped with all the features of the standard body tank in a suit slightly larger than the normal body tank. It also includes the following features:\nAir/space radar: A small but powerful radar system allows a soldier to keep an eye on enemy aircraft or spacecraft movements.\nInstead of a bantam launcher, the purchaser of a zero-g body tank can include any one of the following:\nGrenade launcher: Two magazines hold six grenades each.\nDirect fire heavy weapon: Choice of heavy charge machine gun, arc gun, rail cannon, or plasma gun.\nClose-combat weapon: Choice of chainsword, gravmace, mass pistol, or autoflechette shotgun."
          es: "La armadura más pesada disponible en PL 7 está equipada con todas las características del tanque de cuerpo estándar en un traje ligeramente más grande. También incluye:\nRadar aéreo/espacial: Un sistema de radar pequeño pero potente permite al soldado vigilar los movimientos de aeronaves o naves espaciales enemigas.\nEn lugar de un lanzador bantam, el comprador puede incluir uno de los siguientes:\nLanzagranadas: Dos cargadores de seis granadas cada uno.\nArma pesada de fuego directo: A elegir entre ametralladora de carga pesada, cañón de arco, cañón de riel o pistola de plasma.\nArma de combate cercano: A elegir entre espada sierra, maza de gravedad, pistola de masa o escopeta de autoflechette."
        name_es: Tanque de cuerpo, gravedad-0
      - name: CF softsuit
        mass: '3'
        ap: '0'
        lhe: d6/d6/d6-1
        type: O
        hide: '+4'
        avail: Con
        cost: '2000'
        description:
          en: The CF softsuit represents the highest level of carbonate fiber advancement. It can be woven into lightweight clothing styles, providing protection that doesn't look like protection at all.
          es: El softsuit de CF representa el nivel más alto de avance en fibra de carbonato. Se puede tejer en estilos de ropa ligera, proporcionando una protección que no parece protección en absoluto.
        name_es: Ropa de infiltración CF
      - name: Deflection harness
        mass: '2'
        ap: '0'
        lhe: see description
        type: O
        hide: '+3'
        avail: Con
        cost: '2500'
        description:
          en: "The deflection harness creates a powerful nondirectional graviton field around the wearer. Physical objects are deflected away, and even energy-based attacks may be bent enough to miss the user. It cannot be combined with other armor. The harness improves the user's applicable resistance modifier (Strength or Dexterity) by +2 steps, but the wearer suffers a +2 penalty to attacks outside the field. A charge pack lasts for 10 rounds."
          es: "El arnés de deflexión crea un potente campo de gravitones no direccional alrededor del portador. Los objetos físicos son desviados y los ataques de energía pueden curvarse hasta fallar. No se puede combinar con otra armadura. El arnés mejora el modificador de resistencia aplicable (Fuerza o Destreza) en +2 pasos, pero el portador sufre una penalización de +2 en ataques fuera del campo. Una batería dura 10 asaltos."
        name_es: Arnés de deflexión
      - name: BodyGuard Ballistic Vest
        mass: '3'
        ap: '0'
        lhe: d6-1/d6/d6-2
        type: O
        hide: '+3'
        avail: Com
        cost: '750'
        description:
          en: The BodyGuard vest is one of the most popular personal armors available. It is significantly lighter and more durable than its predecessors...
          es: Es una de las protecciones personales más populares. Significativamente más ligera y duradera que sus predecesoras, se ajusta perfectamente bajo la ropa de calle sin señales externas.
        name_es: Chaleco balístico BodyGuard
      - name: Landsknecht 34 Ballistic Jacket
        mass: '6'
        ap: '+1'
        lhe: d6-1/d4+1/d4-1
        type: O
        hide: '+1'
        avail: Con
        cost: '1650'
        description:
          en: The Landsknecht is about the heaviest armor that could be worn in a rough-and-tumble spaceport without inviting unwelcome attention...
          es: Es la armadura más pesada que se puede llevar en un puerto espacial agitado sin atraer atención no deseada. Incluye capucha con sellado facial y máscara de vacío.
        name_es: Chaqueta balística Landsknecht 34
      - name: Haramaki long coat
        mass: '3'
        ap: '0'
        lhe: d4/d4/d6-2
        type: O
        hide: '+3'
        avail: Com
        cost: '800'
        description:
          en: Designed for comfortable wear all day long, the Haramaki long coat provides a modest increase in protective value...
          es: Diseñada para un uso cómodo durante todo el día, proporciona un aumento modesto en protección al cubrir una mayor parte del cuerpo.
        name_es: Abrigo largo Haramaki
      - name: Battlehawk Zero-G Assault Gear
        mass: '8'
        ap: '+2'
        lhe: d6-1/d6/d6-1
        type: G
        hide: '-'
        avail: Con
        cost: '3250'
        description:
          en: Designed especially for use in low-gravity situations...
          es: Diseñada para gravedad baja, se ajusta ceñida e incluye máscara de vacío con 8 horas de reserva y propulsores de bota.
        name_es: Armadura de asalto Battlehawk Zero-G
      - name: Scout 230 AET Assault Gear
        mass: '12'
        ap: '+2'
        lhe: d6/d8/d6-1
        type: G
        hide: '-'
        avail: Mil
        cost: '3250'
        description:
          en: The Scout 230 is basically an armored version of a soft e-suit...
          es: Versión blindada de un traje ambiental suave (e-suit), diseñada para uso prolongado en entornos peligrosos.
        name_es: Armadura de explorador Scout 230 AET
      - name: ACN 4 Cerametal Armor
        mass: '10'
        ap: '+2'
        lhe: d6+1/d8+1/d6
        type: G
        hide: '-'
        avail: Mil
