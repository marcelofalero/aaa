<script>
  (function() {
    const list = document.getElementById('history-breadcrumbs-list');
    if (!list) return;

    try {
      let history = [];
      try {
        history = JSON.parse(sessionStorage.getItem('pageHistory')) || [];
      } catch (e) {
        console.error("Error parsing history", e);
      }

      
      if (history.length <= 1) {
        list.remove();
        return;
      }

      const currentUrl = "\/perks\/";
      const fragment = document.createDocumentFragment();

      history.forEach((page, index) => {
        if (index > 0) {
          const sep = document.createElement('li');
          sep.className = "mh2 neon-purple o-50"; 
          sep.textContent = '›'; 
          fragment.appendChild(sep);
        }

        const li = document.createElement('li');
        
        if (page.url === currentUrl && index === history.length - 1) {
           li.className = "silver o-80 ttu";
           li.textContent = page.title;
        } else {
           const a = document.createElement('a');
           a.href = page.url;
           a.className = "link neon-cyan hover-neon-purple transition-all ttu";
           a.textContent = page.title;
           li.appendChild(a);
        }
        fragment.appendChild(li);
      });

      list.appendChild(fragment);
    } catch (e) {
      console.error("Breadcrumb rendering error:", e);
    }
  })();
</script>
