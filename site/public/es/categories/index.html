<script>
  (function () {
    const list = document.getElementById('history-breadcrumbs-list');
    if (!list) return;

    try {
      let history = [];
      try {
        history = JSON.parse(sessionStorage.getItem('pageHistory')) || [];
      } catch (e) {
        console.error("Error parsing history", e);
      }

      if (history.length <= 1) {
        const nav = list.closest('.breadcrumbs');
        if (nav) nav.remove();
        return;
      }

      const currentLang = "es";
      const currentUrl = "\/es\/categories\/";
      const fragment = document.createDocumentFragment();

      
      const reversedHistory = [...history].reverse();

      reversedHistory.forEach((page, index) => {
        if (index > 0) {
          const sep = document.createElement('li');
          sep.className = "separator";
          sep.innerHTML = '‹';
          fragment.appendChild(sep);
        }

        const li = document.createElement('li');
        let targetUrl = page.url;

        
        if (page.translations) {
          const translation = page.translations.find(t => t.Lang === currentLang);
          if (translation) {
            targetUrl = translation.Permalink;
          }
        }

        if (targetUrl === currentUrl && index === 0) {
          li.className = "current-page f4 fw6 neon-text truncate";
          li.textContent = page.title;
        } else {
          const a = document.createElement('a');
          a.href = targetUrl;
          a.textContent = page.title;
          a.className = "truncate";
          li.appendChild(a);
        }
        fragment.appendChild(li);
      });

      list.appendChild(fragment);
    } catch (e) {
      console.error("Breadcrumb rendering error:", e);
    }
  })();
</script>
