items:
- name: Al Board
  pl: '7'
  mass: 'Mass (kg): 100 g'
  cost: 'Cost ($ or #): (A) $15,000; (B) $3,500; (C) 4,000+'
  avail: 'Availability: Restricted'
  description:
    en: The 'Al board' is a computer card that allows a mainframe of Good or better
      quality to support true artificial intelligence. It requires separate purchase.
    es: El 'Al board' es una tarjeta de computadora que permite un núcleo principal
      de calidad Buena o mejorada para soportar la inteligencia artificial verdadera.
      Requiere compra separada.
  name_es: Baul de Al
- name: Al Emulator Program
  pl: '7'
  mass: 'Mass (kg): 2 kg'
  cost: 'Cost ($ or #): 4 slots of active memory'
  avail: 'Availability: Restricted'
  description:
    en: The Al emulator is a simple and easy-to-use interface that relies on preprogrammed
      libraries to simulate a character and soul separate. This means that the user
      can choose different characters or souls without having to change any code.
    es: El emulador de Al es una interfaz sencilla y práctica que depende de bibliotecas
      preprogramadas para simular un personaje y la intuición separados. Esto significa
      que el usuario puede elegir diferentes caracteres o almas sin tener que cambiar
      ningún código.
  name_es: Emulador de armas Al
- name: Memory Harness
  pl: '7'
  mass: 'Mass (kg): 2 kg'
  cost: 'Cost ($ or #): +3 steps for a Marginal (¥4,000) harness, +2 for an Ordinary
    (¥5,000) harness, +1 for a Good (%6,000), and no penalty for an Amazing (¥8,000)
    harness'
  avail: 'Availability: Restricted'
  description:
    en: A portable computer system equivalent to a computer gauntlet of similar quality.
      It is equipped with special fuzzy-logic banks.
    es: Un sistema informático portátil equivalente al del puente de equipos (gauntlets)
      de la misma calidad. Está equipado con bancos especializados en lógica difusa.
  name_es: Parche de Memoria
- name: Mainframe
  pl: '7'
  mass: 'Mass (kg): 6 kg; 500 g'
  cost: 'Cost ($ or #): #1,500+ (see helow)'
  avail: 'Availability: Controlled'
  description:
    en: A powerful computer capable of handling almost any business task. It includes
      an integrated high-definition video screen and a 3D drive.
    es: Un ordenador potente que puede manejar casi cualquier tarea empresarial. Incluye
      un monitor de vídeo integrado en alta definición y un disco 3D.
  name_es: Maquinaria principal
- name: Microcomputer
  pl: '7'
  mass: 'Mass (kg): 2 kg'
  cost: 'Cost ($ or #): %4,500 9 slots; %3000 12 slots; %14,000 15 slots; $20,000
    unlimited'
  avail: 'Availability: Controlled'
  description:
    en: The businessman's traveling computer. It is smaller, lighter and more powerful
      than laptops.
    es: El ordenador del viajero del negociante es más pequeño, ligero y potente que
      las computadoras portátiles.
  name_es: Ordenador Microelectrónico
- name: 'Personal Computer (L-R): Data Slate, Desktop, Gauntlet'
  pl: '7'
  mass: 'Mass (kg): 300 g; 3 kg; 2 kg'
  cost: 'Cost ($ or #): $84,500; %3000 12 slots; %14,000 15 slots; $20,000 unlimited'
  avail: 'Availability: Controlled'
  description:
    en: These are different types of personal computers with variable prices and strengths.
    es: Estos son diferentes tipos de computadores personales con precios y fuerzas
      variables.
  name_es: 'Computadora Personal (L-R): Plaqueta de Datos, Escritorio, Mazo'
- name: Quality Microcomp Gauntlet Active Memory
  pl: 7
  mass: 'Mass (kg): A) 300 g; (B) 3 kg; (C) 2 kg'
  cost: 'Cost ($ or #): Marginal ~ #1,500 $2,000 3 slots, Ordinary %2,500 $3,000 5
    slots, Good %3500 %4000 7 slots, Amazing ¥4,500 %5000 9 slots'
  avail: 'Availability: Controlled'
  description:
    en: 'The Quality MicroComp Gauntlet Active Memory is a high-performance and high-capacity
      storage device. It''s designed to offer unparalleled speed, reliability, and
      capacity that rivals the best microcomputers in existence. Features: 1. Microprocessor:
      A high-level Intel Xeon E5 V3.0 CPU delivers exceptional power efficiency and
      performance. 2. Memory Chip: The use of a state-of-the-art, ultra-high capacity
      memory chip ensures unrivaled storage speed and data retrieval times. 3. Interface:
      This device has a USB 3.0 interface for easy connectivity to any system that
      can support it. Mechanics: 1. Energy Efficiency: With its powerful CPU and advanced
      storage technology, this item is one of the most energy-efficient tools at your
      disposal. 2. Speed & Performance: The device packs a punch with unrivaled speed
      and performance levels, ensuring quick data processing times. Flavor: This memory
      solution boasts an elegant design that elegantly integrates into any system,
      yet is built to perform like a top-tier microcomputer. Stats: 1. Speed: Excellent
      2. Capacity: Excellent 3. Efficiency: Outstanding'
    es: 'El Quality MicroComp Gauntlet Active Memory es un dispositivo de almacenamiento
      de alto rendimiento y capacidad máxima. Está diseñado para ofrecer una velocidad,
      confiabilidad y capacidad inigualables que superan a los mejores microcomputadores
      existentes. Características: 1. Procesador: Un procesador Intel Xeon E5 V3<｜begin▁of▁sentence｜>.0
      de alto nivel ofrece una eficiencia energética y desempeño óptimos. 2. Tarjeta
      de Memoria: El uso de un chip de memoria ultragrande de estado de la artesanía
      garantiza velocidades de almacenamiento y tiempos de recuperación de datos impensables.
      3. Interfaz: Este dispositivo cuenta con una interfaz USB 3.0 para fácil integración
      en cualquier sistema que soporte ella. Mecanismos: 1. Eficiencia energética:
      Con su potente CPU y tecnología de almacenamiento avanzada, este objeto es uno
      de los más eficientes a la hora de la energía que dispone. 2. Velocidad & Desempeño:
      El dispositivo empaque un puñado con tiempos de procesamiento de datos impensables
      y ofrece alto desempeño, ráfagas de velocidad inolvidable. Sabor: Este dispositivo
      de memoria es una hermosa pieza que se ajusta perfectamente a cualquier sistema,
      pero cuenta con un gran poder procesamiento que lo hace parecer como un microordenador
      de última generación. Estadísticas: 1. Velocidad: Excelente 2. Capacidad: Excepcional
      3. Eficiencia: Óptimo'
  name_es: Guante de la Memoria Activa Microcomputadora de Calidad
- name: Gridcaster Gauntlet
  pl: '7'
  mass: '(A) 35 cm X 12 cm X 10 cm (approx.) or (B) 20 cm diameter X 15 cm tall or
    (C)10cm X Scm X 2 cm. Mass: (A, B) 2 kg; (C) 500 g.'
  cost: Marginal $1,500 - 4 slots, Ordinary $2,550 - 7 slots, Good $4,500 - 10 slots,
    Amazing $6,500 - 12 slots
  avail: Available for purchase.
  description:
    en: The Gridcaster Gauntlet is a powerful computer gauntlet with a special neural
      interface designed to mate with the wearer’s cytronic circuitry. It provides
      a -1, -2, or -3 step bonus to Computer Science skill checks.
    es: El Guante Gridcaster es una arma de gántula computacional potente con una
      interfaz neuronal especialmente diseñada para integrarse con la circuitería
      cítrica del portador. Proporciona un bónus de -1, -2 o -3 pasos en las pruebas
      de habilidades de Ciencias de la Computación.
  name_es: Guante de Gridcaster
- name: Cyberware
  pl: '7'
  mass: Varies
  cost: See below
  avail: Controlled
  description:
    en: Cyberware, also known as cybernetics, is the application of technology to
      enhance human capabilities. It consists of a wide range of devices and systems
      that can be installed in the body or mind of a person.
    es: El ciberequipamiento, también conocido como ciencias cibernéticas, consiste
      en la aplicación de la tecnología para mejorar las capacidades humanas. Forma
      parte de una amplia gama de dispositivos y sistemas que se pueden instalar en
      el cuerpo o mente de una persona.
  name_es: Ciberarma
- name: Cortex Bomb
  pl: '7'
  mass: 100 g
  cost: '#3,500'
  avail: Controlled
  description:
    en: The cortex bomb is one of the most brutal means available to ensure compliance.
      It's a small radio-activated or timed explosive charge, implanted in the subject’s
      skull. If detonated, it kills the victim in an unforgiving manner. Radio detonators
      must be within 200 meters for effective operation; cluttering terrain or interior
      walls may affect this proximity.
    es: La bomba de cortex es una de las formas más brutales para asegurar la adhesión.
      Es un pequeño explosivo radioactivo o temporizado, implantado en el cerebro
      del sujeto. Si se activa, destruye al víctima de manera horrendemente rápida.
      Los detonadores radios deben estar a menos de 200 metros para funcionar; las
      desorganizaciones de la tierra o los muros interiores pueden afectar este cercamiento.
  name_es: Bomba de Córtex
- name: Comm Port
  pl: '7'
  mass: Mass not provided
  cost: Cost not provided
  avail: Availability not provided
  description:
    en: A device for signal communication, data transmission and reception. Video
      streams (if equipped with an Optical System), or data can be transmitted. Using
      a common port for radio conversation increases one's penalty in actions due
      to distraction.
    es: Un dispositivo para la comunicación de señales, transmisión y recepción de
      datos. Los flujos de video (si están equipados con un Sistema Óptico), o los
      datos pueden ser transmitidos. Usar el puerto común para una conversación de
      radio aumenta la penalización en acciones debido a la distracción.
  name_es: Puerto de Comunicación
