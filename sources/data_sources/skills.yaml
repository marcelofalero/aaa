  resolve:
    attribute: WIL
    cost: 6
    category: Other
    url: /skills/resolve
    localized:
      - en:
          name: Resolve
          description: |-
            This broad skill represents a character''s inner strength of will. It is the capacity to endure physical hardship, resist mental strain, and stand firm in one''s convictions regardless of pressure or temptation. Training in Resolve allows a character to stabilize their mind during high-stress situations and recover more efficiently from the initial shock of bodily trauma. It is used to defend against mental stress or attacks, to stand up to physical damage, and to stick to his own mind and convictions.
      - es:
          name: Firmeza
          description: |-
            Esta amplia habilidad representa la fuerza de voluntad interna de un Personaje. Es la capacidad de soportar las dificultades, resistir la tensión y permanecer firme en las propias convicciones sin importar la presión o la tentación. El entrenamiento en Firmeza permite a un Personaje estabilizar su mente durante situaciones de alto estrés y recuperarse más eficientemente del shock inicial del trauma corporal. Se utiliza para defenderse del estrés o los ataques de Mental, para resistir el daño de Físico y para apegarse a su propia mente y convicciones.
    items:
      mental-resolve:
        attribute: WIL
        cost: 3
        url: /skills/resolve#mental-resolve
        localized:
          - en:
              name: Mental resolve
              description: |-
                This specialty skill is used to determine a character's ability to cope with emotional or mental stress of all kinds. The higher the rank, the more resistant the character is to emotional trauma, fear, panic, madness, insanity, mind control techniques, and mental powers. When a character is confronted with debilitating effects, they can make a Mental Resolve check to set the trauma aside and act without hindrance.

                ### Results
                - **Critical Failure:** Character collapses in mental anguish; cannot act or flees for d4 rounds.
                - **Failure:** Character freezes and loses 1 action; receives a +1 penalty to all actions for 1 round.
                - **Ordinary / Good / Amazing:** Character can act without penalty. (Still may have to deal with trauma later).

                ### Rank Benefits
                ⊗ **Rank 4, 8, 12 [Resistance Modifier]** At higher ranks, the Mental Resolve skill provides an improvement to a character's **Will resistance modifier**, which makes it more difficult for opponents to successfully use encounter skills or mental powers against the character. The modifier improves by **+1 at Rank 4**, **+1 at Rank 8**, and **+1 at Rank 12**.
          - es:
              name: Firmeza Mental
              description: |-
                Este Especialidad se utiliza para determinar la capacidad de un Personaje para afrontar el estrés emocional o Mental de todo tipo. Cuanto mayor sea el Rango, más resistente será el Personaje al trauma emocional, el miedo, el pánico, la locura, las técnicas de control mental y los poderes del Mental. Cuando un Personaje se enfrenta a efectos debilitantes, puede realizar una prueba de Mental Firmeza para dejar el trauma a un lado y actuar sin obstáculos.

                ### Resultados
                - **Fallo Crítico:** Personaje colapsa en angustia Mental; no puede actuar o huye durante d4 asaltos.
                - **Error:** Personaje se congela y pierde 1 acción; recibe una penalización de +1 a todas las acciones durante 1 ronda.
                - **Ordinario / Bueno / Asombroso:** Personaje puede actuar sin penalización. (Es posible que aún tenga que lidiar con el trauma más adelante).

                ### Beneficios de Rango
                ⊗ **Rango 4, 8, 12 [Modificador de resistencia]** En Rangos más alto, la habilidad Mental Firmeza proporciona una mejora al **modificador de resistencia a la voluntad** de Personaje, lo que hace que sea más difícil para los oponentes usar con éxito habilidades de encuentro o poderes de Mental contra Personaje. El modificador mejora en **+1 en Rango 4**, **+1 en Rango 8** y **+1 en Rango 12**.
        trained_only: false
        rank_benefits:
          - rank: 4
            title: Resistance Modifier
          - rank: 8
            title: Resistance Modifier
          - rank: 12
            title: Resistance Modifier
      physical-resolve:
        attribute: WIL
        cost: 3
        url: /skills/resolve#physical-resolve
        localized:
          - en:
              name: Physical resolve
              description: |-
                Physical Resolve is used to determine a character''s ability to cope with physical trauma of all kinds. It represents a character''s determination to resist physical torture, to press on though tired or in great pain, and to bounce back from physical damage.

                ### Withstanding Torture
                When a character is confronted with physical torture, he can make a Physical Resolve check to determine his reaction. The greater the level of torture, the higher the situation die penalty.
                - **Critical Failure:** The character breaks immediately and reveals everything.
                - **Failure:** The character breaks and reveals at least one important fact.
                - **Ordinary:** The character withstands the torture for **d4 time units** (then makes another check).
                - **Good:** The character withstands for **d6+2 time units**.
                - **Amazing:** The character withstands for **2d4+3 time units**.

                ### Knockout Recovery
                A character who falls unconscious due to knockout remains in that state for all of the round in which it occurred and all of the next round. After that, he makes a Physical Resolve check to regain consciousness once per round. Success indicates he awakens with an amount of stun damage recovered depending on success (Ordinary: 2, Good: 4, Amazing: 6).

                ### Avoiding Exhaustion
                When all of a character's fatigue points are used up, he can attempt a Physical Resolve check to stay conscious. If the check succeeds, he can perform actions for a number of rounds (Ordinary: 1, Good: 2, Amazing: 3).

                ### Fatigue Recovery
                The result of a Physical Resolve check determines how many fatigue points a character recovers after a sufficient amount of rest.
                - **Ordinary:** 1 point.
                - **Good:** 2 points.
                - **Amazing:** 3 points.

                ### Natural Healing
                A character who has suffered damage may have to heal naturally due to a lack of medical assistance or because medical science has done all it can for the patient.

                #### Stun Damage
                Natural healing of stun damage occurs automatically and immediately at the end of a scene. All stun damage disappears, and characters who were knocked out because of stun damage regain consciousness.

                #### Wound Damage
                A character naturally recovers a certain number of wound boxes according to the result of a **Resolve—physical resolve** check. A check is made **once per week** (at the end of the week), with the following results:
                - **Critical Failure:** Patient somehow aggravates his condition and suffers **1 additional wound**.
                - **Marginal:** Character recovers **1 wound box**.
                - **Ordinary:** Character recovers **2 wound boxes**.
                - **Good:** Character recovers **3 wound boxes**.
                - **Amazing:** Character recovers **4 wound boxes**.

                *Note: A character without the Resolve broad skill makes an untrained Will check with a **+d4 situation die**.*

                **Mortal Damage:** Mortal damage **cannot be healed naturally**; only the application of the **Medical Science—surgery** skill can repair mortal damage.

                #### Activity Modifiers
                During natural healing, all checks are considered to be made while the character engages in minimal activity. 
                - **Total Rest:** If the character confines himself to a hospital bed or remains in a state of total rest for the period, the check receives a **-2 step bonus**. 
                - **Normal Activity:** If the character engages in normal activity, the check receives a **+2 step penalty**.
          - es:
              name: Firmeza Física
              description: |-
                Físico Firmeza se utiliza para determinar la capacidad de un Personaje para hacer frente a traumatismos de todo tipo. Representa la determinación de Personaje de resistir la tortura de Físico, de seguir adelante aunque esté cansado o con mucho dolor y de recuperarse del daño de Físico.

                ### Resistir la tortura
                Cuando un Personaje se enfrenta a la tortura de Físico, puede realizar una prueba de Físico Firmeza para determinar su reacción. Cuanto mayor sea el nivel de tortura, mayor será la pena Dado de Situación.
                - **Fallo Crítico:** El Personaje se rompe inmediatamente y lo revela todo.
                - **Fallo:** El Personaje se rompe y revela al menos un hecho importante.
                - **Ordinario:** El Personaje resiste la tortura durante **d4 unidades de tiempo** (luego hace otra prueba).
                - **Bueno:** El Personaje resiste **d6+2 unidades de tiempo**.
                - **Asombroso:** El Personaje resiste **2d4+3 unidades de tiempo**.

                ### Recuperación por nocaut
                Un Personaje que cae inconsciente debido a un nocaut permanece en ese estado durante todo el asalto en el que ocurrió y todo el siguiente. Después de eso, realiza una prueba Físico Firmeza para recuperar la conciencia una vez por asalto. El éxito indica que se despierta con una cantidad de daño Aturdimiento recuperado dependiendo del éxito (Ordinario: 2, Bueno: 4, Asombroso: 6).

                ### Evitar el agotamiento
                Cuando se agotan todos los puntos Fatiga de un Personaje, puede intentar una prueba de Físico Firmeza para mantenerse consciente. Si la prueba tiene éxito, puede realizar acciones durante varias rondas (Ordinario: 1, Bueno: 2, Asombroso: 3).

                ### Recuperación de Fatiga
                El resultado de una comprobación de Físico Firmeza determina cuántos puntos Fatiga recupera un Personaje después de una cantidad suficiente de descanso.
                - **Ordinario:** 1 punto.
                - **Bueno:** 2 puntos.
                - **Asombroso:** 3 puntos.

                ### Curación Natural
                Un Personaje que ha sufrido daños puede tener que curarse de forma natural por falta de asistencia médica o porque Ciencias médicas ha hecho todo lo posible por el paciente.

                #### Daño Aturdimiento
                La curación natural del daño de Aturdimiento se produce de forma automática e inmediata al final de una escena. Todo el daño de Aturdimiento desaparece y los personajes que fueron noqueados debido al daño de Aturdimiento recuperan el conocimiento.

                #### Daño Herida
                Un Personaje recupera naturalmente una cierta cantidad de cajas Herida según el resultado de una verificación **Firmeza—Físico Firmeza**. Se realiza una verificación **una vez por semana** (al final de la semana), con los siguientes resultados:
                - **Fallo Crítico:** El paciente de alguna manera agrava su condición y sufre **1 Herida** adicional.
                - **Marginal:** Personaje recupera **1 caja Herida**.
                - **Ordinario:** Personaje recupera **2 cajas Herida**.
                - **Bueno:** Personaje recupera **3 cajas Herida**.
                - **Asombroso:** Personaje recupera **4 cajas Herida**.

                *Nota: Un Personaje sin la habilidad amplia Firmeza realiza una prueba de Voluntad sin entrenar con **+d4 Dado de Situación**.*

                **Daño Mortal:** El daño Mortal **no se puede curar de forma natural**; solo la aplicación de la habilidad **Ciencias médicas—cirugía** puede reparar el daño de Mortal.

                #### Modificadores de actividad
                Durante la curación natural, se considera que todas las comprobaciones se realizan mientras el Personaje realiza una actividad mínima. 
                - **Descanso total:** Si el Personaje se confina a una cama de hospital o permanece en estado de reposo total durante el período, el cheque recibe un **-2 Bonificación de paso**. 
                - **Actividad normal:** Si el Personaje realiza una actividad normal, el cheque recibe un **+2 Penalización de paso**.
        trained_only: false
        rank_benefits:
          - rank: 0
            title: Knockout Recovery
    trained_only: false
  security:
    attribute: INT
    cost: 3
    category: Other
    url: /skills/security
    localized:
      - en:
          name: Security
          description: |-
            This broad skill provides a character with basic knowledge of security systems and procedures. This pertains to security systems that protect physical objects or specifically defined areas. (Note that systems of the sort that protect the theft or corruption of computerized data are dealt with under the Computer Science-hacking specialty). The complexity of a system relates to how time-consuming it is to get through any and all barriers that lie between an intruder and the object or area that the security system is protecting. For the purpose of determining the situation die modifier for each segment of a complex Security skill check:

            - **Marginal quality:** A situation in which (for example) the character is undisturbed while he's examining or manipulating a type of security system with which he is familiar.
            - **Ordinary quality:** A situation in which (for example) the character is occasionally disturbed, examining a new security system or one he is not familiar with, or lacks the specialized tools to deal with the security measures in place. Or is under some time pressure, but not both.
            - **Good quality:** A combination of the above circumstances that produce Ordinary quality situations.
            - **Amazing quality:** One in which (for example) the character and his allies are involved in combat or are under severe time pressure to accomplish their goal or the security system is particularly complex and difficult to bypass.
      - es:
          name: Seguridad
          description: |-
            Esta amplia habilidad proporciona a Personaje conocimientos básicos de sistemas y procedimientos de seguridad. Se trata de sistemas de seguridad que protegen objetos Físico o áreas específicamente definidas. (Tenga en cuenta que los sistemas del tipo que protegen contra el robo o la corrupción de datos computarizados se tratan en la especialidad de piratería informática). La complejidad de un sistema se relaciona con el tiempo que lleva atravesar todas y cada una de las barreras que se encuentran entre un intruso y el objeto o área que protege el sistema de seguridad. Con el fin de determinar el modificador Dado de Situación para cada segmento de una prueba de habilidad de seguridad compleja:

            - **Cualidad marginal:** Una situación en la que (por ejemplo) el Personaje no es molestado mientras examina o manipula un tipo de sistema de seguridad con el que está familiarizado.
            - **Calidad Ordinario:** Una situación en la que (por ejemplo) el Personaje ocasionalmente es perturbado, examinando un sistema de seguridad nuevo o uno con el que no está familiarizado, o carece de las herramientas especializadas para lidiar con las medidas de seguridad implementadas. O tiene cierta presión de tiempo, pero no ambas cosas.
            - **Calidad Bueno:** Una combinación de las circunstancias anteriores que producen situaciones de calidad Ordinario.
            - **Calidad Asombroso:** Uno en el que (por ejemplo) Personaje y sus aliados están involucrados en Combate o están bajo una gran presión de tiempo para lograr su objetivo o el sistema de seguridad es particularmente complejo y difícil de eludir.
    items:
      protection-protocols:
        attribute: INT
        cost: 3
        url: /skills/security#protection-protocols
        localized:
          - en:
              name: Protection protocols
              description: |-
                This skill represents a character's training in protection procedures of all types. It has two principal uses: **Secure an Area** and **Analyze Weak Points**.

                ### Secure an Area
                With the proper amount of time and cooperation, a character can set defenses and secure an area to a greater degree than it was before. (Some areas can''t be secured or can only be secured with great difficulty, meaning that a situation die penalty applies to the skill check). The degree of success on the skill check affects the subsequent
                **Awareness skill checks** of everyone guarding the area against intruders:
                - **Critical Failure / Failure:** The Awareness checks of the guard(s) are made with a **+1 penalty**.
                - **Ordinary:** Success causes a **-1 bonus** on the Awareness checks.
                - **Good:** A **-2 bonus**.
                - **Amazing:** A **-3 bonus**.

                ### Analyze Weak Points
                A character can study a secured area (anything from a vehicle to a building to a neighborhood) and look for weak points to exploit. This use of the skill can aid the character or another character who is going to force an entry point or try to sneak into the secured area by providing bonuses to those subsequent skill checks. Modifiers to subsequent skill checks are provided according to how well the character succeeds at analyzing the weak points of a secured area:
                - **Failure:** No modifier.
                - **Ordinary success:** -1 bonus.
                - **Good success:** -2 bonus.
                - **Amazing success:** -3 bonus. The analysis check is modified by how well the area is secured:
                - **No security:** No modifier.
                - **Marginal security:** +1 penalty.
                - **Ordinary security:** +2 penalty.
                - **Good security:** +3 penalty.
                - **Amazing security:** +4 penalty.

                ### Rank Benefits
                ⊗ **Rank 3, 6, 9 and 12 [Increased Effect]** As a character achieves higher ranks in this specialty, the situation die bonus on skill checks related to this specialty increases: **-1 step at rank 3**, **-2 steps at rank 6**, **-3 steps at rank 9**, and **-4 steps at rank 12**.
                This benefit applies to Cover Ops-Stealth skill checks to infiltrate secure areas, Computer Science-hacking skill checks to bypass security checkpoints, and other situations the GM deems appropriate.
          - es:
              name: Protocolos de Protección
              description: |-
                Esta habilidad representa la formación de un Personaje en procedimientos de protección de todo tipo. Tiene dos usos principales: **Asegurar un área** y **Analizar puntos débiles**.

                ### Proteger un área
                Con la cantidad adecuada de tiempo y cooperación, un Personaje puede establecer defensas y asegurar un área en mayor medida que antes. (Algunas áreas no se pueden asegurar o sólo se pueden asegurar con gran dificultad, lo que significa que se aplica una penalización Dado de Situación a la prueba de habilidad). El grado de éxito en la prueba de habilidad afecta el posterior
                **Comprobaciones de habilidades Alerta** de todos los que protegen el área contra intrusos:
                - **Fallo Crítico / Fallo:** Las comprobaciones Alerta del guardia(s) se realizan con una **penalización +1**.
                - **Ordinario:** El éxito provoca una **bonificación -1** en las pruebas de Alerta.
                - **Bueno:** Un **bono -2**.
                - **Asombroso:** Un **bono -3**.

                ### Analizar puntos débiles
                Un Personaje puede estudiar un área segura (cualquier cosa, desde un vehículo hasta un edificio o un vecindario) y buscar puntos débiles para explotar. Este uso de la habilidad puede ayudar al Personaje u otro Personaje que vaya a forzar un punto de entrada o intentar colarse en el área segura proporcionando bonificaciones a las comprobaciones de habilidad posteriores. Se proporcionan modificadores para las pruebas de habilidad posteriores según el éxito del Personaje en el análisis de los puntos débiles de un área segura:
                - **Fallo:** Sin modificador.
                - **Éxito de Ordinario:** -1 bonificación.
                - **Éxito de Bueno:** -2 bonificación.
                - **Éxito de Asombroso:** -3 de bonificación. La verificación del análisis se modifica según qué tan bien esté asegurada el área:
                - **Sin seguridad:** Sin modificador.
                - **Seguridad marginal:** +1 de penalización.
                - **Seguridad Ordinario:** Penalización +2.
                - **Seguridad Bueno:** Penalización +3.
                - **Seguridad Asombroso:** Penalización +4.

                ### Beneficios de Rango
                ⊗ **Rango 3, 6, 9 y 12 [Efecto aumentado]** A medida que un Personaje logra un Rangos más alto en esta especialidad, la bonificación de Dado de Situación en las pruebas de habilidad relacionadas con esta especialidad aumenta: **-1 paso en Rango 3**, **-2 pasos en Rango 6**, **-3 pasos en Rango 9** y **-4 pasos en Rango 12**.
                Este beneficio se aplica a las pruebas de habilidades de Cover Ops-Stealth para infiltrarse en áreas seguras, pruebas de habilidades de piratería informática para evitar los puntos de control de seguridad y situaciones Otros que el DJ considere apropiadas.
        trained_only: false
        rank_benefits:
          - rank: 3
            title: Increased Effect
          - rank: 6
            title: Increased Effect
          - rank: 9
            title: Increased Effect
          - rank: 12
            title: Increased Effect
      security-devices:
        attribute: INT
        cost: 4
        url: /skills/security#security-devices
        localized:
          - en:
              name: Security devices
              description: |-
                Using this skill, a character can attempt to bypass all types of mechanical or electronic security. This includes everything from traditional pin-tumbler locks and mechanical safes (picking) to high-tech motion sensors, trip wires, and electronic maglocks.

                It's also used to set traps, both electronic and mechanical in nature. One check can be made per round, and the character making the check is busy for the entire round (no other actions possible). In a situation that isn't taking place in rounds, the time unit changes from rounds to minutes. The traps covered by this skill do not include explosives, which are handled under the Demolitions specialty.

                ⊗ **Increased Effect:** As a character achieves higher ranks in this specialty, he receives a situation die bonus on this specialty skill: **-1 step at rank 3**, **-2 steps at rank 6**, **-3 steps at rank 9**, and **-4 steps at rank 12**.
          - es:
              name: Dispositivos de Seguridad
              description: |-
                Usando esta habilidad, un Personaje puede intentar eludir todo tipo de seguridad mecánica o electrónica. Esto incluye de todo, desde cerraduras tradicionales de pasador y cajas fuertes mecánicas (ganzamiento) hasta sensores de movimiento de alta tecnología, cables trampa y cerraduras magnéticas electrónicas.

                También se utiliza para colocar trampas, tanto de naturaleza electrónica como mecánica. Se puede realizar una verificación por ronda y el Personaje que realiza la verificación estará ocupado durante toda la ronda (no es posible realizar acciones con Otros). En una situación que no se desarrolla en rondas, la unidad de tiempo cambia de rondas a minutos. Las trampas cubiertas por esta habilidad no incluyen explosivos, que se manejan bajo la especialidad Demoliciones.

                ⊗ **Efecto aumentado:** A medida que un Personaje logra un Rangos más alto en esta especialidad, recibe una bonificación de Dado de Situación en este Especialidad: **-1 paso en Rango 3**, **-2 pasos en Rango 6**, **-3 pasos en Rango 9** y **-4 pasos en Rango 12**.
        trained_only: false
        rank_benefits:
          - rank: 3
            title: Increased Effect
          - rank: 6
            title: Increased Effect
          - rank: 9
            title: Increased Effect
          - rank: 12
            title: Increased Effect
    trained_only: false
  stamina:
    attribute: CON
    cost: 3
    category: Other
    url: /skills/stamina
    localized:
      - en:
          name: Stamina
          description: |-
            This broad skill measures a character's physical fortitude with regard to the effects of mortal damage and fatigue.
            **Note:** This skill is free to human, mechatus, sesheyan, t'sa, and weren characters.

            ### Dying
            A character who has suffered any amount of mortal damage is considered to be dying. At the end of a scene, a dying character (whether conscious or unconscious) makes a Stamina check.
            - **Critical Failure:** The character suffers **2 additional points** of mortal damage.
            - **Failure:** The character suffers **1 additional point** of mortal damage.
            - **Ordinary or better:** The character's condition is unchanged. The dying character makes additional Stamina checks **once per hour**, until he receives medical aid (see the Medical Science—surgery or Medical Science—treatment descriptions for details). The time between these Stamina checks can be lengthened to once per day if the character is helped by the application of Knowledge—first aid or Medical Science—treatment.

            ### Fatigue
            When a character engages in certain fatigue-causing activities, he must make a Stamina check. This check is made after the activity takes place, or at set intervals for certain types of activity (see “Fatigue Damage” in the rulebook).
            - **Critical Failure:** The character suffers **2 points** of fatigue damage.
            - **Failure:** Indicates **1 point** of damage.
            - **Success:** Indicates that no fatigue damage occurs as a result of the activity just completed.
      - es:
          name: Aguante
          description: |-
            Esta amplia habilidad mide la fortaleza Físico de Personaje con respecto a los efectos del daño Mortal y Fatiga.
            **Nota:** Esta habilidad es gratuita para personajes humanos, mechatus, sesheyan, t'sa y weren.

            ### Morir
            Se considera que un Personaje que ha sufrido cualquier daño de Mortal está muriendo. Al final de una escena, un Personaje moribundo (ya sea consciente o inconsciente) realiza una prueba de Aguante.
            - **Fallo Crítico:** El Personaje sufre **2 puntos adicionales** de daño del Mortal.
            - **Fallo:** El Personaje sufre **1 punto adicional** de daño del Mortal.
            - **Ordinario o mejor:** La condición de Personaje no cambia. El Personaje moribundo realiza controles adicionales de Aguante **una vez por hora**, hasta que recibe asistencia médica (consulte las descripciones de Ciencias médicas—cirugía o Ciencias médicas—tratamiento para obtener más detalles). El tiempo entre estas comprobaciones de Aguante se puede alargar a una vez por día si el Personaje recibe ayuda de la aplicación del tratamiento de Conocimiento (primeros auxilios o Ciencias médicas).

            ### Fatiga
            Cuando un Personaje participa en ciertas actividades que causan Fatiga, debe realizar una verificación de Aguante. Esta verificación se realiza después de que se lleva a cabo la actividad, o en intervalos establecidos para ciertos tipos de actividad (consulte “Daño Fatiga” en el libro de reglas).
            - **Fallo Crítico:** El Personaje sufre **2 puntos** de daño del Fatiga.
            - **Fallo:** Indica **1 punto** de daño.
            - **Éxito:** Indica que no se produce ningún daño en Fatiga como resultado de la actividad que se acaba de completar.
    items:
      endurance:
        attribute: CON
        cost: 4
        url: /skills/stamina#endurance
        localized:
          - en:
              name: Endurance
              description: |-
                As a character acquires ranks in the endurance skill, he becomes more able to withstand the effects of damage. For a character who has this specialty, endurance checks take the place of Stamina checks for damage and fatigue.

                ⊗ **Rank 4, 8, and 12 [Improved Breathing]** The bonus to a character's Stamina-endurance check while holding his or her breath improves to **-2 at rank 4**, **-3 at rank 8**, and **-4 at rank 12**.
          - es:
              name: Resistencia
              description: |-
                A medida que Personaje adquiere Rangos en la habilidad Resistencia, se vuelve más capaz de resistir los efectos del daño. Para un Personaje que tiene esta especialidad, los controles Resistencia reemplazan a los controles Aguante de daños y Fatiga.

                ⊗ **Rango 4, 8 y 12 [Respiración mejorada]** La bonificación a la prueba Aguante-Resistencia de un Personaje mientras contiene la respiración mejora a **-2 en Rango 4**, **-3 en Rango 8** y **-4 en Rango 12**.
        trained_only: false
        rank_benefits:
          - rank: 4
            title: Improved Breathing
          - rank: 8
            title: Improved Breathing
          - rank: 12
            title: Improved Breathing
      resist-pain:
        attribute: CON
        cost: 5
        url: /skills/stamina#resist-pain
        localized:
          - en:
              name: Resist pain
              description: |-
                Resist pain allows a character to function normally and ignore some or all of the situation penalties for suffering large amounts of stun, wound, or mortal (but not fatigue) damage. A character with this specialty may get an opportunity **once per combat scene** to check the effectiveness of his ability to resist pain. The first time during a combat scene when the character has received stun points or wound points, or when he receives at least 1 point of mortal damage, he makes a resist pain skill check.
                **Note:** This check does not count as an action, and takes place before any characters attempt any actions. The result of the resist pain check lasts for the rest of the combat scene.
                ### Results
                - **Critical Failure:** The character succumbed to the pain and **can''t act for 2d4 phases**.
                - **Failure:** The character succumbs to the pain and suffers the normal damage penalties.
                - **Ordinary:** The character ignores **1 step** of penalty.
                - **Good:** The character ignores **2 steps** of penalty.
                - **Amazing:** The character ignores **3 steps** of penalty.
                **Benefit Consolidation:** Resist pain only helps to lessen or eliminate situation penalties caused by cumulative damage. The benefit a character receives from a successful skill check can''t be used to turn a penalty into a bonus. (If a character only has a +1 penalty due to damage when the check is made but the result indicates a reduction of 2 points of penalty, the character gets no immediate benefit from the extra reduction—but it might come into play if he suffers damage later in the scene). Having this skill doesn''t help a character stave off dying or death results.
          - es:
              name: Resist pain
              description: |-
                Resistir el dolor permite que un Personaje funcione normalmente e ignore algunas o todas las penalizaciones de la situación por sufrir grandes cantidades de daño Aturdimiento, Herida o Mortal (pero no Fatiga). Un Personaje con esta especialidad puede tener la oportunidad **una vez por escena de Combate** de comprobar la eficacia de su capacidad para resistir el dolor. La primera vez durante una escena Combate cuando Personaje ha recibido puntos Aturdimiento o puntos Herida, o cuando recibe al menos 1 punto de daño Mortal, realiza una prueba de habilidad de resistir el dolor.
                **Nota:** Esta prueba no cuenta como una acción y se lleva a cabo antes de que cualquier personaje intente realizar alguna acción. El resultado de la prueba de resistencia al dolor dura por el resto de la escena Combate.
                ### Resultados
                - **Fallo Crítico:** El Personaje sucumbió al dolor y **no puede actuar durante 2d4 fases**.
                - **Fallo:** El Personaje sucumbe al dolor y sufre las penalizaciones de daño normales.
                - **Ordinario:** El Personaje ignora **1 paso** de penalización.
                - **Bueno:** El Personaje ignora **2 pasos** de penalización.
                - **Asombroso:** El Personaje ignora **3 pasos** de penalización.
                **Consolidación de beneficios:** Resistir el dolor solo ayuda a disminuir o eliminar las penalizaciones de la situación causadas por el daño acumulativo. El beneficio que recibe un Personaje por una prueba de habilidad exitosa no puede usarse para convertir una penalización en una bonificación. (Si un Personaje solo tiene una penalización de +1 debido al daño cuando se realiza la prueba pero el resultado indica una reducción de 2 puntos de penalización, el Personaje no obtiene ningún beneficio inmediato de la reducción adicional, pero podría entrar en juego si sufre daño más adelante en la escena). Tener esta habilidad no ayuda a Personaje a evitar la muerte o los resultados de muerte.
        trained_only: true
    trained_only: false
  street-smart:
    attribute: WIL
    cost: 3
    category: Social
    url: /skills/street-smart
    localized:
      - en:
          name: Street Smart
          description: |-
            This broad skill provides a character with general knowledge in the protocols of "the street." It measures a character''s ability to negotiate and make contact with the realm of blue-collar crime, gangs, and illicit dealers. Street Smart and its specialties are encounter skills.
            ### Street Smart Situation Modifiers
            | Condition | Modifier | | :--- | :--- | | Society has no law | -3 steps | | Society has Good law | +2 steps | | Society has Amazing law | +3 steps | | Belongs to similar group | -1 step | | Belongs to same group | -2 steps | | Belongs to opposed group | +3 steps | | Has local contact | -1 step | | Has Reputation perk | -1 step | | Is an obvious stranger | +1 step | | Has Infamy flaw | +1 step | | Seeks Ordinary assistance | -1 step | | Seeks Good assistance | +2 steps | | Seeks Amazing assistance | +4 steps |
      - es:
          name: Callejeo
          description: |-
            Esta amplia habilidad proporciona a Personaje un conocimiento general de los protocolos de "la calle". Mide la capacidad de un Personaje para negociar y establecer contacto con el ámbito de los delitos manuales, las pandillas y los traficantes ilícitos. Callejeo y sus especialidades son las habilidades de encuentro.
            ### Modificadores de situación Callejeo
            | Condición | Modificador | | :--- | :--- | | La sociedad no tiene ley | -3 pasos | | La sociedad tiene ley Bueno | +2 pasos | | La sociedad tiene la ley Asombroso | +3 pasos | | Pertenece a un grupo similar | -1 paso | | Pertenece al mismo grupo | -2 pasos | | Pertenece al grupo opuesto | +3 pasos | | Tiene contacto local | -1 paso | | Tiene reputación Ventaja | -1 paso | | Es un obvio extraño | +1 paso | | Tiene Infamia Defecto | +1 paso | | Busca asistencia Ordinario | -1 paso | | Busca asistencia Bueno | +2 pasos | | Busca asistencia Asombroso | +4 pasos |
    items:
      street-knowledge:
        attribute: WIL
        cost: 3
        url: /skills/street-smart#street-knowledge
        localized:
          - en:
              name: Street Knowledge
              description: |-
                This skill enables a character to improve his familiarity with the inner workings of a particular organization or geographical area. When he acquires the broad skill Street Knowledge, he must select one organization or area to apply it to. After spending some time investigating an area or organization (as determined by the GM) he gains the ability apply this skill in that area or organization.
          - es:
              name: Habilidades de Especialidad
              description: |-
                Esta habilidad permite a un Personaje mejorar su familiaridad con el funcionamiento interno de una organización o área geográfica en particular. Cuando adquiere la habilidad amplia Street Knowledge, debe seleccionar una organización o área para aplicarla. Después de pasar algún tiempo investigando un área u organización (según lo determine el DJ), obtiene la capacidad de aplicar esta habilidad en esa área u organización.
        trained_only: false
      criminal-elements:
        attribute: WIL
        cost: 5
        url: /skills/street-smart#criminal-elements
        localized:
          - en:
              name: Criminal elements
              description: |-
                This specialty skill represents a character''s ability to make contact with and deal with those who are considered part of the criminal element—organized crime, professional criminals, street gangs, and underworld organizations. Whenever a character tries to locate or interact with these groups, he uses this skill.
          - es:
              name: Criminal elements
              description: |-
                Este Especialidad representa la capacidad de un Personaje para establecer contacto y tratar con aquellos que se consideran parte del elemento criminal: crimen organizado, delincuentes profesionales, pandillas callejeras y organizaciones del hampa. Siempre que un Personaje intenta localizar o interactuar con estos grupos, utiliza esta habilidad.
        trained_only: false
    trained_only: false
  survival:
    attribute: CON
    cost: 3
    category: Other
    url: /skills/survival
    localized:
      - en:
          name: Survival
          description: |-
            This broad skill provides a character with training in survival across wilderness, ruined/hostile urban landscapes, and alien biospheres. It covers procuring necessities (food, water, shelter), avoiding environmental hazards, and systematic ecological study. Checks are made **once each day** unless the GM determines otherwise.

            ### Survival Results
            - **Failure:** The character can''t acquire basic necessities for this day.
            - **Ordinary:** The character acquires enough basic necessities to sustain himself for this day.
            - **Good:** The character acquires enough basic necessities for himself and up to **six others** for this day.
            - **Amazing:** The character becomes so familiar with the locale that survival is no longer an issue unless the situation changes.

            ### Survival Situation Modifiers
            The type of terrain or environment where the character is located can provide a modifier to the skill check: 

            | Terrain / Situation | Modifier |
            | :--- | :--- |
            | **Arctic terrain** | +4 |
            | **Arid or wasteland terrain** | +3 |
            | **Mountainous terrain** | +2 |
            | **Swamp or ocean** | +1 |
            | **Forest or grassland** | 0 |
            | **Dense vegetation** | -1 |
            | **Jungle terrain** | -2 |
            | **Small settlement** | -1 |
            | **Small city or space station** | -2 |
            | **Large city or space station** | -3 |

            ### Survival on Other Worlds
            The Survival skill is primarily designed for Earth-like environments. If a character is on an alien world, the given situation modifiers might still apply (assuming local flora/fauna are edible). If an environment is drastically different from a character's native experience, the character should use the [Survival – Adaptability](/skills/survival#adaptability) specialty to bridge the gap. The use of the Survival skill might still be **impossible** in certain extreme situations—for instance, a barren/airless asteroid without existing protective gear.
      - es:
          name: Supervivencia
          description: |-
            Esta amplia habilidad proporciona a un Personaje entrenamiento en supervivencia en áreas silvestres, paisajes urbanos hostiles/en ruinas y biosferas alienígenas. Cubre las necesidades de adquisición (alimentos, agua, refugio), evitando peligros ambientales y un estudio ecológico sistemático. Las comprobaciones se realizan **una vez al día** a menos que el director general determine lo contrario.

            ### Resultados de supervivencia
            - **Falla:** El Personaje no puede adquirir las necesidades básicas para este día.
            - **Ordinario:** El Personaje adquiere suficientes necesidades básicas para sustentarse durante este día.
            - **Bueno:** El Personaje adquiere suficientes necesidades básicas para él y hasta **seis personas más** para este día.
            - **Asombroso:** El Personaje se familiariza tanto con el lugar que la supervivencia ya no es un problema a menos que la situación cambie.

            ### Modificadores de situaciones de supervivencia
            El tipo de terreno o entorno donde se encuentra el Personaje puede proporcionar un modificador a la prueba de habilidad:

            | Terreno / Situación | Modificador |
            | :--- | :--- |
            | **Terreno ártico** | +4 |
            | **Terreno árido o baldío** | +3 |
            | **Terreno montañoso** | +2 |
            | **Pantano u océano** | +1 |
            | **Bosque o pastizal** | 0 |
            | **Vegetación densa** | -1 |
            | **Terreno de jungla** | -2 |
            | **Pequeño asentamiento** | -1 |
            | **Pequeña ciudad o estación espacial** | -2 |
            | **Gran ciudad o estación espacial** | -3 |

            ### Supervivencia en los mundos Otros
            La habilidad Supervivencia está diseñada principalmente para entornos similares a la Tierra. Si un Personaje está en un mundo alienígena, los modificadores de situación dados aún podrían aplicarse (suponiendo que la flora/fauna local sea comestible). Si un entorno es drásticamente diferente de la experiencia nativa de un Personaje, Personaje debería usar la especialidad [Supervivencia – Adaptabilidad](/skills/survival#adaptability) para cerrar la brecha. El uso de la habilidad Supervivencia aún podría ser **imposible** en ciertas situaciones extremas, por ejemplo, un asteroide árido o sin aire sin equipo de protección existente.
    items:
      survival-training:
        attribute: CON
        cost: 3
        url: /skills/survival#survival-training
        localized:
          - en:
              name: Survival training
              description: 'This specialty skill enables a character to improve his ability to use the Survival broad skill in a certain type of terrain. If he wants to improve his skill in more than one type of terrain, he must first succeed on a **Survival – Adaptability** challenge and master the terrain.

                Available terrain types include all of those listed in the “Survival Situation Modifiers” sidebar, plus any other type the Gamemaster allows.


                When starting a new campaign, a character can buy ranks in this skill for any terrain the GM consider reasonable for the character''s background and concept.'
          - es:
              name: Apertura de Sendas
              description: |-
                Este Especialidad permite a un Personaje mejorar su capacidad para usar la habilidad amplia de Supervivencia en un determinado tipo de terreno. Si quiere mejorar su habilidad en más de un tipo de terreno, primero debe superar un desafío de **Supervivencia - Adaptabilidad** y dominar el terreno.
                Los tipos de terreno disponibles incluyen todos los enumerados en la barra lateral "Modificadores de situación de supervivencia", además de cualquier tipo de Otros que permita el Director de Juego.

                Al comenzar una nueva campaña, un Personaje puede comprar Rangos en esta habilidad para cualquier terreno que el DJ considere razonable para los antecedentes y el concepto de Personaje.
        trained_only: false
      adaptability:
        attribute: CON
        cost: 3
        url: /skills/survival#adaptability
        localized:
          - en:
              name: Adaptability
              description: |-
                This specialty improves a character’s ability to adapt to alien environments. The character is resourceful enough to grasp unknown survival mechanics through observation and study.
                ### Mastering Alien Environments
                A character can perform a **Survival—Adaptability** challenge, spend studying the environment (one check per day).
                - **Initial Success:** Allows the character to use their **Survival Training** specialty in the alien environment, but with an **additional +5 step penalty**.
                - **Progression:** For every **3 additional successes** achieved in the challenge, this penalty is reduced by one step (to a minimum of the base terrain modifier).
                - **Mastery:** Once the character reduces the penalty entirely, they have **mastered the terrain** and automatically receive **one rank** in a new **Survival Training** specialty for that specific environment. A character **cannot buy** or increase their rank in a new terrain type through experience points until they have fully mastered it through the Adaptability challenge.
          - es:
              name: Adaptabilidad
              description: |-
                Esta especialidad mejora la capacidad de Personaje para adaptarse a entornos alienígenas. El Personaje tiene el ingenio suficiente para comprender mecanismos de supervivencia desconocidos mediante la observación y el estudio.
                ### Dominar entornos alienígenas
                Un Personaje puede realizar un desafío de **Supervivencia—Adaptabilidad**, dedicado a estudiar el medio ambiente (una verificación por día).
                - **Éxito inicial:** Permite que Personaje use su especialidad de **Entrenamiento de supervivencia** en el entorno alienígena, pero con un **+5 Penalización de paso** adicional.
                - **Progresión:** Por cada **3 Éxitos** adicionales logrados en el desafío, esta penalización se reduce en un paso (hasta un mínimo del modificador de terreno base).
                - **Maestría:** Una vez que el Personaje reduce la penalización por completo, **domina el terreno** y recibe automáticamente **un Rango** en una nueva especialidad de **Entrenamiento de supervivencia** para ese entorno específico. Un Personaje **no puede comprar** ni aumentar su Rango en un nuevo tipo de terreno a través de puntos de experiencia hasta que lo haya dominado por completo a través del desafío de Adaptabilidad.
        trained_only: false
      trailblazing:
        attribute: CON
        cost: 3
        url: /skills/survival#trailblazing
        localized:
          - en:
              name: Trailblazing
              description: |-
                With trailblazing, a character learns to find paths through rough terrain or create paths that others can use to move faster and cover more ground during a full day's travel. The successful use of this skill reduces the adverse effects of traveling in conditions of Good or Amazing difficulty for the character and any companions who are traveling with him. This skill check is made once per day, at the beginning of a day of travel.

                ### Results
                - **Critical Failure:** The character picks a route that is worse than the other travelers could have found for themselves, causing everyone in the group to suffer an
                **additional +1 penalty to their fatigue checks**, on top of any other penalties.
                - **Failure:** No help is provided.
                - **Ordinary success:** Provides a **reduction of 1 step** to any penalties that apply.
                - **Good success:** Reduces penalties by **2 steps**.
                - **Amazing success:** Reduces penalties by **3 steps**. Note: This reduction can't be used to turn a penalty into a bonus; the best possible result is negating a penalty altogether.
          - es:
              name: Trailblazing
              description: |-
                Al ser pionero, un Personaje aprende a encontrar caminos a través de terrenos accidentados o a crear caminos que otros pueden usar para moverse más rápido y cubrir más terreno durante un viaje de un día completo. El uso exitoso de esta habilidad reduce los efectos adversos de viajar en condiciones de dificultad Bueno o Asombroso para Personaje y cualquier acompañante que viaje con él. Esta prueba de habilidad se realiza una vez al día, al comienzo de un día de viaje.

                ### Resultados
                - **Fallo Crítico:** El Personaje elige una ruta que es peor que la que los viajeros del Otros podrían haber encontrado por sí mismos, lo que provoca que todos los miembros del grupo sufran un
                **penalización adicional de +1 a sus controles de Fatiga**, además de cualquier penalización de Otros.
                - **Error:** No se proporciona ayuda.
                - **Éxito de Ordinario:** Proporciona una **reducción de 1 paso** a cualquier penalización que se aplique.
                - **Éxito de Bueno:** Reduce las penalizaciones en **2 pasos**.
                - **Éxito de Asombroso:** Reduce las penalizaciones en **3 pasos**. Nota: Esta reducción no se puede utilizar para convertir una penalización en una bonificación; el mejor resultado posible es anular la penalización por completo.
        trained_only: false
    trained_only: false
  system-operation:
    attribute: INT
    cost: 3
    category: Technical
    url: /skills/system-operation
    localized:
      - en:
          name: System Operation
          description: |-
            This broad skill provides a character with basic training in the use of spaceship systems other than the helm or piloting systems. (Vehicle Operation covers the actual piloting of a spaceship).

            It also applies to other types of vehicles or installations that use one or more of the specific systems described below in the Specialty Skills section. These other vehicles and installations include (but are not limited to) large water vessels such as battleships, military submarines, and cargo ships; jet fighters and large commercial aircraft; and radar outposts and gun emplacements, space stations, etc. 

            For full details on how **System Operation** skills are used, see the sections on ["What's in a Spaceship?"](/core-mechanics/vehicles-and-vessels/) and ["Space Vehicle Combat"](/core-mechanics/vehicles-and-vessels#space-vehicle-combat).
      - es:
          name: Operación de Sistemas
          description: |-
            Esta amplia habilidad proporciona a un Personaje una formación básica en el uso de sistemas de naves espaciales Otros además del timón o los sistemas de pilotaje. (La Operación del Vehículo cubre el pilotaje real de una nave espacial).

            También se aplica a los tipos de vehículos o instalaciones Otros que utilizan uno o más de los sistemas específicos que se describen a continuación en la sección de Habilidades Especiales. Estos vehículos e instalaciones Otros incluyen (pero no se limitan a) grandes embarcaciones como acorazados, submarinos militares y buques de carga; aviones de combate y grandes aviones comerciales; y puestos de avanzada de radar y emplazamientos de armas, estaciones espaciales, etc.

            Para obtener detalles completos sobre cómo se utilizan las habilidades de **Operación del sistema**, consulte las secciones sobre ["¿Qué hay en una nave espacial?"](/core-mechanics/vehicles-and-vessels/) y ["Vehículo espacial Combate"](/core-mechanics/vehicles-and-vessels#space-vehicle-combat).
    items:
      communications:
        attribute: INT
        cost: 3
        url: /skills/system-operation#communications
        localized:
          - en:
              name: Communications
              description: |-
                A communications specialist can operate all shipboard and personal communication gear with precision, attempt to decipher coded communication signals, code outgoing messages, jam external communication and sensor signals, and try to overcome jamming from an outside source.
          - es:
              name: Comunicaciones
              description: |-
                Un especialista en comunicaciones puede operar con precisión todos los equipos de comunicación personales y a bordo, intentar descifrar señales de comunicación codificadas, codificar mensajes salientes, bloquear las comunicaciones externas y las señales de los sensores, e intentar superar las interferencias de una fuente externa.
        trained_only: false
      defenses:
        attribute: INT
        cost: 3
        url: /skills/system-operation#defenses
        localized:
          - en:
              name: Defenses
              description: |-
                A defenses specialist can operate all shipboard defensive systems with precision, attempt to direct defenses to parts of the ship where they''re most needed, and analyze attack patterns to make best use of the defenses his ship possesses. In space vehicle combat, the defenses operator can provide a penalty to an opponent''s weapons or sensors during any given attack.
          - es:
              name: Defensas
              description: |-
                Un especialista en defensas puede operar todos los sistemas defensivos a bordo con precisión, intentar dirigir las defensas a las partes del barco donde más se necesitan y analizar patrones de ataque para aprovechar al máximo las defensas que posee su barco. En el vehículo espacial Combate, el operador de las defensas puede penalizar las armas o sensores del oponente durante cualquier ataque.
        trained_only: false
      engineering:
        attribute: INT
        cost: 3
        url: /skills/system-operation#engineering
        localized:
          - en:
              name: Engineering
              description: |-
                An engineering specialist monitors a ship''s electronic and mechanical systems as a whole, watching for fluctuations and other signs that a component is breaking down. He can institute repairs to damaged systems from his station, route power to specific systems, and direct hands-on repairs at remote locations.
          - es:
              name: Ingeniería
              description: |-
                Un especialista en ingeniería monitorea los sistemas electrónicos y mecánicos de un barco en su conjunto, observando fluctuaciones y Otros señales de que un componente se está averiando. Puede realizar reparaciones de sistemas dañados desde su estación, dirigir energía a sistemas específicos y realizar reparaciones prácticas en ubicaciones remotas.
        trained_only: false
      sensors:
        attribute: INT
        cost: 3
        url: /skills/system-operation#sensors
        localized:
          - en:
              name: Sensors
              description: |-
                A sensors specialist can operate all shipboard and personal sensor gear with precision, attempt to scan ships or planets, and analyze those readings in a short period of time. He can use the data to provide bonuses to a weapons or defenses operator.
          - es:
              name: Sensores
              description: |-
                Un especialista en sensores puede operar con precisión todos los equipos de sensores personales y a bordo, intentar escanear barcos o planetas y analizar esas lecturas en un corto período de tiempo. Puede utilizar los datos para proporcionar bonificaciones a un operador de armas o defensas.
        trained_only: false
      weapons:
        attribute: INT
        cost: 6
        url: /skills/system-operation#weapons
        localized:
          - en:
              name: Weapons
              description: |-
                A weapons specialist can operate all shipboard weapons systems with precision. In starship combat, the weapons operator picks targets and makes attacks.
          - es:
              name: Armas
              description: |-
                Un especialista en armas puede operar con precisión todos los sistemas de armas a bordo. En la nave espacial Combate, el operador de armas elige objetivos y realiza ataques.
        trained_only: false
    trained_only: false
  tactics:
    attribute: INT
    cost: 6
    category: Combat
    url: /skills/tactics
    localized:
      - en:
          name: Tactics
          description: |-
            This broad skill provides a character with basic training in and an understanding of tactics and tactical situations. While tactics may come into play in many types of situations, it''s most commonly used during infantry combat, space combat, and vehicle combat. A successful use of the skill provides a penalty to the opponent''s next skill check, indicating that you developed a tactical plan and successfully employed it against him.
            ### Tactics Check Results
            - **Critical Failure:** The opponent sees through your intentions and receives a **-1 bonus** on their next skill check.
            - **Failure:** No modifier to the opponent''s next skill check.
            - **Ordinary:** **+1 penalty** to the opponent''s next skill check.
            - **Good:** **+2 penalty** to the opponent''s next skill check.
            - **Amazing:** **+3 penalty** to the opponent''s next skill check.
      - es:
          name: Táctica
          description: |-
            Esta amplia habilidad proporciona al Personaje entrenamiento básico y comprensión de tácticas y situaciones tácticas. Si bien las tácticas pueden entrar en juego en muchos tipos de situaciones, se usan más comúnmente durante Combate de infantería, Combate espacial y Combate de vehículos. Un uso exitoso de la habilidad proporciona una penalización a la siguiente prueba de habilidad del oponente, lo que indica que desarrollaste un plan táctico y lo empleaste con éxito contra él.
            ### Tácticas Verificar resultados
            - **Fallo Crítico:** El oponente ve tus intenciones y recibe una **bonificación -1** en su próxima prueba de habilidad.
            - **Fallo:** No hay modificador para la siguiente prueba de habilidad del oponente.
            - **Ordinario:** **penalización +1** a la siguiente prueba de habilidad del oponente.
            - **Bueno:** **penalización +2** a la siguiente prueba de habilidad del oponente.
            - **Asombroso:** **penalización +3** a la siguiente prueba de habilidad del oponente.
    items:
      infantry-tactics:
        attribute: INT
        cost: 3
        url: /skills/tactics#infantry-tactics
        localized:
          - en:
              name: Infantry tactics
              description: |-
                The specialty skill covers battlefield strategies when the main component of the battle is individual troops.

                ### Rank Benefits
                ⊗ **Increased Effect:** As a character achieves higher ranks in a Tactics specialty skill, he receives a situation die bonus for dealing with opposing forces (infantry, space vessels, or vehicles). The bonus is **-1 step at rank 4**, **-2 steps at rank 8**, and **-3 steps at rank 12**.
          - es:
              name: Táctica de Infantería
              description: |-
                El Especialidad cubre estrategias en el campo de batalla cuando el componente principal de la batalla son tropas individuales.

                ### Beneficios de Rango
                ⊗ **Efecto aumentado:** A medida que un Personaje logra un Rangos más alto en una Táctica Especialidad, recibe una bonificación de Dado de Situación por lidiar con fuerzas opuestas (infantería, naves espaciales o vehículos). La bonificación es **-1 paso en Rango 4**, **-2 pasos en Rango 8** y **-3 pasos en Rango 12**.
        trained_only: false
        rank_benefits:
          - rank: 4
            title: Increased Effect
          - rank: 8
            title: Increased Effect
          - rank: 12
            title: Increased Effect
      space-tactics:
        attribute: INT
        cost: 3
        url: /skills/tactics#space-tactics
        localized:
          - en:
              name: Space tactics
              description: |-
                Battlefield strategies involving combat between spaceships.

                ### Rank Benefits
                ⊗ **Increased Effect:** As a character achieves higher ranks in a Tactics specialty skill, he receives a situation die bonus for dealing with opposing forces. The bonus is **-1 step at rank 4**, **-2 steps at rank 8**, and **-3 steps at rank 12**.
          - es:
              name: Táctica Espacial
              description: |-
                Estrategias de campo de batalla que involucran Combate entre naves espaciales.

                ### Beneficios de Rango
                ⊗ **Efecto aumentado:** A medida que un Personaje logra un Rangos más alto en una Táctica Especialidad, recibe una bonificación de Dado de Situación por lidiar con fuerzas opuestas. La bonificación es **-1 paso en Rango 4**, **-2 pasos en Rango 8** y **-3 pasos en Rango 12**.
        trained_only: false
        rank_benefits:
          - rank: 4
            title: Increased Effect
          - rank: 8
            title: Increased Effect
          - rank: 12
            title: Increased Effect
      vehicle-tactics:
        attribute: INT
        cost: 3
        url: /skills/tactics#vehicle-tactics
        localized:
          - en:
              name: Vehicle tactics
              description: |-
                Battlefield strategies involving combat where vehicles other than starships (air, land, or water) are the main component.

                ### Rank Benefits
                ⊗ **Increased Effect:** As a character achieves higher ranks in a Tactics specialty skill, he receives a situation die bonus for dealing with opposing forces. The bonus is **-1 step at rank 4**, **-2 steps at rank 8**, and **-3 steps at rank 12**.
          - es:
              name: Táctica de Vehículos
              description: |-
                Estrategias de campo de batalla que involucran Combate donde los vehículos Otros más que las naves espaciales (aire, tierra o agua) son el componente principal.

                ### Beneficios de Rango
                ⊗ **Efecto aumentado:** A medida que un Personaje logra un Rangos más alto en una Táctica Especialidad, recibe una bonificación de Dado de Situación por lidiar con fuerzas opuestas. La bonificación es **-1 paso en Rango 4**, **-2 pasos en Rango 8** y **-3 pasos en Rango 12**.
        trained_only: false
        rank_benefits:
          - rank: 4
            title: Increased Effect
          - rank: 8
            title: Increased Effect
          - rank: 12
            title: Increased Effect
    trained_only: false
  technical-science:
    attribute: INT
    cost: 7
    category: Technical
    url: /skills/technical-science
    localized:
      - en:
          name: Technical Science
          description: |-
            This broad skill represents a character's training in the technical sciences, including the maintenance, repair, and invention of mechanical and electronic devices (not including computers), and general technical knowledge. Skill checks made to determine if a character knows a certain piece of technical information, or if he's able to research a question and discover an answer, are made the same way as **Knowledge** skill checks.

            ### Technical Science Situation Modifiers

            | Situation | Modifier |
            | :--- | :--- |
            | **No tools** | +3 steps |
            | **Minimal tools** | 0 |
            | **Standard toolkit** | -1 step |
            | **Specialized toolkit** | -2 steps |
            | **Darkness** | +3 steps |
            | **Marginal illumination** | +1 step |
            | **Ordinary illumination** | 0 |
            | **Good illumination** | -1 step |
            | **No deadline** | -2 steps |
            | **Reasonable deadline** | 0 |
            | **Tight deadline** | +1 step |
            | **Unreasonable deadline** | +3 steps |
      - es:
          name: Ciencia técnica
          description: |-
            Esta amplia habilidad representa la capacitación de un Personaje en las ciencias de Técnico, incluido el mantenimiento, reparación e invención de dispositivos mecánicos y electrónicos (sin incluir computadoras) y el conocimiento general de Técnico. Las comprobaciones de habilidades realizadas para determinar si un Personaje conoce cierta información de Técnico, o si es capaz de investigar una pregunta y descubrir una respuesta, se realizan de la misma manera que las comprobaciones de habilidades de **Conocimiento**.

            ### Modificadores de situación Ciencia técnica

            | Situación | Modificador |
            | :--- | :--- |
            | **Sin herramientas** | +3 pasos |
            | **Herramientas mínimas** | 0 |
            | **Kit de herramientas estándar** | -1 paso |
            | **Kit de herramientas especializado** | -2 pasos |
            | **Oscuridad** | +3 pasos |
            | **Iluminación marginal** | +1 paso |
            | **Iluminación Ordinario** | 0 |
            | **Iluminación Bueno** | -1 paso |
            | **Sin fecha límite** | -2 pasos |
            | **Plazo razonable** | 0 |
            | **Plazo ajustado** | +1 paso |
            | **Plazo no razonable** | +3 pasos |
    items:
      technical-knowledge:
        attribute: INT
        cost: 3
        url: /skills/technical-science#technical-knowledge
        localized:
          - en:
              name: Technical Knowledge
              description: |-
                This skill represents the study of technology and indicates how up-to-date a character is on techniques or procedures that help him manipulate tools and other devices. It is necessary for a character to use certain sophisticated or potentially dangerous tools, such as a cutting torch, without risking personal injury or damage to the tool.

                ### Rank Benefits
                ⊗ **Increased Effect:** As a character’s specialty skill rank increases, he receives a bonus to any skill checks involving Technical Science or the other three specialty skills: **-1 step at rank 3**, **-2 at rank 6**, **-3 at rank 9**, and **-4 at rank 12**.
          - es:
              name: Remendar
              description: |-
                Esta habilidad representa el estudio de la tecnología e indica qué tan actualizado está un Personaje en técnicas o procedimientos que lo ayudan a manipular herramientas y dispositivos Otros. Es necesario que un Personaje utilice ciertas herramientas sofisticadas o potencialmente peligrosas, como un soplete de corte, sin correr el riesgo de sufrir lesiones personales o daños a la herramienta.

                ### Beneficios de Rango
                ⊗ **Efecto aumentado:** A medida que Especialidad Rango de Personaje aumenta, recibe una bonificación a cualquier prueba de habilidad que involucre a Ciencia técnica o Otros tres habilidades especiales: **-1 paso en Rango 3**, **-2 en Rango 6**, **-3 en Rango 9** y **-4 en Rango 12**.
        trained_only: false
        rank_benefits:
          - rank: 3
            title: Increased Effect
          - rank: 6
            title: Increased Effect
          - rank: 9
            title: Increased Effect
          - rank: 12
            title: Increased Effect
      invention:
        attribute: INT
        cost: 3
        url: /skills/technical-science#invention
        localized:
          - en:
              name: Invention
              description: |-
                Invention lets a character build an electronic or mechanical component or system from scratch, or to modify an existing device to perform a new function. Using this skill requires time; Invention checks are always complex skill checks. Modifying an existing item may be able to be done in rounds, but all other aspects of invention require hours, days, weeks, or months, depending on the determination of the Gamemaster.
          - es:
              name: Reparación
              description: |-
                La invención permite a un Personaje construir un componente o sistema electrónico o mecánico desde cero, o modificar un dispositivo existente para realizar una nueva función. Usar esta habilidad requiere tiempo; Las pruebas de invención son siempre pruebas de habilidades complejas. Es posible que la modificación de un elemento existente se pueda realizar en rondas, pero todos los aspectos de la invención Otros requieren horas, días, semanas o meses, dependiendo de la determinación de Director de Juego.
        trained_only: false
        rank_benefits:
          - rank: 3
            title: Increased Effect
          - rank: 6
            title: Increased Effect
          - rank: 9
            title: Increased Effect
          - rank: 12
            title: Increased Effect
      repair:
        attribute: INT
        cost: 3
        url: /skills/technical-science#repair
        localized:
          - en:
              name: Repair
              description: |-
                This skill provides a character with training in the repair and maintenance of various types of mechanical and electronic technology. Any use of the repair skill requires a complex skill check and takes a period of time determined by the Gamemaster (minutes, hours, days, or weeks). The complexity of a repair skill check is related to the amount of damage that must be repaired:
                - **Stun Damage:** Fix an object with only stun damage is **Ordinary** complexity.
                - **Wound Damage:** Fix an object with wound damage is **Good** complexity.
                - **Mortal Damage:** Fixing an object with any amount of mortal damage is **Amazing** complexity (and may require 10+ successes).
          - es:
              name: Repair
              description: |-
                Esta habilidad proporciona al Personaje capacitación en la reparación y mantenimiento de diversos tipos de tecnología mecánica y electrónica. Cualquier uso de la habilidad de reparación requiere una prueba de habilidad compleja y requiere un período de tiempo determinado por el Director de Juego (minutos, horas, días o semanas). La complejidad de una prueba de habilidad de reparación está relacionada con la cantidad de daño que se debe reparar:
                - **Daño Aturdimiento:** Reparar un objeto con solo daño Aturdimiento tiene complejidad **Ordinario**.
                - **Daño Herida:** Reparar un objeto con daño Herida tiene complejidad **Bueno**.
                - **Daño Mortal:** Reparar un objeto con cualquier cantidad de daño Mortal tiene una complejidad **Asombroso** (y puede requerir 10+ Éxitos).
        trained_only: false
        rank_benefits:
          - rank: 3
            title: Increased Effect
          - rank: 6
            title: Increased Effect
          - rank: 9
            title: Increased Effect
          - rank: 12
            title: Increased Effect
      juryrig:
        attribute: INT
        cost: 3
        url: /skills/technical-science#juryrig
        localized:
          - en:
              name: Juryrig
              description: |-
                This skill enables a character to make fast, patchwork repairs in order to get an electronic or mechanical device or system up and running for a short period of time. A juryrig repair, even when successful, adds difficulty to the full repairs that must be made later, but it can get a character through a sticky situation. A juryrig repair can be made successfully **once** on a specific system or item. If it breaks down after being juryrigged, the system or item won't work again until it's completely fixed (using Technical Science—repair). Making a juryrig skill check is a single action, but a character who tries to use this skill must do so on his first available action in a round, and he can't attempt any other actions for the rest of the round.
                ### Juryrig Results
                The amount of difficulty added to the full repairs depends on the result of the juryrig check:
                - **Critical Failure:** The system or item becomes unusable and can't be made functional again without full repairs.
                - **Failure:** The juryrig attempt doesn't work but can be tried again.
                - **Ordinary success:** The system or item becomes operational for **d6+1 time units**, and **3 more successes** are needed for full repairs (in addition to those already required).
                - **Good success:** The system or item becomes operational for **2d4+2 time units**, and **2 more successes** are needed for full repairs.
                - **Amazing success:** The system or item becomes operational for **3d4+2 time units**, and **1 more success** is needed to make full repairs.
                ### Rank Benefits
                ▶ **Rank 6 [Improved Juryrig]:** When a character reaches **Rank 6**, his ability improves as follows: an Ordinary success produces a Good result, a Good success produces an Amazing result, and an Amazing success means the juryrig works so well that the system or item is considered repaired and in regular working order.
          - es:
              name: Juryrig
              description: |-
                Esta habilidad permite a un Personaje realizar reparaciones rápidas y parciales para que un dispositivo o sistema electrónico o mecánico esté en funcionamiento durante un corto período de tiempo. Una reparación por jurado, incluso cuando tiene éxito, agrega dificultad a las reparaciones completas que deben realizarse más adelante, pero puede hacer que un Personaje supere una situación difícil. Una reparación juryrig se puede realizar exitosamente **una vez** en un sistema o elemento específico. Si se estropea después de haber sido arreglado, el sistema o elemento no volverá a funcionar hasta que esté completamente reparado (usando Ciencia técnica—reparación). Hacer una prueba de habilidad de jurado es una acción única, pero un Personaje que intenta usar esta habilidad debe hacerlo en su primera acción disponible en una ronda, y no puede intentar ninguna acción de Otros durante el resto de la ronda.
                ### Resultados del jurado
                La cantidad de dificultad agregada a las reparaciones completas depende del resultado de la verificación del jurado:
                - **Fallo Crítico:** El sistema o elemento queda inutilizable y no puede volver a funcionar sin una reparación completa.
                - **Fallo:** El intento de jurado no funciona pero se puede intentar nuevamente.
                - **Éxito de Ordinario:** El sistema o elemento entra en funcionamiento durante **d6+1 unidades de tiempo**, y se necesitan **3 Éxitos** más para reparaciones completas (además de las que ya son necesarias).
                - **Éxito de Bueno:** El sistema o elemento vuelve a estar operativo durante **2d4+2 unidades de tiempo**, y se necesitan **2 Éxitos** más para reparaciones completas.
                - **Éxito Asombroso:** El sistema o elemento vuelve a estar operativo durante **3d4+2 unidades de tiempo** y se necesita **1 éxito más** para realizar reparaciones completas.
                ### Beneficios de Rango
                ▶ **Rango 6 (Juryrig mejorado):** Cuando un Personaje alcanza **Rango 6**, su habilidad mejora de la siguiente manera: un éxito Ordinario produce un resultado Bueno, un éxito Bueno produce un resultado Asombroso y un éxito Asombroso significa que el jurado funciona tan bien que el sistema o elemento se considera reparado y en condiciones normales de funcionamiento.
        trained_only: false
    trained_only: false
  vehicle-operation:
    attribute: DEX
    cost: 3
    category: Technical
    url: /skills/vehicle-operation
    localized:
      - en:
          name: Vehicle Operation
          description: |-
            This broad skill provides a character with a basic understanding of and proficiency with modern vehicles. Using this skill, a character can attempt to operate most normal land and water vehicles. Some military or specialized land and water vehicles may have controls that are too complex for the broad skill to cover, requiring at least some level of specialization before a character is able to operate them successfully. The ordinary operation of any normal land or water vehicle doesn't require a skill check. During chases, races, or vehicle combat, or when navigating through challenging obstacles, skill checks may be called for.
      - es:
          name: Operación de Vehículos
          description: |-
            Esta amplia habilidad proporciona a un Personaje una comprensión básica y competencia con los vehículos modernos. Usando esta habilidad, un Personaje puede intentar operar la mayoría de los vehículos terrestres y acuáticos normales. Algunos vehículos terrestres y acuáticos militares o especializados pueden tener controles que son demasiado complejos para que los cubra la habilidad general, lo que requiere al menos cierto nivel de especialización antes de que un Personaje pueda operarlos con éxito. La operación Ordinario de cualquier vehículo terrestre o acuático normal no requiere una prueba de habilidad. Durante persecuciones, carreras o vehículos Combate, o al navegar a través de obstáculos desafiantes, es posible que se requieran pruebas de habilidad.
    items:
      air-vehicle:
        attribute: DEX
        cost: 5
        url: /skills/vehicle-operation#air-vehicle
        localized:
          - en:
              name: Air vehicle
              description: |-
                This specialty skill enables a character to become trained in the use of a specific type of air vehicle. If he wants to be skilled in the operation of more than one type of air vehicle, he must purchase and improve each specialty skill separately. Types of air vehicles include propeller planes, helicopters, private jets, commercial jets, and jet fighters.

                ### Rank Benefits
                ⊗ **Rank 4, 8, and 12 [Improved Proficiency]** At higher ranks, the character becomes even more adept at operating this type of vehicle, receiving a situation die bonus to checks involving this specialty skill.
                - **-1 step** at rank 4.
                - **-2 step** at rank 8.
                - **-3 step** at rank 12.
          - es:
              name: Vehículo Aéreo
              description: |-
                Este Especialidad permite que un Personaje se capacite en el uso de un tipo específico de vehículo aéreo. Si quiere dominar el funcionamiento de más de un tipo de vehículo aéreo, deberá comprar y mejorar cada Especialidad por separado. Los tipos de vehículos aéreos incluyen aviones de hélice, helicópteros, aviones privados, aviones comerciales y aviones de combate.

                ### Beneficios de Rango
                ⊗ **Rango 4, 8 y 12 [Competencia mejorada]** A mayor Rangos, el Personaje se vuelve aún más hábil en la operación de este tipo de vehículo y recibe una bonificación Dado de Situación en las comprobaciones que involucran este Especialidad.
                - **-1 paso** en Rango 4.
                - **-2 pasos** en Rango 8.
                - **-3 pasos** en Rango 12.
        trained_only: true
