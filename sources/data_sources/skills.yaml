              description: |-
                This specialty governs the acquisition of physical goods and the strategic management of capital. It is used to find rare equipment, navigate supply chains, and oversee group or corporate finances. A skilled procurer knows how to make money go further, how to find items that aren't officially for sale, and how to turn stagnant capital into a growing engine of wealth.

                ### Rank Benefits

                ▶ **Rank 2 [Investment Portfolio]** If the character is in charge of personal or group capital, they can have it invested. Each month, the character makes a roll to determine the yield:
                *   **Critical Failure:** -20\%
                *   **Failure:** +0\%
                *   **Ordinary:** +10\%
                *   **Good:** +15\%
                *   **Amazing:** +30\%

                ▶ **Rank 3 [Financial Leverage]** The character receives a **-1 step bonus** to any check made using this specialty skill, and an **additional bonus steps** at Rank 9 and 12.

                ▶ **Rank 6 [Master of Capital]** The character drastically optimizes the group's burn rate. All **Upkeep costs** for employees, ships, and properties under the character's supervision are **cut by half**.
          - es:
              name: Gestión
              description: |-
                Esta especialidad rige la adquisición de bienes Físico y la gestión estratégica del capital. Se utiliza para encontrar equipos Raro, navegar por las cadenas de suministro y supervisar las finanzas corporativas o del grupo. Un comprador experto sabe cómo hacer que el dinero llegue más lejos, cómo encontrar artículos que no están oficialmente a la venta y cómo convertir el capital estancado en un creciente motor de riqueza.

                ### Beneficios de Rango

                ▶ **Rango 2 [Cartera de Inversión]** Si el Personaje está a cargo de capital personal o grupal, pueden tenerlo invertido. Cada mes, el Personaje realiza una tirada para determinar el rendimiento:
                * **Fallo Crítico:** -20\%
                * **Error:** +0\%
                * **Ordinario:** +10\%
                * **Bueno:** +15\%
                * **Asombroso:** +30\%

                ▶ **Rango 3 [Apalancamiento financiero]** El Personaje recibe un **-1 Bonificación de paso** en cualquier verificación realizada con este Especialidad, y **pasos de bonificación adicionales** en Rango 9 y 12.

                ▶ **Rango 6 [Master of Capital]** El Personaje optimiza drásticamente la tasa de quema del grupo. Todos los **costos de mantenimiento** para empleados, barcos y propiedades bajo la supervisión de Personaje se **reducen a la mitad**.
