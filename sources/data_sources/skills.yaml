        localized:
        - en:
            name: Psionics
            description: |-
              Lawyers, judges, and others use this skill to interact in courtrooms and in legislative meetings. This aspect of the Law broad skill is used to argue a case or a point of view in an official proceeding involving psionic laws, rights, and regulations.
        - es:
            name: Psiónica
            description: |-
              Abogados, jueces y otros utilizan esta habilidad para interactuar en salas de justicia y en reuniones legislativas. Este aspecto de la habilidad amplia de Ley se utiliza para argumentar un caso o un punto de vista en un procedimiento oficial relacionado CON las leyes, derechos y regulaciones psiónicas.
        trained_only: true
    trained_only: false
  leadership:
    attribute: PER
    cost: 4
    category: Social
    url: /skills/leadership
    localized:
    - en:
        name: Leadership
        description: |-
          Training in group coordination and tactical oversight. A leader provides a **-1 step bonus** to all actions performed by a set number of followers for the remainder of the round and the entire following round.

          ### Coordination Rules
          ### Rank Benefits
          ▶ **Rank 3 [Unity of Command]:** Only one character can assume the leader role per group; conflicting orders negate the bonus.
          - **Restriction:** The broad skill cannot be used to coordinate targets with a **Combative** attitude.

          ▶ **Rank 3 [Resolution]:** **Ordinary Success:** Bonus applies to up to 2 followers.
              - **Good Success:** Bonus applies to up to 4 followers.
              - **Amazing Success:** Bonus applies to up to 6 followers.
              - **Critical Failure:** Followers suffer a +1 step penalty for the duration; no further checks allowed this scene.
    - es:
        name: Liderazgo
        description: |-
          Training in group coordination and tactical oversight. A leader provides a **-1 paso bono** to all actions performed by a set number of followers for the remainder of the round and the entire following round.

          ### Coordination Rules
          ▶ **Unity of Command:** Only one personaje can assume the leader role per group; conflicting orders negate the bono.
          - **Restriction:** The broad skill cannot be used to coordinate targets with a **Combative** attitude.
          ▶ **Resolution:**
              - **Ordinario Success:** Bonus applies to up to 2 followers.
              - **Bueno Success:** Bonus applies to up to 4 followers.
              - **Asombroso Success:** Bonus applies to up to 6 followers.
              - **Fallo Crítico:** Followers suffer a +1 paso penalización for the duration; no further checks allowed this scene.
    items:
      command:
        attribute: PER
        cost: 4
        url: /skills/leadership#command
        localized:
        - en:
            name: Command
            description: |-
              Leading through authority, chain of command, and persuasive orders. Used primarily by military, corporate, and law enforcement officers.
        - es:
            name: Habilidades de Especialidad
            description: |-
              Leading through authority, chain of command, and persuasive orders. Used primarily by military, corporate, and law enforcement officers.
