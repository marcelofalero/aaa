              description: |-
                As a character improves his ability in the powered specialty skill, he gains rank benefits as described below. Note: These benefits only apply when the character is using a weapon covered by this skill. Due to the inherent complexity of powered weapons they are more fragile than their counterparts; this requires the user to be more careful when parrying, resulting in a +2 step penalty on parry checks.
                ⊗ Resistance Modifier: At higher ranks, the skill provides an improvement to a character''s Strength resistance modifier. It improves by +1 at rank 4, by +1 again at rank 8, and by +1 again at rank 12. This increase doesn''t stack with similar bonuses provided by other melee combat specialty skills.
                ▶ Reaction Parry: When a character reaches rank 4, he can attempt to parry whenever a melee or unarmed attack is used against him. The parry attempt uses up the character''s next available action.
                ▶ Double-Strike: When a character reaches skill rank 6, he learns to make a double-strike against a target with a successful skill check. The player rolls one control die and two situation dice. The first situation die is the base modifier with a +1 step penalty; the second situation die is the base modifier with a +2 step penalty.
                ▶ Multistrike: When a character reaches skill rank 9, he learns to make multiple attacks in a single phase. The character can strike with a melee weapon three times in a phase. These attacks can be directed at a single target or at up to three separate targets within two meters of the character.
          - es:
              name: Armas de energía
              description: |-
                A medida que un personaje mejora su habilidad en la habilidad especial potenciada, obtiene beneficios de rango como se describe a continuación. Nota: Estos beneficios solo se aplican cuando el personaje usa un arma cubierta por esta habilidad. Debido a la complejidad inherente de las armas motorizadas, son más frágiles que sus contrapartes; esto requiere que el usuario tenga más cuidado al parar, lo que resulta en una penalización de +2 pasos en las pruebas de parada.
                ⊗ Modificador de resistencia: en rangos más altos, la habilidad proporciona una mejora al modificador de resistencia a la fuerza de un personaje. Mejora en +1 en el rango 4, en +1 nuevamente en el rango 8 y en +1 nuevamente en el rango 12. Este aumento no se acumula con bonificaciones similares proporcionadas por otras habilidades especiales de combate cuerpo a cuerpo.
                ▶ Parada de reacción: cuando un personaje alcanza el rango 4, puede intentar parar cada vez que se utiliza un ataque cuerpo a cuerpo o sin armas contra él. El intento de parada consume la siguiente acción disponible del personaje.
                ▶ Doble golpe: cuando un personaje alcanza el rango de habilidad 6, aprende a realizar un doble golpe contra un objetivo con una prueba de habilidad exitosa. El jugador tira un dado de control y dos dados de situación. El primer dado de situación es el modificador de base con una penalización de +1 paso; el segundo dado de situación es el modificador de base con una penalización de +2 pasos.
                ▶ Multigolpe: cuando un personaje alcanza el rango de habilidad 9, aprende a realizar múltiples ataques en una sola fase. El personaje puede atacar con un arma cuerpo a cuerpo tres veces en una fase. Estos ataques pueden dirigirse a un solo objetivo o hasta a tres objetivos separados dentro de un radio de dos metros del personaje.
        trained_only: false
    trained_only: false
  modern-ranged-weapons:
    attribute: DEX
    cost: 6
    category: Combat
    url: /skills/modern-ranged-weapons
    localized:
      - en:
          name: Modern Ranged Weapons
          description: |-
            This broad skill provides a character with training in the use of modern ranged weapons. This skill covers pistols, rifles, shotguns, and submachine guns of all types, including projectile and energy weapons. All modern weapons have ammunition clips. To change a clip during a combat scene, a character must use an available action. If he wants to change a clip and shoot in the same phase, a +2 penalty applies to the attack action. Other factors that can influence the situation die used in a modern ranged weapon attack are listed under **Ranged Weapon Attack Modifiers** on this page.
            **Weapon Technical Knowledge**: Characters who train seriously with firearms — whether soldiers, mercenaries, or dedicated enthusiasts — inevitably absorb a working technical understanding of their weapons. They learn how their weapons function internally, what can go wrong, how to prevent it, and how to fix it in the field. As well as keep informed of what the market has to offer. A character with the
            **Technical Science** broad skill can use the appropriate Modern Ranged Weapons specialty skill for checks that involve knowing the existence of a particular weapon, customizing weapons and ammo, as well as recognizing, repairing, and maintaining weapons in the field.
            ### Ranged Weapon Attack Modifiers
            When a character uses any ranged weapon, either primitive or modern, a number of factors must be considered to determine the situation die for the skill check:
            - The base situation die of the weapon (either +4 for a broad skill or +0 for a specialty).
            - The weapon''s range modifier (see **TABLE P22: RANGE MODIFIERS BY WEAPON TYPE** below).
            - Any modifier for a target''s Dexterity resistance (–1 step bonus for DEX 11–12, –2 steps for DEX 13–14, –3 steps for DEX 15–16, –4 steps for DEX 17–18, and –5 steps for DEX 19 or higher).
            #### TABLE: COMMON RANGED ATTACK MODIFIERS
            | Condition | Modifier | Weapon Types | Note | | :--- | :--- | :--- | :--- | | **Zero Range** (0–1m) | **-3 steps** | Pistol, SMG, Shotgun | Weapons must be short enough to tuck into a grapple. | | **Point Blank** (1–4m) | **-1 step** | All | See Specialty Rank benefits for improvements. | | **In a Melee Struggle** | **+1 step** | All | Canceled by **Melee Combat** Broad Skill training. | | **Moving & Shooting** | **+1 step** | All | For firing while running or moving fast. | | **Changing Clips** | **+2 steps** | All | To change a clip and fire in the same phase. |
            #### TABLE P22: RANGE MODIFIERS BY WEAPON TYPE
            | Weapon | Short | Medium | Long | | :--- | :--- | :--- | :--- | | Submachine gun | -1 step | +1 step | +2 steps | | Pistol | -1 step | +1 step | +2 steps | | Rifle | -1 step | None | +1 step |
      - es:
          name: Armas a distancia modernas
          description: |-
            Esta amplia habilidad proporciona al personaje entrenamiento en el uso de armas a distancia modernas. Esta habilidad cubre pistolas, rifles, escopetas y metralletas de todo tipo, incluidas armas de proyectiles y de energía. Todas las armas modernas tienen cargadores de munición. Para cambiar un clip durante una escena de combate, un personaje debe usar una acción disponible. Si quiere cambiar de cargador y disparar en la misma fase, se aplica una penalización de +2 a la acción de ataque. Otros factores que pueden influir en la situación utilizada en un ataque con armas a distancia moderno se enumeran en **Modificadores de ataques con armas a distancia** en esta página.
            **Conocimiento técnico de armas**: Los personajes que entrenan seriamente con armas de fuego, ya sean soldados, mercenarios o entusiastas dedicados, inevitablemente absorben una comprensión técnica práctica de sus armas. Aprenden cómo funcionan internamente sus armas, qué puede salir mal, cómo prevenirlo y cómo solucionarlo en el campo. Así como mantenerse informado de lo que el mercado tiene para ofrecer. Un personaje con el
            **Ciencia técnica** La habilidad amplia puede usar la habilidad especializada de Armas modernas a distancia apropiada para comprobaciones que implican conocer la existencia de un arma en particular, personalizar armas y municiones, así como reconocer, reparar y mantener armas en el campo.
            ### Modificadores de ataques con armas a distancia
            Cuando un personaje utiliza cualquier arma a distancia, ya sea primitiva o moderna, se deben considerar una serie de factores para determinar la situación para la prueba de habilidad:
            - El dado de situación base del arma (ya sea +4 para una habilidad amplia o +0 para una especialidad).
            - El modificador de alcance del arma (ver **TABLA P22: MODIFICADORES DE ALCANCE POR TIPO DE ARMA** a continuación).
            - Cualquier modificador para la resistencia a la Destreza de un objetivo (bonificación de –1 paso para DES 11–12, –2 pasos para DES 13–14, –3 pasos para DES 15–16, –4 pasos para DES 17–18 y –5 pasos para DES 19 o superior).
            #### TABLA: MODIFICADORES DE ATAQUE A DISTANCIA COMUNES
            | Condición | Modificador | Tipos de armas | Nota | | :--- | :--- | :--- | :--- | | **Alcance cero** (0–1 m) | **-3 pasos** | Pistola, Subfusil, Escopeta | Las armas deben ser lo suficientemente cortas para caber en una garra. | | **A quemarropa** (1–4 m) | **-1 paso** | Todo | Consulte los beneficios del rango de especialidad para obtener mejoras. | | **En una lucha cuerpo a cuerpo** | **+1 paso** | Todo | Cancelado por el entrenamiento de **Combate cuerpo a cuerpo** de habilidades amplias. | | **Movimiento y disparo** | **+1 paso** | Todo | Para disparar mientras corres o te mueves rápido. | | **Cambiar clips** | **+2 pasos** | Todo | Para cambiar de clip y disparar en la misma fase. |
            #### TABLA P22: MODIFICADORES DE ALCANCE POR TIPO DE ARMA
            | Arma | Corto | Medio | Largo | | :--- | :--- | :--- | :--- | | Subfusil | -1 paso | +1 paso | +2 pasos | | Pistola | -1 paso | +1 paso | +2 pasos | | Fusil | -1 paso | Ninguno | +1 paso |
    items:
      assault-rifle:
        attribute: DEX
        cost: 3
        url: /skills/modern-ranged-weapons#assault-rifle
        localized:
          - en:
              name: Assault Rifle
              description: |-
                This specialty skill covers automatic rifles—standard infantry weapons capable of selective fire and automatic modes using rifle-caliber cartridges.
                ### Automatic Weapon Attack Modes
                Assault rifles provide a character with up to three attack options per action phase:
                - **Fire:** A single attack at a single target. (Standard control + situation die).
                - **Burst:** A hail of ammunition aimed at a single target. The character receives a **-1 step bonus** to his skill check. On a Critical Failure, the weapon jams and requires a Technical Science—repair check to unjam.
                - **Autofire:** A spray of ammunition walked across a wide area. Up to three different targets within 6 meters of each other can be affected.
                  - To resolve autofire, the player rolls one control die and three situation dice at once.
                  - The results are read off the control die, modified by the individual situation dice: **+1 step** for the first target, **+2 steps** for the second, and **+3 steps** for the third.
                ▶ **Rock-n-Roll:** When a character reaches rank 3 in this specialty, he learns to change clips more efficiently. The penalty for changing a clip and firing in the same action is reduced to +1 step.
          - es:
              name: Fusil de asalto
              description: |-
                Esta habilidad especializada cubre rifles automáticos: armas de infantería estándar capaces de realizar disparos selectivos y modos automáticos que utilizan cartuchos de calibre de rifle.
                ### Modos de ataque automático con armas
                Los rifles de asalto brindan al personaje hasta tres opciones de ataque por fase de acción:
                - **Fuego:** Un solo ataque a un solo objetivo. (Control estándar + dado de situación).
                - **Explosión:** Una lluvia de munición dirigida a un único objetivo. El personaje recibe una **bonificación de -1 paso** en su prueba de habilidad. En caso de fallo crítico, el arma se atasca y requiere una prueba de reparación de ciencia técnica para desbloquearla.
                - **Autofire:** Una ráfaga de munición recorrió un área amplia. Pueden verse afectados hasta tres objetivos diferentes dentro de un radio de 6 metros entre sí.
                  - Para resolver el disparo automático, el jugador tira un dado de control y tres dados de situación a la vez.
                  - Los resultados se leen en el dado de control, modificados por los dados de situación individuales: **+1 paso** para el primer objetivo, **+2 pasos** para el segundo y **+3 pasos** para el tercero.
                ▶ **Rock-n-Roll:** Cuando un personaje alcanza el rango 3 en esta especialidad, aprende a cambiar clips de manera más eficiente. La penalización por cambiar un cargador y disparar en la misma acción se reduce a +1 paso.
        trained_only: false
      pistol:
        attribute: DEX
        cost: 3
        url: /skills/modern-ranged-weapons#pistol
        localized:
          - en:
              name: Pistol
              description: |-
                This specialty skill allows a character to improve his proficiency with modern pistols of all types, including projectile and energy weapons.
                ▶ **Quick Draw:** After a character reaches rank 3 in this specialty, he can perform a quick draw with his pistol. This allows him to draw his weapon and fire it in the same phase with only a +1 penalty. As a character reaches rank 4, he can draw and fire in the same phase without any penalty.
          - es:
              name: Pistola
              description: |-
                Esta habilidad especial permite al personaje mejorar su competencia con pistolas modernas de todo tipo, incluidas armas de proyectiles y de energía.
                ▶ **Desenfundado rápido:** Después de que un personaje alcanza el rango 3 en esta especialidad, puede realizar un desenfundado rápido con su pistola. Esto le permite sacar su arma y dispararla en la misma fase con sólo una penalización de +1. Cuando un personaje alcanza el rango 4, puede dibujar y disparar en la misma fase sin ninguna penalización.
        trained_only: false
        rank_benefits:
          - rank: 3
            title: Quick Draw
          - rank: 4
            title: Quick Draw
      rifle:
        attribute: DEX
        cost: 3
        url: /skills/modern-ranged-weapons#rifle
        localized:
          - en:
              name: Rifle
              description: |-
                This specialty skill allows a character to improve his proficiency with modern single-fire rifles, sniper rifles, and hunting rifles.
                ▶ **Improved Aim:** When a character reaches rank 3 in this specialty, he becomes able to hit a target with more dependability. This improvement in accuracy translates to a
                **-1 bonus** to the situation die for any single-fire rifle attack the character makes.
          - es:
              name: Fusil de asalto
              description: |-
                Esta habilidad especial permite al personaje mejorar su competencia con rifles modernos de tiro único, rifles de francotirador y rifles de caza.
                ▶ **Apunte mejorado:** Cuando un personaje alcanza el rango 3 en esta especialidad, puede alcanzar un objetivo con mayor confiabilidad. Esta mejora en la precisión se traduce en una
                **-1 bonificación** al dado de situación por cualquier ataque con rifle de un solo disparo que realice el personaje.
        trained_only: false
        rank_benefits:
          - rank: 3
            title: Improved Aim
      smg:
        attribute: DEX
        cost: 3
        url: /skills/modern-ranged-weapons#smg
        localized:
          - en:
              name: SMG
              description: |-
                This specialty skill allows a character to improve his proficiency with modern submachine guns of all types (small automatic weapons that fire pistol-sized cartridges) as well as energy-equivalent submachine guns.
                ### Automatic Weapon Attack Modes
                Submachine guns (and assault rifles) provide a character with up to three attack options per action phase:
                - **Fire:** A single attack at a single target. (Standard control + situation die).
                - **Burst:** A hail of ammunition aimed at a single target. The character receives a
                **-1 step bonus** to his skill check. On a Critical Failure, the weapon jams and requires a Technical Science—repair check to unjam.
                - **Autofire:** A spray of ammunition walked across a wide area. Up to three different targets within 6 meters of each other can be affected.
                  - To resolve autofire, the player rolls one control die and three situation dice at once.
                  - The results are read off the control die, modified by the individual situation dice: **+1 step** for the first target, **+2 steps** for the second, and **+3 steps** for the third.
                ▶ **Rock-n-Roll:** When a character reaches rank 3 in this specialty, he learns to change clips more efficiently. The penalty for changing a clip and firing in the same action is reduced to +1 step.
          - es:
              name: Subfusil
              description: |-
                Esta habilidad especial permite al personaje mejorar su competencia con metralletas modernas de todo tipo (pequeñas armas automáticas que disparan cartuchos del tamaño de una pistola), así como con metralletas de energía equivalente.
                ### Modos de ataque automático con armas
                Las metralletas (y los rifles de asalto) proporcionan al personaje hasta tres opciones de ataque por fase de acción:
                - **Fuego:** Un solo ataque a un solo objetivo. (Control estándar + dado de situación).
                - **Explosión:** Una lluvia de munición dirigida a un único objetivo. El personaje recibe una
                **Bono de -1 paso** a su prueba de habilidad. En caso de fallo crítico, el arma se atasca y requiere una prueba de reparación de ciencia técnica para desbloquearla.
                - **Autofire:** Una ráfaga de munición recorrió un área amplia. Pueden verse afectados hasta tres objetivos diferentes dentro de un radio de 6 metros entre sí.
                  - Para resolver el disparo automático, el jugador tira un dado de control y tres dados de situación a la vez.
                  - Los resultados se leen en el dado de control, modificados por los dados de situación individuales: **+1 paso** para el primer objetivo, **+2 pasos** para el segundo y **+3 pasos** para el tercero.
                ▶ **Rock-n-Roll:** Cuando un personaje alcanza el rango 3 en esta especialidad, aprende a cambiar clips de manera más eficiente. La penalización por cambiar un cargador y disparar en la misma acción se reduce a +1 paso.
        trained_only: false
      shotgun:
        attribute: DEX
        cost: 3
        url: /skills/modern-ranged-weapons#shotgun
        localized:
          - en:
              name: Shotgun
              description: |-
                This specialty skill covers all types of modern shotguns, from traditional pump-action and semi-automatic projectile weapons to specialized energy spread-emitters. Shotguns are defined by their wide range of specialized ammunition types (Buckshot, Slugs, Breaching rounds, etc.) or multi-mode energy settings.
                ▶ **Tactical Load / Selection:** When a character reaches rank 3 in this specialty, they have mastered the mechanics of their weapon. They can **Select/Switch Ammo types** or reconfigure weapon energy settings as a **Free Action** instead of an auxiliary action. This allows them to instantly adapt their weapon’s profile to the immediate tactical situation (e.g., swapping to a slug for a precision shot or buckshot for hallway clearing) during a combat phase.
          - es:
              name: Escopeta
              description: |-
                Esta habilidad especializada cubre todo tipo de escopetas modernas, desde armas tradicionales de acción de bombeo y proyectiles semiautomáticas hasta emisores de energía especializados. Las escopetas se definen por su amplia gama de tipos de munición especializada (perdigones, balas, balas de ruptura, etc.) o configuraciones de energía multimodo.
                ▶ **Carga Táctica/Selección:** Cuando un personaje alcanza el rango 3 en esta especialidad, ha dominado la mecánica de su arma. Pueden **Seleccionar/cambiar tipos de munición** o reconfigurar la configuración de energía del arma como una **Acción gratuita** en lugar de una acción auxiliar. Esto les permite adaptar instantáneamente el perfil de su arma a la situación táctica inmediata (por ejemplo, cambiar a una bala para un tiro de precisión o perdigones para despejar un pasillo) durante una fase de combate.
