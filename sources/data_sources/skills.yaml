  melee-combat:
    attribute: STR
    cost: 6
    category: Combat
    url: /skills/melee-combat
    localized:
    - en:
        name: Melee Combat
        description: |-
          Melee Combat represents the baseline proficiency of any physical combatant engaging in a struggle at personal range. It covers the essential understanding of reach, timing, and the efficient transfer of kinetic force through the body or a handheld tool. A character trained in this broad skill possesses an inherent grasp of spatial awareness and targeting, allowing them to identify vulnerabilities in an opponent while maintaining their own center of gravity and weapon posture during an exchange. Professional training in this field also facilitates the use of firearms in the middle of a struggle. This training removes the +1 step penalties from pistols and SMGs when used against a melee opponent, and removes the +2 steps bonus to disarm an opponent have against you when you are wielding an assault rifle, sniper rifle, or any form of equipped heavy weapon. Furthermore, pistols and SMGs are handled with the same ease as a one-handed melee weapons would; they can be drawn and fired in any circumstance where a knife or baton would be permitted.
          ### Unarmed Damage
          The base damage for an unarmed attack depends on the size of the character; for a medium-sized character, the baseline damage is
          **d4s/d4+1s/d4+2s**, plus the character''s Strength bonus. Certain implements can be used to augment this damage, though some require specialized training to unlock their full potential. The skill entry in the weapon table indicates if the weapon requires ranks in a particular specialty skill to use it effectively; each rank below the indicated requirement results in a +1 step penalty to any attack made with such weapons.
    - es:
        name: Combate cuerpo a cuerpo
        description: |-
          El Combate Cuerpo a Cuerpo representa la competencia básica de cualquier combatiente físico que participa en una lucha a corta distancia. Abarca la comprensión esencial del alcance, el tiempo y la transferencia eficiente de la fuerza cinética a través del cuerpo o una herramienta de mano. Un personaje entrenado en esta habilidad general posee una comprensión inherente de la conciencia espacial y la puntería, lo que le permite identificar vulnerabilidades en un oponente mientras mantiene su propio centro de gravedad y postura CON el arma durante un intercambio. El entrenamiento profesional en este campo también facilita el uso de armas de fuego en medio de una lucha. Este entrenamiento elimina las penalizaciones de +1 paso de las pistolas y subfusiles cuando se usan contra un oponente en cuerpo a cuerpo, y elimina la bonificación de +2 pasos para desarmar que un oponente tiene contra ti cuando empuñas un rifle de asalto, un rifle de francotirador o cualquier forma de arma pesada equipada. Además, las pistolas y los subfusiles se manejan CON la misma facilidad que las armas cuerpo a cuerpo de una mano; se pueden desenfundar y disparar en cualquier circunstancia en la que se permitiría un cuchillo o una porra.
          ### Daño sin Armas
          El daño base de un ataque sin armas depende del tamaño del personaje; para un personaje de tamaño mediano, el daño base es
          **d4s/d4+1s/d4+2s**, más la bonificación de Fuerza del personaje. Ciertos implementos pueden usarse para aumentar este daño, aunque algunos requieren un entrenamiento especializado para desbloquear todo su potencial. La entrada de la habilidad en la tabla de armas indica si el arma requiere rangos en una habilidad de especialidad particular para usarla de manera efectiva; cada rango por debajo del requisito indicado resulta en una penalización de +1 paso a cualquier ataque realizado CON tales armas.
          ----------------------
    items:
      blade:
        attribute: STR
        cost: 3
        url: /skills/melee-combat#blade
        localized:
        - en:
            name: Blade
            description: |-
              As a character improves his ability in the blade specialty skill, he gains rank benefits as described below. Note: These benefits only apply when the character is using a weapon covered by this skill.
              ### Rank Benefits
              ⊗ **Rank 4, 8, 12 [Benefit]:** Resistance Modifier: At higher ranks, the skill provides an improvement to a character''s Strength resistance modifier. It improves by +1 at rank 4, by +1 again at rank 8, and by +1 again at rank 12. This increase doesn''t stack with similar bonuses provided by other melee combat specialty skills.

              ▶ **Rank 4 [Benefit]:** Reaction Parry: When a character reaches rank 4, he can attempt to parry whenever a melee or unarmed attack is used against him. The parry attempt uses up the character''s next available action.

              ▶ **Rank 6 [Benefit]:** Double-Strike: When a character reaches skill rank 6, he learns to make a double-strike against a target with a successful skill check. The player rolls one control die and two situation dice to make his double-strike attack. The first situation die is the base modifier needed to make an attack with a +1 step penalty; the second situation die is the base modifier with a +2 step penalty.

              ▶ **Rank 9 [Benefit]:** Multistrike: When a character reaches skill rank 9, he learns to make multiple attacks in a single phase. The character can strike with a melee weapon three times in a phase. These attacks can be directed at a single target or at up to three separate targets within two meters of the character.
        - es:
            name: Arma blanca
            description: |-
              La esencia de las artes marciales defensivas y basadas en la destreza radica en la no resistencia y la manipulación sofisticada de los vectores cinéticos. En lugar de enfrentar la fuerza CON la fuerza, estos estilos utilizan movimientos fluidos y esféricos para redirigir el impulso de un atacante, convirtiendo efectivamente su propia masa y aceleración en su contra. Al priorizar la elasticidad estructural y la propiocepción de alto nivel, un practicante permanece inasible, utilizando un juego de pies preciso y un cambio de peso dinámico para abandonar la línea de ataque mientras realiza una transición simultánea a una posición de contra-apalancamiento.
              **Rango 1: Línea de Base Táctica.** El practicante aprende a mantener el equilibrio mientras identifica las aberturas. Aumenta el daño base sin armas a **d4s/d6s/d6w**.
              **Rango 3: Juego de Pies Fluido.** Al aprovechar su velocidad y flexibilidad, el movimiento reactivo del practicante proporciona un aumento de paso en su resistencia de Fuerza, y otro paso en los Rangos 7 y 11.
              **Rango 4: Contraataque Fluido.** Cuando un oponente falla un ataque cuerpo a cuerpo contra el practicante, el siguiente ataque del practicante contra ese oponente específico antes del final del siguiente asalto puede usar su modificador de fuerza o el de su oponente para el daño.
              **Rango 7: Redirección de la fuerza sobre-comprometida.** Si un oponente realiza un ataque total contra ti, recibe todas las penalizaciones pero ningún beneficio.
              **Rango 10: Flujo Persistente.** Todos los ataques totales que te fallen pueden ser redirigidos contra cualquier otro objetivo adyacente al atacante. El atacante debe realizar una nueva tirada de ataque normal contra el nuevo objetivo para determinar el resultado.
              **Rango 12: Maestro sin Forma.** El practicante puede ignorar 1 paso de la defensa de fuerza debido a la imprevisibilidad de sus ataques.
              ----------------------------
        trained_only: false
      blunt:
        attribute: STR
        cost: 3
        url: /skills/melee-combat#blunt
        localized:
        - en:
            name: Blunt
            description: |-
              As a character improves his ability in the blunt specialty skill, he gains rank benefits as described below. Note: These benefits only apply when the character is using a weapon covered by this skill.
              ### Rank Benefits
              ⊗ **Rank 4, 8, 12 [Benefit]:** Resistance Modifier: At higher ranks, the skill provides an improvement to a character''s Strength resistance modifier. It improves by +1 at rank 4, by +1 again at rank 8, and by +1 again at rank 12. This increase doesn''t stack with similar bonuses provided by other melee combat specialty skills.

              ▶ **Rank 4 [Benefit]:** Reaction Parry: When a character reaches rank 4, he can attempt to parry whenever a melee or unarmed attack is used against him. The parry attempt uses up the character''s next available action.

              ▶ **Rank 6 [Benefit]:** Double-Strike: When a character reaches skill rank 6, he learns to make a double-strike against a target with a successful skill check. The player rolls one control die and two situation dice. The first situation die is the base modifier with a +1 step penalty; the second situation die is the base modifier with a +2 step penalty.

              ▶ **Rank 9 [Benefit]:** Multistrike: When a character reaches skill rank 9, he learns to make multiple attacks in a single phase. The character can strike with a melee weapon three times in a phase. These attacks can be directed at a single target or at up to three separate targets within two meters of the character.
        - es:
            name: Arma contundente
            description: |-
              La esencia de las artes marciales orientadas al poder radica en la movilización eficiente de la masa corporal total a través de la alineación estructural y la secuenciación cinética explosiva. En lugar de depender de la fuerza muscular aislada, estos estilos tratan el cuerpo como una unidad única y rígida en el momento del impacto, utilizando el suelo como punto de apoyo para canalizar la energía de las piernas y las caderas giratorias hacia un punto de entrega enfocado. Al sincronizar la respiración, el apilamiento esquelético y el "peso que cae", el practicante maximiza la física del impulso para superar la resistencia de un oponente a través de la pura integridad estructural y la fuerza calculada.
              **Rango 1: El practicante aprende a aprovechar adecuadamente su masa.** Aumenta el daño base sin armas a **d4s/d4w/d6+1w**.
              **Rango 3: Entrega de fuerza CON alto impulso.** Un éxito Asombroso en un ataque obliga al objetivo a realizar una prueba de noqueo (Resolución o Resistencia) CON una penalización de +1 paso. Esta penalización aumenta a +2 en el Rango 6, +3 en el Rango 9 y +4 en el Rango 12.
              **Rango 4: La eficiencia estructural aumenta el daño.** Todo el daño sin armas aumenta en 1. Esta bonificación aumenta en 1 adicional en el Rango 8 y el Rango 12.
              **Rango 4: Aumenta la resistencia cuerpo a cuerpo del personaje en un paso, y otro paso en el Rango 8 y el Rango 12.
              **Rango 5: Poder de corto alcance (Fajin).** El practicante puede golpear eficazmente incluso si sus manos están atadas o inutilizables (usando hombros, rodillas o cabezazos).
              **Rango 8: Destrucción Estructural.** Cuando el practicante usa un Ataque Total, el objetivo debe tirar los dados de su Armadura dos veces y tomar el peor resultado. Esto se aplica a las armaduras estándar.
              **Rango 12: Maestro de la Fuerza.** La penalización de armadura "tirar dos veces/tomar el peor" ahora se aplica a las Armaduras de Poder y las defensas sobrenaturales.
              **Nota:** Los practicantes que utilizan CON frecuencia las opciones de Ataque Total en combate suelen ser llamados luchadores.
              -------------------------------
              ⊗ Modificador de Resistencia: En rangos superiores, cualquier habilidad de especialidad de Armas Cuerpo a Cuerpo proporciona una mejora al modificador de resistencia de Fuerza de un personaje. Mejora en +1 en el rango 4, en +1 de nuevo en el rango 8 y en +1 de nuevo en el rango 12.
              ▶ Parada de Reacción: Cuando un personaje alcanza el rango 4, puede intentar parar siempre que se utilice un ataque cuerpo a cuerpo o sin armas contra él. El intento de parada gasta la siguiente acción disponible del personaje. Por ejemplo, un personaje que logra un resultado de chequeo de acción Ordinario y tiene 2 acciones por ronda podría intentar parar ataques dirigidos contra él en las fases Asombrosa y Buena, pero luego no le quedarían acciones para las fases Ordinaria y Marginal.
              ▶ Doble Golpe: Cuando un personaje alcanza el rango de habilidad 6, aprende a realizar un doble golpe contra un objetivo CON un chequeo de habilidad exitoso. Un doble golpe funciona de la siguiente manera: El jugador tira un dado de control y dos dados de situación para realizar su ataque de doble golpe. El primer dado de situación es el modificador base necesario para realizar un ataque CON una penalización de +1 paso; el segundo dado de situación es el modificador base CON una penalización de +2 pasos.
              ▶ Multigolpe: Cuando un personaje alcanza el rango de habilidad 9, aprende a realizar múltiples ataques en una sola fase. El personaje puede golpear CON un arma cuerpo a cuerpo tres veces en una fase. Estos ataques pueden dirigirse a un solo objetivo o a hasta tres blancos separados a menos de dos metros del personaje. Para resolver un ataque de multigolpe, el jugador del personaje tira un dado de control y tres dados de situación al mismo tiempo. Todos los resultados se leen en el dado de control, según lo modificado por los tres dados de situación. En un ataque de multigolpe, el primero dado de situación es el dado base para el ataque CON una penalización de +1 paso. El segundo dado es el dado base CON una penalización de +2 pasos. El tercero dado es el dado base CON una penalización de +3 pasos. Al calcular el dado de situación base, utiliza el objetivo que sea más difícil de golpear.
        trained_only: false
      defensive-martial-arts:
        attribute: STR
        cost: 3
        url: /skills/melee-combat#defensive-martial-arts
        localized:
        - en:
            name: Defensive Martial Arts
            description: |-
              As a character improves his ability in the defensive martial arts specialty skill, he gains rank benefits as described below. Note: These benefits only apply when the character is fighting unarmed or with appropriate martial arts implements. The essence of defensive and dexterity-based martial arts lies in non-resistance and the sophisticated manipulation of kinetic vectors. Rather than meeting force with force, these styles utilize fluid, spherical movements to redirect an attacker''s momentum, effectively turning their own mass and acceleration against them.
              ### Rank Benefits
              ▶ **Rank 3 [Benefit]:** Overpowering: This skill can be used to determine the success of an attempt to overpower an opponent. Briefly, overpowering is a form of unarmed attack made simultaneously by one or more allies trying to grab and restrain a single opponent. If a single attacker tries to overpower another character, his Melee Combat skill check is made at a +1 penalty. Every additional attacker who takes part in the same overpowering attempt provides a cumulative –1 bonus to the skill check. Overpowering does not cause damage, but it immobilizes an opponent for as long as one of the attackers continues to maintain a tight hold on that opponent.

              ▶ **Rank 1 [d4s/d6s/d6w]:** .

              ⊗ **Rank 3, 4, 7, 11 [Benefit]:** Resistance Modifier: At higher ranks, the skill provides an improvement to a character''s Strength resistance modifier. By leveraging his speed and flexibility, the practitioner’s reactive movement provides a +1 step increase at rank 3, an additional +1 at rank 7, and a final +1 at rank 11. This increase doesn''t stack with similar bonuses provided by other melee combat specialty skills. How we do things reaches rank 4, if an opponent misses him with a melee attack, the character''s next attack against that specific opponent before the end of the next round can use either his own or his opponent''s Strength modifier for damage.

              ▶ **Rank 7, 10 [Benefit]:** Redirection of Force: When a character reaches rank 7, if an opponent performs an All Out Attack against him, the attacker receives all the penalties of that maneuver but gains none of the benefits. How we do things reaches rank 10, All Out Attacks that miss him can be redirected against any other target adjacent to the attacker. The attacker must make a new normal attack roll against the new target to determine the result.

              ▶ **Rank 12 [Benefit]:** Formless Master: When a character reaches rank 12, he may ignore 1 step of an opponent''s Strength defense due to the unpredictability of his attacks.
        - es:
            name: Artes marciales defensivas
            description: |-
              As a Personaje improves his ability in the Artes marciales defensivas Especialidad, he gains rank benefits as described below. Note: These benefits only apply when the Personaje is fighting unarmed or with appropriate martial arts implements. The essence of defensive and dexterity-based martial arts lies in non-resistance and the sophisticated manipulation of kinetic vectors. Rather than meeting force with force, these styles utilize fluid, spherical movements to redirect an attacker''s momentum, effectively turning their own mass and acceleration against them.
