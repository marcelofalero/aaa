                ⊗ Modificador de resistencia: en rangos más altos, la habilidad proporciona una mejora al modificador de resistencia a la fuerza de un personaje. Mejora en +1 en el rango 4, en +1 nuevamente en el rango 8 y en +1 nuevamente en el rango 12. Este aumento no se acumula con bonificaciones similares proporcionadas por otras habilidades especiales de combate cuerpo a cuerpo.
                ▶ Parada de reacción: cuando un personaje alcanza el rango 4, puede intentar parar cada vez que se utiliza un ataque cuerpo a cuerpo o sin armas contra él. El intento de parada consume la siguiente acción disponible del personaje.
                ▶ Doble golpe: cuando un personaje alcanza el rango de habilidad 6, aprende a realizar un doble golpe contra un objetivo con una prueba de habilidad exitosa. El jugador tira un dado de control y dos dados de situación. El primer dado de situación es el modificador de base con una penalización de +1 paso; el segundo dado de situación es el modificador de base con una penalización de +2 pasos.
