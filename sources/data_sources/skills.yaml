            description: |-
              Esta habilidad proporciona a un personaje entrenamiento en la reparación y el mantenimiento de varios tipos de tecnología mecánica y electrónica. Cualquier uso de la habilidad de reparación requiere una comprobación de habilidad compleja y toma un período de tiempo determinado por el Director del Juego (minutos, horas, días o semanas). La complejidad de una comprobación de habilidad de reparación está relacionada CON la cantidad de daño que debe repararse:
