  culture:
    attribute: PER
    cost: 5
    category: Social
    url: /skills/culture
    localized:
      - en:
          name: Culture
          description: |-
            This broad skill represents a character's ability to understand and interact with cultures that are different from his own. Areas of knowledge covered by the skill include the customs, philosophy, and way of life of a particular culture, as well as a basic familiarity with major historical figures, events, and trends important to that culture. In the use of the broad skill, a character applies what he knows about cultural trends and studies to make an educated guess about how to interact with a member of another culture. The broad skill provides at least a working knowledge of what to do when dealing with any alien culture. 

            When Culture or any of its specialty skills is used in an interactive context with one or more other characters, it is considered an encounter skill (see the sidebar). A Critical Failure result on a skill check indicates that the character has thoroughly insulted the individual or group he's trying to deal with. Other skill check results change the target's attitude as shown on **TABLE P25: ENCOUNTER SKILL EFFECTS**. The greater the degree of success, the more endearing and flattering the character appears to the member(s) of the culture he's dealing with. The complexity of the ideas that are being communicated during a use of the Culture skill (or the use of one of its specialty skills) may provide a modifier to the skill check:

            * **Simple concepts:** basic messages such as exchanging names, conveying friendly intentions, and offering help. These give a -1 bonus to the skill check.
            * **Everyday concepts:** information that is somewhat more difficult to convey, such as explaining one's place of origin or occupation. These provide no modifier.
            * **Complex concepts:** describing what the character expects to gain from this contact, or conveying a threat or an opportunity that the character wants to make known. These provide a penalty of at least +1 and possibly more, if the Gamemaster rules that the concept being conveyed is exceedingly complicated or esoteric.

            ### Culture Situation Modifiers
            | Condition | Modifier |
            | :--- | :--- |
            | Simple concepts | -1 |
            | Everyday concepts | 0 |
            | Complex concepts | +1 |
            | Etiquette ranks 3-5 | -1 |
            | Etiquette ranks 6-8 | -2 |
            | Etiquette ranks 9-11 | -3 |
            | Etiquette rank 12 | -4 |
      - es:
          name: Cultura
          description: |-
            Esta amplia habilidad representa la capacidad de un personaje para comprender e interactuar con culturas diferentes a la suya. Las áreas de conocimiento cubiertas por la habilidad incluyen las costumbres, la filosofía y la forma de vida de una cultura en particular, así como una familiaridad básica con las principales figuras históricas, eventos y tendencias importantes para esa cultura. En el uso de la habilidad amplia, un personaje aplica lo que sabe sobre tendencias y estudios culturales para hacer una suposición fundamentada sobre cómo interactuar con un miembro de otra cultura. Esta amplia habilidad proporciona al menos un conocimiento práctico de qué hacer cuando se trata de cualquier cultura alienígena. Cuando Cultura o cualquiera de sus habilidades especiales se usa en un contexto interactivo con uno o más personajes, se considera una habilidad de encuentro (ver la barra lateral). Un resultado de Fallo Crítico en una prueba de habilidad indica que el personaje ha insultado profundamente al individuo o grupo con el que está tratando de tratar. Otros resultados de pruebas de habilidades cambian la actitud del objetivo como se muestra en **TABLA P25: EFECTOS DE LAS HABILIDADES DEL ENCUENTRO**. Cuanto mayor es el grado de éxito, más atractivo y halagador parece el personaje para los miembros de la cultura con la que está tratando. La complejidad de las ideas que se comunican durante el uso de la habilidad Cultura (o el uso de una de sus habilidades especiales) puede proporcionar un modificador a la prueba de habilidad:

            Los conceptos simples (mensajes básicos como intercambiar nombres, transmitir intenciones amistosas y ofrecer ayuda) otorgan una bonificación de -1 a la prueba de habilidad.

            Los conceptos cotidianos (información que es algo más difícil de transmitir, como explicar el lugar de origen o la ocupación) no proporcionan ningún modificador.

            Los conceptos complejos (que describen lo que el personaje espera obtener de este contacto, o transmiten una amenaza o una oportunidad que el personaje quiere dar a conocer) proporcionan una penalización de al menos +1 y posiblemente más, si el Director de Juego determina que el concepto que se transmite es excesivamente complicado o esotérico.

            ### Modificadores de la situación cultural
            | Condición | Modificador |
            | :--- | :--- |
            | Conceptos simples | -1 |
            | Conceptos cotidianos | 0 |
            | Conceptos complejos | +1 |
            | La etiqueta ocupa el puesto 3-5 | -1 |
            | La etiqueta ocupa el puesto 6-8 | -2 |
            | La etiqueta ocupa el puesto 9-11 | -3 |
            | Etiqueta rango 12 | -4 |
    items:
      etiquette:
        attribute: PER
        cost: 3
        url: /skills/culture#etiquette
        localized:
          - en:
              name: Etiquette
              description: |-
                This skill can't be used untrained. For each separate purchase of this specialty skill, a character selects a specific culture. As the specialty skill is improved, the character gains a progressively stronger grasp on the customs, attitudes, and beliefs of that culture.

                The Gamemaster will decide what constitutes a “specific culture,” taking the campaign setting into account. In a campaign that takes place entirely on Earth, different countries may represent specific cultures; in a starfaring campaign, each planet, star system, or alien species could be a different culture.

                ### Rank Benefits
                ⊗ **Rank 3, 6, 9, 12 [Increased Effect]:** Gaining ranks in *culture-etiquette* as it pertains to a certain culture translates into a bonus to the use of *culture-diplomacy* when that skill is used on a member of the culture in question. Having the appropriate *culture-etiquette* skill at rank 3 provides a -1 bonus to *culture-diplomacy* skill checks. The bonus improves to -2 at rank 6, to -3 at rank 9, and to -4 at rank 12.
          - es:
              name: First Encounter
              description: |-
                Esta habilidad no se puede utilizar sin entrenamiento. Por cada compra por separado de esta habilidad especializada, un personaje selecciona una cultura específica. A medida que se mejora la habilidad especial, el personaje adquiere progresivamente una mayor comprensión de las costumbres, actitudes y creencias de esa cultura.
                - **Efecto aumentado:** Ganar rangos en Cultura: la etiqueta en lo que respecta a una determinada cultura se traduce en una bonificación al uso de Diplomacia cultural cuando esa habilidad se usa en un miembro de la cultura en cuestión. Tener la habilidad de etiqueta en el rango 3 proporciona una bonificación de -1 a las pruebas de habilidad de diplomacia. La bonificación mejora a -2 en el rango 6, a -3 en el rango 9 y a -4 en el rango 12.

                El Director de Juego decidirá qué constituye una “cultura específica”, teniendo en cuenta el entorno de la campaña. En una campaña que se desarrolla íntegramente en la Tierra, diferentes países pueden representar culturas específicas; En una campaña espacial, cada planeta, sistema estelar o especie alienígena podría ser una cultura diferente.

                ### Beneficios de rango (sinergia de interacción)
                Los rangos en Etiqueta proporcionan una bonificación a las pruebas de **Diplomacia** realizadas dentro de esa cultura específica:

                ⊗ **Rango 3:** -1 bonificación por dado de situación.

                ⊗ **Rango 6:** -Bonificación de 2 pasos.

                ⊗ **Rango 9:** -Bonificación de 3 pasos.

                ⊗ **Rango 12:** -Bono de 4 pasos.
        trained_only: true
        rank_benefits: []
      diplomacy:
        attribute: PER
        cost: 3
        url: /skills/culture#diplomacy
        localized:
          - en:
              name: Diplomacy
              description: |-
                This specialty skill allows a character to improve his ability to reach agreements and understandings with representatives of different nations, cultures, subcultures and species. In general, diplomacy will come into play when a character wants to reach an accord with a member of a different culture. The skill can only be used on a particular target if the character has at least rank 1 in the specific Culture—etiquette skill that pertains to the target''s culture. Interaction and its specialty skills are usually used for interpersonal dealings between members of the same culture, but the Gamemaster may decide that Culture—diplomacy is also useful in such cases. (If so, it''s not necessary for a character to have the etiquette skill that pertains to his or her culture in order to use diplomacy on other members of that culture.) Depending on the nature of the issue to be resolved, the diplomacy skill check may be a single dice roll, or it may be a complex skill check requiring an extended period of time to complete.
          - es:
              name: Etiqueta
              description: 'Esta habilidad especial permite al personaje mejorar su capacidad para llegar a acuerdos y entendimientos con representantes de diferentes naciones, culturas, subculturas y especies. En general, la diplomacia entrará en juego cuando un personaje quiera llegar a un acuerdo con un miembro de una cultura diferente. La habilidad solo se puede usar en un objetivo en particular si el personaje tiene al menos el rango 1 en la Cultura específica: habilidad de etiqueta que pertenece a la cultura del objetivo. La interacción y sus habilidades especiales se utilizan normalmente para tratos interpersonales entre miembros de la misma cultura, pero el Director de Juego puede decidir que la diplomacia cultural también sea útil en tales casos. (Si es así, no es necesario que un personaje tenga la habilidad de etiqueta que pertenece a su cultura para poder usar la diplomacia con otros miembros de esa cultura). Dependiendo de la naturaleza del problema a resolver, la prueba de
                habilidad de diplomacia puede ser una sola tirada de dados, o puede ser una prueba de habilidad compleja que requiera un período prolongado de tiempo para completarse.'
        trained_only: false
      first-encounter:
        attribute: PER
        cost: 3
        url: /skills/culture#first-encounter
        localized:
          - en:
              name: First Encounter
              description: |-
                This specialty skill represents a character's training in the theories and protocols of making first contact with a previously unknown culture. With this skill, a character can assess the mental, physical, and technological capabilities of an unfamiliar species, begin the process of establishing communications and learning each other's language, and make a preliminary study of the strangers' cultural and societal habits. 

                A first encounter skill check is always a complex chore, and may take days, weeks, or even months to successfully complete. The Gamemaster will assign the number of successes necessary to complete the skill check based on the extent of difference between the two cultures involved. Also, the Gamemaster will determine the initial attitude of the target creature(s) toward the character, and may inform the character of changes in that attitude that take place while the complex skill check is under way. 

                Upon the successful completion of the first encounter skill check, the character immediately gains rank 1 in the *knowledge-language* and *culture-etiquette* skills that relate to the formerly unknown culture.

                ### Rank Benefits
                ⊗ **Rank 3, 6, 9, 12 [Adaptable]:** Gains a situation bonus based on the ranks in this specialty skill (-1 step at Rank 3, -2 steps at Rank 6, -3 steps at Rank 9, and -4 steps at Rank 12) when dealing with unknown cultures.
          - es:
              name: First Encounter
              description: |-
                Esta habilidad especializada representa el entrenamiento de un personaje en las teorías y protocolos para hacer el primer contacto con una cultura previamente desconocida. Con esta habilidad, un personaje puede evaluar las capacidades mentales, físicas y tecnológicas de una especie desconocida, comenzar el proceso de establecer comunicaciones y aprender el idioma de los demás, y realizar un estudio preliminar de los hábitos culturales y sociales de los extraños. Una prueba de habilidad del primer encuentro es siempre una tarea compleja y puede tardar días, semanas o incluso meses en completarse con éxito. El Director de Juego asignará la cantidad de éxitos necesarios para completar la prueba de habilidad en función del grado de diferencia entre las dos culturas involucradas. Además, el Director de Juego determinará la actitud inicial de la(s) criatura(s) objetivo hacia el personaje, y puede informar al personaje de los cambios en esa actitud que tengan lugar mientras se lleva a cabo la compleja prueba de habilidad. Al completar con éxito la prueba de habilidad del primer encuentro, el personaje obtiene inmediatamente el rango 1 en las habilidades de etiqueta de Conocimiento (idioma y cultura) que se relacionan con la cultura anteriormente desconocida.
        trained_only: true
    trained_only: false
  deception:
    attribute: PER
    cost: 5
    category: Social
    url: /skills/deception
    localized:
      - en:
          name: Deception
          description: |-
            The proficiency at deceiving others through conversation and face-to-face interaction. It covers all verbal tricks and subterfuges.

            ### Resolution
            - **Opposed Check:** Modified by the target’s **Intelligence** resistance modifier.
            - **Encounter Skill:** Used to shift attitudes as per [Table P25: Encounter Skill Effects]({{< relref "core-mechanics/useful-tables#table-p25-encounter-skill-effects" >}}).

            ### Gambling Rules
            Gambling is an opposed check against the opponent's **Intelligence** (for Logic Games) or **Will** (for Nerve Games) resistance modifier.

            **The Sitting:** One check represents a "session" or high-stakes moment.
            - **Ordinary Success:** Win 1.5x stake.
            - **Good Success:** Win 2x stake.
            - **Amazing Success:** Win 5x stake.
            - **Failure:** Lose stake.
            - **Critical Failure:** Significant loss (lose 2x stake/debt) or social disaster.

            **Cheating:** Declare before rolling. Gain a **-3 step bonus**, but any **Failure** result is treated as a **Critical Failure (Caught)**.
      - es:
          name: Engaño
          description: |-
            La habilidad para engañar a otros a través de la conversación y la interacción cara a cara. Cubre todos los trucos y subterfugios verbales.

            ### Resolución
            - **Verificación opuesta:** Modificado por el modificador de resistencia de **Inteligencia** del objetivo.
            - **Habilidad de encuentro:** Se utiliza para cambiar actitudes según la [Tabla P25: Efectos de las habilidades de encuentro]({{< relref "core-mechanics/useful-tables#table-p25-encounter-skill-effects" >}}).

            ### Reglas de juego
            El juego es una prueba opuesta contra el modificador de resistencia de **Inteligencia** (para juegos de lógica) o **Voluntad** (para juegos de nervios) del oponente.

            **La sesión:** Un cheque representa una "sesión" o un momento de alto riesgo.
            - **Éxito ordinario:** Gana 1,5 veces tu apuesta.
            - **Buen éxito:** Gana el doble de tu apuesta.
            - **Éxito increíble:** Gana 5x tu apuesta.
            - **Fallo:** Pierde la apuesta.
            - **Falla crítica:** Pérdida significativa (pérdida del doble de la participación/deuda) o desastre Social.

            **Hacer trampa:** Declarar antes de rodar. Obtienes una **bonificación de -3 pasos**, pero cualquier resultado de **Falla** se trata como una **Falla crítica (detectada)**.
    items:
      bluff:
        attribute: PER
        cost: 3
        url: /skills/deception#bluff
        localized:
          - en:
              name: Bluff
              description: |-
                The talent for misleading through false bravado, outright lies, or deterring others by displaying unwarranted confidence.
                - **Ordinary:** The bluff works for the immediate scene.
                - **Good:** Target's attitude improves by one grade for d8+1 time units.
                - **Amazing:** Target's attitude improves by two grades for d12+2 time units.
                - **Failure:** The character's patter is considered annoying/condescending.
                - **Critical Failure:** The bluff is exposed; target becomes **Hostile** or **Combative**.

                _As always the time unit is decided by the Gamemaster based on the situation_
          - es:
              name: Mentir
              description: |-
                El talento para engañar mediante falsas bravuconadas, mentiras descaradas o disuadir a otros mostrando una confianza injustificada.
                - **Ordinario:** El farol funciona para la escena inmediata.
                - **Bueno:** La actitud del objetivo mejora en un grado durante d8+1 unidades de tiempo.
                - **Increíble:** La actitud del objetivo mejora en dos grados durante d12+2 unidades de tiempo.
                - **Error:** El patrón del personaje se considera molesto/condescendiente.
                - **Fallo crítico:** El farol queda expuesto; El objetivo se vuelve **Hostil** o **Combativo**.

                _Como siempre, la unidad de tiempo la decide el Director de Juego en función de la situación_
        trained_only: false
      bribe:
        attribute: PER
        cost: 3
        url: /skills/deception#bribe
        localized:
          - en:
              name: Bribe
              description: |-
                The ability to offer money, goods, or services to influence a target.

                ### The Assessment
                Before making an offer, a character can make a separate **Bribe** check to "size up" the target. On a success, the Gamemaster reveals the "Proper Bribe" (the baseline value required for an Ordinary success).

                ### Sweetening the Deal
                Offering more than the Proper Bribe provides a bonus to the actual Bribe check:
                - **+25% Value:** -1 step bonus.
                - **+50% Value:** -2 steps bonus.
                - **+100% Value:** -3 steps bonus.

                **The Greed Trap:** Offering over **200%** of the Proper Bribe makes the target nervous or suspicious. The target may take the bribe and still betray the character, or report the attempt to authorities.

                **Results:**
                - **Ordinary:** Bribe accepted, but attitude is unchanged.
                - **Good:** Bribe accepted; attitude improves by one grade for 2d6 hours or until the character does something to change the relationship.
                - **Amazing:** Bribe accepted; attitude improves by two grades for 4d6 hours or until the character does something to change the relationship.
                - **Failure:** Bribe refused. Subsequent attempts require a higher value.
                - **Critical Failure:** Bribe refused; target becomes **Hostile** or **Combative**.
          - es:
              name: Soborno
              description: |-
                La capacidad de ofrecer dinero, bienes o servicios para influir en un objetivo.

                ### La evaluación
                Antes de hacer una oferta, un personaje puede realizar una prueba separada de **Soborno** para "evaluar" al objetivo. En caso de éxito, el Director de Juego revela el "Soborno Adecuado" (el valor básico requerido para un éxito Ordinario).

                ### Endulzando el trato
                Ofrecer más que el soborno adecuado proporciona una bonificación al cheque de soborno real:
                - **+25% Valor:** -Bono de 1 paso.
                - **+50% Valor:** -Bono de 2 pasos.
                - **+100% Valor:** -Bono de 3 pasos.

                **La trampa de la codicia:** Ofrecer más del **200 %** del soborno adecuado pone nervioso o sospechoso al objetivo. El objetivo puede aceptar el soborno y aun así traicionar al personaje, o denunciar el intento a las autoridades.

                **Resultados:**
                - **Ordinario:** Se acepta soborno, pero la actitud no cambia.
                - **Bueno:** Soborno aceptado; La actitud mejora en un grado durante 2d6 horas o hasta que el personaje haga algo para cambiar la relación.
                - **Increíble:** Soborno aceptado; La actitud mejora dos grados durante 4d6 horas o hasta que el personaje haga algo para cambiar la relación.
                - **Fracaso:** Soborno rechazado. Los intentos posteriores requieren un valor más alto.
                - **Falla crítica:** Soborno rechazado; El objetivo se vuelve **Hostil** o **Combativo**.
