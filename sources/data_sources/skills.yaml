          - **Time Commitment:** The personaje must spend at least 4 hours a day working with the creature.
          - **Check Frequency:** A skill check is made at the end of each week of continuous work.
          - **Interruptions:** If the training is interrupted by one or more days, any days worked since the last check are lost. An interruption of a week or more may cause the entire training attempt to fail.

          **Training Outcomes:**
          - **Fallo Crítico:** The animal goes berserk and attacks its trainer.
          - **Three Failures:** The animal refuses to be trained by this personaje.

          ### Task Difficulty
          Untrained animals (wild or domestic) can only perform tasks of up to **Ordinario** difficulty.
          - **Ordinario:** Simple, one-word commands (Attack, Come, Sit, Stay, Fetch, Speak, Quiet).
          - **Bueno:** Combinations of two Ordinario tasks, or more difficult actions (e.g., pushing a lever).
          - **Asombroso:** Tasks very few animals can or will do on command (e.g., rescuing someone from a burning building).

          ### Animal Handling Situation Modifiers
