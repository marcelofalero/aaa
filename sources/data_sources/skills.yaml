  animal-handling:
    attribute: WIL
    cost: 3
    category: Other
    url: /skills/animal-handling
    localized:
      - en:
          name: Animal Handling
          description: |-
            This broad skill provides a character with the basic ability to train animals to perform a variety of tasks, including doing labor, accepting riders, tracking, and attacking. It's also used to determine if a character can get a trained animal to perform a task, to ride an animal, or to calm, capture, or otherwise handle a wild animal or an unfamiliar domestic animal. Note that the methods of training and the commands used with different animal species can vary widely.

            Purchasing the broad skill entitles a character to select one type of animal that he is able to train, subject to the approval of the Gamemaster. (e.g., "horse", or more specific breeds if required). To handle more than one type of animal, the character should possess the **Animal Training** specialty skill.

            ### Training Animals
            Any use of the Animal Handling broad skill to train a creature requires a **complex skill check**.
            - **Time Commitment:** The character must spend at least 4 hours a day working with the creature.
            - **Check Frequency:** A skill check is made at the end of each week of continuous work.
            - **Interruptions:** If the training is interrupted by one or more days, any days worked since the last check are lost. An interruption of a week or more may cause the entire training attempt to fail.

            **Training Outcomes:**
            - **Critical Failure:** The animal goes berserk and attacks its trainer.
            - **Three Failures:** The animal refuses to be trained by this character.

            ### Task Difficulty
            Untrained animals (wild or domestic) can only perform tasks of up to **Ordinary** difficulty.
            - **Ordinary:** Simple, one-word commands (Attack, Come, Sit, Stay, Fetch, Speak, Quiet).
            - **Good:** Combinations of two Ordinary tasks, or more difficult actions (e.g., pushing a lever).
            - **Amazing:** Tasks very few animals can or will do on command (e.g., rescuing someone from a burning building).

            ### Animal Handling Situation Modifiers
            <div class="table-wrapper"> <table> <thead> <tr> <th>Type</th> <th>Modifier</th> <th>Complexity</th> </tr> </thead> <tbody> <tr class="table-category"> <td colspan="3"><strong>Herbivores</strong></td> </tr> <tr> <td>Alien</td> <td>+2</td> <td>Amazing</td> </tr> <tr> <td>Domestic</td> <td>-1</td> <td>Good</td> </tr> <tr> <td>Wild</td> <td>+1</td> <td>Amazing</td> </tr> <tr class="table-category"> <td colspan="3"><strong>Carnivores</strong></td> </tr> <tr> <td>Alien</td> <td>+5</td> <td>Amazing</td> </tr> <tr> <td>Domestic</td> <td>-2</td> <td>Ordinary</td> </tr> <tr> <td>Wild</td> <td>+4</td> <td>Good</td> </tr> </tbody> </table> </div>

            ### Other Modifiers
            - **Unfamiliar animal:** +1 penalty (cumulative with others).
            - **Trained animal:**
                - Ordinary task: +0
                - Good task: +2
                - Amazing task: +4

            ### Riding Animals
            The broad skill enables a character to ride any animal used for basic ground transportation (horses, mules, etc.).
            - **Movement:** When ridden, the creature moves in every phase.
            - **Maneuvers:** During a character's action, they can attempt maneuvers (Routine, Moderate, or Extreme) as described in [Vehicle Maneuvers](/core-mechanics/vehicles-and-vessels/#maneuvers).
      - es:
          name: Manejo de Animales
          description: |-
            Esta amplia habilidad proporciona al Personaje la capacidad básica de entrenar animales para realizar una variedad de tareas, que incluyen trabajar, aceptar jinetes, rastrear y atacar. También se utiliza para determinar si un Personaje puede lograr que un animal entrenado realice una tarea, monte un animal o calme, capture o maneje de otra manera a un animal salvaje o un animal doméstico desconocido. Tenga en cuenta que los métodos de entrenamiento y las órdenes utilizadas con diferentes especies animales pueden variar ampliamente.

            La compra de la habilidad amplia le da derecho a Personaje a seleccionar un tipo de animal que puede entrenar, sujeto a la aprobación de Director de Juego. (por ejemplo, "caballo" o razas más específicas si es necesario). Para manejar más de un tipo de animal, el Personaje debe poseer el **Entrenamiento de animales** Especialidad.

            ### Entrenando animales
            Cualquier uso de la habilidad amplia de Manejo de animales para entrenar una criatura requiere una **prueba de habilidad compleja**.
            - **Compromiso de tiempo:** El Personaje debe pasar al menos 4 horas al día trabajando con la criatura.
            - **Frecuencia de verificación:** Se realiza una verificación de habilidades al final de cada semana de trabajo continuo.
            - **Interrupciones:** Si la formación se interrumpe por uno o más días, se pierden los días trabajados desde el último control. Una interrupción de una semana o más puede hacer que fracase todo el intento de entrenamiento.

            **Resultados de la capacitación:**
            - **Fallo Crítico:** El animal se vuelve loco y ataca a su entrenador.
            - **Tres Fallos:** El animal se niega a ser entrenado por este Personaje.

            ### Dificultad de la tarea
            Los animales no entrenados (salvajes o domésticos) solo pueden realizar tareas de hasta **Ordinario** dificultad.
            - **Ordinario:** Comandos simples de una palabra (atacar, venir, sentarse, quedarse, buscar, hablar, callar).
            - **Bueno:** Combinaciones de dos tareas Ordinario o acciones más difíciles (por ejemplo, empujar una palanca).
            - **Asombroso:** Tareas que muy pocos animales pueden o harán cuando se les ordena (por ejemplo, rescatar a alguien de un edificio en llamas).

            ### Modificadores de situaciones de manejo de animales
            <div class="table-wrapper"> <table> <thead> <tr> <th>Tipo</th> <th>Modificador</th> <th>Complejidad</th> </tr> </thead> <tbody> <tr class="table-category"> <td colspan="3"><strong>Herbivoros</strong></td> </tr> <tr> <td>Alien</td> <td>+2</td> <td>Asombroso</td> </tr> <tr> <td>Nacional</td> <td>-1</td> <td>Bueno</td> </tr> <tr> <td>Salvaje</td> <td>+1</td> <td>Asombroso</td> </tr> <tr class="table-category"> <td colspan="3"><strong>Carnívoros</strong></td> </tr> <tr> <td>Extranjero</td> <td>+5</td> <td>Asombroso</td> </tr> <tr> <td>Nacional</td> <td>-2</td> <td>Ordinario</td> </tr> <tr> <td>Salvaje</td> <td>+4</td> <td>Bueno</td> </tr> </tbody> </table> </div>

            ### Modificadores Otros
            - **Animal desconocido:** +1 de penalización (acumulable con otros).
            - **Animal entrenado:**
                - Tarea Ordinario: +0
                - Tarea Bueno: +2
                - Tarea Asombroso: +4

            ### Montar animales
            Esta amplia habilidad permite a un Personaje montar cualquier animal utilizado para el transporte terrestre básico (caballos, mulas, etc.).
            - **Movimiento:** Cuando es montada, la criatura se mueve en cada fase.
            - **Maniobras:** Durante la acción de un Personaje, puede intentar maniobras (de rutina, moderadas o extremas) como se describe en [Maniobras del vehículo](/core-mechanics/vehicles-and-vessels/#maneuvers).
    items:
      animal-riding:
        attribute: WIL
        cost: 1
        url: /skills/animal-handling#animal-riding
        localized:
          - en:
              name: Animal riding
              description: |-
                This specialty skill enables a character to improve this aspect of the Animal Handling broad skill. A character with this skill can attempt racing over dangerous terrain, making jumps or performing other stunts, and engaging in mounted combat.

                ▶ **Rank 3[Trick Riding]:** The character learns to perform special stunts or tricks while mounted. See trick riding.

                ### Trick Riding
                The character can direct their mount to jump fences, leap chasms, or move backward.
                - **Critical Failure:** The animal trips (damage as an Extremely Short fall for both).
                - **Failure:** The animal refuses to perform.

                #### Horizontal Leaps
                - **Ordinary:** Normal distance + 1 meter.
                - **Good:** Normal distance + 2 meters.
                - **Amazing:** Normal distance + 3 meters.

                #### Jumping Obstructions
                - **Ordinary:** Normal distance + 1 meter.
                - **Good:** Normal distance + 1.5 meters.
                - **Amazing:** Normal distance + 2 meters.

                #### Moving Backward:
                - **Ordinary:** Half walk movement rate.
                - **Good:** Full walk movement rate.
                - **Amazing:** 1.5x walk movement rate.

                #### Mounted Cover
                The character can use their mount for cover. This provides a penalty to an opponent's chance to hit the rider:
                - **Ordinary:** +1 step.
                - **Good:** +2 steps.
                - **Amazing:** +3 steps.

                *Note: This does not protect the mount. Trick riding cannot be combined with other actions (e.g., attacking while leaping).*
          - es:
              name: Montar Animales
              description: |-
                Este Especialidad permite que un Personaje mejore este aspecto de la habilidad amplia de Manejo de animales. Un Personaje con esta habilidad puede intentar correr sobre terreno peligroso, hacer saltos o realizar acrobacias Otros y participar en Combate montado.

                ▶ **Rango 3[Trick Riding]:** El Personaje aprende a realizar acrobacias o trucos especiales mientras está montado. Ver trucos.

                ### Truco de montar
                El Personaje puede dirigir su montura para saltar vallas, saltar abismos o retroceder.
                - **Fallo Crítico:** Los viajes del animal (daño como Caída Extremadamente Corto para ambos).
                - **Fallo:** El animal se niega a actuar.

                #### Saltos horizontales
                - **Ordinario:** Distancia normal + 1 metro.
                - **Bueno:** Distancia normal + 2 metros.
                - **Asombroso:** Distancia normal + 3 metros.

                #### Saltar obstáculos
                - **Ordinario:** Distancia normal + 1 metro.
                - **Bueno:** Distancia normal + 1,5 metros.
                - **Asombroso:** Distancia normal + 2 metros.

                #### Retrocediendo:
                - **Ordinario:** Tasa de movimiento de media caminata.
                - **Bueno:** Velocidad de movimiento de caminata completa.
                - **Asombroso:** Velocidad de movimiento al caminar 1,5x.

                #### Cubierta montada
                El Personaje puede utilizar su soporte como cobertura. Esto proporciona una penalización a la posibilidad de que un oponente golpee al ciclista:
                - **Ordinario:** +1 paso.
                - **Bueno:** +2 pasos.
                - **Asombroso:** +3 pasos.

                *Nota: Esto no protege el soporte. Los trucos no se pueden combinar con acciones Otros (por ejemplo, atacar mientras se salta).*
        trained_only: false
        rank_benefits: []
      animal-training:
        attribute: WIL
        cost: 3
        url: /skills/animal-handling#animal-training
        localized:
          - en:
              name: Animal training
              description: |-
                This skill allows a character to handle, ride, and train a specific type of animal (the "Primary Animal" selected when purchasing the broad skill). A character can also use their **Animal Training** rank to interact with animals other than their Primary Animal, but they suffer a penalty to the skill check based on the biological or behavioral distance from their specialty:

                | Relationship | Modifier | Description |
                | :--- | :--- | :--- |
                | **Identical Type** | +0 | Different breeds or closely related species (e.g., Quarter Horse vs. Thoroughbred). |
                | **Related Type** | +1 | Similar anatomy or behavior (e.g., Horse vs. Mule, or a Wolf vs. a Domestic Dog). |
                | **Different Family** | +2 | Significant biological or behavioral differences (e.g., Mammal vs. Reptile, or Herbivore vs. Carnivore). |
                | **Alien/Xeno-creature** | +3 or more | Completely foreign biology or instincts. |
              rank_benefits:
                - rank: 3
                  title: Versatility
                - rank: 6
                  title: Versatility
                - rank: 9
                  title: Versatility
                - rank: 12
                  title: Versatility
          - es:
              name: Entrenamiento de animales
              description: |-
                Esta habilidad le permite a Personaje manejar, montar y entrenar un tipo específico de animal (el "Animal principal" seleccionado al comprar la habilidad general). Un Personaje también puede usar su **Entrenamiento de animales** Rango para interactuar con animales Otros distintos de su animal primario, pero sufre una penalización en la prueba de habilidad según la distancia biológica o de comportamiento de su especialidad:

                | Relación | Modificador | Descripción |
                | :--- | :--- | :--- |
                | **Tipo idéntico** | +0 | Diferentes razas o especies estrechamente relacionadas (por ejemplo, cuarto de milla versus pura sangre). |
                | **Tipo relacionado** | +1 | Anatomía o comportamiento similar (por ejemplo, caballo versus mula, o lobo versus perro doméstico). |
                | **Familia diferente** | +2 | Diferencias biológicas o de comportamiento significativas (p. ej., mamífero versus reptil, o herbívoro versus carnívoro). |
                | **Alien/Xeno-criatura** | +3 o más | Biología o instintos completamente extraños. |
        trained_only: false
    trained_only: false
  armor-operation:
    attribute: STR
    cost: 7
    category: Other
    url: /skills/armor-operation
    localized:
      - en:
          name: Armor Operation
          description: |-
            Armor that's bulky, heavy, and cumbersome hinders the character using it. This is reflected by a penalty to the character's action check (AP) and the lessening or negating of a character's **Dexterity** resistance modifier. The Armor Operation broad skill and its specialty skills help to alleviate these penalties.

            ### Base Effect
            Having just the broad skill allows a character to reduce the action check and Dexterity resistance modifier penalty of any type of armor by 1 step.
            - **Example:** A +1 AP penalty is reduced to 0.
            - **Limitation:** This benefit never provides a bonus.

            ### Strenuous Activity
            Some strenuous physical activities (jumping, running, climbing, etc.) while armored may require an **Armor Operation** check.
            - **Ordinary:** Half effect (e.g., run at one-half the normal rate).
            - **Good or better:** Full effect (e.g., run at the normal rate).

            ### Untrained
            Characters **untrained** in Armor Operation suffer the full penalty of any armor.
            - **Restrictions:** They can only walk and make simple attacks (no rank benefits allowed).
            - **Powered Armor:** Untrained characters cannot use powered armor.

            *Note: The AP penalty of armors and shields is cumulative.*
      - es:
          name: Operación de armadura
          description: |-
            La armadura que es voluminosa, pesada y engorrosa impide que Personaje la use. Esto se refleja en una penalización al Tirada de Acción (AP) del Personaje y la disminución o negación del modificador de resistencia **Destreza** del Personaje. La habilidad amplia Operación de armadura y sus habilidades especiales ayudan a aliviar estas penalizaciones.

            ### Efecto base
            Tener solo la habilidad amplia le permite a un Personaje reducir la penalización del modificador de resistencia a Tirada de Acción y Destreza de cualquier tipo de armadura en 1 paso.
            - **Ejemplo:** Una penalización de +1 AP se reduce a 0.
            - **Limitación:** Este beneficio nunca proporciona una bonificación.

            ### Actividad extenuante
            Algunas actividades Físico extenuantes (saltar, correr, escalar, etc.) mientras se lleva armadura pueden requerir una verificación **Operación de armadura**.
            - **Ordinario:** Efecto medio (por ejemplo, correr a la mitad del ritmo normal).
            - **Bueno o mejor:** Efecto completo (p. ej., funcionamiento a velocidad normal).

            ### Sin entrenamiento
            Los personajes **no entrenados** en Operación de armadura sufren la penalización total de cualquier armadura.
            - **Restricciones:** Solo pueden caminar y realizar ataques simples (no se permiten beneficios Rango).
            - **Armadura potenciada:** Los personajes no entrenados no pueden usar Armadura potenciada.

            *Nota: La penalización de AP de las armaduras y Escudos es acumulativa.*
    items:
      combat-armor:
        attribute: STR
        cost: 3
        url: /skills/armor-operation#combat-armor
        localized:
          - en:
              name: Combat armor
              description: |-
                This specialty represents the level of mastery in the use of armor, as well as the specialized training needed to use powered armors, allowing the character to obtain the most of any armor.

                ⊗ **Rank 1, 4, 6, 10 [Improved Operation]:** The reduction to action check and Dexterity resistance modifier penalties becomes 2 steps. This improves to 3 steps at **Rank 4**, 4 steps at **Rank 6**, and 5 steps at **Rank 10**.

                ⊗ **Rank 2, 4, 6, 8, 10, 12 [Shaking Off Stuns]:** Stun damage (including secondary) is reduced by 1 point. This increases by 1 for every 2 ranks attained (max 6 points at **Rank 12**).

                ▶ **Rank 7 [Powered Armor Operation]:** The character has mastered the synchronization required to operate Powered Armor suits.
          - es:
              name: Armadura de Combate
              description: |-
                Esta especialidad representa el nivel de dominio en el uso de armaduras, así como el entrenamiento especializado necesario para usar armaduras Armas de energía, permitiendo al Personaje obtener el máximo rendimiento de cualquier armadura.

                ⊗ **Rango 1, 4, 6, 10 [Operación mejorada]:** La reducción a Tirada de Acción y las penalizaciones del modificador de resistencia a la Destreza se convierten en 2 pasos. Esto mejora a 3 pasos en **Rango 4**, 4 pasos en **Rango 6** y 5 pasos en **Rango 10**.

                ⊗ **Rango 2, 4, 6, 8, 10, 12 [Sacudir los aturdimientos]:** El daño de Aturdimiento (incluido el secundario) se reduce en 1 punto. Esto aumenta en 1 por cada 2 Rangos obtenidos (máximo 6 puntos en **Rango 12**).

                ▶ **Rango 7 (Armas de energía Operación de armadura):** El Personaje ha dominado la sincronización necesaria para operar los trajes Armadura potenciada.
        trained_only: false
        rank_benefits:
          - rank: 1
            title: Improved Operation
          - rank: 2
            title: Shaking Off Stuns
          - rank: 7
            title: Powered Armor Operation
      tactical-armor:
        attribute: INT
        cost: 3
        url: /skills/armor-operation#tactical-armor
        localized:
          - en:
              name: Tactical armor
              description: |-
                This specialty skill enters into play when armors with integrated equipment are used (sensors, communications, etc.). It does not apply to mounted weaponry, which uses its own specific skill. It can also be used to resist electronic attacks like sensor hacking or jamming.

                ▶ **Rank 2 [Tactical Multi-tasking]:** The character can perform one operation with integrated suit equipment (cycling sensors, changing frequencies) without spending an action. One additional free operation is gained at **Rank 6** and **Rank 10**.

                ▶ **Rank 5 [Sensor Proficiency]:** Receive a **-1 step bonus** to checks involving the operation or interpretation of integrated suit sensors.

                ▶ **Rank 7 [Counter-Intrusion]:** Gain a **-1 step bonus** to resist electronic warfare or hacking attempts directed at the suit. This improves to **-2 steps** at **Rank 11**.
          - es:
              name: Armadura Táctica
              description: |-
                Este Especialidad entra en juego cuando se utilizan armaduras con equipos integrados (sensores, comunicaciones, etc.). No se aplica al armamento montado, que utiliza su propia habilidad específica. También se puede utilizar para resistir ataques electrónicos como piratería o interferencia de sensores.

                ▶ **Rango 2 (Multitarea táctica):** El Personaje puede realizar una operación con el equipo integrado del traje (sensores de ciclismo, cambio de frecuencias) sin gastar una acción. Se obtiene una operación gratuita adicional en **Rango 6** y **Rango 10**.

                ▶ **Rango 5 (Competencia con el sensor):** Reciba un **-1 Bonificación de paso** para verificaciones que involucren el funcionamiento o la interpretación de los sensores integrados del traje.

                ▶ **Rango 7 (Contraintrusión):** Obtén un **-1 Bonificación de paso** para resistir la guerra electrónica o los intentos de piratería dirigidos al traje. Esto mejora a **-2 pasos** en **Rango 11**.
        trained_only: false
        rank_benefits:
          - rank: 2
            title: Tactical Multi-tasking
          - rank: 5
            title: Sensor Proficiency
          - rank: 7
            title: Counter-Intrusion
      propulsion-systems:
        attribute: INT
        cost: 3
        url: /skills/armor-operation#propulsion-systems
        localized:
          - en:
              name: Propulsion systems
              description: |-
                This specialty skill represents mastery in the use of integrated propulsion systems, such as jetpacks, underwater drives, or gravitic assisted deceleration systems (GADS).

                ▶ **Rank 2 [Thermal/Fuel Management]:** Optimize fuel or heat dissipation, extending operational time of propulsion units by 50%.

                ▶ **Rank 4 [Vector Calibration & Aerobatics Integration]:** Adjust thrust nozzles for specific tasks, providing a **-1 step bonus** to maneuvering checks. Additionally, the character is sufficiently familiarized with armor propulsion systems to use the **Aerobatics** specialty skill for complex maneuvers while wearing the suit.

                ▶ **Rank 7 [Maximum Burn]:** Make a Propulsion Systems check to increase speed for the round: Ordinary (+25%), Good (+50%), or Amazing (+100%). Each consecutive round of forcing the engine incurs a cumulative +1 step penalty. The penalty is reduced by 1 for each round the propulsion is not used.
          - es:
              name: Sistemas de propulsión
              description: |-
                Este Especialidad representa el dominio en el uso de Sistemas de propulsión integrados, como mochilas propulsoras, propulsores submarinos o sistemas de desaceleración asistida por gravedad (GADS).

                ▶ **Rango 2 (Gestión térmica/combustible):** Optimice la disipación de combustible o calor, ampliando el tiempo operativo de las unidades de propulsión en un 50 %.

                ▶ **Rango 4 (Calibración vectorial e integración Acrobacia aérea):** Ajusta las boquillas de empuje para tareas específicas, proporcionando un **-1 Bonificación de paso** para las comprobaciones de maniobra. Además, el Personaje está lo suficientemente familiarizado con la armadura Sistemas de propulsión como para usar el **Acrobacia aérea** Especialidad para maniobras complejas mientras usa el traje.

                ▶ **Rango 7 (Máxima combustión):** Haz una comprobación de Sistemas de propulsión para aumentar la velocidad de la ronda: Ordinario (+25%), Bueno (+50%) o Asombroso (+100%). Cada ronda consecutiva de forzado del motor genera un +1 Penalización de paso acumulativo. La penalización se reduce en 1 por cada ronda en la que no se utiliza la propulsión.
        trained_only: false
        rank_benefits:
          - rank: 2
            title: Thermal/Fuel Management
          - rank: 4
            title: Vector Calibration & Aerobatics Integration
          - rank: 7
            title: Maximum Burn
      shields:
        attribute: STR
        cost: 3
        url: /skills/armor-operation#shields
        localized:
          - en:
              name: Shields
              description: |-
                Focuses on the tactical use of physical, energy, or ballistic shields.

                ▶ **Rank 3 [Reactive Block]:** Spend the next available action to perform an opposed check against an attacker. If successful, the attack is negated. (Note: Only Ballistic or Large shields of the appropriate PL can block ranged fire).

                ⊗ **Rank 4 [Resistance Modifier]:** Provides a **+1 improvement** to the **Strength** resistance modifier. This does not stack with Melee Weapons benefits.

                ▶ **Rank 6 [Tactical Charge]:** Negates the standard +2 step bonus opponents receive to hit a charging target.

                ▶ **Rank 8 [Recoil Anchor]:** Reduce the situation die penalty for Burst or Autofire by 1 step when using one-handed weapons with a shield.

                ▶ **Rank 12 [Overlapping Coverage]:** Share the shield's resistance modifier bonus with an ally within 2 meters against one ranged attack per round.
          - es:
              name: Escudos
              description: |-
                Se centra en el uso táctico de Físico, energético o Escudos balístico.

                ▶ **Rango 3 (Bloqueo reactivo):** Gasta la siguiente acción disponible para realizar una prueba enfrentada contra un atacante. Si tiene éxito, el ataque es negado. (Nota: solo el Escudos balístico o grande del PL apropiado puede bloquear el fuego a distancia).

                ⊗ **Rango 4 (Modificador de resistencia):** Proporciona una **mejora de +1** al modificador de resistencia **Fuerza**. Esto no se acumula con los beneficios de las armas cuerpo a cuerpo.

                ▶ **Rango 6 (Carga táctica):** Anula el +2 Bonificación de paso estándar que reciben los oponentes para golpear a un objetivo que carga.

                ▶ **Rango 8 (Ancla de retroceso):** Reduce la penalización de Dado de Situación por Explosión o Disparo automático en 1 paso al usar armas de una mano con escudo.

                ▶ **Rango 12 (Cobertura superpuesta):** Comparte la bonificación del modificador de resistencia del escudo con un aliado en un radio de 2 metros contra un ataque a distancia por ronda.
        trained_only: false
        rank_benefits:
          - rank: 3
            title: Reactive Block
          - rank: 4
            title: Resistance Modifier
          - rank: 6
            title: Tactical Charge
          - rank: 8
            title: Recoil Anchor
          - rank: 12
            title: Overlapping Coverage
    trained_only: false
  athletics:
    attribute: STR
    cost: 3
    category: Other
    url: /skills/athletics
    localized:
      - en:
          name: Athletics
          description: |-
            This broad skill provides a character with the abilities of a natural athlete—a competent level of strength, grace, and physical prowess. This skill is used to determine the success of physical actions such as climbing a tree, jumping over a large hole, or throwing an object at a target.
      - es:
          name: Atletismo
          description: |-
            Esta amplia habilidad proporciona a Personaje las habilidades de un atleta natural: un nivel competente de fuerza, gracia y destreza Físico. Esta habilidad se utiliza para determinar el éxito de las acciones de Físico, como trepar a un árbol, saltar sobre un agujero grande o lanzar un objeto a un objetivo.
    items:
      climb:
        attribute: STR
        cost: 2
        url: /skills/athletics#climb
        localized:
          - en:
              name: Climb
              description: |-
                The ability to scale vertical surfaces and navigate difficult terrain.

                ### Combat Climbing
                Movement per phase based on check: Ordinary (1m), Good (2m), Amazing (3m). Critical Failure results in a fall.

                ### Challenge Climbing
                Outside of rounds, climbing is resolved as a **complex skill check**.
          - es:
              name: Trepar
              description: |-
                La capacidad de escalar superficies verticales y navegar por terrenos difíciles.

                ### Combate Escalada
                Movimiento por fase según comprobación: Ordinario (1m), Bueno (2m), Asombroso (3m). Fallo Crítico da como resultado un Caída.

                ### Desafío de escalada
                Fuera de las rondas, escalar se resuelve como una **prueba de habilidad compleja**.
        trained_only: false
      jump:
        attribute: STR
        cost: 1
        url: /skills/athletics#jump
        localized:
          - en:
              name: Jump
              description: |-
                The ability to leap over obstacles or across gaps.

                ### Types of Jump
                - **Standing:** Ordinary 1m; Good 2m; Amazing 3m.
                - **Running:** Ordinary 2m; Good 4m; Amazing 6m.
                - **Vertical:** Ordinary 1m; Good 1.5m; Amazing 2m.

                ### Vaulting
                Vertical leap enhanced by a pole or object. Adds +1m (object) or +2m (pole) to the jump.

                ### Rank Benefits
                ▶ **Rank 3, 6, 9, 12 [Increased Running Distance]:** Running distance is increased by +1m.

                ▶ **Rank 4, 7, 10 [Increased Standing Distance]:** Standing distance is increased by +1m.

                ▶ **Rank 5, 8, 11 [Increased Vertical Distance]:** Vertical distance is increased by +0.5m.
          - es:
              name: Saltar
              description: |-
                La capacidad de saltar obstáculos o atravesar brechas.

                ### Tipos de salto
                - **De pie:** Ordinario 1m; Bueno 2m; Asombroso 3m.
                - **En funcionamiento:** Ordinario 2m; Bueno 4m; Asombroso 6m.
                - **Vertical:** Ordinario 1m; Bueno 1,5m; Asombroso 2m.

                ### Salto con apoyo
                Salto vertical potenciado por un poste u objeto. Añade +1m (objeto) o +2m (poste) al salto.

                ### Beneficios de Rango
                ▶ **Rango 3, 6, 9, 12 [Distancia de carrera aumentada]:** La distancia de carrera aumenta en +1 m.

                ▶ **Rango 4, 7, 10 [Distancia de pie aumentada]:** La distancia de pie aumenta en +1 m.

                ▶ **Rango 5, 8, 11 [Distancia vertical aumentada]:** La distancia vertical aumenta en +0,5 m.
        trained_only: false
      swim:
        attribute: STR
        cost: 2
        url: /skills/athletics#swim
        localized:
          - en:
              name: Swim
              description: |-
                Proficiency in moving through liquid environments. Without this skill, a character can only tread water and paddle crudely.

                ▶ **Rank 1, 4, 8, 12 [Improved Breathing]:** Situation die bonus to Stamina checks for holding breath: Rank 1 (-1 step), Rank 4 (-2 steps), Rank 8 (-3 steps), Rank 12 (-4 steps).

                ▶ **Rank 4, 8, 12 [Increased Swim Speed]:** Swim speed increases by 1m at Rank 4, 8, and 12.
          - es:
              name: Nadar
              description: |-
                Competencia para moverse a través de ambientes líquidos. Sin esta habilidad, un Personaje sólo puede flotar en el agua y remar toscamente.

                ▶ **Rango 1, 4, 8, 12 [Respiración mejorada]:** Bonificación Dado de Situación a las comprobaciones Aguante por contener la respiración: Rango 1 (-1 paso), Rango 4 (-2 pasos), Rango 8 (-3 pasos), Rango 12 (-4 pasos).

                ▶ **Rango 4, 8, 12 [Velocidad de natación aumentada]:** La velocidad de natación aumenta en 1 m en Rango 4, 8 y 12.
        trained_only: true
      throw:
        attribute: STR
        cost: 2
        url: /skills/athletics#throw
        localized:
          - en:
              name: Throw
              description: |-
                Proficiency in hurling objects (knives, grenades, rocks) at targets. Accuracy is governed by [Table P20: Accuracy by Range]({{< relref "core-mechanics/useful-tables#table-p20-accuracy-by-range" >}}).

                ### Trajectory Control
                A character can attempt advanced maneuvers with a base **+2 step penalty**:
                - **Magnus Curve:** Thrown object curves making hard to predict the trajectory, ignoring 1 step of the target dexterity resistance (if any).
                - **Ricochet:** Bounce off a surface to hit a target (ignore LOS requirements if the path is known).
                - **Sub-Orbital Arc:** Throw over large obstacles.

                ▶ **Rank 3, 6, 9, 12 [Trajectory Mastery]:** Ranks in this specialty reduce the penalty for Trajectory Control maneuvers: **Rank 3 (-1 step)**, **Rank 6 (-2 steps)**, **Rank 9 (-3 steps)**, **Rank 12 (-4 steps)**.

                ▶ **Rank 12 [Deflect]:** Once per round, the character can attempt to deflect away a thrown projectile (like a grenade or knife), for this he needs to be within arm's reach of the projectile and succeed in an opposed Athletics-throw check. An **Amazing** result on the check means they can immediately throw it back as a free action.
          - es:
              name: Lanzar
              description: |-
                Competencia en lanzar objetos (cuchillos, granadas, piedras) a los objetivos. La precisión se rige por la [Tabla P20: Precisión por rango]({{< relref "core-mechanics/useful-tables#table-p20-accuracy-by-range" >}}).

                ### Control de trayectoria
                Un Personaje puede intentar maniobras avanzadas con una base **+2 Penalización de paso**:
                - **Curva Magnus:** Las curvas de los objetos lanzados dificultan la predicción de la trayectoria, ignorando 1 paso de la resistencia de destreza del objetivo (si corresponde).
                - **Rebote:** Rebota en una superficie para alcanzar un objetivo (ignora los requisitos de LOS si conoces el camino).
                - **Arco suborbital:** Lanza grandes obstáculos.

                ▶ **Rango 3, 6, 9, 12 [Dominio de la trayectoria]:** Rangos en esta especialidad reduce la penalización por maniobras de control de trayectoria: **Rango 3 (-1 paso)**, **Rango 6 (-2 pasos)**, **Rango 9 (-3 pasos)**, **Rango 12 (-4 pasos)**.

                ▶ **Rango 12 (Desviar):** Una vez por ronda, el Personaje puede intentar desviar un proyectil lanzado (como una granada o un cuchillo), para ello necesita estar al alcance del brazo del proyectil y tener éxito en una prueba opuesta de lanzamiento de Atletismo. Un resultado **Asombroso** en la prueba significa que pueden devolverlo inmediatamente como acción gratuita.
        trained_only: false
    trained_only: false
  awareness:
    attribute: WIL
    cost: 3
    category: Other
    url: /skills/awareness
    localized:
      - en:
          name: Awareness
          description: |-
            Free to fraal, human, mechalus, sesheyan, t'sa, and weren characters. This broad skill represents a character's powers of observation, perception, and intuition. Skill checks are called for when the Gamemaster needs to determine if a character notices something—characters themselves never call for a use of this skill.

            Noticing something could be as simple as providing a hint that the character missed in the normal course of play, or help when the character appears totally lost or confused. On a Failure, the character doesn't notice a thing. Otherwise, any success provides the character with at least a small clue. The Gamemaster can decide that the better the level of success achieved, the more details the character becomes aware of.

            ### Guidelines for Use
            The Awareness broad skill and its specialties are examples of how the general rule on dice rolling applies: Dice should only be rolled on a skill check in a situation when the Gamemaster needs to determine if a character is capable of doing something difficult or out of the **Ordinary**.

            More often than not, characters with respectable scores in Awareness or its specialties will automatically succeed when something exists that can be noticed or perceived (e.g., seeing a fallen tree blocking a path). A skill check is called for to see if the character notices subtle details (e.g., a hole in the trunk where an object is concealed).

            ### Modifiers
            - **Sensors:** Some sensor equipment may provide benefits to Awareness checks.
            - **Opponent Skills:** Another character’s use of certain skills (such as Stealth or Security) can add modifiers to an Awareness check.
      - es:
          name: Alerta
          description: |-
            Gratis para personajes fraal, humanos, mechalus, sesheyan, t'sa y weren. Esta amplia habilidad representa los poderes de observación de Personaje, Percepción y Intuición. Se requieren pruebas de habilidad cuando Director de Juego necesita determinar si un Personaje nota algo; los personajes en sí nunca requieren el uso de esta habilidad.

            Notar algo podría ser tan simple como dar una pista de que el Personaje se perdió en el curso normal del juego, o ayudar cuando el Personaje parece totalmente perdido o confundido. En caso de fallo, el Personaje no nota nada. De lo contrario, cualquier éxito proporciona al Personaje al menos una pequeña pista. El Director de Juego puede decidir que cuanto mejor sea el nivel de éxito alcanzado, más detalles conocerá el Personaje.

            ### Pautas de uso
            La habilidad amplia de Alerta y sus especialidades son ejemplos de cómo se aplica la regla general sobre la tirada de dados: los dados solo deben tirarse en una prueba de habilidad en una situación en la que Director de Juego necesita determinar si un Personaje es capaz de hacer algo difícil o fuera de **Ordinario**.

            La mayoría de las veces, los personajes con puntuaciones respetables en Alerta o sus especialidades tendrán éxito automáticamente cuando exista algo que pueda notarse o percibirse (por ejemplo, ver un árbol caído bloqueando un camino). Se requiere una prueba de habilidad para ver si el Personaje nota detalles sutiles (por ejemplo, un agujero en el maletero donde se esconde un objeto).

            ### Modificadores
            - **Sensores:** Algunos equipos de sensores pueden brindar beneficios a las comprobaciones Alerta.
            - **Habilidades del oponente:** El uso de ciertas habilidades por parte de otro Personaje (como Sigilo o Seguridad) puede agregar modificadores a una prueba de Alerta.
    items:
      intuition:
        attribute: WIL
        cost: 1
        url: /skills/awareness#intuition
        localized:
          - en:
              name: Intuition
              description: |-
                This specialty skill represents a character's natural instincts—the ability to sense danger when no obvious signs are evident, to avoid surprise, or to make an intuitive leap of logic without the support of hard facts. It is the ability to make a "best guess" in a given situation.

                ### Avoiding Surprise
                When no obvious signs of danger are evident, a character’s subconscious use of this skill can enable them to avoid being caught by surprise. The Gamemaster calls for intuition checks; players do not request them.
                - **Success:** The character isn't surprised and can act in the surprise phase of the upcoming round.

                ### The "Best Guess"
                When a character wants to make an intuitive "best guess," the Gamemaster may allow a player to call for an intuition skill check on their character’s behalf.
                - **Success:** Yields a beneficial result; the greater the level of success, the more accurate and complete the conclusion.
                *Note: This use is only permitted to characters who have purchased the specialty skill and should not be allowed more than once or twice in an adventure.*
          - es:
              name: Intuición
              description: |-
                Este Especialidad representa los instintos naturales de un Personaje: la capacidad de sentir el peligro cuando no hay signos evidentes, evitar la sorpresa o dar un salto lógico intuitivo sin el apoyo de hechos concretos. Es la capacidad de hacer una "mejor suposición" en una situación determinada.

                ### Evitar sorpresas
                Cuando no hay signos evidentes de peligro, el uso subconsciente de esta habilidad por parte de un Personaje puede permitirle evitar ser tomado por sorpresa. El Director de Juego requiere comprobaciones Intuición; los jugadores no los solicitan.
                - **Éxito:** El Personaje no se sorprende y puede actuar en la fase sorpresa de la próxima ronda.

                ### La "mejor suposición"
                Cuando un Personaje quiere hacer una "mejor suposición" intuitiva, el Director de Juego puede permitir que un jugador solicite una prueba de habilidad de Intuición en nombre de su Personaje.
                - **Éxito:** Produce un resultado beneficioso; cuanto mayor sea el nivel de éxito, más precisa y completa será la conclusión.
                *Nota: Este uso solo está permitido a personajes que hayan comprado el Especialidad y no debe permitirse más de una o dos veces en una aventura.*
        trained_only: false
      perception:
        attribute: WIL
        cost: 3
        url: /skills/awareness#perception
        localized:
          - en:
              name: Perception
              description: |-
                This specialty skill represents a character's alertness and powers of observation—the character notices something either consciously or on a subliminal level. While intuition is a feeling or unexplainable sense, perception works on signs that can be spotted by normal senses (e.g., a broken twig, the click of a gun’s safety, a whisper in the wind).

                ### Spotting Trouble
                When potential danger obviously exists in a situation, a character's subconscious use of this skill can help them avoid being caught by surprise. The Gamemaster calls for perception checks; players do not request them.
                - **Success:** The character isn't surprised and can act in the surprise phase of the upcoming round.
          - es:
              name: Percepción
              description: |-
                Este Especialidad representa el estado de alerta y los poderes de observación de un Personaje: el Personaje nota algo ya sea conscientemente o en un nivel subliminal. Si bien Intuición es un sentimiento o sensación inexplicable, Percepción funciona con señales que pueden detectarse con los sentidos normales (por ejemplo, una ramita rota, el clic del seguro de un arma, un susurro en el viento).

                ### Detectar problemas
                Cuando obviamente existe un peligro potencial en una situación, el uso subconsciente de esta habilidad por parte de un Personaje puede ayudarlo a evitar ser tomado por sorpresa. El Director de Juego requiere comprobaciones Percepción; los jugadores no los solicitan.
                - **Éxito:** El Personaje no se sorprende y puede actuar en la fase sorpresa de la próxima ronda.
        trained_only: false
      psionic-sense:
        attribute: WIL
        cost: 4
        url: /skills/awareness#psionic-sense
        localized:
          - en:
              name: Psionic Sense
              description: |-
                Only characters capable of using psionic powers (such as Mindwalkers) or those with the "Psionic Awareness" perk can purchase and use this skill.

                This specialty skill allows a character to detect the activation of psionic powers and the presence of psionic phenomena. It can assist in identifying the type of power, the direction of its source, and the approximate intensity of the psionic user.

                ### Detecting Psionic Powers
                The Gamemaster will call for a check when a psionic power is activated in the character's vicinity, or affect the character or its vicinity.
                - **Ordinary:** The character senses that *some* psionic power was activated nearby.
                - **Good:** If the source is in line of sight, the character can identify the user. Otherwise, they get a general idea of the direction and distance.
                - **Amazing:** The character can detect subtle, ongoing effects (e.g., mental manipulation or psionic illusions).

                ### Identifying and Tracing
                If the character attempts a **Knowledge—Psionics** check to identify  the type of psionic power or an ESP power to trace a detected power, they receive a bonus based on their Psionic Sense result:
                - **Ordinary:** No bonus.
                - **Good:** -1 step bonus.
                - **Amazing:** -3 steps bonus.

                Characters capable of using the **Clairvoyance** or similar ESP power can also apply this bonus to their skill check when tracing the source of a psionic event.
          - es:
              name: Sentido psiónico
              description: |-
                Sólo los personajes capaces de usar poderes psiónicos (como Mindwalkers) o aquellos con el Ventaja "Psionic Alerta" pueden comprar y usar esta habilidad.

                Este Especialidad permite que un Personaje detecte la activación de poderes psiónicos y la presencia de fenómenos psiónicos. Puede ayudar a identificar el tipo de poder, la dirección de su fuente y la intensidad aproximada del usuario psiónico.

                ### Detectando poderes psiónicos
                El Director de Juego solicitará una verificación cuando se active un poder psiónico en las proximidades del Personaje o afecte al Personaje o sus proximidades.
                - **Ordinario:** El Personaje siente que *algún* poder psiónico fue activado cerca.
                - **Bueno:** Si la fuente está en la línea de visión, el Personaje puede identificar al usuario. De lo contrario, obtienen una idea general de la dirección y la distancia.
                - **Asombroso:** El Personaje puede detectar efectos sutiles y continuos (por ejemplo, manipulación de Mental o ilusiones psiónicas).

                ### Identificación y rastreo
                Si el Personaje intenta una prueba de **Conocimiento—Psiónica** para identificar el tipo de poder psiónico o un poder ESP para rastrear un poder detectado, recibe una bonificación basada en su resultado Sentido psiónico:
                - **Ordinario:** Sin bonificación.
                - **Bueno:** -1 Bonificación de paso.
                - **Asombroso:** -Bono de 3 pasos.

                Los personajes capaces de usar **Clarividencia** o un poder ESP similar también pueden aplicar esta bonificación a su prueba de habilidad al rastrear la fuente de un evento psiónico.
        trained_only: true
    trained_only: false
  business:
    attribute: INT
    cost: 4
    category: Social
    url: /skills/business
    localized:
      - en:
          name: Business
          description: |-
            This broad skill provides a character with basic knowledge of the theories of production, distribution, supply and demand, advertising, inventory control, and business planning.

            ### Uses
            Skill checks are called for when a character wants to:
            - Apply business knowledge to conclude a trade.
            - Attempt an illegal business transaction.
            - Determine the value of goods in their own society.
            - Locate commodity marketplaces.
            - Compute the local fair market value of goods and services.

            ### Interaction and Haggling
            If a character uses Business to haggle over the buying or selling of a commodity, the other party's **Intelligence** resistance modifier is applied to the situation die.
            - **Character vs. Character:** If the other party also has the Business skill, the Gamemaster may handle it as a contested check.
            - **Encounter Skill:** Business can be treated as an [encounter skill](/core-mechanics/characters-in-action/#encounter-scene). If the target's attitude becomes Friendly or better, it provides a bonus to subsequent cooperation checks.

            ### Modifiers
            - **Penalties:** Usually apply when dealing in exotic, rare, or unfamiliar goods; attempting illegal transactions; or dealing with an unfamiliar culture.
            - **Bonuses:** Apply if the character has inside information or is dealing with a familiar commodity or culture.
      - es:
          name: Negocios
          description: |-
            Esta amplia habilidad proporciona a un Personaje conocimientos básicos de las teorías de producción, distribución, oferta y demanda, publicidad, control de inventario y planificación Negocios.

            ### Usos
            Se requieren pruebas de habilidad cuando un Personaje quiere:
            - Aplicar el conocimiento de Negocios para concluir una operación.
            - Intentar una transacción Ilegal Negocios.
            - Determinar el valor de los bienes en la propia sociedad.
            - Localizar mercados de productos básicos.
            - Calcular el valor justo de mercado local de bienes y servicios.

            ### Interacción y el regateo
            Si un Personaje usa Negocios para regatear la compra o venta de un producto, el modificador de resistencia **Inteligencia** del grupo Otros se aplica al Dado de Situación.
            - **Personaje vs. Personaje:** Si el grupo Otros también tiene la habilidad Negocios, Director de Juego puede manejarla como un control disputado.
            - **Habilidad de encuentro:** Negocios se puede tratar como una [habilidad de encuentro](/core-mechanics/characters-in-action/#encounter-scene). Si la actitud del objetivo se vuelve Amistosa o mejor, proporciona una bonificación a las pruebas de cooperación posteriores.

            ### Modificadores
            - **Sanciones:** Generalmente se aplican cuando se trata de productos exóticos, Raro o desconocidos; intentar transacciones Ilegal; o lidiar con un Cultura desconocido.
            - **Bonificaciones:** Se aplican si el Personaje tiene información privilegiada o está tratando con un producto familiar o Cultura.
    items:
      corporate:
        attribute: INT
        cost: 3
        url: /skills/business#corporate
        localized:
          - en:
              name: Corporate
              description: |-
                This specialty skill improves a character's ability to function in the realm of large-scale trade and commerce. It covers stock markets, mergers, corporate acquisitions, and speculative business. It also provides an understanding of how large organizations and corporations operate.

                ### Rank Benefits
                ⊗ **Rank 1, 4, 7, 10 [Art of the deal]** Gains a number of situation bonus steps based on the ranks in this specialty skill (-1 step at Rank 1, -2 steps at Rank 4, -3 steps at Rank 7, and -4 steps at Rank 10) when making deals, haggling, or bargaining within the scope of corporate finance.
          - es:
              name: Corporativo
              description: |-
                Este Especialidad mejora la capacidad de un Personaje para funcionar en el ámbito del comercio y el comercio a gran escala. Cubre mercados de valores, fusiones, adquisiciones corporativas y Negocios especulativo. También proporciona una comprensión de cómo operan las grandes organizaciones y corporaciones.

                ### Beneficios de Rango
                ⊗ **Rango 1, 4, 7, 10 [Arte del trato]** Obtiene una cantidad de pasos de bonificación de situación basados en el Rangos en este Especialidad (-1 paso en Rango 1, -2 pasos en Rango 4, -3 pasos en Rango 7 y -4 pasos en Rango 10) al hacer tratos, regatear o negociar dentro del alcance. de las finanzas corporativas.
        trained_only: false
      illicit-business:
        attribute: INT
        cost: 3
        url: /skills/business#illicit-business
        localized:
          - en:
              name: Illicit business
              description: |-
                This specialty skill allows a character to function in the underside of the business world, providing knowledge of extortion, smuggling, fencing stolen goods, and the black market. It is the primary skill of white-collar criminals (embezzlers, insider traders, corporate spies).

                ### Rank Benefits
                ⊗ **Rank 1, 4, 7, 10 [Art of the deal]** Gains a number of situation bonus steps based on the ranks in this specialty skill (-1 step at Rank 1, -2 steps at Rank 4, -3 steps at Rank 7, and -4 steps at Rank 10) when making deals, haggling, or bargaining within the scope of illicit business.
          - es:
              name: Negocios Ilícitos
              description: |-
                Este Especialidad permite que un Personaje funcione en la parte inferior del mundo Negocios, proporcionando conocimientos sobre extorsión, contrabando, vallado de bienes robados y el mercado negro. Es la habilidad principal de los delincuentes de cuello blanco (malversadores, comerciantes de información privilegiada, espías corporativos).

                ### Beneficios de Rango
                ⊗ **Rango 1, 4, 7, 10 [Arte del trato]** Obtiene una cantidad de pasos de bonificación de situación basados en el Rangos en este Especialidad (-1 paso en Rango 1, -2 pasos en Rango 4, -3 pasos en Rango 7 y -4 pasos en Rango 10) al hacer tratos, regatear o negociar dentro del alcance. de Negocios ilícito.
        trained_only: false
        rank_benefits: []
      small-business:
        attribute: INT
        cost: 3
        url: /skills/business#small-business
        localized:
          - en:
              name: Small business
              description: |-
                This specialty skill allows a character to function in small-scale trade and commerce. It improves the ability to haggle on the consumer level, determine the value of goods and services, and find buyers and sellers in a local area.

                ### Rank Benefits
                ⊗ **Rank 1, 4, 7, 10 [Art of the deal]** Gains a number of situation bonus steps based on the ranks in this specialty skill (-1 step at Rank 1, -2 steps at Rank 4, -3 steps at Rank 7, and -4 steps at Rank 10) when making deals, haggling, or bargaining within the scope of  small-business finance.
          - es:
              name: Pequeños Negocios
              description: |-
                Este Especialidad permite que un Personaje funcione en el comercio y el comercio a pequeña escala. Mejora la capacidad de regatear a nivel del consumidor, determinar el valor de bienes y servicios y encontrar compradores y vendedores en un área local.

                ### Beneficios de Rango
                ⊗ **Rango 1, 4, 7, 10 [Arte del trato]** Obtiene una cantidad de pasos de bonificación de situación basados en el Rangos en este Especialidad (-1 paso en Rango 1, -2 pasos en Rango 4, -3 pasos en Rango 7 y -4 pasos en Rango 10) al hacer tratos, regatear o negociar dentro del alcance. de las pequeñas finanzas Negocios.
        trained_only: false
        rank_benefits: []
    trained_only: false
  computer-science:
    attribute: INT
    cost: 7
    category: Technical
    url: /skills/computer-science
    localized:
      - en:
          name: Computer Science
          description: |-
            Computers are an integral part of human society, and many alien societies as well, at Progress Level 5 and higher. (For much more information on computers and related material, see Chapter 10: Computers.) Most computers and computer-assisted machines are designed to be user-friendly in routine situations. The broad skill provides a character with a basic understanding of computers and computer systems. (In comparison, the Knowledge—computer operation skill merely gives a character the ability to use a computer effectively, but does not allow any understanding of how the machine does what it does.) The three primary uses for the Computer Science broad skill are information retrieval, computer repair, and programming. These uses are described below.

            > Some computer systems allow users who don't have the broad skill to make skill checks at their base Intelligence score instead of at the untrained score. If such an assist program is installed in a particular piece of equipment, your Gamemaster will let you know.

            ### Information Retrieval
            Most computers are connected to some storehouse of raw data—a large network, a centralized storage system, or the unit’s own drives. Using the Computer Science skill to search for specific information requires a skill check only if that information is protected in some way (user password, encoded data, etc.) or if the information is obscure and hard to locate. In all but the most straightforward of situations, a complex skill check is used to determine the result of a retrieval attempt. The broad skill is useful when a character wants to retrieve information from any unprotected system—but if the system is protected, only programs of Marginal quality and Marginal complexity can be accessed with the broad skill. In order to retrieve information from a protected system of higher quality or greater complexity, the specialty skill hacking is needed. A Critical Failure result on the skill check usually means that safeguards or alarms have been triggered, an unretrievable computer error occurs, or the character makes some other monumental mistake that aborts this computer run.

            ### Computer Repair
            A character with this skill has the ability to fix a damaged computer system, either by replacing defective parts or by rewiring a component or a system to bypass a problem spot. Repairing a computer system is always a complex skill check. For information on how attempts to repair a device are made, see the repair specialty under the Technical Science broad skill (page 89).

            ### Programming
            Computer programs exist to handle almost any task imaginable. Without training in the use of these high-tech tools, the wealth of options and accessories available can be overwhelming to a character trying to employ them. As with information retrieval (above), using Computer Science to navigate and utilize a program almost always involves a complex skill check. A character with just the broad skill can only manipulate the source code of programs of Marginal quality and Marginal complexity. Manipulating programs of better quality and greater complexity requires the programming specialty skill. For more information on how the Computer Science specialty skills are used, see Chapter 10: Computers. Brief descriptions of the specialty skills are given below.
      - es:
          name: Ciencias de la Computación
          description: |-
            Las computadoras son una parte integral de la sociedad humana, y también de muchas sociedades alienígenas, en el nivel de progreso 5 y superior. (Para obtener mucha más información sobre computadoras y material relacionado, consulte el Capítulo 10: Computadoras.) La mayoría de las computadoras y las máquinas asistidas por computadora están diseñadas para ser fáciles de usar en situaciones rutinarias. La amplia habilidad proporciona a Personaje una comprensión básica de computadoras y sistemas informáticos. (En comparación, la habilidad Conocimiento: operación de computadoras simplemente le da a un Personaje la capacidad de usar una computadora de manera efectiva, pero no permite ninguna comprensión de cómo la máquina hace lo que hace). Los tres usos principales de la habilidad amplia de Ciencias de la Computación son la recuperación de información, la reparación de computadoras y la programación. Estos usos se describen a continuación.

            > Algunos sistemas informáticos permiten a los usuarios que no tienen las habilidades generales realizar comprobaciones de habilidades con su puntuación de Inteligencia base en lugar de con la puntuación de no entrenado. Si dicho programa de asistencia está instalado en un equipo en particular, su Director de Juego se lo informará.

            ### Recuperación de información
            La mayoría de las computadoras están conectadas a algún almacén de datos sin procesar: una gran red, un sistema de almacenamiento centralizado o las propias unidades de disco. Usar la habilidad de Ciencias de la Computación para buscar información específica requiere una prueba de habilidad solo si esa información está protegida de alguna manera (contraseña de usuario, datos codificados, etc.) o si la información es oscura y difícil de localizar. En todas las situaciones, excepto en las más sencillas, se utiliza una prueba de habilidad compleja para determinar el resultado de un intento de recuperación. La habilidad amplia es útil cuando un Personaje desea recuperar información de cualquier sistema desprotegido, pero si el sistema está protegido, solo se puede acceder a programas de calidad marginal y complejidad marginal con la habilidad amplia. Para recuperar información de un sistema protegido de mayor calidad o complejidad, es necesario el hackeo Especialidad. Un resultado de Fallo Crítico en la prueba de habilidad generalmente significa que se han activado salvaguardas o alarmas, que se produce un error de computadora irrecuperable o que Personaje comete algún error monumental de Otros que aborta la ejecución de esta computadora.

            ### Reparación de computadoras
            Un Personaje con esta habilidad tiene la capacidad de reparar un sistema informático dañado, ya sea reemplazando piezas defectuosas o volviendo a cablear un componente o sistema para evitar un punto problemático. Reparar un sistema informático es siempre una prueba de habilidad compleja. Para obtener información sobre cómo se realizan los intentos de reparar un dispositivo, consulte la especialidad de reparación en la habilidad amplia Ciencia técnica (página 89).

            ### Programación
            Existen programas informáticos para realizar casi cualquier tarea imaginable. Sin capacitación en el uso de estas herramientas de alta tecnología, la gran cantidad de opciones y accesorios disponibles puede resultar abrumadora para un Personaje que intenta emplearlas. Al igual que con la recuperación de información (arriba), el uso de la informática para navegar y utilizar un programa casi siempre implica una verificación de habilidades compleja. Un Personaje con solo la habilidad amplia solo puede manipular el código fuente de programas de calidad marginal y complejidad marginal. Manipular programas de mejor calidad y mayor complejidad requiere de la programación Especialidad. Para obtener más información sobre cómo se utilizan las habilidades de especialidad en Ciencias de la Computación, consulte el Capítulo 10: Computadoras. A continuación se proporcionan breves descripciones de las habilidades especializadas.
    items:
      hacking:
        attribute: INT
        cost: 4
        url: /skills/computer-science#hacking
        localized:
          - en:
              name: Hacking
              description: |-
                Hacking is the ability to break computer codes and bypass computer security for the purposes of gaining access to restricted data or secure computer systems. Hacking can be performed at a computer station that’s physically connected to the data stores in question, or it can be performed from a distant location by creating a link via a network of some kind. It's most often used to retrieve secured data, to enter and take control of a computer system, or to perform some type of sabotage such as erasing files or introducing a virus of some kind. This specialty skill allows a character equipped with a computer to perform the previously mentioned tasks. The character's own skill and any programs being used can help the character navigate computer systems, overcome security, and even defend against other operators hooked into a system.

                ▶ Rank 4, 8, 12 [Increased Effect]: As a character gains ranks in this specialty skill, his ability to perform actions related to hacking improves. This is reflected by a **-1 situation die bonus at rank 4**, a **-2 bonus at rank 8**, and a **-3 bonus at rank 12**.
          - es:
              name: Hacking
              description: |-
                La piratería es la capacidad de descifrar códigos informáticos y eludir la seguridad informática con el fin de obtener acceso a datos restringidos o sistemas informáticos seguros. El hackeo se puede realizar en una estación de computadora que esté físicamente conectada a los almacenes de datos en cuestión, o se puede realizar desde una ubicación distante creando un vínculo a través de una red de algún tipo. Se utiliza con mayor frecuencia para recuperar datos seguros, para ingresar y tomar el control de un sistema informático o para realizar algún tipo de sabotaje, como borrar archivos o introducir algún tipo de virus. Este Especialidad permite que un Personaje equipado con una computadora realice las tareas mencionadas anteriormente. La propia habilidad del Personaje y cualquier programa que se utilice pueden ayudar al Personaje a navegar por los sistemas informáticos, superar la seguridad e incluso defenderse contra los operadores del Otros conectados a un sistema.

                ▶ Rango 4, 8, 12 [Efecto aumentado]: A medida que un Personaje gana Rangos en este Especialidad, mejora su capacidad para realizar acciones relacionadas con la piratería. Esto se refleja en una bonificación de **-1 Dado de Situación en Rango 4**, una bonificación de **-2 en Rango 8** y una bonificación de **-3 en Rango 12**.
        trained_only: true
      hardware:
        attribute: INT
        cost: 3
        url: /skills/computer-science#hardware
        localized:
          - en:
              name: Hardware
              description: |-
                This specialty represents a character's knowledge of and proficiency with the physical components that make up a computer. Understanding how a computer system works, being able to set one up quickly, designing and building your own computer, and repairing computer equipment are some of the tasks covered by this skill.

                ▶ Rank 4, 8, 12 [Increased Effect]: As a character gains ranks in this specialty skill, his ability to repair computer systems and work with computer hardware in other ways improves. This is reflected by a **-1 situation die bonus at rank 4**, a **-2 bonus at rank 8**, and a **-3 bonus at rank 12**.
          - es:
              name: Hardware
              description: |-
                Esta especialidad representa el conocimiento y la competencia de un Personaje con los componentes Físico que componen una computadora. Comprender cómo funciona un sistema informático, poder configurar uno rápidamente, diseñar y construir su propia computadora y reparar equipos informáticos son algunas de las tareas que cubre esta habilidad.

                ▶ Rango 4, 8, 12 [Efecto aumentado]: A medida que un Personaje gana Rangos en este Especialidad, mejora su capacidad para reparar sistemas informáticos y trabajar con hardware informático en forma Otros. Esto se refleja en una bonificación de **-1 Dado de Situación en Rango 4**, una bonificación de **-2 en Rango 8** y una bonificación de **-3 en Rango 12**.
        trained_only: false
      programming:
        attribute: INT
        cost: 3
        url: /skills/computer-science#programming
        localized:
          - en:
              name: Programming
              description: |-
                This specialty skill enables a character to improve her ability to analyze computer programs, modify existing programs, and (at higher ranks) create programs by writing her own code. Having rank 1 in this skill enables a character to modify the source code of programs of Ordinary quality and Ordinary complexity.

                **Rank 3, 6 [Modify/Enhance Programs]** A character with rank 3 in this skill is able to modify the code of existing programs of Good quality and Good complexity. When the character achieves rank 6, she can modify any existing program.

                **Rank 3, 6, 9, 12 [Create Programs]:** A character with rank 3 in this skill is able to create new programs of Marginal quality and Marginal complexity. Ordinary programs can be created at rank 6, Good programs at rank 9, and Amazing programs at rank 12.
          - es:
              name: Programación
              description: |-
                Este Especialidad permite que un Personaje mejore su capacidad para analizar programas de computadora, modificar programas existentes y (en niveles superiores de Rangos) crear programas escribiendo su propio código. Tener Rango 1 en esta habilidad permite a un Personaje modificar el código fuente de programas de calidad Ordinario y complejidad Ordinario.

                **Rango 3, 6 [Modificar/Mejorar programas]** Un Personaje con Rango 3 en esta habilidad es capaz de modificar el código de programas existentes de calidad Bueno y complejidad Bueno. Cuando Personaje alcanza Rango 6, puede modificar cualquier programa existente.

                **Rango 3, 6, 9, 12 [Crear programas]:** Un Personaje con Rango 3 en esta habilidad es capaz de crear nuevos programas de calidad marginal y complejidad marginal. Los programas Ordinario se pueden crear en Rango 6, los programas Bueno en Rango 9 y los programas Asombroso en Rango 12.
        trained_only: false
    trained_only: false
  covert-ops:
    attribute: DEX
    cost: 8
    category: Social
    url: /skills/covert-ops
    localized:
      - en:
          name: Covert Ops
          description: |-
            The **Covert Ops** broad skill focuses on remaining undetected. It consolidates the arts of stealth with the practical skills needed to blend in, conceal items, or pick pockets.
      - es:
          name: Operaciones Encubiertas
          description: |-
            La habilidad amplia **Operaciones encubiertas** se centra en permanecer sin ser detectado. Consolida las artes del sigilo con las habilidades prácticas necesarias para camuflarse, ocultar objetos o robar bolsillos.
    items:
      conceal:
        attribute: DEX
        cost: 3
        url: /skills/covert-ops#conceal
        localized:
          - en:
              name: Conceal
              description: |-
                This specialty skill represents the ability to hide objects from view or sensors. While **Stealth** is used to hide oneself, **Conceal** is used to hide items, such as weapons on one's person, contraband in a vehicle, or secret compartments.

                ### Results
                The degree of success on a Conceal check provides a penalty to an observer's **Awareness-Perception** or **Investigate-Search** check:
                - **Ordinary:** +1 penalty to observer
                - **Good:** +2 penalty to observer
                - **Amazing:** +3 penalty to observer

                ### Hiding Weapons
                A concealed weapon is worn where it is not subject to easy spotting (small of the back, inside the forearm, etc.). This is limited to small handguns or blades. Concealment provides a **+2 penalty** to all but the most intrusive physical searches.
          - es:
              name: Ocultar
              description: |-
                Este Especialidad representa la capacidad de ocultar objetos de la vista o de los sensores. Mientras que **Stealth** se usa para esconderse, **Ocultar** se usa para ocultar elementos, como armas en la persona, contrabando en un vehículo o compartimentos secretos.

                ### Resultados
                El grado de éxito en una prueba de Ocultar proporciona una penalización a la prueba **Alerta-Percepción** o **Investigar-Buscar** de un observador:
                - **Ordinario:** +1 penalización al observador
                - **Bueno:** Penalización +2 al observador
                - **Asombroso:** Penalización +3 al observador

                ### Esconder armas
                Un arma oculta se usa donde no es fácil de detectar (parte baja de la espalda, dentro del antebrazo, etc.). Esto se limita a pistolas o cuchillas pequeñas. La ocultación proporciona una **penalización de +2** para todas las búsquedas Físico excepto las más intrusivas.
        trained_only: false
      disguise:
        attribute: CHA
        cost: 3
        url: /skills/covert-ops#disguise
        localized:
          - en:
              name: Disguise
              description: |-
                Disguise is the ability to change your appearance to look like someone else or blend into a crowd. This covers immediate, practical applications like changing clothes, wearing a wig, or using simple props. A character’s Disguise situation die is modified by the observer's **Awareness-Perception** modifier.

                ▶ **Rank 4, 8, 12 [Improved Disguise]:** You gain a bonus to all disguise attempts: -1 step at Rank 4, -2 at Rank 8, and -3 at Rank 12.
          - es:
              name: Disfraz
              description: |-
                El disfraz es la capacidad de cambiar tu apariencia para parecerte a otra persona o mezclarte con una multitud. Esto cubre aplicaciones prácticas e inmediatas como cambiarse de ropa, usar una peluca o utilizar accesorios sencillos. El disfraz Dado de Situación de un Personaje es modificado por el modificador **Alerta-Percepción** del observador.

                ▶ **Rango 4, 8, 12 [Disfraz mejorado]:** Obtienes una bonificación a todos los intentos de disfrazarte: -1 paso en Rango 4, -2 en Rango 8 y -3 en Rango 12.
        trained_only: false
        rank_benefits:
          - rank: 4
            title: Improved Disguise
          - rank: 8
            title: Improved Disguise
          - rank: 12
            title: Improved Disguise
      pickpocket:
        attribute: DEX
        cost: 3
        url: /skills/covert-ops#pickpocket
        localized:
          - en:
              name: Pickpocket
              description: |-
                This skill allows a character to remove or plant objects on a person undetected. The base situation die is determined by the target's **Will** resistance modifier.

                ### Pickpocket Situation Modifiers
                | Condition | Modifier |
                | :--- | :--- |
                | Object is in direct contact with target's skin | +3 |
                | Object is heavy | +2 |
                | Object is kept in an inner pocket | +1 |
                | Object is light in weight | -1 |
                | Object is kept in an exposed pocket or pack | -1 |
                | Victim is distracted | -1 to -3 |

                ### Results
                - **Failure / Critical Failure:** The attempt fails and the pickpocket is noticed.
                - **Ordinary:** The attempt succeeds.
                - **Good / Amazing:** The attempt succeeds and may offset penalties for repeated attempts against the same target.

                ### Rank Benefits
                ⊗ **Rank 3, 6, 9, 12 [It Takes One to Know One]:** Your **Will** resistance modifier (specifically for spotting pickpocket attempts) improves: +1 penalty to the foe at Rank 3, +2 steps at Rank 6, +3 steps at Rank 9, and +4 steps at Rank 12.
          - es:
              name: Abrir Cerraduras
              description: |-
                Esta habilidad permite a un Personaje quitar o colocar objetos en una persona sin ser detectado. La base Dado de Situación está determinada por el modificador de resistencia **Voluntad** del objetivo.

                ### Modificadores de situación de carterista
                | Condición | Modificador |
                | :--- | :--- |
                | El objeto está en contacto directo con la piel del objetivo | +3 |
                | El objeto es pesado | +2 |
                | El objeto se guarda en un bolsillo interior | +1 |
                | El objeto es liviano | -1 |
                | El objeto se guarda en un bolsillo o mochila expuesta | -1 |
                | La víctima está distraída | -1 a -3 |

                ### Resultados
                - **Fallo / Fallo Crítico:** El intento falla y se descubre al carterista.
                - **Ordinario:** El intento tiene éxito.
                - **Bueno / Asombroso:** El intento tiene éxito y puede compensar las penalizaciones por intentos repetidos contra el mismo objetivo.

                ### Beneficios de Rango
                ⊗ **Rango 3, 6, 9, 12 [Se necesita uno para conocer uno]:** Tu modificador de resistencia de **Voluntad** (específicamente para detectar intentos de carterista) mejora: +1 de penalización al enemigo en Rango 3, +2 pasos en Rango 6, +3 pasos en Rango 9 y +4 pasos en Rango 12.
        trained_only: false
        rank_benefits:
          - rank: 3
            title: It Takes One to Know One
          - rank: 6
            title: It Takes One to Know One
          - rank: 9
            title: It Takes One to Know One
          - rank: 12
            title: It Takes One to Know One
      stealth:
        attribute: DEX
        cost: 3
        url: /skills/covert-ops#stealth
        localized:
          - en:
              name: Stealth
              description: |-
                Stealth merges the techniques of hiding, sneaking, and shadowing. It is the art of remaining undetected while stationary or in motion.

                ▶ **Rank 3 [Sneak Attack]:** If you successfully move adjacent to an opponent undetected while **sneaking**, you receive a **-2 step bonus** to your next melee attack. Even if other enemies detect you, they cannot alert your target in time to avoid the sneak attack unless they have special means.

                ▶ **Rank 4, 8, 12 [Improved Stealth]:** You gain a bonus to all stealth attempts: -1 step at Rank 4, -2 at Rank 8, and -3 at Rank 12.

                ### Hide (Stationary)
                The ability to stay unnoticed by staying quiet and using cover or darkness.

                #### Results
                - **Critical Failure:** You make noise or otherwise call attention to yourself.
                - **Failure:** Anyone in the area can make **Awareness-Perception** or **Investigate-Search** checks to see you.
                - **Ordinary or Better:** Observers only get a check if they are actively searching or on guard duty. The penalty to their check is: Ordinary (+1), Good (+2), Amazing (+3).

                ### Sneak (In Motion)
                The ability to move undetected. Moving at more than half speed imposes a **+2 penalty** to the check.

                #### Results
                - **Critical Failure:** You make noise or call attention to yourself.
                - **Failure:** Anyone in the area can make an **Awareness-Perception** check to detect you.
                - **Ordinary or Better:** Observers may attempt an **Awareness-Perception** check with a penalty based on your success: Ordinary (+1), Good (+2), Amazing (+3).

                ### Shadow (Tailing)
                The ability to tail a target or group through crowds. You feign indifference and adjust your clothing without losing your mark.

                #### Results
                - **Critical Failure:** One or more targets notice you immediately; your cover is blown.
                - **Failure:** The targets grow suspicious. Proceed to the **Detection Protocol**.
                - **Ordinary or Better:** Targets may attempt **Awareness-Intuition** checks to sense they are being followed. The penalty to their check is: Ordinary (+1), Good (+2), Amazing (+3). If any target succeeds, proceed to the **Detection Protocol**.

                #### Detection Protocol
                Each member in a position to see you makes an **Awareness-Perception** check (applying penalties from the Shadow result).
                - **If spotted:** Your cover is blown.
                - **If unspotted:** You may attempt a **new check** to resume shadowing, but this recovery check incurs a **+3 step penalty**.
          - es:
              name: Carterear
              description: |-
                Stealth combina las técnicas de esconderse, escabullirse y seguir. Es el arte de pasar desapercibido mientras está parado o en movimiento.

                ▶ **Rango 3 (Ataque furtivo):** Si te mueves con éxito junto a un oponente sin ser detectado mientras **escapas**, recibes un **-2 Bonificación de paso** para tu próximo ataque cuerpo a cuerpo. Incluso si los enemigos Otros te detectan, no pueden alertar a tu objetivo a tiempo para evitar el ataque furtivo a menos que tengan medios especiales.

                ▶ **Rango 4, 8, 12 [Sigilo mejorado]:** Obtienes una bonificación a todos los intentos de sigilo: -1 paso en Rango 4, -2 en Rango 8 y -3 en Rango 12.

                ### Ocultar (estacionario)
                La capacidad de pasar desapercibido permaneciendo en silencio y a cubierto o en la oscuridad.

                #### Resultados
                - **Fallo Crítico:** Haces ruido o llamas la atención de alguna otra manera.
                - **Error:** Cualquier persona en el área puede realizar comprobaciones **Alerta-Percepción** o **Investigar-Buscar** para verte.
                - **Ordinario o mejor:** Los observadores solo reciben un control si están buscando activamente o haciendo guardia. La penalización a su cheque es: Ordinario (+1), Bueno (+2), Asombroso (+3).

                ### Furtivo (en movimiento)
                La capacidad de moverse sin ser detectado. Moverse a más de la mitad de la velocidad impone una **penalización+2** a la prueba.

                #### Resultados
                - **Fallo Crítico:** Haces ruido o llamas la atención.
                - **Error:** Cualquier persona en el área puede realizar una verificación **Alerta-Percepción** para detectarte.
                - **Ordinario o mejor:** Los observadores pueden intentar una prueba de **Alerta-Percepción** con una penalización basada en tu éxito: Ordinario (+1), Bueno (+2), Asombroso (+3).

                ### Sombra (cola)
                La capacidad de seguir a un objetivo o grupo a través de la multitud. Finges indiferencia y ajustas tu vestimenta sin perder la marca.

                #### Resultados
                - **Fallo Crítico:** Uno o más objetivos te notan inmediatamente; Tu tapadera está descubierta.
                - **Fallo:** Los objetivos se vuelven sospechosos. Continúe con el **Protocolo de detección**.
                - **Ordinario o mejor:** Los objetivos pueden intentar realizar comprobaciones **Alerta-Intuición** para detectar que los están siguiendo. La penalización a su cheque es: Ordinario (+1), Bueno (+2), Asombroso (+3). Si algún objetivo tiene éxito, continúe con el **Protocolo de detección**.

                #### Protocolo de detección
                Cada miembro que esté en condiciones de verte realiza una prueba **Alerta-Percepción** (aplicando penalizaciones del resultado de la Sombra).
                - **Si te descubren:** Tu tapadera ha sido descubierta.
                - **Si no está manchado:** Puede intentar una **nueva verificación** para reanudar el sombreado, pero esta verificación de recuperación genera un **+3 Penalización de paso**.
        trained_only: false
        rank_benefits:
          - rank: 3
            title: Sneak Attack
          - rank: 4
            title: Improved Stealth
          - rank: 8
            title: Improved Stealth
          - rank: 12
            title: Improved Stealth
    trained_only: false
  creativity:
    attribute: WIL
    cost: 6
    category: Other
    url: /skills/creativity
    localized:
      - en:
          name: Creativity
          description: |-
            This skill provides a character with training and talent (or knowledge) in a variety of creative endeavors. A character with the Creativity skill has a well-developed sense for the aesthetically pleasing, a facility for communicating with the written word, and the ability to convey and evoke powerful emotions through a chosen medium.

            A character with just the broad skill possesses all of these characteristics, but not to such a degree that he’s able to make a living as an artist, writer, or photographer. Turning the Creativity skill into the basis of a career (or being able to produce work of professional quality, if a character has another career) requires that the character pursue a specialty skill in his chosen field(s).

            ### Creative Synergy
            Creativity can be used as a support check to enhance other skills by providing unique solutions, emotional depth, or unorthodox methods. Possible uses are, but are not limited to the follow:
            - **Creativity + Inspire (Leadership):** Use a creative medium (speech, song, manifesto) to stir followers. A successful check adds a step bonus to the **Inspire** check (-1 for Ordinary, -2 for Good, -3 for Amazing).
            - **Creativity + Invention (Technical Science):** Use lateral thinking to find elegant shortcuts in design. A successful check reduces the successes required for an **Invention** complex check (-1 for Ordinary, -2 for Good, -3 for Amazing).
            - **Creativity + Deception (Bluff/Seduce):** Weave a rich, emotionally resonant narrative. On a successful support check, the target’s **Intelligence or Will resistance modifier** is reduced by 1 step.

            _The Gamemaster has the last word on which specialty skill provide synergy on a particular task_

            ### Using Creativity (Production)
            Creating a work of art or literature involves a **complex skill check**.
            - **Situation Modifiers:** Based on conditions (materials, inspiration, distractions).
            - **Complexity (Successes Required):** Ordinary (2), Good (4-6), Amazing (8+).
            - **Project Failure:** If the check ends in a **Critical Failure** or **three Failure results**, the project is scrapped.
      - es:
          name: Creatividad
          description: |-
            Esta habilidad proporciona a Personaje capacitación y talento (o conocimiento) en una variedad de esfuerzos creativos. Un Personaje con la habilidad Creatividad tiene un sentido bien desarrollado para lo estéticamente agradable, facilidad para comunicarse con la palabra escrita y la capacidad de transmitir y evocar emociones poderosas a través del medio elegido.

            Un Personaje con habilidades generales posee todas estas características, pero no hasta el punto de poder ganarse la vida como artista, escritor o fotógrafo. Convertir la habilidad de Creatividad en la base de una carrera (o ser capaz de producir un trabajo de calidad profesional, si un Personaje tiene otra carrera) requiere que el Personaje busque un Especialidad en los campos elegidos.

            ### Sinergia creativa
            La creatividad se puede utilizar como prueba de apoyo para mejorar las habilidades de Otros proporcionando soluciones únicas, profundidad emocional o métodos poco ortodoxos. Los usos posibles son, entre otros, los siguientes:
            - **Creatividad + Inspirar (Liderazgo):** Utilice un medio creativo (discurso, canción, manifiesto) para conmover a los seguidores. Una verificación exitosa agrega un Bonificación de paso a la verificación **Inspirar** (-1 para Ordinario, -2 para Bueno, -3 para Asombroso).
            - **Creatividad + Invención (Ciencia técnica):** Utilice el pensamiento lateral para encontrar atajos elegantes en el diseño. Una verificación exitosa reduce el Éxitos requerido para una verificación compleja de **Invención** (-1 para Ordinario, -2 para Bueno, -3 para Asombroso).
            - **Creatividad + Engaño (Mentir/Seduce):** Teje una narrativa rica y con resonancia emocional. Tras una prueba de apoyo exitosa, el **modificador de resistencia a la inteligencia o la voluntad** del objetivo se reduce en 1 paso.

            _El Director de Juego tiene la última palabra sobre qué Especialidad proporciona sinergia en una tarea en particular_

            ### Usando la creatividad (producción)
            Crear una obra de arte o literatura implica una **comprobación de habilidad compleja**.
            - **Modificadores de situación:** Basado en condiciones (materiales, inspiración, distracciones).
            - **Complejidad (se requiere Éxitos):** Ordinario (2), Bueno (4-6), Asombroso (8+).
            - **Falla del proyecto:** Si la verificación termina en un **Fallo Crítico** o **tres resultados de falla**, el proyecto se descarta.
    items:
      creativity-specific-skill:
        attribute: WIL
        cost: 3
        url: /skills/creativity#creativity-specific-skill
        localized:
          - en:
              name: Creativity, Specific Skill
              description: |-
                A blank line is provided under the Creativity skill on the character sheet for a player to use if his character specializes in some aspect of this skill. The Gamemaster will determine if a certain specialty skill is allowable, usually based on whether it defines a narrow enough field of interest. For instance, illustration might be allowed as a Creativity specialty, or it might be necessary for a character to be more specific by singling out computer graphics or holo art as his area of expertise.
          - es:
              name: Habilidades de Especialidad
              description: |-
                Se proporciona una línea en blanco debajo de la habilidad Creatividad en la hoja Personaje para que la use un jugador si su Personaje se especializa en algún aspecto de esta habilidad. El Director de Juego determinará si un determinado Especialidad es permitido, generalmente en función de si define un campo de interés lo suficientemente limitado. Por ejemplo, la ilustración podría permitirse como especialidad de creatividad, o podría ser necesario que un Personaje sea más específico y destaque los gráficos por computadora o el arte holográfico como su área de especialización.
        trained_only: false
      the-intangible:
        attribute: WIL
        cost: 3
        url: /skills/creativity#the-intangible
        localized:
          - en:
              name: The Intangible
              description: |-
                Focuses on abstract, digital, and ethereal expression, such as grid-sculpting (virtual environments), psionic illusions, and the aesthetics of complex algorithms. This specialty is the primary support for digital infiltration, mental powers, and ephemeral constructs.
                ### Rank Benefits
                ▶ **Rank 3 [Artistic Flourish]:** The character can add a "signature" to their work. Any creativity skill check made to support another skill that results in an **Amazing** success grants the character an extra **Last Resort** point that must be used in the supported skill.
          - es:
              name: The Intangible
              description: |-
                Se centra en la expresión abstracta, digital y etérea, como la escultura en cuadrícula (entornos virtuales), ilusiones psiónicas y la estética de algoritmos complejos. Esta especialidad es el soporte principal para la infiltración digital, los poderes Mental y las construcciones efímeras.
