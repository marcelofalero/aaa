                ▶ Abrumador: esta habilidad se puede utilizar para determinar el éxito de un intento de dominar a un oponente. Brevemente, dominar es una forma de ataque desarmado realizado simultáneamente por uno o más aliados que intentan agarrar y contener a un solo oponente. Si un solo atacante intenta dominar a otro personaje, su prueba de habilidad de combate cuerpo a cuerpo se realiza con una penalización de +1. Cada atacante adicional que participe en el mismo intento abrumador proporciona una bonificación acumulativa de -1 a la prueba de habilidad. Abrumar no causa daño, pero inmoviliza a un oponente mientras uno de los atacantes continúe manteniendo un fuerte control sobre ese oponente.
                ▶ Apalancamiento masivo: cuando un personaje alcanza el rango de habilidad 1, aprende a aprovechar adecuadamente su masa. Esto aumenta su daño base sin armas a
                **d4s/d4w/d6+1w**.
                ▶ Alto impulso: cuando un personaje alcanza el rango 3, un éxito sorprendente en un ataque obliga al objetivo a realizar una prueba de nocaut (Resolución o Resistencia) con una penalización de +1 paso. Esta penalización aumenta a +2 en el rango 6, +3 en el rango 9 y +4 en el rango 12.
                ▶ Eficiencia estructural: cuando un personaje alcanza el rango 4, todo el daño sin armas aumenta en +1. Esta bonificación aumenta en +1 adicional en el rango 8 y nuevamente en el rango 12.
                ⊗ Modificador de resistencia: en rangos más altos, la habilidad proporciona una mejora al modificador de resistencia a la fuerza de un personaje. Mejora en +1 en el rango 4, en +1 nuevamente en el rango 8 y en +1 nuevamente en el rango 12. Este aumento no se acumula con bonificaciones similares proporcionadas por otras habilidades especiales de combate cuerpo a cuerpo.
                ▶ Poder de corto alcance (Fajin): cuando un personaje alcanza el rango 5, aprende a golpear de manera efectiva incluso si sus manos están atadas o inutilizables utilizando sus hombros, rodillas o cabeza.
                ▶ Destrucción estructural: cuando un personaje alcanza el rango 8, si utiliza un ataque total, el objetivo debe tirar sus dados de armadura dos veces y obtener el peor resultado. Esto se aplica a las armaduras estándar.
