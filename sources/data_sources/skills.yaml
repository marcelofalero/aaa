                ### Rank Benefits
                ▶ **Rank 3 [Artistic Flourish]:** The character can add a "signature" to their work. Any creativity skill check made to support another skill that results in an **Amazing** success grants the character an extra **Last Resort** point that must be used in the supported skill.
          - es:
              name: The Shape
              description: |-
                Se centra en Físico, expresión estructural y visual, como escultura, pintura, diseño de planos y creación de prototipos Técnico. Esta especialidad es el soporte principal de la ingeniería, la artesanía Físico y las "cosas con estructura definida".
                ### Beneficios de Rango
                ▶ **Rango 3 (Florecimiento artístico):** El Personaje puede agregar una "firma" a su trabajo. Cualquier prueba de habilidad de creatividad realizada para respaldar otra habilidad que resulte en un éxito **Asombroso** le otorga al Personaje un punto **Último Recurso** adicional que debe usarse en la habilidad admitida.
        trained_only: false
