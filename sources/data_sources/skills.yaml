          **Computer Repair:** A personaje with this skill has the ability to fix a damaged computer system, either by replacing defective parts or by rewiring a component or a system to bypass a problem spot. Repairing a computer system is always a tirada de habilidad compleja. For information on how attempts to repair a device are made, see the repair specialty under the Technical Science broad skill (page 89).

          **Programming:** Computer programs exist to handle almost any task imaginable. Without training in the use of these high-tech tools, the wealth of options and accessories available can be overwhelming to a personaje trying to employ them. As with information retrieval (above), using Computer Science to navigate and utilize a program almost always involves a tirada de habilidad compleja. A personaje with just the broad skill can only manipulate the source code of programs of Marginal quality and Marginal complexity. Manipulating programs of better quality and greater complexity requires the programming specialty skill. For more information on how the Computer Science specialty skills are used, see Chapter 10: Computers. Brief descriptions of the specialty skills are given below.
    items:
      hacking:
        attribute: INT
        cost: 4
        url: /skills/computer-science#hacking
        localized:
        - en:
            name: Hacking
            description: |-
              Hacking is the ability to break computer codes and bypass computer security for the purposes of gaining access to restricted data or secure computer systems. Hacking can be performed at a computer station that’s physically connected to the data stores in question, or it can be performed from a distant location by creating a link via a network of some kind. It's most often used to retrieve secured data, to enter and take control of a computer system, or to perform some type of sabotage such as erasing files or introducing a virus of some kind. This specialty skill allows a character equipped with a computer to perform the previously mentioned tasks. The character's own skill and any programs being used can help the character navigate computer systems, overcome security, and even defend against other operators hooked into a system.
              ### Rank Benefits
              ▶ **Rank 4, 8, 12 [-1 situation die bonus at rank 4]:** , a **-2 bonus at rank 8**, and a **-3 bonus at rank 12**.
        - es:
            name: Hacking
            description: |-
              Hacking is the ability to break computer codes and bypass computer security for the purposes of gaining access to restricted data or secure computer systems. Hacking can be performed at a computer station that’s physically connected to the data stores in question, or it can be performed from a distant location by creating a link via a network of some kind. It's most often used to retrieve secured data, to enter and take control of a computer system, or to perform some type of sabotage such as erasing files or introducing a virus of some kind. This specialty skill allows a personaje equipped with a computer to perform the previously mentioned tasks. The personaje's own skill and any programs being used can help the personaje navigate computer systems, overcome security, and even defend against other operators hooked into a system.

              ▶ Rango 4, 8, 12 [Increased Effect]: As a personaje gains ranks in this specialty skill, his ability to perform actions related to hacking improves. This is reflected by a **-1 dado de situación bono at rango 4**, a **-2 bono at rango 8**, and a **-3 bono at rango 12**.
        trained_only: true
      hardware:
        attribute: INT
        cost: 3
        url: /skills/computer-science#hardware
        localized:
        - en:
            name: Hardware
            description: |-
              This specialty represents a character's knowledge of and proficiency with the physical components that make up a computer. Understanding how a computer system works, being able to set one up quickly, designing and building your own computer, and repairing computer equipment are some of the tasks covered by this skill.
              ### Rank Benefits
              ▶ **Rank 4, 8, 12 [-1 situation die bonus at rank 4]:** , a **-2 bonus at rank 8**, and a **-3 bonus at rank 12**.
        - es:
            name: Hardware
            description: |-
              This specialty represents a personaje's knowledge of and proficiency with the physical components that make up a computer. Understanding how a computer system works, being able to set one up quickly, designing and building your own computer, and repairing computer equipment are some of the tasks covered by this skill.

              ▶ Rango 4, 8, 12 [Increased Effect]: As a personaje gains ranks in this specialty skill, his ability to repair computer systems and work with computer hardware in other ways improves. This is reflected by a **-1 dado de situación bono at rango 4**, a **-2 bono at rango 8**, and a **-3 bono at rango 12**.
        trained_only: false
      programming:
        attribute: INT
        cost: 3
        url: /skills/computer-science#programming
        localized:
        - en:
            name: Programming
            description: |-
              This specialty skill enables a character to improve her ability to analyze computer programs, modify existing programs, and (at higher ranks) create programs by writing her own code. Having rank 1 in this skill enables a character to modify the source code of programs of Ordinary quality and Ordinary complexity.

              Modify Existing Programs: A character with rank 3 in this skill is able to modify the code of existing programs of Good quality and Good complexity. When the character achieves rank 6, she can modify any existing program.

              Create New Programs: A character with rank 3 in this skill is able to create new programs of Marginal quality and Marginal complexity. Ordinary programs can be created at rank 6, Good programs at rank 9, and Amazing programs at rank 12.
        - es:
            name: Programación
            description: |-
              This specialty skill enables a personaje to improve her ability to analyze computer programs, modify existing programs, and (at higher ranks) create programs by writing her own code. Having rango 1 in this skill enables a personaje to modify the source code of programs of Ordinario quality and Ordinario complexity.

              Modify Existing Programs: A personaje with rango 3 in this skill is able to modify the code of existing programs of Bueno quality and Bueno complexity. When the personaje achieves rango 6, she can modify any existing program.

              Create New Programs: A personaje with rango 3 in this skill is able to create new programs of Marginal quality and Marginal complexity. Ordinario programs can be created at rango 6, Bueno programs at rango 9, and Asombroso programs at rango 12.
        trained_only: false
    trained_only: false
  covert-ops:
    attribute: DEX
    cost: 8
    category: Social
    url: /skills/covert-ops
    localized:
    - en:
        name: Covert Ops
        description: |-
          The **Covert Ops** broad skill focuses on remaining undetected. It consolidates the arts of stealth with the practical skills needed to blend in, conceal items, or pick pockets.

          ---
    - es:
        name: Operaciones Encubiertas
        description: |-
          The **Covert Ops** broad skill focuses on remaining undetected. It consolidates the arts of stealth with the practical skills needed to blend in, conceal items, or pick pockets.

          ---
    items:
      conceal:
        attribute: DEX
        cost: 3
        url: /skills/covert-ops#conceal
        localized:
        - en:
            name: Conceal
            description: |-
              This specialty represents the ability to hide objects from view or sensors. While **Stealth** is used to hide oneself, **Conceal** is used to hide items, such as weapons on one's person, contraband in a vehicle, or secret compartments.

              ### Results
              The degree of success on a Conceal check provides a penalty to an observer's **Awareness-Perception** or **Investigate-Search** check:
              - **Ordinary:** +1 penalty to observer
              - **Good:** +2 penalty to observer
              - **Amazing:** +3 penalty to observer

              ### Hiding Weapons
              A concealed weapon is worn where it is not subject to easy spotting (small of the back, inside the forearm, etc.). This is limited to small handguns or blades. Concealment provides a **+2 penalty** to all but the most intrusive physical searches.

              ---
        - es:
            name: Ocultar
            description: |-
              This specialty represents the ability to hide objects from view or sensors. While **Stealth** is used to hide oneself, **Conceal** is used to hide items, such as weapons on one's person, contraband in a vehicle, or secret compartments.

              ### Resultados
              The degree of success on a Conceal check provides a penalización to an observer's **Awareness-Perception** or **Investigate-Search** check:
              - **Ordinario:** +1 penalización to observer
              - **Bueno:** +2 penalización to observer
              - **Asombroso:** +3 penalización to observer

              ### Hiding Weapons
              A concealed weapon is worn where it is not subject to easy spotting (small of the back, inside the forearm, etc.). This is limited to small handguns or blades. Concealment provides a **+2 penalización** to all but the most intrusive physical searches.

              ---
        trained_only: false
      disguise:
        attribute: CHA
        cost: 3
        url: /skills/covert-ops#disguise
        localized:
        - en:
            name: Disguise
            description: |-
              Disguise is the ability to change your appearance to look like someone else or blend into a crowd. This covers immediate, practical applications like changing clothes, wearing a wig, or using simple props. A character’s Disguise situation die is modified by the observer's **Awareness-Perception** modifier.
              ### Rank Benefits
              ▶ **Rank 4, 8, 12 [Improved Disguise]:** You gain a bonus to all disguise attempts: -1 step at Rank 4, -2 at Rank 8, and -3 at Rank 12.

              ---
        - es:
            name: Disfraz
            description: |-
              Disguise is the ability to change your appearance to look like someone else or blend into a crowd. This covers immediate, practical applications like changing clothes, wearing a wig, or using simple props. A personaje’s Disguise dado de situación is modified by the observer's **Awareness-Perception** modifier.

              ▶ **Rango 4, 8, 12 [Improved Disguise]:** You gain a bono to all disguise attempts: -1 paso at Rango 4, -2 at Rango 8, and -3 at Rango 12.

