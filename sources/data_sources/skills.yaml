  demolitions:
    attribute: WIL
    cost: 6
    category: Technical
    url: /skills/demolitions
    localized:
      - en:
          name: Demolitions
          description: |-
            This broad skill provides training in the basics of setting explosive charges to demolish specific targets. It covers the safe handling of materials, primers, timing devices, and strategic placement for maximum structural impact.

            ### Structural
            This application targets stationary structures (buildings, bridges, bunkers) or massive vessels (starships, orbital platforms, land-dreadnoughts). This is a two-stage process.

            #### Stage A: Installation
            The character identifies load-bearing points or critical bulkheads and secures the charges. This is a **complex skill check**. A **Critical Failure** during this stage means the device explodes immediately, dealing Ordinary damage (normal armor rules apply).
            - **Complexity:** 4 successes for simple structures; 8+ successes for reinforced bunkers or capital ships.
            - **Difficulty:** Ordinary (or as determined by the GM based on environmental hazards).

            #### Stage B: Detonation (The Trigger Check)
            Once the installation is complete and the explosives are triggered, the character makes a final **Demolitions--Set Explosives** check to determine the efficacy of the placement.
            - **Critical Failure:** The device is a dud (it fails to explode).
            - **Failure:** The explosion is delayed; check every 5 minutes until a different result is achieved.
            - **Ordinary Success:** The explosion deals **Ordinary damage** to the structure or section.
            - **Good Success:** The explosion deals **Good damage** to the structure or section.
            - **Amazing Success:** The explosion deals **Amazing damage** to the structure or section.

            **Synergy:** **Physical Science--Physics** can be used as an auxiliary skill. A success provides a **-1 step bonus** to both installation and detonation checks as the character is better prepared to understand the materials strengths and weaknesses.

            ### Anti-Vehicular Mines and Traps
            These devices often do focused damage instead of having a blast radius. This is a two-stage process.

            #### Stage A: Installation
            The character identifies the optimal placement and fine-tunes the trigger mechanism. This is a **complex skill check**. A **Critical Failure** means the device explodes, dealing Ordinary damage.
            - **Complexity:** 2 successes for mines/simple traps; 4 successes for complex traps.
            - **Difficulty:** Ordinary (or as determined by the GM).

            #### Stage B: Detonation (The Trigger Check)
            Once triggered, make a final **Demolitions--Set Explosives** check to determine efficacy.
            - **Critical Failure:** The device is a dud.
            - **Failure:** The device fails to trigger but remains armed.
            - **Ordinary Success:** The explosion deals **Ordinary damage** to the vehicle.
            - **Good Success:** The explosion deals **Good damage** to the vehicle.
            - **Amazing Success:** The explosion deals **Amazing damage** to the vehicle.

            ### Anti-Personnel Mines and Traps
            These devices are designed to do damage in an area. Once triggered, they deal damage based on the distance from the device center.

            #### Installation
            The character identifies the best placement and fine-tunes the trigger. This is a **complex skill check**. A **Critical Failure** means the device explodes, dealing Ordinary damage.
            - **Complexity:** 2 successes for mines/simple traps; 4 successes for complex traps.
            - **Difficulty:** Ordinary.

            ### Concealing
            The installation process only places the device. To properly hide it, a **Covert Ops--Conceal** check must be made by the installer or an ally as part of the installation process.
      - es:
          name: Demoliciones
          description: |-
            Esta amplia habilidad brinda capacitación en los conceptos básicos de cómo colocar cargas explosivas para demoler objetivos específicos. Cubre el manejo seguro de materiales, imprimadores, dispositivos de sincronización y ubicación estratégica para lograr el máximo impacto estructural.

            ### Estructural
            Esta aplicación apunta a estructuras estacionarias (edificios, puentes, búnkeres) o naves masivas (naves espaciales, plataformas orbitales, acorazados terrestres). Este es un proceso de dos etapas.

            #### Etapa A: Instalación
            El personaje identifica puntos de carga o mamparos críticos y asegura las cargas. Esta es una **prueba de habilidad compleja**. Una **Falla crítica** durante esta etapa significa que el dispositivo explota inmediatamente, causando daño ordinario (se aplican las reglas de armadura normales).
            - **Complejidad:** 4 éxitos para estructuras simples; Más de 8 éxitos para búnkeres reforzados o naves capitales.
            - **Dificultad:** Ordinaria (o según lo determine el DJ en función de los peligros ambientales).

            #### Etapa B: Detonación (La verificación del gatillo)
            Una vez que se completa la instalación y se activan los explosivos, el personaje realiza una prueba final de **Demoliciones - Colocar explosivos** para determinar la eficacia de la colocación.
            - **Falla crítica:** El dispositivo no funciona (no explota).
            - **Fallo:** La explosión se retrasa; verifique cada 5 minutos hasta lograr un resultado diferente.
            - **Éxito ordinario:** La explosión causa **Daño ordinario** a la estructura o sección.
            - **Buen éxito:** La explosión causa **Buen daño** a la estructura o sección.
            - **Éxito asombroso:** La explosión causa **Daño asombroso** a la estructura o sección.

            **Sinergia:** **Ciencias físicas: física** se puede utilizar como habilidad auxiliar. Un éxito proporciona una **bonificación de -1 paso** a las pruebas de instalación y detonación, ya que el personaje está mejor preparado para comprender las fortalezas y debilidades de los materiales.

            ### Minas y trampas antivehiculares
            Estos dispositivos suelen causar daños concentrados en lugar de tener un radio de explosión. Este es un proceso de dos etapas.

            #### Etapa A: Instalación
            El personaje identifica la ubicación óptima y afina el mecanismo de disparo. Esta es una **prueba de habilidad compleja**. Una **Falla crítica** significa que el dispositivo explota y causa daño normal.
            - **Complejidad:** 2 éxitos para minas/trampas simples; 4 éxitos para trampas complejas.
            - **Dificultad:** Ordinaria (o según lo determine el DJ).

            #### Etapa B: Detonación (La verificación del gatillo)
            Una vez activado, haz una prueba final de **Demoliciones - Colocar explosivos** para determinar la eficacia.
            - **Fallo crítico:** El dispositivo es un fracaso.
            - **Falla:** El dispositivo no se activa pero permanece armado.
            - **Éxito ordinario:** La explosión causa **Daño ordinario** al vehículo.
            - **Buen éxito:** La explosión causa **Buen daño** al vehículo.
            - **Éxito asombroso:** La explosión causa **Daño asombroso** al vehículo.

            ### Minas y trampas antipersonal
            Estos dispositivos están diseñados para causar daños en un área. Una vez activados, causan daño según la distancia desde el centro del dispositivo.

            #### Instalación
            El personaje identifica la mejor ubicación y afina el disparador. Esta es una **prueba de habilidad compleja**. Una **Falla crítica** significa que el dispositivo explota y causa daño normal.
            - **Complejidad:** 2 éxitos para minas/trampas simples; 4 éxitos para trampas complejas.
            - **Dificultad:** Ordinaria.

            ### Ocultando
            El proceso de instalación sólo coloca el dispositivo. Para ocultarlo correctamente, el instalador o un aliado debe realizar una verificación de **Operaciones encubiertas--Ocultar** como parte del proceso de instalación.
