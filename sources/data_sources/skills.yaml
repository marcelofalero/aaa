  athletics:
    attribute: STR
    cost: 3
    category: Other
    url: /skills/athletics
    localized:
    - en:
        name: Athletics
        description: "This broad skill provides a character with the abilities of a natural athlete—a competent level of strength, grace, and physical prowess. This skill is used to determine the success of physical actions such as climbing a tree, jumping over a large hole, or throwing an object at a target."
    - es:
        name: Atletismo
        description: "Esta habilidad amplia proporciona a un personaje las capacidades de un atleta natural: un nivel competente de fuerza, gracia y destreza física. Esta habilidad se utiliza para determinar el éxito de acciones físicas como trepar a un árbol, saltar por encima de un gran agujero o lanzar un objeto a un objetivo.\n\n---\n\n# Habilidades de Especialidad"
    items:
      climb:
        attribute: STR
        cost: 2
        url: /skills/athletics#climb
        localized:
        - en:
            name: Climb
            description: ''
        - es:
            name: Saltar
            description: "CON la habilidad de saltar, un personaje puede intentar saltar obstáculos realizando un salto horizontal (en carrera o desde parado) o un salto vertical.\n\nEn cualquier intento de salto, un resultado de Fallo Crítico indica que el personaje tropieza y sufre una caída dura, recibiendo d6 puntos de daño de aturdimiento. Un resultado Marginal indica que el personaje realiza un salto de distancia Ordinaria pero sufre d4 puntos de daño de aturdimiento debido a un mal aterrizaje.\n\n### Tipos de Salto\n- **Salto desde parado:** Ordinario 1m; Bueno 2m; Asombroso 3m. (Posición inicial estacionaria)\n- **Salto en carrera:** Ordinario 2m; Bueno 4m; Asombroso 6m. (Requiere al menos 4m de carrera previa)\n- **Salto vertical:** Ordinario 1m; Bueno 1,5m; Asombroso 2m. (Desde posición de pie; alcance por encima de la cabeza)\n\n*Nota: Se aplican ajustes por gravedad (p. ej., se dobla la distancia en gravedad ligera).*\n\n### Beneficios de Rango\n- **Distancia Aumentada:** El\
              \ salto en carrera mejora en 1 metro en los rangos 3, 6, 9 y 12; el salto desde parado mejora en 1 metro en los rangos 4, 7 y 10; y el salto vertical mejora en 0,5 metros en los rangos 5, 8 y 11.\n\n---"
      jump:
        attribute: STR
        cost: 1
        url: /skills/athletics#jump
        localized:
        - en:
            name: Jump
            description: ''
        - es:
            name: Nadar
            description: "La habilidad de especialidad de Nadar representa la capacidad de un personaje para moverse a través del agua u otros entornos líquidos sin hundirse ni ahogarse.\n\n⊗ **Aumento de la Velocidad de Movimiento:** A medida que un personaje alcanza rangos más altos en la especialidad de nadar, mejora sus velocidades de movimiento de nado y nado suave. Ambas velocidades aumentan en **1 metro** al rango 4, de nuevo al rango 8, y de nuevo al rango 12.\n\n---"
      swim:
        attribute: STR
        cost: 2
        url: /skills/athletics#swim
        localized:
        - en:
            name: Swim
            description: ''
        - es:
            name: Lanzar
            description: "CON la habilidad de lanzar, un personaje puede arrojar CON precisión pelotas, dardos, piedras, cuchillos arrojadizos, granadas y otros objetos pequeños a un objetivo específico.\n\nLa precisión de un lanzamiento depende del alcance y del grado de éxito obtenido en una comprobación de habilidad.\n\n### Precisión por Alcance\n\n| Resultado | Corto Alcance | Alcance Medio | Largo Alcance |\n| :--- | :--- | :--- | :--- |\n| **Fallo Crítico** | Falla por 4m | Falla por 8m | Falla por 16m |\n| **Fallo** | Falla por 2m | Falla por 4m | Falla por 8m |\n| **Ordinario** | En el blanco | Falla por 2m | Falla por 4m |\n| **Bueno** | En el blanco | En el blanco | Falla por 2m |\n| **Asombroso** | En el blanco | Siempre en el blanco | En el blanco |"
      throw:
        attribute: STR
        cost: 2
        url: /skills/athletics#throw
        localized:
        - en:
            name: Throw
            description: ''
        - es:
            name: Throw
            description: ''
  awareness:
    attribute: WIL
    cost: 3
    category: Other
    url: /skills/awareness
    localized:
    - en:
        name: Awareness
        description: "This broad skill represents a character's powers of observation, perception, and intuition. Skill checks are called for when the Gamemaster needs to determine if a character notices something—characters themselves never call for a use of this skill.\n\nNoticing something could be as simple as providing a hint that the character missed in the normal course of play, or help when the character appears totally lost or confused. On a Failure, the character doesn't notice a thing. Otherwise, any success provides the character with at least a small clue. The Gamemaster can decide that the better the level of success achieved, the more details the character becomes aware of. Situation die modifiers are listed in the Gamemaster Guide. Note, too, that another character’s use of certain skills (such as Stealth and Security-protection protocols) can add modifiers to a character's Awareness check.\n\nThe Awareness broad skill and its specialties are Good examples of how the general\
          \ rule on dice rolling applies to an AAA game: Dice should only be rolled on a skill check in a situation when the Gamemaster needs to determine if a character is capable of doing something difficult or out of the Ordinary. More often than not, characters with respectable scores in Awareness or its specialties will automatically succeed when something exists that can be noticed or perceived—for instance, it doesn't take a skill check to determine if a character sees a fallen tree blocking his path. On the other hand, a skill check may be called for to see if the character notices that the fallen tree has a hole in its trunk where an object is concealed; or, the Gamemaster might assume that a character who has several ranks in the perception specialty immediately notices the hole.\n\nSome pieces of sensor equipment may provide benefits to a character’s Awareness skill check, as described in Chapter 9: Goods & Services.\n\n---"
    - es:
        name: Alerta
        description: "Esta habilidad amplia representa los poderes de observación, percepción e intuición de un personaje. Las comprobaciones de habilidad se solicitan cuando el Director de Juego necesita determinar si un personaje nota algo; los personajes por sí mismos nunca solicitan el uso de esta habilidad (excepto en casos específicos de intuición).\n\nNotar algo podría ser tan simple como proporcionar una pista que el personaje pasó por alto en el curso normal del juego, o ayuda cuando el personaje parece totalmente perdido o confundido. En un Fallo, el personaje no nota nada. De lo contrario, cualquier éxito proporciona al personaje al menos una pequeña pista. El Director de Juego puede decidir que cuanto mejor sea el nivel de éxito alcanzado, de más detalles se percatará el personaje. Los modificadores de dado de situación se enumeran en la Guía del Director de Juego. Tenga en cuenta también que el uso de ciertas habilidades por parte de otro personaje (como Sigilo y los protocolos\
          \ de protección de Seguridad) puede añadir modificadores a la comprobación de Alerta de un personaje.\n\nLa habilidad amplia de Alerta y sus especialidades son buenos ejemplos de cómo se aplica la regla general sobre el lanzamiento de dados: los dados solo deben lanzarse en una comprobación de habilidad en una situación en la que el Director de Juego necesite determinar si un personaje es capaz de hacer algo difícil o fuera de lo Ordinario. En la mayoría de los casos, los personajes CON puntuaciones respetables en Alerta o sus especialidades tendrán éxito automáticamente cuando exista algo que pueda ser notado o percibido; por ejemplo, no se requiere una comprobación de habilidad para determinar si un personaje ve un árbol caído bloqueando su camino. Por otro lado, se puede solicitar una comprobación de habilidad para ver si el personaje nota que el árbol caído tiene un hueco en su tronco donde se oculta un objeto; o, el Director de Juego podría asumir que un personaje que tiene\
          \ varios rangos en la especialidad de percepción nota inmediatamente el hueco.\n\nAlgunos equipos de sensores pueden proporcionar beneficios a la comprobación de habilidad de Alerta de un personaje, como se describe en la sección de Equipo.\n\n---\n\n# Habilidades de Especialidad"
    items:
      intuition:
        attribute: WIL
        cost: 1
        url: /skills/awareness#intuition
        localized:
        - en:
            name: Intuition
            description: "This specialty skill represents a character's natural instincts—his ability to sense danger when no obvious signs are evident, to avoid surprise, or to make an intuitive leap of logic without the support of hard facts. It's the ability to make a best guess in a given situation.\n\nWhen no obvious signs of danger are evident, a character’s subconscious use of this skill can enable him to avoid being caught by surprise. (The Gamemaster calls for intuition checks; players don't request them, except in the circumstances described in the next paragraph.) Success indicates that the character isn't surprised and can act in the surprise phase of the upcoming round. (For more information about surprise situations, see page 58 of Chapter 3: Characters in Action.)\n\nWhen a character wants to make an intuitive \"best guess,” the Gamemaster may allow a player to call for an intuition skill check on his character’s behalf. In such a case, any success yields a beneficial result,\
              \ but the greater the level of success, the more accurate and complete the conclusion. This use of the intuition skill to make a best guess is only permitted to characters who have purchased the specialty skill, and it shouldn't be allowed more than once or twice in an adventure.\n\n---"
        - es:
            name: Intuición
            description: "Esta habilidad de especialidad representa los instintos naturales de un personaje: su capacidad para sentir el peligro cuando no hay señales obvias evidentes, para evitar la sorpresa o para realizar un salto intuitivo de lógica sin el apoyo de hechos concretos. Es la capacidad de hacer una \"mejor suposición\" en una situación dada.\n\nCuando no hay señales obvias de peligro evidentes, el uso subconsciente de esta habilidad por parte de un personaje puede permitirle evitar ser sorprendido. (El Director de Juego solicita las comprobaciones de intuición; los jugadores no las piden, excepto en las circunstancias descritas en el párrafo siguiente). El éxito indica que el personaje no es sorprendido y puede actuar en la fase de sorpresa del próximo asalto.\n\nCuando un personaje quiere hacer una \"mejor suposición\" intuitiva, el Director de Juego puede permitir que un jugador solicite una comprobación de la habilidad de intuición en nombre de su personaje. En tal caso,\
              \ cualquier éxito arroja un resultado beneficioso, pero cuanto mayor sea el nivel de éxito, más precisa y completa será la conclusión. Este uso de la habilidad de intuición para hacer una mejor suposición solo está permitido a los personajes que han comprado la habilidad de especialidad, y no debería permitirse más de una o dos veces en una aventura.\n\n---"
      perception:
        attribute: WIL
        cost: 3
        url: /skills/awareness#perception
        localized:
        - en:
            name: Perception
            description: "This specialty skill represents a character's alertness and powers of observation—the character notices something either consciously or on a subliminal level. While intuition is a feeling or unexplainable sense, perception works on signs that can be spotted by normal senses—a broken twig lying in a path, the click of a gun’s safety being released, the scent of familiar perfume in a crowded bar, a whisper in the wind. This skill can help determine a character’s ability to spot signs of trouble, perceive the true meaning in an authority figure's comment, or notice a subtle clue poking out of a pile of leaves.\n\nWhen potential danger obviously exists in a situation, a character's subconscious use of this skill can help him avoid being caught by surprise. (The Gamemaster calls for perception checks; players don't request them.) Success indicates that the character isn't surprised and can act in the surprise phase of the upcoming round. (For more information about surprise\
              \ situations, see page 58 of Chapter 3: Characters in Action.)\n\n---\n\n### Psionic Sense (WIL - Trained Only)\n\nThis specialty skill allows a character to detect the activation of psionic powers, as well as the presence of psionic phenomena. It can be used to assist in identifying the general type of psionic power being used, the direction of its source, and the approximate intensity of the psionic user.\n\n**Note:** Only characters who are capable of using psionic powers (such as Mindwalkers) or those who have the \"Psionic Awareness\" perk can purchase and use this skill.\n\n#### Detecting Psionic Powers\n\nThe Gamemaster will call for a check when a psionic power is activated in the character's vicinity, similar to a check to detect an ambush.\n\n- **Ordinary:** The character senses that *some* psionic power was activated nearby.\n- **Good:** If the source is within line of sight, the character can identify the user. If not, they get a general idea of the direction and\
              \ distance to the source.\n- **Amazing:** The character can detect the subtle, ongoing effects of a psionic power, such as mental manipulation or psionic illusions.\n\n#### Identifying Psionic Phenomena\n\nIf the character attempts a **Knowledge - Psionics** check to identify or trace the source of the specific power or phenomenon detected, they receive a bonus based on their Psionic Sense result:\n\n- **Ordinary:** No bonus.\n- **Good:** -1 step bonus to the Knowledge - Psionics check to identify or appropriate power to trace.\n- **Amazing:** -3 steps bonus to the Knowledge - Psionics check to identify or appropriate power trace.\n\nPossible powers:\n\n- **Telepathy-Contact**, to communicate to the activator.\n- **ESP-Navcognition**, to know the how to reach the location of the activator.\n- **ESP-Clairvoyance/Clairaudience**, to see/hear the activator.\n\nEach power is subject to its own limitations and range\n\nCharacters capable of using the **Clairvoyance** power can use\
              \ it to trace the source of the psionic event, applying the same bonus to their Clairvoyance skill check (0, -1, or -3 steps)."
        - es:
            name: Percepción
            description: "Esta habilidad de especialidad representa la alerta y los poderes de observación de un personaje: el personaje nota algo ya sea consciente o subliminalmente. Mientras que la intuición es un sentimiento o sentido inexplicable, la percepción trabaja sobre señales que pueden ser detectadas por los sentidos normales: una ramita rota en un camino, el clic del seguro de un arma al ser liberado, el aroma de un perfume familiar en un bar abarrotado, un susurro en el viento. Esta habilidad puede ayudar a determinar la capacidad de un personaje para detectar señales de problemas, percibir el verdadero significado en el comentario de una figura de autoridad o notar una pista sutil que asoma entre un montón de hojas.\n\nCuando el peligro potencial existe obviamente en una situación, el uso subconsciente de esta habilidad por parte de un personaje puede ayudarle a evitar ser sorprendido. (El Director de Juego solicita las comprobaciones de percepción; los jugadores no las piden).\
              \ El éxito indica que el personaje no es sorprendido y puede actuar en la fase de sorpresa del próximo asalto.\n\n---"
      psionic-sense:
        attribute: WIL
        cost: 4
        url: /skills/awareness#psionic-sense
        localized:
        - en:
            name: Psionic Sense
            description: ''
        - es:
            name: Sentido psiónico
            description: ''
  business:
    attribute: INT
    cost: 4
    category: Social
    url: /skills/business
    localized:
    - en:
        name: Business
        description: "This broad skill provides a basic knowledge of the theories of production, distribution, supply and demand, advertising, inventory control, and business planning. Skill checks are called for when a character wants to play the stock market, apply his business know-how to conclude a trade, attempt an illegal business transaction, determine the value of goods in his own society, locate commodity marketplaces, and compute the local fair market value of goods and services.\n\nThe Gamemaster will assign modifiers to the situation die, taking into account the circumstances that exist when a skill check is called for. If a character uses some aspect of the Business skill to haggle with someone over the buying or selling of a commodity, the other party's Intelligence resistance modifier is applied to the situation die. If the other party also has Business skill, the Gamemaster may elect to handle the confrontation as a “Character vs. Character” situation; see page 63.\n\nOptionally,\
          \ in such a case the Business skill can be treated as an [encounter skill](/core-mechanics/characters-in-action/#encounter-scene). If the use of this skill results in a target's attitude being changed to Friendly or better, this can provide a bonus on any subsequent skill check to get the other party to cooperate.\n\nA situation die penalty will usually apply when a character tries to deal in exotic, rare, or unfamiliar goods; tries to make an illegal transaction; or tries to close a deal with a member of an unfamiliar culture. Any of these penalties can be Ordinary, Good, or Amazing, depending on the specific situation.\n\nA bonus to the situation die would apply if the character has inside information that gives him an advantage in making a transaction, or if he is dealing with a familiar commodity or culture.\n\n---"
    - es:
        name: Negocios
        description: "Esta habilidad general proporciona un conocimiento básico de las teorías de producción, distribución, oferta y demanda, publicidad, control de inventario y planificación empresarial. Se solicitan tiradas de habilidad cuando un personaje quiere jugar en el mercado de valores, aplicar sus conocimientos de negocios para cerrar un trato, intentar una transacción comercial ilegal, determinar el valor de los bienes en su propia sociedad, localizar mercados de productos básicos y calcular el valor justo de mercado local de bienes y servicios.\n\nEl Director de Juego asignará modificadores al dado de situación, teniendo en cuenta las circunstancias que existen cuando se solicita una tirada de habilidad. Si un personaje usa algún aspecto de la habilidad de Negocios para regatear CON alguien sobre la compra o venta de un producto, se aplica el modificador de resistencia de Inteligencia de la otra parte al dado de situación. Si la otra parte también tiene la habilidad de Negocios,\
          \ el Director de Juego puede optar por manejar la confrontación como una situación de \"Personaje contra Personaje\"; ver página 63.\n\nOpcionalmente, en tal caso, la habilidad de Negocios puede tratarse como una [habilidad de encuentro](/es/core-mechanics/characters-in-action/#encounter-scene). Si el uso de esta habilidad da como resultado que la actitud de un objetivo cambie a Amistosa o mejor, esto puede proporcionar una bonificación en cualquier tirada de habilidad posterior para que la otra parte coopere.\n\nPor lo general, se aplicará una penalización de dado de situación cuando un personaje intente negociar CON bienes exóticos, raros o desconocidos; intente realizar una transacción ilegal; o intente cerrar un trato CON un miembro de una cultura desconocida. Cualquiera de estas penalizaciones puede ser Ordinaria, Buena o Asombrosa, dependiendo de la situación específica.\n\nSe aplicaría una bonificación al dado de situación si el personaje tiene información privilegiada que\
          \ le da una ventaja al realizar una transacción, o si está tratando CON un producto o cultura familiar.\n\n---"
    items:
      corporate:
        attribute: INT
        cost: 3
        url: /skills/business#corporate
        localized:
        - en:
            name: Corporate
            description: "This specialty skill enables a character to improve his ability to function in the realm of large-scale trade and commerce, and to deal with stock markets, mergers, corporate acquisitions, speculative business, and the businesspeople who operate in these circles. It also provides a character with an understanding of how big businesses and corporations operate. Corporate presidents and trade lords who move goods and services on a global or galactic scale use this skill to determine the success of their business activities.\n\n---"
        - es:
            name: Corporativo
            description: "Esta especialización permite a un personaje mejorar su capacidad para funcionar en el ámbito del comercio y el comercio a gran escala, y para tratar CON los mercados de valores, fusiones, adquisiciones corporativas, negocios especulativos y los empresarios que operan en estos círculos. También proporciona a un personaje una comprensión de cómo operan las grandes empresas y corporaciones. Los presidentes de corporaciones y los señores del comercio que mueven bienes y servicios a escala global o galáctica usan esta habilidad para determinar el éxito de sus actividades comerciales.\n\n---"
      illicit-business:
        attribute: INT
        cost: 3
        url: /skills/business#illicit-business
        localized:
        - en:
            name: Illicit business
            description: "This specialty skill allows a character to improve his ability to function in the underside of the business world. Extortion, smuggling, fencing stolen goods, and dealing with the black market are among the questionable trade practices this skill provides knowledge in. Purchasing ranks in this skill doesn't necessarily lead to a successful criminal career; it merely provides the character with the knowledge to interact with the wrong side of the law. This is the skill used by the white-collar criminal—the embezzler, the insider trader, the corporate spy, and so forth.\n\nIn addition, having this skill reduces the penalty for attempting an illegal transaction (see the Business skill description above), depending on the skill rank achieved. When this skill is first purchased, any illegal transaction penalty is reduced by -1 step.\n\n**Rank Progression**\n\n⊗ **Increased Effect:** As a character achieves higher ranks in illicit business, he or she is able to disregard\
              \ more severe penalties: At rank 4 the penalty reduction is -2 steps; at rank 7 it is -3 steps; and at rank 10 it becomes —4 steps. This benefit only reduces or eliminates a penalty; it never provides a bonus.\n\n---"
        - es:
            name: Negocios Ilícitos
            description: "Esta especialización permite a un personaje mejorar su capacidad para funcionar en el lado oscuro del mundo de los negocios. La extorsión, el contrabando, la venta de bienes robados y el trato CON el mercado negro se encuentran entre las prácticas comerciales cuestionables en las que esta habilidad proporciona conocimiento. Comprar rangos en esta habilidad no conduce necesariamente a una carrera criminal exitosa; simplemente le proporciona al personaje el conocimiento para interactuar CON el lado equivocado de la ley. Esta es la habilidad utilizada por el criminal de cuello blanco: el malversador, el que comercia CON información privilegiada, el espía corporativo, etc.\n\nAdemás, tener esta habilidad reduce la penalización por intentar una transacción ilegal (ver la descripción de la habilidad de Negocios más arriba), dependiendo del rango de habilidad alcanzado. Cuando se compra esta habilidad por primera vez, cualquier penalización por transacción ilegal se reduce\
              \ en -1 paso.\n\n**Progresión de Rango**\n\n⊗ **Efecto Aumentado:** A medida que un personaje alcanza rangos más altos en negocios ilícitos, puede ignorar penalizaciones más severas: en el rango 4, la reducción de la penalización es de -2 pasos; en el rango 7 es de -3 pasos; y en el rango 10 se convierte en -4 pasos. Este beneficio solo reduce o elimina una penalización; nunca proporciona una bonificación.\n\n---"
      small-business:
        attribute: INT
        cost: 3
        url: /skills/business#small-business
        localized:
        - en:
            name: Small business
            description: "This specialty skill allows a character to improve his ability to function in the pursuit of small-scale trade and commerce. Small-business owners and merchants use this skill to determine the success of their business activities. This skill improves a character's ability to haggle on the consumer level, determine the value of goods and services, and find buyers and sellers in a specific area.\n\nIn addition, this skill provides a situation die bonus when a character attempts to make deals, haggle, or otherwise bargain in the pursuit of small-business finance. The bonus starts at -1 step when a character purchases this skill.\n\n**Rank Progression**\n\n⊗ **Increased Effect:** As a character achieves higher ranks in small business, he or she receives a greater situation die bonus: -2 steps at rank 4, -3 steps at rank 8, and -4 steps at rank 12."
        - es:
            name: Pequeños Negocios
            description: "Esta especialización permite a un personaje mejorar su capacidad para funcionar en la búsqueda del comercio y el comercio a pequeña escala. Los propietarios de pequeñas empresas y los comerciantes usan esta habilidad para determinar el éxito de sus actividades comerciales. Esta habilidad mejora la capacidad de un personaje para regatear a nivel de consumidor, determinar el valor de los bienes y servicios, y encontrar compradores y vendedores en un área específica.\n\nAdemás, esta habilidad proporciona una bonificación de dado de situación cuando un personaje intenta hacer tratos, regatear o negociar de otra manera en la búsqueda de financiación para pequeñas empresas. La bonificación comienza en -1 paso cuando un personaje compra esta habilidad.\n\n**Progresión de Rango**\n\n⊗ **Efecto Aumentado:** A medida que un personaje alcanza rangos más altos en pequeños negocios, recibe una mayor bonificación de dado de situación: -2 pasos en el rango 4, -3 pasos en el rango\
              \ 8 y -4 pasos en el rango 12."
  computer-science:
    attribute: INT
    cost: 7
    category: Technical
    url: /skills/computer-science
    localized:
    - en:
        name: Computer Science
        description: "Computers are an integral part of human society, and many alien societies as well, at Progress Level 5 and higher. (For much more information on computers and related material, see Chapter 10: Computers.) Most computers and computer-assisted machines are designed to be user-friendly in routine situations. The broad skill provides a character with a basic understanding of computers and computer systems. (In comparison, the Knowledge—computer operation skill merely gives a character the ability to use a computer effectively, but does not allow any understanding of how the machine does what it does.)\n\nThe three primary uses for the Computer Science broad skill are information retrieval, computer repair, and programming. These uses are described below.\n\n**Note:** Some computer systems allow users who don't have the broad skill to make skill checks at their base Intelligence score instead of at the untrained score. If such an assist program is installed in a particular\
          \ piece of equipment, your Gamemaster will let you know.\n\n▶ Information Retrieval: Most computers are connected to some storehouse of raw data—a large network, a centralized storage system, or the unit’s own drives. Using the Computer Science skill to search for specific information requires a skill check only if that information is protected in some way (user password, encoded data, etc.) or if the information is obscure and hard to locate. In all but the most straightforward of situations, a complex skill check (see page 62) is used to determine the result of a retrieval attempt.\n\nThe broad skill is useful when a character wants to retrieve information from any unprotected system—but if the system is protected, only programs of Marginal quality and Marginal complexity can be accessed with the broad skill. In order to retrieve information from a protected system of higher quality or greater complexity, the specialty skill hacking is needed. A Critical Failure result on the\
          \ skill check usually means that safeguards or alarms have been triggered, an unretrievable computer error occurs, or the character makes some other monumental mistake that aborts this computer run.\n\n▶ Computer Repair: A character with this skill has the ability to fix a damaged computer system, either by replacing defective parts or by rewiring a component or a system to bypass a problem spot. Repairing a computer system is always a complex skill check. For information on how attempts to repair a device are made, see the repair specialty under the Technical Science broad skill (page 89).\n\n▶ Programming: Computer programs exist to handle almost any task imaginable. Without training in the use of these high-tech tools, the wealth of options and accessories available can be overwhelming to a character trying to employ them. As with information retrieval (above), using Computer Science to navigate and utilize a program almost always involves a complex skill check. A character\
          \ with just the broad skill can only manipulate the source code of programs of Marginal quality and Marginal complexity. Manipulating programs of better quality and greater complexity requires the programming specialty skill.\n\nFor more information on how the Computer Science specialty skills are used, see Chapter 10: Computers. Brief descriptions of the specialty skills are given below.\n\n---"
    - es:
        name: Ciencias de la Computación
        description: "Las computadoras son una parte integral de la sociedad humana, y también de muchas sociedades alienígenas en el Nivel de Progreso 5 o superior. (Para mucha más información sobre computadoras y material relacionado, consulta el Capítulo 10: Computadoras). La mayoría de las computadoras y máquinas asistidas por computadora están diseñadas para ser fáciles de usar en situaciones rutinarias. La habilidad general proporciona a un personaje una comprensión básica de las computadoras y los sistemas informáticos. (En comparación, la habilidad Uso de Computadora bajo Conocimiento simplemente le da a un personaje la capacidad de usar una computadora de manera efectiva, pero no le permite comprender cómo la máquina hace lo que hace).\n\nLos tres usos principales para la habilidad general Ciencias de la Computación son la recuperación de información, la reparación de computadoras y la programación. Estos usos se describen a continuación.\n\n**Nota:** Algunos sistemas informáticos\
          \ permiten que los usuarios que no tienen la habilidad general hagan tiradas de habilidad utilizando su puntuación base de Inteligencia en lugar de la puntuación sin entrenamiento. Si dicho programa de asistencia está instalado en un equipo en particular, tu Director de Juego te lo hará saber.\n\n▶ Recuperación de Información: La mayoría de las computadoras están conectadas a algún depósito de datos en bruto: una red grande, un sistema de almacenamiento centralizado o las propias unidades del sistema. Usar la habilidad Ciencias de la Computación para buscar información específica requiere una tirada de habilidad solo si esa información está protegida de alguna manera (contraseña de usuario, datos codificados, etc.) o si la información es oscura y difícil de localizar. En todas las situaciones, excepto las más sencillas, se utiliza una tirada de habilidad compleja (ver pág. 62) para determinar el resultado de un intento de recuperación.\n\nLa habilidad general es útil cuando un\
          \ personaje quiere recuperar información de cualquier sistema no protegido, pero si el sistema está protegido, solo se puede acceder a programas de calidad Marginal y complejidad Marginal CON la habilidad general. Para recuperar información de un sistema protegido de mayor calidad o complejidad, se necesita la especialización de hacking. Un resultado de Fallo Crítico en la tirada de habilidad generalmente significa que se han activado medidas de seguridad o alarmas, ocurre un error informático irrecuperable o el personaje comete otro error monumental que aborta esta ejecución informática.\n\n▶ Reparación de Computadoras: Un personaje CON esta habilidad tiene la capacidad de arreglar un sistema informático dañado, ya sea reemplazando partes defectuosas o reconfigurando un componente o sistema para evitar un punto problemático. Reparar un sistema informático siempre es una tirada de habilidad compleja. Para obtener información sobre cómo se realizan los intentos de reparación de\
          \ un dispositivo, consulta la especialización de reparación bajo la habilidad general Ciencias Técnicas (pág 89).\n\n▶ Programación: Los programas informáticos existen para manejar casi cualquier tarea imaginable. Sin la capacitación adecuada sobre el uso de estas herramientas de alta tecnología, la gran cantidad de opciones y accesorios disponibles puede ser abrumadora para un personaje que intenta emplearlos. Al igual que CON la recuperación de información (arriba), utilizar Ciencias de la Computación para navegar y utilizar un programa casi siempre implica una tirada de habilidad compleja. Un personaje CON solo la habilidad general solo puede manipular el código fuente de programas de calidad Marginal y complejidad Marginal. La manipulación de programas de mejor calidad y mayor complejidad requiere la especialización en programación.\n\nPara obtener más información sobre cómo se utilizan las especializaciones de Ciencias de la Computación, consulta el Capítulo 10: Computadoras.\
          \ A continuación se ofrecen descripciones breves de las especializaciones.\n\n---\n\n# Especializaciones"
    items:
      hacking:
        attribute: INT
        cost: 4
        url: /skills/computer-science#hacking
        localized:
        - en:
            name: Hacking
            description: "Hacking is the ability to break computer codes and bypass computer security for the purposes of gaining access to restricted data or secure computer systems. Hacking can be performed at a computer station that’s physically connected to the data stores in question, or it can be performed from a distant location by creating a link via a network of some kind. It's most often used to retrieve secured data, to enter and take control of a computer system, or to perform some type of sabotage such as erasing files or introducing a virus of some kind.\n\nThis specialty skill allows a character equipped with a computer to perform the previously mentioned tasks. The character's own skill and any programs being used can help the character navigate computer systems, overcome security, and even defend against other operators hooked into a system.\n\n▶ Increased Effect: As a character gains ranks in this specialty skill, his ability to perform actions related to hacking improves.\
              \ This is reflected by a **-1 situation die bonus at rank 4**, a **-2 bonus at rank 8**, and a **-3 bonus at rank 12**.\n\n---"
        - es:
            name: Hacking
            description: "El Hacking es la habilidad de romper códigos informáticos y eludir la seguridad informática CON el fin de obtener acceso a datos restringidos o sistemas informáticos seguros. El Hacking se puede realizar en una estación de computadora que esté conectada físicamente a las tiendas de datos en cuestión, o se puede realizar desde una ubicación distante creando un enlace a través de una red de algún tipo. Se utiliza CON mayor frecuencia para recuperar datos protegidos, entrar y tomar el control de un sistema informático, o para realizar algún tipo de sabotaje como borrar archivos o introducir un virus de algún tipo.\n\nEsta especialidad le permite a un personaje equipado CON una computadora realizar las tareas mencionadas anteriormente. La propia habilidad del personaje y cualquier programa que se utilice pueden ayudar al personaje a navegar por sistemas informáticos, superar la seguridad e incluso defenderse frente a otros operadores conectados a un sistema.\n\n▶ Efecto\
              \ Incremental: A medida que un personaje gana rangos en esta especialidad, su habilidad para realizar acciones relativas al hacking mejora. Esto se refleja CON un **bonificador al dado de situación de -1 en el rango 4**, un **bonificador de -2 en el rango 8**, y un **bonificador de -3 en el rango 12**.\n\n---"
      hardware:
        attribute: INT
        cost: 3
        url: /skills/computer-science#hardware
        localized:
        - en:
            name: Hardware
            description: "This specialty represents a character's knowledge of and proficiency with the physical components that make up a computer. Understanding how a computer system works, being able to set one up quickly, designing and building your own computer, and repairing computer equipment are some of the tasks covered by this skill.\n\n▶ Increased Effect: As a character gains ranks in this specialty skill, his ability to repair computer systems and work with computer hardware in other ways improves. This is reflected by a **-1 situation die bonus at rank 4**, a **-2 bonus at rank 8**, and a **-3 bonus at rank 12**.\n\n---"
        - es:
            name: Hardware
            description: "Esta especialidad representa el conocimiento y la competencia de un personaje CON los componentes físicos que conforman una computadora. Comprender cómo funciona un sistema informático, poder configurarlo rápidamente, diseñar y construir su propia computadora y reparar el equipo informático son algunas de las tareas cubiertas por esta habilidad.\n\n▶ Efecto Incremental: A medida que un personaje gana rangos en esta especialidad, su capacidad para reparar sistemas informáticos y trabajar CON hardware informático de otras maneras mejora. Esto se refleja CON un **bonificador al dado de situación de -1 en el rango 4**, un **bonificador de -2 en el rango 8**, y un **bonificador de -3 en el rango 12**.\n\n---"
      programming:
        attribute: INT
        cost: 3
        url: /skills/computer-science#programming
        localized:
        - en:
            name: Programming
            description: "This specialty skill enables a character to improve her ability to analyze computer programs, modify existing programs, and (at higher ranks) create programs by writing her own code. Having rank 1 in this skill enables a character to modify the source code of programs of Ordinary quality and Ordinary complexity.\n\n▶ Modify Existing Programs: A character with rank 3 in this skill is able to modify the code of existing programs of Good quality and Good complexity. When the character achieves rank 6, she can modify any existing program.\n\n▶ Create New Programs: A character with rank 3 in this skill is able to create new programs of Marginal quality and Marginal complexity. Ordinary programs can be created at rank 6, Good programs at rank 9, and Amazing programs at rank 12."
        - es:
            name: Programación
            description: "Esta especialidad le permite a un personaje mejorar su capacidad para analizar programas informáticos, modificar programas existentes y (en rangos superiores) crear programas escribiendo su propio código. Tener el rango 1 en esta habilidad permite a un personaje modificar el código fuente de programas de calidad Ordinaria y complejidad Ordinaria.\n\n▶ Modificar Programas Existentes: Un personaje CON el rango 3 en esta habilidad puede modificar el código de los programas existentes de calidad Buena y complejidad Buena. Cuando el personaje logra el rango 6, puede modificar cualquier programa existente.\n\n▶ Crear Nuevos Programas: Un personaje CON rango 3 en esta habilidad puede crear nuevos programas de calidad Marginal y complejidad Marginal. Se pueden crear programas Ordinarios en el rango 6, programas Buenos en el rango 9, y programas Asombrosos en el rango 12."
  covert-ops:
    attribute: DEX
    cost: 8
    category: Social
    url: /skills/covert-ops
    localized:
    - en:
        name: Covert Ops
        description: "The **Covert Ops** broad skill focuses on remaining undetected and bypassing physical security. It consolidates the arts of stealth with the practical skills needed to blend in or pick pockets.\n\n- **Unified Stealth:** Merging hide, sneak, and shadowing into a single Stealth specialty.\n- **Physical Bypassing:** Including Pickpocket and Conceal.\n\n---"
    - es:
        name: Operaciones Encubiertas
        description: "La habilidad general de **Operaciones Encubiertas** (anteriormente Sigilo y Manipulación) se centra en permanecer sin ser detectado y eludir la seguridad física. Consolida las artes del sigilo CON las habilidades técnicas necesarias para abrir cerraduras y carterear.\n\n- **Sigilo Unificado:** Fusiona esconderse, moverse sigilosamente y seguir en la sombra en una única especialización de Sigilo.\n- **Elusión Física:** Incluye Abrir Cerraduras y Carterear.\n\n---"
    items:
      conceal:
        attribute: DEX
        cost: 3
        url: /skills/covert-ops#conceal
        localized:
        - en:
            name: Conceal
            description: "This specialty skill represents the ability to hide objects from view or sensors. While **Stealth** is used to hide oneself, **Conceal** is used to hide items, such as weapons on one's person, contraband in a vehicle, or a secret compartment in a room.\n\n### Results\n\nThe degree of success on a Conceal check provides a penalty to an observer's Awareness-perception or Investigate-search check to find the hidden object:\n- **Ordinary:** +1 penalty to observer\n- **Good:** +2 penalty to observer\n- **Amazing:** +3 penalty to observer\n\n### Hiding Weapons\n\nA concealed weapon is worn in a place not normally searched or not subject to easy spotting (the small of the back, inside of the forearm, etc.). The concealed weapon must be either a small handgun or a blade. Concealment provides a +2 penalty to all but the most intrusive searches.\n\n---"
        - es:
            name: Ocultar
            description: "Esta especialización representa la habilidad de esconder objetos de la vista o de los sensores. Mientras que **Sigilo** se usa para esconderse a uno mismo, **Ocultar** se usa para esconder objetos, como armas en el cuerpo, contrabando en un vehículo o un compartimento secreto en una habitación.\n\n### Resultados\nEl grado de éxito en una tirada de Ocultar proporciona una penalización a la tirada de Percepción-percepción o Investigación-búsqueda de un observador para encontrar el objeto oculto:\n- **Ordinario:** +1 de penalización para el observador\n- **Bueno:** +2 de penalización para el observador\n- **Asombroso:** +3 de penalización para el observador\n\n### Ocultar Armas\nUn arma oculta se lleva en un lugar que normalmente no se registra o que no es fácil de detectar (la parte baja de la espalda, el interior del antebrazo, etc.). El arma oculta debe ser una pistola pequeña o una hoja. La ocultación proporciona una penalización de +2 a todas las búsquedas, excepto\
              \ a las más intrusivas.\n\n---"
      disguise:
        attribute: CHA
        cost: 3
        url: /skills/covert-ops#disguise
        localized:
        - en:
            name: Disguise
            description: "Disguise is the ability to change your appearance to look like someone else or to blend into a crowd.\n\nWhile the **Entertainment-act** skill is used for professional makeup and performance, this specialty covers more immediate and practical applications of disguise, such as changing clothes, wearing a wig, or using simple props to avoid recognition.\n\nA character's Disguise situation die is modified by the observer's Awareness-perception modifier.\n\n---"
        - es:
            name: Disfraz
            description: "Disfraz es la habilidad de cambiar tu apariencia para parecerte a otra persona o para mezclarte CON la multitud.\n\nMientras que la habilidad de **Entretenimiento-actuar** se usa para el maquillaje y la actuación profesional, esta especialización cubre aplicaciones más inmediatas y prácticas del disfraz, como cambiarse de ropa, usar una peluca o usar accesorios simples para evitar ser reconocido.\n\nEl dado de situación de Disfraz de un personaje se modifica por el modificador de Percepción-percepción del observador.\n\n---"
      pickpocket:
        attribute: DEX
        cost: 3
        url: /skills/covert-ops#pickpocket
        localized:
        - en:
            name: Pickpocket
            description: "This specialty skill allows a character to remove objects from a person (or plant something) without that person noticing. The base situation die is determined by the target's Will resistance modifier.\n\n### Pickpocket Situation Modifiers\n\n| Condition | Modifier |\n| :--- | :--- |\n| Object is in direct contact with target's skin | +3 |\n| Object is heavy | +2 |\n| Object is kept in inner pocket of garment | +1 |\n| Object is light in weight | -1 |\n| Object is kept in exposed pocket or pack | -1 |\n| Victim is distracted | -1 to -3 |\n\n### Results\n\n- **Failure/Critical Failure:** The attempt fails and the pickpocketer is noticed.\n- **Ordinary:** The attempt succeeds.\n- **Good/Amazing:** The attempt succeeds and may offset penalties for repeated attempts against the same target.\n\n### Rank Benefits\n\n- **Rank 3, 6, 9, 12 [It Takes One to Know One]:** The character's Will resistance modifier (only for spotting a pickpocket attempt) improves by +1 penalty\
              \ to the foe's attempt at rank 3, +2 steps at rank 6, +3 steps at rank 9, and +4 steps at rank 12.\n\n---"
        - es:
            name: Abrir Cerraduras
            description: "Esta especialización permite a un personaje abrir cerraduras físicas (puertas, cajas fuertes, vehículos, etc.). Generalmente se emplea CON herramientas que proporcionan una bonificación al dado de situación.\n\nLa habilidad de abrir cerraduras es inútil contra una cerradura asistida por computadora a menos que tenga un mecanismo físico que el personaje pueda manipular. Casi siempre, el uso de abrir cerraduras requiere una tirada de habilidad compleja.\n\n---"
      stealth:
        attribute: DEX
        cost: 3
        url: /skills/covert-ops#stealth
        localized:
        - en:
            name: Stealth
            description: "This specialty (also known as Unified Stealth) merges the techniques of hide, sneak, and shadow into a single field of expertise. It is the art of remaining undetected while stationary or in motion.\n\n### Hide (Stationary)\n\nAbility to stay unnoticed by keeping quiet and still using cover or darkness.\n\n- **Results:** Degree of success gives observer penalty: Ordinary (+1), Good (+2), Amazing (+3).\n\n### Sneak (In Motion)\n\nAbility to move silently (up to one-half walk rate).\n\n- **Surprise:** If successful adjacent to an opponent, receive attack bonus: Ordinary (-1), Good (-2), Amazing (-3).\n\n### Shadow (Following)\n\nAbility to follow a target without being noticed. Modified by target's Will resistance modifier and detected by Awareness-intuition."
        - es:
            name: Carterear
            description: "Esta especialización permite a un personaje quitar objetos de una persona (o colocar algo) sin que esa persona se dé cuenta. El dado de situación base se determina por el modificador de resistencia de Voluntad del objetivo.\n\n### Resultados\n- **Fracaso/Fallo Crítico:** El intento falla y el carterista es descubierto.\n- **Ordinario:** El intento tiene éxito.\n- **Bueno/Asombroso:** El intento tiene éxito y puede compensar las penalizaciones por intentos repetidos contra el mismo objetivo.\n\n### Beneficios de Rango\n- **Rango 3, 6, 9, 12 [Ladrón que roba a ladrón]:** El modificador de resistencia de Voluntad del personaje (solo para detectar un intento de carterear) mejora en +1 de penalización al intento del enemigo en el rango 3, +2 pasos en el rango 6, +3 pasos en el rango 9 y +4 pasos en el rango 12.\n\n---"
  creativity:
    attribute: WIL
    cost: 6
    category: Other
    url: /skills/creativity
    localized:
    - en:
        name: Creativity
        description: "This skill provides a character with training and talent (or knowledge) in a variety of creative endeavors. A character with the Creativity skill has a well-developed sense for the aesthetically pleasing, a facility for communicating with the written word, and the ability to convey and evoke powerful emotions through a chosen medium.\n\nA character with just the broad skill possesses all of these characteristics, but not to such a degree that he’s able to make a living as an artist, writer, or photographer. Turning the Creativity skill into the basis of a career (or being able to produce work of professional quality, if a character has another career) requires that the character pursue a specialty skill in his chosen field(s).\n\nUsing the Creativity skill involves a complex skill check, with a situation modifier based on the conditions under which the work is being done and a number of successes required related to the complexity of the task at hand. (Dashing off a\
          \ cute, four-line poem might be merely an Ordinary accomplishment, but composing a lyrical, Shakespearean-quality sonnet would be Amazing.)\n\nIf the complex skill check ends in a Critical Failure, or three Failure results are obtained before the check is completed, whatever the character was trying to produce is scrapped (it just wasn't turning out right).\n\n---"
    - es:
        name: Creatividad
        description: "Esta habilidad general proporciona a un personaje entrenamiento y talento (o conocimiento) en empeños creativos.\n\n### Resultados de Creatividad\nUsar esta habilidad implica una tirada de habilidad compleja. El modificador de situación depende de las condiciones, y la complejidad se relaciona con la tarea (por ejemplo, un poema simple frente a un soneto shakesperiano).\n- **Complejidad:** Ordinaria: tarea sencilla; Asombrosa: tarea de calidad/dificultad extrema.\n- **Resultados:** Un Fallo Crítico o tres resultados de Fallo significan que el trabajo se desecha."
    items:
      creativity-specific-skill:
        attribute: WIL
        cost: 3
        url: /skills/creativity#creativity-specific-skill
        localized:
        - en:
            name: Creativity, Specific Skill
            description: "A blank line is provided under the Creativity skill on the character sheet for a player to use if his character specializes in some aspect of this skill. The Gamemaster will determine if a certain specialty skill is allowable, usually based on whether it defines a narrow enough field of interest. For instance, illustration might be allowed as a Creativity specialty, or it might be necessary for a character to be more specific by singling out computer graphics or holo art as his area of expertise."
        - es:
            name: Habilidades de Especialidad
            description: "{{% list %}}\n- **Escritura:** Facilidad para comunicarse con la palabra escrita.\n- **Expresión Artística:** Talento para un medio artístico elegido.\n- **Creatividad, Habilidad Específica:** Un aspecto específico de esta habilidad, como gráficos por computadora o arte holográfico."
  culture:
    attribute: PER
    cost: 5
    category: Social
    url: /skills/culture
    localized:
    - en:
        name: Culture
        description: "This broad skill represents a character's ability to understand and interact with cultures that are different from his own. Areas of knowledge covered by the skill include the customs, philosophy, and way of life of a particular culture, as well as a basic familiarity with major historical figures, events, and trends important to that culture.\n\nIn the use of the broad skill, a character applies what he knows about cultural trends and studies to make an educated guess about how to interact with a member of another culture. The broad skill provides at least a working knowledge of what to do when dealing with any alien culture.\n\nWhen Culture or any of its specialty skills is used in an interactive context with one or more other characters, it is considered an encounter skill (see the sidebar). A Critical Failure result on a skill check indicates that the character has thoroughly insulted the individual or group he's trying to deal with. Other skill check results change\
          \ the target's attitude as shown on **TABLE P25: ENCOUNTER SKILL EFFECTS**. The greater the degree of success, the more endearing and flattering the character appears to the member(s) of the culture he's dealing with.\n\nThe complexity of the ideas that are being communicated during a use of the Culture skill (or the use of one of its specialty skills) may provide a modifier to the skill check:\n\n▶ Simple concepts—basic messages such as exchanging names, conveying friendly intentions, and offering help—give a -1 bonus to the skill check.\n\n▶ Everyday concepts—information that is somewhat more difficult to convey, such as explaining one's place of origin or occupation—provide no modifier.\n\n▶ Complex concepts—describing what the character expects to gain from this contact, or conveying a threat or an opportunity that the character wants to make known—provide a penalty of at least +1 and possibly more, if the Gamemaster rules that the concept being conveyed is exceedingly complicated\
          \ or esoteric.\n\n### Culture Situation Modifiers\n\n| Condition | Modifier |\n| :--- | :--- |\n| Simple concepts | -1 |\n| Everyday concepts | 0 |\n| Complex concepts | +1 |\n| Etiquette ranks 3-5 | -1 |\n| Etiquette ranks 6-8 | -2 |\n| Etiquette ranks 9-11 | -3 |\n| Etiquette rank 12 | -4 |\n\n---"
    - es:
        name: Cultura
        description: "Esta habilidad general representa la capacidad de un personaje para comprender e interactuar CON culturas diferentes a la suya. Abarca costumbres, filosofía y figuras históricas importantes.\n\nCuando se utiliza en un contexto interactivo, Cultura es una habilidad de encuentro.\n\n### Complejidad del Concepto\n- **Simple (nombres, ayuda):** bonificación de -1\n- **Cotidiano (origen, ocupación):** sin modificador\n- **Complejo (amenazas, ideas esotéricas):** penalización de +1 o más"
    items:
      etiquette:
        attribute: PER
        cost: 3
        url: /skills/culture#etiquette
        localized:
        - en:
            name: Etiquette
            description: ''
        - es:
            name: First Encounter
            description: "This Especialidad represents a Personaje's training in the theories and protocols of making first contact with a previously unknown Cultura. With this skill, a Personaje can assess the Mental, Físico, and technological capabilities of an unfamiliar species, begin the process of establishing communications and learning each Otros's language, and make a preliminary study of the strangers' cultural and societal habits.\n\nA first encounter skill check is always a complex chore, and may take days, weeks, or even months to successfully complete. The Gamemaster will assign the number of successes necessary to complete the skill check based on the extent of difference between the two cultures involved. Also, the Gamemaster will determine the initial attitude of the target creature(s) toward the Personaje, and may inform the Personaje of changes in that attitude that take place while the complex skill check is under way.\n\nUpon the successful completion of the first encounter\
              \ skill check, the Personaje immediately gains rank 1 in the Knowledge—language and Cultura—Etiqueta skills that relate to the formerly unknown Cultura."
      diplomacy:
        attribute: PER
        cost: 3
        url: /skills/culture#diplomacy
        localized:
        - en:
            name: Diplomacy
            description: "This specialty skill allows a character to improve his ability to reach agreements and understandings with representatives of different nations, cultures, subcultures and species.\n\nIn general, diplomacy will come into play when a character wants to reach an accord with a member of a different culture. The skill can only be used on a particular target if the character has at least rank 1 in the specific Culture—etiquette skill that pertains to the target's culture.\n\nInteraction and its specialty skills are usually used for interpersonal dealings between members of the same culture, but the Gamemaster may decide that Culture—diplomacy is also useful in such cases. (If so, it's not necessary for a character to have the etiquette skill that pertains to his or her culture in order to use diplomacy on other members of that culture.)\n\nDepending on the nature of the issue to be resolved, the diplomacy skill check may be a single dice roll, or it may be a complex skill\
              \ check requiring an extended period of time to complete.\n\n---"
        - es:
            name: Etiqueta
            description: ''
      first-encounter:
        attribute: PER
        cost: 3
        url: /skills/culture#first-encounter
        localized:
        - en:
            name: First Encounter
            description: "This specialty skill represents a character's training in the theories and protocols of making first contact with a previously unknown culture. With this skill, a character can assess the mental, physical, and technological capabilities of an unfamiliar species, begin the process of establishing communications and learning each other's language, and make a preliminary study of the strangers' cultural and societal habits.\n\nA first encounter skill check is always a complex chore, and may take days, weeks, or even months to successfully complete. The Gamemaster will assign the number of successes necessary to complete the skill check based on the extent of difference between the two cultures involved. Also, the Gamemaster will determine the initial attitude of the target creature(s) toward the character, and may inform the character of changes in that attitude that take place while the complex skill check is under way.\n\nUpon the successful completion of the first\
              \ encounter skill check, the character immediately gains rank 1 in the Knowledge—language and Culture—etiquette skills that relate to the formerly unknown culture."
        - es:
            name: First Encounter
            description: "This specialty skill represents a character's training in the theories and protocols of making first contact with a previously unknown culture. With this skill, a character can assess the mental, physical, and technological capabilities of an unfamiliar species, begin the process of establishing communications and learning each other's language, and make a preliminary study of the strangers' cultural and societal habits.\n\nA first encounter skill check is always a complex chore, and may take days, weeks, or even months to successfully complete. The Gamemaster will assign the number of successes necessary to complete the skill check based on the extent of difference between the two cultures involved. Also, the Gamemaster will determine the initial attitude of the target creature(s) toward the character, and may inform the character of changes in that attitude that take place while the complex skill check is under way.\n\nUpon the successful completion of the first\
              \ encounter skill check, the character immediately gains rank 1 in the Knowledge—language and Culture—etiquette skills that relate to the formerly unknown culture."
  deception:
    attribute: PER
    cost: 5
    category: Social
    url: /skills/deception
    localized:
    - en:
        name: Deception
        description: "This broad skill represents a character's proficiency at deceiving others through conversation and face-to-face interaction. Whether a character tries to bluff his way out of trouble, bribe a suspicious official, fast-talk dim-witted thugs into confusion, or gamble his way into a small fortune, this broad skill covers all verbal tricks and subterfuges.\n\nAlthough the use of Deception or any of its specialty skills can affect the attitude of someone who is victimized by the skill, this shift in attitude is not necessarily long-lasting. Sometimes even the slightest change in a situation will spoil a character's ruse, or perhaps require another skill check to see if he succeeds in perpetuating his trickery.\n\nA character's Deception situation die is modified by his target's Intelligence resistance modifier. In addition, the Gamemaster may award bonuses or penalties depending on past dealings or other details that may come into play. The greater the level of success the\
          \ character achieves, the more convincing his deception appears to be.\n\n---"
    - es:
        name: Engaño
        description: "Esta habilidad general representa la competencia de un personaje para engañar a otros mediante la conversación y la interacción. Abarca todos los trucos y subterfugios verbales, pero los cambios de actitud provocados por esta habilidad no son necesariamente duraderos.\n\nEl dado de situación de un personaje se ve modificado por el modificador de resistencia de Inteligencia del objetivo."
    items:
      bluff:
        attribute: PER
        cost: 3
        url: /skills/deception#bluff
        localized:
        - en:
            name: Bluff
            description: "This specialty skill represents a talent for misleading or deceiving through false bravado or outright lies, or deterring a character by displaying extreme (and probably unwarranted) confidence.\n\nBluff is used to determine the result of a character's trick, con, or bold-faced lie. No matter what other props a character may use in a bluff attempt, the most important component is the character's attitude and verbal interaction. This is the ability to make another character believe something that isn't true.\n\nOn a **Critical Failure**, the bluff is seen for what it is, and the target becomes Hostile or Combative. On a **Failure**, instead of having a positive effect, the character's patter is considered to be annoying and condescending. On an **Ordinary** success, the bluff works for the immediate scene, although no change in attitude occurs in the affected character(s). On a **Good** result, the target's attitude toward the bluffer improves by one grade (Neutral\
              \ to Friendly, Friendly to Charmed, etc.) for d8+1 time units before he figures out that he was tricked. On an **Amazing** success, the target's attitude improves by two grades for d12+2 time units before he figures out that he was tricked.\n\n---"
        - es:
            name: Mentir
            description: "{{% list %}}\n- **Mentir:** Talento para despistar o engañar mediante una falsa bravuconería o mentiras descaradas.\n- **Sobornar:** Ofrecer dinero, bienes, información o servicios para obtener lo que se desea.\n- **Apostar:** Competencia en varios juegos de azar."
      bribe:
        attribute: PER
        cost: 3
        url: /skills/deception#bribe
        localized:
        - en:
            name: Bribe
            description: "Whenever a character wants to offer another character money, goods, information, or services to get that character to do what the character wants, a bribe check is called for.\n\nOn a **Critical Failure**, not only is the bribe refused, but the target becomes Hostile or even Combative. In all cases, there's no way he's going to accept the bribe.\n\nA **Failure** result means that the bribe is refused, and if the character wants to try again he must raise the value of the bribe being offered. Each subsequent Failure result adds to the size of the bribe until the character either rolls a Critical Failure (with effects as described above) or achieves some degree of success.\n\nAn **Ordinary** success indicates that the bribe is accepted, but the attitude of the target is unchanged—a Hostile guard will accept your money and let you pass, but if he sees you again he'll still be Hostile.\n\nOn a **Good** success, the bribe is accepted, and the target's attitude improves\
              \ by one grade for 2d6 hours or until the character does something to change the relationship. (Bought friendships only last until the money runs out and usually require a steady flow of cash or favors.)\n\nOn an **Amazing** result, the bribe is accepted, and the target's attitude improves by two grades for 4d6 hours or until the character does something to change the relationship.\n\n---"
        - es:
            name: Soborno
            description: "Whenever a Personaje wants to offer another Personaje money, goods, information, or services to get that Personaje to do what the Personaje wants, a Soborno check is called for.\n\nOn a **Fallo Crítico**, not only is the Soborno refused, but the target becomes Hostile or even Combative. In all cases, there's no way he's going to accept the Soborno.\n\nA **Failure** result means that the Soborno is refused, and if the Personaje wants to try again he must raise the value of the Soborno being offered. Each subsequent Failure result adds to the size of the Soborno until the Personaje either rolls a Fallo Crítico (with effects as described above) or achieves some degree of success.\n\nAn **Ordinario** success indicates that the Soborno is accepted, but the attitude of the target is unchanged—a Hostile guard will accept your money and let you pass, but if he sees you again he'll still be Hostile.\n\nOn a **Bueno** success, the Soborno is accepted, and the target's attitude\
              \ improves by one grade for 2d6 hours or until the Personaje does something to change the relationship. (Bought friendships only last until the money runs out and usually require a steady flow of cash or favors.)\n\nOn an **Asombroso** result, the Soborno is accepted, and the target's attitude improves by two grades for 4d6 hours or until the Personaje does something to change the relationship.\n\n---"
      gamble:
        attribute: PER
        cost: 4
        url: /skills/deception#gamble
        localized:
        - en:
            name: Gamble
            description: "This specialty skill represents a character's proficiency at various games of chance. With each purchase of the specialty skill, the player selects a different game (subject to the approval of the Gamemaster) for his character to be skilled in.\n\nWith a successful gamble check, a character can estimate the odds, determine if a particular game has been rigged, count cards, spot a cheater or another skilled gambler, and increase his own odds of winning.\n\nA gambler can improve his odds of winning either by playing skillfully and honestly—or by cheating. If a character plays honestly, the winner in a gambling contest is the one who achieves the highest success level, with each tie representing an increase in the stakes. A gambler's skill check is made with a **-2 bonus** if he is playing against an **untrained opponent** (someone who does not have the Deception broad skill), with **no modifier** if playing against a **trained opponent** (someone who has Deception\
              \ and perhaps also gamble, but at the same or a lower rank), or with a **+2 penalty** if playing against a **trained opponent of a higher skill rank**.\n\nIf a character decides to cheat, different modifiers apply: a **-3 bonus** if playing against an **untrained opponent**, a **+1 penalty** if playing against a **trained opponent**, and a **+3 penalty** if playing against a **trained opponent of a higher skill rank**. Payoffs are better, however, depending on the check result that ends the contest:\n\nOn any **Critical Failure**, the character is caught cheating. On a **Marginal** success, he wins the pot; on an **Ordinary** success, he wins the pot plus a side bet equal to half of the pot; On a **Good**, he wins the pot plus a side bet of an equal amount; **Amazing**, he wins the pot plus a side bet of twice that amount.\n\nAs an option, you may use the \"Character vs. Character\" rules on page 63 to determine the outcome when characters gamble against one another. In this\
              \ case, however, the size of the pot is agreed upon before any dice are rolled."
        - es:
            name: Juego
            description: "This Especialidad represents a Personaje's proficiency at various games of chance. With each purchase of the Especialidad, the player selects a different game (subject to the approval of the Gamemaster) for his Personaje to be skilled in.\n\nWith a successful Juego check, a Personaje can estimate the odds, determine if a particular game has been rigged, count cards, spot a cheater or another skilled gambler, and increase his own odds of winning.\n\nA gambler can improve his odds of winning either by playing skillfully and honestly—or by cheating. If a Personaje plays honestly, the winner in a gambling contest is the one who achieves the highest success level, with each tie representing an increase in the stakes. A gambler's skill check is made with a **-2 bonus** if he is playing against an **untrained opponent** (someone who does not have the Engaño broad skill), with **no modifier** if playing against a **trained opponent** (someone who has Engaño and perhaps\
              \ also Juego, but at the same or a lower rank), or with a **+2 penalty** if playing against a **trained opponent of a higher skill rank**.\n\nIf a Personaje decides to cheat, different modifiers apply: a **-3 bonus** if playing against an **untrained opponent**, a **+1 penalty** if playing against a **trained opponent**, and a **+3 penalty** if playing against a **trained opponent of a higher skill rank**. Payoffs are better, however, depending on the check result that ends the contest:\n\nOn any **Fallo Crítico**, the Personaje is caught cheating. On a **Marginal** success, he wins the pot; on an **Ordinario** success, he wins the pot plus a side bet equal to half of the pot; On a **Bueno**, he wins the pot plus a side bet of an equal amount; **Asombroso**, he wins the pot plus a side bet of twice that amount.\n\nAs an option, you may use the \"Personaje vs. Personaje\" rules on page 63 to determine the outcome when characters Juego against one another. In this case, however,\
              \ the size of the pot is agreed upon before any dice are rolled."
  demolitions:
    attribute: INT
    cost: 6
    category: Technical
    url: /skills/demolitions
    localized:
    - en:
        name: Demolitions
        description: "This broad skill provides a character with training in the basics of setting explosive charges to demolish a specific target. A skilled character has a working knowledge of handling explosives, using primers and timing devices, and placing charges for maximum effect.\n\nPrepared charges come in several forms—satchel bombs, mines, and objects using plastic explosive, to name some typical ones. A prepared charge inflicts a specific type and amount of damage on objects within its explosive radius, as detailed in “Prepared Explosives” on page 180 in Chapter 11: Weapons & Armor.\n\nSetting a prepared charge can be a simple activity, requiring only one skill check if a character merely wants to place an explosive in a readily accessible area. A Failure result on this skill check means the device is a dud and won't explode as planned. (This is a case when the Gamemaster might elect to roll a skill check secretly, to prevent a player from knowing something that his character\
          \ would not have found out.) A Critical Failure result could mean that the device explodes prematurely, depending on the type of explosive being used.\n\nIf a character wants to set a charge so that it won't be easily discovered, a complex skill check (see page 62) is necessary. The complexity of that check (how many successes are needed) is related to how well the character wants the device to be hidden: If he attempts and succeeds at a task of Marginal complexity, the explosive charge is hidden well enough that any opponents' Awareness checks to spot the device are made at a +1 penalty. That penalty increases for each succeeding level of complexity, up to a +4 penalty at the Amazing level.\n\nIn addition, completing a complex skill check of Good complexity indicates that the charge has been set in a spot that's not only well concealed but vulnerable—when the explosive is detonated, it causes damage of one grade better than normal (Ordinary damage becomes Good damage, for example).\
          \ For a successful complex skill check of Amazing complexity, the damage done by the blast improves by two grades (from Ordinary to Amazing). More information about grades of damage appears on page 174 in Chapter 11: Weapons & Armor and also in the Gamemaster Guide.\n\n---"
    - es:
        name: Demoliciones
        description: "Esta habilidad general proporciona a un personaje entrenamiento en los conceptos básicos de la colocación de cargas explosivas para demoler un objetivo específico. Un personaje hábil tiene un conocimiento práctico del manejo de explosivos, el uso de cebos y dispositivos de temporización, y la colocación de cargas para obtener el máximo efecto.\n\nLas cargas preparadas vienen en varias formas: bombas de cartera, minas y objetos que usan explosivo plástico, por nombrar algunas típicas. Una carga preparada inflige un tipo y una cantidad específicos de daño a los objetos dentro de su radio de explosión, como se detalla en \"Explosivos Preparados\" en la página 180 del Capítulo 11: Armas y Armaduras.\n\nColocar una carga preparada puede ser una actividad simple, que requiere solo una tirada de habilidad si un personaje simplemente quiere colocar un explosivo en un área de fácil acceso. Un resultado de Fracaso en esta tirada de habilidad significa que el dispositivo es un\
          \ fracaso y no explotará como estaba previsto. (Este es un caso en el que el Director de Juego puede optar por tirar una tirada de habilidad en secreto, para evitar que un jugador sepa algo que su personaje no habría descubierto). Un resultado de Fallo Crítico podría significar que el dispositivo explota prematuramente, dependiendo del tipo de explosivo que se esté utilizando.\n\nSi un personaje quiere colocar una carga para que no sea descubierta fácilmente, es necesaria una tirada de habilidad compleja (ver página 62). La complejidad de esa tirada (cuántos éxitos se necesitan) está relacionada CON qué tan bien el personaje quiere que se oculte el dispositivo: si intenta y tiene éxito en una tarea de complejidad Marginal, la carga explosiva está lo suficientemente bien escondida como para que cualquier tirada de Percepción de los oponentes para detectar el dispositivo se realice CON una penalización de +1. Esa penalización aumenta por cada nivel de complejidad sucesivo, hasta\
          \ una penalización de +4 en el nivel [Asombroso].\n\nAdemás, completar una tirada de habilidad compleja de complejidad [Buena] indica que la carga se ha colocado en un lugar que no solo está bien oculto sino que también es vulnerable; cuando se detona el explosivo, causa un daño de un grado mejor de lo normal (el daño [Ordinario] se convierte en daño [Bueno], por ejemplo). Para una tirada de habilidad compleja exitosa de complejidad [Asombrosa], el daño causado por la explosión mejora en dos grados (de [Ordinario] a [Asombroso]). Más información sobre los grados de daño aparece en la página 174 del Capítulo 11: Armas y Armaduras y también en la Guía del Director de Juego.\n\n---"
    items:
      disarm:
        attribute: INT
        cost: 4
        url: /skills/demolitions#disarm
        localized:
        - en:
            name: Disarm
            description: "The disarm skill lets a character attempt to render bombs, mines, and other demolition packages inoperative before they explode. A character does not need to make a skill check to disarm his own work or any common explosives. A skill check is required when time is of the essence, if the explosive is of unusual make, or if it has been rigged with security devices or booby traps. Except in the very simplest of cases, a complex skill check (see page 62) is involved.\n\n---"
        - es:
            name: Desarmar
            description: "La habilidad de desarmar le permite a un personaje intentar inutilizar bombas, minas y otros paquetes de demolición antes de que exploten. Un personaje no necesita hacer una tirada de habilidad para desarmar su propio trabajo o cualquier explosivo común. Se requiere una tirada de habilidad cuando el tiempo es esencial, si el explosivo es de fabricación inusual o si ha sido manipulado CON dispositivos de seguridad o trampas explosivas. Excepto en los casos más simples, se trata de una tirada de habilidad compleja (ver página 62).\n\n---"
      scratch-built-explosives:
        attribute: INT
        cost: 3
        url: /skills/demolitions#scratch-built-explosives
        localized:
        - en:
            name: Scratch-Built Explosives
            description: "This skill lets a character attempt to build a demolition package from scratch, or tamper with military ordnance such as a mortar shell to make it usable as a demolition charge. The use of the skill assumes that the character has the proper materials and tools on hand; the skill check receives a +2 penalty if the character is forced to use common items (such as things found around a house).\n\nMaking a scratch-built explosive device takes some time—at least a few minutes and perhaps as long as several hours, depending on the working conditions and the amount of time a character wants to invest in the process. When the maker of a device declares his job to be finished, the Gamemaster will assign a situation die modifier to the upcoming skill check, ranging from a substantial bonus if the character spent a lot of time on the job to a sizable penalty if the job was done in extreme haste.\n\nA skill check is then made to determine the degree of success, which is directly\
              \ related to the potency of the charge. **TABLE P23** lists the three types of scratch-built explosive devices and the amount of damage each one causes. On a Critical Failure, the bomb explodes right at the end of the creation process, injuring the maker. A skill check result of Ordinary, Good, or Amazing also defines the complexity of the explosive for any subsequent disarm checks by other characters. (The character who built a device can always disarm it without needing a skill check.)\n\n### TABLE P23: SCRATCH-BUILT EXPLOSIVES\n\n| Skill Check Result | Concussive | Type of Device: Fragmentation | Incendiary |\n| :--- | :--- | :--- | :--- |\n| **Crit. Failure** | d4w | Dud | Dud |\n| **Failure** | Dud | d4+3m | d6+2w |\n| **Ordinary** | d6+2s | Dud | Dud |\n| **Good** | d8+2s | d4+2w | d4w |\n| **Amazing** | d4w | d6+3w | d4+2w |\n| | | d4+3m | d6+2w |\n\n---"
        - es:
            name: Explosivos improvisados
            description: "Esta habilidad no se puede usar sin entrenamiento. Esta habilidad le permite a un personaje intentar construir un paquete de demolición desde cero, o manipular municiones militares como un proyectil de mortero para que sea utilizable como una carga de demolición. El uso de la habilidad supone que el personaje tiene los materiales y herramientas adecuados a mano; la tirada de habilidad recibe una penalización de +2 si el personaje se ve obligado a usar artículos comunes (como cosas que se encuentran en una casa).\n\nHacer un dispositivo explosivo improvisado lleva algo de tiempo, al menos unos minutos y quizás hasta varias horas, dependiendo de las condiciones de trabajo y la cantidad de tiempo que un personaje quiera invertir en el proceso. Cuando el fabricante de un dispositivo declara que su trabajo está terminado, el Director de Juego asignará un modificador de dado de situación a la próxima tirada de habilidad, que va desde una bonificación sustancial si el\
              \ personaje pasó mucho tiempo en el trabajo hasta una penalización considerable si el trabajo se hizo CON extrema prisa.\n\nLuego se realiza una tirada de habilidad para determinar el grado de éxito, que está directamente relacionado CON la potencia de la carga. La Tabla P23 enumera los tres tipos de dispositivos explosivos improvisados y la cantidad de daño que causa cada uno. CON un Fallo Crítico, la bomba explota justo al final del proceso de creación, hiriendo al fabricante. Un resultado de tirada de habilidad de [Ordinario], [Bueno] o [Asombroso] también define la complejidad del explosivo para cualquier tirada de desarmado posterior por parte de otros personajes. (El personaje que construyó un dispositivo siempre puede desarmarlo sin necesidad de una tirada de habilidad).\n\n---"
      set-explosives:
        attribute: INT
        cost: 3
        url: /skills/demolitions#set-explosives
        localized:
        - en:
            name: Set explosives
            description: "This specialty skill allows a character to improve his ability to set manufactured explosive charges. See the description of the Demolitions broad skill for information on how this skill is employed."
        - es:
            name: Colocar Explosivos
            description: "Esta especialización permite a un personaje mejorar su habilidad para colocar cargas explosivas fabricadas. Consulte la descripción de la habilidad general de Demoliciones para obtener información sobre cómo se emplea esta habilidad."
  entertainment:
    attribute: PER
    cost: 4
    category: Other
    url: /skills/entertainment
    localized:
    - en:
        name: Entertainment
        description: "This broad skill represents a character's proficiency in the performing arts. A character with this skill is competent enough to perform amateur theater or play at the equivalent of a high school dance, while the specialty skills allow a character to become a first-rate performer—or even a star.\n\nTechnical knowledge and training are an important part of this skill, but it also represents a character's stage or screen presence, his magnetism in front of an audience, and his ability to play to that audience and elicit an emotional response. Skill checks are modified by the target's Will resistance modifier if the character tries to fool or alter the emotions of his audience by entertaining them; or by the target's Personality resistance modifier if he tries to impress or otherwise alter attitudes toward him.\n\nMany forms of performance entertainment exist, such as acting, dancing, singing, and playing a musical instrument. Other specialty skills that may be selected\
          \ under this broad skill (with the Gamemaster's permission) include stand-up comedy, juggling, and ventriloquism.\n\nThe greater the level of success the character achieves, the more powerful his performance (the better the improvement in the audience's attitude). A Critical Failure indicates some bit of bad luck has occurred—a microphone or speaker goes out, a set collapses, an instrument breaks, and so forth.\n\nAs with other similar uses of encounter skills, the beginning attitude of an audience toward a performer is either Hostile (inclined not to like the act the entertainer does, or inclined not to like the entertainer himself), Neutral (unfamiliar with the entertainer), or Friendly (containing several members who are avid fans of the entertainer). In addition to any modifier for the audience's attitude (see **TABLE P25: ENCOUNTER SKILL EFFECTS**), other factors can affect an Entertainment skill check. For instance:\n\n- An entertainer who is simply trying to show his audience\
          \ a good time and not necessarily turn them into fans receives a -1 bonus.\n- An entertainer who is out to make a name for himself, to impress the audience at the risk of alienating some of its members, receives a +1 penalty.\n- An entertainer who has an ulterior motive, who is trying to stun, shock, or divert the attention of the audience from some other occurrence, receives a +3 penalty.\n\n### Entertainment Skill Rank Benefit\n\n⊗ **Enhance Another Skill:** Entertainment specialty skills can be combined with certain other skills for greater effect. The higher a character's skill rank in the Entertainment skill, the better his chance of succeeding at using another skill in combination: At rank 1, he receives a **-1 bonus** to the check for the other skill; at rank 4 the bonus is **-2**; at rank 8 the bonus is **-3**; and at rank 12 the bonus is **-4**.\n\nPossible combinations of skills to which this benefit could apply include act or dance with Interaction—seduce; dance with\
          \ **Covert Ops—pickpocket** or Acrobatics; sing with Interaction—taunt; and musical instrument with Leadership—inspire. If you have other ideas for how an Entertainment skill can be used in this way, talk them over with your Gamemaster.\n\n---"
    - es:
        name: Entretenimiento
        description: "Esta habilidad general representa la competencia de un personaje en las artes escénicas. Los conocimientos técnicos y el entrenamiento son parte de esta habilidad, al igual que la capacidad del personaje para actuar ante un público y provocar una respuesta emocional.\n\nLas tiradas de habilidad se ven modificadas por el modificador de resistencia de Voluntad del objetivo (para alterar las emociones) o por el modificador de resistencia de Personalidad (para impresionar).\n\n### Resultados de Entretenimiento\nCuanto mayor sea el nivel de éxito, más potente será la actuación.\n- **Fallo Crítico:** Ocurre mala suerte (el micrófono se apaga, el decorado se derrumba, etc.)."
    items:
      musical-instrument:
        attribute: PER
        cost: 2
        url: /skills/entertainment#musical-instrument
        localized:
        - en:
            name: Musical instrument
            description: ''
        - es:
            name: Musical instrument
            description: ''
      sing:
        attribute: PER
        cost: 3
        url: /skills/entertainment#sing
        localized:
        - en:
            name: Sing
            description: "Sing represents a talent for carrying a note and singing songs. A character with this skill is a trained vocalist with a strong and melodious voice. The greater a character's skill rank, the greater the caliber and quality of the performance he can give.\n\n#### Entertainment Skill Rank Benefit\n\n⊗ **Enhance Another Skill:** Entertainment specialty skills can be combined with certain other skills for greater effect. The higher a character's skill rank in the Entertainment skill, the better his chance of succeeding at using another skill in combination: At rank 1, he receives a **-1 bonus** to the check for the other skill; at rank 4 the bonus is **-2**; at rank 8 the bonus is **-3**; and at rank 12 the bonus is **-4**.\n\nPossible combinations of skills to which this benefit could apply include act or dance with Interaction—seduce; dance with Covert Ops—pickpocket or Acrobatics; sing with Interaction—taunt; and musical instrument with Leadership—inspire. If you\
              \ have other ideas for how an Entertainment skill can be used in this way, talk them over with your Gamemaster."
        - es:
            name: Dance
            description: "The dance skill represents a talent for moving rhythmically to music by following set steps and gestures or by improvisation. It also covers the Técnico aspects of performance dance, such as choreography and the knowledge of various popular and cultural dance techniques.\n\nDance can be used to entertain, tell a story, or impress an audience. The greater the level of success, the more impressive and inspiring the dance performance—an Asombroso result indicates that the dancer is poetry in motion.\n\n#### Entertainment Skill Rank Benefit\n\n⊗ **Enhance Another Skill:** Entertainment specialty skills can be combined with certain Otros skills for greater effect. The higher a Personaje's skill rank in the Entertainment skill, the better his chance of succeeding at using another skill in combination: At rank 1, he receives a **-1 bonus** to the check for the Otros skill; at rank 4 the bonus is **-2**; at rank 8 the bonus is **-3**; and at rank 12 the bonus is **-4**.\n\
              \nPossible combinations of skills to which this benefit could apply include act or dance with Interacción—seduce; dance with **Covert Ops—pickpocket** or Acrobacia; sing with Interacción—taunt; and musical instrument with Liderazgo—Inspirar. If you have Otros ideas for how an Entertainment skill can be used in this way, talk them over with your Gamemaster.\n\n---"
      act:
        attribute: PER
        cost: 2
        url: /skills/entertainment#act
        localized:
        - en:
            name: Act
            description: "This specialty skill represents a talent for playing a part or assuming a dramatic role. It also covers impersonation and the skills and techniques of the stage and screen.\n\nThe act skill is used to determine the results of a character's dramatic performance or to determine his knowledge or skill with a technical aspect of the stage or screen (such as directing, makeup, or stunts). In most cases, act is used to entertain. Penalties should be applied if an actor attempts a role that requires him to perform outside the controlled conditions of a sound stage.\n\n▶ **Disguise:** When a character achieves rank 4 in the act skill, he becomes able to employ stage and film makeup and techniques to change his appearance or even to look like someone else.\n\nApplying a disguise requires a complex skill check, with the complexity of the check (Ordinary, Good, or Amazing) depending on how effective the character wants his disguise to be. The Gamemaster may assign a situation\
              \ modifier to each segment of the skill check to account for conditions such as the availability of materials and whether the character is able to remain unobserved while he's putting on the disguise.\n\nIf the disguise is applied successfully, other characters who later observe the character receive a penalty to any Awareness—perception skill checks specifically made to determine if they can see through the disguise: a +1 penalty for an Ordinary disguise, +2 for a Good disguise, and +3 for an Amazing disguise.\n\n#### Entertainment Skill Rank Benefit\n\n⊗ **Enhance Another Skill:** Entertainment specialty skills can be combined with certain other skills for greater effect. The higher a character's skill rank in the Entertainment skill, the better his chance of succeeding at using another skill in combination: At rank 1, he receives a **-1 bonus** to the check for the other skill; at rank 4 the bonus is **-2**; at rank 8 the bonus is **-3**; and at rank 12 the bonus is **-4**.\n\
              \nPossible combinations of skills to which this benefit could apply include act or dance with Interaction—seduce; dance with **Covert Ops—pickpocket** or Acrobatics; sing with Interaction—taunt; and musical instrument with Leadership—inspire. If you have other ideas for how an Entertainment skill can be used in this way, talk them over with your Gamemaster.\n\n---"
        - es:
            name: Musical instrument
            description: ''
      dance:
        attribute: PER
        cost: 2
        url: /skills/entertainment#dance
        localized:
        - en:
            name: Dance
            description: "The dance skill represents a talent for moving rhythmically to music by following set steps and gestures or by improvisation. It also covers the technical aspects of performance dance, such as choreography and the knowledge of various popular and cultural dance techniques.\n\nDance can be used to entertain, tell a story, or impress an audience. The greater the level of success, the more impressive and inspiring the dance performance—an Amazing result indicates that the dancer is poetry in motion.\n\n#### Entertainment Skill Rank Benefit\n\n⊗ **Enhance Another Skill:** Entertainment specialty skills can be combined with certain other skills for greater effect. The higher a character's skill rank in the Entertainment skill, the better his chance of succeeding at using another skill in combination: At rank 1, he receives a **-1 bonus** to the check for the other skill; at rank 4 the bonus is **-2**; at rank 8 the bonus is **-3**; and at rank 12 the bonus is **-4**.\n\
              \nPossible combinations of skills to which this benefit could apply include act or dance with Interaction—seduce; dance with **Covert Ops—pickpocket** or Acrobatics; sing with Interaction—taunt; and musical instrument with Leadership—inspire. If you have other ideas for how an Entertainment skill can be used in this way, talk them over with your Gamemaster.\n\n---"
        - es:
            name: Dance
            description: "The dance skill represents a talent for moving rhythmically to music by following set steps and gestures or by improvisation. It also covers the technical aspects of performance dance, such as choreography and the knowledge of various popular and cultural dance techniques.\n\nDance can be used to entertain, tell a story, or impress an audience. The greater the level of success, the more impressive and inspiring the dance performance—an Amazing result indicates that the dancer is poetry in motion.\n\n#### Entertainment Skill Rank Benefit\n\n⊗ **Enhance Another Skill:** Entertainment specialty skills can be combined with certain other skills for greater effect. The higher a character's skill rank in the Entertainment skill, the better his chance of succeeding at using another skill in combination: At rank 1, he receives a **-1 bonus** to the check for the other skill; at rank 4 the bonus is **-2**; at rank 8 the bonus is **-3**; and at rank 12 the bonus is **-4**.\n\
              \nPossible combinations of skills to which this benefit could apply include act or dance with Interaction—seduce; dance with **Covert Ops—pickpocket** or Acrobatics; sing with Interaction—taunt; and musical instrument with Leadership—inspire. If you have other ideas for how an Entertainment skill can be used in this way, talk them over with your Gamemaster.\n\n---"
  heavy-weapons:
    attribute: STR
    cost: 6
    category: Combat
    url: /skills/heavy-weapons
    localized:
    - en:
        name: Heavy Weapons
        description: "This broad skill provides a character with training in the use of heavy weaponry that isn't part of a ship or vehicle, including mortars, grenade and rocket launchers, shoulder-fired missiles, and heavy firearms. Weapons that are part of a large ship or a single-operator vehicle require the use of [System Operation](/skills/system-operation/) or [Vehicle Operation](/skills/vehicle-operation/), respectively. Heavy weapons are listed on [**TABLE P40: HEAVY WEAPONS**](/equipment/weapons/#heavy-weapons).\n\n**Weapon Technical Knowledge**: Characters who operate heavy weapons — soldiers, combat engineers, and weapons specialists — inevitably absorb a working technical understanding of their ordnance. They learn how propellants, warheads, and firing mechanisms work, what can fail under field conditions, and how to prevent or correct it. As well as keeping informed of what heavy hardware has to offer. A character with the [**Technical Science**](/skills/technical-science/)\
          \ broad skill can use the appropriate Heavy Weapons specialty skill for checks that involve knowing the existence of a particular weapon system, customizing ordnance and munitions, as well as recognizing, repairing, and maintaining heavy weapons in the field.\n\nEach heavy weapon has a set of range figures. Situation die modifiers for range, as shown below on [**TABLE P21: HEAVY WEAPONS RANGE MODIFIERS**](#table-p21-heavy-weapons-range-modifiers), may apply when a certain type of heavy weapon is used against a target or a location that lies within a particular range category.\n\nIn addition, the accuracy of an indirect-fire weapon depends on the range between the shooter and the target location as well as the type of success achieved, as shown on [**TABLE P20: ACCURACY BY RANGE**](/skills/athletics/#accuracy-by-range).\n\nA few direct-fire heavy weapons (as well as some rifles and all submachine guns) are [**automatic weapons**](/skills/modern-ranged-weapons/#automatic-weapon-attack-modes)\
          \ capable of firing multiple rounds of ammunition in every attack.\n\n\n### TABLE P21: HEAVY WEAPONS RANGE MODIFIERS\n\n| Range | Direct | Indirect |\n| :--- | :--- | :--- |\n| **Short** | -1 step | +2 steps |\n| **Medium** | None | -2 steps |\n| **Long** | +1 step | None |\n\n---"
    - es:
        name: Armas pesadas
        description: "Esta habilidad amplia proporciona a un personaje entrenamiento en el uso de armamento pesado que no forma parte de una nave o vehículo, incluyendo morteros, lanzagranadas y lanzacohetes, misiles lanzados desde el hombro y armas de fuego pesadas. Las armas que forman parte de una nave grande o de un vehículo de un solo operador requieren el uso de [Operación de Sistemas](/skills/system-operation/) u [Operación de Vehículos](/skills/vehicle-operation/), respectivamente. Las armas pesadas se enumeran en la [**TABLA P40: ARMAS PESADAS**](/equipment/weapons/#heavy-weapons).\n\n**Conocimiento técnico de armas**: Los personajes que operan armas pesadas — soldados, ingenieros de combate y especialistas en armamento — inevitablemente absorben una comprensión técnica funcional de su armamento. Aprenden cómo funcionan los propelentes, las cabezas de guerra y los mecanismos de disparo, qué puede fallar bajo condiciones de campo y cómo prevenirlo o corregirlo. Así como mantenerse\
          \ informados de lo que el hardware pesado tiene para ofrecer. Un personaje CON la habilidad amplia de [**Ciencia técnica**](/skills/Técnico-science/) puede usar la habilidad de especialidad de Armas pesadas apropiada para las tiradas que impliquen conocer la existencia de un sistema de armas concreto, personalizar armamento y munición, así como reconocer, reparar y mantener armas pesadas en el campo.\n\nCada arma pesada tiene un conjunto de cifras de alcance. Los modificadores de los dados de situación por alcance, como se muestra a continuación en la [**TABLA P21: MODIFICADORES DE DISTANCIA DE ARMAS PESADAS**](#tabla-p21-modificadores-de-distancia-de-armas-pesadas), pueden aplicarse cuando se utiliza un determinado tipo de arma pesada contra un objetivo o una ubicación que se encuentre dentro de una categoría de distancia concreta.\n\nAdemás, la precisión de un arma de fuego indirecto depende de la distancia entre el tirador y la ubicación del objetivo, así como del tipo de éxito\
          \ obtenido, como se muestra en la [**TABLA P20: PRECISIÓN POR DISTANCIA**](/skills/athletics/#accuracy-by-range).\n\nUnas pocas armas pesadas de fuego directo (así como algunos rifles y todos los subfusiles) son [**armas automáticas**](/skills/modern-ranged-weapons/#automatic-weapon-attack-modes) capaces de disparar múltiples rondas de munición en cada ataque.\n\n\n### TABLA P21: MODIFICADORES DE DISTANCIA DE ARMAS PESADAS\n\n| Distancia | Directa | Indirecta |\n| :--- | :--- | :--- |\n| **Corta** | -1 paso | +2 pasos |\n| **Media** | Ninguno | -2 pasos |\n| **Larga** | +1 paso | Ninguno |\n\n---\n\n# Habilidades de especialidad"
    items:
      direct-fire:
        attribute: STR
        cost: 4
        url: /skills/heavy-weapons#direct-fire
        localized:
        - en:
            name: Direct fire
            description: "This specialty skill allows a character to improve his proficiency with direct-fire heavy weapons. These weapons work just like normal firearms, requiring the user to aim them at a target. Direct-fire heavy weapons include heavy-caliber firearms, plasma guns, and raiders.\n\n---"
        - es:
            name: Fuego directo
            description: "Esta habilidad de especialidad permite a un personaje mejorar su competencia CON las armas pesadas de fuego directo. Estas armas funcionan igual que las armas de fuego normales, requiriendo que el usuario las apunte a un objetivo. Las armas pesadas de fuego directo incluyen armas de fuego de gran calibre, cañones de plasma y raiders.\n\n---"
      indirect-fire:
        attribute: STR
        cost: 4
        url: /skills/heavy-weapons#indirect-fire
        localized:
        - en:
            name: Indirect fire
            description: "This specialty skill allows a character to improve his proficiency with indirect-fire heavy weapons. These weapons can fire over or around obstacles; they deliver an area effect attack instead of an attack against a specific target. Indirect-fire heavy weapons include grenade launchers, rocket launchers, shoulder-fired missiles, and mortars."
        - es:
            name: Fuego indirecto
            description: "Esta habilidad de especialidad permite a un personaje mejorar su competencia CON las armas pesadas de fuego indirecto. Estas armas pueden disparar por encima o alrededor de obstáculos; ejecutan un ataque de efecto de área en lugar de un ataque contra un objetivo específico. Las armas pesadas de fuego indirecto incluyen lanzagranadas, lanzacohetes, misiles lanzados desde el hombro y morteros."
  interaction:
    attribute: PER
    cost: 3
    category: Social
    url: /skills/interaction
    localized:
    - en:
        name: Interaction
        description: "Interaction skills are used by characters to directly influence others. These include bargaining, charming, interviewing, intimidating, seducing, and taunting. \n\n### Interaction Situation Modifiers\n| Relation / Condition | Modifier |\n| :--- | :--- |\n| Target is different species | +2 steps |\n| Target is different culture | +2 steps |\n| Strangers | +1 step |\n| Known to each other | 0 |\n| Acquainted | -1 step |\n\nInteraction includes specific areas such as making bargains, knowing how to question, charm, seduce, or intimidate another character, and being able to taunt and trade insults with the best of them. An encounter skill check takes into account the target's starting attitude. Combative or Fanatic characters cannot be influenced by Interaction. The target's **Will resistance modifier** also applies.\n\nIn general, changes in attitude brought about through Interaction are longer-lasting than changes from Deception or Entertainment. Once attitude shifts,\
          \ it remains until the character does something to alter it.\n\n| Results | Description |\n| :--- | :--- |\n| **Ordinary** | Success indicates that the character produced a quality interaction. |\n| **Good** | Success indicates that the character produced a very quality interaction. |\n| **Amazing** | Success indicates that the character produced a masterpiece interaction. |\n\n---"
    - es:
        name: Interacción
        description: "Las habilidades de interacción son utilizadas por los personajes para influir directamente en los demás. Estas incluyen regatear, encantar, entrevistar, intimidar, seducir y provocar.\n\nLos personajes combativos o fanáticos no pueden ser influenciados por Interacción. También se aplican el **modificador de resistencia de Voluntad** del objetivo y otros factores relevantes.\n\n| Resultados | Descripción |\n| :--- | :--- |\n| **Ordinario** | El éxito indica que el personaje produjo una interacción de calidad. |\n| **Bueno** | El éxito indica que el personaje produjo una interacción de muy buena calidad. |\n| **Asombroso** | El éxito indica que el personaje produjo una interacción magistral. |\n\n---"
    items:
      bargain:
        attribute: PER
        cost: 3
        url: /skills/interaction#bargain
        localized:
        - en:
            name: Bargain
            description: "Bargain represents a character's ability to negotiate a cheaper price for an object he wants to buy or a better price for one he's selling. It also covers more formal business negotiations. A successful check improves the character's position at the bargaining table. The degree of success determines who gets the better outcome.\n\n#### Bargain Situation Modifiers\n| Condition | Modifier |\n| :--- | :--- |\n| Opponent has no ranks in bargain | -2 steps |\n| Opponent has ranks in bargain | 0 |\n| Supply is low | +2 steps |\n| Supply is moderate | 0 |\n| Supply is high | -1 step |\n| Demand is low | -2 steps |\n| Demand is moderate | 0 |\n| Demand is high | +2 steps |\n\n---"
        - es:
            name: Regatear
            description: "Regatear representa la capacidad de un personaje para pactar un precio más barato por un objeto que quiere comprar o un precio mejor por uno que está vendiendo. También cubre negociaciones comerciales más formales. Una tirada exitosa mejora la posición del personaje en la mesa de negociación, mientras que un éxito Asombroso le otorga una bonificación de -3 pasos (o a su oponente una penalización de +3) en cualquier tirada de Interacción posterior realizada durante el encuentro.\n\n---"
      charm:
        attribute: PER
        cost: 3
        url: /skills/interaction#charm
        localized:
        - en:
            name: Charm
            description: "This specialty skill represents a character's ability to change the attitudes of those he interacts with by presenting himself in a likable, friendly manner. A character with this skill seeks to charm others into giving up something with kind words, a winning smile, and a personable attitude—whether it's material goods or simply a change of attitude.\n\n**Note:** Charm can only be used on targets whose attitude is **Neutral** or **Friendly**. A character cannot charm a Hostile or Combative target.\n\n---"
        - es:
            name: Encantar
            description: "Un personaje CON la habilidad de especialidad de encantar tiene talento para ser agradable y para convertir a los demás en sus amigos y aliados. Encantar se utiliza a menudo para modificar la actitud inicial de un público hacia un artista. Una tirada exitosa mejora la actitud del público en un paso (Neutral se vuelve Amistoso, Amistoso se vuelve Fanático).\n\n---"
      interview:
        attribute: PER
        cost: 3
        url: /skills/interaction#interview
        localized:
        - en:
            name: Interview
            description: "The interview skill represents a character's ability to get information from another character in a non-aggressive way. Interviews are often used by reporters, investigators, and officials conducting standard administrative procedures.\n\nIt differs from **Investigate—interrogate** (a Will-based skill) in the amount of aggressiveness and fear applied by the questioner.\n\n---"
        - es:
            name: Entrevistar
            description: "La habilidad de especialidad de entrevistar representa el talento para obtener información de otro personaje de forma no agresiva. Las entrevistas son utilizadas a menudo por reporteros, investigadores y funcionarios que llevan a cabo procedimientos administrativos estándar.\n\n---"
      intimidate:
        attribute: PER
        cost: 3
        url: /skills/interaction#intimidate
        localized:
        - en:
            name: Intimidate
            description: "This specialty represents a character's ability to threaten another, either by physical presence or weight of authority. Intimidate enables a character to force an opponent to back down, reveal information, or cooperate in some other way due to fear.\n\nThe target's **Will resistance modifier** applies to the skill check, along with other Interaction modifiers. It is not possible to intimidate a Fanatic or Combative character. The greater the degree of success, the more cooperation the character can elicit.\n\n---"
        - es:
            name: Intimidar
            description: "Intimidar se utiliza para influir en las acciones de otros mediante la presencia, la amenaza verbal o alguna muestra de autoridad. Un personaje que intimida a su oponente intenta desconcertarlo, lo que suele provocar que este retroceda ante una amenaza inmediata o se vuelva más cooperativo.\n\n---"
      seduce:
        attribute: PER
        cost: 3
        url: /skills/interaction#seduce
        localized:
        - en:
            name: Seduce
            description: "Seduce represents the ability to entice or beguile another character through opening lines, witty exchanges, playful conversation, and intimate behavior. The goal is to gain the seduced character’s trust through romantic overtures.\n\n**Note:** Seduce can only be used on targets whose attitude is **Neutral**, **Friendly**, or better. A character cannot seduce a Hostile or Combative target.\n\nA seduced character doesn't stay that way forever. How long the character remains seduced depends on the result of the check. If the target becomes Charmed, the seduction works well enough to lead to serious feelings. If the target becomes Fanatic, they become obsessed with the seducer. Whenever the seducer asks for a favor, the target makes a **Will feat check** (with modifiers based on attitude: Charmed +1, Fanatic +2). Once the seduced character’s attitude shifts to Friendly, they are no longer seduced.\n\n---"
        - es:
            name: Seducir
            description: "Seducir es la habilidad que permite a un personaje atraer o cautivar a otro personaje mediante el comportamiento íntimo y la manipulación emocional. La utilizan los personajes que quieren encandilar a alguien, ya sea para obtener información o simplemente para aprovecharse de los sentimientos de ese personaje.\n\n⊗ **Rango 3, 6, 12 [Modificador de resistencia]:** El modificador de resistencia de Voluntad del personaje mejora (contra seducción/interacción) en estos rangos.\n\n---"
      taunt:
        attribute: PER
        cost: 3
        url: /skills/interaction#taunt
        localized:
        - en:
            name: Taunt
            description: "Taunt represents a character's ability to trade insults in order to rattle or enrage an opponent. A character who taunts his opponent tries to force him into making an error in judgment.\n\n#### Taunt Situation Modifiers\n| Target Attitude | Modifier |\n| :--- | :--- |\n| Combative | -2 steps |\n| Hostile | -1 step |\n| Neutral | 0 |\n| Friendly | +1 step |\n\nOn an **Ordinary** success, the taunt is effective, providing a **+1 penalty** to the target's next action. On a **Good** success, the penalty is **+2**; on an **Amazing** success, the penalty is **+3**. Success also enrages the target and shifts their attitude toward **Combative** (Neutral to Hostile, for example).\n\nAfter a Critical Failure or a Failure result, a character can make another attempt to taunt someone else. However, only one successful taunt can be directed at a target in a scene."
        - es:
            name: Provocar
            description: "La habilidad de especialidad de provocar representa el talento para intercambiar insultos CON el fin de desconcertar o enfurecer a un oponente. Un personaje que provoca a su oponente intenta forzarle a cometer un error de juicio o a realizar una acción que normalmente no llevaría a cabo.\n\n▶ **Distracción:** En el rango 4, si una tirada de provocar tiene éxito, el objetivo recibe una penalización de +1 paso en cualquier tirada de habilidad realizada durante el asalto siguiente."
  investigate:
    attribute: WIL
    cost: 3
    category: Social
    url: /skills/investigate
    localized:
    - en:
        name: Investigate
        description: "This broad skill provides a character with the training and ability to examine things systematically through observation and inquiry. Unlike Awareness skills, Investigate takes time. It can be used when a character tries to apply logic and reason to reach a conclusion or deduce the solution to a problem.\n\n### Investigate Situation Modifiers\n| Task | Modifier |\n| :--- | :--- |\n| Using just the broad skill | +1 step |\n| Fast investigation (1 time unit) | +3 steps |\n| Moderate investigation (2-3 time units) | +1 step |\n| Careful investigation (4+ time units) | -2 steps |\n| Fresh investigation site | -2 steps |\n| Recent investigation site | 0 steps |\n| Cold investigation site | +2 steps |\n| Old investigation site | +4 steps |\n| Character has a related skill: | |\n| &nbsp;&nbsp;&nbsp;at rank 1-4 | -1 step |\n| &nbsp;&nbsp;&nbsp;at rank 5-8 | -2 steps |\n| &nbsp;&nbsp;&nbsp;at rank 9-12 | -3 steps |\n| Hidden or concealed clue | +3 steps |\n| Small clue | +3\
          \ steps |\n| Large clue | -1 step |\n| Character knows what he's looking for | -1 step |\n| Tracking a single target | 0 steps |\n| Tracking a group of characters/creatures | -2 steps |\n| Tracking on soft ground | -1 step |\n| Tracking on hard ground | +1 step |\n| Tracking in urban setting | +3 steps |\n\n---"
    - es:
        name: Investigar
        description: "Esta habilidad general proporciona a un personaje el entrenamiento y la capacidad de examinar las cosas sistemáticamente mediante la observación y la indagación. A diferencia de las habilidades de Alerta, Investigar requiere tiempo. Se puede utilizar cuando un personaje intenta aplicar la lógica y la razón para llegar a una conclusión o deducir la solución a un problema.\n\n### Modificadores de Situación de Investigar\n| Tarea | Modificador |\n| :--- | :--- |\n| Usar solo la habilidad amplia | +1 paso |\n| Investigación rápida (1 unidad de tiempo) | +3 pasos |\n| Investigación moderada (2-3 unidades de tiempo) | +1 paso |\n| Investigación cuidadosa (4+ unidades de tiempo) | -2 pasos |\n| Lugar de investigación fresco | -2 pasos |\n| Lugar de investigación reciente | 0 pasos |\n| Lugar de investigación \"frío\" | +2 pasos |\n| Lugar de investigación antiguo | +4 pasos |\n| El personaje tiene una habilidad relacionada: | |\n| &nbsp;&nbsp;&nbsp;en el rango 1-4 | -1 paso\
          \ |\n| &nbsp;&nbsp;&nbsp;en el rango 5-8 | -2 pasos |\n| &nbsp;&nbsp;&nbsp;en el rango 9-12 | -3 pasos |\n| Pista oculta o escondida | +3 pasos |\n| Pista pequeña | +3 pasos |\n| Pista grande | -1 paso |\n| El personaje sabe lo que está buscando | -1 paso |\n| Rastrear un solo objetivo | 0 pasos |\n| Rastrear un grupo de personajes/criaturas | -2 pasos |\n| Rastrear en suelo blando | -1 paso |\n| Rastrear en suelo duro | +1 paso |\n| Rastrear en un entorno urbano | +3 pasos |\n\n---\n\n# Habilidades de Especialidad"
    items:
      interrogate:
        attribute: WIL
        cost: 3
        url: /skills/investigate#interrogate
        localized:
        - en:
            name: Interrogate
            description: "The Interrogate skill represents a character's ability to ask the right questions in order to gain information from a specific target character. That character's Will resistance modifier is his protection from the probing questions of a skilled interrogator.\n\nThe skill covers the sort of interrogation that might be conducted by a seasoned journalist, a law officer, a lawyer, or a trained torturer—anyone who asks tough questions as a matter of course. It may include a hint of violence or actual pain-inducing techniques, but it usually just involves calm and reasonable debate, rhetoric, and trick questions to cause the target to slip up.\n\n---"
        - es:
            name: Interrogar
            description: "La habilidad de Interrogar representa la capacidad de un personaje para hacer las preguntas correctas CON el fin de obtener información de un personaje objetivo específico. El modificador de resistencia de Voluntad de ese personaje es su protección frente a las preguntas incisivas de un interrogador experto.\n\nLa habilidad cubre el tipo de interrogatorio que podría llevar a cabo un periodista experimentado, un oficial de la ley, un abogado o un torturador entrenado; cualquiera que haga preguntas difíciles como algo natural. Puede incluir un toque de violencia o técnicas reales que provoquen dolor, pero normalmente solo implica un debate tranquilo y razonable, retórica y preguntas capciosas para hacer que el objetivo cometa un error.\n\n---"
      search:
        attribute: WIL
        cost: 1
        url: /skills/investigate#search
        localized:
        - en:
            name: Search
            description: "This specialty skill enables a character to develop his eye for detail and his ability to spot hidden objects. Search is used when a character wants to look for clues in a specific area, find a particular object or person he knows is in the area, or hunt for important objects in as fast and systematic a fashion as possible.\n\nThe degree of success achieved on a skill check determines what the character spots after a certain amount of time spent searching, ranging from a single small item or piece of information on a short search to several small items or a major piece of information on a long search.\n\n---"
        - es:
            name: Buscar
            description: "Esta habilidad de especialidad permite a un personaje desarrollar su ojo para los detalles y su capacidad para detectar objetos ocultos. Buscar se utiliza cuando un personaje quiere buscar pistas en un área específica, encontrar un objeto o persona en particular que sabe que está en el área, o buscar objetos importantes de la manera más rápida y sistemática posible.\n\nEl grado de éxito alcanzado en una tirada de habilidad determina lo que el personaje detecta después de una cierta cantidad de tiempo dedicado a la búsqueda, desde un solo objeto pequeño o pieza de información en una búsqueda corta hasta varios objetos pequeños o una pieza importante de información en una búsqueda larga.\n\n---"
      track:
        attribute: WIL
        cost: 3
        url: /skills/investigate#track
        localized:
        - en:
            name: Track
            description: "This specialty skill allows a character to improve his ability to follow a person, creature, or land vehicle by noting the tracks it leaves in its wake. \n\nTracks can be anything from actual footprints to telltale signs such as broken branches, discarded litter, obvious waste material, or other evidence of passage. A tracker may not necessarily be following physical evidence; he may be using detective skills, interview techniques, sensors, or other special equipment.\n\nTrack is used to locate and follow a trail, either a physical one or a trail of information. Once a character spots his prey, Stealth—shadow can be used to follow closely without being spotted."
        - es:
            name: Rastrear
            description: "Esta habilidad de especialidad permite a un personaje mejorar su capacidad para seguir a una persona, criatura o vehículo terrestre observando los rastros que deja a su paso.\n\nLos rastros pueden ser cualquier cosa, desde huellas reales hasta señales reveladoras como ramas rotas, basura desechada, material de desecho obvio u otra evidencia de paso. Un rastreador puede no estar siguiendo necesariamente evidencia física; puede estar usando habilidades detectivescas, técnicas de entrevista, sensores u otro equipo especial.\n\nRastrear se utiliza para localizar y seguir un rastro, ya sea físico o de información. Una vez que un personaje detecta a su presa, se puede usar **Sigilo—seguir en la sombra** para seguirla de cerca sin ser detectado."
  knowledge:
    attribute: INT
    cost: 4
    category: Technical
    url: /skills/knowledge
    localized:
    - en:
        name: Knowledge
        description: "This broad skill represents a character's ability to know at least a little bit about any particular subject. With just the broad skill, a character isn't considered an expert, but it represents the ability to logically recall a class he took, an article he read, or a documentary he saw on the topic in question.\n\nKnowledge skill checks are usually made in secret so the players don't even know the check is being made. Once a character is determined to have knowledge concerning a particular topic, a note can be made on the character sheet.\n\n### Table P24: Knowledge Categories\nFor a Knowledge skill check, the Gamemaster determines which category the information sought belongs to:\n\n| Category | Modifier | Complexity |\n| :--- | :--- | :--- |\n| **Trivial** | +1 step | Marginal |\n| **General** | None | Ordinary |\n| **Specific** | +2 steps | Good |\n| **Expert** | +3 steps | Amazing |\n\n- **Trivial:** Simple, obvious, or readily available information.\n- **General:**\
          \ Key features of a topic, not details or particulars.\n- **Specific:** Special features of a topic, details known to someone intimate with the topic.\n- **Expert:** A level of detail usually only acquired through experience, research, or training.\n\n---"
    - es:
        name: Conocimiento
        description: "Esta habilidad amplia representa la capacidad de un personaje para saber al menos un poco sobre cualquier tema en particular. Solo CON la habilidad amplia, un personaje no es considerado un experto, pero representa la capacidad de recordar lógicamente una clase que tomó, un artículo que leyó o un documental que vio sobre el tema en cuestión.\n\nLas comprobaciones de la habilidad de Conocimiento generalmente se realizan en secreto para que los jugadores ni siquiera sepan que se está realizando la comprobación. Una vez que se determina que un personaje tiene conocimiento sobre un tema en particular, se puede hacer una nota en la hoja del personaje.\n\n### Tabla P24: Categorías de Conocimiento\nPara una comprobación de la habilidad de Conocimiento, el Director de Juego determina a qué categoría pertenece la información buscada:\n\n| Categoría | Modificador | Complejidad |\n| :--- | :--- | :--- |\n| **Trivial** | +1 paso | Marginal |\n| **General** | Ninguno | Ordinaria\
          \ |\n| **Específica** | +2 pasos | Buena |\n| **Experta** | +3 pasos | Asombrosa |\n\n- **Trivial:** Información simple, obvia o fácilmente disponible.\n- **General:** Características clave de un tema, no detalles ni pormenores.\n- **Específica:** Características especiales de un tema, detalles conocidos por alguien íntimamente relacionado CON el tema.\n- **Experta:** Un nivel de detalle que generalmente solo se adquiere a través de la experiencia, la investigación o el entrenamiento.\n\n---\n\n# Habilidades de Especialidad"
    items:
      language-specific-skill:
        attribute: INT
        cost: 3
        url: /skills/knowledge#language-specific-skill
        localized:
        - en:
            name: Language, Specific Skill
            description: "This specialty skill gives a character a certain amount of fluency in a specific language. Every character begins with **Rank 3** in his or her native language. Lower ranks indicate a crude familiarity; higher ranks improve the character's vocabulary and comprehension of obscure or complicated passages.\n\n### Rank Benefits\n⊗ **Improved Communication:** As a character achieves higher skill ranks in a specific language, he or she gets better at employing other skills that involve language use (such as encounter skills and some Creativity specialties).  This benefit provides a reduction to situation die penalties: **1 step at rank 4**, **2 steps at rank 8**, and **3 steps at rank 12**. This benefit only reduces a penalty; it never provides a bonus."
        - es:
            name: Operación de Computadoras
            description: "Esta habilidad de especialidad permite a un personaje mejorar su capacidad para hacer que las computadoras funcionen, específicamente su capacidad para obtener el máximo provecho del software (incluido el sistema operativo) que está instalado en una computadora. El grado de éxito se relaciona CON la calidad o cantidad de información accedida o recuperada, o la velocidad CON la que el operador es capaz de realizar una tarea.\n\n---"
      psionics:
        attribute: INT
        cost: 3
        url: /skills/knowledge#psionics
        localized:
        - en:
            name: Psionics
            description: "This skill gives a character a working knowledge of psionic abilities, perhaps even beyond what the character's culture understands as a whole. The degree of success achieved on a skill check relates to the quality or quantity of information that is available to or understood by the character."
        - es:
            name: Deducir
            description: "CON esta habilidad de especialidad, un personaje puede perfeccionar sus habilidades para usar la razón y la lógica para llegar a una conclusión. Los detectives e investigadores utilizan Deducir para armar pistas, o los científicos e ingenieros para descubrir la respuesta a un problema relacionado CON sus habilidades.\n\n⊗ **Modificador de Resistencia:** En rangos más altos, la habilidad de deducir proporciona una mejora al **modificador de resistencia de Inteligencia** de un personaje, lo que hace que sea más difícil para los oponentes usar CON éxito habilidades de encuentro para engañar al personaje. El modificador mejora en **+1 al rango 4**, **+1 al rango 8** y **+1 al rango 12**.\n\n---"
      computer-operation:
        attribute: INT
        cost: 2
        url: /skills/knowledge#computer-operation
        localized:
        - en:
            name: Computer Operation
            description: "This specialty skill allows a character to improve his ability to make computers perform, specifically his ability to get the most out of the software (including the operating system) that is installed in a computer. The degree of success relates to the quality or quantity of information accessed or retrieved, or the speed with which the operator is able to perform a task.\n\n---"
        - es:
            name: Primeros Auxilios
            description: "Esta habilidad de especialidad representa el entrenamiento básico en técnicas de primeros auxilios, incluyendo el uso de paquetes de traumatología, kits de primeros auxilios y otros artículos médicos de uso general. No proporciona al personaje la capacidad de usar herramientas quirúrgicas especializadas o equipo médico avanzado.\n\n### Curar Daño de Aturdimiento\nUn personaje puede usar los primeros auxilios para eliminar el daño de aturdimiento de sí mismo o de otra persona. Una comprobación de habilidad exitosa restaura **2, 3 o 4 puntos de aturdimiento** dependiendo del éxito (Ordinario, Bueno o Asombroso). Esto solo funciona en alguien que está consciente.\n\n### Recuperación de Desmayo (Knockout)\nUn desmayo ocurre cuando se agotan los puntos de aturdimiento de un personaje. Una comprobación de habilidad exitosa devuelve la conciencia a un personaje y restaura **1, 2 o 3 puntos de aturdimiento**, según el grado de éxito.\n\n### Curar Daño de Herida\nLa habilidad\
              \ de primeros auxilios se puede usar para curar heridas, aunque se requiere un kit de primeros auxilios o un paquete de traumatología.\n- **Kit de Primeros Auxilios:** Se requiere una comprobación de habilidad compleja de **Complejidad Buena** (1 herida curada al finalizar).\n- **Paquete de Traumatología:** Se requiere una comprobación de habilidad compleja de **Complejidad Ordinaria** (2 heridas curadas al finalizar).\n- **Fallo Crítico:** Si se usa un paquete de traumatología, el paciente sufre 1 herida en lugar de curarse, y el paquete se arruina.\n\n### Agonizante (Dying)\nUn personaje CON cualquier cantidad de daño Mortal se considera agonizante. Un personaje que usa un kit de primeros auxilios o un paquete de traumatología y realiza una comprobación de habilidad de primeros auxilios exitosa puede **estabilizar el daño Mortal**, eliminando la necesidad de que el personaje realice una comprobación de Resistencia–aguante al final de la escena actual. (Nota: la cirugía sigue\
              \ siendo necesaria para restaurar la salud de un personaje agonizante).\n\n### Beneficios de Rango\n⊗ **Primeros Auxilios Mejorados:** A medida que un personaje alcanza rangos de habilidad más altos, se vuelve más competente al brindar ayuda a los pacientes lesionados. Esto reduce la penalización por dado de situación en **1 paso al rango 4**, **2 pasos al rango 8** y **3 pasos al rango 12**.\n\n---"
      deduce:
        attribute: INT
        cost: 2
        url: /skills/knowledge#deduce
        localized:
        - en:
            name: Deduce
            description: "With this specialty skill, a character can hone his abilities to use reason and logic to reach a conclusion. Deduce is used by detectives and investigators to piece together clues, or by scientists and engineers to discover the answer to a skill-related problem.\n\n⊗ **Resistance Modifier:** At higher ranks, the deduce skill provides an improvement to a character's **Intelligence resistance modifier**, which makes it more difficult for opponents to successfully use encounter skills to deceive the character. The modifier improves by **+1 at Rank 4**, **+1 at Rank 8**, and **+1 at Rank 12**.\n\n---"
        - es:
            name: Idioma, Habilidad Específica
            description: "Esta habilidad de especialidad le da a un personaje cierta fluidez en un idioma específico. Cada personaje comienza CON el **rango 3** en su idioma nativo. Los rangos más bajos indican una familiaridad rudimentaria; los rangos más altos mejoran el vocabulario del personaje y la comprensión de pasajes oscuros o complicados.\n\n### Beneficios de Rango\n⊗ **Comunicación Mejorada:** A medida que un personaje alcanza rangos de habilidad más altos en un idioma específico, mejora en el empleo de otras habilidades que involucran el uso del lenguaje (como las habilidades de encuentro y algunas especialidades de Creatividad). Este beneficio proporciona una reducción a las penalizaciones por dado de situación: **1 paso al rango 4**, **2 pasos al rango 8** y **3 pasos al rango 12**. Este beneficio solo reduce una penalización; nunca proporciona un bono.\n---"
      first-aid:
        attribute: INT
        cost: 3
        url: /skills/knowledge#first-aid
        localized:
        - en:
            name: First Aid
            description: "This specialty skill represents basic training in first aid techniques, including the use of trauma packs, first aid kits, and other general-use medical items. It doesn't provide a character with the ability to use specialized surgical tools or advanced medical gear.\n\n### Heal Stun Damage\nA character can use first aid to remove stun damage from himself or someone else. A successful skill check restores **2, 3, or 4 stun points** depending on success (Ordinary, Good, or Amazing). This only works on someone who is conscious.\n\n### Knockout Recovery\nA knockout occurs when a character's stun points are used up. A successful skill check brings a character back to consciousness and restores **1, 2, or 3 stun points**, depending on the degree of success.\n\n### Heal Wound Damage\nThe first aid skill can be used to heal wounds, though a first aid kit or trauma pack is required.\n- **First Aid Kit:** A complex skill check of **Good complexity** is required (1 wound\
              \ healed on completion).\n- **Trauma Pack:** A complex skill check of **Ordinary complexity** is required (2 wounds healed on completion).\n- **Critical Failure:** If a trauma pack is used, the patient suffers 1 wound instead of having any wounds healed, and the pack is ruined.\n\n### Dying\nA character with any amount of mortal damage is considered to be dying. A character who uses either a first aid kit or a trauma pack and makes a successful first aid skill check can **stabilize mortal damage**, removing the need for the character to make a Stamina–endurance check at the end of the current scene. (Note: surgery is still necessary to restore a dying character to health).\n\n### Rank Benefits\n⊗ **Improved First Aid:** As a character achieves higher skill ranks, he becomes more proficient at providing aid to injured patients. This reduces the situation die penalty by **1 step at rank 4**, **2 steps at rank 8**, and **3 steps at rank 12**.\n\n---"
        - es:
            name: Psiónica
            description: "Esta habilidad le da a un personaje un conocimiento práctico de las habilidades psiónicas, tal vez incluso más allá de lo que entiende su cultura como un todo. El grado de éxito logrado en una comprobación de habilidad se relaciona CON la calidad o cantidad de información disponible o comprendida por el personaje."
      language:
        attribute: INT
        cost: 2
        url: /skills/knowledge#language
        localized:
        - en:
            name: Language
            description: ''
        - es:
            name: Street knowledge
            description: ''
      medical-knowledge:
        attribute: INT
        cost: 3
        url: /skills/knowledge#medical-knowledge
        localized:
        - en:
            name: Medical Knowledge
            description: ''
        - es:
            name: Técnico Knowledge
            description: ''
      street-knowledge:
        attribute: WIL
        cost: 3
        url: /skills/knowledge#street-knowledge
        localized:
