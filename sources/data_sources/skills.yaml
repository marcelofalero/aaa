            name: Armas de energía
            description: "As a Personaje improves his ability in the Armas de energía Especialidad, he gains rank benefits as described below. Note: These benefits only apply when the Personaje is using a weapon covered by this skill.\n\nDue to the inherent complexity of Armas de energía weapons they are more fragile than their counterparts; this requires the user to be more careful when parrying, resulting in a +2 step penalty on parry checks.\n\n⊗ Resistance Modifier: At higher ranks, the skill provides an improvement to a Personaje's Strength resistance modifier. It improves by +1 at rank 4, by +1 again at rank 8, and by +1 again at rank 12. This increase doesn't stack with similar bonuses provided by Otros Combate cuerpo a cuerpo specialty skills.\n\n▶ Reaction Parry: When a Personaje reaches rank 4, he can attempt to parry whenever a melee or unarmed attack is used against him. The parry attempt uses up the Personaje's next available action.\n\n▶ Double-Strike: When a Personaje reaches\
              \ skill rank 6, he learns to make a double-strike against a target with a successful skill check. The player rolls one Dado de Control and two situation dice. The first Dado de Situación is the base modifier with a +1 step penalty; the second Dado de Situación is the base modifier with a +2 step penalty.\n\n▶ Multistrike: When a Personaje reaches skill rank 9, he learns to make multiple attacks in a single phase. The Personaje can strike with a melee weapon three times in a phase. These attacks can be directed at a single target or at up to three separate targets within two meters of the Personaje."
  modern-ranged-weapons:
    attribute: DEX
    cost: 6
    category: Combat
    url: /skills/modern-ranged-weapons
    localized:
    - en:
        name: Modern Ranged Weapons
        description: "This broad skill provides a character with training in the use of modern ranged weapons. This skill covers pistols, rifles, shotguns, and submachine guns of all types, including projectile and energy weapons.\n\nAll modern weapons have ammunition clips. To change a clip during a combat scene, a character must use an available action. If he wants to change a clip and shoot in the same phase, a +2 penalty applies to the attack action.\n\nOther factors that can influence the situation die used in a modern ranged weapon attack are listed under **Ranged Weapon Attack Modifiers** on this page.\n\n**Weapon Technical Knowledge**: Characters who train seriously with firearms — whether soldiers, mercenaries, or dedicated enthusiasts — inevitably absorb a working technical understanding of their weapons. They learn how their weapons function internally, what can go wrong, how to prevent it, and how to fix it in the field. As well as keep informed of what the market has to offer.\
          \ A character with the **Technical Science** broad skill can use the appropriate Modern Ranged Weapons specialty skill for checks that involve knowing the existence of a particular weapon, customizing weapons and ammo, as well as recognizing, repairing, and maintaining weapons in the field.\n\n\n\n### Ranged Weapon Attack Modifiers\n\nWhen a character uses any ranged weapon, either primitive or modern, a number of factors must be considered to determine the situation die for the skill check:\n- The base situation die of the weapon (either +4 for a broad skill or +0 for a specialty).\n- The weapon's range modifier (see **TABLE P22: RANGE MODIFIERS BY WEAPON TYPE** below).\n- Any modifier for a target's Dexterity resistance (–1 step bonus for DEX 11–12, –2 steps for DEX 13–14, –3 steps for DEX 15–16, –4 steps for DEX 17–18, and –5 steps for DEX 19 or higher).\n\n#### TABLE: COMMON RANGED ATTACK MODIFIERS\n\n| Condition | Modifier | Weapon Types | Note |\n| :--- | :--- | :--- | :---\
          \ |\n| **Zero Range** (0–1m) | **-3 steps** | Pistol, SMG, Shotgun | Weapons must be short enough to tuck into a grapple. |\n| **Point Blank** (1–4m) | **-1 step** | All | See Specialty Rank benefits for improvements. |\n| **In a Melee Struggle** | **+1 step** | All | Canceled by **Melee Combat** Broad Skill training. |\n| **Moving & Shooting** | **+1 step** | All | For firing while running or moving fast. |\n| **Changing Clips** | **+2 steps** | All | To change a clip and fire in the same phase. |\n\n#### TABLE P22: RANGE MODIFIERS BY WEAPON TYPE\n\n| Weapon | Short | Medium | Long |\n| :--- | :--- | :--- | :--- |\n| Submachine gun | -1 step | +1 step | +2 steps |\n| Pistol | -1 step | +1 step | +2 steps |\n| Rifle | -1 step | None | +1 step |\n\n---"
    - es:
        name: Armas a distancia modernas
        description: "Esta habilidad amplia proporciona a un personaje entrenamiento en el uso de armas a distancia modernas. Esta habilidad cubre pistolas, fusiles, escopetas y subfusiles de todos los tipos, incluyendo armas de proyectiles y de energía.\n\nTodas las armas modernas tienen cargadores de munición. Para cambiar un cargador durante una escena de combate, un personaje debe usar una acción disponible. Si quiere cambiar el cargador y disparar en el mismo asalto (fase), se aplica una penalización de +2 pasos a la acción de ataque.\n\nOtros factores que pueden influir en el dado de situación utilizado en un ataque CON armas modernas a distancia se detallan bajo **Modificadores de ataque de armas a distancia** en esta página.\n\n**Conocimiento técnico de armas**: Los personajes que se entrenan seriamente CON armas de fuego — ya sean soldados, mercenarios o entusiastas dedicados — inevitablemente absorben una comprensión técnica funcional de sus armas. Aprenden cómo funcionan internamente,\
          \ qué puede fallar, cómo prevenirlo y cómo repararlo en el campo. Así como mantenerse informados de lo que el mercado tiene para ofrecer. Un personaje CON la habilidad amplia de **Ciencia técnica** puede usar la habilidad de especialidad de Armas a distancia modernas apropiada para las tiradas que impliquen conocer la existencia de un arma concreta, personalizar armas y munición, así como reconocer, reparar y mantener armas en el campo.\n\n\n\n### Modificadores de ataque de armas a distancia\n\nCuando un personaje usa cualquier arma a distancia, ya sea primitiva o moderna, se deben considerar varios factores para determinar el dado de situación de la tirada de habilidad:\n- El dado de situación base del arma (+4 para la habilidad amplia o +0 para la especialidad).\n- El modificador de distancia del arma (véase la **TABLA P22: MODIFICADORES DE DISTANCIA POR TIPO DE ARMA** abajo).\n- Cualquier modificador por la resistencia de Destreza del objetivo (bonificación de –1 paso para DES\
          \ 11–12, –2 pasos para DES 13–14, –3 pasos para DES 15–16, –4 pasos para DES 17–18 y –5 pasos para DES 19 o más).\n\n#### TABLA: MODIFICADORES COMUNES DE ATAQUE A DISTANCIA\n\n| Condición | Modificador | Tipos de Arma | Nota |\n| :--- | :--- | :--- | :--- |\n| **Alcance Cero** (0–1m) | **-3 pasos** | Pistola, Subfusil, Escopeta | El arma debe ser lo suficientemente corta para un forcejeo. |\n| **A bocajarro** (1–4m) | **-1 paso** | Todas | Véase beneficios de rango de especialidad para mejoras. |\n| **En lucha cuerpo a cuerpo** | **+1 paso** | Todas | Cancelado por el entrenamiento de la habilidad de **Combate cuerpo a cuerpo**. |\n| **En movimiento** | **+1 paso** | Todas | Para disparar mientras se corre o se mueve rápido. |\n| **Cambiar cargador** | **+2 pasos** | Todas | Para cambiar el cargador y disparar en la misma fase. |\n\n#### TABLA P22: MODIFICADORES DE DISTANCIA POR TIPO DE ARMA\n\n| Arma | Corta | Media | Larga |\n| :--- | :--- | :--- | :--- |\n| Subfusil | -1 paso\
          \ | +1 paso | +2 pasos |\n| Pistola | -1 paso | +1 paso | +2 pasos |\n| Fusil | -1 paso | Nada | +1 paso |\n\n---\n\n# Habilidades de especialidad"
    items:
      assault-rifle:
        attribute: DEX
        cost: 3
        url: /skills/modern-ranged-weapons#assault-rifle
        localized:
        - en:
            name: Assault Rifle
            description: "This specialty skill covers automatic rifles—standard infantry weapons capable of selective fire and automatic modes using rifle-caliber cartridges.\n\n### Automatic Weapon Attack Modes\nAssault rifles provide a character with up to three attack options per action phase:\n- **Fire:** A single attack at a single target. (Standard control + situation die).\n- **Burst:** A hail of ammunition aimed at a single target. The character receives a **-1 step bonus** to his skill check. On a Critical Failure, the weapon jams and requires a Technical Science—repair check to unjam.\n- **Autofire:** A spray of ammunition walked across a wide area. Up to three different targets within 6 meters of each other can be affected. \n  - To resolve autofire, the player rolls one control die and three situation dice at once. \n  - The results are read off the control die, modified by the individual situation dice: **+1 step** for the first target, **+2 steps** for the second, and **+3\
              \ steps** for the third. \n\n▶ **Rock-n-Roll:** When a character reaches rank 3 in this specialty, he learns to change clips more efficiently. The penalty for changing a clip and firing in the same action is reduced to +1 step.\n\n---"
        - es:
            name: Fusil de asalto
            description: "Esta habilidad de especialidad permite a un personaje mejorar su competencia CON pistolas modernas de todo tipo, incluyendo armas de proyectiles y de energía.\n\n▶ **Desenfundado rápido:** Después de que un personaje alcanza el rango 3 en esta especialidad, puede realizar un desenfundado rápido CON su pistola. Esto le permite desenfundar su arma y dispararla en el mismo asalto CON solo una penalización de +1. Al alcanzar el rango 4, puede desenfundar y disparar en el mismo asalto sin ninguna penalización.\n\n---"
      pistol:
        attribute: DEX
        cost: 3
        url: /skills/modern-ranged-weapons#pistol
        localized:
        - en:
            name: Pistol
            description: "This specialty skill allows a character to improve his proficiency with modern pistols of all types, including projectile and energy weapons.\n\n▶ **Quick Draw:** After a character reaches rank 3 in this specialty, he can perform a quick draw with his pistol. This allows him to draw his weapon and fire it in the same phase with only a +1 penalty. As a character reaches rank 4, he can draw and fire in the same phase without any penalty.\n\n---"
        - es:
            name: Pistola
            description: "Esta habilidad de especialidad permite a un personaje mejorar su competencia CON subfusiles modernos de todo tipo (armas automáticas pequeñas que disparan cartuchos de tamaño de pistola), así como subfusiles equivalentes de energía.\n\n### Modos de ataque de armas automáticas\nLos subfusiles (y los fusiles de asalto) proporcionan a un personaje hasta tres opciones de ataque por fase de acción:\n- **Disparar:** Un solo ataque a un solo objetivo. (Control estándar + dado de situación).\n- **Ráfaga:** Una lluvia de munición dirigida a un solo objetivo. El personaje recibe una **bonificación de –1 paso** a su tirada de habilidad. En caso de fallo crítico, el arma se encasquilla y requiere una prueba de Ciencia técnica—reparación para desatascarla.\n- **Fuego automático:** Una ráfaga de munición barrida sobre un área amplia. Se pueden ver afectados hasta tres objetivos diferentes a menos de 6 metros entre sí.\n- Para resolver el fuego automático, el jugador tira un dado\
              \ de control y tres dados de situación a la vez.\n- Los resultados se leen del dado de control, modificados por los dados de situación individuales: **+1 paso** para el primer objetivo, **+2 pasos** para el segundo y **+3 pasos** para el tercero.\n\n▶ **Rock-n-Roll:** Cuando un personaje alcanza el rango 3 en esta especialidad, aprende a cambiar los cargadores CON mayor eficiencia. La penalización por cambiar un cargador y disparar en la misma acción se reduce a +1 paso.\n\n---"
      rifle:
        attribute: DEX
        cost: 3
        url: /skills/modern-ranged-weapons#rifle
        localized:
        - en:
            name: Rifle
            description: "This specialty skill allows a character to improve his proficiency with modern single-fire rifles, sniper rifles, and hunting rifles. \n\n▶ **Improved Aim:** When a character reaches rank 3 in this specialty, he becomes able to hit a target with more dependability. This improvement in accuracy translates to a **-1 bonus** to the situation die for any single-fire rifle attack the character makes."
        - es:
            name: Fusil de asalto
            description: "Esta habilidad de especialidad cubre los fusiles automáticos: armas de infantería estándar capaces de fuego selectivo y modos automáticos usando cartuchos de calibre de fusil.\n\n### Modos de ataque de armas automáticas\nLos fusiles de asalto proporcionan a un personaje hasta tres opciones de ataque por fase de acción:\n- **Disparar:** Un solo ataque a un solo objetivo. (Control estándar + dado de situación).\n- **Ráfaga:** Una lluvia de munición dirigida a un solo objetivo. El personaje recibe una **bonificación de –1 paso** a su tirada de habilidad. En caso de fallo crítico, el arma se encasquilla y requiere una prueba de Ciencia técnica—reparación para desatascarla.\n- **Fuego automático:** Una ráfaga de munición barrida sobre un área amplia. Se pueden ver afectados hasta tres objetivos diferentes a menos de 6 metros entre sí.\n- Para resolver el fuego automático, el jugador tira un dado de control y tres dados de situación a la vez.\n- Los resultados se leen\
              \ del dado de control, modificados por los dados de situación individuales: **+1 paso** para el primer objetivo, **+2 pasos** para el segundo y **+3 pasos** para el tercero.\n\n▶ **Rock-n-Roll:** Cuando un personaje alcanza el rango 3 en esta especialidad, aprende a cambiar los cargadores CON mayor eficiencia. La penalización por cambiar un cargador y disparar en la misma acción se reduce a +1 paso.\n\n---"
      smg:
        attribute: DEX
        cost: 3
        url: /skills/modern-ranged-weapons#smg
        localized:
        - en:
            name: SMG
            description: "This specialty skill allows a character to improve his proficiency with modern submachine guns of all types (small automatic weapons that fire pistol-sized cartridges) as well as energy-equivalent submachine guns. \n\n### Automatic Weapon Attack Modes\nSubmachine guns (and assault rifles) provide a character with up to three attack options per action phase:\n- **Fire:** A single attack at a single target. (Standard control + situation die).\n- **Burst:** A hail of ammunition aimed at a single target. The character receives a **-1 step bonus** to his skill check. On a Critical Failure, the weapon jams and requires a Technical Science—repair check to unjam.\n- **Autofire:** A spray of ammunition walked across a wide area. Up to three different targets within 6 meters of each other can be affected. \n  - To resolve autofire, the player rolls one control die and three situation dice at once. \n  - The results are read off the control die, modified by the individual\
              \ situation dice: **+1 step** for the first target, **+2 steps** for the second, and **+3 steps** for the third. \n\n▶ **Rock-n-Roll:** When a character reaches rank 3 in this specialty, he learns to change clips more efficiently. The penalty for changing a clip and firing in the same action is reduced to +1 step.\n\n---"
        - es:
            name: Subfusil
            description: "Esta habilidad de especialidad cubre todos los tipos de escopetas modernas, desde las tradicionales armas de proyectiles de corredera y semiautomáticas hasta los emisores especializados de energía de dispersión. Las escopetas se definen por su amplia gama de tipos de munición especializada (postat, balas sólidas, proyectiles de brecha, etc.) o sus configuraciones de energía de modo múltiple.\n\n▶ **Carga / Selección táctica:** Cuando un personaje alcanza el rango 3 en esta especialidad, ha dominado la mecánica de su arma. Puede **Seleccionar/Cambiar el tipo de munición** o reconfigurar los ajustes de energía del arma como una **Acción gratuita** en lugar de una acción auxiliar. Esto le permite adaptar instantáneamente el perfil de su arma a la situación táctica inmediata (por ejemplo, cambiar a una bala sólida para un disparo de precisión o postat para limpiar un pasillo) durante una fase de combate.\n\n---"
      shotgun:
        attribute: DEX
        cost: 3
        url: /skills/modern-ranged-weapons#shotgun
        localized:
        - en:
            name: Shotgun
            description: "This specialty skill covers all types of modern shotguns, from traditional pump-action and semi-automatic projectile weapons to specialized energy spread-emitters. Shotguns are defined by their wide range of specialized ammunition types (Buckshot, Slugs, Breaching rounds, etc.) or multi-mode energy settings.\n\n▶ **Tactical Load / Selection:** When a character reaches rank 3 in this specialty, they have mastered the mechanics of their weapon. They can **Select/Switch Ammo types** or reconfigure weapon energy settings as a **Free Action** instead of an auxiliary action. This allows them to instantly adapt their weapon’s profile to the immediate tactical situation (e.g., swapping to a slug for a precision shot or buckshot for hallway clearing) during a combat phase.\n\n---"
        - es:
            name: Escopeta
            description: "Esta habilidad de especialidad permite a un personaje mejorar su competencia CON fusiles modernos de un solo disparo, fusiles de precisión (sniper) y fusiles de caza.\n\n▶ **Puntería mejorada:** Cuando un personaje alcanza el rango 3 en esta especialidad, se vuelve capaz de impactar a un objetivo CON mayor fiabilidad. Esta mejora en la precisión se traduce en una **bonificación de –1** al dado de situación de cualquier ataque CON fusil de un solo disparo que realice el personaje."
  navigation:
    attribute: INT
    cost: 3
    category: Other
    url: /skills/navigation
    localized:
    - en:
        name: Navigation
        description: "This broad skill provides a character with training in navigating on a planetary surface or in space. Plotting a course requires a simple skill check.\n\nThe optimum time for a Navigation attempt is 5 minutes. Every minute less than 5 spent on the attempt is a +1 penalty; every minute more than 5 (to 10) is a -1 bonus.\n\n\n---"
    - es:
        name: Navegación
        description: "Esta habilidad amplia proporciona al personaje formación en navegación sobre superficies planetarias o en el espacio. Trazar un rumbo requiere una tirada de habilidad simple.\n\nEl tiempo óptimo para un intento de Navegación es de 5 minutos. Cada minuto menos de 5 invertido en el intento supone una penalización de +1 paso; cada minuto más de 5 (hasta 10) supone una bonificación de -1 paso.\n\n---"
    items:
      astrogationdrivespace:
        attribute: INT
        cost: 3
        url: /skills/navigation#astrogationdrivespace
        localized:
        - en:
            name: Astrogation—drivespace
            description: "This specialty skill involves navigation through drivespace, usually movement between star systems.\n\n### Starfall Results\n- **Critical Failure/Failure:** Consult \"Drivespace Off Course Results\" table.\n- **Ordinary:** Arrive at the edge of the destination star system.\n- **Good:** Arrive inside destination star system, d12+2 AUs from target.\n- **Amazing:** Arrive inside destination system, d4 AUs from target."
        - es:
            name: Astrohabilidad—sistema
            description: "Esta habilidad de especialidad cubre la navegación en un entorno planetario, utilizando mapas, accidentes del terreno, brújulas y sistemas GPS para desplazarse de un punto a otro.\n\n⊗ **Efecto incrementado:** Un personaje recibe una **bonificación de -1 paso** en el rango 3, **-2** en el rango 6, **-3** en el rango 9 y **-4** en el rango 12 en las tiradas de Navegación—superficie al utilizar mapas y sensores de navegación.\n\n---"
      astrogationsystem:
        attribute: INT
        cost: 3
        url: /skills/navigation#astrogationsystem
        localized:
        - en:
            name: Astrogation—system
            description: "This specialty skill covers navigation through a star system, usually movements between planets, moons, and stations.\n\n### In-System Navigation Success\n- **Ordinary:** Arrive at destination +d4 hours from predicted time.\n- **Good:** Arrive at destination on schedule.\n- **Amazing:** Arrive at destination -d4 hours early.\n\n---"
        - es:
            name: Navegación—superficie
            description: "La habilidad de pionero implica identificar y crear nuevos caminos a través de tierras salvajes o terrenos inexplorados donde no existen mapas.\n\n▶ **Explorador:** En el rango 4, el personaje puede guiar a un grupo a través de un terreno difícil a velocidad normal. En el rango 8, el personaje puede encontrar pasajes ocultos o atajos que reduzcan el tiempo de viaje en un 25%.\n\n---"
      navigationsurface:
        attribute: INT
        cost: 3
        url: /skills/navigation#navigationsurface
        localized:
        - en:
            name: Navigation—surface
            description: "This specialty skill covers navigation in a planetary environment, utilizing maps, terrain features, compasses, and GPS systems to move from one point to another.\n\n⊗ **Increased Effect:** A character receives a **-1 bonus** at rank 3, **-2** at rank 6, **-3** at rank 9, and **-4** at rank 12 on Navigation—surface checks when using maps and navigation sensors.\n\n---"
        - es:
            name: Navigation—surface
            description: "This specialty skill covers navigation in a planetary environment, utilizing maps, terrain features, compasses, and GPS systems to move from one point to another.\n\n⊗ **Increased Effect:** A character receives a **-1 bonus** at rank 3, **-2** at rank 6, **-3** at rank 9, and **-4** at rank 12 on Navigation—surface checks when using maps and navigation sensors.\n\n---"
  physical-science:
    attribute: INT
    cost: 7
    category: Technical
    url: /skills/physical-science
    localized:
    - en:
        name: Physical Science
        description: "This broad skill represents a character's training in the physical sciences. Skill checks involving this skill are made the same as Knowledge skill checks.\n\n---"
    - es:
        name: Ciencias físicas
        description: "Esta habilidad amplia representa la formación de un personaje en las ciencias físicas. Las tiradas de habilidad que involucran esta habilidad se realizan de la misma manera que las tiradas de la habilidad de Conocimiento.\n\n---"
    items:
      astronomy:
        attribute: INT
        cost: 3
        url: /skills/physical-science#astronomy
        localized:
        - en:
            name: Astronomy
            description: "Astronomy is the study of celestial objects and phenomena that originate outside planet atmospheres. It allows a character to identify stars, planets, and other celestial bodies, and to calculate orbits and trajectories.\n\n⊗ **Increased Effect:** A character receives a **-1 bonus** at rank 3, **-2** at rank 6, **-3** at rank 9, and **-4** at rank 12 on certain other skill checks that can be assisted by this specialty (e.g., Navigation—system, Navigation—space).\n\n---"
        - es:
            name: Astronomía
            description: "La astronomía es el estudio de los objetos celestes y los fenómenos que se originan fuera de las atmósferas planetarias. Permite a un personaje identificar estrellas, planetas y otros cuerpos celestes, y calcular órbitas y trayectorias.\n\n⊗ **Efecto incrementado:** Un personaje recibe una **bonificación de -1 paso** en el rango 3, **-2** en el rango 6, **-3** en el rango 9 y **-4** en el rango 12 en ciertas otras tiradas de habilidad que puedan ser asistidas por esta especialidad (por ejemplo, Navegación—sistema, Navegación—espacial).\n\n---"
      chemistry:
        attribute: INT
        cost: 3
        url: /skills/physical-science#chemistry
        localized:
        - en:
            name: Chemistry
            description: "Chemistry is the study of matter, its properties, and how and why substances combine or separate to form other substances.\n\n⊗ **Increased Effect:** A character receives a **-1 bonus** at rank 3, **-2** at rank 6, **-3** at rank 9, and **-4** at rank 12 on certain other skill checks that can be assisted by this specialty (e.g., Forensic Science, Medical Science—treatment/pharmacology).\n\n---"
        - es:
            name: Química
            description: "La química es el estudio de la materia, sus propiedades y cómo y por qué las sustancias se combinan o separan para formar otras sustancias.\n\n⊗ **Efecto incrementado:** Un personaje recibe una **bonificación de -1 paso** en el rango 3, **-2** en el rango 6, **-3** en el rango 9 y **-4** en el rango 12 en ciertas otras tiradas de habilidad que puedan ser asistidas por esta especialidad (por ejemplo, Ciencias forenses, Ciencias médicas—tratamiento/farmacología).\n\n---"
      physics:
        attribute: INT
        cost: 3
        url: /skills/physical-science#physics
        localized:
        - en:
            name: Physics
            description: "Physics is the study of matter, energy, and the fundamental forces of nature.\n\n⊗ **Increased Effect:** A character receives a **-1 bonus** at rank 3, **-2** at rank 6, **-3** at rank 9, and **-4** at rank 12 on certain other skill checks that can be assisted by this specialty (e.g., Technical Science—engineering, System Operation—sensors).\n\n---"
        - es:
            name: Física
            description: "La física es el estudio de la materia, la energía y las fuerzas fundamentales de la naturaleza.\n\n⊗ **Efecto incrementado:** Un personaje recibe una **bonificación de -1 paso** en el rango 3, **-2** en el rango 6, **-3** en el rango 9 y **-4** en el rango 12 en ciertas otras tiradas de habilidad que puedan ser asistidas por esta especialidad (por ejemplo, Ciencia técnica—ingeniería, Operación de sistemas—sensores).\n\n---"
      planetology:
        attribute: INT
        cost: 3
        url: /skills/physical-science#planetology
        localized:
        - en:
            name: Planetology
            description: "Planetology is the study of celestial bodies, specifically when attempting to classify, log, and scan for useful information.\n\n⊗ **Increased Effect:** A character receives a **-1 bonus** at rank 3, **-2** at rank 6, **-3** at rank 9, and **-4** at rank 12 on certain other skill checks that can be assisted by this specialty (e.g., Navigation—system, Survival)."
        - es:
            name: Planetología
            description: "La planetología es el estudio de los cuerpos celestes, específicamente cuando se intenta clasificar, registrar y escanear en busca de información útil.\n\n⊗ **Efecto incrementado:** Un personaje recibe una **bonificación de -1 paso** en el rango 3, **-2** en el rango 6, **-3** en el rango 9 y **-4** en el rango 12 en ciertas otras tiradas de habilidad que puedan ser asistidas por esta especialidad (por ejemplo, Navegación—sistema, Supervivencia)."
  primitive-ranged-weapons:
    attribute: DEX
    cost: 7
    category: Combat
    url: /skills/primitive-ranged-weapons
    localized:
    - en:
        name: Primitive Ranged Weapons
        description: "This broad skill provides a character with training in the use of primitive ranged weapons, including bows and crossbows, slings, and even primitive firearms such as flintlock pistols and rifles.\n\nOther factors that can influence the situation die used in a primitive ranged weapon attack are listed under \"Ranged Weapon Attack Modifiers\" in the Modern Ranged Weapons skill section.\n\n**Weapon Technical Knowledge**: Mastery of primitive ranged weapons goes far beyond pulling a trigger or releasing a string. Experienced practitioners — hunters, archers, and survivalists — inevitably absorb a working technical understanding of their weapons. They know how the feathering affects arrow trajectories, how the stiffness of a bow's limbs affects draw weight, and how different materials react to humidity and damage. As well as keeping informed of the various craftsmanship and weapon types that exist. A character with the **Technical Science** broad skill can use the appropriate\
          \ Primitive Ranged Weapons specialty skill for checks that involve knowing the existence (and quality) of a particular weapon, customizing weapons and ammunition, as well as recognizing, repairing, and maintaining primitive weapons in the field.\n\n#### TABLE P22: RANGE MODIFIERS BY WEAPON TYPE\n\n| Weapon | Short | Medium | Long |\n| :--- | :--- | :--- | :--- |\n| Flintlock Pistol | -1 step | +1 step | +2 steps |\n| Primitive* | -1 step | None | +1 step |\n| Musket | -1 step | None | +1 step |\n\n*\\*Bow, crossbow, sling only.*\n\n---"
    - es:
        name: Armas a distancia primitivas
        description: "Esta habilidad amplia proporciona a un personaje entrenamiento en el uso de armas a distancia primitivas, incluyendo arcos y ballestas, hondas e incluso armas de fuego primitivas como pistolas de chispa y mosquetes.\n\nOtros factores que pueden influir en el dado de situación en un ataque CON armas primitivas a distancia se detallan bajo \"Modificadores de ataque CON armas a distancia\" en la sección de Armas modernas a distancia.\n\n**Conocimiento técnico de armas**: El dominio de las armas a distancia primitivas va mucho más allá de soltar una cuerda o disparar una honda. Los practicantes experimentados — cazadores, arqueros y supervivientes — inevitablemente absorben una comprensión técnica funcional de sus armas. Saben cómo influye el plumado en la trayectoria de las flechas, cómo afecta la rigidez de los brazos de un arco al peso de tracción y cómo reaccionan diferentes materiales a la humedad y el daño. Así como mantenerse informados de las diversas artesanías\
          \ y tipos de armas que existen. Un personaje CON la habilidad amplia de **Ciencia técnica** puede usar la habilidad de especialidad de Armas a distancia primitivas apropiada para las tiradas que impliquen conocer la existencia (y calidad) de un arma concreta, personalizar armas y munición, así como reconocer, reparar y mantener armas primitivas en el campo.\n\n#### TABLA P22: MODIFICADORES DE DISTANCIA POR TIPO DE ARMA\n\n| Arma | Corta | Media | Larga |\n| :--- | :--- | :--- | :--- |\n| Pistola de chispa | -1 paso | +1 paso | +2 pasos |\n| Primitiva* | -1 paso | Nada | +1 paso |\n| Mosquete | -1 paso | Nada | +1 paso |\n\n*\\*Arco, ballesta, honda solamente.*\n\n---\n\n# Habilidades de especialidad"
    items:
      bow:
        attribute: DEX
        cost: 3
        url: /skills/primitive-ranged-weapons#bow
        localized:
        - en:
            name: Bow
            description: "With the bow skill, a character can become proficient with long bows and short bows. Although there are significant differences between them (see Chapter 11: Weapons & Armor for more information), all primitive weapons have the same modifiers for range (see TABLE P22: WEAPON TYPE on this page).\n\nAs a character achieves higher ranks in this specialty, he gains additional abilities as described in \"Ranged Weapons Rank Benefits\" on the next page.\n\n---"
        - es:
            name: Arco
            description: "CON la habilidad de arco, un personaje puede llegar a ser competente CON arcos largos y arcos cortos. Aunque existen diferencias significativas entre ellos (véase el Capítulo 11: Armas y Armaduras para más información), todas las armas primitivas tienen los mismos modificadores de distancia (véase la TABLA P22 en esta página).\n\nA medida que un personaje alcanza rangos superiores en esta especialidad, adquiere capacidades adicionales según se describe en \"Beneficios de rango de armas a distancia\".\n\n---"
      crossbow:
        attribute: DEX
        cost: 3
        url: /skills/primitive-ranged-weapons#crossbow
        localized:
        - en:
            name: Crossbow
            description: "With the crossbow skill, a character can become increasingly more proficient with this type of primitive weapon. This same action to load a crossbow, and it takes one action to fire it. A character obtains higher ranks in this specialty he gains additional abilities as described in \"Ranged Weapons Rank Benefits\" on the next page.\n\n---"
        - es:
            name: Ballesta
            description: "CON la habilidad de ballesta, un personaje puede ser cada vez más competente CON este tipo de arma primitiva. Se requiere una acción para cargar una ballesta y una acción para dispararla. A medida que un personaje obtiene rangos superiores en esta especialidad, adquiere capacidades adicionales según se describe en \"Beneficios de rango de armas a distancia\".\n\n---"
      flintlock:
        attribute: DEX
        cost: 3
        url: /skills/primitive-ranged-weapons#flintlock
        localized:
        - en:
            name: Flintlock
            description: "This specialty skill covers the use of all types of flintlocks, including both pistols and muskets.\n\nAs a character achieves higher ranks in this specialty, he gains additional abilities as described in \"Ranged Weapons Rank Benefits\" on the next page.\n\nIt takes one action to load a flintlock pistol and a separate action to fire the weapon—and it takes a character two actions to load a musket, plus a separate action to fire the weapon. As a character achieves higher ranks in this specialty, he gains additional abilities as described in \"Ranged Weapons Rank Benefits\" on the next page.\n\n---"
        - es:
            name: Arma de chispa
            description: "Esta habilidad de especialidad cubre el uso de todos los tipos de armas de chispa, incluyendo tanto pistolas como mosquetes.\n\nA medida que un personaje alcanza rangos superiores en esta especialidad, adquiere capacidades adicionales según se describe en \"Beneficios de rango de armas a distancia\".\n\nSe requiere una acción para cargar una pistola de chispa y una acción separada para disparar el arma; y a un personaje le lleva dos acciones cargar un mosquete, además de una acción separada para dispararlo.\n\n---"
      sling:
        attribute: DEX
        cost: 3
        url: /skills/primitive-ranged-weapons#sling
        localized:
        - en:
            name: Sling
            description: "With the sling skill, a character can become increasingly more proficient with this type of primitive weapon. A sling can be loaded and fired in this same action by any character. As a character achieves higher ranks in this specialty, he gains additional abilities as described in \"Ranged Weapons Rank Benefits\" on the next page."
        - es:
            name: Honda
            description: "CON la habilidad de honda, un personaje puede ser cada vez más competente CON este tipo de arma primitiva. Una honda puede ser cargada y disparada en la misma acción por cualquier personaje entrenado. A medida que un personaje alcanza rangos superiores en esta especialidad, obtiene capacidades adicionales según se describe en \"Beneficios de rango de armas a distancia\"."
  resolve:
    attribute: WIL
    cost: 6
    category: Other
    url: /skills/resolve
    localized:
    - en:
        name: Resolve
        description: "This broad skill represents a character's inner strength of will. It is the capacity to endure physical hardship, resist mental strain, and stand firm in one's convictions regardless of pressure or temptation. Training in Resolve allows a character to stabilize their mind during high-stress situations and recover more efficiently from the initial shock of bodily trauma.\n\nIt is used to defend against mental stress or attacks, to stand up to physical damage, and to stick to his own mind and convictions.\n\n---"
    - es:
        name: Firmeza
        description: "Esta habilidad amplia representa la fuerza de voluntad interna de un personaje. Es la capacidad de soportar dificultades físicas, resistir la tensión Mental y mantenerse firme en las propias convicciones. El entrenamiento en Firmeza permite a un personaje estabilizar su mente durante situaciones de alto estrés y recuperarse más eficientemente del choque inicial de un trauma corporal.\n\n---\n\n# Habilidades de Especialidad"
    items:
      mental-resolve:
        attribute: WIL
        cost: 3
        url: /skills/resolve#mental-resolve
        localized:
        - en:
            name: Mental resolve
            description: "This specialty skill is used to determine a character's ability to cope with emotional or mental stress of all kinds. The higher the rank, the more resistant he is to emotional trauma, fear, panic, madness, insanity, mind control techniques, and mental powers.\n\nWhen a character is confronted with debilitating effects, he can make a Mental Resolve check to set the trauma aside and act without hindrance.\n\n### Results\n- **Critical Failure:** Character collapses in mental anguish; cannot act or flees for d4 rounds.\n- **Failure:** Character freezes and loses 1 action; receives a +1 penalty to all actions for 1 round.\n- **Ordinary / Good / Amazing:** Character can act without penalty. (Still may have to deal with trauma later).\n\n### Mental Rank Benefits\n\n⊗ **Resistance Modifier:** At higher ranks, the Mental Resolve skill provides an improvement to a character's **Will resistance modifier**, which makes it more difficult for opponents to successfully use encounter\
              \ skills or mental powers against the character. The modifier improves by **+1 at Rank 4**, **+1 at Rank 8**, and **+1 at Rank 12**.\n\n▶ **Extreme Focus:** At rank 4, a character can ignore any penalty to a complex skill check caused by a single distraction (e.g., loud noise, minor pain) per encounter.\n\n---"
        - es:
            name: Firmeza Mental
            description: "La Firmeza Mental representa la capacidad de un personaje para lidiar CON el estrés emocional, psicológico o de otro mundo. Se utiliza para resistir efectos que alteran la mente, mantener la concentración bajo una presión extrema o soportar interrogatorios psicológicos.\n\n| Resultados | Descripción |\n| :--- | :--- |\n| **Ordinario** | El personaje ignora 1 paso de penalización Mental/de estrés. |\n| **Bueno** | El personaje ignora 2 pasos de penalización Mental/de estrés. |\n| **Asombroso** | El personaje ignora 3 pasos de penalización Mental/de estrés. |\n\n⊗ **Modificador de Resistencia:** Mejora el modificador de resistencia de Voluntad del personaje en +1 en el rango 4, +1 adicional en el rango 8 y un último +1 en el rango 12.\n\n▶ **Enfoque Extremo:** En el rango 4, un personaje puede ignorar cualquier penalización a una tirada de habilidad compleja causada por una única distracción (ej. ruido fuerte, dolor menor) por encuentro.\n\n---"
      physical-resolve:
        attribute: WIL
        cost: 3
        url: /skills/resolve#physical-resolve
        localized:
        - en:
            name: Physical resolve
            description: "Physical Resolve is used to determine a character's ability to cope with physical trauma of all kinds. It represents a character's determination to resist physical torture, to press on though tired or in great pain, and to bounce back from physical damage.\n\n### Withstanding Torture\nWhen a character is confronted with physical torture, he can make a Physical Resolve check to determine his reaction. The greater the level of torture, the higher the situation die penalty.\n- **Critical Failure:** The character breaks immediately and reveals everything.\n- **Failure:** The character breaks and reveals at least one important fact.\n- **Ordinary:** The character withstands the torture for **d4 time units** (then makes another check).\n- **Good:** The character withstands for **d6+2 time units**.\n- **Amazing:** The character withstands for **2d4+3 time units**.\n\n### Recovery & Resilience Rank Benefits\n\n⊗ **Knockout Recovery:** A character who falls unconscious due\
              \ to knockout remains in that state for all of the round in which it occurred and all of the next round. After that, he makes a Physical Resolve check to regain consciousness once per round. Success indicates he awakens with an amount of stun damage recovered depending on success (Ordinary: 2, Good: 4, Amazing: 6).\n\n⊗ **Avoiding Exhaustion:** When all of a character's fatigue points are used up, he can attempt a Physical Resolve check to stay conscious. If the check succeeds, he can perform actions for a number of rounds (Ordinary: 1, Good: 2, Amazing: 3).\n\n⊗ **Fatigue Recovery:** The result of a Physical Resolve check determines how many fatigue points a character recovers after a sufficient amount of rest.\n- **Ordinary:** 1 point.\n- **Good:** 2 points.\n- **Amazing:** 3 points."
        - es:
            name: Firmeza Física
            description: "La Firmeza Física permite a un personaje llevar su cuerpo más allá de sus límites normales, lidiando CON el trauma y la fatiga a través de la pura fuerza de voluntad. Se utiliza para ignorar el choque inicial de una lesión o para retrasar la aparición del agotamiento.\n\n### Recuperación de Puntos de Aturdimiento\nAl realizar una acción para estabilizarse, un personaje puede intentar una tirada de Firmeza Física para recuperar puntos de aturdimiento durante una escena de combate.\n\n- **Ordinario:** El personaje recupera 2 puntos de aturdimiento.\n- **Bueno:** El personaje recupera 4 puntos de aturdimiento.\n- **Asombroso:** El personaje recupera 6 puntos de aturdimiento.\n\n### Aguante y Agotamiento\n⊗ **Resistencia a la Fatiga:** Un personaje recibe un **bono de -1 paso** en las tiradas de Aguante/Resistencia por cada 4 rangos en esta especialidad (Máximo -3 en el rango 12).\n\n- **Ordinario:** El personaje puede aguantar la fatiga durante 1 unidad de tiempo adicional.\n\
              - **Bueno:** El personaje puede aguantar la fatiga durante 2 unidades de tiempo adicionales.\n- **Asombroso:** El personaje puede aguantar la fatiga durante 3 unidades de tiempo adicionales.\n\n⊗ **Modificador de Resistencia:** Mejora el modificador de resistencia de Fuerza del personaje en +1 en el rango 4, +1 adicional en el rango 8 y un último +1 en el rango 12."
  security:
    attribute: INT
    cost: 3
    category: Other
    url: /skills/security
    localized:
    - en:
        name: Security
        description: "This broad skill provides a character with basic knowledge of security systems and procedures. This pertains to security systems that protect physical objects or specifically defined areas. (Note that systems of the sort that protect the theft or corruption of computerized data are dealt with under the Computer Science-hacking specialty). \n\nThe complexity of a system relates to how time-consuming it is to get through any and all barriers that lie between an intruder and the object or area that the security system is protecting. For the purpose of determining the situation die modifier for each segment of a complex Security skill check:\n- **Marginal quality:** A situation in which (for example) the character is undisturbed while he's examining or manipulating a type of security system with which he is familiar.\n- **Amazing quality:** One in which (for example) the character and his allies are involved in combat or are under severe time pressure to accomplish their\
          \ goal.\n\n---"
    - es:
        name: Seguridad
        description: "Esta habilidad amplia proporciona a un personaje conocimientos básicos sobre sistemas y procedimientos de seguridad. Se refiere a los sistemas de seguridad que protegen objetos físicos o áreas específicamente definidas. (Ten en cuenta que los sistemas del tipo que protegen contra el robo o la corrupción de datos informatizados se tratan bajo la especialidad de Ciencias de la Computación—hacking).\n\nLa complejidad de un sistema se relaciona CON el tiempo que se tarda en atravesar todas y cada una de las barreras que se encuentran entre un intruso y el objeto o área que el sistema de seguridad protege. Para determinar el modificador del dado de situación para cada segmento de una tirada de habilidad compleja de Seguridad:\n- **Calidad Marginal:** Una situación en la que (por ejemplo) el personaje no es molestado mientras examina o manipula un tipo de sistema de seguridad CON el que está familiarizado.\n- **Calidad Asombrosa:** Una en la que (por ejemplo) el personaje\
          \ y sus aliados están involucrados en combate o bajo una fuerte presión de tiempo para lograr su objetivo.\n\n---\n\n# Habilidades de Especialidad"
    items:
      protection-protocols:
        attribute: INT
        cost: 3
        url: /skills/security#protection-protocols
        localized:
        - en:
            name: Protection protocols
            description: "This skill represents a character's training in protection procedures of all types. It has two principal uses:\n\n### Secure an Area\nWith the proper amount of time and cooperation, a character can set defenses and secure an area to a greater degree than it was before. (Some areas can't be secured or can only be secured with great difficulty, meaning that a situation die penalty applies to the skill check).\n\nThe degree of success on the skill check affects the subsequent **Awareness skill checks** of everyone guarding the area against intruders:\n- **Critical Failure / Failure:** The Awareness checks of the guard(s) are made with a **+1 penalty**.\n- **Ordinary:** Success causes a **-1 bonus** on the Awareness checks.\n- **Good:** A **-2 bonus**.\n- **Amazing:** A **-3 bonus**.\n\n### Analyze Weak Points\nA character can study a secured area (anything from a vehicle to a building to a neighborhood) and look for weak points to exploit. This use of the skill can\
              \ aid the character or another character who is going to force an entry point or try to sneak into the secured area by providing bonuses to those subsequent skill checks.\n\nModifiers to subsequent skill checks are provided according to how well the character succeeds at analyzing the weak points of a secured area:\n- **Failure:** No modifier.\n- **Ordinary success:** -1 bonus.\n- **Good success:** -2 bonus.\n- **Amazing success:** -3 bonus.\n\nThe analysis check is modified by how well the area is secured:\n- **No security:** No modifier.\n- **Marginal security:** +1 penalty.\n- **Ordinary security:** +2 penalty.\n- **Good security:** +3 penalty.\n- **Amazing security:** +4 penalty.\n\n\n\n⊗ **Increased Effect:** As a character achieves higher ranks in this specialty, he receives a situation die bonus on skill checks assisted by it: **-1 step at rank 3**, **-2 steps at rank 6**, **-3 steps at rank 9**, and **-4 steps at rank 12**.\n\n---"
        - es:
            name: Protocolos de Protección
            description: "Esta habilidad representa el entrenamiento de un personaje en procedimientos de protección de todo tipo. Tiene dos usos principales:\n\n### Asegurar un área\nCON la cantidad adecuada de tiempo y cooperación, un personaje puede establecer defensas y asegurar un área en mayor grado de lo que estaba antes. (Algunas áreas no se pueden asegurar o solo se pueden asegurar CON gran dificultad, lo que significa que se aplica una penalización de dado de situación a la tirada de habilidad).\n\nEl grado de éxito en la tirada de habilidad afecta las posteriores **tiradas de habilidad de Alerta** de todos los que vigilen el área contra intrusos:\n- **Fallo Crítico / Fallo:** Las tiradas de Alerta del guardia(s) se realizan CON una **penalización de +1**.\n- **Ordinario:** El éxito provoca una **bonificación de -1** en las tiradas de Alerta.\n- **Bueno:** Una **bonificación de -2**.\n- **Asombroso:** Una **bonificación de -3**.\n\n### Analizar puntos débiles\nUn personaje puede\
              \ estudiar un área asegurada (desde un vehículo hasta un edificio o un vecindario) y buscar puntos débiles para explotar. Este uso de la habilidad puede ayudar al personaje o a otro personaje que vaya a forzar un punto de entrada o intentar colarse en el área asegurada, proporcionando bonificaciones a esas tiradas de habilidad posteriores.\n\nSe proporcionan modificadores a las tiradas de habilidad posteriores según lo bien que el personaje tenga éxito al analizar los puntos débiles de un área asegurada:\n- **Fallo:** Sin modificador.\n- **Éxito Ordinario:** Bonificación de -1.\n- **Éxito Bueno:** Bonificación de -2.\n- **Éxito Asombroso:** Bonificación de -3.\n\nLa tirada de análisis se ve modificada por lo bien que esté asegurada el área:\n- **Sin seguridad:** Sin modificador.\n- **Seguridad marginal:** Penalización de +1.\n- **Seguridad ordinaria:** Penalización de +2.\n- **Seguridad buena:** Penalización de +3.\n- **Seguridad asombrosa:** Penalización de +4.\n\n⊗ **Efecto\
              \ Aumentado:** A medida que un personaje alcanza rangos más altos en esta especialidad, recibe una bonificación de dado de situación en las tiradas de habilidad asistidas por ella: **-1 paso en el rango 3**, **-2 pasos en el rango 6**, **-3 pasos en el rango 9** y **-4 pasos en el rango 12**.\n\n---"
      security-devices:
        attribute: INT
        cost: 4
        url: /skills/security#security-devices
        localized:
        - en:
            name: Security devices
            description: "Using this skill, a character can attempt to bypass all types of mechanical or electronic security. This includes everything from traditional pin-tumbler locks and mechanical safes (picking) to high-tech motion sensors, trip wires, and electronic maglocks. It's also used to set traps, both electronic and mechanical in nature.\n\nOne check can be made per round, and the character making the check is busy for the entire round (no other actions possible). In a situation that isn't taking place in rounds, the time unit changes from rounds to minutes.\n\n⊗ **Increased Effect:** As a character achieves higher ranks in this specialty, he receives a situation die bonus on skill checks assisted by it: **-1 step at rank 3**, **-2 steps at rank 6**, **-3 steps at rank 9**, and **-4 steps at rank 12**."
        - es:
            name: Dispositivos de Seguridad
            description: "Usando esta habilidad, un personaje puede intentar eludir todo tipo de seguridad mecánica o electrónica. Esto incluye desde las tradicionales cerraduras de pernos y cajas fuertes mecánicas (ganzuado) hasta sensores de movimiento de alta tecnología, cables trampa y cierres magnéticos electrónicos (maglocks). También se usa para colocar trampas, tanto de naturaleza electrónica como mecánica.\n\nSe puede realizar una tirada por asalto, y el personaje que realiza la tirada está ocupado durante todo el asalto (no son posibles otras acciones). En una situación que no tenga lugar en asaltos, la unidad de tiempo cambia de asaltos a minutos.\n\n⊗ **Efecto Aumentado:** A medida que un personaje alcanza rangos más altos en esta especialidad, recibe una bonificación de dado de situación en las tiradas de habilidad asistidas por ella: **-1 paso en el rango 3**, **-2 pasos en el rango 6**, **-3 pasos en el rango 9** y **-4 pasos en el rango 12**."
  stamina:
    attribute: CON
    cost: 3
    category: Other
    url: /skills/stamina
    localized:
    - en:
        name: Stamina
        description: "This broad skill measures a character's physical fortitude with regard to the effects of mortal damage and fatigue.\n\n**Note:** This skill is free to human, mechatus, sesheyan, t'sa, and weren characters.\n\n---\n\n### Dying\nA character who has suffered any amount of mortal damage is considered to be dying. At the end of a scene, a dying character (whether conscious or unconscious) makes a Stamina check. \n\n- **Critical Failure:** The character suffers **2 additional points** of mortal damage.\n- **Failure:** The character suffers **1 additional point** of mortal damage.\n- **Ordinary or better:** The character's condition is unchanged.\n\nThe dying character makes additional Stamina checks **once per hour**, until he receives medical aid (see the Medical Science—surgery or Medical Science—treatment descriptions for details). The time between these Stamina checks can be lengthened to once per day if the character is helped by the application of Knowledge—first aid\
          \ or Medical Science—treatment.\n\n---\n\n### Fatigue\nWhen a character engages in certain fatigue-causing activities, he must make a Stamina check. This check is made after the activity takes place, or at set intervals for certain types of activity (see “Fatigue Damage” in the rulebook).\n\n- **Critical Failure:** The character suffers **2 points** of fatigue damage.\n- **Failure:** Indicates **1 point** of damage.\n- **Success:** Indicates that no fatigue damage occurs as a result of the activity just completed.\n\n---"
    - es:
        name: Aguante
        description: "Esta habilidad amplia mide la fortaleza física de un personaje CON respecto a los efectos del daño Mortal y el agotamiento (fatiga).\n\n### Moribundo\nUn personaje que ha sufrido daño Mortal debe realizar una tirada de Aguante al final de una escena y una vez por hora.\n- **Fallo Crítico:** 2 puntos adicionales de daño Mortal.\n- **Fallo:** 1 punto adicional de daño Mortal.\n- **Ordinario o mejor:** Su estado no cambia.\n\n### Agotamiento (Fatiga)\nCuando un personaje realiza ciertas actividades que provocan fatiga, debe realizar una tirada de Aguante.\n- **Fallo Crítico:** 2 puntos de daño por fatiga.\n- **Fallo:** 1 punto de daño por fatiga.\n- **Éxito:** No sufre daño por fatiga."
    items:
      endurance:
        attribute: CON
        cost: 4
        url: /skills/stamina#endurance
        localized:
        - en:
            name: Endurance
            description: "As a character acquires ranks in the endurance skill, he becomes more able to withstand the effects of damage. For a character who has this specialty, endurance checks take the place of Stamina checks for damage and fatigue.\n\n⊗ **Improved Breathing:** The bonus to a character's Stamina-endurance check while holding his or her breath improves to **-2 at rank 4**, **-3 at rank 8**, and **-4 at rank 12**.\n\n---"
        - es:
            name: Resistencia
            description: "{{% list %}}\n\n### Resistencia\nA medida que un personaje adquiere rangos en la habilidad de resistencia, se vuelve más capaz de soportar los efectos del daño. Para un personaje que tiene esta especialidad, las tiradas de resistencia sustituyen a las tiradas de Aguante.\n\n### Resistir el dolor\n*No se puede usar sin estar entrenado.*\n\nResistir el dolor permite a un personaje funcionar CON normalidad e ignorar algunas o todas las penalizaciones de situación por sufrir daño por aturdimiento, heridas o daño Mortal. Una tirada no cuenta como acción.\n\n### Resultados\n- **Fallo Crítico:** El personaje sucumbe al dolor y no puede actuar durante 2d4 fases.\n- **Fallo:** El personaje sufre las penalizaciones por daño.\n- **Ordinario:** El personaje ignora 1 paso de penalización.\n- **Bueno:** El personaje ignora 2 pasos de penalización.\n- **Asombroso:** El personaje ignora 3 pasos de penalización.\n\nResistir el dolor solo disminuye o elimina las penalizaciones de\
              \ situación causadas por el daño acumulado. No convierte una penalización en una bonificación ni evita quedar moribundo o la muerte."
      resist-pain:
        attribute: CON
        cost: 5
        url: /skills/stamina#resist-pain
        localized:
        - en:
            name: Resist pain
            description: "Resist pain allows a character to function normally and ignore some or all of the situation penalties for suffering large amounts of stun, wound, or mortal (but not fatigue) damage.\n\nA character with this specialty may get an opportunity **once per combat scene** to check the effectiveness of his ability to resist pain. The first time during a combat scene when the character has received stun points or wound points, or when he receives at least 1 point of mortal damage, he makes a resist pain skill check. \n\n**Note:** This check does not count as an action, and takes place before any characters attempt any actions. The result of the resist pain check lasts for the rest of the combat scene.\n\n### Results\n- **Critical Failure:** The character succumbed to the pain and **can't act for 2d4 phases**.\n- **Failure:** The character succumbs to the pain and suffers the normal damage penalties.\n- **Ordinary:** The character ignores **1 step** of penalty.\n- **Good:**\
              \ The character ignores **2 steps** of penalty.\n- **Amazing:** The character ignores **3 steps** of penalty.\n\n**Benefit Consolidation:**\nResist pain only helps to lessen or eliminate situation penalties caused by cumulative damage. The benefit a character receives from a successful skill check can't be used to turn a penalty into a bonus. (If a character only has a +1 penalty due to damage when the check is made but the result indicates a reduction of 2 points of penalty, the character gets no immediate benefit from the extra reduction—but it might come into play if he suffers damage later in the scene). Having this skill doesn't help a character stave off dying or death results."
        - es:
            name: Resist pain
            description: "Resist pain allows a Personaje to function normally and ignore some or all of the situation penalties for suffering large amounts of Aturdimiento, Herida, or Mortal (but not Fatiga) damage.\n\nA Personaje with this specialty may get an opportunity **once PER Combate scene** to check the effectiveness of his ability to resist pain. The first time during a Combate scene when the Personaje has received Aturdimiento points or Herida points, or when he receives at least 1 point of Mortal damage, he makes a resist pain skill check. \n\n**Note:** This check does not count as an action, and takes place before any characters attempt any actions. The result of the resist pain check lasts for the rest of the Combate scene.\n\n### Results\n- **Fallo Crítico:** The Personaje succumbed to the pain and **can't act for 2d4 phases**.\n- **Failure:** The Personaje succumbs to the pain and suffers the normal damage penalties.\n- **Ordinario:** The Personaje ignores **1 step** of penalty.\n\
              - **Bueno:** The Personaje ignores **2 steps** of penalty.\n- **Asombroso:** The Personaje ignores **3 steps** of penalty.\n\n**Benefit Consolidation:**\nResist pain only helps to lessen or eliminate situation penalties caused by cumulative damage. The benefit a Personaje receives from a successful skill check can't be used to turn a penalty into a bonus. (If a Personaje only has a +1 penalty due to damage when the check is made but the result indicates a reduction of 2 points of penalty, the Personaje gets no immediate benefit from the extra reduction—but it might come into play if he suffers damage later in the scene). Having this skill doesn't help a Personaje stave off dying or death results."
  street-smart:
    attribute: WIL
    cost: 3
    category: Social
    url: /skills/street-smart
    localized:
    - en:
        name: Street Smart
        description: "This broad skill provides a character with general knowledge in the protocols of \"the street.\" It measures a character's ability to negotiate and make contact with the realm of blue-collar crime, gangs, and illicit dealers. Street Smart and its specialties are encounter skills.\n\n### Street Smart Situation Modifiers\n| Condition | Modifier |\n| :--- | :--- |\n| Society has no law | -3 steps |\n| Society has Good law | +2 steps |\n| Society has Amazing law | +3 steps |\n| Belongs to similar group | -1 step |\n| Belongs to same group | -2 steps |\n| Belongs to opposed group | +3 steps |\n| Has local contact | -1 step |\n| Has Reputation perk | -1 step |\n| Is an obvious stranger | +1 step |\n| Has Infamy flaw | +1 step |\n| Seeks Ordinary assistance | -1 step |\n| Seeks Good assistance | +2 steps |\n| Seeks Amazing assistance | +4 steps |\n\n---"
    - es:
        name: Callejeo
        description: "Esta habilidad general proporciona a un personaje conocimiento de los protocolos para tratar CON pandillas, gente de la calle y organizaciones criminales. Mide la capacidad de un personaje para negociar y establecer contacto CON el reino del criminal de \"cuello azul\" (delincuencia común).\n\nCallejeo y sus especialidades son habilidades de encuentro.\n\n### Escasez y Legalidad\nLos modificadores de situación dependen del objeto o servicio buscado, su legalidad y la conexión CON grupos ilegales:\n- **Marginal:** sin penalización.\n- **Ordinario:** penalización de +1.\n- **Bueno:** penalización de +2.\n- **Asombroso:** penalización de +3."
    items:
      street-knowledge:
        attribute: WIL
        cost: 3
        url: /skills/street-smart#street-knowledge
        localized:
        - en:
            name: Street Knowledge
            description: "This skill enables a character to improve his familiarity with the inner workings of a particular organization or geographical area. Unlike other specialties, it must be purchased separately for each organization or area (e.g., **Street Knowledge—Alpha Colony** or **Street Knowledge—The Void Syndicate**).\n\nA character needs to buy this specialty twice in order to become familiar with how things get done in a specific interstellar organization or interstellar trade union."
        - es:
            name: Habilidades de Especialidad
            description: "{{% list %}}\n- **Elementos Criminales:** Establecer contacto y tratar CON el crimen organizado, criminales profesionales y pandillas.\n- **Conocimiento de la Calle:** Familiaridad CON el funcionamiento interno de una organización o área geográfica en particular."
      criminal-elements:
        attribute: WIL
        cost: 5
        url: /skills/street-smart#criminal-elements
        localized:
        - en:
            name: Criminal elements
            description: "This specialty skill represents a character's ability to make contact with and deal with those who are considered part of the criminal element—organized crime, professional criminals, street gangs, and underworld organizations.\n\nWhenever a character tries to locate or interact with these groups, he uses this skill.\n\n---"
        - es:
            name: Criminal elements
            description: "This specialty skill represents a character's ability to make contact with and deal with those who are considered part of the criminal element—organized crime, professional criminals, street gangs, and underworld organizations.\n\nWhenever a character tries to locate or interact with these groups, he uses this skill.\n\n---"
  survival:
    attribute: CON
    cost: 3
    category: Other
    url: /skills/survival
    localized:
    - en:
        name: Survival
        description: "This broad skill provides a character with training in survival across wilderness, ruined/hostile urban landscapes, and alien biospheres. It covers procuring necessities (food, water, shelter), avoiding environmental hazards, and systematic ecological study.\n\nChecks are made **once each day** unless the GM determines otherwise.\n\n### Survival Results\n- **Failure:** The character can't acquire basic necessities for this day.\n- **Ordinary:** The character acquires enough basic necessities to sustain himself for this day.\n- **Good:** The character acquires enough basic necessities for himself and up to **six others** for this day.\n- **Amazing:** The character becomes so familiar with the locale that survival is no longer an issue unless the situation changes.\n\n---\n\n### Survival Situation Modifiers\nThe type of terrain or environment where the character is located can provide a modifier to the skill check:\n\n| Terrain / Situation | Modifier |\n| :--- | :---\
          \ |\n| **Arctic terrain** | +4 |\n| **Arid or wasteland terrain** | +3 |\n| **Mountainous terrain** | +2 |\n| **Swamp or ocean** | +1 |\n| **Forest or grassland** | 0 |\n| **Dense vegetation** | -1 |\n| **Jungle terrain** | -2 |\n| **Small settlement** | -1 |\n| **Small city or space station** | -2 |\n| **Large city or space station** | -3 |\n\n---"
    - es:
        name: Supervivencia
        description: "Esta habilidad amplia proporciona a un personaje entrenamiento en supervivencia a través de áreas salvajes, paisajes urbanos hostiles o en ruinas, y biosferas alienígenas. Cubre la obtención de necesidades básicas (comida, agua, refugio), la evitación de peligros ambientales y el estudio ecológico sistemático.\n\nLas comprobaciones se realizan **una vez al día**, a menos que el Director de Juego determine lo contrario.\n\n### Resultados de Supervivencia\n- **Fallo:** El personaje no puede adquirir las necesidades básicas para este día.\n- **Ordinario:** El personaje adquiere suficientes necesidades básicas para mantenerse a sí mismo durante este día.\n- **Bueno:** El personaje adquiere suficientes necesidades básicas para sí mismo y hasta **seis más** para este día.\n- **Asombroso:** El personaje se familiariza tanto CON el lugar que la supervivencia ya no es un problema a menos que la situación cambie.\n\n---\n\n### Modificadores de Situación de Supervivencia\nEl tipo\
          \ de terreno o entorno donde se encuentra el personaje puede proporcionar un modificador a la comprobación de habilidad:\n\n| Terreno / Situación | Modificador |\n| :--- | :--- |\n| **Terreno Ártico** | +4 |\n| **Terreno Árido o Yermo** | +3 |\n| **Terreno Montañoso** | +2 |\n| **Pantano u Océano** | +1 |\n| **Bosque o Pradera** | 0 |\n| **Vegetación Densa** | -1 |\n| **Terreno de Selva** | -2 |\n| **Asentamiento Pequeño** | -1 |\n| **Ciudad Pequeña o Estación Espacial** | -2 |\n| **Ciudad Grande o Estación Espacial** | -3 |\n\n---\n\n# Habilidades de Especialidad"
    items:
      survival-training:
        attribute: CON
        cost: 3
        url: /skills/survival#survival-training
        localized:
        - en:
            name: Survival training
            description: ''
        - es:
            name: Apertura de Sendas
            description: "CON la apertura de sendas, un personaje aprende a encontrar caminos a través de terreno difícil o a crear caminos que otros puedan usar para moverse más rápido y cubrir más terreno durante un día completo de viaje. El uso exitoso de esta habilidad reduce los efectos adversos de viajar en condiciones de dificultad Buena o Asombrosa para el personaje y cualquier compañero que viaje CON él.\n\nEsta comprobación de habilidad se realiza una vez al día, al comienzo de un día de viaje.\n\n### Resultados\n- **Fallo Crítico:** El personaje elige una ruta que es peor de lo que los otros viajeros podrían haber encontrado por sí mismos, causando que todos en el grupo sufran una **penalización adicional de +1 a sus comprobaciones de fatiga**, además de cualquier otra penalización.\n- **Fallo:** No se proporciona ayuda.\n- **Éxito Ordinario:** Proporciona una **reducción de 1 paso** a cualquier penalización que se aplique.\n- **Éxito Bueno:** Reduce las penalizaciones en **2\
              \ pasos**.\n- **Éxito Asombroso:** Reduce las penalizaciones en **3 pasos**.\n\nNota: Esta reducción no puede usarse para convertir una penalización en un bono; el mejor resultado posible es anular una penalización por completo.\n\n---\n\n### Notas y Aclaraciones de Supervivencia\n\n*   **Supervivencia Urbana:** Se aplica a entornos urbanos hostiles o en ruinas (zonas de guerra, estaciones espaciales abandonadas) donde las habilidades sociales normales como **Negocios** o **Callejeo** ya no son efectivas para encontrar recursos básicos.\n*   **Deducción Ecológica:** \"Discernir Peligros\" no es solo detectar una trampa; es entender el ecosistema (p. ej., \"La ausencia de los bichos verdes locales indica que un depredador superior está cerca\").\n*   **Ecosistemas Similares:** Los directores de juego pueden reducir la penalización inicial de Adaptabilidad de **+5 pasos a +3 pasos** si el personaje está estudiando un ecosistema sorprendentemente similar a uno que ya ha dominado.\n\
              *   **Interacción CON Equipo:** El equipo especializado de supervivencia o soporte vital (descrito en la sección de Equipo) puede proporcionar bonos de dado de situación a las comprobaciones de supervivencia y adaptabilidad al reducir el estrés ambiental. Barnices, purificadores de agua y domos ambientales pueden satisfacer automáticamente necesidades de refugio o agua.\n*   **Requisitos Biológicos:** La maestría es una comprensión del entorno, no una transformación física. Los mundos sin aire o venenosos aún requieren equipo de protección y fuentes de oxígeno.\n\n---\n\n### Supervivencia en Otros Mundos\nLa habilidad de Supervivencia está diseñada principalmente para entornos similares a la Tierra. Si un personaje está en un mundo alienígena, los modificadores de situación dados aún podrían aplicarse (asumiendo que la flora/fauna local sea comestible). Si un entorno es drásticamente diferente de la experiencia nativa de un personaje, este debe usar la especialidad de **[Adaptabilidad](#adaptabilidad-CON---solo-entrenados)**\
              \ para cerrar la brecha.\n\nEl uso de la habilidad de Supervivencia aún podría ser **imposible** en ciertas situaciones extremas — por ejemplo, un asteroide estéril y sin aire sin el equipo de protección adecuado."
      adaptability:
        attribute: CON
        cost: 3
        url: /skills/survival#adaptability
        localized:
        - en:
            name: Adaptability
            description: "This specialty improves a character’s ability to adapt to alien environments. The character is resourceful enough to grasp unknown survival mechanics through observation and study.\n\n### Mastering Alien Environments\nA character can perform a **Survival—Adaptability** challenge, spend studying the environment (one check per day).\n- **Initial Success:** Allows the character to use their **Survival Training** specialty in the alien environment, but with an **additional +5 step penalty**.\n- **Progression:** For every **3 additional successes** achieved in the challenge, this penalty is reduced by one step (to a minimum of the base terrain modifier).\n- **Mastery:** Once the character reduces the penalty entirely, they have **mastered the terrain** and automatically receive **one rank** in a new **Survival Training** specialty for that specific environment.\n \n A character **cannot buy** or increase their rank in a new terrain type through experience points until\
              \ they have fully mastered it through the Adaptability challenge.\n\n---"
        - es:
            name: Adaptabilidad
            description: "Esta especialidad mejora la capacidad del personaje para adaptarse a entornos alienígenas. El personaje es lo suficientemente ingenioso como para comprender mecánicas de supervivencia desconocidas a través de la observación y el estudio.\n\n### Dominio de Entornos Alienígenas\nUn personaje puede realizar un desafío de **Supervivencia—Adaptabilidad**, pasando tiempo estudiando el entorno (una comprobación por día).\n- **Éxito Inicial:** Permite al personaje usar su especialidad de **Entrenamiento en Supervivencia** en el entorno alienígena, pero CON una **penalización adicional de +5 pasos**.\n- **Progresión:** Por cada **3 éxitos adicionales** logrados en el desafío, esta penalización se reduce en un paso (hasta un mínimo del modificador de terreno base).\n- **Maestría:** Una vez que el personaje reduce la penalización por completo, ha **dominado el terreno** y recibe automáticamente **un rango** en una nueva especialidad de **Entrenamiento en Supervivencia** para\
              \ ese entorno específico.\n\nUn personaje **no puede comprar** o aumentar su rango en un nuevo tipo de terreno a través de puntos de experiencia hasta que lo haya dominado por completo a través del desafío de Adaptabilidad.\n\n---"
      trailblazing:
        attribute: CON
        cost: 3
        url: /skills/survival#trailblazing
        localized:
        - en:
            name: Trailblazing
            description: "With trailblazing, a character learns to find paths through rough terrain or create paths that others can use to move faster and cover more ground during a full day's travel. The successful use of this skill reduces the adverse effects of traveling in conditions of Good or Amazing difficulty for the character and any companions who are traveling with him.\n\nThis skill check is made once per day, at the beginning of a day of travel. \n\n### Results\n- **Critical Failure:** The character picks a route that is worse than the other travelers could have found for themselves, causing everyone in the group to suffer an **additional +1 penalty to their fatigue checks**, on top of any other penalties.\n- **Failure:** No help is provided.\n- **Ordinary success:** Provides a **reduction of 1 step** to any penalties that apply.\n- **Good success:** Reduces penalties by **2 steps**.\n- **Amazing success:** Reduces penalties by **3 steps**.\n\nNote: This reduction can't be used\
              \ to turn a penalty into a bonus; the best possible result is negating a penalty altogether.\n\n---\n\n### Survival on Other Worlds\nThe Survival skill is primarily designed for Earth-like environments. If a character is on an alien world, the given situation modifiers might still apply (assuming local flora/fauna are edible). If an environment is drastically different from a character's native experience, the character should use the **[Adaptability](#adaptability-con---trained-only)** specialty to bridge the gap.\n\nThe use of the Survival skill might still be **impossible** in certain extreme situations—for instance, a barren/airless asteroid without existing protective gear."
        - es:
            name: Trailblazing
            description: "With trailblazing, a character learns to find paths through rough terrain or create paths that others can use to move faster and cover more ground during a full day's travel. The successful use of this skill reduces the adverse effects of traveling in conditions of Good or Amazing difficulty for the character and any companions who are traveling with him.\n\nThis skill check is made once per day, at the beginning of a day of travel. \n\n### Results\n- **Critical Failure:** The character picks a route that is worse than the other travelers could have found for themselves, causing everyone in the group to suffer an **additional +1 penalty to their fatigue checks**, on top of any other penalties.\n- **Failure:** No help is provided.\n- **Ordinary success:** Provides a **reduction of 1 step** to any penalties that apply.\n- **Good success:** Reduces penalties by **2 steps**.\n- **Amazing success:** Reduces penalties by **3 steps**.\n\nNote: This reduction can't be used\
              \ to turn a penalty into a bonus; the best possible result is negating a penalty altogether.\n\n---\n\n### Survival on Other Worlds\nThe Survival skill is primarily designed for Earth-like environments. If a character is on an alien world, the given situation modifiers might still apply (assuming local flora/fauna are edible). If an environment is drastically different from a character's native experience, the character should use the **[Adaptability](#adaptability-con---trained-only)** specialty to bridge the gap.\n\nThe use of the Survival skill might still be **impossible** in certain extreme situations—for instance, a barren/airless asteroid without existing protective gear."
  system-operation:
    attribute: INT
    cost: 3
    category: Technical
    url: /skills/system-operation
    localized:
    - en:
        name: System Operation
        description: "This broad skill provides a character with basic training in the use of spaceship systems other than the helm or piloting systems. (Vehicle Operation covers the actual piloting of a spaceship.) It also applies to other types of vehicles or ground-based installations that use one or more of the specific systems described below in the Specialty Skills section. \n\nThese other vehicles and installations include (but are not limited to) large water vessels such as battleships, military submarines, and cargo ships; jet fighters and large commercial aircraft; and radar outposts and gun emplacements.\n\nFor full details on how **System Operation** skills are used, see the sections on [\"What's in a Spaceship?\"](/core-mechanics/vehicles-and-vessels/) and [\"Space Vehicle Combat\"](/core-mechanics/vehicles-and-vessels#space-vehicle-combat).\n\n---"
    - es:
        name: Operación de Sistemas
        description: "Esta habilidad amplia proporciona a un personaje entrenamiento básico en el uso de sistemas de naves espaciales que no sean el timón o los sistemas de pilotaje. (La Operación de Vehículos cubre el pilotaje real de una nave espacial). También se aplica a otros tipos de vehículos o instalaciones terrestres que utilizan uno o más de los sistemas específicos descritos a continuación en la sección de Habilidades de Especialidad.\n\nEstos otros vehículos e instalaciones incluyen (pero no se limitan a) grandes embarcaciones de agua como acorazados, submarinos militares y buques de carga; aviones de combate y grandes aeronaves comerciales; y puestos de radar y emplazamientos de armas.\n\nPara obtener detalles completos sobre cómo se usan las habilidades de **Operación de Sistemas**, consulte las secciones sobre [\"¿Qué hay en una Nave Espacial?\"](/core-mechanics/vehicles-and-vessels/) y [\"Combate de Vehículos Espaciales\"](/core-mechanics/vehicles-and-vessels#space-vehicle-Combate).\n\
          \n---\n\n# Habilidades de Especialidad"
    items:
      communications:
        attribute: INT
        cost: 3
        url: /skills/system-operation#communications
        localized:
        - en:
            name: Communications
            description: "A communications specialist can operate all shipboard and personal communication gear with precision, attempt to decipher coded communication signals, code outgoing messages, jam external communication and sensor signals, and try to overcome jamming from an outside source.\n\n---"
        - es:
            name: Comunicaciones
            description: "Un especialista en comunicaciones puede operar todos los equipos de comunicación personales y de la nave CON precisión, intentar descifrar señales de comunicación codificadas, codificar mensajes salientes, interferir (jam) señales de comunicación y sensores externos, e intentar superar las interferencias de una fuente externa.\n\n---"
      defenses:
        attribute: INT
        cost: 3
        url: /skills/system-operation#defenses
        localized:
        - en:
            name: Defenses
            description: "A defenses specialist can operate all shipboard defensive systems with precision, attempt to direct defenses to parts of the ship where they're most needed, and analyze attack patterns to make best use of the defenses his ship possesses. In space vehicle combat, the defenses operator can provide a penalty to an opponent's weapons or sensors during any given attack.\n\n---"
        - es:
            name: Defensas
            description: "Un especialista en defensas puede operar todos los sistemas defensivos de la nave CON precisión, intentar dirigir las defensas a las partes de la nave donde son más necesarias, y analizar patrones de ataque para hacer el mejor uso de las defensas que posee su nave. En el combate de vehículos espaciales, el operador de defensas puede proporcionar una penalización a las armas o sensores de un oponente durante cualquier ataque dado.\n\n---"
      engineering:
        attribute: INT
        cost: 3
        url: /skills/system-operation#engineering
        localized:
        - en:
            name: Engineering
            description: "An engineering specialist monitors a ship's electronic and mechanical systems as a whole, watching for fluctuations and other signs that a component is breaking down. He can institute repairs to damaged systems from his station, route power to specific systems, and direct hands-on repairs at remote locations.\n\n---"
        - es:
            name: Ingeniería
            description: "Un especialista en ingeniería monitorea los sistemas electrónicos y mecánicos de una nave en su conjunto, buscando fluctuaciones y otras señales de que un componente se está averiando. Puede realizar reparaciones en sistemas dañados desde su estación, dirigir energía a sistemas específicos y dirigir reparaciones prácticas en ubicaciones remotas.\n\n---"
      sensors:
        attribute: INT
        cost: 3
        url: /skills/system-operation#sensors
        localized:
        - en:
            name: Sensors
            description: "A sensors specialist can operate all shipboard and personal sensor gear with precision, attempt to scan ships or planets, and analyze those readings in a short period of time. He can use the data to provide bonuses to a weapons or defenses operator.\n\n---"
        - es:
            name: Sensores
            description: "Un especialista en sensores puede operar CON precisión todos los equipos de sensores personales y de la nave, intentar escanear naves o planetas, y analizar esas lecturas en un corto período de tiempo. Puede usar los datos para proporcionar bonificaciones a un operador de armas o defensas.\n\n---"
      weapons:
        attribute: INT
        cost: 6
        url: /skills/system-operation#weapons
        localized:
        - en:
            name: Weapons
            description: "A weapons specialist can operate all shipboard weapons systems with precision. In starship combat, the weapons operator picks targets and makes attacks."
        - es:
            name: Armas
            description: "Un especialista en armas puede operar CON precisión todos los sistemas de armas de la nave. En el combate de naves espaciales, el operador de armas elige objetivos y realiza ataques."
  tactics:
    attribute: INT
    cost: 6
    category: Combat
    url: /skills/tactics
    localized:
    - en:
        name: Tactics
        description: "This broad skill provides a character with basic training in and an understanding of tactics and tactical situations. While tactics may come into play in many types of situations, it's most commonly used during infantry combat, space combat, and vehicle combat. \n\nA successful use of the skill provides a penalty to the opponent's next skill check, indicating that you developed a tactical plan and successfully employed it against him.\n\n### Tactics Check Results\n- **Critical Failure:** The opponent sees through your intentions and receives a **-1 bonus** on their next skill check.\n- **Failure:** No modifier to the opponent's next skill check.\n- **Ordinary:** **+1 penalty** to the opponent's next skill check.\n- **Good:** **+2 penalty** to the opponent's next skill check.\n- **Amazing:** **+3 penalty** to the opponent's next skill check.\n\n---"
    - es:
        name: Táctica
        description: "Esta habilidad amplia proporciona a un personaje entrenamiento básico y una comprensión de las tácticas y las situaciones tácticas. Si bien las tácticas pueden entrar en juego en muchos tipos de situaciones, se utilizan más comúnmente durante el combate de infantería, el combate espacial y el combate de vehículos.\n\nEl uso exitoso de la habilidad proporciona una penalización a la siguiente comprobación de habilidad del oponente, lo que indica que desarrollaste un plan táctico y lo empleaste CON éxito contra él.\n\n### Resultados de la Comprobación de Táctica\n- **Fallo Crítico:** El oponente ve a través de tus intenciones y recibe un **bono de -1** en su próxima comprobación de habilidad.\n- **Fallo:** Sin modificador para la próxima comprobación de habilidad del oponente.\n- **Ordinario:** **Penalización de +1** a la siguiente comprobación de habilidad del oponente.\n- **Bueno:** **Penalización de +2** a la siguiente comprobación de habilidad del oponente.\n- **Asombroso:**\
          \ **Penalización de +3** a la siguiente comprobación de habilidad del oponente.\n\n---\n\n# Habilidades de Especialidad"
    items:
      infantry-tactics:
        attribute: INT
        cost: 3
        url: /skills/tactics#infantry-tactics
        localized:
        - en:
            name: Infantry tactics
            description: "The specialty skill covers battlefield strategies when the main component of the battle is individual troops.\n\n⊗ **Increased Effect:** As a character achieves higher ranks in a Tactics specialty skill, he receives a situation die bonus for dealing with opposing forces (infantry, space vessels, or vehicles). The bonus is **-1 step at rank 4**, **-2 steps at rank 8**, and **-3 steps at rank 12**.\n\n---"
        - es:
            name: Táctica de Infantería
            description: "Esta habilidad de especialidad cubre las estrategias de campo de batalla cuando el componente principal de la batalla son las tropas individuales.\n\n⊗ **Efecto Incrementado:** A medida que un personaje alcanza rangos más altos en una especialidad de Táctica, recibe un bono de dado de situación para tratar CON las fuerzas opuestas (infantería, naves espaciales o vehículos). El bono es de **-1 paso al rango 4**, **-2 pasos al rango 8** y **-3 pasos al rango 12**.\n\n---"
      space-tactics:
        attribute: INT
        cost: 3
        url: /skills/tactics#space-tactics
        localized:
        - en:
            name: Space tactics
            description: "Battlefield strategies involving combat between spaceships.\n\n⊗ **Increased Effect:** As a character achieves higher ranks in a Tactics specialty skill, he receives a situation die bonus for dealing with opposing forces. The bonus is **-1 step at rank 4**, **-2 steps at rank 8**, and **-3 steps at rank 12**.\n\n---"
        - es:
            name: Táctica Espacial
            description: "Estrategias de campo de batalla que involucran el combate entre naves espaciales.\n\n⊗ **Efecto Incrementado:** A medida que un personaje alcanza rangos más altos en una especialidad de Táctica, recibe un bono de dado de situación para tratar CON las fuerzas opuestas. El bono es de **-1 paso al rango 4**, **-2 pasos al rango 8** y **-3 pasos al rango 12**.\n\n---"
      vehicle-tactics:
        attribute: INT
        cost: 3
        url: /skills/tactics#vehicle-tactics
        localized:
        - en:
            name: Vehicle tactics
            description: "Battlefield strategies involving combat where vehicles other than starships (air, land, or water) are the main component.\n\n⊗ **Increased Effect:** As a character achieves higher ranks in a Tactics specialty skill, he receives a situation die bonus for dealing with opposing forces. The bonus is **-1 step at rank 4**, **-2 steps at rank 8**, and **-3 steps at rank 12**."
        - es:
            name: Táctica de Vehículos
            description: "Estrategias de campo de batalla que involucran combate donde los vehículos que no son naves espaciales (aire, tierra o agua) son el componente principal.\n\n⊗ **Efecto Incrementado:** A medida que un personaje alcanza rangos más altos en una especialidad de Táctica, recibe un bono de dado de situación para tratar CON las fuerzas opuestas. El bono es de **-1 paso al rango 4**, **-2 pasos al rango 8** y **-3 pasos al rango 12**.\n\n---\n\n### Modificadores de Situación de Táctica\n\n| Situación | Modificador |\n| :--- | :--- |\n| **Usuario de la habilidad involucrado en combate** | +1 paso |\n| **Usuario de la habilidad observando el combate** | 0 |\n| **Oponente familiar** | -1 paso |\n| **Oponente desconocido (misma especie)** | +1 paso |\n| **Oponente desconocido (especie diferente)** | +2 pasos |"
  teach:
    attribute: WIL
    cost: 3
    category: Social
    url: /skills/teach
    localized:
    - en:
        name: Teach
        description: "This broad skill represents a character's ability to instruct others in the use of a skill belonging to the Open group. A skill check is required whenever a character wants to teach a skill to another character.\n\n### Guidance and Costs\nGetting instruction from a teacher can decrease the cost for another character when that character wants to buy or improve a skill.\n- **Teacher Limitation:** A teacher **cannot teach himself** or herself.\n- **Cost Floor:** The cost to buy or improve a skill can **never be decreased to less than 1** skill point.\n- **Student Resource:** The character to be taught must have enough skill points (XP) to purchase the skill at its (possibly reduced) cost.\n\n---\n\n### The Teaching Check\nThe benefit of a teacher depends on the result of the teacher's skill check:\n\n- **Critical Failure:** The student doesn't learn or improve the skill at this time.\n- **Failure:** The student must pay the **full skill cost**.\n- **Ordinary:** The student\
          \ pays **cost -1**.\n- **Good:** The student pays **cost -2**.\n- **Amazing:** The student pays **cost -3**.\n\n### Mentorship Limits\n- **One at a Time:** A teacher can't teach more than one student at a time.\n- **One per Session:** Only one new skill or one rank of improvement can be gained by a student during any teaching session (usually occurring between adventures).\n- **Mastery Limit:** A teacher can only teach a specialty skill up to **one-half of his or her current rank** in that skill. For example, a teacher with Animal Handling—animal training at rank 4 can only teach someone else that skill up to rank 2.\n\n---"
    - es:
        name: Enseñanza
        description: "Esta habilidad amplia representa la capacidad de un personaje para instruir a otros en el uso de una habilidad perteneciente al grupo Abierto o común. Se requiere una comprobación de habilidad cada vez que un personaje desea enseñar una habilidad a otro personaje.\n\n### Orientación y Costes\nRecibir instrucción de un profesor puede disminuir el coste para otro personaje cuando ese personaje desea comprar o mejorar una habilidad.\n- **Limitación del Profesor:** Un profesor **no puede enseñarse a sí mismo**.\n- **Suelo de Coste:** El coste para comprar o mejorar una habilidad **nunca puede disminuir a menos de 1** punto de habilidad.\n- **Recursos del Estudiante:** El personaje que va a recibir la enseñanza debe tener suficientes puntos de habilidad (XP) para comprar la habilidad a su coste (posiblemente reducido).\n\n---\n\n### La Comprobación de Enseñanza\nEl beneficio de un profesor depende del resultado de la comprobación de habilidad del profesor:\n\n- **Fallo Crítico:**\
          \ El estudiante no aprende ni mejora la habilidad en este momento.\n- **Fallo:** El estudiante debe pagar el **coste total de la habilidad**.\n- **Ordinario:** El estudiante paga **coste -1**.\n- **Bueno:** El estudiante paga **coste -2**.\n- **Asombroso:** El estudiante paga **coste -3**.\n\n### Límites de Mentoría\n- **Uno a la vez:** Un profesor no puede enseñar a más de un estudiante a la vez.\n- **Uno por sesión:** Solo se puede ganar una nueva habilidad o un rango de mejora por un estudiante durante cualquier sesión de enseñanza (que generalmente ocurre entre aventuras).\n- **Límite de Maestría:** Un profesor solo puede enseñar una habilidad de especialidad hasta **la mitad de su propio rango actual** en esa habilidad. Por ejemplo, un profesor CON un rango 4 en una habilidad solo puede enseñar a otro personaje hasta el rango 2.\n\n---\n\n# Habilidades de Especialidad"
    items:
      teach-specific-field:
        attribute: WIL
        cost: 3
        url: /skills/teach#teach-specific-field
        localized:
        - en:
            name: Teach, Specific Field
            description: "This specialty skill allows a character to expand their teaching ability to specialized profession groups. For each separate purchase of this specialty skill, the character selects a profession group: **Combat Spec**, **Diplomat**, **Free Agent**, or **Tech Op**. \n\nThe character then becomes able to teach all skills associated with that profession group in addition to those belonging to the Open group. (e.g., a teacher specialized in Combat Spec can help another character learn or improve a Combat Spec skill).\n\n⊗ **Mindwalker Training:** If the optional rules for Psionics are being used, a teacher who also has psionic abilities can teach psionic skills to another character who also has psionic abilities.\n\n---\n\n### Teach Situation Modifiers\n\n| Task / Situation | Modifier |\n| :--- | :--- |\n| **Teaching a broad skill** | +2 steps |\n| **Teaching a specialty skill (to Rank 1-3)** | 0 |\n| **Teaching to Rank 4** | +1 step |\n| **Teaching to Rank 5** | +2\
              \ steps |\n| **Teaching to Rank 6** | +3 steps |\n| **Student is learning a Professional skill** | -1 step |\n| **Student is learning an Out-of-Profession skill** | +2 steps |"
        - es:
            name: Campo Específico
            description: "Esta habilidad de especialidad permite a un personaje ampliar su capacidad de enseñanza a grupos de profesiones especializados. Por cada compra separada de esta habilidad de especialidad, el personaje selecciona un grupo de profesión: **Espec. en Combate**, **Diplomático**, **Agente Libre** o **Espec. Técnico**.\n\nEl personaje entonces puede enseñar todas las habilidades asociadas CON ese grupo de profesión además de las pertenecientes al grupo Abierto. (p. ej., un profesor especializado en Combate puede ayudar a otro personaje a aprender o mejorar una habilidad de Combate).\n\n⊗ **Entrenamiento de Psiónicos:** Si se están utilizando las reglas opcionales de Psiónica, un profesor que también tenga habilidades psiónicas puede enseñar habilidades psiónicas a otro personaje que también posea habilidades psiónicas.\n\n---\n\n### Modificadores de Situación de Enseñanza\n\n| Tarea / Situación | Modificador |\n| :--- | :--- |\n| **Enseñar una habilidad amplia** | +2 pasos\
              \ |\n| **Enseñar una habilidad de especialidad (Rango 1-3)** | 0 |\n| **Enseñar al Rango 4** | +1 paso |\n| **Enseñar al Rango 5** | +2 pasos |\n| **Enseñar al Rango 6** | +3 pasos |\n| **El estudiante está aprendiendo una habilidad de Profesión** | -1 paso |\n| **El estudiante está aprendiendo una habilidad \"Fuera de Profesión\"** | +2 pasos |"
      specific-field:
        attribute: WIL
        cost: 2
        url: /skills/teach#specific-field
        localized:
        - en:
            name: Specific field
            description: ''
        - es:
            name: Specific field
            description: ''
  technical-science:
    attribute: INT
    cost: 7
    category: Technical
    url: /skills/technical-science
    localized:
    - en:
        name: Technical Science
        description: "This broad skill represents a character's training in the technical sciences, including the maintenance, repair, and invention of mechanical and electronic devices (not including computers), and general technical knowledge.\n\nSkill checks made to determine if a character knows a certain piece of technical information, or if he's able to research a question and discover an answer, are made the same way as **Knowledge** skill checks.\n\n---"
    - es:
        name: Ciencia técnica
        description: "Esta habilidad amplia representa el entrenamiento de un personaje en las ciencias técnicas, incluyendo el mantenimiento, reparación e invención de dispositivos mecánicos y electrónicos (sin incluir ordenadores/computadoras), y el conocimiento técnico general.\n\nLas comprobaciones de habilidad realizadas para determinar si un personaje conoce una cierta pieza de información técnica, o si es capaz de investigar una pregunta y descubrir una respuesta, se realizan de la misma manera que las comprobaciones de la habilidad **Conocimiento**.\n\n---\n\n# Habilidades de Especialidad"
    items:
      juryrig:
        attribute: INT
        cost: 3
        url: /skills/technical-science#juryrig
        localized:
        - en:
            name: Juryrig
            description: "This skill enables a character to make fast, patchwork repairs in order to get an electronic or mechanical device or system up and running for a short period of time. A juryrig repair, even when successful, adds difficulty to the full repairs that must be made later, but it can get a character through a sticky situation.\n\nA juryrig repair can be made successfully **once** on a specific system or item. If it breaks down after being juryrigged, the system or item won't work again until it's completely fixed (using Technical Science—repair). Making a juryrig skill check is a single action, but a character who tries to use this skill must do so on his first available action in a round, and he can't attempt any other actions for the rest of the round. \n\n### Juryrig Results\nThe amount of difficulty added to the full repairs depends on the result of the juryrig check:\n- **Critical Failure:** The system or item becomes unusable and can't be made functional again without\
              \ full repairs.\n- **Failure:** The juryrig attempt doesn't work but can be tried again.\n- **Ordinary success:** The system or item becomes operational for **d6+1 time units**, and **3 more successes** are needed for full repairs (in addition to those already required).\n- **Good success:** The system or item becomes operational for **2d4+2 time units**, and **2 more successes** are needed for full repairs.\n- **Amazing success:** The system or item becomes operational for **3d4+2 time units**, and **1 more success** is needed to make full repairs.\n\n⊗ **Improved Juryrig:** When a character reaches **Rank 6**, his ability improves as follows: an Ordinary success produces a Good result, a Good success produces an Amazing result, and an Amazing success means the juryrig works so well that the system or item is considered repaired and in regular working order."
        - es:
            name: Invención
            description: "La invención permite a un personaje construir un componente o sistema electrónico o mecánico desde cero, o modificar un dispositivo existente para que realice una nueva función.\n\nEl uso de esta habilidad requiere tiempo; las comprobaciones de Invención son siempre comprobaciones de habilidad complejas. Modificar un objeto existente puede hacerse en asaltos, pero todos los demás aspectos de la invención requieren horas, días, semanas o meses, según la determinación del Director del Juego.\n\n⊗ **Efecto Incrementado:** A medida que aumenta el rango de habilidad de especialidad de un personaje, este recibe un bono a cualquier comprobación de habilidad que involucre Ciencia Técnica o las otras tres habilidades de especialidad: **bono de -1 paso al rango 3**, **-2 al rango 6**, **-3 al rango 9** y **-4 al rango 12**.\n\n---"
      technical-knowledge:
        attribute: INT
        cost: 3
        url: /skills/technical-science#technical-knowledge
        localized:
        - en:
            name: Technical Knowledge
            description: "This skill represents the study of technology and indicates how up-to-date a character is on techniques or procedures that help him manipulate tools and other devices. It is necessary for a character to use certain sophisticated or potentially dangerous tools, such as a cutting torch, without risking personal injury or damage to the tool.\n\n⊗ **Increased Effect:** As a character’s specialty skill rank increases, he receives a bonus to any skill checks involving Technical Science or the other three specialty skills: **-1 step at rank 3**, **-2 at rank 6**, **-3 at rank 9**, and **-4 at rank 12**.\n\n---\n\n### Technical Science Situation Modifiers\n\n| Situation | Modifier |\n| :--- | :--- |\n| **No tools** | +3 steps |\n| **Minimal tools** | 0 |\n| **Standard toolkit** | -1 step |\n| **Specialized toolkit** | -2 steps |\n| **Darkness** | +3 steps |\n| **Marginal illumination** | +1 step |\n| **Ordinary illumination** | 0 |\n| **Good illumination** | -1 step |\n\
              | **No deadline** | -2 steps |\n| **Reasonable deadline** | 0 |\n| **Tight deadline** | +1 step |\n| **Unreasonable deadline** | +3 steps |"
        - es:
            name: Remendar
            description: "Esta habilidad permite a un personaje realizar reparaciones rápidas y provisionales para poner en funcionamiento un dispositivo o sistema electrónico o mecánico durante un corto período de tiempo. Una reparación de remiendo, incluso cuando tiene éxito, añade dificultad a las reparaciones completas que deben realizarse más adelante, pero puede ayudar a un personaje a salir de una situación difícil.\n\nUna reparación de remiendo se puede realizar CON éxito **una vez** en un sistema u objeto específico. Si se avería después de haber sido remendado, el sistema u objeto no volverá a funcionar hasta que esté completamente arreglado (utilizando Ciencia Técnica—reparación). Realizar una comprobación de habilidad de remiendo es una acción única, pero un personaje que intenta usar esta habilidad debe hacerlo en su primera acción disponible en un asalto, y no puede intentar ninguna otra acción durante el resto del asalto.\n\n### Resultados de Remendar\nLa cantidad de dificultad\
              \ añadida a las reparaciones completas depende del resultado de la comprobación de remiendo:\n- **Fallo Crítico:** El sistema u objeto se vuelve inutilizable y no puede volver a funcionar sin reparaciones completas.\n- **Fallo:** El intento de remiendo no funciona pero se puede intentar de nuevo.\n- **Éxito Ordinario:** El sistema u objeto entra en funcionamiento durante **d6+1 unidades de tiempo**, y se necesitan **3 éxitos más** para las reparaciones completas (además de los que ya se requerían).\n- **Éxito Bueno:** El sistema u objeto entra en funcionamiento durante **2d4+2 unidades de tiempo**, y se necesitan **2 éxitos más** para las reparaciones completas.\n- **Éxito Asombroso:** El sistema u objeto entra en funcionamiento durante **3d4+2 unidades de tiempo**, y se necesita **1 éxito más** para realizar las reparaciones completas.\n\n⊗ **Remendar Mejorado:** Cuando un personaje alcanza el **Rango 6**, su capacidad mejora de la siguiente manera: un éxito Ordinario produce\
              \ un resultado Bueno, un éxito Bueno produce un resultado Asombroso, y un éxito Asombroso significa que el remiendo funciona tan bien que el sistema u objeto se considera reparado y en estado de funcionamiento normal.\n\n---"
      invention:
        attribute: INT
        cost: 3
        url: /skills/technical-science#invention
        localized:
        - en:
            name: Invention
            description: "Invention lets a character build an electronic or mechanical component or system from scratch, or to modify an existing device to perform a new function. \n\nUsing this skill requires time; Invention checks are always complex skill checks. Modifying an existing item may be able to be done in rounds, but all other aspects of invention require hours, days, weeks, or months, depending on the determination of the Gamemaster. \n\n⊗ **Increased Effect:** As a character’s specialty skill rank increases, he receives a bonus to any skill checks involving Technical Science or the other three specialty skills: **-1 step at rank 3**, **-2 at rank 6**, **-3 at rank 9**, and **-4 at rank 12**.\n\n---"
        - es:
            name: Reparación
            description: "Esta habilidad proporciona a un personaje entrenamiento en la reparación y el mantenimiento de varios tipos de tecnología mecánica y electrónica.\n\nCualquier uso de la habilidad de reparación requiere una comprobación de habilidad compleja y toma un período de tiempo determinado por el Director del Juego (minutos, horas, días o semanas). La complejidad de una comprobación de habilidad de reparación está relacionada CON la cantidad de daño que debe repararse:\n- **Daño de Aturdimiento:** Arreglar un objeto CON solo daño de aturdimiento es de complejidad **Ordinaria**.\n- **Daño de Herida:** Arreglar un objeto CON daño de herida es de complejidad **Buena**.\n- **Daño Mortal:** Arreglar un objeto CON cualquier cantidad de daño Mortal es de complejidad **Asombrosa** (y puede requerir más de 10 éxitos).\n\n⊗ **Efecto Incrementado:** A medida que aumenta el rango de habilidad de especialidad de un personaje, este recibe un bono a cualquier comprobación de habilidad que\
              \ involucre Ciencia Técnica o las otras tres habilidades de especialidad: **bono de -1 paso al rango 3**, **-2 al rango 6**, **-3 al rango 9** y **-4 al rango 12**.\n\n---"
      jury-rig:
        attribute: INT
        cost: 3
        url: /skills/technical-science#jury-rig
        localized:
        - en:
            name: Jury-rig
            description: ''
        - es:
            name: Jury-rig
            description: ''
      repair:
        attribute: INT
        cost: 3
        url: /skills/technical-science#repair
        localized:
        - en:
            name: Repair
            description: "This skill provides a character with training in the repair and maintenance of various types of mechanical and electronic technology.\n\nAny use of the repair skill requires a complex skill check and takes a period of time determined by the Gamemaster (minutes, hours, days, or weeks). The complexity of a repair skill check is related to the amount of damage that must be repaired:\n- **Stun Damage:** Fix an object with only stun damage is **Ordinary** complexity.\n- **Wound Damage:** Fix an object with wound damage is **Good** complexity.\n- **Mortal Damage:** Fixing an object with any amount of mortal damage is **Amazing** complexity (and may require 10+ successes).\n\n⊗ **Increased Effect:** As a character’s specialty skill rank increases, he receives a bonus to any skill checks involving Technical Science or the other three specialty skills: **-1 step at rank 3**, **-2 at rank 6**, **-3 at rank 9**, and **-4 at rank 12**.\n\n---"
        - es:
            name: Repair
            description: "This skill provides a character with training in the repair and maintenance of various types of mechanical and electronic technology.\n\nAny use of the repair skill requires a complex skill check and takes a period of time determined by the Gamemaster (minutes, hours, days, or weeks). The complexity of a repair skill check is related to the amount of damage that must be repaired:\n- **Stun Damage:** Fix an object with only stun damage is **Ordinary** complexity.\n- **Wound Damage:** Fix an object with wound damage is **Good** complexity.\n- **Mortal Damage:** Fixing an object with any amount of mortal damage is **Amazing** complexity (and may require 10+ successes).\n\n⊗ **Increased Effect:** As a character’s specialty skill rank increases, he receives a bonus to any skill checks involving Technical Science or the other three specialty skills: **-1 step at rank 3**, **-2 at rank 6**, **-3 at rank 9**, and **-4 at rank 12**.\n\n---"
  vehicle-operation:
    attribute: DEX
    cost: 3
    category: Technical
    url: /skills/vehicle-operation
    localized:
    - en:
        name: Vehicle Operation
        description: "This broad skill provides a character with a basic understanding of and proficiency with modern vehicles. Using this skill, a character can attempt to operate most normal land and water vehicles. Some military or specialized land and water vehicles may have controls that are too complex for the broad skill to cover, requiring at least some level of specialization before a character is able to operate them successfully.\n\nThe ordinary operation of any normal land or water vehicle doesn't require a skill check. During chases, races, or vehicle combat, or when navigating through challenging obstacles, skill checks may be called for.\n\nWhen a character purchases any of the **Vehicle Operation** specialty skills, he selects a specific type of vehicle.\n\nFor more details on vehicles, see the section on [Vehicles and Vessels](/core-mechanics/vehicles-and-vessels/).\n\n---"
    - es:
        name: Operación de Vehículos
        description: "Esta habilidad amplia proporciona a un personaje una comprensión básica y competencia CON los vehículos modernos. Usando esta habilidad, un personaje puede intentar operar la mayoría de los vehículos terrestres y acuáticos normales. Algunos vehículos terrestres y acuáticos militares o especializados pueden tener controles que son demasiado complejos para que la habilidad amplia los cubra, requiriendo al menos algún nivel de especialización antes de que un personaje sea capaz de operarlos CON éxito.\n\nLa operación ordinaria de cualquier vehículo terrestre o acuático normal no requiere una comprobación de habilidad. Durante persecuciones, carreras o combate de vehículos, o cuando se navega a través de obstáculos heroicos, se pueden solicitar comprobaciones de habilidad.\n\nCuando un personaje adquiere cualquiera de las habilidades de especialidad de **Operación de Vehículos**, selecciona un tipo específico de vehículo.\n\nPara más detalles sobre vehículos, consulte la\
          \ sección de [Vehículos y Naves](/core-mechanics/vehicles-and-vessels/).\n\n---\n\n# Habilidades de Especialidad"
    items:
      air-vehicle:
        attribute: DEX
        cost: 5
        url: /skills/vehicle-operation#air-vehicle
        localized:
        - en:
            name: Air vehicle
            description: "This specialty skill enables a character to become trained in the use of a specific type of air vehicle. If he wants to be skilled in the operation of more than one type of air vehicle, he must purchase and improve each specialty skill separately.\n\nTypes of air vehicles include propeller planes, helicopters, private jets, commercial jets, and jet fighters.\n\n---"
        - es:
            name: Vehículo Aéreo
            description: "Esta habilidad de especialidad permite a un personaje estar entrenado en el uso de un tipo específico de vehículo aéreo. Si desea ser experto en la operación de más de un tipo de vehículo aéreo, debe comprar y mejorar cada habilidad de especialidad por separado.\n\nLos tipos de vehículos aéreos incluyen aviones de hélice, helicópteros, jets privados, jets comerciales y aviones de combate.\n\n---"
      land-vehicle:
        attribute: DEX
        cost: 3
        url: /skills/vehicle-operation#land-vehicle
        localized:
        - en:
            name: Land vehicle
            description: "This specialty skill enables a character to become trained in the use of a specific type of land vehicle. If he wants to be skilled in the operation of more than one type of land vehicle, he must purchase and improve each specialty skill separately.\n\nTypes of land vehicles include automobiles, motorcycles, race cars, large trucks, and tanks and other heavy military vehicles.\n\n---"
        - es:
            name: Vehículo Terrestre
            description: "Esta habilidad de especialidad permite a un personaje estar entrenado en el uso de un tipo específico de vehículo terrestre. Si desea ser experto en la operación de más de un tipo de vehículo terrestre, debe comprar y mejorar cada habilidad de especialidad por separado.\n\nLos tipos de vehículos terrestres incluyen automóviles, motocicletas, coches de carreras, camiones grandes y tanques y otros vehículos militares pesados.\n\n---"
      space-vehicle:
        attribute: DEX
        cost: 5
        url: /skills/vehicle-operation#space-vehicle
        localized:
        - en:
            name: Space vehicle
            description: "This specialty skill enables a character to become trained in the use of a specific type of space vehicle. If he wants to be skilled in the operation of more than one type of space vehicle, he must purchase and improve each specialty skill separately. \n\nThis skill is also used to operate the helm of large, multicrewed space vessels. Other systems on space vessels require the specialized functions of the **[System Operation](/skills/system-operation/)** broad skill.\n\nTypes of space vehicles include:\n- **Space fighters:** ships of 10 durability or less.\n- **Scouts and light freighters:** ships of 11–32 durability.\n- **Medium freighters and corvettes:** ships of 33–60 durability.\n- **Capital ships:** ships of 60+ durability.\n\n---"
        - es:
            name: Vehículo Espacial
            description: "Esta habilidad de especialidad permite a un personaje estar entrenado en el uso de un tipo específico de vehículo espacial. Si desea ser experto en la operación de más de un tipo de vehículo espacial, debe comprar y mejorar cada habilidad de especialidad por separado.\n\nEsta habilidad también se usa para operar el timón de naves espaciales grandes CON tripulación múltiple. Otros sistemas en naves espaciales requieren las funciones especializadas de la habilidad amplia de **[Operación de Sistemas](/skills/system-operation/)**.\n\nLos tipos de vehículos espaciales incluyen:\n- **Cazas espaciales:** naves de 10 de durabilidad o menos.\n- **Exploradores y cargueros ligeros:** naves de 11–32 de durabilidad.\n- **Cargueros medios y corbetas:** naves de 33–60 de durabilidad.\n- **Naves capitales:** naves de más de 60 de durabilidad.\n\n---"
      water-vehicle:
        attribute: DEX
        cost: 3
        url: /skills/vehicle-operation#water-vehicle
        localized:
        - en:
            name: Water vehicle
            description: "This specialty skill enables a character to become trained in the use of a specific type of water vehicle. If he wants to be skilled in the operation of more than one type of water vehicle, he must purchase and improve each specialty skill separately. \n\nThis skill is also used to operate the helm of large, multicrewed water vessels (such as battleships, submarines, and oil tankers); these require a version of the specialized functions of the **[System Operation](/skills/system-operation/)** broad skill.\n\nTypes of water vehicles include canoes, rafts and rowboats, powerboats, jet skis, sailboats, large commercial vessels, large military vessels, and submersible craft.\n\n---\n\n### Rank Benefits: Improved Proficiency\n\nAs a character achieves higher ranks in one or more of the **Vehicle Operation** specialty skills, he becomes even more adept at operating the specific types of vehicles he has specialized in. \n\n⊗ **Rank Benefit:** The character receives a situation\
              \ die bonus to checks involving the specialized craft: \n- **-1 step** at rank 4.\n- **-2 step** at rank 8.\n- **-3 step** at rank 12."
        - es:
            name: Vehículo Acuático
            description: "Esta habilidad de especialidad permite a un personaje estar entrenado en el uso de un tipo específico de vehículo acuático. Si desea ser experto en la operación de más de un tipo de vehículo acuático, debe comprar y mejorar cada habilidad de especialidad por separado.\n\nEsta habilidad también se usa para operar el timón de naves acuáticas grandes CON tripulación múltiple (como acorazados, submarinos y petroleros); estos requieren una versión de las funciones especializadas de la habilidad amplia de **[Operación de Sistemas](/skills/system-operation/)**.\n\nLos tipos de vehículos acuáticos incluyen canoas, balsas y botes de remos, lanchas motoras, motos de agua, veleros, grandes barcos comerciales, grandes barcos militares y embarcaciones sumergibles.\n\n---\n\n### Beneficios de Rango: Competencia Mejorada\n\nA medida que un personaje alcanza rangos más altos en una o más de las habilidades de especialidad de **Operación de Vehículos**, se vuelve aún más adepto\
              \ a operar los tipos específicos de vehículos en los que se ha especializado.\n\n⊗ **Beneficio de Rango:** El personaje recibe un bono de dado de situación a las comprobaciones que involucran el vehículo especializado:\n- **-1 paso** al rango 4.\n- **-2 pasos** al rango 8.\n- **-3 pasos** al rango 12."
