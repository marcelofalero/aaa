            name: Teach, Specific Field
            description: |-
              This specialty skill allows a character to expand their teaching ability to specialized profession groups. For each separate purchase of this specialty skill, the character selects a profession group: **Combat Spec**, **Diplomat**, **Free Agent**, or **Tech Op**. The character then becomes able to teach all skills associated with that profession group in addition to those belonging to the Open group. (e.g., a teacher specialized in Combat Spec can help another character learn or improve a Combat Spec skill).
              ### Rank Benefits
              ▶ **Rank 1, 4, 5, 6 [Mindwalker Training]:** If the optional rules for Psionics are being used, a teacher who also has psionic abilities can teach psionic skills to another character who also has psionic abilities.
              ### Teach Situation Modifiers
              | Task / Situation | Modifier | | :--- | :--- | | **Teaching a broad skill** | +2 steps | | **Teaching a specialty skill (to Rank 1-3)** | 0 | | **Teaching to Rank 4** | +1 step | | **Teaching to Rank 5** | +2 steps | | **Teaching to Rank 6** | +3 steps | | **Student is learning a Professional skill** | -1 step | | **Student is learning an Out-of-Profession skill** | +2 steps |
        - es:
            name: Campo Específico
            description: |-
              Esta habilidad de especialidad permite a un personaje ampliar su capacidad de enseñanza a grupos de profesiones especializados. Por cada compra separada de esta habilidad de especialidad, el personaje selecciona un grupo de profesión: **Espec. en Combate**,
              **Diplomático**, **Agente Libre** o **Espec. Técnico**. El personaje entonces puede enseñar todas las habilidades asociadas CON ese grupo de profesión además de las pertenecientes al grupo Abierto. (p. ej., un profesor especializado en Combate puede ayudar a otro personaje a aprender o mejorar una habilidad de Combate).
              ⊗ **Entrenamiento de Psiónicos:** Si se están utilizando las reglas opcionales de Psiónica, un profesor que también tenga habilidades psiónicas puede enseñar habilidades psiónicas a otro personaje que también posea habilidades psiónicas.
              ### Modificadores de Situación de Enseñanza
              | Tarea / Situación | Modificador | | :--- | :--- | | **Enseñar una habilidad amplia** | +2 pasos | | **Enseñar una habilidad de especialidad (Rango 1-3)** | 0 | | **Enseñar al Rango 4** | +1 paso | | **Enseñar al Rango 5** | +2 pasos | | **Enseñar al Rango 6** | +3 pasos | | **El estudiante está aprendiendo una habilidad de Profesión** | -1 paso | | **El estudiante está aprendiendo una habilidad "Fuera de Profesión"** | +2 pasos |
