        attribute: WIL
        cost: 2
        url: /skills/law#law-specific-skill
        localized:
        - en:
            name: Law, specific skill
            description: |-
              For each separate purchase of this specialty, a character selects a specific culture or a specific type of law (maritime law, salvage law, etc.). As the specialty skill is improved, the character gains a progressively stronger grasp on the laws and legal systems of that culture or specialty.
              ### Rank Benefits
              ⊗ **Rank 3, 6, 9, 12 [Increased Effect]:** At higher ranks, the character becomes more proficient within the legal system of the culture in question. Using the specific skill provides a reduction to the situation die:
              - **-1 bonus at Rank 3**
              - **-2 bonus at Rank 6**
              - **-3 bonus at Rank 9**
              - **-4 bonus at Rank 12**
        - es:
            name: Ley, habilidad específica
            description: |-
              Por cada compra separada de esta especialidad, un personaje selecciona una cultura específica o un tipo específico de ley (ley marítima, ley de salvamento, etc.). A medida que se mejora la habilidad de especialidad, el personaje adquiere un conocimiento progresivamente más sólido de las leyas y sistemas legales de esa cultura o especialidad.
              ⊗ **Efecto incrementado:** En rangos más altos, el personaje se vuelve más competente dentro del sistema legal de la cultura en cuestión. El uso de la habilidad específica proporciona una reducción al dado de situación:
              - **bonificación de -1 al rango 3**
              - **bonificación de -2 al rango 6**
              - **bonificación de -3 al rango 9**
              - **bonificación de -4 al rango 12**
        trained_only: true
        rank_benefits:
        - rank: 3
          title: Increased Effect
        - rank: 6
          title: Increased Effect
        - rank: 9
          title: Increased Effect
        - rank: 12
          title: Increased Effect
