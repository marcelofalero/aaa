  primitive-ranged-weapons:
    attribute: DEX
    cost: 7
    category: Combat
    url: /skills/primitive-ranged-weapons
    localized:
      - en:
          name: Primitive Ranged Weapons
          description: |-
            This broad skill provides a character with training in the use of primitive ranged weapons, including bows and crossbows, slings, and even primitive firearms such as flintlock pistols and rifles. Other factors that can influence the situation die used in a primitive ranged weapon attack are listed under "Ranged Weapon Attack Modifiers" in the Modern Ranged Weapons skill section.
            **Weapon Technical Knowledge**: Mastery of primitive ranged weapons goes far beyond pulling a trigger or releasing a string. Experienced practitioners — hunters, archers, and survivalists — inevitably absorb a working technical understanding of their weapons. They know how the feathering affects arrow trajectories, how the stiffness of a bow''s limbs affects draw weight, and how different materials react to humidity and damage. As well as keeping informed of the various craftsmanship and weapon types that exist. A character with the
            **Technical Science** broad skill can use the appropriate Primitive Ranged Weapons specialty skill for checks that involve knowing the existence (and quality) of a particular weapon, customizing weapons and ammunition, as well as recognizing, repairing, and maintaining primitive weapons in the field.
            #### TABLE P22: RANGE MODIFIERS BY WEAPON TYPE
            | Weapon | Short | Medium | Long | | :--- | :--- | :--- | :--- | | Flintlock Pistol | -1 step | +1 step | +2 steps | | Primitive* | -1 step | None | +1 step | | Musket | -1 step | None | +1 step |
            *\*Bow, crossbow, sling only.*
      - es:
          name: Armas a distancia primitivas
          description: |-
            Esta amplia habilidad proporciona al personaje entrenamiento en el uso de armas a distancia primitivas, incluidos arcos y ballestas, hondas e incluso armas de fuego primitivas como pistolas de chispa y rifles. Otros factores que pueden influir en la situación utilizada en un ataque primitivo con armas a distancia se enumeran en "Modificadores de ataques con armas a distancia" en la sección de habilidades de armas a distancia modernas.
            **Conocimiento técnico sobre armas**: el dominio de las armas a distancia primitivas va mucho más allá de apretar un gatillo o soltar una cuerda. Los practicantes experimentados (cazadores, arqueros y supervivientes) inevitablemente adquieren una comprensión técnica práctica de sus armas. Saben cómo el difuminado afecta las trayectorias de las flechas, cómo la rigidez de las palas de un arco afecta el peso del arco y cómo reaccionan los diferentes materiales a la humedad y los daños. Así como también mantenerse informado de las diversas artesanías y tipos de armas que existen. Un personaje con el
            **Ciencia técnica** La habilidad amplia puede utilizar la habilidad especializada de Armas primitivas a distancia apropiada para comprobaciones que implican conocer la existencia (y calidad) de un arma en particular, personalizar armas y municiones, así como reconocer, reparar y mantener armas primitivas en el campo.
            #### TABLA P22: MODIFICADORES DE ALCANCE POR TIPO DE ARMA
            | Arma | Corto | Medio | Largo | | :--- | :--- | :--- | :--- | | Pistola de chispa | -1 paso | +1 paso | +2 pasos | | Primitivo* | -1 paso | Ninguno | +1 paso | | Mosquete | -1 paso | Ninguno | +1 paso |
            *\*Solo arco, ballesta y honda.*
    items:
      bow:
        attribute: DEX
        cost: 3
        url: /skills/primitive-ranged-weapons#bow
        localized:
          - en:
              name: Bow
              description: |-
                With the bow skill, a character can become proficient with long bows and short bows. Although there are significant differences between them (see Chapter 11: Weapons & Armor for more information), all primitive weapons have the same modifiers for range (see TABLE P22: WEAPON TYPE on this page). As a character achieves higher ranks in this specialty, he gains additional abilities as described in "Ranged Weapons Rank Benefits" on the next page.
          - es:
              name: Arco
              description: |-
                con la habilidad del arco, un personaje puede volverse competente con arcos largos y cortos. Aunque existen diferencias significativas entre ellas (consulte el Capítulo 11: Armas y armaduras para obtener más información), todas las armas primitivas tienen los mismos modificadores de alcance (consulte la TABLA P22: TIPO DE ARMA en esta página). A medida que un personaje alcanza rangos más altos en esta especialidad, obtiene habilidades adicionales como se describe en "Beneficios de rango de armas a distancia" en la página siguiente.
        trained_only: false
      crossbow:
        attribute: DEX
        cost: 3
        url: /skills/primitive-ranged-weapons#crossbow
        localized:
          - en:
              name: Crossbow
              description: |-
                With the crossbow skill, a character can become increasingly more proficient with this type of primitive weapon. This same action to load a crossbow, and it takes one action to fire it. A character obtains higher ranks in this specialty he gains additional abilities as described in "Ranged Weapons Rank Benefits" on the next page.
          - es:
              name: Ballesta
              description: |-
                con la habilidad de ballesta, un personaje puede volverse cada vez más competente con este tipo de arma primitiva. Esta misma acción para cargar una ballesta, y se necesita una acción para dispararla. Un personaje obtiene rangos más altos en esta especialidad y obtiene habilidades adicionales como se describe en "Beneficios de rango de armas a distancia" en la página siguiente.
        trained_only: false
      flintlock:
        attribute: DEX
        cost: 3
        url: /skills/primitive-ranged-weapons#flintlock
        localized:
          - en:
              name: Flintlock
              description: |-
                This specialty skill covers the use of all types of flintlocks, including both pistols and muskets. As a character achieves higher ranks in this specialty, he gains additional abilities as described in "Ranged Weapons Rank Benefits" on the next page. It takes one action to load a flintlock pistol and a separate action to fire the weapon—and it takes a character two actions to load a musket, plus a separate action to fire the weapon. As a character achieves higher ranks in this specialty, he gains additional abilities as described in "Ranged Weapons Rank Benefits" on the next page.
          - es:
              name: Arma de chispa
              description: |-
                Esta habilidad especializada cubre el uso de todo tipo de armas de chispa, incluidas pistolas y mosquetes. A medida que un personaje alcanza rangos más altos en esta especialidad, obtiene habilidades adicionales como se describe en "Beneficios de rango de armas a distancia" en la página siguiente. Se necesita una acción para cargar una pistola de chispa y una acción separada para disparar el arma, y ​​un personaje necesita dos acciones para cargar un mosquete, más una acción separada para disparar el arma. A medida que un personaje alcanza rangos más altos en esta especialidad, obtiene habilidades adicionales como se describe en "Beneficios de rango de armas a distancia" en la página siguiente.
        trained_only: false
      sling:
        attribute: DEX
        cost: 3
        url: /skills/primitive-ranged-weapons#sling
        localized:
          - en:
              name: Sling
              description: |-
                With the sling skill, a character can become increasingly more proficient with this type of primitive weapon. A sling can be loaded and fired in this same action by any character. As a character achieves higher ranks in this specialty, he gains additional abilities as described in "Ranged Weapons Rank Benefits" on the next page.
          - es:
              name: Honda
              description: |-
                con la habilidad de cabestrillo, un personaje puede volverse cada vez más competente con este tipo de arma primitiva. Cualquier personaje puede cargar y disparar una honda en esta misma acción. A medida que un personaje alcanza rangos más altos en esta especialidad, obtiene habilidades adicionales como se describe en "Beneficios de rango de armas a distancia" en la página siguiente.
        trained_only: false
    trained_only: false
  resolve:
    attribute: WIL
    cost: 6
    category: Other
    url: /skills/resolve
    localized:
      - en:
          name: Resolve
          description: |-
            This broad skill represents a character''s inner strength of will. It is the capacity to endure physical hardship, resist mental strain, and stand firm in one''s convictions regardless of pressure or temptation. Training in Resolve allows a character to stabilize their mind during high-stress situations and recover more efficiently from the initial shock of bodily trauma. It is used to defend against mental stress or attacks, to stand up to physical damage, and to stick to his own mind and convictions.
      - es:
          name: Firmeza
          description: |-
            Esta amplia habilidad representa la fuerza de voluntad interna de un personaje. Es la capacidad de soportar dificultades físicas, resistir la tensión Mental y mantenerse firme en sus convicciones independientemente de la presión o la tentación. Entrenar en Firmeza permite a un personaje estabilizar su mente durante situaciones de alto estrés y recuperarse más eficientemente del impacto inicial del trauma corporal. Se utiliza para defenderse del estrés o ataques mentales, para resistir daños físicos y para apegarse a su propia mente y convicciones.
    items:
      mental-resolve:
        attribute: WIL
        cost: 3
        url: /skills/resolve#mental-resolve
        localized:
          - en:
              name: Mental resolve
              description: |-
                This specialty skill is used to determine a character''s ability to cope with emotional or mental stress of all kinds. The higher the rank, the more resistant he is to emotional trauma, fear, panic, madness, insanity, mind control techniques, and mental powers. When a character is confronted with debilitating effects, he can make a Mental Resolve check to set the trauma aside and act without hindrance.
                ### Results
                - **Critical Failure:** Character collapses in mental anguish; cannot act or flees for d4 rounds.
                - **Failure:** Character freezes and loses 1 action; receives a +1 penalty to all actions for 1 round.
                - **Ordinary / Good / Amazing:** Character can act without penalty. (Still may have to deal with trauma later).
                ### Mental Rank Benefits
                ⊗ **Resistance Modifier:** At higher ranks, the Mental Resolve skill provides an improvement to a character''s **Will resistance modifier**, which makes it more difficult for opponents to successfully use encounter skills or mental powers against the character. The modifier improves by **+1 at Rank 4**, **+1 at Rank 8**, and **+1 at Rank 12**.
                ▶ **Extreme Focus:** At rank 4, a character can ignore any penalty to a complex skill check caused by a single distraction (e.g., loud noise, minor pain) per encounter.
          - es:
              name: Firmeza Mental
              description: |-
                Esta habilidad especializada se utiliza para determinar la capacidad de un personaje para afrontar el estrés emocional o Mental de todo tipo. Cuanto más alto sea el rango, más resistente será al trauma emocional, el miedo, el pánico, la locura, las técnicas de control Mental y los poderes mentales. Cuando un personaje se enfrenta a efectos debilitantes, puede realizar una prueba de Resolución Mental para dejar de lado el trauma y actuar sin obstáculos.
                ### Resultados
                - **Fracaso crítico:** El personaje colapsa en angustia Mental; no puede actuar o huye durante d4 asaltos.
                - **Error:** El personaje se congela y pierde 1 acción; recibe una penalización de +1 a todas las acciones durante 1 ronda.
                - **Ordinario / Bueno / Increíble:** El personaje puede actuar sin penalización. (Es posible que aún tenga que lidiar con el trauma más adelante).
                ### Beneficios de rango Mental
                ⊗ **Modificador de resistencia:** En rangos superiores, la habilidad Resolución Mental proporciona una mejora al **modificador de resistencia de voluntad** de un personaje, lo que hace que sea más difícil para los oponentes usar con éxito habilidades de encuentro o poderes mentales contra el personaje. El modificador mejora en **+1 en el rango 4**, **+1 en el rango 8** y **+1 en el rango 12**.
                ▶ **Enfoque extremo:** En el rango 4, un personaje puede ignorar cualquier penalización a una prueba de habilidad compleja causada por una sola distracción (por ejemplo, ruido fuerte, dolor leve) por encuentro.
        trained_only: false
        rank_benefits:
          - rank: 4
            title: Resistance Modifier
          - rank: 8
            title: Resistance Modifier
          - rank: 12
            title: Resistance Modifier
      physical-resolve:
        attribute: WIL
        cost: 3
        url: /skills/resolve#physical-resolve
        localized:
          - en:
              name: Physical resolve
              description: |-
                Physical Resolve is used to determine a character''s ability to cope with physical trauma of all kinds. It represents a character''s determination to resist physical torture, to press on though tired or in great pain, and to bounce back from physical damage.
                ### Withstanding Torture
                When a character is confronted with physical torture, he can make a Physical Resolve check to determine his reaction. The greater the level of torture, the higher the situation die penalty.
                - **Critical Failure:** The character breaks immediately and reveals everything.
                - **Failure:** The character breaks and reveals at least one important fact.
                - **Ordinary:** The character withstands the torture for **d4 time units** (then makes another check).
                - **Good:** The character withstands for **d6+2 time units**.
                - **Amazing:** The character withstands for **2d4+3 time units**.
                ### Recovery & Resilience Rank Benefits
                ⊗ **Knockout Recovery:** A character who falls unconscious due to knockout remains in that state for all of the round in which it occurred and all of the next round. After that, he makes a Physical Resolve check to regain consciousness once per round. Success indicates he awakens with an amount of stun damage recovered depending on success (Ordinary: 2, Good: 4, Amazing: 6).
                ⊗ **Avoiding Exhaustion:** When all of a character''s fatigue points are used up, he can attempt a Physical Resolve check to stay conscious. If the check succeeds, he can perform actions for a number of rounds (Ordinary: 1, Good: 2, Amazing: 3).
                ⊗ **Fatigue Recovery:** The result of a Physical Resolve check determines how many fatigue points a character recovers after a sufficient amount of rest.
                - **Ordinary:** 1 point.
                - **Good:** 2 points.
                - **Amazing:** 3 points.
          - es:
              name: Firmeza Física
              description: |-
                Resolución física se utiliza para determinar la capacidad de un personaje para afrontar traumas físicos de todo tipo. Representa la determinación de un personaje de resistir la tortura física, seguir adelante aunque esté cansado o con mucho dolor y recuperarse del daño físico.
                ### Resistir la tortura
                Cuando un personaje se enfrenta a una tortura física, puede realizar una prueba de Resolución Física para determinar su reacción. Cuanto mayor sea el nivel de tortura, mayor será la situación de pena.
                - **Fallo Crítico:** El personaje se rompe inmediatamente y revela todo.
                - **Fracaso:** El personaje se rompe y revela al menos un hecho importante.
                - **Ordinario:** El personaje resiste la tortura durante **d4 unidades de tiempo** (luego realiza otra prueba).
                - **Bueno:** El personaje resiste **d6+2 unidades de tiempo**.
                - **Asombroso:** El personaje resiste **2d4+3 unidades de tiempo**.
                ### Beneficios del rango de recuperación y resiliencia
                ⊗ **Recuperación del nocaut:** Un personaje que cae inconsciente debido a un nocaut permanece en ese estado durante toda la ronda en la que ocurrió y toda la siguiente ronda. Después de eso, realiza una prueba de Resolución Física para recuperar la conciencia una vez por ronda. El éxito indica que se despierta con una cantidad de daño por aturdimiento recuperado dependiendo del éxito (Ordinario: 2, Bueno: 4, Increíble: 6).
                ⊗ **Evitar el agotamiento:** Cuando todos los puntos de fatiga de un personaje se agotan, puede intentar una prueba de Resolución física para mantenerse consciente. Si la prueba tiene éxito, puede realizar acciones durante varias rondas (Ordinaria: 1, Buena: 2, Increíble: 3).
                ⊗ **Recuperación de fatiga:** El resultado de una prueba de Resolución física determina cuántos puntos de fatiga recupera un personaje después de una cantidad suficiente de descanso.
                - **Ordinario:** 1 punto.
                - **Bien:** 2 puntos.
                - **Increíble:** 3 puntos.
        trained_only: false
        rank_benefits:
          - rank: 0
            title: Knockout Recovery
    trained_only: false
  security:
    attribute: WIL
    cost: 3
    category: Other
    url: /skills/security
    localized:
      - en:
          name: Security
          description: |-
            This broad skill provides a character with basic knowledge of security systems and procedures. This pertains to security systems that protect physical objects or specifically defined areas. (Note that systems of the sort that protect the theft or corruption of computerized data are dealt with under the Computer Science-hacking specialty). The complexity of a system relates to how time-consuming it is to get through any and all barriers that lie between an intruder and the object or area that the security system is protecting. For the purpose of determining the situation die modifier for each segment of a complex Security skill check:
            - **Marginal quality:** A situation in which (for example) the character is undisturbed while he''s examining or manipulating a type of security system with which he is familiar.
            - **Amazing quality:** One in which (for example) the character and his allies are involved in combat or are under severe time pressure to accomplish their goal.
      - es:
          name: Seguridad
          description: |-
            Esta amplia habilidad proporciona al personaje un conocimiento básico de los sistemas y procedimientos de seguridad. Se trata de sistemas de seguridad que protegen objetos físicos o áreas específicamente definidas. (Tenga en cuenta que los sistemas del tipo que protegen contra el robo o la corrupción de datos computarizados se tratan en la especialidad de piratería informática). La complejidad de un sistema se relaciona con el tiempo que lleva atravesar todas y cada una de las barreras que se encuentran entre un intruso y el objeto o área que protege el sistema de seguridad. con el fin de determinar el modificador del dado de situación para cada segmento de una prueba de habilidad de seguridad compleja:
            - **Cualidad marginal:** Una situación en la que (por ejemplo) el personaje no es molestado mientras examina o manipula un tipo de sistema de seguridad con el que está familiarizado.
            - **Calidad increíble:** Uno en el que (por ejemplo) el personaje y sus aliados están involucrados en combate o están bajo una gran presión de tiempo para lograr su objetivo.
    items:
      protection-protocols:
        attribute: WIL
        cost: 3
        url: /skills/security#protection-protocols
        localized:
          - en:
              name: Protection protocols
              description: |-
                This skill represents a character''s training in protection procedures of all types. It has two principal uses:
                ### Secure an Area
                With the proper amount of time and cooperation, a character can set defenses and secure an area to a greater degree than it was before. (Some areas can''t be secured or can only be secured with great difficulty, meaning that a situation die penalty applies to the skill check). The degree of success on the skill check affects the subsequent
                **Awareness skill checks** of everyone guarding the area against intruders:
                - **Critical Failure / Failure:** The Awareness checks of the guard(s) are made with a **+1 penalty**.
                - **Ordinary:** Success causes a **-1 bonus** on the Awareness checks.
                - **Good:** A **-2 bonus**.
                - **Amazing:** A **-3 bonus**.
                ### Analyze Weak Points
                A character can study a secured area (anything from a vehicle to a building to a neighborhood) and look for weak points to exploit. This use of the skill can aid the character or another character who is going to force an entry point or try to sneak into the secured area by providing bonuses to those subsequent skill checks. Modifiers to subsequent skill checks are provided according to how well the character succeeds at analyzing the weak points of a secured area:
                - **Failure:** No modifier.
                - **Ordinary success:** -1 bonus.
                - **Good success:** -2 bonus.
                - **Amazing success:** -3 bonus. The analysis check is modified by how well the area is secured:
                - **No security:** No modifier.
                - **Marginal security:** +1 penalty.
                - **Ordinary security:** +2 penalty.
                - **Good security:** +3 penalty.
                - **Amazing security:** +4 penalty.
                ⊗ **Increased Effect:** As a character achieves higher ranks in this specialty, he receives a situation die bonus on skill checks assisted by it: **-1 step at rank 3**, **-2 steps at rank 6**, **-3 steps at rank 9**, and **-4 steps at rank 12**.
          - es:
              name: Protocolos de Protección
              description: |-
                Esta habilidad representa el entrenamiento de un personaje en procedimientos de protección de todo tipo. Tiene dos usos principales:
                ### Proteger un área con la cantidad adecuada de tiempo y cooperación, un personaje puede establecer defensas y asegurar un área en mayor medida que antes. (Algunas áreas no se pueden asegurar o sólo se pueden asegurar con gran dificultad, lo que significa que se aplica una penalización de situación a la prueba de habilidad). El grado de éxito en la prueba de habilidad afecta el posterior
                **Verificaciones de habilidades de concientización** de todos los que protegen el área contra intrusos:
                - **Fallo Crítico/Falla:** Las pruebas de Conciencia del/los guardia(s) se realizan con una **penalización +1**.
                - **Ordinario:** El éxito provoca una **bonificación -1** en las pruebas de Conciencia.
                - **Bueno:** Un **bono -2**.
                - **Increíble:** Un **bono -3**.
                ### Analizar puntos débiles
                Un personaje puede estudiar un área segura (cualquier cosa, desde un vehículo hasta un edificio o un vecindario) y buscar puntos débiles para explotar. Este uso de la habilidad puede ayudar al personaje u otro personaje que va a forzar un punto de entrada o intentar colarse en el área segura proporcionando bonificaciones a las pruebas de habilidad posteriores. Se proporcionan modificadores a las pruebas de habilidad posteriores de acuerdo con qué tan bien el personaje logra analizar los puntos débiles de un área asegurada:
                - **Fallo:** Sin modificador.
                - **Éxito ordinario:** -1 bonificación.
                - **Buen éxito:** -2 bonificación.
                - **Éxito increíble:** -3 de bonificación. La verificación del análisis se modifica según qué tan bien esté asegurada el área:
                - **Sin seguridad:** Sin modificador.
                - **Seguridad marginal:** +1 de penalización.
                - **Seguridad ordinaria:** Penalización +2.
                - **Buena seguridad:** Penalización +3.
                - **Increíble seguridad:** penalización +4.
                ⊗ **Efecto aumentado:** A medida que un personaje alcanza rangos más altos en esta especialidad, recibe una bonificación de dado de situación en las pruebas de habilidad asistidas por ella: **-1 paso en el rango 3**, **-2 pasos en el rango 6**, **-3 pasos en el rango 9** y **-4 pasos en el rango 12**.
        trained_only: false
        rank_benefits:
          - rank: 3
            title: Increased Effect
          - rank: 6
            title: Increased Effect
          - rank: 9
            title: Increased Effect
          - rank: 12
            title: Increased Effect
      security-devices:
        attribute: WIL
        cost: 4
        url: /skills/security#security-devices
        localized:
          - en:
              name: Security devices
              description: |-
                Using this skill, a character can attempt to bypass all types of mechanical or electronic security. This includes everything from traditional pin-tumbler locks and mechanical safes (picking) to high-tech motion sensors, trip wires, and electronic maglocks. It''s also used to set traps, both electronic and mechanical in nature. One check can be made per round, and the character making the check is busy for the entire round (no other actions possible). In a situation that isn''t taking place in rounds, the time unit changes from rounds to minutes.
                ⊗ **Increased Effect:** As a character achieves higher ranks in this specialty, he receives a situation die bonus on skill checks assisted by it: **-1 step at rank 3**, **-2 steps at rank 6**, **-3 steps at rank 9**, and **-4 steps at rank 12**.
          - es:
              name: Dispositivos de Seguridad
              description: |-
                Usando esta habilidad, un personaje puede intentar eludir todo tipo de seguridad mecánica o electrónica. Esto incluye de todo, desde cerraduras tradicionales de pasador y cajas fuertes mecánicas (ganzamiento) hasta sensores de movimiento de alta tecnología, cables trampa y cerraduras magnéticas electrónicas. También se utiliza para colocar trampas, tanto de naturaleza electrónica como mecánica. Se puede realizar una prueba por ronda, y el personaje que realiza la prueba estará ocupado durante toda la ronda (no es posible realizar otras acciones). En una situación que no se desarrolla en rondas, la unidad de tiempo cambia de rondas a minutos.
                ⊗ **Efecto aumentado:** A medida que un personaje alcanza rangos más altos en esta especialidad, recibe una bonificación de dado de situación en las pruebas de habilidad asistidas por ella: **-1 paso en el rango 3**, **-2 pasos en el rango 6**, **-3 pasos en el rango 9** y **-4 pasos en el rango 12**.
        trained_only: false
        rank_benefits:
          - rank: 3
            title: Increased Effect
          - rank: 6
            title: Increased Effect
          - rank: 9
            title: Increased Effect
          - rank: 12
            title: Increased Effect
    trained_only: false
  stamina:
    attribute: CON
    cost: 3
    category: Other
    url: /skills/stamina
    localized:
      - en:
          name: Stamina
          description: |-
            This broad skill measures a character's physical fortitude with regard to the effects of mortal damage and fatigue.
            **Note:** This skill is free to human, mechatus, sesheyan, t'sa, and weren characters.
            ---
            ### Dying
            A character who has suffered any amount of mortal damage is considered to be dying. At the end of a scene, a dying character (whether conscious or unconscious) makes a Stamina check.
            - **Critical Failure:** The character suffers **2 additional points** of mortal damage.
            - **Failure:** The character suffers **1 additional point** of mortal damage.
            - **Ordinary or better:** The character's condition is unchanged. The dying character makes additional Stamina checks **once per hour**, until he receives medical aid (see the Medical Science—surgery or Medical Science—treatment descriptions for details). The time between these Stamina checks can be lengthened to once per day if the character is helped by the application of Knowledge—first aid or Medical Science—treatment.
            ---
            ### Fatigue
            When a character engages in certain fatigue-causing activities, he must make a Stamina check. This check is made after the activity takes place, or at set intervals for certain types of activity (see “Fatigue Damage” in the rulebook).
            - **Critical Failure:** The character suffers **2 points** of fatigue damage.
            - **Failure:** Indicates **1 point** of damage.
            - **Success:** Indicates that no fatigue damage occurs as a result of the activity just completed.
      - es:
          name: Aguante
          description: |-
            Esta amplia habilidad mide la fortaleza física de un personaje con respecto a los efectos del daño Mortal y la fatiga.
            **Nota:** Esta habilidad es gratuita para personajes humanos, mechatus, sesheyan, t'sa y weren.
            ---
            ### Morir
            Se considera que un personaje que ha sufrido cualquier cantidad de daño Mortal está muriendo. Al final de una escena, un personaje moribundo (ya sea consciente o inconsciente) realiza una prueba de Resistencia.
            - **Fallo Crítico:** El personaje sufre **2 puntos adicionales** de daño Mortal.
            - **Fallo:** El personaje sufre **1 punto adicional** de daño Mortal.
            - **Ordinario o mejor:** La condición del personaje no cambia. El personaje moribundo realiza pruebas adicionales de resistencia **una vez por hora**, hasta que recibe ayuda médica (consulte las descripciones de Ciencias médicas—cirugía o Ciencias médicas—tratamientos para obtener más detalles). El tiempo entre estas pruebas de Resistencia se puede alargar a una vez por día si el personaje recibe ayuda mediante la aplicación del tratamiento de Conocimiento (primeros auxilios o Ciencias Médicas).
            ---
            ### Fatiga
            Cuando un personaje se involucra en ciertas actividades que le causan fatiga, debe realizar una prueba de Resistencia. Esta verificación se realiza después de que se lleva a cabo la actividad, o a intervalos establecidos para ciertos tipos de actividad (ver "Daño por fatiga" en el libro de reglas).
            - **Fallo Crítico:** El personaje sufre **2 puntos** de daño por fatiga.
            - **Fallo:** Indica **1 punto** de daño.
            - **Éxito:** Indica que no se produce ningún daño por fatiga como resultado de la actividad recién completada.
    items:
      endurance:
        attribute: CON
        cost: 4
        url: /skills/stamina#endurance
        localized:
          - en:
              name: Endurance
              description: |-
                As a character acquires ranks in the endurance skill, he becomes more able to withstand the effects of damage. For a character who has this specialty, endurance checks take the place of Stamina checks for damage and fatigue.
                ⊗ **Improved Breathing:** The bonus to a character''s Stamina-endurance check while holding his or her breath improves to **-2 at rank 4**,
                **-3 at rank 8**, and **-4 at rank 12**.
          - es:
              name: Resistencia
              description: |-
                A medida que un personaje adquiere rangos en la habilidad de resistencia, se vuelve más capaz de resistir los efectos del daño. Para un personaje que tiene esta especialidad, las pruebas de resistencia reemplazan las pruebas de resistencia para detectar daño y fatiga.
                ⊗ **Respiración mejorada:** La bonificación a la prueba de resistencia de un personaje mientras contiene la respiración mejora a **-2 en el rango 4**.
                **-3 en el rango 8** y **-4 en el rango 12**.
        trained_only: false
        rank_benefits:
          - rank: 4
            title: Improved Breathing
          - rank: 8
            title: Improved Breathing
          - rank: 12
            title: Improved Breathing
      resist-pain:
        attribute: CON
        cost: 5
        url: /skills/stamina#resist-pain
        localized:
          - en:
              name: Resist pain
              description: |-
                Resist pain allows a character to function normally and ignore some or all of the situation penalties for suffering large amounts of stun, wound, or mortal (but not fatigue) damage. A character with this specialty may get an opportunity **once per combat scene** to check the effectiveness of his ability to resist pain. The first time during a combat scene when the character has received stun points or wound points, or when he receives at least 1 point of mortal damage, he makes a resist pain skill check.
                **Note:** This check does not count as an action, and takes place before any characters attempt any actions. The result of the resist pain check lasts for the rest of the combat scene.
                ### Results
                - **Critical Failure:** The character succumbed to the pain and **can''t act for 2d4 phases**.
                - **Failure:** The character succumbs to the pain and suffers the normal damage penalties.
                - **Ordinary:** The character ignores **1 step** of penalty.
                - **Good:** The character ignores **2 steps** of penalty.
                - **Amazing:** The character ignores **3 steps** of penalty.
                **Benefit Consolidation:** Resist pain only helps to lessen or eliminate situation penalties caused by cumulative damage. The benefit a character receives from a successful skill check can''t be used to turn a penalty into a bonus. (If a character only has a +1 penalty due to damage when the check is made but the result indicates a reduction of 2 points of penalty, the character gets no immediate benefit from the extra reduction—but it might come into play if he suffers damage later in the scene). Having this skill doesn''t help a character stave off dying or death results.
          - es:
              name: Resist pain
              description: |-
                Resistir el dolor permite a un personaje funcionar normalmente e ignorar algunas o todas las penalizaciones de la situación por sufrir grandes cantidades de daño por aturdimiento, herida o Mortal (pero no por fatiga). Un personaje con esta especialidad puede tener la oportunidad **una vez por escena de combate** de comprobar la eficacia de su capacidad para resistir el dolor. La primera vez durante una escena de combate cuando el personaje ha recibido puntos de aturdimiento o puntos de herida, o cuando recibe al menos 1 punto de daño Mortal, realiza una prueba de habilidad de resistir el dolor.
                **Nota:** Esta prueba no cuenta como una acción y se lleva a cabo antes de que cualquier personaje intente realizar alguna acción. El resultado de la prueba de resistencia al dolor dura el resto de la escena del combate.
                ### Resultados
                - **Fallo crítico:** El personaje sucumbió al dolor y **no puede actuar durante 2d4 fases**.
                - **Fallo:** El personaje sucumbe al dolor y sufre las penalizaciones de daño normales.
                - **Ordinario:** El personaje ignora **1 paso** de penalización.
                - **Bien:** El personaje ignora **2 pasos** de penalización.
                - **Asombroso:** El personaje ignora **3 pasos** de penalización.
                **Consolidación de beneficios:** Resistir el dolor solo ayuda a disminuir o eliminar las penalizaciones de la situación causadas por el daño acumulativo. El beneficio que recibe un personaje de una prueba de habilidad exitosa no puede usarse para convertir una penalización en una bonificación. (Si un personaje sólo tiene una penalización de +1 debido al daño cuando se realiza la prueba pero el resultado indica una reducción de 2 puntos de penalización, el personaje no obtiene ningún beneficio inmediato de la reducción adicional, pero podría entrar en juego si sufre daño más adelante en la escena). Tener esta habilidad no ayuda al personaje a evitar la muerte o los resultados de la muerte.
        trained_only: true
    trained_only: false
  street-smart:
    attribute: WIL
    cost: 3
    category: Social
    url: /skills/street-smart
    localized:
      - en:
          name: Street Smart
          description: |-
            This broad skill provides a character with general knowledge in the protocols of "the street." It measures a character''s ability to negotiate and make contact with the realm of blue-collar crime, gangs, and illicit dealers. Street Smart and its specialties are encounter skills.
            ### Street Smart Situation Modifiers
            | Condition | Modifier | | :--- | :--- | | Society has no law | -3 steps | | Society has Good law | +2 steps | | Society has Amazing law | +3 steps | | Belongs to similar group | -1 step | | Belongs to same group | -2 steps | | Belongs to opposed group | +3 steps | | Has local contact | -1 step | | Has Reputation perk | -1 step | | Is an obvious stranger | +1 step | | Has Infamy flaw | +1 step | | Seeks Ordinary assistance | -1 step | | Seeks Good assistance | +2 steps | | Seeks Amazing assistance | +4 steps |
      - es:
          name: Callejeo
          description: |-
            Esta amplia habilidad proporciona al personaje un conocimiento general de los protocolos de "la calle". Mide la capacidad de un personaje para negociar y establecer contacto con el ámbito del crimen obrero, las pandillas y los traficantes ilícitos. Callejeo y sus especialidades son las habilidades de encuentro.
            ### Modificadores de situación de Callejeo
            | Condición | Modificador | | :--- | :--- | | La sociedad no tiene ley | -3 pasos | | La sociedad tiene buena ley | +2 pasos | | La sociedad tiene una ley asombrosa | +3 pasos | | Pertenece a un grupo similar | -1 paso | | Pertenece al mismo grupo | -2 pasos | | Pertenece al grupo opuesto | +3 pasos | | Tiene contacto local | -1 paso | | Tiene ventaja de reputación | -1 paso | | Es un obvio extraño | +1 paso | | Tiene defecto de infamia | +1 paso | | Busca asistencia ordinaria | -1 paso | | Busca buena asistencia | +2 pasos | | Busca asistencia increíble | +4 pasos |
    items:
      street-knowledge:
        attribute: WIL
        cost: 3
        url: /skills/street-smart#street-knowledge
        localized:
          - en:
              name: Street Knowledge
              description: |-
                This skill enables a character to improve his familiarity with the inner workings of a particular organization or geographical area. Unlike other specialties, it must be purchased separately for each organization or area (e.g., **Street Knowledge—Alpha Colony** or
                **Street Knowledge—The Void Syndicate**). A character needs to buy this specialty twice in order to become familiar with how things get done in a specific interstellar organization or interstellar trade union.
          - es:
              name: Habilidades de Especialidad
              description: |-
                Esta habilidad permite al personaje mejorar su familiaridad con el funcionamiento interno de una organización o área geográfica en particular. A diferencia de otras especialidades, se debe comprar por separado para cada organización o área (por ejemplo, **Street Knowledge—Alpha Colony** o
                **Conocimiento callejero: The Void Syndicate**). Un personaje necesita comprar esta especialidad dos veces para familiarizarse con cómo se hacen las cosas en una organización interestelar o sindicato interestelar específico.
        trained_only: false
      criminal-elements:
        attribute: WIL
        cost: 5
        url: /skills/street-smart#criminal-elements
        localized:
          - en:
              name: Criminal elements
              description: |-
                This specialty skill represents a character''s ability to make contact with and deal with those who are considered part of the criminal element—organized crime, professional criminals, street gangs, and underworld organizations. Whenever a character tries to locate or interact with these groups, he uses this skill.
          - es:
              name: Criminal elements
              description: |-
                Esta habilidad especial representa la capacidad de un personaje para establecer contacto y tratar con aquellos que se consideran parte del elemento criminal: crimen organizado, delincuentes profesionales, pandillas callejeras y organizaciones del hampa. Siempre que un personaje intenta localizar o interactuar con estos grupos, utiliza esta habilidad.
        trained_only: false
    trained_only: false
  survival:
    attribute: CON
    cost: 3
    category: Other
    url: /skills/survival
    localized:
      - en:
          name: Survival
          description: |-
            This broad skill provides a character with training in survival across wilderness, ruined/hostile urban landscapes, and alien biospheres. It covers procuring necessities (food, water, shelter), avoiding environmental hazards, and systematic ecological study. Checks are made **once each day** unless the GM determines otherwise.
            ### Survival Results
            - **Failure:** The character can''t acquire basic necessities for this day.
            - **Ordinary:** The character acquires enough basic necessities to sustain himself for this day.
            - **Good:** The character acquires enough basic necessities for himself and up to **six others** for this day.
            - **Amazing:** The character becomes so familiar with the locale that survival is no longer an issue unless the situation changes.
            ### Survival Situation Modifiers
            The type of terrain or environment where the character is located can provide a modifier to the skill check: | Terrain / Situation | Modifier | | :--- | :--- | | **Arctic terrain** | +4 | | **Arid or wasteland terrain** | +3 | | **Mountainous terrain** | +2 | | **Swamp or ocean** | +1 | | **Forest or grassland** | 0 | | **Dense vegetation** | -1 | | **Jungle terrain** | -2 | | **Small settlement** | -1 | | **Small city or space station** | -2 | | **Large city or space station** | -3 |
      - es:
          name: Supervivencia
          description: |-
            Esta amplia habilidad proporciona al personaje entrenamiento en supervivencia en áreas silvestres, paisajes urbanos hostiles/en ruinas y biosferas alienígenas. Cubre las necesidades de adquisición (alimentos, agua, refugio), evitando peligros ambientales y un estudio ecológico sistemático. Las comprobaciones se realizan **una vez al día** a menos que el director general determine lo contrario.
            ### Resultados de supervivencia
            - **Fallo:** El personaje no puede adquirir las necesidades básicas para este día.
            - **Ordinario:** El personaje adquiere suficientes necesidades básicas para sustentarse durante este día.
            - **Bien:** El personaje adquiere suficientes necesidades básicas para él y hasta **seis personas más** para este día.
            - **Asombroso:** El personaje se familiariza tanto con el lugar que la supervivencia ya no es un problema a menos que la situación cambie.
            ### Modificadores de situaciones de supervivencia
            El tipo de terreno o entorno donde se encuentre el personaje puede proporcionar un modificador a la prueba de habilidad: | Terreno / Situación | Modificador | | :--- | :--- | | **Terreno ártico** | +4 | | **Terreno árido o baldío** | +3 | | **Terreno montañoso** | +2 | | **Pantano u océano** | +1 | | **Bosque o pastizal** | 0 | | **Vegetación densa** | -1 | | **Terreno de jungla** | -2 | | **Pequeño asentamiento** | -1 | | **Pequeña ciudad o estación espacial** | -2 | | **Gran ciudad o estación espacial** | -3 |
    items:
      survival-training:
        attribute: CON
        cost: 3
        url: /skills/survival#survival-training
        localized:
          - en:
              name: Survival training
              description: ''
          - es:
              name: Apertura de Sendas
              description: |-
                con la apertura de sendas, un personaje aprende a encontrar caminos a través de terreno difícil o a crear caminos que otros puedan usar para moverse más rápido y cubrir más terreno durante un día completo de viaje. El uso exitoso de esta habilidad reduce los efectos adversos de viajar en condiciones de dificultad Buena o Asombrosa para el personaje y cualquier compañero que viaje con él. Esta comprobación de habilidad se realiza una vez al día, al comienzo de un día de viaje.
                ### Resultados
                - **Fallo Crítico:** El personaje elige una ruta que es peor de lo que los otros viajeros podrían haber encontrado por sí mismos, causando que todos en el grupo sufran una **penalización adicional de +1 a sus comprobaciones de fatiga**, además de cualquier otra penalización.
                - **Fallo:** No se proporciona ayuda.
                - **Éxito Ordinario:** Proporciona una **reducción de 1 paso** a cualquier penalización que se aplique.
                - **Éxito Bueno:** Reduce las penalizaciones en **2 pasos**.
                - **Éxito Asombroso:** Reduce las penalizaciones en **3 pasos**. Nota: Esta reducción no puede usarse para convertir una penalización en un bono; el mejor resultado posible es anular una penalización por completo.
                ### Notas y Aclaraciones de Supervivencia
                * **Supervivencia Urbana:** Se aplica a entornos urbanos hostiles o en ruinas (zonas de guerra, estaciones espaciales abandonadas) donde las habilidades sociales normales como
                **Negocios** o **Callejeo** ya no son efectivas para encontrar recursos básicos.
                * **Deducción Ecológica:** "Discernir Peligros" no es solo detectar una trampa; es entender el ecosistema (p. ej., "La ausencia de los bichos verdes locales indica que un depredador superior está cerca").
                * **Ecosistemas Similares:** Los directores de juego pueden reducir la penalización inicial de Adaptabilidad de **+5 pasos a +3 pasos** si el personaje está estudiando un ecosistema sorprendentemente similar a uno que ya ha dominado.
                * **Interacción con Equipo:** El equipo especializado de supervivencia o soporte vital (descrito en la sección de Equipo) puede proporcionar bonos de dado de situación a las comprobaciones de supervivencia y adaptabilidad al reducir el estrés ambiental. Barnices, purificadores de agua y domos ambientales pueden satisfacer automáticamente necesidades de refugio o agua.
                * **Requisitos Biológicos:** La maestría es una comprensión del entorno, no una transformación física. Los mundos sin aire o venenosos aún requieren equipo de protección y fuentes de oxígeno.
                ### Supervivencia en Otros Mundos
                La habilidad de Supervivencia está diseñada principalmente para entornos similares a la Tierra. Si un personaje está en un mundo alienígena, los modificadores de situación dados aún podrían aplicarse (asumiendo que la flora/fauna local sea comestible). Si un entorno es drásticamente diferente de la experiencia nativa de un personaje, este debe usar la especialidad de
                **[Adaptabilidad](#adaptabilidad-CON---solo-entrenados)** para cerrar la brecha. El uso de la habilidad de Supervivencia aún podría ser
                **imposible** en ciertas situaciones extremas — por ejemplo, un asteroide estéril y sin aire sin el equipo de protección adecuado.
        trained_only: false
      adaptability:
        attribute: CON
        cost: 3
        url: /skills/survival#adaptability
        localized:
          - en:
              name: Adaptability
              description: |-
                This specialty improves a character’s ability to adapt to alien environments. The character is resourceful enough to grasp unknown survival mechanics through observation and study.
                ### Mastering Alien Environments
                A character can perform a **Survival—Adaptability** challenge, spend studying the environment (one check per day).
                - **Initial Success:** Allows the character to use their **Survival Training** specialty in the alien environment, but with an **additional +5 step penalty**.
                - **Progression:** For every **3 additional successes** achieved in the challenge, this penalty is reduced by one step (to a minimum of the base terrain modifier).
                - **Mastery:** Once the character reduces the penalty entirely, they have **mastered the terrain** and automatically receive **one rank** in a new **Survival Training** specialty for that specific environment. A character **cannot buy** or increase their rank in a new terrain type through experience points until they have fully mastered it through the Adaptability challenge.
          - es:
              name: Adaptabilidad
              description: |-
                Esta especialidad mejora la capacidad de un personaje para adaptarse a entornos alienígenas. El personaje tiene el ingenio suficiente para comprender mecanismos de supervivencia desconocidos mediante la observación y el estudio.
                ### Dominar entornos alienígenas
                Un personaje puede realizar un desafío de **Supervivencia—Adaptabilidad** y dedicarlo a estudiar el entorno (una prueba por día).
                - **Éxito inicial:** Permite al personaje usar su especialidad de **Entrenamiento de supervivencia** en el entorno alienígena, pero con una **penalización adicional de +5 pasos**.
                - **Progresión:** Por cada **3 éxitos adicionales** logrados en el desafío, esta penalización se reduce en un paso (hasta un mínimo del modificador del terreno base).
                - **Maestría:** Una vez que el personaje reduce la penalización por completo, **domina el terreno** y recibe automáticamente **un rango** en una nueva especialidad de **Entrenamiento de supervivencia** para ese entorno específico. Un personaje **no puede comprar** ni aumentar su rango en un nuevo tipo de terreno a través de puntos de experiencia hasta que lo haya dominado por completo mediante el desafío de Adaptabilidad.
        trained_only: false
      trailblazing:
        attribute: CON
        cost: 3
        url: /skills/survival#trailblazing
        localized:
          - en:
              name: Trailblazing
              description: |-
                With trailblazing, a character learns to find paths through rough terrain or create paths that others can use to move faster and cover more ground during a full day''s travel. The successful use of this skill reduces the adverse effects of traveling in conditions of Good or Amazing difficulty for the character and any companions who are traveling with him. This skill check is made once per day, at the beginning of a day of travel.
                ### Results
                - **Critical Failure:** The character picks a route that is worse than the other travelers could have found for themselves, causing everyone in the group to suffer an
                **additional +1 penalty to their fatigue checks**, on top of any other penalties.
                - **Failure:** No help is provided.
                - **Ordinary success:** Provides a **reduction of 1 step** to any penalties that apply.
                - **Good success:** Reduces penalties by **2 steps**.
                - **Amazing success:** Reduces penalties by **3 steps**. Note: This reduction can''t be used to turn a penalty into a bonus; the best possible result is negating a penalty altogether.
                ---
                ### Survival on Other Worlds
                The Survival skill is primarily designed for Earth-like environments. If a character is on an alien world, the given situation modifiers might still apply (assuming local flora/fauna are edible). If an environment is drastically different from a character''s native experience, the character should use the
                **[Adaptability](#adaptability-con---trained-only)** specialty to bridge the gap. The use of the Survival skill might still be **impossible** in certain extreme situations—for instance, a barren/airless asteroid without existing protective gear.
          - es:
              name: Trailblazing
              description: |-
                Al abrir camino, un personaje aprende a encontrar caminos a través de terreno accidentado o crear caminos que otros pueden usar para moverse más rápido y cubrir más terreno durante un día completo de viaje. El uso exitoso de esta habilidad reduce los efectos adversos de viajar en condiciones de dificultad Buena o Asombrosa para el personaje y cualquier acompañante que viaje con él. Esta prueba de habilidad se realiza una vez al día, al comienzo de un día de viaje.
                ### Resultados
                - **Fallo crítico:** El personaje elige una ruta que es peor que la que los otros viajeros podrían haber encontrado por sí mismos, lo que hace que todos los miembros del grupo sufran un
                **penalización adicional de +1 a sus controles de fatiga**, además de cualquier otra penalización.
                - **Error:** No se proporciona ayuda.
                - **Éxito normal:** Proporciona una **reducción de 1 paso** a cualquier penalización que se aplique.
                - **Buen éxito:** Reduce las penalizaciones en **2 pasos**.
                - **Éxito increíble:** Reduce las penalizaciones en **3 pasos**. Nota: Esta reducción no se puede utilizar para convertir una penalización en una bonificación; el mejor resultado posible es anular la penalización por completo.
                ---
                ### Supervivencia en otros mundos
                La habilidad Supervivencia está diseñada principalmente para entornos similares a la Tierra. Si un personaje está en un mundo alienígena, los modificadores de situación dados aún podrían aplicarse (suponiendo que la flora/fauna local sea comestible). Si un entorno es drásticamente diferente de la experiencia nativa de un personaje, el personaje debe usar el
                **[Adaptabilidad](#adaptability-CON---trained-only)** especialidad para cerrar la brecha. El uso de la habilidad Supervivencia aún podría ser **imposible** en ciertas situaciones extremas, por ejemplo, un asteroide árido o sin aire sin equipo de protección existente.
        trained_only: false
    trained_only: false
  system-operation:
    attribute: WIL
    cost: 3
    category: Technical
    url: /skills/system-operation
    localized:
      - en:
          name: System Operation
          description: |-
            This broad skill provides a character with basic training in the use of spaceship systems other than the helm or piloting systems. (Vehicle Operation covers the actual piloting of a spaceship.) It also applies to other types of vehicles or ground-based installations that use one or more of the specific systems described below in the Specialty Skills section. These other vehicles and installations include (but are not limited to) large water vessels such as battleships, military submarines, and cargo ships; jet fighters and large commercial aircraft; and radar outposts and gun emplacements. For full details on how **System Operation** skills are used, see the sections on ["What''s in a Spaceship?"](/core-mechanics/vehicles-and-vessels/) and ["Space Vehicle Combat"](/core-mechanics/vehicles-and-vessels#space-vehicle-combat).
      - es:
          name: Operación de Sistemas
          description: |-
            Esta amplia habilidad proporciona al personaje una formación básica en el uso de sistemas de naves espaciales distintos del timón o los sistemas de pilotaje. (La operación de vehículos cubre el pilotaje real de una nave espacial). También se aplica a otros tipos de vehículos o instalaciones terrestres que utilizan uno o más de los sistemas específicos que se describen a continuación en la sección Habilidades especiales. Estos otros vehículos e instalaciones incluyen (pero no se limitan a) grandes embarcaciones como acorazados, submarinos militares y buques de carga; aviones de combate y grandes aviones comerciales; y puestos de radar y emplazamientos de armas. Para obtener detalles completos sobre cómo se utilizan las habilidades de **Operación del sistema**, consulte las secciones sobre ["¿Qué hay en una nave espacial?"](/core-mechanics/vehicles-and-vessels/) y ["Combate de vehículos espaciales"](/core-mechanics/vehicles-and-vessels#space-vehicle-Combate).
    items:
      communications:
        attribute: WIL
        cost: 3
        url: /skills/system-operation#communications
        localized:
          - en:
              name: Communications
              description: |-
                A communications specialist can operate all shipboard and personal communication gear with precision, attempt to decipher coded communication signals, code outgoing messages, jam external communication and sensor signals, and try to overcome jamming from an outside source.
          - es:
              name: Comunicaciones
              description: |-
                Un especialista en comunicaciones puede operar con precisión todos los equipos de comunicación personales y a bordo, intentar descifrar señales de comunicación codificadas, codificar mensajes salientes, bloquear las comunicaciones externas y las señales de los sensores, e intentar superar las interferencias de una fuente externa.
        trained_only: false
      defenses:
        attribute: WIL
        cost: 3
        url: /skills/system-operation#defenses
        localized:
          - en:
              name: Defenses
              description: |-
                A defenses specialist can operate all shipboard defensive systems with precision, attempt to direct defenses to parts of the ship where they''re most needed, and analyze attack patterns to make best use of the defenses his ship possesses. In space vehicle combat, the defenses operator can provide a penalty to an opponent''s weapons or sensors during any given attack.
          - es:
              name: Defensas
              description: |-
                Un especialista en defensas puede operar todos los sistemas defensivos a bordo con precisión, intentar dirigir las defensas a las partes del barco donde más se necesitan y analizar patrones de ataque para aprovechar al máximo las defensas que posee su barco. En el combate de vehículos espaciales, el operador de las defensas puede penalizar las armas o sensores del oponente durante cualquier ataque.
        trained_only: false
      engineering:
        attribute: WIL
        cost: 3
        url: /skills/system-operation#engineering
        localized:
          - en:
              name: Engineering
              description: |-
                An engineering specialist monitors a ship''s electronic and mechanical systems as a whole, watching for fluctuations and other signs that a component is breaking down. He can institute repairs to damaged systems from his station, route power to specific systems, and direct hands-on repairs at remote locations.
          - es:
              name: Ingeniería
              description: |-
                Un especialista en ingeniería monitorea los sistemas electrónicos y mecánicos de un barco en su conjunto, observando fluctuaciones y otras señales de que un componente se está averiando. Puede realizar reparaciones de sistemas dañados desde su estación, dirigir energía a sistemas específicos y realizar reparaciones prácticas en ubicaciones remotas.
        trained_only: false
      sensors:
        attribute: WIL
        cost: 3
        url: /skills/system-operation#sensors
        localized:
          - en:
              name: Sensors
              description: |-
                A sensors specialist can operate all shipboard and personal sensor gear with precision, attempt to scan ships or planets, and analyze those readings in a short period of time. He can use the data to provide bonuses to a weapons or defenses operator.
          - es:
              name: Sensores
              description: |-
                Un especialista en sensores puede operar con precisión todos los equipos de sensores personales y a bordo, intentar escanear barcos o planetas y analizar esas lecturas en un corto período de tiempo. Puede utilizar los datos para proporcionar bonificaciones a un operador de armas o defensas.
        trained_only: false
      weapons:
        attribute: WIL
        cost: 6
        url: /skills/system-operation#weapons
        localized:
          - en:
              name: Weapons
              description: |-
                A weapons specialist can operate all shipboard weapons systems with precision. In starship combat, the weapons operator picks targets and makes attacks.
          - es:
              name: Armas
              description: |-
                Un especialista en armas puede operar con precisión todos los sistemas de armas a bordo. En el combate de naves espaciales, el operador de armas elige objetivos y realiza ataques.
        trained_only: false
    trained_only: false
  tactics:
    attribute: WIL
    cost: 6
    category: Combat
    url: /skills/tactics
    localized:
      - en:
          name: Tactics
          description: |-
            This broad skill provides a character with basic training in and an understanding of tactics and tactical situations. While tactics may come into play in many types of situations, it''s most commonly used during infantry combat, space combat, and vehicle combat. A successful use of the skill provides a penalty to the opponent''s next skill check, indicating that you developed a tactical plan and successfully employed it against him.
            ### Tactics Check Results
            - **Critical Failure:** The opponent sees through your intentions and receives a **-1 bonus** on their next skill check.
            - **Failure:** No modifier to the opponent''s next skill check.
            - **Ordinary:** **+1 penalty** to the opponent''s next skill check.
            - **Good:** **+2 penalty** to the opponent''s next skill check.
            - **Amazing:** **+3 penalty** to the opponent''s next skill check.
      - es:
          name: Táctica
          description: |-
            Esta amplia habilidad proporciona al personaje una formación básica y una comprensión de las tácticas y situaciones tácticas. Si bien las tácticas pueden entrar en juego en muchos tipos de situaciones, se usan más comúnmente durante el combate de infantería, el combate espacial y el combate de vehículos. Un uso exitoso de la habilidad proporciona una penalización a la siguiente prueba de habilidad del oponente, lo que indica que desarrollaste un plan táctico y lo empleaste con éxito contra él.
            ### Tácticas Verificar resultados
            - **Fallo crítico:** El oponente ve tus intenciones y recibe una **bonificación -1** en su próxima prueba de habilidad.
            - **Fallo:** No hay modificador para la siguiente prueba de habilidad del oponente.
            - **Ordinario:** **penalización +1** a la siguiente prueba de habilidad del oponente.
            - **Bueno:** **penalización +2** a la siguiente prueba de habilidad del oponente.
            - **Increíble:** **penalización +3** a la siguiente prueba de habilidad del oponente.
    items:
      infantry-tactics:
        attribute: WIL
        cost: 3
        url: /skills/tactics#infantry-tactics
        localized:
          - en:
              name: Infantry tactics
              description: |-
                The specialty skill covers battlefield strategies when the main component of the battle is individual troops.
                ⊗ **Increased Effect:** As a character achieves higher ranks in a Tactics specialty skill, he receives a situation die bonus for dealing with opposing forces (infantry, space vessels, or vehicles). The bonus is
                **-1 step at rank 4**, **-2 steps at rank 8**, and **-3 steps at rank 12**.
          - es:
              name: Táctica de Infantería
              description: |-
                La habilidad especializada cubre estrategias en el campo de batalla cuando el componente principal de la batalla son tropas individuales.
                ⊗ **Efecto aumentado:** A medida que un personaje alcanza rangos más altos en una habilidad especializada en Tácticas, recibe una bonificación de dado de situación por lidiar con fuerzas opuestas (infantería, naves espaciales o vehículos). El bono es
                **-1 paso en el rango 4**, **-2 pasos en el rango 8** y **-3 pasos en el rango 12**.
        trained_only: false
        rank_benefits:
          - rank: 4
            title: Increased Effect
          - rank: 8
            title: Increased Effect
          - rank: 12
            title: Increased Effect
      space-tactics:
        attribute: WIL
        cost: 3
        url: /skills/tactics#space-tactics
        localized:
          - en:
              name: Space tactics
              description: |-
                Battlefield strategies involving combat between spaceships.
                ⊗ **Increased Effect:** As a character achieves higher ranks in a Tactics specialty skill, he receives a situation die bonus for dealing with opposing forces. The bonus is **-1 step at rank 4**, **-2 steps at rank 8**, and **-3 steps at rank 12**.
          - es:
              name: Táctica Espacial
              description: |-
                Estrategias de campo de batalla que implican combates entre naves espaciales.
                ⊗ **Efecto aumentado:** A medida que un personaje alcanza rangos más altos en una habilidad especializada de Tácticas, recibe una bonificación de dado de situación por lidiar con fuerzas opuestas. La bonificación es **-1 paso en el rango 4**, **-2 pasos en el rango 8** y **-3 pasos en el rango 12**.
        trained_only: false
        rank_benefits:
          - rank: 4
            title: Increased Effect
          - rank: 8
            title: Increased Effect
          - rank: 12
            title: Increased Effect
      vehicle-tactics:
        attribute: WIL
        cost: 3
        url: /skills/tactics#vehicle-tactics
        localized:
          - en:
              name: Vehicle tactics
              description: |-
                Battlefield strategies involving combat where vehicles other than starships (air, land, or water) are the main component.
                ⊗ **Increased Effect:** As a character achieves higher ranks in a Tactics specialty skill, he receives a situation die bonus for dealing with opposing forces. The bonus is **-1 step at rank 4**, **-2 steps at rank 8**, and **-3 steps at rank 12**.
          - es:
              name: Táctica de Vehículos
              description: |-
                Estrategias de campo de batalla que involucran combates donde los vehículos distintos de las naves espaciales (aéreos, terrestres o acuáticos) son el componente principal.
                ⊗ **Efecto aumentado:** A medida que un personaje alcanza rangos más altos en una habilidad especializada de Tácticas, recibe una bonificación de dado de situación por lidiar con fuerzas opuestas. La bonificación es **-1 paso en el rango 4**, **-2 pasos en el rango 8** y **-3 pasos en el rango 12**.
        trained_only: false
        rank_benefits:
          - rank: 4
            title: Increased Effect
          - rank: 8
            title: Increased Effect
          - rank: 12
            title: Increased Effect
    trained_only: false
  teach:
    attribute: WIL
    cost: 3
    category: Social
    url: /skills/teach
    localized:
      - en:
          name: Teach
          description: |-
            This broad skill represents a character''s ability to instruct others in the use of a skill belonging to the Open group. A skill check is required whenever a character wants to teach a skill to another character.
            ### Guidance and Costs
            Getting instruction from a teacher can decrease the cost for another character when that character wants to buy or improve a skill.
            - **Teacher Limitation:** A teacher **cannot teach himself** or herself.
            - **Cost Floor:** The cost to buy or improve a skill can **never be decreased to less than 1** skill point.
            - **Student Resource:** The character to be taught must have enough skill points (XP) to purchase the skill at its (possibly reduced) cost.
            ### The Teaching Check
            The benefit of a teacher depends on the result of the teacher''s skill check:
            - **Critical Failure:** The student doesn''t learn or improve the skill at this time.
            - **Failure:** The student must pay the **full skill cost**.
            - **Ordinary:** The student pays **cost -1**.
            - **Good:** The student pays **cost -2**.
            - **Amazing:** The student pays **cost -3**.
            ### Mentorship Limits
            - **One at a Time:** A teacher can''t teach more than one student at a time.
            - **One per Session:** Only one new skill or one rank of improvement can be gained by a student during any teaching session (usually occurring between adventures).
            - **Mastery Limit:** A teacher can only teach a specialty skill up to **one-half of his or her current rank** in that skill. For example, a teacher with Animal Handling—animal training at rank 4 can only teach someone else that skill up to rank 2.
      - es:
          name: Enseñanza
          description: |-
            Esta habilidad amplia representa la capacidad de un personaje para instruir a otros en el uso de una habilidad perteneciente al grupo Abierto. Se requiere una prueba de habilidad cada vez que un personaje quiere enseñar una habilidad a otro personaje.
            ### Orientación y costos
            Recibir instrucciones de un maestro puede disminuir el costo para otro personaje cuando ese personaje quiere comprar o mejorar una habilidad.
            - **Limitación del maestro:** Un maestro **no puede enseñarse a sí mismo**.
            - **Costo mínimo:** El costo para comprar o mejorar una habilidad **nunca se puede reducir a menos de 1** punto de habilidad.
            - **Recurso para estudiantes:** El personaje al que se le enseñará debe tener suficientes puntos de habilidad (XP) para comprar la habilidad a su costo (posiblemente reducido).
            ### El control de la enseñanza
            El beneficio de un profesor depende del resultado de la prueba de habilidades del profesor:
            - **Fallo Crítico:** El estudiante no aprende ni mejora la habilidad en este momento.
            - **Reprobado:** El estudiante deberá pagar el **coste total de la habilidad**.
            - **Ordinario:** El estudiante paga **coste -1**.
            - **Bien:** El estudiante paga **coste -2**.
            - **Increíble:** El estudiante paga **coste -3**.
            ### Límites de tutoría
            - **Uno a la vez:** Un profesor no puede enseñar a más de un estudiante a la vez.
            - **Uno por sesión:** Un estudiante solo puede obtener una nueva habilidad o un rango de mejora durante cualquier sesión de enseñanza (que generalmente ocurre entre aventuras).
            - **Límite de dominio:** Un maestro solo puede enseñar una habilidad especializada hasta **la mitad de su rango actual** en esa habilidad. Por ejemplo, un profesor con Manejo de animales (entrenamiento de animales) en el rango 4 solo puede enseñarle a otra persona esa habilidad hasta el rango 2.
    items:
      teach-specific-field:
        attribute: WIL
        cost: 3
        url: /skills/teach#teach-specific-field
        localized:
          - en:
              name: Teach, Specific Field
              description: |-
                This specialty skill allows a character to expand their teaching ability to specialized profession groups. For each separate purchase of this specialty skill, the character selects a profession group: **Combat Spec**, **Diplomat**, **Free Agent**, or **Tech Op**. The character then becomes able to teach all skills associated with that profession group in addition to those belonging to the Open group. (e.g., a teacher specialized in Combat Spec can help another character learn or improve a Combat Spec skill).
                ⊗ **Mindwalker Training:** If the optional rules for Psionics are being used, a teacher who also has psionic abilities can teach psionic skills to another character who also has psionic abilities.
                ---
                ### Teach Situation Modifiers
                | Task / Situation | Modifier | | :--- | :--- | | **Teaching a broad skill** | +2 steps | | **Teaching a specialty skill (to Rank 1-3)** | 0 | | **Teaching to Rank 4** | +1 step | | **Teaching to Rank 5** | +2 steps | | **Teaching to Rank 6** | +3 steps | | **Student is learning a Professional skill** | -1 step | | **Student is learning an Out-of-Profession skill** | +2 steps |
          - es:
              name: Campo Específico
              description: |-
                Esta habilidad especializada permite a un personaje ampliar su capacidad de enseñanza a grupos profesionales especializados. Por cada compra por separado de esta habilidad especializada, el personaje selecciona un grupo de profesión: **Especialidad de combate**, **Diplomático**, **Agente libre** o **Operación técnica**. Luego, el personaje podrá enseñar todas las habilidades asociadas con ese grupo de profesión además de las que pertenecen al grupo Abierto. (por ejemplo, un profesor especializado en Combate Spec puede ayudar a otro personaje a aprender o mejorar una habilidad de Combate Spec).
                ⊗ **Entrenamiento de Mindwalker:** Si se utilizan las reglas opcionales para Psionics, un maestro que también tiene habilidades psiónicas puede enseñar habilidades psiónicas a otro personaje que también tiene habilidades psiónicas.
                ---
                ### Enseñar modificadores de situaciones
                | Tarea/Situación | Modificador | | :--- | :--- | | **Enseñar una habilidad amplia** | +2 pasos | | **Enseñar una habilidad especializada (hasta el rango 1-3)** | 0 | | **Enseñando al rango 4** | +1 paso | | **Enseñanza hasta el rango 5** | +2 pasos | | **Enseñando al rango 6** | +3 pasos | | **El estudiante está aprendiendo una habilidad profesional** | -1 paso | | **El estudiante está aprendiendo una habilidad fuera de la profesión** | +2 pasos |
        trained_only: false
      specific-field:
        attribute: WIL
        cost: 2
        url: /skills/teach#specific-field
        localized:
          - en:
              name: Specific field
              description: ''
          - es:
              name: Specific field
              description: ''
        trained_only: false
    trained_only: false
  technical-science:
    attribute: WIL
    cost: 7
    category: Technical
    url: /skills/technical-science
    localized:
      - en:
          name: Technical Science
          description: |-
            This broad skill represents a character''s training in the technical sciences, including the maintenance, repair, and invention of mechanical and electronic devices (not including computers), and general technical knowledge. Skill checks made to determine if a character knows a certain piece of technical information, or if he''s able to research a question and discover an answer, are made the same way as **Knowledge** skill checks.
      - es:
          name: Ciencia técnica
          description: |-
            Esta amplia habilidad representa la formación de un personaje en las ciencias técnicas, incluido el mantenimiento, reparación e invención de dispositivos mecánicos y electrónicos (sin incluir computadoras), y el conocimiento técnico general. Las pruebas de habilidad realizadas para determinar si un personaje conoce cierta información técnica, o si es capaz de investigar una pregunta y descubrir una respuesta, se realizan de la misma manera que las pruebas de habilidad de **Conocimiento**.
    items:
      technical-knowledge:
        attribute: WIL
        cost: 3
        url: /skills/technical-science#technical-knowledge
        localized:
          - en:
              name: Technical Knowledge
              description: |-
                This skill represents the study of technology and indicates how up-to-date a character is on techniques or procedures that help him manipulate tools and other devices. It is necessary for a character to use certain sophisticated or potentially dangerous tools, such as a cutting torch, without risking personal injury or damage to the tool.
                ⊗ **Increased Effect:** As a character’s specialty skill rank increases, he receives a bonus to any skill checks involving Technical Science or the other three specialty skills: **-1 step at rank 3**, **-2 at rank 6**, **-3 at rank 9**, and **-4 at rank 12**.
                ### Technical Science Situation Modifiers
                | Situation | Modifier | | :--- | :--- | | **No tools** | +3 steps | | **Minimal tools** | 0 | | **Standard toolkit** | -1 step | | **Specialized toolkit** | -2 steps | | **Darkness** | +3 steps | | **Marginal illumination** | +1 step | | **Ordinary illumination** | 0 | | **Good illumination** | -1 step | | **No deadline** | -2 steps | | **Reasonable deadline** | 0 | | **Tight deadline** | +1 step | | **Unreasonable deadline** | +3 steps |
          - es:
              name: Remendar
              description: |-
                Esta habilidad representa el estudio de la tecnología e indica qué tan actualizado está un personaje en técnicas o procedimientos que lo ayudan a manipular herramientas y otros dispositivos. Es necesario que un personaje utilice ciertas herramientas sofisticadas o potencialmente peligrosas, como un soplete, sin correr el riesgo de sufrir lesiones personales o daños a la herramienta.
                ⊗ **Efecto aumentado:** A medida que aumenta el rango de habilidad especial de un personaje, este recibe una bonificación a cualquier prueba de habilidad que involucre ciencia técnica o las otras tres habilidades especiales: **-1 paso en el rango 3**, **-2 en el rango 6**, **-3 en el rango 9** y **-4 en el rango 12**.
                ### Modificadores de situación de ciencia técnica
                | Situación | Modificador | | :--- | :--- | | **Sin herramientas** | +3 pasos | | **Herramientas mínimas** | 0 | | **Kit de herramientas estándar** | -1 paso | | **Kit de herramientas especializado** | -2 pasos | | **Oscuridad** | +3 pasos | | **Iluminación marginal** | +1 paso | | **Iluminación ordinaria** | 0 | | **Buena iluminación** | -1 paso | | **Sin fecha límite** | -2 pasos | | **Plazo razonable** | 0 | | **Plazo ajustado** | +1 paso | | **Plazo no razonable** | +3 pasos |
        trained_only: false
        rank_benefits:
          - rank: 3
            title: Increased Effect
          - rank: 6
            title: Increased Effect
          - rank: 9
            title: Increased Effect
          - rank: 12
            title: Increased Effect
      invention:
        attribute: WIL
        cost: 3
        url: /skills/technical-science#invention
        localized:
          - en:
              name: Invention
              description: |-
                Invention lets a character build an electronic or mechanical component or system from scratch, or to modify an existing device to perform a new function. Using this skill requires time; Invention checks are always complex skill checks. Modifying an existing item may be able to be done in rounds, but all other aspects of invention require hours, days, weeks, or months, depending on the determination of the Gamemaster.
                ⊗ **Increased Effect:** As a character’s specialty skill rank increases, he receives a bonus to any skill checks involving Technical Science or the other three specialty skills: **-1 step at rank 3**, **-2 at rank 6**, **-3 at rank 9**, and **-4 at rank 12**.
          - es:
              name: Reparación
              description: |-
                La invención permite a un personaje construir un componente o sistema electrónico o mecánico desde cero, o modificar un dispositivo existente para realizar una nueva función. Usar esta habilidad requiere tiempo; Las pruebas de invención son siempre pruebas de habilidades complejas. La modificación de un elemento existente se puede realizar en rondas, pero todos los demás aspectos de la invención requieren horas, días, semanas o meses, dependiendo de la determinación del Director de Juego.
                ⊗ **Efecto aumentado:** A medida que aumenta el rango de habilidad especial de un personaje, este recibe una bonificación a cualquier prueba de habilidad que involucre ciencia técnica o las otras tres habilidades especiales: **-1 paso en el rango 3**, **-2 en el rango 6**, **-3 en el rango 9** y **-4 en el rango 12**.
        trained_only: false
        rank_benefits:
          - rank: 3
            title: Increased Effect
          - rank: 6
            title: Increased Effect
          - rank: 9
            title: Increased Effect
          - rank: 12
            title: Increased Effect
      jury-rig:
        attribute: WIL
        cost: 3
        url: /skills/technical-science#jury-rig
        localized:
          - en:
              name: Jury-rig
              description: |-
                This skill enables a character to make fast, patchwork repairs in order to get an electronic or mechanical device or system up and running for a short period of time. A juryrig repair, even when successful, adds difficulty to the full repairs that must be made later, but it can get a character through a sticky situation. A juryrig repair can be made successfully **once** on a specific system or item. If it breaks down after being juryrigged, the system or item won't work again until it's completely fixed (using Technical Science—repair). Making a juryrig skill check is a single action, but a character who tries to use this skill must do so on his first available action in a round, and he can't attempt any other actions for the rest of the round.
                ### Juryrig Results
                The amount of difficulty added to the full repairs depends on the result of the juryrig check:
                - **Critical Failure:** The system or item becomes unusable and can't be made functional again without full repairs.
                - **Failure:** The juryrig attempt doesn't work but can be tried again.
                - **Ordinary success:** The system or item becomes operational for **d6+1 time units**, and **3 more successes** are needed for full repairs (in addition to those already required).
                - **Good success:** The system or item becomes operational for **2d4+2 time units**, and **2 more successes** are needed for full repairs.
                - **Amazing success:** The system or item becomes operational for **3d4+2 time units**, and **1 more success** is needed to make full repairs.
                ⊗ **Improved Juryrig:** When a character reaches **Rank 6**, his ability improves as follows: an Ordinary success produces a Good result, a Good success produces an Amazing result, and an Amazing success means the juryrig works so well that the system or item is considered repaired and in regular working order.
          - es:
              name: Jury-rig
              description: |-
                Esta habilidad permite a un personaje realizar reparaciones rápidas y fragmentadas para que un dispositivo o sistema electrónico o mecánico esté en funcionamiento durante un corto período de tiempo. Una reparación con jurado, incluso cuando tiene éxito, añade dificultad a las reparaciones completas que deben realizarse más adelante, pero puede ayudar a un personaje a superar una situación difícil. Una reparación juryrig se puede realizar exitosamente **una vez** en un sistema o elemento específico. Si se estropea después de haber sido arreglado, el sistema o elemento no volverá a funcionar hasta que esté completamente reparado (usando Ciencia Técnica: reparación). Realizar una prueba de habilidad de jurado es una acción única, pero un personaje que intenta usar esta habilidad debe hacerlo en su primera acción disponible en una ronda, y no puede intentar ninguna otra acción durante el resto de la ronda.
                ### Resultados del jurado
                La cantidad de dificultad agregada a las reparaciones completas depende del resultado de la verificación del jurado:
                - **Falla crítica:** El sistema o elemento queda inutilizable y no puede volver a funcionar sin una reparación completa.
                - **Fallo:** El intento de jurado no funciona pero se puede intentar nuevamente.
                - **Éxito normal:** El sistema o elemento entra en funcionamiento durante **d6+1 unidades de tiempo**, y se necesitan **3 éxitos más** para reparaciones completas (además de los ya necesarios).
                - **Buen éxito:** El sistema o elemento vuelve a estar operativo durante **2d4+2 unidades de tiempo**, y se necesitan **2 éxitos más** para realizar reparaciones completas.
                - **Éxito asombroso:** El sistema o elemento vuelve a estar operativo durante **3d4+2 unidades de tiempo**, y se necesita **1 éxito más** para realizar reparaciones completas.
                ⊗ **Juryrig mejorado:** Cuando un personaje alcanza el **rango 6**, su habilidad mejora de la siguiente manera: un éxito ordinario produce un buen resultado, un buen éxito produce un resultado asombroso y un éxito sorprendente significa que el juryrig funciona tan bien que el sistema o elemento se considera reparado y en condiciones normales de funcionamiento.
        trained_only: false
      repair:
        attribute: WIL
        cost: 3
        url: /skills/technical-science#repair
        localized:
          - en:
              name: Repair
              description: |-
                This skill provides a character with training in the repair and maintenance of various types of mechanical and electronic technology. Any use of the repair skill requires a complex skill check and takes a period of time determined by the Gamemaster (minutes, hours, days, or weeks). The complexity of a repair skill check is related to the amount of damage that must be repaired:
                - **Stun Damage:** Fix an object with only stun damage is **Ordinary** complexity.
                - **Wound Damage:** Fix an object with wound damage is **Good** complexity.
                - **Mortal Damage:** Fixing an object with any amount of mortal damage is **Amazing** complexity (and may require 10+ successes).
                ⊗ **Increased Effect:** As a character’s specialty skill rank increases, he receives a bonus to any skill checks involving Technical Science or the other three specialty skills: **-1 step at rank 3**, **-2 at rank 6**, **-3 at rank 9**, and **-4 at rank 12**.
          - es:
              name: Repair
              description: |-
                Esta habilidad proporciona al personaje capacitación en la reparación y mantenimiento de diversos tipos de tecnología mecánica y electrónica. Cualquier uso de la habilidad de reparación requiere una prueba de habilidad compleja y toma un período de tiempo determinado por el Director de Juego (minutos, horas, días o semanas). La complejidad de una prueba de habilidad de reparación está relacionada con la cantidad de daño que se debe reparar:
                - **Daño por aturdimiento:** Reparar un objeto con solo daño por aturdimiento tiene una complejidad **ordinaria**.
                - **Daño por herida:** Reparar un objeto con daño por herida tiene una complejidad **Buena**.
                - **Daño Mortal:** Reparar un objeto con cualquier cantidad de daño Mortal tiene una complejidad **increíble** (y puede requerir más de 10 éxitos).
                ⊗ **Efecto aumentado:** A medida que aumenta el rango de habilidad especial de un personaje, este recibe una bonificación a cualquier prueba de habilidad que involucre ciencia técnica o las otras tres habilidades especiales: **-1 paso en el rango 3**, **-2 en el rango 6**, **-3 en el rango 9** y **-4 en el rango 12**.
        trained_only: false
        rank_benefits:
          - rank: 3
            title: Increased Effect
          - rank: 6
            title: Increased Effect
          - rank: 9
            title: Increased Effect
          - rank: 12
            title: Increased Effect
      juryrig:
        attribute: INT
        cost: 3
        url: /skills/technical-science#juryrig
        localized:
          - en:
              name: Juryrig
              description: |-
                This skill enables a character to make fast, patchwork repairs in order to get an electronic or mechanical device or system up and running for a short period of time. A juryrig repair, even when successful, adds difficulty to the full repairs that must be made later, but it can get a character through a sticky situation. A juryrig repair can be made successfully **once** on a specific system or item. If it breaks down after being juryrigged, the system or item won't work again until it's completely fixed (using Technical Science—repair). Making a juryrig skill check is a single action, but a character who tries to use this skill must do so on his first available action in a round, and he can't attempt any other actions for the rest of the round.
                ### Juryrig Results
                The amount of difficulty added to the full repairs depends on the result of the juryrig check:
                - **Critical Failure:** The system or item becomes unusable and can't be made functional again without full repairs.
                - **Failure:** The juryrig attempt doesn't work but can be tried again.
                - **Ordinary success:** The system or item becomes operational for **d6+1 time units**, and **3 more successes** are needed for full repairs (in addition to those already required).
                - **Good success:** The system or item becomes operational for **2d4+2 time units**, and **2 more successes** are needed for full repairs.
                - **Amazing success:** The system or item becomes operational for **3d4+2 time units**, and **1 more success** is needed to make full repairs.
                ### Rank Benefits
                ▶ **Rank 6 [Improved Juryrig]:** When a character reaches **Rank 6**, his ability improves as follows: an Ordinary success produces a Good result, a Good success produces an Amazing result, and an Amazing success means the juryrig works so well that the system or item is considered repaired and in regular working order.
          - es:
              name: Invención
              description: |-
                La invención permite a un personaje construir un componente o sistema electrónico o mecánico desde cero, o modificar un dispositivo existente para que realice una nueva función. El uso de esta habilidad requiere tiempo; las comprobaciones de Invención son siempre comprobaciones de habilidad complejas. Modificar un objeto existente puede hacerse en asaltos, pero todos los demás aspectos de la invención requieren horas, días, semanas o meses, según la determinación del Director del Juego.
                ⊗ **Efecto Incrementado:** A medida que aumenta el rango de habilidad de especialidad de un personaje, este recibe un bono a cualquier comprobación de habilidad que involucre Ciencia Técnica o las otras tres habilidades de especialidad: **bono de -1 paso al rango 3**, **-2 al rango 6**,
                **-3 al rango 9** y **-4 al rango 12**.
        trained_only: false
    trained_only: false
  vehicle-operation:
    attribute: DEX
    cost: 3
    category: Technical
    url: /skills/vehicle-operation
    localized:
      - en:
          name: Vehicle Operation
          description: |-
            This broad skill provides a character with a basic understanding of and proficiency with modern vehicles. Using this skill, a character can attempt to operate most normal land and water vehicles. Some military or specialized land and water vehicles may have controls that are too complex for the broad skill to cover, requiring at least some level of specialization before a character is able to operate them successfully. The ordinary operation of any normal land or water vehicle doesn''t require a skill check. During chases, races, or vehicle combat, or when navigating through challenging obstacles, skill checks may be called for. When a character purchases any of the **Vehicle Operation** specialty skills, he selects a specific type of vehicle. For more details on vehicles, see the section on [Vehicles and Vessels](/core-mechanics/vehicles-and-vessels/).
      - es:
          name: Operación de Vehículos
          description: |-
            Esta amplia habilidad proporciona al personaje una comprensión básica y competencia con los vehículos modernos. Usando esta habilidad, un personaje puede intentar operar la mayoría de los vehículos terrestres y acuáticos normales. Algunos vehículos terrestres y acuáticos militares o especializados pueden tener controles que son demasiado complejos para que los cubra la habilidad general, lo que requiere al menos cierto nivel de especialización antes de que un personaje pueda operarlos con éxito. La operación normal de cualquier vehículo terrestre o acuático normal no requiere una prueba de habilidad. Durante persecuciones, carreras o combates de vehículos, o al atravesar obstáculos desafiantes, es posible que se requieran pruebas de habilidad. Cuando un personaje compra cualquiera de las habilidades especiales de **Operación de vehículos**, selecciona un tipo específico de vehículo. Para obtener más detalles sobre vehículos, consulte la sección sobre [Vehículos y embarcaciones](/core-mechanics/vehicles-and-vessels/).
    items:
      air-vehicle:
        attribute: DEX
        cost: 5
        url: /skills/vehicle-operation#air-vehicle
        localized:
          - en:
              name: Air vehicle
              description: |-
                This specialty skill enables a character to become trained in the use of a specific type of air vehicle. If he wants to be skilled in the operation of more than one type of air vehicle, he must purchase and improve each specialty skill separately. Types of air vehicles include propeller planes, helicopters, private jets, commercial jets, and jet fighters.
          - es:
              name: Vehículo Aéreo
              description: |-
                Esta habilidad especial permite a un personaje entrenarse en el uso de un tipo específico de vehículo aéreo. Si quiere adquirir habilidades en la operación de más de un tipo de vehículo aéreo, debe comprar y mejorar cada habilidad especializada por separado. Los tipos de vehículos aéreos incluyen aviones de hélice, helicópteros, aviones privados, aviones comerciales y aviones de combate.
        trained_only: true
      land-vehicle:
        attribute: DEX
        cost: 3
        url: /skills/vehicle-operation#land-vehicle
        localized:
          - en:
              name: Land vehicle
              description: |-
                This specialty skill enables a character to become trained in the use of a specific type of land vehicle. If he wants to be skilled in the operation of more than one type of land vehicle, he must purchase and improve each specialty skill separately. Types of land vehicles include automobiles, motorcycles, race cars, large trucks, and tanks and other heavy military vehicles.
          - es:
              name: Vehículo Terrestre
              description: |-
                Esta habilidad especial permite que un personaje se entrene en el uso de un tipo específico de vehículo terrestre. Si quiere adquirir habilidades en el manejo de más de un tipo de vehículo terrestre, debe adquirir y mejorar cada habilidad especializada por separado. Los tipos de vehículos terrestres incluyen automóviles, motocicletas, autos de carreras, camiones grandes y tanques y otros vehículos militares pesados.
        trained_only: false
      space-vehicle:
        attribute: DEX
        cost: 5
        url: /skills/vehicle-operation#space-vehicle
        localized:
          - en:
              name: Space vehicle
              description: |-
                This specialty skill enables a character to become trained in the use of a specific type of space vehicle. If he wants to be skilled in the operation of more than one type of space vehicle, he must purchase and improve each specialty skill separately. This skill is also used to operate the helm of large, multicrewed space vessels. Other systems on space vessels require the specialized functions of the **[System Operation](/skills/system-operation/)** broad skill. Types of space vehicles include:
                - **Space fighters:** ships of 10 durability or less.
                - **Scouts and light freighters:** ships of 11–32 durability.
                - **Medium freighters and corvettes:** ships of 33–60 durability.
                - **Capital ships:** ships of 60+ durability.
          - es:
              name: Vehículo Espacial
              description: |-
                Esta habilidad especial permite que un personaje se entrene en el uso de un tipo específico de vehículo espacial. Si quiere adquirir habilidades en el manejo de más de un tipo de vehículo espacial, debe comprar y mejorar cada habilidad especializada por separado. Esta habilidad también se utiliza para operar el timón de grandes naves espaciales con múltiples tripulaciones. Otros sistemas en naves espaciales requieren las funciones especializadas de la habilidad general **[Operación del sistema](/skills/system-operation/)**. Los tipos de vehículos espaciales incluyen:
                - **Cazadores espaciales:** naves de 10 de durabilidad o menos.
                - **Exploradores y cargueros ligeros:** barcos con una durabilidad de 11 a 32.
                - **Cargueros y corbetas medianas:** barcos con una durabilidad de 33 a 60.
                - **Barcos capitales:** barcos de durabilidad 60+.
        trained_only: true
      water-vehicle:
        attribute: DEX
        cost: 3
        url: /skills/vehicle-operation#water-vehicle
        localized:
          - en:
              name: Water vehicle
              description: |-
                This specialty skill enables a character to become trained in the use of a specific type of water vehicle. If he wants to be skilled in the operation of more than one type of water vehicle, he must purchase and improve each specialty skill separately. This skill is also used to operate the helm of large, multicrewed water vessels (such as battleships, submarines, and oil tankers); these require a version of the specialized functions of the **[System Operation](/skills/system-operation/)** broad skill. Types of water vehicles include canoes, rafts and rowboats, powerboats, jet skis, sailboats, large commercial vessels, large military vessels, and submersible craft.
                ---
                ### Rank Benefits: Improved Proficiency
                As a character achieves higher ranks in one or more of the **Vehicle Operation** specialty skills, he becomes even more adept at operating the specific types of vehicles he has specialized in.
                ⊗ **Rank Benefit:** The character receives a situation die bonus to checks involving the specialized craft:
                - **-1 step** at rank 4.
                - **-2 step** at rank 8.
                - **-3 step** at rank 12.
          - es:
              name: Vehículo Acuático
              description: |-
                Esta habilidad especial permite a un personaje entrenarse en el uso de un tipo específico de vehículo acuático. Si quiere adquirir habilidades en el manejo de más de un tipo de vehículo acuático, debe adquirir y mejorar cada habilidad especializada por separado. Esta habilidad también se utiliza para operar el timón de grandes embarcaciones con tripulación múltiple (como acorazados, submarinos y petroleros); estos requieren una versión de las funciones especializadas de la habilidad amplia **[Operación del sistema](/skills/system-operation/)**. Los tipos de vehículos acuáticos incluyen canoas, balsas y botes de remos, lanchas a motor, motos acuáticas, veleros, grandes embarcaciones comerciales, grandes embarcaciones militares y embarcaciones sumergibles.
                ---
                ### Beneficios de rango: competencia mejorada
                A medida que un personaje alcanza rangos más altos en una o más de las habilidades especiales de **Operación de vehículos**, se vuelve aún más experto en operar los tipos específicos de vehículos en los que se ha especializado.
                ⊗ **Beneficio de rango:** El personaje recibe una bonificación de dado de situación a las pruebas que involucran la nave especializada:
                - **-1 paso** en el rango 4.
                - **-2 paso** en el rango 8.
                - **-3 pasos** en el rango 12.
        trained_only: false
    trained_only: false
