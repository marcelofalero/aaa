  navigation:
    attribute: INT
    cost: 6
    category: Other
    url: /skills/navigation
    localized:
      - en:
          name: Navigation
          description: |-
            This broad skill provides a character with training in navigating on a planetary surface or in space. Charting a course for a ground vehicle or spacecraft requires a simple skill check. The optimum time for a Navigation attempt is 5 minutes. Every minute less than 5 spent on the attempt is a +1 penalty; every minute more than 5 (to 10) is a -1 bonus.

            ### Navigation Situation Modifiers

            | Condition | Modifier |
            | :--- | :--- |
            | Combat conditions | +4 steps |
            | Hostile conditions | +2 steps |
            | Calm conditions | 0 |
            | Unexplored territory | +4 steps |
            | Partially explored territory | +2 steps |
            | Explored territory | 0 |
            | Familiar territory | -2 steps |
            | No equipment | +4 steps |
            | Damaged or unreliable equipment | +2 steps |
            | Dependable equipment | 0 |
            | Superior equipment | -2 steps |
            | Less than 5 minutes | +1 step / min. |
            | More than 5 minutes (max 10) | -1 step / min. |

            **For surface navigation only:**
            - **Darkness:** +3 steps
            - **Inclement weather:** +2 steps
            - **Rough terrain/turbulence:** +2 steps
      - es:
          name: Navegación
          description: |-
            Esta amplia habilidad proporciona al Personaje entrenamiento para navegar en una superficie planetaria o en el espacio. Trazar el rumbo de un vehículo terrestre o una nave espacial requiere una simple prueba de habilidad. El tiempo óptimo para un intento Navegación es de 5 minutos. Cada minuto menos de 5 invertido en el intento supone una penalización de +1; cada minuto más de 5 (a 10) es una bonificación de -1.

            ### Modificadores de situación Navegación

            | Condición | Modificador |
            | :--- | :--- |
            | Condiciones Combate | +4 pasos |
            | Condiciones hostiles | +2 pasos |
            | Condiciones de calma | 0 |
            | Territorio inexplorado | +4 pasos |
            | Territorio parcialmente explorado | +2 pasos |
            | Territorio explorado | 0 |
            | Territorio familiar | -2 pasos |
            | Sin equipamiento | +4 pasos |
            | Equipos dañados o poco confiables | +2 pasos |
            | Equipo confiable | 0 |
            | Equipamiento superior | -2 pasos |
            | Menos de 5 minutos | +1 paso/min. |
            | Más de 5 minutos (máximo 10) | -1 paso/min. |

            **Solo para superficie Navegación:**
            - **Oscuridad:** +3 pasos
            - **Inclemencias del tiempo:** +2 pasos
            - **Terreno accidentado/turbulencia:** +2 pasos
    items:
      astrogationdrivespace:
        attribute: INT
        cost: 3
        url: /skills/navigation#astrogationdrivespace
        localized:
          - en:
              name: Astrogation—drivespace
              description: |-
                This specialty skill involves the study and performance of navigation through drivespace, usually involving movement from one star system to another within the galaxy.

                Drivespace, in settings with faster-than-light space travel, is a parallel dimension tied to the gravity plane of the galaxy. 

                A character with this skill can plot courses for stardrive-equipped starships of all kinds. Any stardrive-equipped ship has a maximum distance, in light-years, that it can travel every time it drops out of normal space and into drivespace. This process is known as making a starfall.

                Larger ships have a greater maximum distance per starfall than smaller ones. For long trips, several starfalls—each requiring the use of the drivespace astrogation skill—must be accomplished before reaching the final destination.

                > **Note:** This skill may also be used to handle any other faster-than-light astrogation system (involving hyperspace, wormholes, jump gates, and so forth) that may exist in the Gamemaster’s campaign.

                ### Starfall Results
                - **Critical Failure**: make another check with a +2 penalty and consult the Drivespace Off Course Results table
                - **Failure**: make another check and consult the Drivespace Off Course Results table
                - **Ordinary**: arrive at the edge of the destination star system
                - **Good**: arrive inside destination star system, d12+2 AUs from target
                - **Amazing**: arrive inside destination system, d4 AUs from target

                ### Drivespace Off Course Results
                | Result               | Effect |
                | :---                 | :---   |
                | **Critical Failure** | Travel ship's maximum distance in drivespace in a random wrong direction. |
                | **Failure**          | Travel 50% of the ship's maximum distance in the intended direction, then 50% in a random wrong direction. |
                | **Ordinary**         | Travel 75% of the ship's maximum distance in the intended direction, then 25% in a random wrong direction. |
                | **Good**             | Travel 90% of the ship's maximum distance in the intended direction, then 10% in a random wrong direction. |
                | **Amazing**          | Arrive at the edge of the destination star system.                             |
          - es:
              name: Astrohabilidad—sistema
              description: |-
                Este Especialidad implica el estudio y ejecución de Navegación a través del espacio impulsor, lo que generalmente implica movimiento de un sistema estelar a otro dentro de la galaxia.

                Drivespace, en entornos con viajes espaciales más rápidos que la luz, es una dimensión paralela ligada al plano de gravedad de la galaxia.

                Un Personaje con esta habilidad puede trazar rumbos para naves estelares de todo tipo equipadas con motores estelares. Cualquier nave equipada con un motor estelar tiene una distancia máxima, en años luz, que puede viajar cada vez que sale del espacio normal y entra en el espacio motor. Este proceso se conoce como hacer una caída de estrellas.

                Las naves más grandes tienen una distancia máxima por caída de estrella mayor que las más pequeñas. Para viajes largos, se deben lograr varias caídas de estrellas, cada una de las cuales requiere el uso de la habilidad de astrogación del espacio impulsor, antes de llegar al destino final.

                > **Nota:** Esta habilidad también se puede usar para manejar cualquier sistema de astrogación más rápido que la luz Otros (que involucre hiperespacio, agujeros de gusano, puertas de salto, etc.) que pueda existir en la campaña de Director de Juego.

                ### Resultados de la lluvia de estrellas
                - **Fallo Crítico**: haz otra comprobación con una penalización de +2 y consulta la tabla de resultados fuera de curso de Drivespace
                - **Fallo**: haz otra comprobación y consulta la tabla de Resultados Fuera de Curso de Drivespace
                - **Ordinario**: llega al borde del sistema estelar de destino
                - **Bueno**: llega dentro del sistema estelar de destino, d12+2 AU desde el objetivo
                - **Asombroso**: llega dentro del sistema de destino, d4 AU desde el objetivo

                ### Resultados de Drivespace fuera de curso
                | Resultado | Efecto |
                | :--- | :--- |
                | **Fallo Crítico** | Recorre la distancia máxima del barco en el espacio de conducción en una dirección incorrecta aleatoria. |
                | **Fallo** | Viaja el 50% de la distancia máxima del barco en la dirección prevista, luego el 50% en una dirección incorrecta aleatoria. |
                | **Ordinario** | Viaja el 75% de la distancia máxima del barco en la dirección prevista, luego el 25% en una dirección incorrecta aleatoria. |
                | **Bueno** | Viaja el 90% de la distancia máxima del barco en la dirección prevista, luego el 10% en una dirección incorrecta aleatoria. |
                | **Asombroso** | Llegue al borde del sistema estelar de destino.                             |
        trained_only: true
      astrogationsystem:
        attribute: INT
        cost: 3
        url: /skills/navigation#astrogationsystem
        localized:
          - en:
              name: Astrogation—system
              description: |-
                This specialty skill encompasses the study and performance of astrogation through normal space, usually involving movement from one place to another within a star system. A character with this skill (or the Navigation broad skill) can plot a course for a starship that doesn't have or isn't using drivespace technology.

                Travel through normal space is usually measured in time units—how long it takes to get from one location to another. At Progress Level 7, starships can move through normal space at rates of up to 40% of light speed, but may not always be able to maintain that velocity for the full duration of a journey. The result of the astrogator’s skill check determines how efficient the course is—getting the ship to its destination without running into any obstacles, physical or otherwise, along the way.

                ### In-System Navigation Result
                - **Critical Failure**: make another check with a +2 penalty and consult the System/Surface Off Course Results table.
                - **Failure**: make another check and consult the System/Surface Off Course Results table.
                - **Ordinary**: course is plotted at normal travel time plus d4 time units.
                - **Good**: course is plotted at normal travel time.
                - **Amazing**: course cuts travel time by 1 time unit.

                ### System/Surface Off Course Results
                | Result | Effect |
                | :--- | :--- |
                | **Critical Failure** | Travel for d12+3 hours in random wrong direction. The next Navigation check made by a member of the traveling group carries a +2 penalty. |
                | **Marginal Success** | Travel for d6+2 hours in random wrong direction. Identifying traveling group's precise position requires d4 hours of observation and mapping. Any Navigation check made before this time limit expires carries a +2 penalty. |
                | **Ordinary Success** | Travel for d4 hours in random wrong direction. Identifying traveling group's precise position requires d20+10 minutes. |
                | **Good Success** | Travel for d20+3 minutes in random wrong direction. Identifying traveling group's precise position requires d6+5 minutes. |
                | **Amazing Success** | Travel for d12 minutes in random wrong direction, with traveling group's precise position known as soon as that travel is over. |
          - es:
              name: Navegación—superficie
              description: |-
                Este Especialidad abarca el estudio y la realización de astrogación a través del espacio normal, que normalmente implica movimiento de un lugar a otro dentro de un sistema estelar. Un Personaje con esta habilidad (o la habilidad amplia Navegación) puede trazar un rumbo para una nave espacial que no tiene o no utiliza tecnología de espacio motriz.

                Los viajes a través del espacio normal generalmente se miden en unidades de tiempo: cuánto tiempo se tarda en llegar de un lugar a otro. En el nivel de progreso 7, las naves espaciales pueden moverse a través del espacio normal a velocidades de hasta el 40% de la velocidad de la luz, pero es posible que no siempre puedan mantener esa velocidad durante todo el viaje. El resultado de la prueba de habilidad del astrogator determina qué tan eficiente es el rumbo: llevar la nave a su destino sin toparse con ningún obstáculo, Físico o de otro tipo, en el camino.

                ### Resultado de Navegación en el sistema
                - **Fallo Crítico**: realizar otra comprobación con penalización de +2 y consultar la tabla de Resultados Sistema/Superficie Fuera de Curso.
                - **Falla**: realizar otra comprobación y consultar la tabla de Resultados Sistema/Superficie Fuera de Curso.
                - **Ordinario**: el rumbo se traza en el tiempo de viaje normal más d4 unidades de tiempo.
                - **Bueno**: el rumbo se traza en el tiempo de viaje normal.
                - **Asombroso**: el curso reduce el tiempo de viaje en 1 unidad de tiempo.

                ### Resultados del sistema/superficie fuera del rumbo
                | Resultado | Efecto |
                | :--- | :--- |
                | **Fallo Crítico** | Viaja durante d12+3 horas en dirección equivocada aleatoria. La siguiente prueba de Navegación realizada por un miembro del grupo de viaje conlleva una penalización de +2. |
                | **Éxito marginal** | Viaja durante d6+2 horas en dirección equivocada aleatoria. Identificar la posición precisa del grupo de viaje requiere cuatro horas de observación y mapeo. Cualquier comprobación de Navegación realizada antes de que expire este límite de tiempo conlleva una penalización de +2. |
                | **Éxito de Ordinario** | Viaja durante d4 horas en dirección equivocada al azar. Identificar la posición precisa del grupo de viaje requiere d20+10 minutos. |
                | **Bueno Éxito** | Viaja durante d20+3 minutos en dirección equivocada aleatoria. Identificar la posición precisa del grupo de viaje requiere d6+5 minutos. |
                | **Éxito de Asombroso** | Viaje durante d12 minutos en una dirección aleatoria incorrecta, y la posición precisa del grupo de viaje se conocerá tan pronto como finalice el viaje. |
