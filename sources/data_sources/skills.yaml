            name: Technical Knowledge
            description: ''
  law:
    attribute: INT
    cost: 0
    category: Social
    url: /skills/law
    localized:
    - en:
        name: Law
        description: "This broad skill provides a character with general knowledge of the laws and legal systems of her native society. It can be a branch of human civilization on Earth or a colony planet; it could also be a specific alien society or culture.\n\nThe Law skill can be used as an encounter skill to change the attitude of an individual. If this results in an attitude of **Friendly** or better, it provides a **-1 step bonus** on subsequent skill checks to get information or cooperation out of that individual.\n\nWith a successful skill check, a character can avoid legal entanglements, understand court procedures, and have a working knowledge of the techniques used by a specific society's law enforcers. In a courtroom drama or legal issue, a Law skill check can be used to determine the outcome.\n\n### Courtroom Resolution\nWhen a legal battle is played out \"off camera,\" the GM may call for Law skill checks. In a competing check:\n- **Critical Failure:** Opposing lawyer receives\
          \ a -3 bonus; or the character loses the case outright.\n- **Failure:** Opposing lawyer receives a -1 bonus to his skill check.\n- **Ordinary:** Success made with no modifier.\n- **Good:** Opponent takes a +1 penalty.\n- **Amazing:** Opponent takes a +3 penalty, or the character wins the case outright.\n\n---"
    - es:
        name: Ley
        description: "Esta habilidad general proporciona a un personaje conocimientos generales sobre las leyes y sistemas legales de su sociedad nativa. También puede tratarse como una habilidad de encuentro para cambiar la actitud de un individuo.\n\nEn una acción legal, el personaje y el oponente realizan tiradas de habilidad alternas hasta que alguien obtiene un Fallo Crítico o un resultado Asombroso."
    items:
      psionic-law:
        attribute: INT
        cost: 3
        url: /skills/law#psionic-law
        localized:
        - en:
            name: Psionic Law
            description: "Lawyers, judges, and others use this skill to interact in courtrooms and in legislative meetings. This aspect of the Law broad skill is used to argue a case or a point of view in an official proceeding."
        - es:
            name: Habilidades de Especialidad
            description: "Abogados, jueces y otros utilizan esta habilidad para interactuar en un entorno judicial. Esta especialidad se usa para defender un caso o punto de vista en un procedimiento oficial.\n\n### Ley [Específica]\n*No se puede usar sin estar entrenado.*\n\nPara cada compra por separado de esta especialidad, un personaje selecciona una cultura o tipo de ley específico\n### Beneficios de Rango\n- **Efecto Mejorado:** Bonificación de -1 en el rango 3, -2 en el rango 6, -3 en el rango 9 y -4 en el rango 12.\n\n### Procedimientos de aplicación de la ley\nOficiales de policía, detectives, cazarrecompensas y otros utilizan esta habilidad para seguir (o eludir) los procedimientos legales de aplicación de la ley. Los temas incluyen vigilancia, registro e incautación, arresto y detención, y redacción de informes.\nEsta especialidad también se utiliza para determinar qué tan \"legal\" o sólido es un arresto.\n### Ley psiónica\n*No se puede usar sin estar entrenado.*\n\nLos abogados,\
              \ jueces y otros utilizan esta habilidad para interactuar en salas de tribunales y en reuniones legislativas. Este aspecto de la habilidad amplia de Ley se utiliza para argumentar un caso o un punto de vista en un procedimiento oficial."
      court-procedures:
        attribute: INT
        cost: 3
        url: /skills/law#court-procedures
        localized:
        - en:
            name: Court procedures
            description: "Lawyers, judges, and others use this skill to interact in a courtroom setting. This specialty is used to argue a case or point of view in an official proceeding.\n\n---"
        - es:
            name: Law enforcement procedures
            description: "Police officers, detectives, bounty hunters, and others use this skill to follow (or bend) legal law enforcement procedures. Topics covered include:\n- Knowing laws concerning surveillance, search, and seizure.\n- Proper arrest and detainment procedures.\n- Filling out reports and Otros official paperwork.\n\nThis specialty is also used to determine how \"Bueno\" an arrest is (providing ammunition to the lawyers who will try to make the arrest stick).\n\n---"
      law-enforcement-procedures:
        attribute: INT
        cost: 3
        url: /skills/law#law-enforcement-procedures
        localized:
        - en:
            name: Law enforcement procedures
            description: "Police officers, detectives, bounty hunters, and others use this skill to follow (or bend) legal law enforcement procedures. Topics covered include:\n- Knowing laws concerning surveillance, search, and seizure.\n- Proper arrest and detainment procedures.\n- Filling out reports and other official paperwork.\n\nThis specialty is also used to determine how \"good\" an arrest is (providing ammunition to the lawyers who will try to make the arrest stick).\n\n---"
        - es:
            name: Law, specific skill
            description: "For each separate purchase of this specialty, a Personaje selects a specific Cultura or a specific type of law (maritime law, salvage law, etc.). As the Especialidad is improved, the Personaje gains a progressively stronger grasp on the laws and legal systems of that Cultura or specialty.\n\n⊗ **Increased Effect:** At higher ranks, the Personaje becomes more proficient within the legal system of the Cultura in question. Using the specific skill provides a reduction to the Dado de Situación:\n- **-1 bonus at Rank 3**\n- **-2 bonus at Rank 6**\n- **-3 bonus at Rank 9**\n- **-4 bonus at Rank 12**\n---"
      law-specific-skill:
        attribute: INT
        cost: 2
        url: /skills/law#law-specific-skill
        localized:
        - en:
            name: Law, specific skill
            description: "For each separate purchase of this specialty, a character selects a specific culture or a specific type of law (maritime law, salvage law, etc.). As the specialty skill is improved, the character gains a progressively stronger grasp on the laws and legal systems of that culture or specialty.\n\n⊗ **Increased Effect:** At higher ranks, the character becomes more proficient within the legal system of the culture in question. Using the specific skill provides a reduction to the situation die:\n- **-1 bonus at Rank 3**\n- **-2 bonus at Rank 6**\n- **-3 bonus at Rank 9**\n- **-4 bonus at Rank 12**\n---"
        - es:
            name: Law, specific skill
            description: "For each separate purchase of this specialty, a character selects a specific culture or a specific type of law (maritime law, salvage law, etc.). As the specialty skill is improved, the character gains a progressively stronger grasp on the laws and legal systems of that culture or specialty.\n\n⊗ **Increased Effect:** At higher ranks, the character becomes more proficient within the legal system of the culture in question. Using the specific skill provides a reduction to the situation die:\n- **-1 bonus at Rank 3**\n- **-2 bonus at Rank 6**\n- **-3 bonus at Rank 9**\n- **-4 bonus at Rank 12**\n---"
  leadership:
    attribute: PER
    cost: 4
    category: Social
    url: /skills/leadership
    localized:
    - en:
        name: Leadership
        description: "This broad skill provides a character with the abilities and talents of a leader. With leadership training, a character can coordinate a group to get it to perform better or work as a team. Only one character can assume the role of leader at a time, and conflicting orders cancel each other out.\n\nA leader, by using an action to attempt a Leadership skill check and then achieving a degree of success on the check, provides a **-1 bonus** to all actions performed in the remainder of the current round and all of the following round by a certain number of followers.\n\n### Leadership Situation Modifiers\nThe check is modified by the attitude of the targets, plus any other factors determined by the GM:\n\n| Situation | Modifier |\n| :--- | :--- |\n| **Targets are accustomed to being led** | -2 steps |\n| **Targets recognize leader's authority** | 0 |\n| **Targets don't recognize leader's authority** | +2 steps |\n\n- **Note:** Leadership broad skill can't be used on targets\
          \ who are **Combative**.\n\n---\n\n### Results\n- **Critical Failure:** The leader confuses his followers, who receive a **+1 penalty** for the remainder of the current round and all of the following round. No further Leadership checks can be made in this scene.\n- **Failure:** The followers receive no bonus in the current round, but the leader can make another check in the next round.\n- **Ordinary:** As many as **two followers** receive the leadership bonus.\n- **Good:** As many as **four followers** receive the leadership bonus.\n- **Amazing:** As many as **six followers** receive the leadership bonus.\n\n---"
    - es:
        name: Liderazgo
        description: "Esta habilidad general proporciona a un personaje las capacidades y talentos de un líder. Un líder puede coordinar a un grupo para rendir mejor o trabajar en equipo. Solo un personaje puede asumir el papel de líder a la vez.\n\nLa tirada de acción de un líder proporciona una bonificación a todas las acciones realizadas en el resto del asalto y en todos los asaltos siguientes por parte de sus seguidores. No se puede usar sobre objetivos que estén Combativos.\n\n### Resultados\n- **Fallo Crítico:** El líder confunde a sus seguidores, quienes reciben una penalización de +1 para el resto del asalto.\n- **Fallo:** Los seguidores no reciben bonificación; el líder puede realizar otra tirada en el siguiente asalto.\n- **Ordinario:** Hasta dos seguidores reciben la bonificación de liderazgo.\n- **Bueno:** Hasta cuatro seguidores reciben la bonificación de liderazgo.\n- **Asombroso:** Hasta seis seguidores reciben la bonificación de liderazgo."
    items:
      command:
        attribute: PER
        cost: 4
        url: /skills/leadership#command
        localized:
        - en:
            name: Command
            description: "This specialty skill represents the character's ability to lead others by virtue of sheer authoritativeness and persuasive ability. This is the skill used by military officers, elected officials, and law enforcers to issue orders and see that they're carried out.\n\n**Note:** Command can't be used on targets who are Hostile or Combative; before such targets can be led, their attitude must be shifted (perhaps by the use of the Inspire skill).\n\n⊗ **Increased Effect:** As a character achieves higher ranks in this specialty, the bonus to his or her Leadership skill checks improves to **-1 at rank 4**, **-2 at rank 8**, and **-3 at rank 12**. (Note: This bonus is not cumulative.)\n\n---"
        - es:
            name: Habilidades de Especialidad
            description: "{{% list %}}\n- **Mando\n- **Inspirar:** Liderar mediante el ejemplo; puede usarse sobre objetivos Hostiles o Combativos.\n| Resultados | Descripción |\n| :--- | :--- |\n| **Ordinario** | El éxito indica que hasta dos seguidores reciben la bonificación de liderazgo. |\n| **Bueno** | El éxito indica que hasta cuatro seguidores reciben la bonificación de liderazgo. |\n| **Asombroso** | El éxito indica que hasta seis seguidores reciben la bonificación de liderazgo. |"
      inspire:
        attribute: PER
        cost: 3
        url: /skills/leadership#inspire
        localized:
        - en:
            name: Inspire
            description: "This specialty skill represents the ability to command by example. This skill can be used by military officers, elected officials, and law enforcers who also have the command specialty, but inspire is more often used by those who are trying to lead civil disobedience movements and other types of nonviolent activities.\n\nOne major difference is that **Inspire can be used on targets who are Hostile or Combative**, favorably altering the attitude of the target(s) toward the user of the skill.\n\n⊗ **Increased Effect:** As a character achieves higher ranks in this specialty, the bonus to his or her Leadership skill checks improves to **-1 at rank 4**, **-2 at rank 8**, and **-3 at rank 12**. (Note: This bonus is not cumulative.)\n\n---"
        - es:
            name: Inspirar
            description: "This Especialidad represents the ability to command by example. This skill can be used by military officers, elected officials, and law enforcers who also have the command specialty, but Inspirar is more often used by those who are trying to lead civil disobedience movements and Otros types of nonviolent activities.\n\nOne major difference is that **Inspirar can be used on targets who are Hostile or Combative**, favorably altering the attitude of the target(s) toward the user of the skill.\n\n⊗ **Increased Effect:** As a Personaje achieves higher ranks in this specialty, the bonus to his or her Liderazgo skill checks improves to **-1 at rank 4**, **-2 at rank 8**, and **-3 at rank 12**. (Note: This bonus is not cumulative.)\n\n---"
  life-science:
    attribute: INT
    cost: 7
    category: Technical
    url: /skills/life-science
    localized:
    - en:
        name: Life Science
        description: "This broad skill represents a character's training in the life sciences. Skill checks involving this skill are made the same as Knowledge skill checks.\n\n---"
    - es:
        name: Ciencias de la vida
        description: "Esta habilidad amplia representa la formación de un personaje en las ciencias de la vida. Las tiradas de habilidad que involucran esta habilidad se realizan de la misma manera que las tiradas de la habilidad de Conocimiento.\n\n---"
    items:
      biology-botany-zoology:
        attribute: INT
        cost: 3
        url: /skills/life-science#biology-botany-zoology
        localized:
        - en:
            name: Biology, Botany, Zoology
            description: "These specialty skills must be purchased separately.\n- **Biology:** The study of organisms and biochemical processes.\n- **Botany:** The study of plants and identification.\n- **Zoology:** The study of animals and animal life.\n\n⊗ **Increased Effect:** A character receives a **-1 bonus** at rank 3, **-2** at rank 6, **-3** at rank 9, and **-4** at rank 12 on certain other skill checks that can be assisted by this specialty. These skills include Survival, Animal Handling, and Medical Science—treatment."
        - es:
            name: Biología, Botánica, Zoología
            description: "Estas habilidades de especialidad deben comprarse por separado.\n- **Biología:** El estudio de los organismos y sus procesos bioquímicos.\n- **Botánica:** El estudio e identificación de las plantas.\n- **Zoología:** El estudio de los animales y la vida animal.\n\n⊗ **Efecto incrementado:** Un personaje recibe una **bonificación de -1 paso** en el rango 3, **-2** en el rango 6, **-3** en el rango 9 y **-4** en el rango 12 en ciertas otras tiradas de habilidad que puedan ser asistidas por esta especialidad. Estas habilidades incluyen Supervivencia, Manejo de animales y Ciencias médicas—tratamiento.\n\n---"
      psionics:
        attribute: INT
        cost: 3
        url: /skills/life-science#psionics
        localized:
        - en:
            name: Psionics
            description: "This specialty skill represents the scientific study of the biological and biochemical nature of psionic abilities.\n\n⊗ **Increased Effect:** A character receives a **-1 bonus** at rank 3, **-2** at rank 6, **-3** at rank 9, and **-4** at rank 12 on certain other skill checks that can be assisted by this specialty. These skills include Telepathy—drain, Bio-Kinesis—bioluminescent, and Bio-Kinesis—bioweapon."
        - es:
            name: Genética
            description: "La genética es el estudio de la herencia y los genes, formando la base de la ingeniería genética y la clonación.\n\n⊗ **Efecto incrementado:** Un personaje recibe una **bonificación de -1 paso** en el rango 3, **-2** en el rango 6, **-3** en el rango 9 y **-4** en el rango 12 en ciertas otras tiradas de habilidad que puedan ser asistidas por esta especialidad. Estas habilidades incluyen Ciencias médicas—tratamiento, Ciencias forenses y ciertas tiradas de Biocinesis o Mutación.\n\n---"
      biology:
        attribute: INT
        cost: 3
        url: /skills/life-science#biology
        localized:
        - en:
            name: Biology
            description: ''
        - es:
            name: Xenología
            description: "La xenología es el estudio de formas de vida animal de naturaleza alienígena y puede usarse para identificar o clasificar dichas formas de vida, incluida la vida vegetal alienígena. Permite a un personaje realizar suposiciones educadas sobre la naturaleza, el comportamiento y las capacidades de las formas de vida alienígenas.\n\n⊗ **Efecto incrementado:** Un personaje recibe una **bonificación de -1 paso** en el rango 3, **-2** en el rango 6, **-3** en el rango 9 y **-4** en el rango 12 en ciertas otras tiradas de habilidad que puedan ser asistidas por esta especialidad. Estas habilidades incluyen Supervivencia (en entornos alienígenas), Manejo de animales (CON criaturas alienígenas) y Ciencias médicas—xenomedicina.\n---"
      botany:
        attribute: INT
        cost: 3
        url: /skills/life-science#botany
        localized:
        - en:
            name: Botany
            description: ''
        - es:
            name: Psiónica
            description: "Esta habilidad de especialidad representa el estudio científico de la naturaleza biológica y bioquímica de las habilidades psiónicas.\n\n⊗ **Efecto incrementado:** Un personaje recibe una **bonificación de -1 paso** en el rango 3, **-2** en el rango 6, **-3** en el rango 9 y **-4** en el rango 12 en ciertas otras tiradas de habilidad que puedan ser asistidas por esta especialidad. Estas habilidades incluyen Telepatía—drenaje, Biocinesis—bioluminiscente y Biocinesis—bioarma."
      genetics:
        attribute: INT
        cost: 3
        url: /skills/life-science#genetics
        localized:
        - en:
            name: Genetics
            description: "Genetics is the study of heredity and genes, forming the basis of genetic engineering and cloning.\n\n⊗ **Increased Effect:** A character receives a **-1 bonus** at rank 3, **-2** at rank 6, **-3** at rank 9, and **-4** at rank 12 on certain other skill checks that can be assisted by this specialty. These skills include Medical Science—treatment, Forensic Science, and certain Bio-Kinesis or Mutation checks.\n\n---"
        - es:
            name: Zoology
            description: ''
      xenology:
        attribute: INT
        cost: 3
        url: /skills/life-science#xenology
        localized:
        - en:
            name: Xenology
            description: "Xenology is the study of animal life forms of an alien nature and can be used to identify or classify such life forms, including alien plant life. It allows a character to make educated guesses as to the nature, behavior, and abilities of alien life forms.\n\n⊗ **Increased Effect:** A character receives a **-1 bonus** at rank 3, **-2** at rank 6, **-3** at rank 9, and **-4** at rank 12 on certain other skill checks that can be assisted by this specialty. These skills include Survival (in alien environments), Animal Handling (with alien creatures), and Medical Science—xenomedicine.\n---"
        - es:
            name: Xenology
            description: "Xenology is the study of animal life forms of an alien nature and can be used to identify or classify such life forms, including alien plant life. It allows a character to make educated guesses as to the nature, behavior, and abilities of alien life forms.\n\n⊗ **Increased Effect:** A character receives a **-1 bonus** at rank 3, **-2** at rank 6, **-3** at rank 9, and **-4** at rank 12 on certain other skill checks that can be assisted by this specialty. These skills include Survival (in alien environments), Animal Handling (with alien creatures), and Medical Science—xenomedicine.\n---"
      zoology:
        attribute: INT
        cost: 3
        url: /skills/life-science#zoology
        localized:
        - en:
            name: Zoology
            description: ''
        - es:
            name: Zoology
            description: ''
  medical-science:
    attribute: INT
    cost: 7
    category: Technical
    url: /skills/medical-science
    localized:
    - en:
        name: Medical Science
        description: "This broad skill provides a character with the training needed to perform medical procedures, including diagnosing ailments and researching medical information.\n\nA character with just the broad skill cannot treat damage; **Treatment** or **Surgery** specialties (or the **First Aid** specialty from the Knowledge broad skill) are required for those tasks.\n\n---"
    - es:
        name: Ciencias médicas
        description: "Esta habilidad amplia proporciona al personaje el entrenamiento necesario para realizar procedimientos médicos, incluyendo el diagnóstico de dolencias y la investigación de información médica.\n\nUn personaje CON solo la habilidad amplia no puede tratar daños; se requieren las especialidades de **Tratamiento** o **Cirugía** (o la especialidad de **Primeros auxilios** de la habilidad amplia de Conocimiento) para esas tareas.\n\n---"
    items:
      forensic-science:
        attribute: INT
        cost: 3
        url: /skills/medical-science#forensic-science
        localized:
        - en:
            name: Forensic Science
            description: "Forensic science is the application of medical and scientific knowledge to legal problems and criminal investigations. It is used to determine cause of death, identify remains, and analyze evidence from a crime scene.\n\n⊗ **Increased Effect:** A character receives a **-1 bonus** at rank 3, **-2** at rank 6, **-3** at rank 9, and **-4** at rank 12 on certain other skill checks that can be assisted by this specialty (e.g., Investigate, Law)."
        - es:
            name: Ciencias forenses
            description: "La ciencia forense es la aplicación del conocimiento médico y científico a problemas legales e investigaciones criminales. Se utiliza para determinar la causa de la muerte, identificar restos y analizar pruebas de la escena de un crimen.\n\n⊗ **Efecto incrementado:** Un personaje recibe una **bonificación de -1 paso** en el rango 3, **-2** en el rango 6, **-3** en el rango 9 y **-4** en el rango 12 en ciertas otras tiradas de habilidad que puedan ser asistidas por esta especialidad (por ejemplo, Investigar, Ley).\n\n---"
      medical-knowledge:
        attribute: INT
        cost: 3
        url: /skills/medical-science#medical-knowledge
        localized:
        - en:
            name: Medical Knowledge
            description: "This specialty skill represents a character's deep academic and practical understanding of medical principles, history, and advanced theory.\n\n⊗ **Increased Effect:** A character receives a **-1 bonus** at rank 3, **-2** at rank 6, **-3** at rank 9, and **-4** at rank 12 on other Medical Science checks (e.g., diagnosis, research)."
        - es:
            name: Conocimiento médico
            description: "Esta habilidad de especialidad representa la profunda comprensión académica y práctica de los principios médicos, la historia y la teoría avanzada del personaje.\n\n⊗ **Efecto incrementado:** Un personaje recibe una **bonificación de -1 paso** en el rango 3, **-2** en el rango 6, **-3** en el rango 9 y **-4** en el rango 12 en otras tiradas de Ciencias médicas (por ejemplo, diagnóstico, investigación).\n\n---"
      xenomedicine-specific:
        attribute: INT
        cost: 3
        url: /skills/medical-science#xenomedicine-specific
        localized:
        - en:
            name: Xenomedicine
            description: ''
        - es:
            name: Xenomedicine
            description: ''
      forensics:
        attribute: INT
        cost: 3
        url: /skills/medical-science#forensics
        localized:
        - en:
            name: Forensics
            description: ''
        - es:
            name: Cirugía
            description: "La cirugía implica el tratamiento de lesiones o trastornos del cuerpo mediante incisiones o manipulación. Se utiliza para reparar daños internos, extraer objetos extraños o realizar trasplantes de órganos.\n\n▶ **Competencia quirúrgica:** En el rango 3, el personaje puede reparar o curar organismos CON implantes cibernéticos. En el rango 6, el personaje puede instalar implantes cibernéticos.\n\n---"
      psychology:
        attribute: INT
        cost: 5
        url: /skills/medical-science#psychology
        localized:
        - en:
            name: Psychology
            description: "Psychology is the study of the mind and behavior. It can be used to diagnose mental disorders, understand motivations, or predict behavioral patterns.\n\n⊗ **Increased Effect:** A character receives a **-1 bonus** at rank 3, **-2** at rank 6, **-3** at rank 9, and **-4** at rank 12 on certain Interaction checks (e.g., Interview, Persuade, Bluff).\n\n---"
        - es:
            name: Tratamiento
            description: "La especialidad de tratamiento puede utilizarse para todas las tareas que cubren los primeros auxilios, pero CON mayor eficacia.\n\n### Curar Daño\n- **Daño por aturdimiento:** Restaura 2, 3 o 4 puntos a un paciente consciente.\n- **Recuperación de inconsciencia:** Recupera 2, 3 o 4 puntos de aturdimiento.\n- **Daño por heridas:** Tirada de habilidad compleja utilizando un botiquín de primeros auxilios (complejidad Ordinaria, 2 heridas curadas) o un paquete de traumatología (complejidad Marginal, 4 heridas curadas).\n- **Moribundo:** Estabiliza el daño Mortal, aumentando el tiempo entre las tiradas de Resistencia-aguante de una por hora a una por día.\n\n⊗ **Tratamiento mejorado:** Un personaje recibe una **bonificación de -1 paso** en el rango 3, **-2** en el rango 6, **-3** en el rango 9 y **-4** en el rango 12 en las tiradas de Tratamiento.\n\n---"
      surgery:
        attribute: INT
        cost: 5
        url: /skills/medical-science#surgery
        localized:
        - en:
            name: Surgery
            description: "Surgery involves the treatment of injuries or disorders of the body by incision or manipulation. It is used to repair internal damage, remove foreign objects, or perform organ transplants.\n\n▶ **Surgical Proficiency:** At rank 3, the character can repair or heal organisms with cybernetic implants. At rank 6, the character can install cybernetic implants.\n\n---"
        - es:
            name: Surgery
            description: "Surgery involves the treatment of injuries or disorders of the body by incision or manipulation. It is used to repair internal damage, remove foreign objects, or perform organ transplants.\n\n▶ **Surgical Proficiency:** At rank 3, the character can repair or heal organisms with cybernetic implants. At rank 6, the character can install cybernetic implants.\n\n---"
      treatment:
        attribute: INT
        cost: 4
        url: /skills/medical-science#treatment
        localized:
        - en:
            name: Treatment
            description: "The treatment specialty can be used for all tasks first aid covers, but with greater effectiveness.\n\n### Heal Damage\n- **Stun Damage:** Restores 2, 3, or 4 points to a conscious patient.\n- **Knockout Recovery:** Recovers 2, 3, or 4 stun points.\n- **Wound Damage:** Complex skill check using a first aid kit (Ordinary complexity, 2 wounds healed) or trauma pack (Marginal complexity, 4 wounds healed).\n- **Dying:** Stabilizes mortal damage, increasing the time between Stamina-endurance checks from one per hour to one per day.\n\n⊗ **Improved Treatment:** A character receives a **-1 bonus** at rank 3, **-2** at rank 6, **-3** at rank 9, and **-4** at rank 12 on Treatment checks.\n\n---"
        - es:
            name: Treatment
            description: "The treatment specialty can be used for all tasks first aid covers, but with greater effectiveness.\n\n### Heal Damage\n- **Stun Damage:** Restores 2, 3, or 4 points to a conscious patient.\n- **Knockout Recovery:** Recovers 2, 3, or 4 stun points.\n- **Wound Damage:** Complex skill check using a first aid kit (Ordinary complexity, 2 wounds healed) or trauma pack (Marginal complexity, 4 wounds healed).\n- **Dying:** Stabilizes mortal damage, increasing the time between Stamina-endurance checks from one per hour to one per day.\n\n⊗ **Improved Treatment:** A character receives a **-1 bonus** at rank 3, **-2** at rank 6, **-3** at rank 9, and **-4** at rank 12 on Treatment checks.\n\n---"
  melee-combat:
    attribute: STR
    cost: 6
    category: Combat
    url: /skills/melee-combat
    localized:
    - en:
        name: Melee Combat
        description: "Melee Combat represents the baseline proficiency of any physical combatant engaging in a struggle at personal range. It covers the essential understanding of reach, timing, and the efficient transfer of kinetic force through the body or a handheld tool. A character trained in this broad skill possesses an inherent grasp of spatial awareness and targeting, allowing them to identify vulnerabilities in an opponent while maintaining their own center of gravity and weapon posture during an exchange.\n\nProfessional training in this field also facilitates the use of firearms in the middle of a struggle. This training removes the +1 step penalties from pistols and SMGs when used against a melee opponent, and removes the +2 steps bonus to disarm an opponent have against you when you are wielding an assault rifle, sniper rifle, or any form of equipped heavy weapon. Furthermore, pistols and SMGs are handled with the same ease as a one-handed melee weapons would; they can be drawn\
          \ and fired in any circumstance where a knife or baton would be permitted.\n\n### Unarmed Damage\n\nThe base damage for an unarmed attack depends on the size of the character; for a medium-sized character, the baseline damage is **d4s/d4+1s/d4+2s**, plus the character's Strength bonus. Certain implements can be used to augment this damage, though some require specialized training to unlock their full potential. The skill entry in the weapon table indicates if the weapon requires ranks in a particular specialty skill to use it effectively; each rank below the indicated requirement results in a +1 step penalty to any attack made with such weapons.\n\n---"
    - es:
        name: Combate cuerpo a cuerpo
        description: "El Combate Cuerpo a Cuerpo representa la competencia básica de cualquier combatiente físico que participa en una lucha a corta distancia. Abarca la comprensión esencial del alcance, el tiempo y la transferencia eficiente de la fuerza cinética a través del cuerpo o una herramienta de mano. Un personaje entrenado en esta habilidad general posee una comprensión inherente de la conciencia espacial y la puntería, lo que le permite identificar vulnerabilidades en un oponente mientras mantiene su propio centro de gravedad y postura CON el arma durante un intercambio.\n\nEl entrenamiento profesional en este campo también facilita el uso de armas de fuego en medio de una lucha. Este entrenamiento elimina las penalizaciones de +1 paso de las pistolas y subfusiles cuando se usan contra un oponente en cuerpo a cuerpo, y elimina la bonificación de +2 pasos para desarmar que un oponente tiene contra ti cuando empuñas un rifle de asalto, un rifle de francotirador o cualquier forma\
          \ de arma pesada equipada. Además, las pistolas y los subfusiles se manejan CON la misma facilidad que las armas cuerpo a cuerpo de una mano; se pueden desenfundar y disparar en cualquier circunstancia en la que se permitiría un cuchillo o una porra.\n\n### Daño sin Armas\n\nEl daño base de un ataque sin armas depende del tamaño del personaje; para un personaje de tamaño mediano, el daño base es **d4s/d4+1s/d4+2s**, más la bonificación de Fuerza del personaje. Ciertos implementos pueden usarse para aumentar este daño, aunque algunos requieren un entrenamiento especializado para desbloquear todo su potencial. La entrada de la habilidad en la tabla de armas indica si el arma requiere rangos en una habilidad de especialidad particular para usarla de manera efectiva; cada rango por debajo del requisito indicado resulta en una penalización de +1 paso a cualquier ataque realizado CON tales armas.\n\n----------------------"
    items:
      blade:
        attribute: STR
        cost: 3
        url: /skills/melee-combat#blade
        localized:
        - en:
            name: Blade
            description: "As a character improves his ability in the blade specialty skill, he gains rank benefits as described below. Note: These benefits only apply when the character is using a weapon covered by this skill.\n\n⊗ Resistance Modifier: At higher ranks, the skill provides an improvement to a character's Strength resistance modifier. It improves by +1 at rank 4, by +1 again at rank 8, and by +1 again at rank 12. This increase doesn't stack with similar bonuses provided by other melee combat specialty skills.\n\n▶ Reaction Parry: When a character reaches rank 4, he can attempt to parry whenever a melee or unarmed attack is used against him. The parry attempt uses up the character's next available action.\n\n▶ Double-Strike: When a character reaches skill rank 6, he learns to make a double-strike against a target with a successful skill check. The player rolls one control die and two situation dice to make his double-strike attack. The first situation die is the base modifier\
              \ needed to make an attack with a +1 step penalty; the second situation die is the base modifier with a +2 step penalty.\n\n▶ Multistrike: When a character reaches skill rank 9, he learns to make multiple attacks in a single phase. The character can strike with a melee weapon three times in a phase. These attacks can be directed at a single target or at up to three separate targets within two meters of the character.\n\n---"
        - es:
            name: Arma blanca
            description: "La esencia de las artes marciales defensivas y basadas en la destreza radica en la no resistencia y la manipulación sofisticada de los vectores cinéticos. En lugar de enfrentar la fuerza CON la fuerza, estos estilos utilizan movimientos fluidos y esféricos para redirigir el impulso de un atacante, convirtiendo efectivamente su propia masa y aceleración en su contra. Al priorizar la elasticidad estructural y la propiocepción de alto nivel, un practicante permanece inasible, utilizando un juego de pies preciso y un cambio de peso dinámico para abandonar la línea de ataque mientras realiza una transición simultánea a una posición de contra-apalancamiento.\n\n**Rango 1: Línea de Base Táctica.** El practicante aprende a mantener el equilibrio mientras identifica las aberturas. Aumenta el daño base sin armas a **d4s/d6s/d6w**.\n\n**Rango 3: Juego de Pies Fluido.** Al aprovechar su velocidad y flexibilidad, el movimiento reactivo del practicante proporciona un aumento\
              \ de paso en su resistencia de Fuerza, y otro paso en los Rangos 7 y 11.\n\n**Rango 4: Contraataque Fluido.** Cuando un oponente falla un ataque cuerpo a cuerpo contra el practicante, el siguiente ataque del practicante contra ese oponente específico antes del final del siguiente asalto puede usar su modificador de fuerza o el de su oponente para el daño.\n\n**Rango 7: Redirección de la fuerza sobre-comprometida.** Si un oponente realiza un ataque total contra ti, recibe todas las penalizaciones pero ningún beneficio.\n\n**Rango 10: Flujo Persistente.** Todos los ataques totales que te fallen pueden ser redirigidos contra cualquier otro objetivo adyacente al atacante. El atacante debe realizar una nueva tirada de ataque normal contra el nuevo objetivo para determinar el resultado.\n\n**Rango 12: Maestro sin Forma.** El practicante puede ignorar 1 paso de la defensa de fuerza debido a la imprevisibilidad de sus ataques.\n\n----------------------------"
      blunt:
        attribute: STR
        cost: 3
        url: /skills/melee-combat#blunt
        localized:
        - en:
            name: Blunt
            description: "As a character improves his ability in the blunt specialty skill, he gains rank benefits as described below. Note: These benefits only apply when the character is using a weapon covered by this skill.\n\n⊗ Resistance Modifier: At higher ranks, the skill provides an improvement to a character's Strength resistance modifier. It improves by +1 at rank 4, by +1 again at rank 8, and by +1 again at rank 12. This increase doesn't stack with similar bonuses provided by other melee combat specialty skills.\n\n▶ Reaction Parry: When a character reaches rank 4, he can attempt to parry whenever a melee or unarmed attack is used against him. The parry attempt uses up the character's next available action.\n\n▶ Double-Strike: When a character reaches skill rank 6, he learns to make a double-strike against a target with a successful skill check. The player rolls one control die and two situation dice. The first situation die is the base modifier with a +1 step penalty; the second\
              \ situation die is the base modifier with a +2 step penalty.\n\n▶ Multistrike: When a character reaches skill rank 9, he learns to make multiple attacks in a single phase. The character can strike with a melee weapon three times in a phase. These attacks can be directed at a single target or at up to three separate targets within two meters of the character.\n\n---"
        - es:
            name: Arma contundente
            description: "La esencia de las artes marciales orientadas al poder radica en la movilización eficiente de la masa corporal total a través de la alineación estructural y la secuenciación cinética explosiva. En lugar de depender de la fuerza muscular aislada, estos estilos tratan el cuerpo como una unidad única y rígida en el momento del impacto, utilizando el suelo como punto de apoyo para canalizar la energía de las piernas y las caderas giratorias hacia un punto de entrega enfocado. Al sincronizar la respiración, el apilamiento esquelético y el \"peso que cae\", el practicante maximiza la física del impulso para superar la resistencia de un oponente a través de la pura integridad estructural y la fuerza calculada.\n\n**Rango 1: El practicante aprende a aprovechar adecuadamente su masa.** Aumenta el daño base sin armas a **d4s/d4w/d6+1w**.\n\n**Rango 3: Entrega de fuerza CON alto impulso.** Un éxito Asombroso en un ataque obliga al objetivo a realizar una prueba de noqueo (Resolución\
              \ o Resistencia) CON una penalización de +1 paso. Esta penalización aumenta a +2 en el Rango 6, +3 en el Rango 9 y +4 en el Rango 12.\n\n**Rango 4: La eficiencia estructural aumenta el daño.** Todo el daño sin armas aumenta en 1. Esta bonificación aumenta en 1 adicional en el Rango 8 y el Rango 12.\n\n**Rango 4: Aumenta la resistencia cuerpo a cuerpo del personaje en un paso, y otro paso en el Rango 8 y el Rango 12.\n\n**Rango 5: Poder de corto alcance (Fajin).** El practicante puede golpear eficazmente incluso si sus manos están atadas o inutilizables (usando hombros, rodillas o cabezazos).\n\n**Rango 8: Destrucción Estructural.** Cuando el practicante usa un Ataque Total, el objetivo debe tirar los dados de su Armadura dos veces y tomar el peor resultado. Esto se aplica a las armaduras estándar.\n\n**Rango 12: Maestro de la Fuerza.** La penalización de armadura \"tirar dos veces/tomar el peor\" ahora se aplica a las Armaduras de Poder y las defensas sobrenaturales.\n\n**Nota:**\
              \ Los practicantes que utilizan CON frecuencia las opciones de Ataque Total en combate suelen ser llamados luchadores.\n\n-------------------------------\n\n⊗ Modificador de Resistencia: En rangos superiores, cualquier habilidad de especialidad de Armas Cuerpo a Cuerpo proporciona una mejora al modificador de resistencia de Fuerza de un personaje. Mejora en +1 en el rango 4, en +1 de nuevo en el rango 8 y en +1 de nuevo en el rango 12.\n\n▶ Parada de Reacción: Cuando un personaje alcanza el rango 4, puede intentar parar siempre que se utilice un ataque cuerpo a cuerpo o sin armas contra él. El intento de parada gasta la siguiente acción disponible del personaje. Por ejemplo, un personaje que logra un resultado de chequeo de acción Ordinario y tiene 2 acciones por ronda podría intentar parar ataques dirigidos contra él en las fases Asombrosa y Buena, pero luego no le quedarían acciones para las fases Ordinaria y Marginal.\n\n▶ Doble Golpe: Cuando un personaje alcanza el rango\
              \ de habilidad 6, aprende a realizar un doble golpe contra un objetivo CON un chequeo de habilidad exitoso. Un doble golpe funciona de la siguiente manera: El jugador tira un dado de control y dos dados de situación para realizar su ataque de doble golpe. El primer dado de situación es el modificador base necesario para realizar un ataque CON una penalización de +1 paso; el segundo dado de situación es el modificador base CON una penalización de +2 pasos.\n\n▶ Multigolpe: Cuando un personaje alcanza el rango de habilidad 9, aprende a realizar múltiples ataques en una sola fase. El personaje puede golpear CON un arma cuerpo a cuerpo tres veces en una fase. Estos ataques pueden dirigirse a un solo objetivo o a hasta tres blancos separados a menos de dos metros del personaje.\n\nPara resolver un ataque de multigolpe, el jugador del personaje tira un dado de control y tres dados de situación al mismo tiempo. Todos los resultados se leen en el dado de control, según lo modificado\
              \ por los tres dados de situación. En un ataque de multigolpe, el primero dado de situación es el dado base para el ataque CON una penalización de +1 paso. El segundo dado es el dado base CON una penalización de +2 pasos. El tercero dado es el dado base CON una penalización de +3 pasos. Al calcular el dado de situación base, utiliza el objetivo que sea más difícil de golpear."
      defensive-martial-arts:
        attribute: STR
        cost: 3
        url: /skills/melee-combat#defensive-martial-arts
        localized:
        - en:
            name: Defensive Martial Arts
            description: "As a character improves his ability in the defensive martial arts specialty skill, he gains rank benefits as described below. Note: These benefits only apply when the character is fighting unarmed or with appropriate martial arts implements.\n\nThe essence of defensive and dexterity-based martial arts lies in non-resistance and the sophisticated manipulation of kinetic vectors. Rather than meeting force with force, these styles utilize fluid, spherical movements to redirect an attacker's momentum, effectively turning their own mass and acceleration against them.\n\n▶ Overpowering: This skill can be used to determine the success of an attempt to overpower an opponent. Briefly, overpowering is a form of unarmed attack made simultaneously by one or more allies trying to grab and restrain a single opponent. If a single attacker tries to overpower another character, his Melee Combat skill check is made at a +1 penalty.\n\nEvery additional attacker who takes part in the\
              \ same overpowering attempt provides a cumulative –1 bonus to the skill check. Overpowering does not cause damage, but it immobilizes an opponent for as long as one of the attackers continues to maintain a tight hold on that opponent.\n\n▶ Base Damage: When a character reaches skill rank 1, he learns to maintain balance while identifying openings. This increases his base unarmed damage to **d4s/d6s/d6w**.\n\n⊗ Resistance Modifier: At higher ranks, the skill provides an improvement to a character's Strength resistance modifier. By leveraging his speed and flexibility, the practitioner’s reactive movement provides a +1 step increase at rank 3, an additional +1 at rank 7, and a final +1 at rank 11. This increase doesn't stack with similar bonuses provided by other melee combat specialty skills.\n\nHow we do things reaches rank 4, if an opponent misses him with a melee attack, the character's next attack against that specific opponent before the end of the next round can use either\
              \ his own or his opponent's Strength modifier for damage.\n\n▶ Redirection of Force: When a character reaches rank 7, if an opponent performs an All Out Attack against him, the attacker receives all the penalties of that maneuver but gains none of the benefits.\n\nHow we do things reaches rank 10, All Out Attacks that miss him can be redirected against any other target adjacent to the attacker. The attacker must make a new normal attack roll against the new target to determine the result.\n\n▶ Formless Master: When a character reaches rank 12, he may ignore 1 step of an opponent's Strength defense due to the unpredictability of his attacks.\n\n---"
        - es:
            name: Artes marciales defensivas
            description: "As a Personaje improves his ability in the Artes marciales defensivas Especialidad, he gains rank benefits as described below. Note: These benefits only apply when the Personaje is fighting unarmed or with appropriate martial arts implements.\n\nThe essence of defensive and dexterity-based martial arts lies in non-resistance and the sophisticated manipulation of kinetic vectors. Rather than meeting force with force, these styles utilize fluid, spherical movements to redirect an attacker's momentum, effectively turning their own mass and acceleration against them.\n\n▶ Overpowering: This skill can be used to determine the success of an attempt to overpower an opponent. Briefly, overpowering is a form of unarmed attack made simultaneously by one or more allies trying to grab and restrain a single opponent. If a single attacker tries to overpower another Personaje, his Combate cuerpo a cuerpo skill check is made at a +1 penalty.\n\nEvery additional attacker who takes\
              \ part in the same overpowering attempt provides a cumulative –1 bonus to the skill check. Overpowering does not cause damage, but it immobilizes an opponent for as long as one of the attackers continues to maintain a tight hold on that opponent.\n\n▶ Base Damage: When a Personaje reaches skill rank 1, he learns to maintain balance while identifying openings. This increases his base unarmed damage to **d4s/d6s/d6w**.\n\n⊗ Resistance Modifier: At higher ranks, the skill provides an improvement to a Personaje's Strength resistance modifier. By leveraging his speed and flexibility, the practitioner’s reactive movement provides a +1 step increase at rank 3, an additional +1 at rank 7, and a final +1 at rank 11. This increase doesn't stack with similar bonuses provided by Otros Combate cuerpo a cuerpo specialty skills.\n\nHow we do things reaches rank 4, if an opponent misses him with a melee attack, the Personaje's next attack against that specific opponent before the end of the\
              \ next round can use either his own or his opponent's Strength modifier for damage.\n\n▶ Redirection of Force: When a Personaje reaches rank 7, if an opponent performs an All Out Attack against him, the attacker receives all the penalties of that maneuver but gains none of the benefits.\n\nHow we do things reaches rank 10, All Out Attacks that miss him can be redirected against any Otros target adjacent to the attacker. The attacker must make a new normal attack roll against the new target to determine the result.\n\n▶ Formless Master: When a Personaje reaches rank 12, he may ignore 1 step of an opponent's Strength defense due to the unpredictability of his attacks.\n\n---"
      power-martial-arts:
        attribute: STR
        cost: 3
        url: /skills/melee-combat#power-martial-arts
        localized:
        - en:
            name: Power Martial Arts
            description: "As a character improves his ability in the power martial arts specialty skill, he gains rank benefits as described below. Note: These benefits only apply when the character is fighting unarmed or with appropriate martial arts implements.\n\nThe essence of power-oriented martial arts lies in the efficient mobilization of total body mass through structural alignment and explosive kinetic sequencing. These styles treat the body as a single, rigid unit at the moment of impact, using the ground as a fulcrum to funnel energy.\n\n▶ Overpowering: This skill can be used to determine the success of an attempt to overpower an opponent. Briefly, overpowering is a form of unarmed attack made simultaneously by one or more allies trying to grab and restrain a single opponent. If a single attacker tries to overpower another character, his Melee Combat skill check is made at a +1 penalty.\n\nEvery additional attacker who takes part in the same overpowering attempt provides a cumulative\
              \ –1 bonus to the skill check. Overpowering does not cause damage, but it immobilizes an opponent for as long as one of the attackers continues to maintain a tight hold on that opponent.\n\n▶ Mass Leverage: When a character reaches skill rank 1, he learns to properly leverage his mass. This increases his base unarmed damage to **d4s/d4w/d6+1w**.\n\n▶ High Impulse: When a character reaches rank 3, an Amazing success on an attack forces the target to make a knockout check (Resolve or Stamina) with a +1 step penalty. This penalty increases to +2 at rank 6, +3 at rank 9, and +4 at rank 12.\n\n▶ Structural Efficiency: When a character reaches rank 4, all unarmed damage increases by +1. This bonus increases by an additional +1 at rank 8 and again at rank 12.\n\n⊗ Resistance Modifier: At higher ranks, the skill provides an improvement to a character's Strength resistance modifier. It improves by +1 at rank 4, by +1 again at rank 8, and by +1 again at rank 12. This increase doesn't\
              \ stack with similar bonuses provided by other melee combat specialty skills.\n\n▶ Short-range Power (Fajin): When a character reaches rank 5, he learns to strike effectively even if his hands are bound or unusable by utilizing his shoulders, knees, or head.\n\n▶ Structural Destruction: When a character reaches rank 8, if he utilizes an All Out Attack, the target must roll their Armor dice twice and take the worse result. This applies to standard armors.\n\n▶ Master of Force: When a character reaches rank 12, the \"roll twice/take worse\" armor penalty now applies to Powered Armors and supernatural defenses.\n\n**Note:** Practitioners that frequently utilize the All Out Attack option in combat are usually called brawlers.\n\n---"
        - es:
            name: Artes marciales de poder
            description: "As a Personaje improves his ability in the Artes marciales de poder Especialidad, he gains rank benefits as described below. Note: These benefits only apply when the Personaje is fighting unarmed or with appropriate martial arts implements.\n\nThe essence of power-oriented martial arts lies in the efficient mobilization of total body mass through structural alignment and explosive kinetic sequencing. These styles treat the body as a single, rigid unit at the moment of impact, using the ground as a fulcrum to funnel energy.\n\n▶ Overpowering: This skill can be used to determine the success of an attempt to overpower an opponent. Briefly, overpowering is a form of unarmed attack made simultaneously by one or more allies trying to grab and restrain a single opponent. If a single attacker tries to overpower another Personaje, his Combate cuerpo a cuerpo skill check is made at a +1 penalty.\n\nEvery additional attacker who takes part in the same overpowering attempt\
              \ provides a cumulative –1 bonus to the skill check. Overpowering does not cause damage, but it immobilizes an opponent for as long as one of the attackers continues to maintain a tight hold on that opponent.\n\n▶ Mass Leverage: When a Personaje reaches skill rank 1, he learns to properly leverage his mass. This increases his base unarmed damage to **d4s/d4w/d6+1w**.\n\n▶ High Impulse: When a Personaje reaches rank 3, an Asombroso success on an attack forces the target to make a knockout check (Firmeza or Aguante) with a +1 step penalty. This penalty increases to +2 at rank 6, +3 at rank 9, and +4 at rank 12.\n\n▶ Structural Efficiency: When a Personaje reaches rank 4, all unarmed damage increases by +1. This bonus increases by an additional +1 at rank 8 and again at rank 12.\n\n⊗ Resistance Modifier: At higher ranks, the skill provides an improvement to a Personaje's Strength resistance modifier. It improves by +1 at rank 4, by +1 again at rank 8, and by +1 again at rank 12.\
              \ This increase doesn't stack with similar bonuses provided by Otros Combate cuerpo a cuerpo specialty skills.\n\n▶ Short-range Power (Fajin): When a Personaje reaches rank 5, he learns to strike effectively even if his hands are bound or unusable by utilizing his shoulders, knees, or head.\n\n▶ Structural Destruction: When a Personaje reaches rank 8, if he utilizes an All Out Attack, the target must roll their Armor dice twice and take the worse result. This applies to standard armors.\n\n▶ Master of Force: When a Personaje reaches rank 12, the \"roll twice/take worse\" armor penalty now applies to Armas de energía Armors and supernatural defenses.\n\n**Note:** Practitioners that frequently utilize the All Out Attack option in Combate are usually called brawlers.\n\n---"
      powered-weapons:
        attribute: STR
        cost: 3
        url: /skills/melee-combat#powered-weapons
        localized:
        - en:
            name: Powered
            description: "As a character improves his ability in the powered specialty skill, he gains rank benefits as described below. Note: These benefits only apply when the character is using a weapon covered by this skill.\n\nDue to the inherent complexity of powered weapons they are more fragile than their counterparts; this requires the user to be more careful when parrying, resulting in a +2 step penalty on parry checks.\n\n⊗ Resistance Modifier: At higher ranks, the skill provides an improvement to a character's Strength resistance modifier. It improves by +1 at rank 4, by +1 again at rank 8, and by +1 again at rank 12. This increase doesn't stack with similar bonuses provided by other melee combat specialty skills.\n\n▶ Reaction Parry: When a character reaches rank 4, he can attempt to parry whenever a melee or unarmed attack is used against him. The parry attempt uses up the character's next available action.\n\n▶ Double-Strike: When a character reaches skill rank 6, he learns\
              \ to make a double-strike against a target with a successful skill check. The player rolls one control die and two situation dice. The first situation die is the base modifier with a +1 step penalty; the second situation die is the base modifier with a +2 step penalty.\n\n▶ Multistrike: When a character reaches skill rank 9, he learns to make multiple attacks in a single phase. The character can strike with a melee weapon three times in a phase. These attacks can be directed at a single target or at up to three separate targets within two meters of the character."
