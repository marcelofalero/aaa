        cost: 3
        url: /skills/navigation#astrogationdrivespace
        localized:
          - en:
              name: Astrogation—drivespace
              description: |-
                This specialty skill involves navigation through drivespace, usually movement between star systems.
                ### Starfall Results
                - **Critical Failure/Failure:** Consult "Drivespace Off Course Results" table.
                - **Ordinary:** Arrive at the edge of the destination star system.
                - **Good:** Arrive inside destination star system, d12+2 AUs from target.
                - **Amazing:** Arrive inside destination system, d4 AUs from target.
          - es:
              name: Astrohabilidad—sistema
              description: |-
                Esta habilidad especializada implica la navegación a través del espacio motriz, generalmente movimiento entre sistemas estelares.
                ### Resultados de la lluvia de estrellas
                - **Falla crítica/Falla:** Consulte la tabla "Resultados de Drivespace fuera de curso".
                - **Ordinario:** Llega al borde del sistema estelar de destino.
                - **Bien:** Llega al interior del sistema estelar de destino, d12+2 AU desde el objetivo.
                - **Increíble:** Llega al interior del sistema de destino, d4 AU desde el objetivo.
        trained_only: true
      astrogationsystem:
        attribute: WIL
        cost: 3
        url: /skills/navigation#astrogationsystem
        localized:
          - en:
              name: Astrogation—system
              description: |-
                This specialty skill covers navigation through a star system, usually movements between planets, moons, and stations.
                ### In-System Navigation Success
                - **Ordinary:** Arrive at destination +d4 hours from predicted time.
                - **Good:** Arrive at destination on schedule.
                - **Amazing:** Arrive at destination -d4 hours early.
          - es:
              name: Navegación—superficie
              description: |-
                Esta habilidad especializada cubre la navegación a través de un sistema estelar, generalmente movimientos entre planetas, lunas y estaciones.
                ### Éxito de la navegación dentro del sistema
                - **Ordinario:** Llegada a destino +d4 horas desde la hora prevista.
                - **Bueno:** Llegar a destino a tiempo.
                - **Increíble:** Llegada a destino -4 horas antes.
