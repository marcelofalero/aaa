            title: Surgical Proficiency
          - rank: 6
            title: Surgical Proficiency
      treatment:
        attribute: INT
        cost: 4
        url: /skills/medical-science#treatment
        localized:
          - en:
              name: Treatment
              description: |-
                The *treatment* specialty skill can be used to accomplish all the
                same tasks that the *first aid* skill is used for (healing stun
                damage, knockout recovery).

                ### Treatment Procedures
                **Heal Wound Damage:** When *treatment* is used to heal wounds,
                the character must be using either a first aid kit or a trauma
                pack, and a complex skill check is required. The task is Ordinary
                with a first aid kit, or Marginal if a trauma pack is used. If the
                check is successful, 2 wounds are healed with a first aid kit, and
                4 wounds are healed with a trauma pack.

                **Dying:** A character with any amount of mortal damage is
                considered to be dying. A character with *treatment* and either a
                first aid kit or a trauma pack can stabilize mortal damage,
                increasing the time between Stamina-endurance checks from one per
                hour to one per day.

                **Treating Disease:** The *treatment* specialty can be used to
                identify and treat debilitating diseases, with situation die
                modifiers dependent on the difficulty and virulence.

                ### Rank Benefits
                ⊗ **Rank 3, 6, 9, 12 [Improved Treatment]** As a character achieves higher skill ranks, he becomes more proficient at providing aid to injured
                patients. This is reflected by a reduction in situation die
                penalties: -1 step at rank 3, -2 steps at rank 6, -3 steps at rank
                9, and -4 at rank 12. Note that this benefit only reduces a
                penalty; it never provides a bonus.

          - es:
              name: Tratamiento
              description: |-
                El *tratamiento* Especialidad se puede utilizar para lograr todos los
                mismas tareas para las que se utiliza la habilidad *primeros auxilios* (curación Aturdimiento
                daño, recuperación por nocaut).

                ### Procedimientos de tratamiento
                **Curar daño Herida:** Cuando el *tratamiento* se usa para curar heridas,
                el Personaje debe estar usando un botiquín de primeros auxilios o un trauma
                paquete, y se requiere una prueba de habilidad compleja. La tarea es Ordinario.
                con un botiquín de primeros auxilios, o Marginal si se utiliza un paquete de trauma. si el
                La prueba tiene éxito, se curan 2 heridas con un botiquín de primeros auxilios y
                Se curan 4 heridas con una compresa traumatológica.

                **Muriendo:** Un Personaje con cualquier cantidad de daño Mortal es
                considerado como moribundo. Un Personaje con *tratamiento* y ya sea un
                El botiquín de primeros auxilios o un paquete de trauma pueden estabilizar el daño Mortal,
                aumentando el tiempo entre comprobaciones Aguante-Resistencia de una por
                hora a uno por día.

                **Tratamiento de enfermedades:** La especialidad de *tratamiento* se puede utilizar para
                identificar y tratar enfermedades debilitantes, con Dado de Situación
                modificadores que dependen de la dificultad y la virulencia.

                ### Beneficios de Rango
                ⊗ **Rango 3, 6, 9, 12 [Tratamiento mejorado]** A medida que Personaje alcanza una mayor habilidad Rangos, se vuelve más competente para brindar ayuda a los heridos.
                pacientes. Esto se refleja en una reducción en Dado de Situación.
                penalizaciones: -1 paso en Rango 3, -2 pasos en Rango 6, -3 pasos en Rango
                9 y -4 en Rango 12. Tenga en cuenta que este beneficio solo reduce un
                pena; nunca proporciona una bonificación.

