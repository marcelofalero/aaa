    trained_only: false
  knowledge:
    attribute: WIL
    cost: 4
    category: Technical
    url: /skills/knowledge
    localized:
    - en:
        name: Knowledge
        description: |-
          The ability to recall, research, and apply information. It represents a character's general education and ability to access data.

          ### Table P24: Knowledge Categories
          | Category | Modifier | Complexity |
          | :--- | :--- | :--- |
          | **Trivial** | -1 step bonus | Marginal (1-2) |
          | **General** | 0 (No modifier) | Ordinary (3-4) |
          | **Specific** | +2 step penalty | Good (6-8) |
          | **Expert** | +3 step penalty | Amazing (10+) |
    - es:
        name: Conocimiento
        description: |-
          The ability to recall, research, and apply information. It represents a personaje's general education and ability to access data.

          ### Table P24: Knowledge Categories
          | Category | Modifier | Complexity |
          | :--- | :--- | :--- |
          | **Trivial** | -1 paso bono | Marginal (1-2) |
          | **General** | 0 (No modifier) | Ordinario (3-4) |
          | **Specific** | +2 paso penalización | Bueno (6-8) |
          | **Expert** | +3 paso penalización | Asombroso (10+) |
    items:
      language-specific-skill:
        attribute: WIL
        cost: 3
        url: /skills/knowledge#language-specific-skill
        localized:
        - en:
            name: Language, Specific Skill
            description: |-
              This specialty skill gives a character a certain amount of fluency in a specific language. Every character begins with **Rank 3** in his or her native language. Lower ranks indicate a crude familiarity; higher ranks improve the character''s vocabulary and comprehension of obscure or complicated passages.
              ### Rank Benefits
              ▶ **Rank 4, 8, 12 [Improved Communication]:** As a character achieves higher skill ranks in a specific language, he or she gets better at employing other skills that involve language use (such as encounter skills and some Creativity specialties). This benefit provides a reduction to situation die penalties: **1 step at rank 4**, **2 steps at rank 8**, and **3 steps at rank 12**. This benefit only reduces a penalty; it never provides a bonus.
        - es:
            name: Idioma, Habilidad Específica
            description: |-
              Esta habilidad de especialidad le da a un personaje cierta fluidez en un idioma específico. Cada personaje comienza con el **rango 3** en su idioma nativo. Los rangos más bajos indican una familiaridad rudimentaria; los rangos más altos mejoran el vocabulario del personaje y la comprensión de pasajes oscuros o complicados.
              ### Beneficios de Rango
              ⊗ **Comunicación Mejorada:** A medida que un personaje alcanza rangos de habilidad más altos en un idioma específico, mejora en el empleo de otras habilidades que involucran el uso del lenguaje (como las habilidades de encuentro y algunas especialidades de Creatividad). Este beneficio proporciona una reducción a las penalizaciones por dado de situación:
              **1 paso al rango 4**, **2 pasos al rango 8** y **3 pasos al rango 12**. Este beneficio solo reduce una penalización; nunca proporciona un bono.
        trained_only: true
        rank_benefits:
        - rank: 3
          title: Improved Communication
        - rank: 4
          title: Improved Communication
        - rank: 8
          title: Improved Communication
        - rank: 12
          title: Improved Communication
      psionics:
        attribute: WIL
        cost: 3
        url: /skills/knowledge#psionics
        localized:
        - en:
            name: Psionics
            description: |-
              This skill gives a character a working knowledge of psionic abilities, perhaps even beyond what the character''s culture understands as a whole. The degree of success achieved on a skill check relates to the quality or quantity of information that is available to or understood by the character.
        - es:
            name: Psiónica
            description: |-
              Esta habilidad le da a un personaje un conocimiento práctico de las habilidades psiónicas, tal vez incluso más allá de lo que entiende su cultura como un todo. El grado de éxito logrado en una comprobación de habilidad se relaciona CON la calidad o cantidad de información disponible o comprendida por el personaje.
        trained_only: true
        rank_benefits:
        - rank: 3
          title: Increased Effect
        - rank: 6
          title: Increased Effect
        - rank: 9
          title: Increased Effect
        - rank: 12
          title: Increased Effect
      computer-operation:
        attribute: WIL
        cost: 2
        url: /skills/knowledge#computer-operation
        localized:
        - en:
            name: Computer Operation
            description: |-
              **Trained Only.** Proficiency in using software, operating systems, and network protocols. Unlike **Computer Science**, this is focused on user-end mastery.
        - es:
            name: Operación de Computadoras
            description: |-
              **Sólo Entrenado.** Proficiency in using software, operating systems, and network protocols. Unlike **Computer Science**, this is focused on user-end mastery.
        trained_only: true
      deduce:
        attribute: WIL
        cost: 2
        url: /skills/knowledge#deduce
        localized:
        - en:
            name: Deduce
            description: |-
              Using logic and reason to solve mysteries or technical problems.
              ### Rank Benefits
              ⊗ **Rank 4, 8, 12 [Cognitive Shield]:** Improves the **Intelligence** resistance modifier by +1 at Rank 4, +2 at Rank 8, and +3 at Rank 12. This protects against deception and mental manipulation.
        - es:
            name: Deducir
            description: |-
              Using logic and reason to solve mysteries or technical problems.
              ⊗ **Cognitive Shield:** Improves the **Intelligence** resistance modifier by +1 at Rango 4, +2 at Rango 8, and +3 at Rango 12. This protects against deception and mental manipulation.
        trained_only: false
        rank_benefits: []
      first-aid:
        attribute: WIL
        cost: 3
        url: /skills/knowledge#first-aid
        localized:
        - en:
            name: First Aid
            description: |-
              **Trained Only.** Basic medical care using field equipment.
              ### Rank Benefits
              ▶ **Rank 3 [Heal Stun]:** Restores 2/3/4 points (Ordinary/Good/Amazing).

              ⊗ **Rank 3 [Recovery]:** Brings a target from knockout to conscious (1/2/3 stun restored).

              ▶ **Rank 3 [Stabilization]:** Prevents a character from making a "scene end" survival check for mortal damage.

              ▶ **Rank 3 [Heal Wounds]:** Requires a **complex skill check** (Successes: kit 6, trauma pack 4). Success heals 1 (kit) or 2 (trauma pack) wounds.
        - es:
            name: Primeros Auxilios
            description: |-
              **Sólo Entrenado.** Basic medical care using field equipment.
              ▶ **Heal Stun:** Restores 2/3/4 points (Ordinario/Bueno/Asombroso).
              ▶ **Recovery:** Brings a target from knockout to conscious (1/2/3 stun restored).
              ▶ **Stabilization:** Prevents a personaje from making a "scene end" survival check for mortal damage.
              ▶ **Heal Wounds:** Requires a **tirada de habilidad compleja** (Successes: kit 6, trauma pack 4). Success heals 1 (kit) or 2 (trauma pack) wounds.
        trained_only: true
        rank_benefits: []
      research:
        attribute: WIL
        cost: 2
        url: /skills/knowledge#research
        localized:
        - en:
            name: Research
            description: |-
              The research specialty covers the techniques used to find, verify, and organize information from diverse sources, including physical archives, electronic databanks, and the Grid. It is also used to represent a character''s ability to learn and improve skills through study and mentorship.
              ### Mentorship and Learning
              A character can use research to assist another character (or himself) in learning a new skill or improving an existing one. A successful research check provides a bonus to the learning time required:
              - **Ordinary:** half the learning time required.
              - **Good:** one-quarter the learning time required.
              - **Amazing:** one-eighth the learning time required.
              ### Rank Benefits
              ▶ **Rank 3, 6, 9, 12 [Efficient Investigation]:** As a character achieves higher ranks in this specialty, he becomes more efficient at digging through data. He receives a **-1 step bonus** to research checks at **rank 3**,
              **-2 at rank 6**, **-3 at rank 9**, and **-4 at rank 12**.
        - es:
            name: Investigación
            description: |-
              La especialidad de investigación cubre las técnicas utilizadas para encontrar, verificar y organizar información de diversas fuentes, incluidos archivos físicos, bancos de datos electrónicos y la Red. También se utiliza para representar la capacidad de un personaje para aprender y mejorar habilidades a través del estudio y la mentoría.
              ### Mentoría y Aprendizaje
              Un personaje puede utilizar la investigación para asistir a otro personaje (o a sí mismo) en el aprendizaje de una nueva habilidad o en la mejora de una existente. Una comprobación de investigación exitosa proporciona una bonificación al tiempo de aprendizaje requerido:
              - **Ordinario:** la mitad del tiempo de aprendizaje requerido.
              - **Bueno:** una cuarta parte del tiempo de aprendizaje requerido.
              - **Asombroso:** una octava parte del tiempo de aprendizaje requerido.
              ⊗ **Investigación Eficiente:** A medida que un personaje alcanza rangos más altos en esta especialidad, se vuelve más eficiente al indagar en los datos. Recibe una **bonificación de -1 paso** en las tiradas de investigación en el **rango 3**, **-2 en el rango 6**, **-3 en el rango 9** y **-4 en el rango 12**.
        trained_only: false
        rank_benefits:
        - rank: 3
          title: Efficient Investigation
        - rank: 6
          title: Efficient Investigation
        - rank: 9
          title: Efficient Investigation
        - rank: 12
          title: Efficient Investigation
    trained_only: false
  law:
    attribute: WIL
    cost: 0
    category: Social
    url: /skills/law
    localized:
    - en:
        name: Law
        description: |-
          General knowledge of legal systems within a character's native society. Allows a character to navigate courtroom proceedings, legal entanglements, and law enforcement protocols.

          ### Legal Resolution (Courtroom Duel)
          ### Rank Benefits
          ▶ **Rank 3 [Off-Camera Duel]:** If a legal conflict is resolved "off-camera," an alternating check is performed between the opposing advocates.
          - **Critical Failure:** Opponent receives a -3 step bonus or the character loses the case immediately.
          - **Failure:** Opponent receives a -1 step bonus.
          - **Ordinary Success:** No modifier to the opponent.
          - **Good Success:** Opponent suffers a +1 step penalty.
          - **Amazing Success:** Opponent suffers a +3 step penalty or the character wins the case immediately.
    - es:
        name: Ley
        description: |-
          General knowledge of legal systems within a personaje's native society. Allows a personaje to navigate courtroom proceedings, legal entanglements, and law enforcement protocols.

          ### Legal Resolution (Courtroom Duel)
          ▶ **Off-Camera Duel:** If a legal conflict is resolved "off-camera," an alternating check is performed between the opposing advocates.
          - **Fallo Crítico:** Opponent receives a -3 paso bono or the personaje loses the case immediately.
          - **Fallo:** Opponent receives a -1 paso bono.
          - **Ordinario Success:** No modifier to the opponent.
          - **Bueno Success:** Opponent suffers a +1 paso penalización.
          - **Asombroso Success:** Opponent suffers a +3 paso penalización or the personaje wins the case immediately.
    items:
      court-procedures:
        attribute: WIL
        cost: 3
        url: /skills/law#court-procedures
        localized:
        - en:
            name: Court procedures
            description: |-
              Practical expertise in arguing cases and presenting points of view in official proceedings. Used primarily by lawyers and judges.
        - es:
            name: Procedimientos judiciales
            description: |-
              Practical expertise in arguing cases and presenting points of view in official proceedings. Used primarily by lawyers and judges.
