  melee-combat:
    attribute: STR
    cost: 6
    category: Combat
    url: /skills/melee-combat
    localized:
      - en:
          name: Melee Combat
          description: |-
            Melee Combat represents the baseline proficiency of any physical combatant engaging in a struggle at personal range. It covers the essential understanding of reach, timing, and the efficient transfer of kinetic force through the body or a handheld tool. A character trained in this broad skill possesses an inherent grasp of spatial awareness and targeting, allowing them to identify vulnerabilities in an opponent while maintaining their own center of gravity and weapon posture during an exchange. Professional training in this field also facilitates the use of firearms in the middle of a struggle. This training removes the +1 step penalties from pistols and SMGs when used against a melee opponent, and removes the +2 steps bonus to disarm an opponent have against you when you are wielding an assault rifle, sniper rifle, or any form of equipped heavy weapon. Furthermore, pistols and SMGs are handled with the same ease as a one-handed melee weapons would; they can be drawn and fired in any circumstance where a knife or baton would be permitted.
            ### Unarmed Damage
            The base damage for an unarmed attack depends on the size of the character; for a medium-sized character, the baseline damage is
            **d4s/d4+1s/d4+2s**, plus the character''s Strength bonus. Certain implements can be used to augment this damage, though some require specialized training to unlock their full potential. The skill entry in the weapon table indicates if the weapon requires ranks in a particular specialty skill to use it effectively; each rank below the indicated requirement results in a +1 step penalty to any attack made with such weapons.
      - es:
          name: Combate cuerpo a cuerpo
          description: |-
            El combate cuerpo a cuerpo representa la competencia básica de cualquier combatiente físico que participe en una lucha a distancia personal. Cubre la comprensión esencial del alcance, la sincronización y la transferencia eficiente de la fuerza cinética a través del cuerpo o una herramienta portátil. Un personaje entrenado en esta amplia habilidad posee una comprensión inherente de la conciencia espacial y la orientación, lo que le permite identificar las vulnerabilidades de un oponente mientras mantiene su propio centro de gravedad y postura del arma durante un intercambio. La formación profesional en este campo también facilita el uso de armas de fuego en medio de un enfrentamiento. Este entrenamiento elimina las penalizaciones de +1 paso de las pistolas y subfusiles cuando se usan contra un oponente cuerpo a cuerpo, y elimina la bonificación de +2 pasos para desarmar a un oponente que tiene contra ti cuando empuñas un rifle de asalto, un rifle de francotirador o cualquier forma de arma pesada equipada. Además, las pistolas y los Subfusil se manejan con la misma facilidad que lo harían las armas cuerpo a cuerpo con una sola mano; se pueden sacar y disparar en cualquier circunstancia en la que se permita un cuchillo o una porra.
            ### Daño desarmado
            El daño base de un ataque desarmado depende del tamaño del personaje; para un personaje de tamaño mediano, el daño básico es
            **d4s/d4+1s/d4+2s**, más el bono de Fuerza del personaje. Se pueden utilizar ciertos implementos para aumentar este daño, aunque algunos requieren entrenamiento especializado para desbloquear todo su potencial. La entrada de habilidad en la tabla de armas indica si el arma requiere rangos en una habilidad especial particular para usarla de manera efectiva; cada rango por debajo del requisito indicado resulta en una penalización de +1 paso a cualquier ataque realizado con dichas armas.
    items:
      blade:
        attribute: STR
        cost: 3
        url: /skills/melee-combat#blade
        localized:
          - en:
              name: Blade
              description: |-
                As a character improves his ability in the blade specialty skill, he gains rank benefits as described below. Note: These benefits only apply when the character is using a weapon covered by this skill.
                ⊗ Resistance Modifier: At higher ranks, the skill provides an improvement to a character''s Strength resistance modifier. It improves by +1 at rank 4, by +1 again at rank 8, and by +1 again at rank 12. This increase doesn''t stack with similar bonuses provided by other melee combat specialty skills.
                ▶ Reaction Parry: When a character reaches rank 4, he can attempt to parry whenever a melee or unarmed attack is used against him. The parry attempt uses up the character''s next available action.
                ▶ Double-Strike: When a character reaches skill rank 6, he learns to make a double-strike against a target with a successful skill check. The player rolls one control die and two situation dice to make his double-strike attack. The first situation die is the base modifier needed to make an attack with a +1 step penalty; the second situation die is the base modifier with a +2 step penalty.
                ▶ Multistrike: When a character reaches skill rank 9, he learns to make multiple attacks in a single phase. The character can strike with a melee weapon three times in a phase. These attacks can be directed at a single target or at up to three separate targets within two meters of the character.
          - es:
              name: Arma blanca
              description: |-
                A medida que un personaje mejora su habilidad en la habilidad especial de espada, obtiene beneficios de rango como se describe a continuación. Nota: Estos beneficios solo se aplican cuando el personaje usa un arma cubierta por esta habilidad.
                ⊗ Modificador de resistencia: en rangos más altos, la habilidad proporciona una mejora al modificador de resistencia a la fuerza de un personaje. Mejora en +1 en el rango 4, en +1 nuevamente en el rango 8 y en +1 nuevamente en el rango 12. Este aumento no se acumula con bonificaciones similares proporcionadas por otras habilidades especiales de combate cuerpo a cuerpo.
                ▶ Parada de reacción: cuando un personaje alcanza el rango 4, puede intentar parar cada vez que se utiliza un ataque cuerpo a cuerpo o sin armas contra él. El intento de parada consume la siguiente acción disponible del personaje.
                ▶ Doble golpe: cuando un personaje alcanza el rango de habilidad 6, aprende a realizar un doble golpe contra un objetivo con una prueba de habilidad exitosa. El jugador tira un dado de control y dos dados de situación para realizar su ataque de doble golpe. El primer dado de situación es el modificador de base necesario para realizar un ataque con una penalización de +1 paso; el segundo dado de situación es el modificador de base con una penalización de +2 pasos.
                ▶ Multigolpe: cuando un personaje alcanza el rango de habilidad 9, aprende a realizar múltiples ataques en una sola fase. El personaje puede atacar con un arma cuerpo a cuerpo tres veces en una fase. Estos ataques pueden dirigirse a un solo objetivo o hasta a tres objetivos separados dentro de un radio de dos metros del personaje.
        trained_only: false
