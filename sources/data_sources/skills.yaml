        rank_benefits: []
      inspire:
        attribute: PER
        cost: 3
        url: /skills/leadership#inspire
        localized:
        - en:
            name: Inspire
            description: |-
              **Trained Only.** Leading by example and shifting the morale of a group.
              ### Rank Benefits
              ▶ **Rank 3 [Morale Pivot]:** Unlike the broad skill, **Inspire** can be used on **Hostile** or **Combative** targets to shift their attitude as per [Table P25: Encounter Skill Effects]({{< relref "core-mechanics/useful-tables#table-p25-encounter-skill-effects" >}}).

              ⊗ **Rank 4, 8, 12 [Increased Effect]:** Ranks provide a situation die bonus to the check: Rank 4 (-1), Rank 8 (-2), Rank 12 (-3).
        - es:
            name: Inspirar
            description: |-
              **Sólo Entrenado.** Leading by example and shifting the morale of a group.
              ▶ **Morale Pivot:** Unlike the broad skill, **Inspire** can be used on **Hostile** or **Combative** targets to shift their attitude as per [Table P25: Encounter Skill Effects]({{< relref "core-mechanics/useful-tables#table-p25-encounter-skill-effects" >}}).
              ⊗ **Increased Effect:** Ranks provide a dado de situación bono to the check: Rango 4 (-1), Rango 8 (-2), Rango 12 (-3).
        trained_only: true
        rank_benefits: []
    trained_only: false
  life-science:
    attribute: WIL
    cost: 7
    category: Technical
    url: /skills/life-science
    localized:
    - en:
        name: Life Science
        description: |-
          This broad skill represents a character''s training in the life sciences. Skill checks involving this skill are made the same as Knowledge skill checks.
    - es:
        name: Ciencias de la vida
        description: |-
          Esta habilidad amplia representa la formación de un personaje en las ciencias de la vida. Las tiradas de habilidad que involucran esta habilidad se realizan de la misma manera que las tiradas de la habilidad de Conocimiento.
    items:
      biology-botany-zoology:
        attribute: WIL
        cost: 3
        url: /skills/life-science#biology-botany-zoology
        localized:
        - en:
            name: Biology, Botany, Zoology
            description: |-
              These specialty skills must be purchased separately.
              - **Biology:** The study of organisms and biochemical processes.
              - **Botany:** The study of plants and identification.
              - **Zoology:** The study of animals and animal life.
              ### Rank Benefits
              ⊗ **Rank 3, 6, 9, 12 [Increased Effect]:** A character receives a **-1 bonus** at rank 3,
              **-2** at rank 6, **-3** at rank 9, and **-4** at rank 12 on certain other skill checks that can be assisted by this specialty. These skills include Survival, Animal Handling, and Medical Science—treatment.
        - es:
            name: Biología, Botánica, Zoología
            description: |-
              Estas habilidades de especialidad deben comprarse por separado.
              - **Biología:** El estudio de los organismos y sus procesos bioquímicos.
              - **Botánica:** El estudio e identificación de las plantas.
              - **Zoología:** El estudio de los animales y la vida animal.
              ⊗ **Efecto incrementado:** Un personaje recibe una **bonificación de
              -1 paso** en el rango 3, **-2** en el rango 6, **-3** en el rango 9 y
              **-4** en el rango 12 en ciertas otras tiradas de habilidad que puedan ser asistidas por esta especialidad. Estas habilidades incluyen Supervivencia, Manejo de animales y Ciencias médicas—tratamiento.
        trained_only: false
        rank_benefits:
        - rank: 3
          title: Increased Effect
        - rank: 6
          title: Increased Effect
        - rank: 9
          title: Increased Effect
        - rank: 12
          title: Increased Effect
      psionics:
        attribute: WIL
        cost: 3
        url: /skills/life-science#psionics
        localized:
        - en:
            name: Psionics
            description: |-
              This specialty skill represents the scientific study of the biological and biochemical nature of psionic abilities.
              ### Rank Benefits
              ⊗ **Rank 3, 6, 9, 12 [Increased Effect]:** A character receives a **-1 bonus** at rank 3,
              **-2** at rank 6, **-3** at rank 9, and **-4** at rank 12 on certain other skill checks that can be assisted by this specialty. These skills include Telepathy—drain, Bio-Kinesis—bioluminescent, and Bio-Kinesis—bioweapon.
        - es:
            name: Psiónica
            description: |-
              Esta habilidad de especialidad representa el estudio científico de la naturaleza biológica y bioquímica de las habilidades psiónicas.
              ⊗ **Efecto incrementado:** Un personaje recibe una **bonificación de
              -1 paso** en el rango 3, **-2** en el rango 6, **-3** en el rango 9 y
              **-4** en el rango 12 en ciertas otras tiradas de habilidad que puedan ser asistidas por esta especialidad. Estas habilidades incluyen Telepatía—drenaje, Biocinesis—bioluminiscente y Biocinesis—bioarma.
        trained_only: true
      biology:
        attribute: WIL
        cost: 3
        url: /skills/life-science#biology
        localized:
        - en:
            name: Biology
            description: |-
              Biology is the study of life and living organisms, including their structure, function, growth, origin, evolution, and distribution.
        - es:
            name: Biología
            description: |-
              La biología es el estudio de la vida y los organismos vivos, incluyendo su estructura, función, crecimiento, origen, evolución y distribución.
        trained_only: false
      botany:
        attribute: WIL
        cost: 3
        url: /skills/life-science#botany
        localized:
        - en:
            name: Botany
            description: |-
              Botany is the study of plant life, from the smallest mosses to the giant trees of a rainforest.
        - es:
            name: Botánica
            description: |-
              La botánica es el estudio de la vida vegetal, desde los musgos más pequeños hasta los árboles gigantes de una selva tropical.
        trained_only: false
      genetics:
        attribute: WIL
        cost: 3
        url: /skills/life-science#genetics
        localized:
        - en:
            name: Genetics
            description: |-
              Genetics is the study of heredity and genes, forming the basis of genetic engineering and cloning.
              ### Rank Benefits
              ⊗ **Rank 3, 6, 9, 12 [Increased Effect]:** A character receives a **-1 bonus** at rank 3,
              **-2** at rank 6, **-3** at rank 9, and **-4** at rank 12 on certain other skill checks that can be assisted by this specialty. These skills include Medical Science—treatment, Forensic Science, and certain Bio-Kinesis or Mutation checks.
        - es:
            name: Genética
            description: |-
              La genética es el estudio de la herencia y los genes, formando la base de la ingeniería genética y la clonación.
              ⊗ **Efecto incrementado:** Un personaje recibe una **bonificación de
              -1 paso** en el rango 3, **-2** en el rango 6, **-3** en el rango 9 y
              **-4** en el rango 12 en ciertas otras tiradas de habilidad que puedan ser asistidas por esta especialidad. Estas habilidades incluyen Ciencias médicas—tratamiento, Ciencias forenses y ciertas tiradas de Biocinesis o Mutación.
        trained_only: false
        rank_benefits:
        - rank: 3
          title: Increased Effect
        - rank: 6
          title: Increased Effect
        - rank: 9
          title: Increased Effect
        - rank: 12
          title: Increased Effect
      xenology:
        attribute: WIL
        cost: 3
        url: /skills/life-science#xenology
        localized:
        - en:
            name: Xenology
            description: |-
              Xenology is the study of animal life forms of an alien nature and can be used to identify or classify such life forms, including alien plant life. It allows a character to make educated guesses as to the nature, behavior, and abilities of alien life forms.
              ### Rank Benefits
              ⊗ **Rank 3, 6, 9, 12 [Increased Effect]:** A character receives a **-1 bonus** at rank 3,
              **-2** at rank 6, **-3** at rank 9, and **-4** at rank 12 on certain other skill checks that can be assisted by this specialty. These skills include Survival (in alien environments), Animal Handling (with alien creatures), and Medical Science—xenomedicine.
        - es:
            name: Xenología
            description: |-
              La xenología es el estudio de formas de vida animal de naturaleza alienígena y puede usarse para identificar o clasificar dichas formas de vida, incluida la vida vegetal alienígena. Permite a un personaje realizar suposiciones educadas sobre la naturaleza, el comportamiento y las capacidades de las formas de vida alienígenas.
              ⊗ **Efecto incrementado:** Un personaje recibe una **bonificación de
              -1 paso** en el rango 3, **-2** en el rango 6, **-3** en el rango 9 y
              **-4** en el rango 12 en ciertas otras tiradas de habilidad que puedan ser asistidas por esta especialidad. Estas habilidades incluyen Supervivencia (en entornos alienígenas), Manejo de animales (CON criaturas alienígenas) y Ciencias médicas—xenomedicina.
        trained_only: true
        rank_benefits:
        - rank: 3
          title: Increased Effect
