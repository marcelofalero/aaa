      physics:
        attribute: WIL
        cost: 3
        url: /skills/physical-science#physics
        localized:
          - en:
              name: Physics
              description: |-
                Physics is the study of matter, energy, and the fundamental forces of nature.
                ⊗ **Increased Effect:** A character receives a **-1 bonus** at rank 3, **-2** at rank 6, **-3** at rank 9, and **-4** at rank 12 on certain other skill checks that can be assisted by this specialty (e.g., Technical Science—engineering, System Operation—sensors).
          - es:
              name: Física
              description: |-
                La física es el estudio de la materia, la energía y las fuerzas fundamentales de la naturaleza.
                ⊗ **Efecto aumentado:** Un personaje recibe una bonificación **-1** en el rango 3, **-2** en el rango 6, **-3** en el rango 9 y **-4** en el rango 12 en ciertas otras pruebas de habilidades que pueden ser asistidas por esta especialidad (por ejemplo, ciencia técnica: ingeniería, operación de sistemas: sensores).
        trained_only: false
