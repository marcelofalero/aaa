items:
  acrobatics:
    attribute: DEX
    cost: 7
    category: Other
    url: /skills/acrobatics
    localized:
      - en:
          name: Acrobatics
          description: |-
            This broad skill provides a character with basic training in acrobatics. It is used when a character wants to vault over a fence or other obstacle, dodge out of the way of an immediate danger, or try to land safely after a fall.

            ### Vaulting

            Vaulting is a vertical leap enhanced by assistance (springing off an object or using a pole). A character may use either **Athletics—jump** or **Acrobatics**.
            - **Both skills:** Increase distance by 1 meter.
            - **Using a pole:** Increase distance by 2 meters.
      - es:
          name: Acrobacia
          description: |-
            Esta amplia habilidad proporciona a un Personaje una formación básica en Acrobacia. Se utiliza cuando un Personaje quiere saltar sobre una valla u obstáculo, Esquivar fuera del camino de un peligro inmediato o intentar aterrizar de forma segura después de un Caída.

            ### Salto con apoyo

            Salto con apoyo es un salto vertical mejorado con ayuda (saltando de un objeto o usando un palo). Un Personaje puede usar **Atletismo—salto** o **Acrobacia**.
            - **Ambas habilidades:** Aumenta la distancia en 1 metro.
            - **Usando un palo:** Incrementar la distancia en 2 metros.
    items:
      aerobatics:
        attribute: DEX
        cost: 3
        url: /skills/acrobatics#aerobatics
        localized:
          - en:
              name: Aerobatics
              description: |-
                This specialty skill represents a character's mastery of complex maneuvers during personal flight, whether through natural wings, specialized jump-packs, or gravitic personal flight devices (GADS). 

                While very basic maneuvering in flight is covered by the Acrobatics broad skill, Aerobatics is required for high-speed turns, precise landing, evasive maneuvers, and aerial acrobatics. 

                At **Rank 4** in **Armor Operation—Propulsion Systems**, this skill can also be used for complex maneuvers using a powered suit's integrated thrusters.

                **Note:** This skill covers *personal* locomotion and complex maneuvers. Operating a larger vehicle through the air or space requires [Vehicle Operation—air](/skills/vehicle-operation/#air-vehicle) or [Vehicle Operation—space](/skills/vehicle-operation/#space-vehicle).

                ### Results
                - **Critical Failure:** Loss of control, potential stall or collision.
                - **Ordinary:** Basic controlled flight; can perform simple maneuvers. Like synchronized flying, or boarding a high speed moving vehicle (assuming it can reach it and enter)
                - **Good:** Increased control; can perform evasive maneuvers. (He can use the dodge skill)
                - **Amazing:** Perfect control; can perform complex aerial or orbital acrobatics.

                ### Rank Benefits
                ▶ **Rank 4 [Stealthy Descent]** When using a jump-pack or GADS, the character can descend with minimal noise, receiving a **-2 step bonus** to Stealth checks.

                ▶ **Rank 6 [Endurance Flight]** The character can fly for extended periods, receiving a **-2 step bonus** to Stamina checks for long-distance travel with with natural means or **-2 step bonus** to Armor Operation-Propulsion Systems with armor mounted propulsion.
          - es:
              name: Acrobacia aérea
              description: |-
                Este Especialidad representa el dominio de maniobras complejas del Personaje durante el vuelo personal, ya sea a través de alas naturales, mochilas de salto especializadas o dispositivos de vuelo personal gravíticos (GADS).

                Si bien las maniobras muy básicas en vuelo están cubiertas por la amplia habilidad del Acrobacia, el Acrobacia aérea es necesario para giros de alta velocidad, aterrizajes precisos, maniobras evasivas y Acrobacia aéreo.

                En **Rango 4** en **Operación de armadura—Sistemas de propulsión**, esta habilidad también se puede usar para maniobras complejas usando los propulsores integrados de un traje Armas de energía.

                **Nota:** Esta habilidad cubre la locomoción *personal* y maniobras complejas. Operar un vehículo más grande a través del aire o el espacio requiere [Operación del vehículo—air](/skills/vehicle-operation/#air-vehicle) o [Operación del vehículo—espacio](/skills/vehicle-operation/#space-vehicle).

                ### Resultados
                - **Fallo Crítico:** Pérdida de control, posible pérdida o colisión.
                - **Ordinario:** Vuelo controlado básico; Puede realizar maniobras sencillas. Como volar sincronizado o abordar un vehículo en movimiento a alta velocidad (suponiendo que pueda alcanzarlo y entrar)
                - **Bueno:** Mayor control; Puede realizar maniobras evasivas. (Puede usar la habilidad Esquivar)
                - **Asombroso:** Control perfecto; Puede realizar complejos Acrobacia aéreos u orbitales.

                ### Beneficios de Rango
                ▶ **Rango 4 [Descenso sigiloso]** Cuando se usa un paquete de salto o GADS, el Personaje puede descender con un ruido mínimo y recibe un **-2 Bonificación de paso** en las pruebas de sigilo.

                ▶ **Rango 6 [Vuelo Resistencia]** El Personaje puede volar durante períodos prolongados, recibiendo controles de **-2 Bonificación de paso** a Aguante para viajes de larga distancia con medios naturales o **-2 Bonificación de paso** a Operación de armadura-Sistemas de propulsión con propulsión montada en armadura.
        trained_only: false
        rank_benefits:
          - rank: 4
            title: Stealthy Descent
          - rank: 6
            title: Endurance Flight
      daredevil:
        attribute: DEX
        cost: 3
        url: /skills/acrobatics#daredevil
        localized:
          - en:
              name: Daredevil
              description: |-
                This specialty skill enables a character to perform high-risk activities such as skydiving, scuba diving, hang gliding, surfing, bungee jumping, and whitewater rafting.

                ### Results

                - On a **Critical Failure**, the attempted action fails and the character could suffer stun or wound damage at the Gamemaster's discretion. This outcome generally involves bad luck concerning some aspect of the equipment being used—scuba diving gear springs a leak, a parachute fails to open properly, and so forth.
                - On a **Failure**, the attempted action doesn't succeed, but the character does not necessarily suffer damage—a parachutist goes drastically off course and lands a long distance from his target, perhaps taking damage as well.
                - On an **Ordinary**, the character is basically able to perform the action—he can manipulate a hang glider so that he stays aloft, but he has no control over his direction of travel.
                - On a **Good**, the character has limited control of the action—he opens his parachute at just the right time, and also is able to use it to maneuver so that he lands only a short distance from his target.
                - On an **Amazing**, everything goes right—he rides the raft all the way through the rapids without damage to himself or his equipment.
          - es:
              name: Temerario
              description: |-
                Este Especialidad permite que un Personaje realice actividades de alto riesgo como paracaidismo, buceo, ala delta, surf, puenting y rafting.

                ### Resultados

                - En un **Fallo Crítico**, el intento de acción falla y el Personaje podría sufrir daños por el Aturdimiento o el Herida a discreción del Director de Juego. Este resultado generalmente implica mala suerte con respecto a algún aspecto del equipo que se utiliza: el equipo de buceo tiene una fuga, un paracaídas no se abre correctamente, etc.
                - En caso de **Fallo**, la acción intentada no tiene éxito, pero el Personaje no necesariamente sufre daños: un paracaidista se desvía drásticamente de su rumbo y aterriza a una gran distancia de su objetivo, quizás también sufriendo daños.
                - En un **Ordinario**, el Personaje básicamente es capaz de realizar la acción: puede manipular un ala delta para mantenerse en el aire, pero no tiene control sobre su dirección de viaje.
                - En un **Bueno**, el Personaje tiene un control limitado de la acción: abre su paracaídas en el momento justo y también puede usarlo para maniobrar y aterrizar a poca distancia de su objetivo.
                - En un **Asombroso**, todo va bien: recorre la balsa a través de los rápidos sin dañarse a sí mismo ni a su equipo.
        trained_only: false
      dodge:
        attribute: DEX
        cost: 3
        url: /skills/acrobatics#dodge
        localized:
          - en:
              name: Dodge
              description: |-
                This specialty skill allows a character to move in ways that make hard for the adversaries to hit him with melee or ranged attacks. It's also used when a character dives for cover or hits the deck when an area-effect attack targets him. Dodge lets a character tumble, roll, duck, dive, or spring out of the way of an attack. One skill check (requiring an action) is made at the beginning of the first phase in which the character can act. The result lasts for all subsequent phases in the round. Any additional actions taken in the round receive a +1 penalty.

                ### Adjustments to Strength/Dexterity Resistance Modifiers
                - **Critical Failure:** -2 steps
                - **Failure:** none
                - **Ordinary:** +1 step
                - **Good:** +2 steps
                - **Amazing:** +3 steps

                _(This skill can’t be combined with the parry or block rank benefits described under Melee Combat Specialty skills)_

                ## Rank Benefits
                ▶ **Rank 3 [Action Benefit]:** Dodge and perform an action in the same phase (+2 penalty on the both checks), this only uses up 1 of the character actions.

                ⊗ **Rank 4, 8, 12 [Resistance Modifier]:** The character’s Dexterity resistance modifier improves by +1 at each of these ranks.

                ▶ **Rank 7 [Reaction Dodge]:** Perform a reaction dodge, allowing the character to defend earlier in the round. In a round when a character makes a reaction dodge, he can only dodge; all other actions are lost for the round.
          - es:
              name: Esquivar
              description: |-
                Este Especialidad permite que un Personaje se mueva de maneras que dificultan que los adversarios lo golpeen con ataques cuerpo a cuerpo o a distancia. También se usa cuando un Personaje se lanza para cubrirse o golpea la cubierta cuando un ataque de efecto de área lo apunta. Esquivar permite que un Personaje caiga, ruede, se agache, se sumerja o salte fuera del alcance de un ataque. Se realiza una prueba de habilidad (que requiere una acción) al comienzo de la primera fase en la que el Personaje puede actuar. El resultado dura para todas las fases posteriores de la ronda. Cualquier acción adicional realizada en la ronda recibe una penalización de +1.

                ### Ajustes a los modificadores de resistencia a la fuerza/destreza
                - **Fallo Crítico:** -2 pasos
                - **Error:** ninguno
                - **Ordinario:** +1 paso
                - **Bueno:** +2 pasos
                - **Asombroso:** +3 pasos

                _(Esta habilidad no se puede combinar con los beneficios de parar o bloquear Rango descritos en Habilidades especiales de Combate cuerpo a cuerpo)_

                ## Beneficios de Rango
                ▶ **Rango 3 (Beneficio de la acción):** Esquivar y realizar una acción en la misma fase (penalización +2 en ambas comprobaciones), esto solo consume 1 de las acciones de Personaje.

                ⊗ **Rango 4, 8, 12 [Modificador de resistencia]:** El modificador de resistencia a la destreza del Personaje mejora en +1 en cada uno de estos Rangos.

                ▶ **Rango 7 (Reacción Esquivar):** Realiza una reacción Esquivar, permitiendo que Personaje se defienda más temprano en la ronda. En una ronda, cuando un Personaje realiza una reacción Esquivar, solo puede Esquivar; Todas las acciones de Otros se pierden durante la ronda.
        trained_only: false
        rank_benefits:
          - rank: 3
            title: Action Benefit
          - rank: 4
            title: Resistance Modifier
          - rank: 7
            title: Reaction Dodge
          - rank: 8
            title: Resistance Modifier
          - rank: 12
            title: Resistance Modifier
      fall:
        attribute: DEX
        cost: 3
        url: /skills/acrobatics#fall
        localized:
          - en:
              name: Fall
              description: |-
                This specialty skill allows a character to improve his ability to survive a fall by twisting his body, catching nearby protrusions, or otherwise slowing his descent, thereby decreasing the damage he sustains from an impact. A character with the fall specialty skill adds his rank in the specialty to his Acrobatics score and uses that number to make the skill check, with a +d0 base situation die.
          - es:
              name: Caída
              description: |-
                Este Especialidad permite a un Personaje mejorar su capacidad para sobrevivir a un Caída girando su cuerpo, atrapando protuberancias cercanas o ralentizando su descenso, disminuyendo así el daño que sufre por un impacto. Un Personaje con Caída Especialidad suma su Rango en la especialidad a su puntuación Acrobacia y usa ese número para realizar la prueba de habilidad, con una base +d0 Dado de Situación.
        trained_only: false
      zero-g-training:
        attribute: DEX
        cost: 3
        url: /skills/acrobatics#zero-g-training
        localized:
          - en:
              name: Zero-g Training
              description: |-
                A character with the zero-g training skill can function in weightless or near-weightless conditions better than someone who doesn't have this skill. An untrained character has a +3 step penalty in zero gravity and a +1 step penalty in light gravity. Purchasing this skill immediately reduces the zero-g penalty to +2 steps and eliminates the penalty for light gravity.

                ### Rank Benefits

                ▶ **Rank 4[Improved Balance]:** Zero-g penalty is reduced to +1 step, and light gravity actions receive a -1 step bonus.

                ▶ **Rank 7[No Penalty in Zero-G]:** Zero-g penalty is eliminated.

                ▶ **Rank 10[Improved Locomotion]:** Physical actions in zero-g receive a -1 step bonus. (Light gravity bonus never improves beyond -1 step.)

                **Sesheyan Advantage** Sesheyan characters without the zero-g training skill function as though they have it at rank 1. If a sesheyan purchases this skill, penalties are reduced by 1 step and bonuses are improved by the same amount (max bonus -2 in light gravity).
          - es:
              name: Entrenamiento en gravedad cero
              description: |-
                Un Personaje con la habilidad Entrenamiento en gravedad cero puede funcionar en condiciones de ingravidez o casi ingravidez mejor que alguien que no tiene esta habilidad. Un Personaje no entrenado tiene un +3 Penalización de paso en gravedad cero y un +1 Penalización de paso en gravedad ligera. Comprar esta habilidad reduce inmediatamente la penalización por gravedad cero a +2 pasos y elimina la penalización por gravedad ligera.

                ### Beneficios de Rango

                ▶ **Rango 4[Equilibrio mejorado]:** La penalización por gravedad cero se reduce a +1 paso y las acciones de gravedad ligera reciben un -1 Bonificación de paso.

                ▶ **Rango 7[Sin penalización en gravedad cero]:** Se elimina la penalización por gravedad cero.

                ▶ **Rango 10[Locomoción mejorada]:** Las acciones de Físico en gravedad cero reciben un -1 Bonificación de paso. (La bonificación de gravedad ligera nunca mejora más allá de -1 paso).

                **Ventaja de Sesheyan** Los personajes Sesheyan sin la habilidad Entrenamiento en gravedad cero funcionan como si la tuvieran en Rango 1. Si un sesheyan compra esta habilidad, las penalizaciones se reducen en 1 paso y las bonificaciones mejoran en la misma cantidad (bonificación máxima -2 en gravedad ligera).
        trained_only: true
        rank_benefits: []
    trained_only: false
  administration:
    attribute: WIL
    cost: 4
    category: Technical
    url: /skills/administration
    localized:
      - en:
          name: Administration
          description: |-
            This skill provides a character with the knowledge and institutional literacy required to navigate, manipulate, or weaponize bureaucratic systems. It covers scheduling, personnel management, and the legal regulations governing organizations ranging from local offices to interstellar empires.

            ### Organizational Interaction

            The Administration skill can be used in an attempt to change the attitude of an individual employee of some corporation or organization. In such a case, it is treated as an encounter skill. If the use of this skill results in a target's attitude being changed to Friendly or better, this can provide a bonus on any subsequent skill check to get information or cooperation out of the organization that is the employer of the target.

            ### Navigating Bureaucracy (Progressive Track)

            Bureaucratic tasks are handled as a Progressive Track in daily intervals, but the GM can adjust it if needed.
            The GM determines a hidden number of successes required based on the nature of the request.
            Every day, the character rolls to generate successes until the hidden threshold is met.

            #### 1. Baseline Difficulty (Organization Size)

            The size of the system determines the base difficulty for the daily roll:

            * **Small (-1 step bonus):** A local organization with loose rule, a small-town government, a small business.
            * **Medium (No modifier):** A regional corporate headquarters, a city government agency, or a planetary spaceport.
            * **Large(+1 step penalty):** A national ministry, a sector-wide trade guild, or a planetary military.
            * **Huge (+2 step penalty):** An interstellar nation, a large corporation with strict rules, or an intelligence agency.

            #### 2. Difficulty Modifiers

            Once the baseline is set, apply the following modifiers to the Difficulty:

            - **Familiarity (-1 Step):** The administrator has done this before.
            - **Access (-1 Steps):** The administrator is a member of the organization, have clearance or otherwise have the right qualification.
            - **+2 Steps (Rushing):** The character attempts to bypass standard protocols to get a result in record time. This increases the success yield (see below).

            *Familiarity or Access can be obtained by hiring a local paralegal or bribing the right people*

            #### 3. Daily Success Yield

            The result of the daily roll determines how much progress is made toward the hidden target.

            | Roll Result | Standard | Rushing (+2 Step Difficulty) |
            | :--- | :--- | :--- |
            | **Critical Failure** | **-3 Successes.** (A major blunder) | **-3 Successes.** |
            | **Failure** | **No Success.** | **1 Success.** |
            | **Ordinary** | **1 Success.** | **2 Successes.** |
            | **Good** | **2 Successes.** | **3 Successes.** |
            | **Amazing** | **3 Successes.** | **4 Successes.** |

            ### Narrative Roadblocks & Interference

            Until the target successes are met, the GM presents the remaining "work" as physical or social obstacles:

            #### The Come-and-Go

            As the character accrues successes day by day the character can give feedback, in the form of tangible events.

            > The docking is already approved by port control, but there are still some maintainence results that need to be processed, after that you can bring the ship in for inspection. While a critical failure can mean the you skipped an important paper work and need to start again with a previous request.

            **Sabotage:** An opponent using Administration to hinder the character, this subtract a success from the character's for each success on his opponet roll.

            > The opponent arrange an immediate "vacations" for the ship inspector de day before he had to sign your docking bay approval he just inspected. You will need to redo the same step again.

            **Detection:** An **[Amazing]** success reveals the interference and offer some clues of the *method* of sabotage (e.g., a rerouted digital request). Unmasking the culprit requires some other skills, allowing the party to show their worth (Investigation, Hacking, Stealth). A critical failure while interfering leave the opponent's identity exposed.Organizational Interaction
      - es:
          name: Administración
          description: |-
            Esta habilidad proporciona a un Personaje el conocimiento y la alfabetización institucional necesarios para navegar, manipular o convertir en armas los sistemas burocráticos. Cubre la programación, la gestión de personal y las regulaciones legales que rigen a las organizaciones, desde oficinas locales hasta imperios interestelares.

            ### Organizacional Interacción

            La habilidad de Administración se puede utilizar en un intento de cambiar la actitud de un empleado individual de alguna corporación u organización. En tal caso, se trata como una habilidad de encuentro. Si el uso de esta habilidad da como resultado que la actitud del objetivo cambie a Amistosa o mejor, esto puede proporcionar una bonificación en cualquier prueba de habilidad posterior para obtener información o cooperación de la organización que es la empleadora del objetivo.

            ### Navegando por la burocracia (Rastrear progresivo)

            Las tareas burocráticas se manejan como un Rastrear progresivo en intervalos diarios, pero el DJ puede ajustarlo si es necesario.
            El GM determina un número oculto de Éxitos requerido según la naturaleza de la solicitud.
            Todos los días, el Personaje rueda para generar Éxitos hasta que se alcanza el umbral oculto.

            #### 1. Dificultad inicial (tamaño de la organización)

            El tamaño del sistema determina la dificultad base de la tirada diaria:

            * **Pequeño (-1 Bonificación de paso):** Una organización local con gobierno flexible, un gobierno de ciudad pequeña, un pequeño Negocios.
            * **Medio (sin modificador):** Una sede corporativa regional, una agencia gubernamental de la ciudad o un puerto espacial planetario.
            * **Grande(+1 Penalización de paso):** Un ministerio nacional, un gremio comercial de todo el sector o un ejército planetario.
            * **Enorme (+2 Penalización de paso):** Una nación interestelar, una gran corporación con reglas estrictas o una agencia de inteligencia.

            #### 2. Modificadores de dificultad

            Una vez establecida la línea de base, aplique los siguientes modificadores a la dificultad:

            - **Familiaridad (-1 paso):** El administrador ha hecho esto antes.
            - **Acceso (-1 Pasos):** El administrador es miembro de la organización, tiene autorización o tiene la calificación adecuada.
            - **+2 pasos (apresurados):** El Personaje intenta eludir los protocolos estándar para obtener un resultado en un tiempo récord. Esto aumenta el rendimiento del éxito (ver más abajo).

            *Se puede obtener familiaridad o acceso contratando a un asistente legal local o sobornando a las personas adecuadas*

            #### 3. Rendimiento de éxito diario

            El resultado de la tirada diaria determina cuánto se avanza hacia el objetivo oculto.

            | Resultado de la tirada | Estándar | Corriendo (+2 pasos de dificultad) |
            | :--- | :--- | :--- |
            | **Fallo Crítico** | **-3 Éxitos.** (Un gran error) | **-3 Éxitos.** |
            | **Fallo** | **Sin éxito.** | **1 éxito.** |
            | **Ordinario** | **1 éxito.** | **2 Éxitos.** |
            | **Bueno** | **2 Éxitos.** | **3 Éxitos.** |
            | **Asombroso** | **3 Éxitos.** | **4 Éxitos.** |

            ### Obstáculos narrativos e interferencias

            Hasta que se cumpla el objetivo Éxitos, el DJ presenta el "trabajo" restante como obstáculos Físico o Social:

            #### El ir y venir

            A medida que el Personaje acumula Éxitos día a día, el Personaje puede dar retroalimentación, en forma de eventos tangibles.

            > El atraque ya está aprobado por el control del puerto, pero aún quedan algunos resultados de mantenimiento que deben procesarse, luego de eso puede traer el barco para su inspección. Mientras que un Fallo Crítico puede significar que te saltaste un papeleo importante y necesitas comenzar de nuevo con una solicitud anterior.

            **Sabotaje:** Un oponente que usa Administración para obstaculizar el Personaje, esto resta un éxito del Personaje por cada éxito en la tirada de su oponente.

            > El oponente organiza unas "vacaciones" inmediatas para el inspector del barco el día antes de que tuviera que firmar la aprobación de la bahía de atraque que acaba de inspeccionar. Deberá rehacer el mismo paso nuevamente.

            **Detección:** Un éxito **[Asombroso]** revela la interferencia y ofrece algunas pistas del *método* de sabotaje (por ejemplo, una solicitud digital desviada). Desenmascarar al culpable requiere algunas habilidades Otros, lo que permitirá al grupo demostrar su valía (Investigar, Hacking, Stealth). Un Fallo Crítico mientras interfiere deja expuesta la identidad del oponente. Interacción organizacional
    items:
      bureaucracy:
        attribute: WIL
        cost: 3
        url: /skills/administration#bureaucracy
        localized:
          - en:
              name: Bureaucracy
              description: |-
                This specialty skill measures a character's ability to grease (or clog up) the wheels of bureaucracy. Important applications, permits, clearances, reports, or other bureaucratic requests can be processed faster and more efficiently with the use of this skill. Conversely, this skill can be used to make the same bureaucratic processes slower for others.

                ### Rank Benefits

                ▶ **Rank 2 [Optimized Routing]** The character knows the shortcuts that actually work. When **Rushing** a request, the standard difficulty penalty is reduced from a **+2 step penalty** to a **+1 step penalty**. At Rank 4, the penalty is completely eliminated.

                ▶ **Rank 6 [Procedural Immunity]** Once per bureaucratic task, the character can ignore the **-3 success penalty** of a **Critical Failure**. Furthermore, when the character is a member of an organization and seeks permits for equipment or supplies, the request **automatically succeeds** in a single day. This automatic success is only negated if a rival is actively using a **Sabotage** action to hinder the character.

                ▶ **Rank 9 [Invisible Hand]** Your interference is a work of art. Opponents must roll an **Amazing** success just to realize they are being sabotaged. Furthermore, the character can now use [Administration](/skills/administration) to trace a saboteur's identity without requiring other skills, recognizing their specific "procedural signature." Unless the saboteur also has Rank 9 in this specialty, they cannot hide their identity from the character.

                ▶ **Rank 12 [Loophole Master]** The character generates **double the successes** on any check. Additionally, the character cannot be interfered with; they utilize obscure procedural routes that make it impossible for others to track where the request is actually being processed.
          - es:
              name: Burocracia
              description: |-
                Este Especialidad mide la capacidad de un Personaje para engrasar (u obstruir) las ruedas de la burocracia. Las solicitudes importantes, permisos, autorizaciones, informes o solicitudes burocráticas Otros se pueden procesar de manera más rápida y eficiente con el uso de esta habilidad. Por el contrario, esta habilidad se puede utilizar para hacer que los mismos procesos burocráticos sean más lentos para otros.

                ### Beneficios de Rango

                ▶ **Rango 2 [Enrutamiento optimizado]** El Personaje conoce los atajos que realmente funcionan. Al **apresurar** una solicitud, la penalización de dificultad estándar se reduce de **+2 Penalización de paso** a **+1 Penalización de paso**. En Rango 4, la penalización se elimina por completo.

                ▶ **Rango 6 [Inmunidad procesal]** Una vez por tarea burocrática, el Personaje puede ignorar la **penalización de éxito -3** de un **Fallo Crítico**. Además, cuando Personaje es miembro de una organización y busca permisos para equipos o suministros, la solicitud **automáticamente tiene éxito** en un solo día. Este éxito automático solo se anula si un rival está usando activamente una acción de **Sabotaje** para obstaculizar el Personaje.

                ▶ **Rango 9 [Mano invisible]** Tu interferencia es una obra de arte. Los oponentes deben obtener un éxito **Asombroso** solo para darse cuenta de que están siendo saboteados. Además, el Personaje ahora puede usar [Administration](/skills/administration) para rastrear la identidad de un saboteador sin requerir habilidades de Otros, reconociendo su "firma procesal" específica. A menos que el saboteador también tenga Rango 9 en esta especialidad, no puede ocultar su identidad al Personaje.

                ▶ **Rango 12 [Loophole Master]** El Personaje genera **el doble que el Éxitos** en cualquier verificación. Además, no se puede interferir con el Personaje; Utilizan rutas de procedimiento oscuras que hacen imposible que otros accedan a Rastrear donde realmente se está procesando la solicitud.
        trained_only: false
