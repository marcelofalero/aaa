              ▶ Redirection of Force: When a Personaje reaches rank 7, if an opponent performs an All Out Attack against him, the attacker receives all the penalties of that maneuver but gains none of the benefits. How we do things reaches rank 10, All Out Attacks that miss him can be redirected against any Otros target adjacent to the attacker. The attacker must make a new normal attack roll against the new target to determine the result.
              ▶ Formless Master: When a Personaje reaches rank 12, he may ignore 1 step of an opponent''s Strength defense due to the unpredictability of his attacks.
        trained_only: false
