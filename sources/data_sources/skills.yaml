              description: |-
                Con la habilidad Honda, un Personaje puede volverse cada vez más competente con este tipo de arma primitiva. Un Honda puede ser cargado y disparado en esta misma acción por cualquier Personaje. A medida que un Personaje alcanza un Rangos más alto en esta especialidad, obtiene habilidades adicionales como se describe en "Beneficios de las armas a distancia Rango" en la página siguiente.

