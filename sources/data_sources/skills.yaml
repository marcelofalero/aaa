  heavy-weapons:
    attribute: STR
    cost: 6
    category: Combat
    url: /skills/heavy-weapons
    localized:
      - en:
          name: Heavy Weapons
          description: |-
            Training in the use of heavy weaponry (man-portable or tripod-mounted) that is not part of a ship or vehicle system. Examples include mortars, grenade launchers, rocket launchers, and heavy autocannons.

            ### Fire Modes
            **Direct Fire:** Aimed weapons (firearms, plasma guns). Standard resolution.

            **Indirect Fire:** Weapons that fire over or around obstacles (mortars, grenades). Delivers area-effect attacks. Accuracy is governed by [Table P20: Accuracy by Range]({{< relref "core-mechanics/useful-tables#table-p20-accuracy-by-range" >}}).

            ### TABLE P21: HEAVY WEAPONS RANGE MODIFIERS

            | Range | Direct Fire | Indirect Fire |
            | :--- | :--- | :--- |
            | **Short** | -1 step bonus | +2 steps penalty |
            | **Medium** | 0 (No modifier) | -2 steps bonus |
            | **Long** | +1 step penalty | 0 (No modifier) |
      - es:
          name: Armas pesadas
          description: |-
            Capacitación en el uso de armamento pesado (portátil o montado en trípode) que no forma parte de un sistema de barco o vehículo. Los ejemplos incluyen morteros, lanzagranadas, lanzacohetes y cañones automáticos pesados.

            ### Modos de fuego
            **Fuego directo:** Armas de puntería (armas de fuego, pistolas de plasma). Resolución estándar.

            **Fuego indirecto:** Armas que disparan sobre o alrededor de obstáculos (morteros, granadas). Ofrece ataques con efecto de área. La precisión se rige por la [Tabla P20: Precisión por rango]({{< relref "core-mechanics/useful-tables#table-p20-accuracy-by-range" >}}).

            ### TABLA P21: MODIFICADORES DE RANGO Armas pesadas

            | Gama | Fuego directo | Fuego indirecto |
            | :--- | :--- | :--- |
            | **Corto** | -1 Bonificación de paso | +2 pasos de penalización |
            | **Medio** | 0 (Sin modificador) | -Bonificación de 2 pasos |
            | **Largo** | +1 Penalización de paso | 0 (Sin modificador) |
    items:
      direct-fire:
        attribute: STR
        cost: 4
        url: /skills/heavy-weapons#direct-fire
        localized:
          - en:
              name: Direct fire
              description: |-
                This specialty skill allows a character to improve his proficiency with direct-fire heavy weapons. These weapons work just like normal firearms, requiring the user to aim them at a target. Direct-fire heavy weapons include heavy-caliber firearms, plasma guns, and raiders.
          - es:
              name: Fuego directo
              description: |-
                Este Especialidad permite a un Personaje mejorar su competencia con Armas pesadas de fuego directo. Estas armas funcionan igual que las armas de fuego normales, lo que requiere que el usuario apunte a un objetivo. Los Armas pesadas de fuego directo incluyen armas de fuego de gran calibre, pistolas de plasma y asaltantes.
        trained_only: false
      indirect-fire:
        attribute: STR
        cost: 4
        url: /skills/heavy-weapons#indirect-fire
        localized:
          - en:
              name: Indirect fire
              description: |-
                This specialty skill allows a character to improve his proficiency with indirect-fire heavy weapons. These weapons can fire over or around obstacles; they deliver an area effect attack instead of an attack against a specific target. Indirect-fire heavy weapons include grenade launchers, rocket launchers, shoulder-fired missiles, and mortars.
          - es:
              name: Fuego indirecto
              description: |-
                Este Especialidad permite a un Personaje mejorar su competencia con Armas pesadas de fuego indirecto. Estas armas pueden disparar por encima o alrededor de obstáculos; Ofrecen un ataque de efecto de área en lugar de un ataque contra un objetivo específico. Los Armas pesadas de fuego indirecto incluyen lanzagranadas, lanzacohetes, misiles de hombro y morteros.
        trained_only: false
    trained_only: false
  interaction:
    attribute: PER
    cost: 3
    category: Social
    url: /skills/interaction
    localized:
      - en:
          name: Interaction
          description: |-
            Interaction provides a character with the basics of interpersonal contact with members of the same species and native culture. Through the use of the associated specialty skills, a character can become an expert in the arts of interaction and communication. 

            While everyone who grows up around other people has some skill at interacting with others, those who purchase any of the specialty skills are either trained or naturally proficient at winning friends and influencing people. 

            ### Specialties
            Interaction includes specific areas such as:
            - [Bargain]({{< relref "#bargain" >}})
            - [Charm]({{< relref "#charm" >}})
            - [Interview]({{< relref "#interview" >}})
            - [Intimidate]({{< relref "#intimidate" >}})
            - [Seduce]({{< relref "#seduce" >}})
            - [Taunt]({{< relref "#taunt" >}})

            ### Interaction Situation Modifiers

            | Relation / Condition | Modifier |
            | :---  | :--- |
            | Target is different species | +2 steps |
            | Target is different culture | +2 steps |
            | Strangers | +1 step |
            | Known to each other | 0 |
            | Acquainted | -1 step |

            ### Mechanics
            Interaction is an **encounter skill**, meaning that any skill check takes into account the target's starting attitude (see [Table P25: Encounter Skill Effects]({{< relref "core-mechanics/useful-tables#table-p25-encounter-skill-effects" >}})). 

            - **Target Restrictions:** Neither a **Combative** character nor a **Fanatic** character can be influenced by Interaction.
            - **Resistance:** The target's **Will resistance modifier** also applies. 
            - **Cumulative Modifiers:** The modifiers listed above are cumulative. 
            - **Longevity:** In general, the changes in attitude that can be brought about by the use of Interaction are longer-lasting than the changes achieved through the use of Deception or Entertainment skills. Otherwise, a target’s change in attitude lasts until the character does something to alter that attitude in either a positive or negative way. 

            > When possible, it's better to roleplay an Interaction encounter than simply rolling dice and deciding an outcome.
      - es:
          name: Interacción
          description: |-
            Interacción proporciona a un Personaje los conceptos básicos del contacto interpersonal con miembros de la misma especie y Cultura nativo. Mediante el uso de las habilidades especializadas asociadas, un Personaje puede convertirse en un experto en las artes de Interacción y la comunicación.

            Si bien todos los que crecen alrededor de personas de Otros tienen alguna habilidad para interactuar con los demás, aquellos que adquieren cualquiera de las habilidades especiales están capacitados o son naturalmente competentes para ganar amigos e influir en las personas.

            ### Especialidades
            Interacción incluye áreas específicas como:
            - [Regatear]({{< relref "#bargain" >}})
            - [Encanto]({{< relref "#charm" >}})
            - [Entrevista]({{< relref "#interview" >}})
            - [Intimidar]({{< relref "#intimidate" >}})
            - [Seducir]({{< relref "#seduce" >}})
            - [Burla]({{< relref "#taunt" >}})

            ### Modificadores de situación Interacción

            | Relación / Condición | Modificador |
            | :--- | :--- |
            | El objetivo son especies diferentes | +2 pasos |
            | El objetivo es diferente Cultura | +2 pasos |
            | Extraños | +1 paso |
            | Conocido por cada Otros | 0 |
            | Conocido | -1 paso |

            ### Mecánica
            Interacción es una **habilidad de encuentro**, lo que significa que cualquier prueba de habilidad tiene en cuenta la actitud inicial del objetivo (consulte la [Tabla P25: Efectos de las habilidades de encuentro]({{< relref "core-mechanics/useful-tables#table-p25-encounter-skill-effects" >}})).

            - **Restricciones de objetivos:** Ni un Personaje **Combativo** ni un Personaje **Fanático** pueden verse influenciados por Interacción.
            - **Resistencia:** También se aplica el **modificador de resistencia a la voluntad** del objetivo. 
            - **Modificadores acumulativos:** Los modificadores enumerados anteriormente son acumulativos. 
            - **Longevidad:** En general, los cambios de actitud que se pueden provocar con el uso de Interacción son más duraderos que los cambios logrados mediante el uso de Engaño o habilidades de entretenimiento. De lo contrario, el cambio de actitud de un objetivo dura hasta que el Personaje haga algo para alterar esa actitud de forma positiva o negativa.

            > Cuando sea posible, es mejor interpretar un encuentro Interacción que simplemente tirar los dados y decidir un resultado.
    items:
      bargain:
        attribute: PER
        cost: 3
        url: /skills/interaction#bargain
        localized:
          - en:
              name: Bargain
              description: |-
                Bargain represents a character’s ability to negotiate a cheaper price for an object they want to buy or a better price for one they’re selling. It also covers more formal business negotiations. A successful check improves the character’s position at the bargaining table. 

                The degree of success determines who gets the better outcome. A success also changes the target’s attitude as shown on [Table P25: Encounter Skill Effects]({{< relref "core-mechanics/useful-tables#table-p25-encounter-skill-effects" >}}).

                ### Bargain Situation Modifiers

                | Condition | Modifier |
                | :--- | :--- |
                | **Opponent Attitude** | |
                | Hostile | +2 steps |
                | Neutral | 0 |
                | Friendly | -2 steps |
                | **Opponent Training** | |
                | Opponent has no ranks in bargain | -2 steps |
                | Opponent has ranks in bargain | 0 |
                | **Supply** | |
                | Supply is low | +2 steps |
                | Supply is moderate | 0 |
                | Supply is high | -1 step |
                | **Demand** | |
                | Demand is low | -2 steps |
                | Demand is moderate | 0 |
                | Demand is high | +2 steps |

                > [!IMPORTANT]
                > Bargain can be used on targets of any attitude **except** **Fanatic** or **Combative**.
          - es:
              name: Regatear
              description: |-
                Regatear representa la capacidad de Personaje para negociar un precio más barato por un objeto que quiere comprar o un mejor precio por uno que está vendiendo. También cubre negociaciones Negocios más formales. Una verificación exitosa mejora la posición del Personaje en la mesa de negociaciones.

                El grado de éxito determina quién obtiene el mejor resultado. Un éxito también cambia la actitud del objetivo como se muestra en la [Tabla P25: Efectos de las habilidades de encuentro]({{< relref "core-mechanics/useful-tables#table-p25-encounter-skill-effects" >}}).

                ### Modificadores de situación Regatear

                | Condición | Modificador |
                | :--- | :--- |
                | **Actitud del oponente** | |
                | Hostil | +2 pasos |
                | Neutro | 0 |
                | Amistoso | -2 pasos |
                | **Entrenamiento del oponente** | |
                | El oponente no tiene Rangos en Regatear | -2 pasos |
                | El oponente tiene Rangos en Regatear | 0 |
                | **Oferta** | |
                | La oferta es baja | +2 pasos |
                | La oferta es moderada | 0 |
                | La oferta es alta | -1 paso |
                | **Demanda** | |
                | La demanda es baja | -2 pasos |
                | La demanda es moderada | 0 |
                | La demanda es alta | +2 pasos |

                > [!IMPORTANTE]
                > Regatear se puede usar en objetivos de cualquier actitud **excepto** **Fanático** o **Combativo**.
        trained_only: false
      charm:
        attribute: PER
        cost: 3
        url: /skills/interaction#charm
        localized:
          - en:
              name: Charm
              description: |-
                The charm skill represents a character’s ability to change the attitudes of those they interact with by presenting themselves in a likable, friendly manner. A character with this skill seeks to charm others into giving up something—whether it’s material goods or simply a change of attitude—with kind words, a winning smile, and a personable attitude. 

                To actually charm someone, the character must achieve an **Ordinary** result or better. The result of the check determines how much the target’s attitude improves, as shown on [Table P25: Encounter Skill Effects]({{< relref "core-mechanics/useful-tables#table-p25-encounter-skill-effects" >}}).

                > [!IMPORTANT]
                > Charm can only be used on targets whose attitude is **Neutral** or **Friendly**. A character cannot charm a **Hostile** or **Combative** target. A character might need to use **Bargain**, **Interview**, or **Intimidate** to change a character's attitude to Neutral before attempting to use Charm.
          - es:
              name: Encantar
              description: |-
                La habilidad de encantar representa la capacidad de Personaje para cambiar las actitudes de aquellos con quienes interactúa presentándose de una manera agradable y amigable. Un Personaje con esta habilidad busca seducir a otros para que renuncien a algo (ya sean bienes materiales o simplemente un cambio de actitud) con palabras amables, una sonrisa ganadora y una actitud afable.

                Para realmente encantar a alguien, el Personaje debe lograr un resultado **Ordinario** o mejor. El resultado de la verificación determina cuánto mejora la actitud del objetivo, como se muestra en la [Tabla P25: Efectos de las habilidades de encuentro]({{< relref "core-mechanics/useful-tables#table-p25-encounter-skill-effects" >}}).

                > [!IMPORTANTE]
                > El encanto solo se puede usar en objetivos cuya actitud sea **Neutral** o **Amistosa**. Un Personaje no puede encantar a un objetivo **Hostil** o **Combativo**. Es posible que un Personaje necesite usar **Regatear**, **Entrevista** o **Intimidar** para cambiar la actitud de un Personaje a Neutral antes de intentar usar Encanto.
        trained_only: false
      interview:
        attribute: PER
        cost: 3
        url: /skills/interaction#interview
        localized:
          - en:
              name: Interview
              description: |-
                The interview skill represents a character’s ability to get information from another character in a non-aggressive way. Interviews are often used by reporters, investigators, and officials conducting standard administrative procedures. It differs from **Investigate—interrogate** (a **Will**-based skill) in the amount of aggressiveness and fear applied by the questioner. 

                The result of the check determines the amount of information the character is able to obtain. A success also changes the target’s attitude as shown on [Table P25: Encounter Skill Effects]({{< relref "core-mechanics/useful-tables#table-p25-encounter-skill-effects" >}}).

                > [!IMPORTANT]
                > Interview can only be used on targets whose attitude is **Neutral**, **Friendly**, or better. A character cannot interview a **Hostile** or **Combative** target. A character might need to use **Intimidate** or **Bargain** to change a character's attitude to Neutral before attempting an interview.
          - es:
              name: Entrevistar
              description: |-
                La habilidad de entrevista representa la capacidad de un Personaje para obtener información de otro Personaje de forma no agresiva. Los periodistas, investigadores y funcionarios que llevan a cabo procedimientos administrativos estándar suelen utilizar las entrevistas. Se diferencia de **Investigar—Interrogar** (una habilidad basada en **Voluntad**) en la cantidad de agresividad y miedo que aplica el interrogador.

                El resultado de la verificación determina la cantidad de información que el Personaje puede obtener. Un éxito también cambia la actitud del objetivo como se muestra en la [Tabla P25: Efectos de las habilidades de encuentro]({{< relref "core-mechanics/useful-tables#table-p25-encounter-skill-effects" >}}).

                > [!IMPORTANTE]
                > La entrevista solo se puede utilizar con objetivos cuya actitud sea **Neutral**, **Amistosa** o mejor. Un Personaje no puede entrevistar a un objetivo **Hostil** o **Combativo**. Es posible que un Personaje necesite usar **Intimidar** o **Regatear** para cambiar su actitud a Neutral antes de intentar una entrevista.
        trained_only: false
      intimidate:
        attribute: PER
        cost: 3
        url: /skills/interaction#intimidate
        localized:
          - en:
              name: Intimidate
              description: |-
                The intimidate skill represents a character’s ability to threaten another, either by physical presence or the weight of authority. Intimidate enables a character to force an opponent to back down, reveal information, or cooperate in some other way due to fear. 

                The target's **Will resistance modifier** applies to the skill check, along with other Interaction modifiers. The greater the degree of success, the more cooperation the character can elicit. A success also changes the target's attitude as shown on [Table P25: Encounter Skill Effects]({{< relref "core-mechanics/useful-tables#table-p25-encounter-skill-effects" >}}).

                > [!IMPORTANT]
                > Intimidate can be used on targets of any attitude **except** **Fanatic** or **Combative**. A character can be intimidated into having a Neutral or even a Friendly attitude, depending on the result of the skill check.
          - es:
              name: Intimidar
              description: |-
                La habilidad de intimidar representa la capacidad de Personaje para amenazar a otro, ya sea por la presencia de Físico o por el peso de la autoridad. Intimidar permite a Personaje obligar a un oponente a retroceder, revelar información o cooperar de alguna manera debido al miedo.

                El **modificador de resistencia a la voluntad** del objetivo se aplica a la prueba de habilidad, junto con los modificadores Otros Interacción. Cuanto mayor sea el grado de éxito, más cooperación podrá generar el Personaje. Un éxito también cambia la actitud del objetivo como se muestra en la [Tabla P25: Efectos de las habilidades de encuentro]({{< relref "core-mechanics/useful-tables#table-p25-encounter-skill-effects" >}}).

                > [!IMPORTANTE]
                > Intimidar se puede utilizar en objetivos de cualquier actitud **excepto** **Fanático** o **Combativo**. Un Personaje puede ser intimidado para que adopte una actitud Neutral o incluso Amistosa, dependiendo del resultado de la prueba de habilidad.
        trained_only: false
      seduce:
        attribute: PER
        cost: 3
        url: /skills/interaction#seduce
        localized:
          - en:
              name: Seduce
              description: |-
                The seduce skill represents the ability to entice or beguile another character through the use of opening lines, witty exchanges, playful conversation, and intimate behavior. To seduce another character is to manipulate that character’s emotions through planned exchanges. 

                The final goal of seduction is to gain the seduced character's trust or cooperation through romantic overtures. To actually accomplish the seduction, the character must achieve an **Ordinary** result or better. 

                ### Seduction Effects
                A seduced character won't stay that way forever. How long the character remains seduced depends on the result of the check:
                - **Charmed**: The seduction works well enough to lead to serious feelings that will last if the seducer continues to feign interest (requires a successful seduce skill check at least once per week).
                - **Fanatic**: The seduction works so well that the target falls in love with (or becomes obsessed with) the seducer.

                ### Asking for Favors
                Every time the seducer asks for a favor of any sort, the seduced character makes a **Will feat check** with a modifier based on their attitude:
                - **Charmed**: +1 penalty
                - **Fanatic**: +2 penalty

                A success on this feat check indicates that the seduced character’s attitude is altered by one grade toward Neutral (Fanatic to Charmed, or Charmed to Friendly). Once the seduced character's attitude shifts to Friendly, they no longer behave as though seduced.

                > [!IMPORTANT]
                > Seduce can only be used on targets whose attitude is **Friendly** or better. A character cannot seduce a target whose attitude is **Neutral**, **Hostile**, or **Combative**. A character might need to use **Charm** to improve a target's attitude to Friendly before attempting to seduce them.
          - es:
              name: Seducir
              description: |-
                La habilidad de seducir representa la capacidad de atraer o engañar a otro Personaje mediante el uso de líneas iniciales, intercambios ingeniosos, conversaciones divertidas y comportamiento íntimo. Seducir a otro Personaje es manipular las emociones de ese Personaje a través de intercambios planificados.

                El objetivo final de la seducción es ganarse la confianza o cooperación del seducido mediante propuestas románticas. Para lograr realmente la seducción, el Personaje debe lograr un resultado **Ordinario** o mejor.

                ### Efectos de seducción
                Un Personaje seducido no permanecerá así para siempre. El tiempo que el Personaje permanece seducido depende del resultado de la comprobación:
                - **Embrujada**: la seducción funciona lo suficientemente bien como para generar sentimientos serios que durarán si el seductor continúa fingiendo interés (requiere una prueba exitosa de habilidad de seducción al menos una vez por semana).
                - **Fanático**: La seducción funciona tan bien que el objetivo se enamora (o se obsesiona) del seductor.

                ### Pidiendo favores
                Cada vez que el seductor pide un favor de cualquier tipo, el Personaje seducido realiza una **prueba de dote de voluntad** con un modificador basado en su actitud:
                - **Encantada**: penalización +1
                - **Fanático**: penalización +2

                Un éxito en esta prueba de dote indica que la actitud del Personaje seducido se altera en un grado hacia Neutral (de Fanático a Encantado, o de Encantado a Amistoso). Una vez que la actitud del Personaje seducido cambia a Amistosa, ya no se comporta como si estuviera seducido.

                > [!IMPORTANTE]
                > Seducir solo se puede usar en objetivos cuya actitud sea **Amistosa** o mejor. Un Personaje no puede seducir a un objetivo cuya actitud sea **Neutral**, **Hostil** o **Combativa**. Un Personaje podría necesitar usar **Encanto** para mejorar la actitud amigable de un objetivo antes de intentar seducirlo.
        trained_only: false
      taunt:
        attribute: PER
        cost: 3
        url: /skills/interaction#taunt
        localized:
          - en:
              name: Taunt
              description: |-
                Taunt represents a character''s ability to trade insults in order to rattle or enrage an opponent. A character who taunts his opponent tries to force him into making an error in judgment.

                ### Taunt Situation Modifiers

                | Target Attitude | Modifier |
                | :--- | :--- |
                | Combative | -2 steps |
                | Hostile | -1 step |
                | Neutral | 0 |
                | Friendly | +1 step |

                - On an **Ordinary** success, the taunt is effective, providing a **+1 penalty** to the target''s next action.
                - On a **Good** success, the penalty is **+2**
                - On an **Amazing** success, the penalty is **+3**.

                Success also enrages the target and shifts their attitude toward **Combative** (Neutral to Hostile, for example). After a Critical Failure or a Failure result, a character can make another attempt to taunt someone else. However, only one successful taunt can be directed at a target in a scene.
          - es:
              name: Provocar
              description: |-
                La burla representa la capacidad de un Personaje de intercambiar insultos para sacudir o enfurecer a un oponente. Un Personaje que se burla de su oponente intenta obligarlo a cometer un error de juicio.

                ### Modificadores de situación de burla

                | Actitud objetivo | Modificador |
                | :--- | :--- |
                | Combativo | -2 pasos |
                | Hostil | -1 paso |
                | Neutro | 0 |
                | Amistoso | +1 paso |

                - Con un éxito **Ordinario**, la burla es efectiva y proporciona una **penalización +1** a la siguiente acción del objetivo.
                - En caso de éxito **Bueno**, la penalización es **+2**
                - En caso de éxito **Asombroso**, la penalización es **+3**.

                El éxito también enfurece al objetivo y cambia su actitud hacia **Combativo** (de Neutral a Hostil, por ejemplo). Después de un resultado de Fallo Crítico o Fallo, un Personaje puede hacer otro intento de burlarse de otra persona. Sin embargo, sólo se puede dirigir una burla exitosa a un objetivo en una escena.
        trained_only: false
    trained_only: false
  investigate:
    attribute: WIL
    cost: 3
    category: Social
    url: /skills/investigate
    localized:
      - en:
          name: Investigate
          description: |-
            This broad skill provides a character with the training and ability to examine things systematically through observation and inquiry. Unlike Awareness skills, Investigate takes time. It can be used when a character tries to apply logic and reason to reach a conclusion or deduce the solution to a problem.

            ### Investigate Situation Modifiers

            | Task | Modifier |
            | :--- | :--- |
            | Fast investigation (1 time unit) | +3 step penalty |
            | Moderate investigation (2-3 units) | +1 step penalty |
            | Careful investigation (4+ units) | -2 step bonus |
            | Fresh investigation site | -2 step bonus |
            | Old or "cold" site | +2 to +4 steps penalty |
            | Related skill (e.g., Medicine, Science) | -1 to -3 steps bonus |
            | Small or hidden clue | +3 steps penalty |
      - es:
          name: Investigar
          description: |-
            Esta amplia habilidad proporciona a Personaje la capacitación y la capacidad de examinar las cosas sistemáticamente a través de la observación y la investigación. A diferencia de las habilidades Alerta, Investigar lleva tiempo. Se puede utilizar cuando un Personaje intenta aplicar la lógica y la razón para llegar a una conclusión o deducir la solución a un problema.

            ### Investigar modificadores de situación

            | Tarea | Modificador |
            | :--- | :--- |
            | Rápido Investigar (1 unidad de tiempo) | +3 Penalización de paso |
            | Moderado Investigar (2-3 unidades) | +1 Penalización de paso |
            | Cuidadoso Investigar (4+ unidades) | -2 Bonificación de paso |
            | Nuevo sitio Investigar | -2 Bonificación de paso |
            | Sitio antiguo o "frío" | Penalización de +2 a +4 pasos |
            | Habilidad relacionada (por ejemplo, Medicina, Ciencias) | Bonificación de -1 a -3 pasos |
            | Pista pequeña u oculta | +3 pasos de penalización |
    items:
      interrogate:
        attribute: WIL
        cost: 3
        url: /skills/investigate#interrogate
        localized:
          - en:
              name: Interrogate
              description: |-
                The Interrogate skill represents a character''s ability to ask the right questions in order to gain information from a specific target character. That character''s Will resistance modifier is his protection from the probing questions of a skilled interrogator. The skill covers the sort of interrogation that might be conducted by a seasoned journalist, a law officer, a lawyer, or a trained torturer—anyone who asks tough questions as a matter of course. It may include a hint of violence or actual pain-inducing techniques, but it usually just involves calm and reasonable debate, rhetoric, and trick questions to cause the target to slip up.
          - es:
              name: Interrogar
              description: |-
                La habilidad Interrogar representa la capacidad de un Personaje de hacer las preguntas correctas para obtener información de un Personaje objetivo específico. El modificador de resistencia a la voluntad de Personaje es su protección contra las preguntas inquisitivas de un interrogador experto. La habilidad cubre el tipo de interrogatorio que podría realizar un periodista experimentado, un agente de la ley, un abogado o un torturador entrenado: cualquiera que haga preguntas difíciles de forma natural. Puede incluir un toque de violencia o técnicas reales que induzcan dolor, pero por lo general solo implica un debate tranquilo y razonable, retórica y preguntas capciosas para hacer que el objetivo cometa un desliz.
        trained_only: false
      search:
        attribute: WIL
        cost: 1
        url: /skills/investigate#search
        localized:
          - en:
              name: Search
              description: |-
                This specialty skill enables a character to develop his eye for detail and his ability to spot hidden objects. Search is used when a character wants to look for clues in a specific area, find a particular object or person he knows is in the area, or hunt for important objects in as fast and systematic a fashion as possible. The degree of success achieved on a skill check determines what the character spots after a certain amount of time spent searching, ranging from a single small item or piece of information on a short search to several small items or a major piece of information on a long search.
          - es:
              name: Buscar
              description: |-
                Este Especialidad permite a un Personaje desarrollar su ojo para los detalles y su capacidad para detectar objetos ocultos. La búsqueda se utiliza cuando un Personaje quiere buscar pistas en un área específica, encontrar un objeto o persona en particular que sabe que está en el área, o buscar objetos importantes de la manera más rápida y sistemática posible. El grado de éxito alcanzado en una prueba de habilidad determina lo que detecta el Personaje después de una cierta cantidad de tiempo dedicado a la búsqueda, desde un único elemento pequeño o información en una búsqueda corta hasta varios elementos pequeños o una información importante en una búsqueda larga.
        trained_only: false
      track:
        attribute: WIL
        cost: 3
        url: /skills/investigate#track
        localized:
          - en:
              name: Track
              description: |-
                This specialty skill allows a character to improve his ability to follow a person, creature, or land vehicle by noting the tracks it leaves in its wake. Tracks can be anything from actual footprints to telltale signs such as broken branches, discarded litter, obvious waste material, or other evidence of passage. 

                A tracker may not necessarily be following physical evidence; he may be using detective skills, interview techniques, sensors, or other special equipment. Track is used to locate and follow a trail, either a physical one or a trail of information. Once a character spots his prey, Cover Ops-Stealth can be used to follow closely without being spotted.
          - es:
              name: Rastrear
              description: |-
                Este Especialidad permite a un Personaje mejorar su capacidad para seguir a una persona, criatura o vehículo terrestre al notar las huellas que deja a su paso. Las huellas pueden ser cualquier cosa, desde huellas reales hasta signos reveladores como ramas rotas, basura desechada, material de desecho obvio o evidencia de paso.

                Es posible que un rastreador no necesariamente esté siguiendo la evidencia de Físico; puede que esté utilizando habilidades de detective, técnicas de entrevista, sensores o equipo especial Otros. Rastrear se utiliza para localizar y seguir un rastro, ya sea Físico o un rastro de información. Una vez que un Personaje detecta a su presa, se puede utilizar Cover Ops-Stealth para seguirla de cerca sin ser detectado.
        trained_only: false
    trained_only: false
  knowledge:
    attribute: INT
    cost: 4
    category: Technical
    url: /skills/knowledge
    localized:
      - en:
          name: Knowledge
          description: |-
            This broad skill represents a character's ability to know at least a little bit about any particular subject. With just the broad skill, a character isn't considered an expert, but it represents the ability to logically recall a class he took, an article he read, or a documentary he saw on the topic in question. Knowledge skill checks are usually made in secret so the players don't even know the check is being made. Once a character is determined to have knowledge concerning a particular topic, a note can be made on the character sheet.

            ## Knowledge Categories

            | Category | Modifier | Complexity |
            | :--- | :--- | :--- |
            | **Trivial** | -1 step bonus | Marginal (1-2) |
            | **General** | 0 (No modifier) | Ordinary (3-4) |
            | **Specific** | +2 step penalty | Good (6-8) |
            | **Expert** | +3 step penalty | Amazing (10+) |
      - es:
          name: Conocimiento
          description: |-
            Esta amplia habilidad representa la capacidad de Personaje para saber al menos un poco sobre cualquier tema en particular. Con solo la habilidad general, un Personaje no se considera un experto, pero representa la capacidad de recordar lógicamente una clase que tomó, un artículo que leyó o un documental que vio sobre el tema en cuestión. Las comprobaciones de conocimientos y habilidades generalmente se realizan en secreto, por lo que los jugadores ni siquiera saben que se está realizando la verificación. Una vez que se determina que un Personaje tiene conocimientos sobre un tema en particular, se puede hacer una nota en la hoja Personaje.

            ## Categorías de conocimiento

            | Categoría | Modificador | Complejidad |
            | :--- | :--- | :--- |
            | **Trivial** | -1 Bonificación de paso | Marginales (1-2) |
            | **Generalidades** | 0 (Sin modificador) | Ordinario (3-4) |
            | **Específico** | +2 Penalización de paso | Bueno (6-8) |
            | **Experto** | +3 Penalización de paso | Asombroso (10+) |
    items:
      language-specific-skill:
        attribute: INT
        cost: 3
        url: /skills/knowledge#language-specific-skill
        localized:
          - en:
              name: Language, Specific Skill
              description: |-
                This specialty skill gives a character a certain amount of fluency in a specific language. Every character begins with **Rank 3** in his or her native language. Lower ranks indicate a crude familiarity; higher ranks improve the character's vocabulary and comprehension of obscure or complicated passages.

                ### Rank Benefits
                ⊗ **Rank 4, 8, 12 [Improved Communication]** As a character achieves higher skill ranks in a specific language, he or she gets better at employing other skills that involve language use (such as encounter skills and some Creativity specialties). This benefit provides a reduction to situation die penalties: **1 step at rank 4**, **2 steps at rank 8**, and **3 steps at rank 12**. This benefit only reduces a penalty; it never provides a bonus.
          - es:
              name: Idioma, Habilidad Específica
              description: |-
                Este Especialidad le da a un Personaje cierta fluidez en un idioma específico. Cada Personaje comienza con **Rango 3** en su idioma nativo. Los Rangos más bajos indican una cruda familiaridad; Los Rangos superiores mejoran el vocabulario y la comprensión de pasajes oscuros o complicados del Personaje.

                ### Beneficios de Rango
                ⊗ **Rango 4, 8, 12 [Comunicación mejorada]** A medida que un Personaje alcanza una mayor habilidad Rangos en un idioma específico, mejora en el empleo de habilidades Otros que involucran el uso del lenguaje (como habilidades de encuentro y algunas especialidades de creatividad). Este beneficio proporciona una reducción de las penalizaciones de Dado de Situación: **1 paso en Rango 4**, **2 pasos en Rango 8** y **3 pasos en Rango 12**. Este beneficio sólo reduce una pena; nunca proporciona una bonificación.
        trained_only: true
        rank_benefits:
          - rank: 3
            title: Improved Communication
          - rank: 4
            title: Improved Communication
          - rank: 8
            title: Improved Communication
          - rank: 12
            title: Improved Communication
      psionics:
        attribute: INT
        cost: 3
        url: /skills/knowledge#psionics
        localized:
          - en:
              name: Psionics
              description: |-
                This skill gives a character a working knowledge of psionic abilities, perhaps even beyond what the character''s culture understands as a whole. The degree of success achieved on a skill check relates to the quality or quantity of information that is available to or understood by the character.
          - es:
              name: Psiónica
              description: |-
                Esta habilidad le da al Personaje un conocimiento práctico de las habilidades psiónicas, quizás incluso más allá de lo que el Cultura del Personaje entiende en su conjunto. El grado de éxito alcanzado en una prueba de habilidad se relaciona con la calidad o cantidad de información disponible o comprendida por el Personaje.
        trained_only: true
        rank_benefits:
          - rank: 3
            title: Increased Effect
          - rank: 6
            title: Increased Effect
          - rank: 9
            title: Increased Effect
          - rank: 12
            title: Increased Effect
      computer-operation:
        attribute: INT
        cost: 2
        url: /skills/knowledge#computer-operation
        localized:
          - en:
              name: Computer Operation
              description: |-
                This specialty skill allows a character to improve his ability to make computers perform, specifically his ability to get the most out of the software (including the operating system) that is installed in a computer. The degree of success relates to the quality or quantity of information accessed or retrieved, or the speed with which the operator is able to perform a task.
          - es:
              name: Operación de Computadoras
              description: |-
                Este Especialidad permite que un Personaje mejore su capacidad para hacer que las computadoras funcionen, específicamente su capacidad para aprovechar al máximo el software (incluido el sistema operativo) que está instalado en una computadora. El grado de éxito se relaciona con la calidad o cantidad de información a la que se accede o recupera, o la velocidad con la que el operador puede realizar una tarea.
        trained_only: true
      deduce:
        attribute: INT
        cost: 2
        url: /skills/knowledge#deduce
        localized:
          - en:
              name: Deduce
              description: |-
                With this specialty skill, a character can hone his abilities to use reason and logic to reach a conclusion. Deduce is used by detectives and investigators to piece together clues, or by scientists and engineers to discover the answer to a skill-related problem.

                ## Rank Benefits
                ⊗ **Rank 4, 8, 12 [Resistance Modifier]** At higher ranks, the deduce skill provides an improvement to a character's **Intelligence resistance modifier**, which makes it more difficult for opponents to successfully use encounter skills to deceive the character. The modifier improves by **+1 at Rank 4**, **+1 at Rank 8**, and **+1 at Rank 12**.
          - es:
              name: Deducir
              description: |-
                Con este Especialidad, un Personaje puede perfeccionar sus habilidades para usar la razón y la lógica para llegar a una conclusión. Deducir lo utilizan detectives e investigadores para reunir pistas, o científicos e ingenieros para descubrir la respuesta a un problema relacionado con una habilidad.

                ## Beneficios de Rango
                ⊗ **Rango 4, 8, 12 [Modificador de resistencia]** En Rangos más alto, la habilidad de deducir proporciona una mejora al **modificador de resistencia de inteligencia** de Personaje, lo que hace que sea más difícil para los oponentes usar con éxito habilidades de encuentro para engañar a Personaje. El modificador mejora en **+1 en Rango 4**, **+1 en Rango 8** y **+1 en Rango 12**.
        trained_only: false
        rank_benefits: []
      first-aid:
        attribute: INT
        cost: 3
        url: /skills/knowledge#first-aid
        localized:
          - en:
              name: First Aid
              description: |-
                This specialty skill represents basic training in first aid techniques, including the use of trauma packs, first aid kits, and other general-use medical items. It doesn''t provide a character with the ability to use specialized surgical tools or advanced medical gear.

                ### Heal Stun Damage
                A character can use first aid to remove stun damage from himself or someone else. A successful skill check restores **2, 3, or 4 stun points** depending on success (Ordinary, Good, or Amazing). This only works on someone who is conscious.

                ### Knockout Recovery
                A knockout occurs when a character''s stun points are used up. A successful skill check brings a character back to consciousness and restores
                **1, 2, or 3 stun points**, depending on the degree of success.

                ### Heal Wound Damage
                The first aid skill can be used to heal wounds, though a first aid kit or trauma pack is required.
                - **First Aid Kit:** A complex skill check of **Good complexity** is required (1 wound healed on completion).
                - **Trauma Pack:** A complex skill check of **Ordinary complexity** is required (2 wounds healed on completion).
                - **Critical Failure:** If a trauma pack is used, the patient suffers 1 wound instead of having any wounds healed, and the pack is ruined.

                ### Dying
                A character with any amount of mortal damage is considered to be dying. A character who uses either a first aid kit or a trauma pack and makes a successful first aid skill check can **stabilize mortal damage**, removing the need for the character to make a Stamina–endurance check at the end of the current scene. (Note: surgery is still necessary to restore a dying character to health).

                ### Rank Benefits
                ⊗ **Rank 4, 8, 12 [Improved First Aid]** As a character achieves higher skill ranks, he becomes more proficient at providing aid to injured patients. This reduces the situation die penalty by **1 step at rank 4**, **2 steps at rank 8**, and **3 steps at rank 12**.
          - es:
              name: Primeros Auxilios
              description: |-
                Este Especialidad representa capacitación básica en técnicas de primeros auxilios, incluido el uso de paquetes de trauma, botiquines de primeros auxilios y artículos médicos de uso general Otros. No proporciona al Personaje la capacidad de utilizar herramientas quirúrgicas especializadas o equipo médico avanzado.

                ### Curar el daño de Aturdimiento
                Un Personaje puede usar primeros auxilios para eliminar el daño del Aturdimiento a sí mismo o a otra persona. Una prueba de habilidad exitosa restaura **2, 3 o 4 puntos Aturdimiento** dependiendo del éxito (Ordinario, Bueno o Asombroso). Esto sólo funciona en alguien que está consciente.

                ### Recuperación por nocaut
                Un nocaut se produce cuando se agotan los puntos Aturdimiento de un Personaje. Una prueba de habilidad exitosa devuelve la conciencia a un Personaje y lo restaura.
                **1, 2 o 3 puntos Aturdimiento**, según el grado de éxito.

                ### Curar el daño de Herida
                La habilidad de primeros auxilios se puede utilizar para curar heridas, aunque se requiere un botiquín de primeros auxilios o un paquete de traumatología.
                - **Botiquín de primeros auxilios:** Se requiere una prueba de habilidad compleja de **complejidad Bueno** (1 Herida curado al finalizar).
                - **Paquete de Trauma:** Se requiere una prueba de habilidad compleja de **complejidad Ordinario** (2 heridas curadas al finalizar).
                - **Fallo Crítico:** Si se utiliza un paquete de trauma, el paciente sufre 1 Herida en lugar de que se curen las heridas y el paquete se arruina.

                ### Morir
                Se considera que un Personaje con cualquier cantidad de daño Mortal está muriendo. Un Personaje que usa un botiquín de primeros auxilios o un paquete de trauma y realiza una prueba de habilidad de primeros auxilios exitosa puede **estabilizar el daño del Mortal**, eliminando la necesidad de que el Personaje realice una prueba de Aguante-Resistencia al final de la escena actual. (Nota: la cirugía aún es necesaria para restaurar la salud de un Personaje moribundo).

                ### Beneficios de Rango
                ⊗ **Rango 4, 8, 12 [Primeros auxilios mejorados]** A medida que Personaje alcanza una mayor habilidad Rangos, se vuelve más competente para brindar ayuda a pacientes lesionados. Esto reduce la penalización de Dado de Situación en **1 paso en Rango 4**, **2 pasos en Rango 8** y **3 pasos en Rango 12**.
        trained_only: true
        rank_benefits: []
      research:
        attribute: INT
        cost: 2
        url: /skills/knowledge#research
        localized:
          - en:
              name: Research
              description: |-
                The research specialty covers the techniques used to find, verify, and organize information from diverse sources, including physical archives, electronic databanks, and the Grid. It is also used to represent a character's ability to learn and improve skills through study and mentorship.

                ### Mentorship and Learning
                A character can use research to assist another character (or himself) in learning a new skill or improving an existing one. A successful research check provides a bonus to the learning time required:
                - **Ordinary:** half the learning time required.
                - **Good:** one-quarter the learning time required.
                - **Amazing:** one-eighth the learning time required.

                ### Rank Benefits
                ⊗ **Rank 3, 6, 9, 12 [Efficient Research]** As a character achieves higher ranks in this specialty, he becomes more efficient at digging through data. He receives a **-1 step bonus** to research checks at **rank 3**, **-2 at rank 6**, **-3 at rank 9**, and **-4 at rank 12**.
          - es:
              name: Investigación
              description: |-
                La especialidad de investigación cubre las técnicas utilizadas para encontrar, verificar y organizar información de diversas fuentes, incluidos archivos Físico, bancos de datos electrónicos y Grid. También se utiliza para representar la capacidad de Personaje para aprender y mejorar habilidades a través del estudio y la tutoría.

                ### Tutoría y aprendizaje
                Un Personaje puede utilizar la investigación para ayudar a otro Personaje (o a él mismo) a aprender una nueva habilidad o mejorar una existente. Una prueba de investigación exitosa proporciona una bonificación al tiempo de aprendizaje requerido:
                - **Ordinario:** la mitad del tiempo de aprendizaje requerido.
                - **Bueno:** una cuarta parte del tiempo de aprendizaje requerido.
                - **Asombroso:** un octavo del tiempo de aprendizaje requerido.

                ### Beneficios de Rango
                ⊗ **Rango 3, 6, 9, 12 [Investigación eficiente]** A medida que un Personaje logra un Rangos más alto en esta especialidad, se vuelve más eficiente en la investigación de datos. Recibe un **-1 Bonificación de paso** para cheques de investigación en **Rango 3**, **-2 en Rango 6**, **-3 en Rango 9** y **-4 en Rango 12**.
        trained_only: false
        rank_benefits:
          - rank: 3
            title: Efficient Investigation
          - rank: 6
            title: Efficient Investigation
          - rank: 9
            title: Efficient Investigation
          - rank: 12
            title: Efficient Investigation
    trained_only: false
  law:
    attribute: INT
    cost: 0
    category: Social
    url: /skills/law
    localized:
      - en:
          name: Law
          description: |-
            This broad skill provides a character with general knowledge of the laws and legal systems of her native society. It can be a branch of human civilization on Earth or a colony planet; it could also be a specific alien society or culture. The Law skill can be used as an encounter skill to change the attitude of an individual. If this results in an attitude of **Friendly** or better, it provides a **-1 step bonus** on subsequent skill checks to get information or cooperation out of that individual. With a successful skill check, a character can avoid legal entanglements, understand court procedures, and have a working knowledge of the techniques used by a specific society''s law enforcers. In a courtroom drama or legal issue, a Law skill check can be used to determine the outcome.
            ### Courtroom Resolution
            When a legal battle is played out "off camera," the GM may call for Law skill checks. In a competing check:
            - **Critical Failure:** Opposing lawyer receives a -3 bonus; or the character loses the case outright.
            - **Failure:** Opposing lawyer receives a -1 bonus to his skill check.
            - **Ordinary:** Success made with no modifier.
            - **Good:** Opponent takes a +1 penalty.
            - **Amazing:** Opponent takes a +3 penalty, or the character wins the case outright.
      - es:
          name: Ley
          description: |-
            Esta amplia habilidad proporciona a Personaje un conocimiento general de las leyes y sistemas legales de su sociedad nativa. Puede ser una rama de la civilización humana en la Tierra o un planeta colonia; También podría ser una sociedad alienígena específica o Cultura. La habilidad Ley se puede utilizar como una habilidad de encuentro para cambiar la actitud de un individuo. Si esto resulta en una actitud **Amistosa** o mejor, proporciona un **-1 Bonificación de paso** en pruebas de habilidad posteriores para obtener información o cooperación de ese individuo. Con una prueba de habilidad exitosa, un Personaje puede evitar enredos legales, comprender los procedimientos judiciales y tener un conocimiento práctico de las técnicas utilizadas por los agentes del orden de una sociedad específica. En un drama judicial o una cuestión legal, se puede utilizar una prueba de habilidad en Derecho para determinar el resultado.
            ### Resolución de la sala del tribunal
            Cuando una batalla legal se desarrolla "fuera de cámara", el DJ puede solicitar pruebas de habilidades de Ley. En un cheque competitivo:
            - **Fallo Crítico:** El abogado oponente recibe una bonificación de -3; o el Personaje pierde el caso por completo.
            - **Fallo:** El abogado contrario recibe una bonificación de -1 a su prueba de habilidad.
            - **Ordinario:** Éxito realizado sin modificador.
            - **Bueno:** El oponente recibe una penalización de +1.
            - **Asombroso:** El oponente recibe una penalización de +3 o el Personaje gana el caso directamente.
    items:
      court-procedures:
        attribute: INT
        cost: 3
        url: /skills/law#court-procedures
        localized:
          - en:
              name: Court procedures
              description: |-
                Lawyers, judges, and others use this skill to interact in a courtroom setting. This specialty is used to argue a case or point of view in an official proceeding.
          - es:
              name: Procedimientos judiciales
              description: |-
                Los abogados, jueces y otras personas utilizan esta habilidad para interactuar en la sala del tribunal. Esta especialidad se utiliza para argumentar un caso o punto de vista en un procedimiento oficial.
        trained_only: false
      law-enforcement-procedures:
        attribute: INT
        cost: 3
        url: /skills/law#law-enforcement-procedures
        localized:
          - en:
              name: Law enforcement procedures
              description: |-
                Police officers, detectives, bounty hunters, and others use this skill to follow (or bend) legal law enforcement procedures. Topics covered include:
                - Knowing laws concerning surveillance, search, and seizure.
                - Proper arrest and detainment procedures.
                - Filling out reports and other official paperwork. This specialty is also used to determine how "good" an arrest is (providing ammunition to the lawyers who will try to make the arrest stick).
          - es:
              name: Procedimientos policiales
              description: |-
                Los agentes de policía, detectives, cazarrecompensas y otros utilizan esta habilidad para seguir (o doblar) los procedimientos legales de aplicación de la ley. Los temas cubiertos incluyen:
                - Conocer las leyes relativas a vigilancia, registro e incautación.
                - Procedimientos adecuados de arresto y detención.
                - Realización de informes y trámites oficiales Otros. Esta especialidad también se utiliza para determinar qué tan "Bueno" es un arresto (dando munición a los abogados que intentarán que el arresto se mantenga).
        trained_only: false
      law-specific-skill:
        attribute: INT
        cost: 2
        url: /skills/law#law-specific-skill
        localized:
          - en:
              name: Law, specific skill
              description: |-
                For each separate purchase of this specialty, a character selects a specific culture or a specific type of law (maritime law, salvage law, etc.). As the specialty skill is improved, the character gains a progressively stronger grasp on the laws and legal systems of that culture or specialty.

                ### Rank Benefits
                ⊗ **Rank 3, 6, 9, 12 [Increased Effect]** At higher ranks, the character becomes more proficient within the legal system of the culture in question. Using the specific skill provides a reduction to the situation die:
                - **-1 bonus at Rank 3**
                - **-2 bonus at Rank 6**
                - **-3 bonus at Rank 9**
                - **-4 bonus at Rank 12**
          - es:
              name: Ley, habilidad específica
              description: |-
                Para cada compra por separado de esta especialidad, un Personaje selecciona un Cultura específico o un tipo de ley específico (derecho marítimo, derecho de salvamento, etc.). A medida que se mejora el Especialidad, el Personaje adquiere progresivamente una mayor comprensión de las leyes y sistemas legales de ese Cultura o especialidad.

                ### Beneficios de Rango
                ⊗ **Rango 3, 6, 9, 12 [Efecto aumentado]** A mayor Rangos, el Personaje se vuelve más competente dentro del sistema legal del Cultura en cuestión. Usar la habilidad específica proporciona una reducción al Dado de Situación:
                - **-1 bonificación en Rango 3**
                - **Bono -2 en Rango 6**
                - **Bono -3 en Rango 9**
                - **Bono -4 en Rango 12**
        trained_only: true
        rank_benefits:
          - rank: 3
            title: Increased Effect
          - rank: 6
            title: Increased Effect
          - rank: 9
            title: Increased Effect
          - rank: 12
            title: Increased Effect
      psionics:
        attribute: INT
        cost: 3
        url: /skills/law#psionics
        localized:
          - en:
              name: Psionics
              description: |-
                Lawyers, judges, and others use this skill to interact in courtrooms and in legislative meetings. This aspect of the Law broad skill is used to argue a case or a point of view in an official proceeding involving psionic laws, rights, and regulations.
          - es:
              name: Psiónica
              description: |-
                Los abogados, jueces y otras personas utilizan esta habilidad para interactuar en los tribunales y en las reuniones legislativas. Este aspecto de la habilidad amplia de la Ley se utiliza para argumentar un caso o un punto de vista en un procedimiento oficial que involucra leyes, derechos y regulaciones psiónicas.
        trained_only: true
    trained_only: false
  leadership:
    attribute: PER
    cost: 4
    category: Social
    url: /skills/leadership
    localized:
      - en:
          name: Leadership
          description: |-
            This broad skill provides a character with the abilities and talents of a leader. With leadership training, a character can coordinate a group to get it to perform better or work as a team. Only one character can assume the role of leader at a time, and conflicting orders cancel each other out. A leader, by using an action to attempt a Leadership skill check and then achieving a degree of success on the check, provides a **-1 bonus** to all actions performed in the remainder of the current round and all of the following round by a certain number of followers.

            ### Leadership Situation Modifiers
            The check is modified by the attitude of the targets, plus any other factors determined by the GM:

            | Situation | Modifier |
            | :--- | :--- |
            | **Targets are accustomed to being led** | -2 steps |
            | **Targets recognize leader's authority** | 0 |
            | **Targets don't recognize leader's authority** | +2 steps |

            > [!NOTE]
            > Leadership broad skill can't be used on targets who are **Combative**.

            ### Results

            - **Critical Failure:** The leader confuses his followers, who receive a **+1 penalty** for the remainder of the current round and all of the following round. No further Leadership checks can be made in this scene.

            - **Failure:** The followers receive no bonus in the current round, but the leader can make another check in the next round.

            - **Ordinary:** As many as **two followers** receive the leadership bonus.

            - **Good:** As many as **four followers** receive the leadership bonus.

            - **Amazing:** As many as **six followers** receive the leadership bonus.
      - es:
          name: Liderazgo
          description: |-
            Esta amplia habilidad proporciona a Personaje las habilidades y talentos de un líder. Con el entrenamiento Liderazgo, un Personaje puede coordinar un grupo para lograr que se desempeñe mejor o trabaje en equipo. Sólo un Personaje puede asumir el papel de líder a la vez, y las órdenes en conflicto anulan cada Otros. Un líder, al usar una acción para intentar una prueba de habilidad Liderazgo y luego lograr cierto grado de éxito en la prueba, proporciona una **bonificación -1** a todas las acciones realizadas en el resto de la ronda actual y en toda la ronda siguiente por un cierto número de seguidores.

            ### Modificadores de situación Liderazgo
            La prueba se modifica por la actitud de los objetivos, más cualquier factor Otros determinado por el DJ:

            | Situación | Modificador |
            | :--- | :--- |
            | **Los objetivos están acostumbrados a ser guiados** | -2 pasos |
            | **Los objetivos reconocen la autoridad del líder** | 0 |
            | **Los objetivos no reconocen la autoridad del líder** | +2 pasos |

            > [!NOTA]
            > La habilidad amplia Liderazgo no se puede usar en objetivos que sean **Combativos**.

            ### Resultados

            - **Fallo Crítico:** El líder confunde a sus seguidores, quienes reciben una **penalización +1** por el resto de la ronda actual y toda la ronda siguiente. No se pueden realizar más comprobaciones de Liderazgo en esta escena.

            - **Fallo:** Los seguidores no reciben bonificación en la ronda actual, pero el líder puede realizar otra verificación en la siguiente ronda.

            - **Ordinario:** Hasta **dos seguidores** reciben el bono Liderazgo.

            - **Bueno:** Hasta **cuatro seguidores** reciben el bono Liderazgo.

            - **Asombroso:** Hasta **seis seguidores** reciben el bono Liderazgo.
    items:
      command:
        attribute: PER
        cost: 4
        url: /skills/leadership#command
        localized:
          - en:
              name: Command
              description: |-
                This specialty skill represents the character's ability to lead others by virtue of sheer authoritativeness and persuasive ability. This is the skill used by military officers, elected officials, and law enforcers to issue orders and see that they're carried out.

                > [!IMPORTANT]
                > Command can't be used on targets who are Hostile or Combative; before such targets can be led, their attitude must be shifted (perhaps by the use of the Inspire skill).

                ### Rank Benefits
                ⊗ **Rank 3, 6, 9, 12 [Increased Effect]** As a character achieves higher ranks in this specialty, the bonus to his or her Leadership skill checks improves to **-1 at rank 3**, **-2 at rank 6**, **-3 at rank 9**, and **-4 at rank 12**. (Note: This bonus is not cumulative.)
          - es:
              name: Habilidades de Especialidad
              description: |-
                Este Especialidad representa la capacidad del Personaje para liderar a otros en virtud de pura autoridad y capacidad de persuasión. Esta es la habilidad que utilizan los oficiales militares, los funcionarios electos y los agentes del orden para emitir órdenes y velar por que se cumplan.

                > [!IMPORTANTE]
                > El comando no se puede utilizar contra objetivos hostiles o combativos; Antes de que dichos objetivos puedan ser dirigidos, se debe cambiar su actitud (quizás mediante el uso de la habilidad Inspirar).

                ### Beneficios de Rango
                ⊗ **Rango 3, 6, 9, 12 [Efecto aumentado]** A medida que un Personaje logra un Rangos más alto en esta especialidad, la bonificación a sus pruebas de habilidad Liderazgo mejora a **-1 en Rango 3**, **-2 en Rango 6**, **-3 en Rango 9** y **-4 en Rango. 12**. (Nota: este bono no es acumulable).
        trained_only: false
        rank_benefits: []
      inspire:
        attribute: PER
        cost: 3
        url: /skills/leadership#inspire
        localized:
          - en:
              name: Inspire
              description: |-
                Leading by example and shifting the morale of a group.


                **Morale Pivot:** Unlike the broad skill, **Inspire** can be used on **Hostile** or **Combative** targets to shift their attitude as per [Table P25: Encounter Skill Effects]({{< relref "core-mechanics/useful-tables#table-p25-encounter-skill-effects" >}}).

                ### Rank Benefits
                ⊗ **Increased Effect:** Ranks provide a situation die bonus to the check: Rank 4 (-1), Rank 8 (-2), Rank 12 (-3).
          - es:
              name: Inspirar
              description: |-
                Liderar con el ejemplo y cambiar la moral de un grupo.

                **Pivote de moral:** A diferencia de la habilidad general, **Inspirar** se puede usar en objetivos **hostiles** o **combativos** para cambiar su actitud según la [Tabla P25: Efectos de habilidades de encuentro]({{< relref "core-mechanics/useful-tables#table-p25-encounter-skill-effects" >}}).

                ### Beneficios de Rango
                ⊗ **Efecto aumentado:** Rangos proporciona una bonificación Dado de Situación a la prueba: Rango 4 (-1), Rango 8 (-2), Rango 12 (-3).
        trained_only: true
        rank_benefits: []
    trained_only: false
  life-science:
    attribute: INT
    cost: 7
    category: Technical
    url: /skills/life-science
    localized:
      - en:
          name: Life Science
          description: |-
            This broad skill represents a character's training in the life sciences. Skill checks involving this skill are made the same as Knowledge skill checks.

            Some of the specialties under this broad skill can be used as complementary skills to knowledge-first aid. And medical science specialty skills at GM discretion.

            > For example, a character has the Medical Science-Surgery and Life Science-Genetics skills. If the character is treating a genetic-related condition, the character can receive a bonus depending on his Life Science-Genetics skill level.
      - es:
          name: Ciencias de la vida
          description: |-
            Esta amplia habilidad representa la formación de Personaje en las ciencias de la vida. Las pruebas de habilidad que involucran esta habilidad se realizan de la misma manera que las pruebas de habilidad de Conocimiento.

            Algunas de las especialidades de esta amplia habilidad se pueden utilizar como habilidades complementarias al conocimiento de primeros auxilios. Y habilidades especializadas Ciencias médicas a discreción de GM.

            > Por ejemplo, un Personaje tiene las habilidades Ciencias médicas-Surgery y Ciencias de la vida-Genetics. Si el Personaje está tratando una condición relacionada con la genética, el Personaje puede recibir una bonificación dependiendo de su nivel de habilidad en Ciencias de la vida-Genetics.
    items:
      psionics:
        attribute: INT
        cost: 3
        url: /skills/life-science#psionics
        localized:
          - en:
              name: Psionics
              description: |-
                This specialty skill represents the scientific study of the biological and biochemical nature of psionic abilities.

                ### Rank Benefits
                ⊗ **Rank 3, 6, 9, 12 [Increased Effect]** A character receives a **-1 bonus** at rank 3, **-2** at rank 6, **-3** at rank 9, and **-4** at rank 12 on certain other skill checks that can be assisted by this specialty. These skills include Telepathy—drain, Bio-Kinesis—bioluminescent, and Bio-Kinesis—bioweapon.
          - es:
              name: Psiónica
              description: |-
                Este Especialidad representa el estudio científico de la naturaleza biológica y bioquímica de las habilidades psiónicas.

                ### Beneficios de Rango
                ⊗ **Rango 3, 6, 9, 12 [Efecto aumentado]** Un Personaje recibe una bonificación **-1** en Rango 3, **-2** en Rango 6, **-3** en Rango 9 y **-4** en Rango 12 en ciertas pruebas de habilidad de Otros que pueden ser asistidas por esta especialidad. Estas habilidades incluyen Telepatía (drenaje), Biokinesis (bioluminiscente) y Biokinesis (arma biológica).
        trained_only: true
      biology:
        attribute: INT
        cost: 3
        url: /skills/life-science#biology
        localized:
          - en:
              name: Biology
              description: |-
                This specialty skill represents the character’s knowledge of biology and the study of life and living organisms, including their structure, function, growth, origin, evolution, and distribution.

                It can be used to ascertain information about the biochemical processes of living beings.  

                ### Rank Benefits
                ⊗ **Increased Effect:** A character receives a **-1 bonus** at rank 3, **-2** at rank 6, **-3** at rank 9, and **-4** at rank 12 on certain other skill checks that can be assisted by this specialty.
          - es:
              name: Biología
              description: |-
                Este Especialidad representa el conocimiento de la biología y el estudio de la vida y los organismos vivos del Personaje, incluida su estructura, función, crecimiento, origen, evolución y distribución.

                Puede utilizarse para obtener información sobre los procesos bioquímicos de los seres vivos.

                ### Beneficios de Rango
                ⊗ **Efecto aumentado:** Un Personaje recibe una bonificación **-1** en Rango 3, **-2** en Rango 6, **-3** en Rango 9 y **-4** en Rango 12 en ciertas pruebas de habilidad de Otros que pueden ser asistidas por esta especialidad.
        trained_only: false
      botany:
        attribute: INT
        cost: 3
        url: /skills/life-science#botany
        localized:
          - en:
              name: Botany
              description: |-
                This specialty skill represents the character’s knowledge of plants and the study of plant life, from the smallest mosses to the giant trees of a rainforest.

                It can be used to identify, classify, and understand plants. It can also be used to determine the properties of plants, such as whether they are poisonous or medicinal.

                ### Rank Benefits
                ⊗ **Rank 3, 6, 9, 12 [Increased Effect]** As a character achieves higher ranks in this specialty, they become more efficient at studying plants. They receive a **-1 step bonus** to botany checks at **rank 3**, **-2** at rank 6, **-3** at rank 9, and **-4** at rank 12.
          - es:
              name: Botánica
              description: |-
                Este Especialidad representa el conocimiento de las plantas del Personaje y el estudio de su vida, desde los musgos más pequeños hasta los árboles gigantes de una selva tropical.

                Puede utilizarse para identificar, clasificar y comprender plantas. También se puede utilizar para determinar las propiedades de las plantas, como por ejemplo si son venenosas o medicinales.

                ### Beneficios de Rango
                ⊗ **Rango 3, 6, 9, 12 [Efecto aumentado]** A medida que un Personaje logra un Rangos más alto en esta especialidad, se vuelve más eficiente en el estudio de plantas. Reciben un **-1 Bonificación de paso** en controles de botánica en **Rango 3**, **-2** en Rango 6, **-3** en Rango 9 y **-4** en Rango 12.
        trained_only: false
      genetics:
        attribute: INT
        cost: 3
        url: /skills/life-science#genetics
        localized:
          - en:
              name: Genetics
              description: |-
                Genetics is the study of heredity and genes, forming the basis of genetic engineering and cloning.

                ### Rank Benefits
                ⊗ **Rank 3, 6, 9, 12 [Increased Effect]** A character receives a **-1 bonus** at rank 3, **-2** at rank 6, **-3** at rank 9, and **-4** at rank 12 on certain other skill checks that can be assisted by this specialty. These skills include Medical Science—treatment, Forensic Science, and certain Bio-Kinesis or Mutation checks.
          - es:
              name: Genética
              description: |-
                La genética es el estudio de la herencia y los genes, formando la base de la ingeniería genética y la clonación.

                ### Beneficios de Rango
                ⊗ **Rango 3, 6, 9, 12 [Efecto aumentado]** Un Personaje recibe una bonificación **-1** en Rango 3, **-2** en Rango 6, **-3** en Rango 9 y **-4** en Rango 12 en ciertas pruebas de habilidad de Otros que pueden ser asistidas por esta especialidad. Estas habilidades incluyen Ciencias médicas: tratamiento, ciencia forense y ciertas comprobaciones de biokinesis o mutaciones.
        trained_only: false
        rank_benefits:
          - rank: 3
            title: Increased Effect
          - rank: 6
            title: Increased Effect
          - rank: 9
            title: Increased Effect
          - rank: 12
            title: Increased Effect
      zoology:
        attribute: INT
        cost: 3
        url: /skills/life-science#zoology
        localized:
          - en:
              name: Zoology
              description: |-
                Zoology is the study of animals and animal life, of both terrestrial and extraterrestrial origin.

                ### Rank Benefits
                ⊗ **Rank 3, 6, 9, 12 [Increased Effect]** A character receives a **-1 bonus** at rank 3, **-2** at rank 6, **-3** at rank 9, and **-4** at rank 12 on certain other skill checks that can be assisted by this specialty. These skills include Animal Handling (with alien creatures), Medical Science—xenomedicine, and Survival (in alien environments).
          - es:
              name: Zoología
              description: |-
                La zoología es el estudio de los animales y la vida animal, tanto de origen terrestre como extraterrestre.

                ### Beneficios de Rango
                ⊗ **Rango 3, 6, 9, 12 [Efecto aumentado]** Un Personaje recibe una bonificación **-1** en Rango 3, **-2** en Rango 6, **-3** en Rango 9 y **-4** en Rango 12 en ciertas pruebas de habilidad de Otros que pueden ser asistidas por esta especialidad. Estas habilidades incluyen manejo de animales (con criaturas alienígenas), Ciencias médicas: xenomedicina y supervivencia (en entornos alienígenas).
        trained_only: false
    trained_only: false
  medical-science:
    attribute: INT
    cost: 7
    category: Technical
    url: /skills/medical-science
    localized:
      - en:
          name: Medical Science
          description: |-
            This skill provides a character with the training needed to perform certain medical procedures, including the ability to diagnose common ailments, diseases, and wounds. Skill checks made to determine if a character knows a certain piece of medical information, or if he's able to research a question and discover an answer, are made the same way as Knowledge skill checks.

            A character with just the Medical Science broad skill can't treat characters who have suffered damage, however. The *treatment* specialty skill is necessary to heal stun or wound damage, and reducing a patient's mortal damage requires the *surgery* specialty skill.

      - es:
          name: Ciencias médicas
          description: |-
            Esta habilidad proporciona a Personaje la capacitación necesaria para realizar ciertos procedimientos médicos, incluida la capacidad de diagnosticar dolencias, enfermedades y heridas comunes. Las comprobaciones de habilidades realizadas para determinar si un Personaje conoce cierta información médica, o si es capaz de investigar una pregunta y descubrir una respuesta, se realizan de la misma manera que las comprobaciones de habilidades de conocimiento.

            Sin embargo, un Personaje con solo la habilidad amplia Ciencias médicas no puede tratar a personajes que hayan sufrido daños. El *tratamiento* Especialidad es necesario para curar el daño Aturdimiento o Herida, y reducir el daño Mortal de un paciente requiere la *cirugía* Especialidad.

    items:
      forensics:
        attribute: INT
        cost: 3
        url: /skills/medical-science#forensics
        localized:
          - en:
              name: Forensics
              description: |-
                Forensics is the study of causes of death and physical evidence at the scene of a crime or accident.

                ### Rank Benefits
                ⊗ **Rank 3, 6, 9, 12 [Increased Effect]** As a character attains higher ranks in forensics, he receives a **situation die bonus** on forensics checks. The bonus is **-1 step at rank 3**, **-2 steps at rank 6**, **-3 steps at rank 9**, and **-4 steps at rank 12**.

          - es:
              name: Ciencias forenses
              description: |-
                La ciencia forense es el estudio de las causas de muerte y las pruebas Físico en el lugar de un delito o accidente.

                ### Beneficios de Rango
                ⊗ **Rango 3, 6, 9, 12 [Efecto aumentado]** A medida que un Personaje alcanza un Rangos más alto en análisis forense, recibe una **bonificación Dado de Situación** en comprobaciones forenses. La bonificación es **-1 paso en Rango 3**, **-2 pasos en Rango 6**, **-3 pasos en Rango 9** y **-4 pasos en Rango 12**.

        trained_only: false
        rank_benefits:
          - rank: 3
            title: Increased Effect
          - rank: 6
            title: Increased Effect
          - rank: 9
            title: Increased Effect
          - rank: 12
            title: Increased Effect
      medical-knowledge:
        attribute: INT
        cost: 3
        url: /skills/medical-science#medical-knowledge
        localized:
          - en:
              name: Medical Knowledge
              description: |-
                This specialty skill represents a character''s deep academic and practical understanding of medical principles, history, and advanced theory.

                ### Rank Benefits
                ⊗ **Rank 3, 6, 9, 12 [Increased Effect]** A character receives a **-1 bonus** at rank 3, **-2** at rank 6, **-3** at rank 9, and **-4** at rank 12 on other Medical Science checks (e.g., diagnosis, research).

          - es:
              name: Conocimiento médico
              description: |-
                Este Especialidad representa la profunda comprensión académica y práctica de los principios médicos, la historia y la teoría avanzada de un Personaje.

                ### Beneficios de Rango
                ⊗ **Rango 3, 6, 9, 12 [Efecto aumentado]** Un Personaje recibe una bonificación **-1** en Rango 3, **-2** en Rango 6, **-3** en Rango 9 y **-4** en Rango 12 en comprobaciones de Otros Ciencias médicas (por ejemplo, diagnóstico, investigación).

        trained_only: false
        rank_benefits:
          - rank: 3
            title: Increased Effect
          - rank: 6
            title: Increased Effect
          - rank: 9
            title: Increased Effect
          - rank: 12
            title: Increased Effect
      psychology:
        attribute: INT
        cost: 5
        url: /skills/medical-science#psychology
        localized:
          - en:
              name: Psychology
              description: |-
                Psychology is the study of the mind and behavior. It can be used to diagnose mental disorders, understand motivations, or predict behavioral patterns.

                ### Rank Benefits
                ⊗ **Rank 3, 6, 9, 12 [Increased Effect]** A character receives a **-1 bonus** at rank 3, **-2** at rank 6, **-3** at rank 9, and **-4** at rank 12 on certain Interaction checks (e.g., Interview, Persuade, Bluff).

                ### Stress Management
                When the persistent stress rules are being used, a character with the Psychology skill may use it to provide psychological support to themselves or others, which may help to resist the effects of stress. A successful skill check may provides up to 12 characters with a bonus based the weekly check result. Granting a bonus of -1 (Ordinary), +2 (Good), or +3 (Amazing) to the weekly resolve-mental resolve check to avoid gaining stress levels.

          - es:
              name: Psicología
              description: |-
                La psicología es el estudio de la mente y el comportamiento. Puede utilizarse para diagnosticar trastornos Mental, comprender motivaciones o predecir patrones de comportamiento.

                ### Beneficios de Rango
                ⊗ **Rango 3, 6, 9, 12 [Efecto aumentado]** Un Personaje recibe una bonificación **-1** en Rango 3, **-2** en Rango 6, **-3** en Rango 9 y **-4** en Rango 12 en ciertas comprobaciones de Interacción (por ejemplo, Entrevista, Persuadir, Mentir).

                ### Manejo del estrés
                Cuando se utilizan las reglas de estrés persistente, un Personaje con la habilidad Psicología puede usarla para brindar apoyo psicológico a sí mismo o a otros, lo que puede ayudar a resistir los efectos del estrés. Una prueba de habilidad exitosa puede proporcionar hasta 12 personajes con una bonificación basada en el resultado de la prueba semanal. Otorgar una bonificación de -1 (Ordinario), +2 (Bueno) o +3 (Asombroso) a la prueba semanal Firmeza-Mental Firmeza para evitar ganar niveles de estrés.

        trained_only: false
        rank_benefits:
          - rank: 3
            title: Increased Effect
          - rank: 6
            title: Increased Effect
          - rank: 9
            title: Increased Effect
          - rank: 12
            title: Increased Effect
      surgery:
        attribute: INT
        cost: 5
        url: /skills/medical-science#surgery
        localized:
          - en:
              name: Surgery
              description: |-
                The Medical Science specialty skill *surgery* is used to heal
                mortal damage and perform other invasive medical procedures. Any
                application of this skill requires a complex skill check. Surgery
                can't be performed during a combat scene. It almost always takes
                much more time than mere rounds or minutes, and successful surgery
                is extremely difficult to perform in conditions such as those
                found on the typical battlefield.

                ### Surgical Conditions
                The conditions for surgery are considered:
                - **Critical (+4 step penalty)** when the procedure must be performed with poor lighting, primitive tools (or no surgical tools at all), and no trained assistance.
                - **Marginal conditions (no modifier)** are better than Critical, but still below what's necessary for success.
                - **Good situation (-2 step bonus)** is similar to a modern ambulance or spaceship sick bay.
                - **Amazing conditions (-3 step bonus)** are found in a standard hospital.
                - **Optimal conditions (-4 step bonus)** include high-tech tools, trained support staff, and the most advanced medical procedures available.

                ### Procedure and Recovery
                The complexity of a surgery check depends on the amount of mortal
                damage the patient is suffering from when the procedure is begun:
                1 point of damage is Marginal, 2 is Ordinary, 3 is Good, and 4 or
                more is Amazing. 

                If the patient is suffering only from wound
                damage, then 2 points of damage is Marginal, 4 is Ordinary, 6 is
                Good, and 8 or more is Amazing.

                For every two successes achieved during the complex skill check,
                the patient is healed of 1 point of mortal damage and 2 points of
                wound damage.

                ### Rank Benefits
                ⊗ **Rank 3 [Cybernetic Surgery]** A character who has achieved at least rank 3 in surgery can use this skill to treat patients with existing cybernetic implants.

                ⊗ **Rank 6 [Cybernetic Surgery, Install]** A character who has achieved at least rank 6 in surgery can use this skill to install cybernetic implants.

          - es:
              name: Cirugía
              description: |-
                La *cirugía* Ciencias médicas Especialidad se utiliza para curar
                Mortal daña y realiza procedimientos médicos invasivos Otros. Cualquiera
                La aplicación de esta habilidad requiere una prueba de habilidad compleja. Cirugía
                no se puede realizar durante una escena Combate. Casi siempre se necesita
                mucho más tiempo que simples rondas o minutos, y una cirugía exitosa
                Es extremadamente difícil de realizar en condiciones como las
                encontrado en el típico campo de batalla.

                ### Condiciones quirúrgicas
                Se consideran las condiciones para la cirugía:
                - **Crítico (+4 Penalización de paso)** cuando el procedimiento debe realizarse con poca iluminación, herramientas primitivas (o ninguna herramienta quirúrgica) y sin asistencia capacitada.
                - **Las condiciones marginales (sin modificador)** son mejores que las críticas, pero aún están por debajo de lo necesario para tener éxito.
                - **La situación Bueno (-2 Bonificación de paso)** es similar a una ambulancia moderna o una enfermería de nave espacial.
                - **Las condiciones Asombroso (-3 Bonificación de paso)** se encuentran en un hospital estándar.
                - **Las condiciones óptimas (-4 Bonificación de paso)** incluyen herramientas de alta tecnología, personal de soporte capacitado y los procedimientos médicos más avanzados disponibles.

                ### Procedimiento y Recuperación
                La complejidad de un control quirúrgico depende de la cantidad de Mortal
                Daños que sufre el paciente cuando se inicia el procedimiento:
                1 punto de daño es marginal, 2 es Ordinario, 3 es Bueno y 4 o
                más es Asombroso.

                Si el paciente sufre solo Herida
                daño, entonces 2 puntos de daño es Marginal, 4 es Ordinario, 6 es
                Bueno, y 8 o más es Asombroso.

                Por cada dos Éxitos logrados durante la compleja prueba de habilidad,
                el paciente se cura de 1 punto de daño Mortal y 2 puntos de
                Daño Herida.

                ### Beneficios de Rango
                ⊗ **Rango 3 [Cirugía cibernética]** Un Personaje que haya alcanzado al menos Rango 3 en cirugía puede utilizar esta habilidad para tratar pacientes con implantes cibernéticos existentes.

                ⊗ **Rango 6 [Cirugía cibernética, instalación]** Un Personaje que haya alcanzado al menos Rango 6 en cirugía puede usar esta habilidad para instalar implantes cibernéticos.

