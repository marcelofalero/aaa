            title: Increased Effect
          - rank: 6
            title: Increased Effect
          - rank: 9
            title: Increased Effect
          - rank: 12
            title: Increased Effect
      surgery:
        attribute: INT
        cost: 5
        url: /skills/medical-science#surgery
        localized:
          - en:
              name: Surgery
              description: |-
                The Medical Science specialty skill *surgery* is used to heal
                mortal damage and perform other invasive medical procedures. Any
                application of this skill requires a complex skill check. Surgery
                can't be performed during a combat scene. It almost always takes
                much more time than mere rounds or minutes, and successful surgery
                is extremely difficult to perform in conditions such as those
                found on the typical battlefield.

                ### Surgical Conditions
                The conditions for surgery are considered:
                - **Critical (+4 step penalty)** when the procedure must be performed with poor lighting, primitive tools (or no surgical tools at all), and no trained assistance.
                - **Marginal conditions (no modifier)** are better than Critical, but still below what's necessary for success.
                - **Good situation (-2 step bonus)** is similar to a modern ambulance or spaceship sick bay.
                - **Amazing conditions (-3 step bonus)** are found in a standard hospital.
                - **Optimal conditions (-4 step bonus)** include high-tech tools, trained support staff, and the most advanced medical procedures available.

                ### Procedure and Recovery
                The complexity of a surgery check depends on the amount of mortal
                damage the patient is suffering from when the procedure is begun:
                1 point of damage is Marginal, 2 is Ordinary, 3 is Good, and 4 or
                more is Amazing. 

                If the patient is suffering only from wound
                damage, then 2 points of damage is Marginal, 4 is Ordinary, 6 is
                Good, and 8 or more is Amazing.

                For every two successes achieved during the complex skill check,
                the patient is healed of 1 point of mortal damage and 2 points of
                wound damage.

                ### Rank Benefits
                ⊗ **Rank 3 [Cybernetic Surgery]** A character who has achieved at least rank 3 in surgery can use this skill to treat patients with existing cybernetic implants.

                ⊗ **Rank 6 [Cybernetic Surgery, Install]** A character who has achieved at least rank 6 in surgery can use this skill to install cybernetic implants.

          - es:
              name: Cirugía
              description: |-
                La habilidad de especialidad de Ciencias Médicas *cirugía* se utiliza para curar.
                causar daños mortales y realizar otros procedimientos médicos invasivos. Cualquiera
                La aplicación de esta habilidad requiere una prueba de habilidad compleja. Cirugía
                No se puede realizar durante una escena de combate. Casi siempre se necesita
                mucho más tiempo que simples rondas o minutos, y una cirugía exitosa
                Es extremadamente difícil de realizar en condiciones como las
                encontrado en el típico campo de batalla.
                ### Condiciones quirúrgicas
                Las condiciones para la cirugía se consideran **Críticas (+4 paso
                penalización)** cuando el procedimiento debe realizarse con mala
                iluminación, herramientas primitivas (o ninguna herramienta quirúrgica) y ningún
                asistencia capacitada. **Las condiciones marginales (sin modificador)** son
                mejor que Critical, pero aún por debajo de lo necesario para
                éxito. Una **Buena situación (bonificación de -2 pasos)** es similar a una
                ambulancia moderna o enfermería de nave espacial. **Condiciones increíbles (-3
                bonificación de paso)** se encuentran en un hospital estándar. **Óptimo
                condiciones (bonificación de -4 pasos)** incluyen herramientas de alta tecnología, personal capacitado
                personal de apoyo y los procedimientos médicos más avanzados disponibles.
                ### Procedimiento y Recuperación
                La complejidad de un control quirúrgico depende de la cantidad de mortalidad
                Daños que sufre el paciente cuando se inicia el procedimiento:
                1 punto de daño es Marginal, 2 es Ordinario, 3 es Bueno y 4 o
                más es asombroso. Si el paciente sólo sufre una herida.
                daño, entonces 2 puntos de daño es Marginal, 4 es Ordinario, 6 es
                Bueno, y 8 o más es increíble.
                Por cada dos éxitos logrados durante la compleja prueba de habilidad,
                el paciente se cura de 1 punto de daño Mortal y 2 puntos de
                daño de la herida.
                ---
                ▶ **Cirugía Cibernética:** Un personaje que haya logrado al menos
                El rango 3 en cirugía puede usar esta habilidad para reparar o curar un organismo.
                con implantes cibernéticos existentes. En el rango 6, el personaje
                se vuelve capaz de instalar implantes cibernéticos.

        trained_only: true
        rank_benefits:
          - rank: 3
            title: Surgical Proficiency
          - rank: 6
            title: Surgical Proficiency
      treatment:
        attribute: INT
        cost: 4
        url: /skills/medical-science#treatment
        localized:
          - en:
              name: Treatment
              description: |-
                The *treatment* specialty skill can be used to accomplish all the
                same tasks that the *first aid* skill is used for (healing stun
                damage, knockout recovery).

                ### Treatment Procedures
                **Heal Wound Damage:** When *treatment* is used to heal wounds,
                the character must be using either a first aid kit or a trauma
                pack, and a complex skill check is required. The task is Ordinary
                with a first aid kit, or Marginal if a trauma pack is used. If the
                check is successful, 2 wounds are healed with a first aid kit, and
                4 wounds are healed with a trauma pack.

                **Dying:** A character with any amount of mortal damage is
                considered to be dying. A character with *treatment* and either a
                first aid kit or a trauma pack can stabilize mortal damage,
                increasing the time between Stamina-endurance checks from one per
                hour to one per day.

                **Treating Disease:** The *treatment* specialty can be used to
                identify and treat debilitating diseases, with situation die
                modifiers dependent on the difficulty and virulence.

                ### Rank Benefits
                ⊗ **Improved Treatment:** As a character achieves higher skill
                ranks, he becomes more proficient at providing aid to injured
                patients. This is reflected by a reduction in situation die
                penalties: -1 step at rank 3, -2 steps at rank 6, -3 steps at rank
                9, and -4 at rank 12. Note that this benefit only reduces a
                penalty; it never provides a bonus.

          - es:
              name: Tratamiento
              description: |-
                La habilidad de especialidad *tratamiento* se puede utilizar para lograr todos los
                mismas tareas para las que se usa la habilidad *primeros auxilios* (aturdimiento curativo)
                daño, recuperación por nocaut).
                ### Procedimientos de tratamiento
                ▶ **Curar daños en heridas:** Cuando el *tratamiento* se utiliza para curar heridas,
                el personaje debe estar usando un botiquín de primeros auxilios o un trauma
                paquete, y se requiere una prueba de habilidad compleja. La tarea es ordinaria con un botiquín de primeros auxilios, o Marginal si se utiliza un paquete de trauma. si el
                La prueba tiene éxito, se curan 2 heridas con un botiquín de primeros auxilios y
