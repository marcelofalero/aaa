            name: Track
            description: |-
              The ability to follow a quarry by physical or digital trails (footprints, debris, evidence of passage).
              ### Rank Benefits
              ▶ **Rank 3 [Follow-up]:** Successfully tracking a target allows the character to use **Covert Ops—Stealth** to shadow them.
        - es:
            name: Rastrear
            description: |-
              The ability to follow a quarry by physical or digital trails (footprints, debris, evidence of passage).
              ▶ **Follow-up:** Successfully tracking a target allows the personaje to use **Covert Ops—Stealth** to shadow them.
