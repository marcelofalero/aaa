items:
  acrobatics:
    attribute: DEX
    cost: 7
    category: Other
    url: /skills/acrobatics
    localized:
      - en:
          name: Acrobatics
          description: |-
            This broad skill provides a character with basic training in acrobatics. It is used when a character wants to vault over a fence or other obstacle, dodge out of the way of an immediate danger, or try to land safely after a fall.

            ### Vaulting

            Vaulting is a vertical leap enhanced by assistance (springing off an object or using a pole). A character may use either **Athletics—jump** or **Acrobatics**.
            - **Both skills:** Increase distance by 1 meter.
            - **Using a pole:** Increase distance by 2 meters.
      - es:
          name: Acrobacia
          description: |-
            Esta amplia habilidad proporciona a un Personaje una formación básica en Acrobacia. Se utiliza cuando un Personaje quiere saltar sobre una valla u obstáculo, Esquivar fuera del camino de un peligro inmediato o intentar aterrizar de forma segura después de un Caída.

            ### Salto con apoyo

            Salto con apoyo es un salto vertical mejorado con ayuda (saltando de un objeto o usando un palo). Un Personaje puede usar **Atletismo—salto** o **Acrobacia**.
            - **Ambas habilidades:** Aumenta la distancia en 1 metro.
            - **Usando un palo:** Incrementar la distancia en 2 metros.
    items:
      aerobatics:
        attribute: DEX
        cost: 3
        url: /skills/acrobatics#aerobatics
        localized:
          - en:
              name: Aerobatics
              description: |-
                This specialty skill represents a character's mastery of complex maneuvers during personal flight, whether through natural wings, specialized jump-packs, or gravitic personal flight devices (GADS). 

                While very basic maneuvering in flight is covered by the Acrobatics broad skill, Aerobatics is required for high-speed turns, precise landing, evasive maneuvers, and aerial acrobatics. 

                At **Rank 4** in **Armor Operation—Propulsion Systems**, this skill can also be used for complex maneuvers using a powered suit's integrated thrusters.

                **Note:** This skill covers *personal* locomotion and complex maneuvers. Operating a larger vehicle through the air or space requires [Vehicle Operation—air](/skills/vehicle-operation/#air-vehicle) or [Vehicle Operation—space](/skills/vehicle-operation/#space-vehicle).

                ### Results
                - **Critical Failure:** Loss of control, potential stall or collision.
                - **Ordinary:** Basic controlled flight; can perform simple maneuvers. Like synchronized flying, or boarding a high speed moving vehicle (assuming it can reach it and enter)
                - **Good:** Increased control; can perform evasive maneuvers. (He can use the dodge skill)
                - **Amazing:** Perfect control; can perform complex aerial or orbital acrobatics.

                ### Rank Benefits
                ▶ **Rank 4 [Stealthy Descent]** When using a jump-pack or GADS, the character can descend with minimal noise, receiving a **-2 step bonus** to Stealth checks.

                ▶ **Rank 6 [Endurance Flight]** The character can fly for extended periods, receiving a **-2 step bonus** to Stamina checks for long-distance travel with with natural means or **-2 step bonus** to Armor Operation-Propulsion Systems with armor mounted propulsion.
          - es:
              name: Acrobacia aérea
              description: |-
                Esta habilidad especial representa el dominio de un personaje de maniobras complejas durante el vuelo personal, ya sea a través de alas naturales, mochilas de salto especializadas o dispositivos de vuelo personal gravíticos (GADS).

                Si bien las maniobras muy básicas en vuelo están cubiertas por la habilidad amplia de Acrobacias, las Acrobacias aéreas son necesarias para giros de alta velocidad, aterrizajes precisos, maniobras evasivas y acrobacias aéreas.

                En **Rango 4** en **Operación de armaduras: sistemas de propulsión**, esta habilidad también se puede usar para maniobras complejas usando los propulsores integrados de un traje motorizado.

                **Nota:** Esta habilidad cubre la locomoción *personal* y maniobras complejas. Operar un vehículo más grande a través del aire o el espacio requiere [Operación del vehículo—aire](/skills/vehicle-operation/#air-vehicle) o [Operación del vehículo—espacio](/skills/vehicle-operation/#space-vehicle).

                ### Resultados
                - **Falla crítica:** Pérdida de control, posible pérdida o colisión.
                - **Ordinario:** Vuelo controlado básico; Puede realizar maniobras sencillas. Como volar sincronizado o abordar un vehículo en movimiento a alta velocidad (suponiendo que pueda alcanzarlo y entrar)
                - **Bueno:** Mayor control; Puede realizar maniobras evasivas. (Puede usar la habilidad de esquivar)
                - **Increíble:** Control perfecto; Puede realizar complejas acrobacias aéreas u orbitales.

                ### Beneficios de rango
                ▶ **Rango 4 [Descenso sigiloso]** Cuando se usa un paquete de salto o GADS, el personaje puede descender con un ruido mínimo, recibiendo una **bonificación de -2 pasos** a las pruebas de Sigilo.

                ▶ **Rango 6 [Vuelo de resistencia]** El personaje puede volar durante períodos prolongados, recibiendo una **bonificación de -2 pasos** a las pruebas de resistencia para viajes de larga distancia con medios naturales o una **bonificación de -2 pasos** a los sistemas de operación y propulsión de armadura con propulsión montada en armadura.
        trained_only: false
        rank_benefits:
          - rank: 4
            title: Stealthy Descent
          - rank: 6
            title: Endurance Flight
      daredevil:
        attribute: DEX
        cost: 3
        url: /skills/acrobatics#daredevil
        localized:
          - en:
              name: Daredevil
              description: |-
                This specialty skill enables a character to perform high-risk activities such as skydiving, scuba diving, hang gliding, surfing, bungee jumping, and whitewater rafting.

                ### Results

                - On a **Critical Failure**, the attempted action fails and the character could suffer stun or wound damage at the Gamemaster's discretion. This outcome generally involves bad luck concerning some aspect of the equipment being used—scuba diving gear springs a leak, a parachute fails to open properly, and so forth.
                - On a **Failure**, the attempted action doesn't succeed, but the character does not necessarily suffer damage—a parachutist goes drastically off course and lands a long distance from his target, perhaps taking damage as well.
                - On an **Ordinary**, the character is basically able to perform the action—he can manipulate a hang glider so that he stays aloft, but he has no control over his direction of travel.
                - On a **Good**, the character has limited control of the action—he opens his parachute at just the right time, and also is able to use it to maneuver so that he lands only a short distance from his target.
                - On an **Amazing**, everything goes right—he rides the raft all the way through the rapids without damage to himself or his equipment.
          - es:
              name: Temerario
              description: |-
                Esta habilidad especial permite a un personaje realizar actividades de alto riesgo como paracaidismo, buceo, ala delta, surf, puenting y rafting.

                ### Resultados

                - En un **Fallo Crítico**, la acción intentada falla y el personaje podría sufrir aturdimiento o daño por heridas a discreción del Director de Juego. Este resultado generalmente implica mala suerte con respecto a algún aspecto del equipo que se utiliza: el equipo de buceo tiene una fuga, un paracaídas no se abre correctamente, etc.
                - En caso de **Fallo**, la acción intentada no tiene éxito, pero el personaje no necesariamente sufre daño: un paracaidista se desvía drásticamente de su rumbo y aterriza a una gran distancia de su objetivo, quizás también sufriendo daño.
                - En un **Ordinario**, el personaje es básicamente capaz de realizar la acción: puede manipular un ala delta para mantenerse en el aire, pero no tiene control sobre su dirección de viaje.
                - En **Bueno**, el personaje tiene un control limitado de la acción: abre su paracaídas en el momento justo y también puede usarlo para maniobrar y aterrizar a poca distancia de su objetivo.
                - En un **Asombroso**, todo va bien: recorre la balsa a través de los rápidos sin dañarse a sí mismo ni a su equipo.
        trained_only: false
      dodge:
        attribute: DEX
        cost: 3
        url: /skills/acrobatics#dodge
        localized:
          - en:
              name: Dodge
              description: |-
                This specialty skill allows a character to move in ways that make hard for the adversaries to hit him with melee or ranged attacks. It's also used when a character dives for cover or hits the deck when an area-effect attack targets him. Dodge lets a character tumble, roll, duck, dive, or spring out of the way of an attack. One skill check (requiring an action) is made at the beginning of the first phase in which the character can act. The result lasts for all subsequent phases in the round. Any additional actions taken in the round receive a +1 penalty.

                ### Adjustments to Strength/Dexterity Resistance Modifiers
                - **Critical Failure:** -2 steps
                - **Failure:** none
                - **Ordinary:** +1 step
                - **Good:** +2 steps
                - **Amazing:** +3 steps

                _(This skill can’t be combined with the parry or block rank benefits described under Melee Combat Specialty skills)_

                ## Rank Benefits
                ▶ **Rank 3 [Action Benefit]:** Dodge and perform an action in the same phase (+2 penalty on the both checks), this only uses up 1 of the character actions.

                ⊗ **Rank 4, 8, 12 [Resistance Modifier]:** The character’s Dexterity resistance modifier improves by +1 at each of these ranks.

                ▶ **Rank 7 [Reaction Dodge]:** Perform a reaction dodge, allowing the character to defend earlier in the round. In a round when a character makes a reaction dodge, he can only dodge; all other actions are lost for the round.
          - es:
              name: Esquivar
              description: |-
                Esta habilidad especial permite a un personaje moverse de maneras que dificultan que los adversarios lo golpeen con ataques cuerpo a cuerpo o a distancia. También se usa cuando un personaje se lanza para cubrirse o golpea la cubierta cuando un ataque de efecto de área lo apunta. Esquivar permite a un personaje caer, rodar, agacharse, zambullirse o saltar para esquivar un ataque. Se realiza una prueba de habilidad (que requiere una acción) al comienzo de la primera fase en la que el personaje puede actuar. El resultado dura para todas las fases posteriores de la ronda. Cualquier acción adicional realizada en la ronda recibe una penalización de +1.

                ### Ajustes a los modificadores de resistencia a la fuerza/destreza
                - **Fallo crítico:** -2 pasos
                - **Error:** ninguno
                - **Ordinario:** +1 paso
                - **Bueno:** +2 pasos
                - **Increíble:** +3 pasos

                _(Esta habilidad no se puede combinar con los beneficios de rango de parada o bloqueo descritos en Habilidades especiales de combate cuerpo a cuerpo)_

                ## Beneficios de rango
                ▶ **Rango 3 (Beneficio de la acción):** Esquiva y realiza una acción en la misma fase (penalización +2 en ambas pruebas), esto solo consume 1 de las acciones del personaje.

                ⊗ **Rango 4, 8, 12 [Modificador de resistencia]:** El modificador de resistencia a la Destreza del personaje mejora en +1 en cada uno de estos rangos.

                ▶ **Rango 7 (Esquiva de reacción):** Realiza una esquiva de reacción, lo que permite al personaje defenderse más temprano en la ronda. En una ronda, cuando un personaje realiza una reacción de esquiva, solo puede esquivar; todas las demás acciones se pierden durante la ronda.
        trained_only: false
        rank_benefits:
          - rank: 3
            title: Action Benefit
          - rank: 4
            title: Resistance Modifier
          - rank: 7
            title: Reaction Dodge
          - rank: 8
            title: Resistance Modifier
          - rank: 12
            title: Resistance Modifier
      fall:
        attribute: DEX
        cost: 3
        url: /skills/acrobatics#fall
        localized:
          - en:
              name: Fall
              description: |-
                This specialty skill allows a character to improve his ability to survive a fall by twisting his body, catching nearby protrusions, or otherwise slowing his descent, thereby decreasing the damage he sustains from an impact. A character with the fall specialty skill adds his rank in the specialty to his Acrobatics score and uses that number to make the skill check, with a +d0 base situation die.
          - es:
              name: Caída
              description: |-
                Esta habilidad especial permite a un personaje mejorar su capacidad para sobrevivir a una caída girando su cuerpo, atrapando protuberancias cercanas o ralentizando su descenso, disminuyendo así el daño que sufre por un impacto. Un personaje con la habilidad especial de caída suma su rango en la especialidad a su puntuación de Acrobacia y usa ese número para realizar la prueba de habilidad, con un dado de situación base de +d0.
        trained_only: false
      zero-g-training:
        attribute: DEX
        cost: 3
        url: /skills/acrobatics#zero-g-training
        localized:
          - en:
              name: Zero-g Training
              description: |-
                A character with the zero-g training skill can function in weightless or near-weightless conditions better than someone who doesn't have this skill. An untrained character has a +3 step penalty in zero gravity and a +1 step penalty in light gravity. Purchasing this skill immediately reduces the zero-g penalty to +2 steps and eliminates the penalty for light gravity.

                ### Rank Benefits

                ▶ **Rank 4[Improved Balance]:** Zero-g penalty is reduced to +1 step, and light gravity actions receive a -1 step bonus.

                ▶ **Rank 7[No Penalty in Zero-G]:** Zero-g penalty is eliminated.

                ▶ **Rank 10[Improved Locomotion]:** Physical actions in zero-g receive a -1 step bonus. (Light gravity bonus never improves beyond -1 step.)

                **Sesheyan Advantage** Sesheyan characters without the zero-g training skill function as though they have it at rank 1. If a sesheyan purchases this skill, penalties are reduced by 1 step and bonuses are improved by the same amount (max bonus -2 in light gravity).
          - es:
              name: Entrenamiento en gravedad cero
              description: |-
                Un personaje con la habilidad de entrenamiento de gravedad cero puede funcionar en condiciones de ingravidez o casi ingravidez mejor que alguien que no tiene esta habilidad. Un personaje no entrenado tiene una penalización de +3 pasos en gravedad cero y una penalización de +1 paso en gravedad ligera. Comprar esta habilidad reduce inmediatamente la penalización por gravedad cero a +2 pasos y elimina la penalización por gravedad ligera.

                ### Beneficios de rango

                ▶ **Rango 4[Equilibrio mejorado]:** La penalización por gravedad cero se reduce a +1 paso y las acciones de gravedad ligera reciben una bonificación de -1 paso.

                ▶ **Rango 7[Sin penalización en gravedad cero]:** Se elimina la penalización por gravedad cero.

                ▶ **Rango 10[Locomoción mejorada]:** Las acciones físicas en gravedad cero reciben una bonificación de -1 paso. (La bonificación de gravedad ligera nunca mejora más allá de -1 paso).

                **Ventaja de Sesheyan** Los personajes Sesheyan sin la habilidad de entrenamiento de gravedad cero funcionan como si la tuvieran en el rango 1. Si un sesheyan compra esta habilidad, las penalizaciones se reducen en 1 paso y las bonificaciones mejoran en la misma cantidad (bonificación máxima -2 en gravedad ligera).
        trained_only: true
        rank_benefits: []
    trained_only: false
  administration:
    attribute: WIL
    cost: 4
    category: Technical
    url: /skills/administration
    localized:
      - en:
          name: Administration
          description: |-
            This skill provides a character with the knowledge and institutional literacy required to navigate, manipulate, or weaponize bureaucratic systems. It covers scheduling, personnel management, and the legal regulations governing organizations ranging from local offices to interstellar empires.

            ### Organizational Interaction

            The Administration skill can be used in an attempt to change the attitude of an individual employee of some corporation or organization. In such a case, it is treated as an encounter skill. If the use of this skill results in a target's attitude being changed to Friendly or better, this can provide a bonus on any subsequent skill check to get information or cooperation out of the organization that is the employer of the target.

            ### Navigating Bureaucracy (Progressive Track)

            Bureaucratic tasks are handled as a Progressive Track in daily intervals, but the GM can adjust it if needed.
            The GM determines a hidden number of successes required based on the nature of the request.
            Every day, the character rolls to generate successes until the hidden threshold is met.

            #### 1. Baseline Difficulty (Organization Size)

            The size of the system determines the base difficulty for the daily roll:

            * **Small (-1 step bonus):** A local organization with loose rule, a small-town government, a small business.
            * **Medium (No modifier):** A regional corporate headquarters, a city government agency, or a planetary spaceport.
            * **Large(+1 step penalty):** A national ministry, a sector-wide trade guild, or a planetary military.
            * **Huge (+2 step penalty):** An interstellar nation, a large corporation with strict rules, or an intelligence agency.

            #### 2. Difficulty Modifiers

            Once the baseline is set, apply the following modifiers to the Difficulty:

            - **Familiarity (-1 Step):** The administrator has done this before.
            - **Access (-1 Steps):** The administrator is a member of the organization, have clearance or otherwise have the right qualification.
            - **+2 Steps (Rushing):** The character attempts to bypass standard protocols to get a result in record time. This increases the success yield (see below).

            *Familiarity or Access can be obtained by hiring a local paralegal or bribing the right people*

            #### 3. Daily Success Yield

            The result of the daily roll determines how much progress is made toward the hidden target.

            | Roll Result | Standard | Rushing (+2 Step Difficulty) |
            | :--- | :--- | :--- |
            | **Critical Failure** | **-3 Successes.** (A major blunder) | **-3 Successes.** |
            | **Failure** | **No Success.** | **1 Success.** |
            | **Ordinary** | **1 Success.** | **2 Successes.** |
            | **Good** | **2 Successes.** | **3 Successes.** |
            | **Amazing** | **3 Successes.** | **4 Successes.** |

            ### Narrative Roadblocks & Interference

            Until the target successes are met, the GM presents the remaining "work" as physical or social obstacles:

            #### The Come-and-Go

            As the character accrues successes day by day the character can give feedback, in the form of tangible events.

            > The docking is already approved by port control, but there are still some maintainence results that need to be processed, after that you can bring the ship in for inspection. While a critical failure can mean the you skipped an important paper work and need to start again with a previous request.

            **Sabotage:** An opponent using Administration to hinder the character, this subtract a success from the character's for each success on his opponet roll.

            > The opponent arrange an immediate "vacations" for the ship inspector de day before he had to sign your docking bay approval he just inspected. You will need to redo the same step again.

            **Detection:** An **[Amazing]** success reveals the interference and offer some clues of the *method* of sabotage (e.g., a rerouted digital request). Unmasking the culprit requires some other skills, allowing the party to show their worth (Investigation, Hacking, Stealth). A critical failure while interfering leave the opponent's identity exposed.Organizational Interaction
      - es:
          name: Administración
          description: |-
            Esta habilidad proporciona al personaje el conocimiento y la alfabetización institucional necesarios para navegar, manipular o convertir en armas los sistemas burocráticos. Cubre la programación, la gestión de personal y las regulaciones legales que rigen a las organizaciones, desde oficinas locales hasta imperios interestelares.

            ### Interacción organizacional

            La habilidad de Administración se puede utilizar en un intento de cambiar la actitud de un empleado individual de alguna corporación u organización. En tal caso, se trata como una habilidad de encuentro. Si el uso de esta habilidad da como resultado que la actitud del objetivo cambie a Amistosa o mejor, esto puede proporcionar una bonificación en cualquier prueba de habilidad posterior para obtener información o cooperación de la organización que es la empleadora del objetivo.

            ### Navegando por la burocracia (vía progresiva)

            Las tareas burocráticas se manejan como una vía progresiva en intervalos diarios, pero el DJ puede ajustarla si es necesario.
            El DJ determina una cantidad oculta de éxitos necesarios según la naturaleza de la solicitud.
            Todos los días, el personaje tira para generar éxitos hasta alcanzar el umbral oculto.

            #### 1. Dificultad inicial (tamaño de la organización)

            El tamaño del sistema determina la dificultad base de la tirada diaria:

            * **Pequeña (bonificación de -1 paso):** Una organización local con reglas laxas, el gobierno de una pequeña ciudad, una pequeña empresa.
            * **Medio (sin modificador):** Una sede corporativa regional, una agencia gubernamental de la ciudad o un puerto espacial planetario.
            * **Grande (penalización de +1 paso):** Un ministerio nacional, un gremio comercial de todo el sector o un ejército planetario.
            * **Enorme (penalización de +2 pasos):** Una nación interestelar, una gran corporación con reglas estrictas o una agencia de inteligencia.

            #### 2. Modificadores de dificultad

            Una vez establecida la línea de base, aplique los siguientes modificadores a la dificultad:

            - **Familiaridad (-1 paso):** El administrador ha hecho esto antes.
            - **Acceso (-1 Pasos):** El administrador es miembro de la organización, tiene autorización o tiene la calificación adecuada.
            - **+2 Pasos (Rushing):** El personaje intenta eludir los protocolos estándar para obtener un resultado en un tiempo récord. Esto aumenta el rendimiento del éxito (ver más abajo).

            *Se puede obtener familiaridad o acceso contratando a un asistente legal local o sobornando a las personas adecuadas*

            #### 3. Rendimiento de éxito diario

            El resultado de la tirada diaria determina cuánto se avanza hacia el objetivo oculto.

            | Resultado de la tirada | Estándar | Corriendo (+2 pasos de dificultad) |
            | :--- | :--- | :--- |
            | **Fallo crítico** | **-3 Éxitos.** (Un gran error) | **-3 Éxitos.** |
            | **Fallo** | **Sin éxito.** | **1 éxito.** |
            | **Ordinario** | **1 éxito.** | **2 Éxitos.** |
            | **Bueno** | **2 Éxitos.** | **3 Éxitos.** |
            | **Increíble** | **3 Éxitos.** | **4 Éxitos.** |

            ### Obstáculos narrativos e interferencias

            Hasta que se alcancen los éxitos previstos, el DJ presenta el "trabajo" restante como obstáculos físicos o sociales:

            #### El ir y venir

            A medida que el personaje acumula éxitos día a día, puede dar retroalimentación, en forma de eventos tangibles.

            > El atraque ya está aprobado por el control del puerto, pero aún quedan algunos resultados de mantenimiento que deben procesarse, luego de eso puede traer el barco para su inspección. Mientras que una falla crítica puede significar que te saltaste un papeleo importante y necesitas comenzar de nuevo con una solicitud anterior.

            **Sabotaje:** Un oponente que usa Administración para obstaculizar al personaje, esto resta un éxito del personaje por cada éxito en su tirada de oponente.

            > El oponente organiza unas "vacaciones" inmediatas para el inspector del barco el día antes de que tuviera que firmar la aprobación de la bahía de atraque que acaba de inspeccionar. Deberá rehacer el mismo paso nuevamente.

            **Detección:** Un éxito **[Sorprendente]** revela la interferencia y ofrece algunas pistas del *método* de sabotaje (por ejemplo, una solicitud digital desviada). Desenmascarar al culpable requiere otras habilidades que permitan al grupo demostrar su valía (investigación, piratería, sigilo). Un fallo crítico al interferir deja expuesta la identidad del oponente. Interacción organizacional
    items:
      bureaucracy:
        attribute: WIL
        cost: 3
        url: /skills/administration#bureaucracy
        localized:
          - en:
              name: Bureaucracy
              description: |-
                This specialty skill measures a character's ability to grease (or clog up) the wheels of bureaucracy. Important applications, permits, clearances, reports, or other bureaucratic requests can be processed faster and more efficiently with the use of this skill. Conversely, this skill can be used to make the same bureaucratic processes slower for others.

                ### Rank Benefits

                ▶ **Rank 2 [Optimized Routing]** The character knows the shortcuts that actually work. When **Rushing** a request, the standard difficulty penalty is reduced from a **+2 step penalty** to a **+1 step penalty**. At Rank 4, the penalty is completely eliminated.

                ▶ **Rank 6 [Procedural Immunity]** Once per bureaucratic task, the character can ignore the **-3 success penalty** of a **Critical Failure**. Furthermore, when the character is a member of an organization and seeks permits for equipment or supplies, the request **automatically succeeds** in a single day. This automatic success is only negated if a rival is actively using a **Sabotage** action to hinder the character.

                ▶ **Rank 9 [Invisible Hand]** Your interference is a work of art. Opponents must roll an **Amazing** success just to realize they are being sabotaged. Furthermore, the character can now use [Administration](/skills/administration) to trace a saboteur's identity without requiring other skills, recognizing their specific "procedural signature." Unless the saboteur also has Rank 9 in this specialty, they cannot hide their identity from the character.

                ▶ **Rank 12 [Loophole Master]** The character generates **double the successes** on any check. Additionally, the character cannot be interfered with; they utilize obscure procedural routes that make it impossible for others to track where the request is actually being processed.
          - es:
              name: Burocracia
              description: |-
                Esta habilidad especializada mide la capacidad de un personaje para engrasar (u obstruir) las ruedas de la burocracia. Las solicitudes, permisos, autorizaciones, informes u otras solicitudes burocráticas importantes se pueden procesar de forma más rápida y eficiente con el uso de esta habilidad. Por el contrario, esta habilidad se puede utilizar para hacer que los mismos procesos burocráticos sean más lentos para otros.

                ### Beneficios de rango

                ▶ **Rango 2 [Ruta optimizada]** El personaje conoce los atajos que realmente funcionan. Cuando **Apresurar** una solicitud, la penalización de dificultad estándar se reduce de una **penalización de +2 pasos** a una **penalización de +1 paso**. En el rango 4, la penalización se elimina por completo.

                ▶ **Rango 6 [Inmunidad procesal]** Una vez por tarea burocrática, el personaje puede ignorar la **penalización de éxito -3** de un **Fallo crítico**. Además, cuando el personaje es miembro de una organización y busca permisos para equipos o suministros, la solicitud **automáticamente tiene éxito** en un solo día. Este éxito automático solo se anula si un rival está usando activamente una acción de **Sabotaje** para obstaculizar al personaje.

                ▶ **Rango 9 [Mano invisible]** Tu interferencia es una obra de arte. Los oponentes deben obtener un éxito **Asombroso** solo para darse cuenta de que están siendo saboteados. Además, el personaje ahora puede usar [Administración](/habilidades/administración) para rastrear la identidad de un saboteador sin requerir otras habilidades, reconociendo su "firma procesal" específica. A menos que el saboteador también tenga el rango 9 en esta especialidad, no puede ocultar su identidad al personaje.

                ▶ **Rango 12 [Maestro de lagunas]** El personaje genera **el doble de éxitos** en cualquier prueba. Además, no se puede interferir con el personaje; Utilizan rutas procesales oscuras que hacen imposible que otros puedan rastrear dónde se está procesando realmente la solicitud.
        trained_only: false
      management:
        attribute: WIL
        cost: 3
        url: /skills/administration#management
        localized:
          - en:
              name: Management
              description: |-
                This specialty governs the acquisition of physical goods and the strategic management of capital. It is used to find rare equipment, navigate supply chains, and oversee group or corporate finances. A skilled procurer knows how to make money go further, how to find items that aren't officially for sale, and how to turn stagnant capital into a growing engine of wealth.

                ### Rank Benefits

                ▶ **Rank 2 [Investment Portfolio]** If the character is in charge of personal or group capital, they can have it invested. Each month, the character makes a roll to determine the yield:
                *   **Critical Failure:** -20\%
                *   **Failure:** +0\%
                *   **Ordinary:** +10\%
                *   **Good:** +15\%
                *   **Amazing:** +30\%

                ▶ **Rank 3 [Financial Leverage]** The character receives a **-1 step bonus** to any check made using this specialty skill, and an **additional bonus steps** at Rank 9 and 12.

                ▶ **Rank 6 [Master of Capital]** The character drastically optimizes the group's burn rate. All **Upkeep costs** for employees, ships, and properties under the character's supervision are **cut by half**.
          - es:
              name: Gestión
              description: |-
                Esta especialidad rige la adquisición de bienes físicos y la gestión estratégica de capital. Se utiliza para encontrar equipos raros, navegar por cadenas de suministro y supervisar las finanzas corporativas o de grupos. Un comprador experto sabe cómo hacer que el dinero llegue más lejos, cómo encontrar artículos que no están oficialmente a la venta y cómo convertir el capital estancado en un creciente motor de riqueza.

                ### Beneficios de rango

                ▶ **Rango 2 [Cartera de Inversiones]** Si el personaje está a cargo de capital personal o grupal, puede tenerlo invertido. Cada mes, el personaje hace una tirada para determinar el rendimiento:
                * **Fallo crítico:** -20\%
                * **Error:** +0\%
                * **Ordinario:** +10\%
                * **Bueno:** +15\%
                * **Increíble:** +30\%

                ▶ **Rango 3 [Apalancamiento financiero]** El personaje recibe una **bonificación de -1 paso** a cualquier prueba realizada usando esta habilidad especial, y una **bonificación de pasos adicional** en los rangos 9 y 12.

                ▶ **Rango 6 [Maestro del capital]** El personaje optimiza drásticamente la tasa de quema del grupo. Todos los **costos de mantenimiento** para empleados, barcos y propiedades bajo la supervisión del personaje se **reducen a la mitad**.
        trained_only: false
    trained_only: false
  animal-handling:
    attribute: WIL
    cost: 3
    category: Other
    url: /skills/animal-handling
    localized:
      - en:
          name: Animal Handling
          description: |-
            This broad skill provides a character with the basic ability to train animals to perform a variety of tasks, including doing labor, accepting riders, tracking, and attacking. It's also used to determine if a character can get a trained animal to perform a task, to ride an animal, or to calm, capture, or otherwise handle a wild animal or an unfamiliar domestic animal. Note that the methods of training and the commands used with different animal species can vary widely.

            Purchasing the broad skill entitles a character to select one type of animal that he is able to train, subject to the approval of the Gamemaster. (e.g., "horse", or more specific breeds if required). To handle more than one type of animal, the character should possess the **Animal Training** specialty skill.

            ### Training Animals
            Any use of the Animal Handling broad skill to train a creature requires a **complex skill check**.
            - **Time Commitment:** The character must spend at least 4 hours a day working with the creature.
            - **Check Frequency:** A skill check is made at the end of each week of continuous work.
            - **Interruptions:** If the training is interrupted by one or more days, any days worked since the last check are lost. An interruption of a week or more may cause the entire training attempt to fail.

            **Training Outcomes:**
            - **Critical Failure:** The animal goes berserk and attacks its trainer.
            - **Three Failures:** The animal refuses to be trained by this character.

            ### Task Difficulty
            Untrained animals (wild or domestic) can only perform tasks of up to **Ordinary** difficulty.
            - **Ordinary:** Simple, one-word commands (Attack, Come, Sit, Stay, Fetch, Speak, Quiet).
            - **Good:** Combinations of two Ordinary tasks, or more difficult actions (e.g., pushing a lever).
            - **Amazing:** Tasks very few animals can or will do on command (e.g., rescuing someone from a burning building).

            ### Animal Handling Situation Modifiers
            <div class="table-wrapper"> <table> <thead> <tr> <th>Type</th> <th>Modifier</th> <th>Complexity</th> </tr> </thead> <tbody> <tr class="table-category"> <td colspan="3"><strong>Herbivores</strong></td> </tr> <tr> <td>Alien</td> <td>+2</td> <td>Amazing</td> </tr> <tr> <td>Domestic</td> <td>-1</td> <td>Good</td> </tr> <tr> <td>Wild</td> <td>+1</td> <td>Amazing</td> </tr> <tr class="table-category"> <td colspan="3"><strong>Carnivores</strong></td> </tr> <tr> <td>Alien</td> <td>+5</td> <td>Amazing</td> </tr> <tr> <td>Domestic</td> <td>-2</td> <td>Ordinary</td> </tr> <tr> <td>Wild</td> <td>+4</td> <td>Good</td> </tr> </tbody> </table> </div>

            ### Other Modifiers
            - **Unfamiliar animal:** +1 penalty (cumulative with others).
            - **Trained animal:**
                - Ordinary task: +0
                - Good task: +2
                - Amazing task: +4

            ### Riding Animals
            The broad skill enables a character to ride any animal used for basic ground transportation (horses, mules, etc.).
            - **Movement:** When ridden, the creature moves in every phase.
            - **Maneuvers:** During a character's action, they can attempt maneuvers (Routine, Moderate, or Extreme) as described in [Vehicle Maneuvers](/core-mechanics/vehicles-and-vessels/#maneuvers).
      - es:
          name: Manejo de Animales
          description: |-
            Esta amplia habilidad proporciona al personaje la capacidad básica de entrenar animales para realizar una variedad de tareas, que incluyen trabajar, aceptar jinetes, rastrear y atacar. También se utiliza para determinar si un personaje puede conseguir que un animal entrenado realice una tarea, monte un animal o calme, capture o maneje de otro modo a un animal salvaje o un animal doméstico desconocido. Tenga en cuenta que los métodos de entrenamiento y las órdenes utilizadas con diferentes especies animales pueden variar ampliamente.

            La adquisición de la habilidad amplia da derecho al personaje a seleccionar un tipo de animal que pueda entrenar, sujeto a la aprobación del Director de Juego. (por ejemplo, "caballo" o razas más específicas si es necesario). Para manejar más de un tipo de animal, el personaje debe poseer la habilidad especial **Entrenamiento de animales**.

            ### Entrenando animales
            Cualquier uso de la habilidad amplia de Manejo de animales para entrenar una criatura requiere una **prueba de habilidad compleja**.
            - **Compromiso de tiempo:** El personaje debe pasar al menos 4 horas al día trabajando con la criatura.
            - **Frecuencia de verificación:** Se realiza una verificación de habilidades al final de cada semana de trabajo continuo.
            - **Interrupciones:** Si la formación se interrumpe por uno o más días, se pierden los días trabajados desde el último control. Una interrupción de una semana o más puede hacer que fracase todo el intento de entrenamiento.

            **Resultados de la capacitación:**
            - **Fallo crítico:** El animal se vuelve loco y ataca a su entrenador.
            - **Tres Fallos:** El animal se niega a ser entrenado por este personaje.

            ### Dificultad de la tarea
            Los animales no entrenados (salvajes o domésticos) solo pueden realizar tareas de dificultad **ordinaria**.
            - **Ordinario:** Comandos simples de una palabra (atacar, venir, sentarse, quedarse, buscar, hablar, callar).
            - **Bueno:** Combinaciones de dos tareas ordinarias o acciones más difíciles (por ejemplo, empujar una palanca).
            - **Increíble:** Tareas que muy pocos animales pueden o harán cuando se les ordena (por ejemplo, rescatar a alguien de un edificio en llamas).

            ### Modificadores de situaciones de manejo de animales
            <div class="table-wrapper"> <table> <thead> <tr> <th>Tipo</th> <th>Modificador</th> <th>Complejidad</th> </tr> </thead> <tbody> <tr class="table-category"> <td colspan="3"><strong>Herbivoros</strong></td> </tr> <tr> <td>Alien</td> <td>+2</td> <td>Increíble</td> </tr> <tr> <td>Nacional</td> <td>-1</td> <td>Bueno</td> </tr> <tr> <td>Salvaje</td> <td>+1</td> <td>Increíble</td> </tr> <tr class="table-category"> <td colspan="3"><strong>Carnívoros</strong></td> </tr> <tr> <td>Extraterrestre</td> <td>+5</td> <td>Sorprendente</td> </tr> <tr> <td>Nacional</td> <td>-2</td> <td>Ordinario</td> </tr> <tr> <td>Salvaje</td> <td>+4</td> <td>Bueno</td> </tr> </tbody> </table> </div>

            **Otros modificadores:**
            - **Animal desconocido:** +1 de penalización (acumulable con otros).
            - **Animal entrenado:**
                - Tarea ordinaria: +0
                - Buena tarea: +2
                - Tarea increíble: +4

            ### Montar animales
            La habilidad amplia permite a un personaje montar cualquier animal utilizado para el transporte terrestre básico (caballos, mulas, etc.).
            - **Movimiento:** Cuando es montada, la criatura se mueve en cada fase.
            - **Maniobras:** Durante la acción de un personaje, puede intentar maniobras (de rutina, moderadas o extremas) como se describe en [Maniobras de vehículos](/core-mechanics/vehicles-and-vessels/#maneuvers).
    items:
      animal-riding:
        attribute: WIL
        cost: 1
        url: /skills/animal-handling#animal-riding
        localized:
          - en:
              name: Animal riding
              description: |-
                This specialty skill enables a character to improve this aspect of the Animal Handling broad skill. A character with this skill can attempt racing over dangerous terrain, making jumps or performing other stunts, and engaging in mounted combat.

                ▶ **Rank 3[Trick Riding]:** The character learns to perform special stunts or tricks while mounted. See trick riding.

                ### Trick Riding
                The character can direct their mount to jump fences, leap chasms, or move backward.
                - **Critical Failure:** The animal trips (damage as an Extremely Short fall for both).
                - **Failure:** The animal refuses to perform.

                #### Horizontal Leaps
                - **Ordinary:** Normal distance + 1 meter.
                - **Good:** Normal distance + 2 meters.
                - **Amazing:** Normal distance + 3 meters.

                #### Jumping Obstructions
                - **Ordinary:** Normal distance + 1 meter.
                - **Good:** Normal distance + 1.5 meters.
                - **Amazing:** Normal distance + 2 meters.

                #### Moving Backward:
                - **Ordinary:** Half walk movement rate.
                - **Good:** Full walk movement rate.
                - **Amazing:** 1.5x walk movement rate.

                #### Mounted Cover
                The character can use their mount for cover. This provides a penalty to an opponent's chance to hit the rider:
                - **Ordinary:** +1 step.
                - **Good:** +2 steps.
                - **Amazing:** +3 steps.

                *Note: This does not protect the mount. Trick riding cannot be combined with other actions (e.g., attacking while leaping).*
          - es:
              name: Montar Animales
              description: |-
                Esta habilidad especial permite a un personaje mejorar este aspecto de la habilidad amplia de Manejo de animales. Un personaje con esta habilidad puede intentar correr sobre terrenos peligrosos, realizar saltos o realizar otras acrobacias y participar en combates montados.

                ▶ En el rango 3, el personaje aprende a realizar acrobacias o trucos especiales mientras está montado. Ver trucos.

                ### Truco de montar
                El personaje puede dirigir su montura para saltar vallas, saltar abismos o retroceder.
                - **Fallo crítico:** El animal tropieza (el daño es una caída extremadamente corta para ambos).
                - **Fallo:** El animal se niega a actuar.

                **Saltos Horizontales:**
                - **Ordinario:** Distancia normal + 1 metro.
                - **Bueno:** Distancia normal + 2 metros.
                - **Increíble:** Distancia normal + 3 metros.

                **Saltar Obstrucciones:**
                - **Ordinario:** Distancia normal + 1 metro.
                - **Bueno:** Distancia normal + 1,5 metros.
                - **Increíble:** Distancia normal + 2 metros.

                **Moviéndose hacia atrás:**
                - **Ordinario:** Tasa de movimiento de media caminata.
                - **Bueno:** Velocidad de movimiento de caminata completa.
                - **Increíble:** Velocidad de movimiento al caminar 1,5 veces mayor.

                **Cubierta montada:** El personaje puede usar su montura para cubrirse. Esto proporciona una penalización a la posibilidad de que un oponente golpee al ciclista:
                - **Ordinario:** +1 paso.
                - **Bueno:** +2 pasos.
                - **Increíble:** +3 pasos.

                *Nota: Esto no protege el soporte. Los trucos no se pueden combinar con otras acciones (por ejemplo, atacar mientras se salta).*
        trained_only: false
        rank_benefits: []
      animal-training:
        attribute: WIL
        cost: 3
        url: /skills/animal-handling#animal-training
        localized:
          - en:
              name: Animal training
              description: |-
                This skill allows a character to handle, ride, and train a specific type of animal (the "Primary Animal" selected when purchasing the broad skill). A character can also use their **Animal Training** rank to interact with animals other than their Primary Animal, but they suffer a penalty to the skill check based on the biological or behavioral distance from their specialty:

                | Relationship | Modifier | Description |
                | :--- | :--- | :--- |
                | **Identical Type** | +0 | Different breeds or closely related species (e.g., Quarter Horse vs. Thoroughbred). |
                | **Related Type** | +1 | Similar anatomy or behavior (e.g., Horse vs. Mule, or a Wolf vs. a Domestic Dog). |
                | **Different Family** | +2 | Significant biological or behavioral differences (e.g., Mammal vs. Reptile, or Herbivore vs. Carnivore). |
                | **Alien/Xeno-creature** | +3 or more | Completely foreign biology or instincts. |
              rank_benefits:
                - rank: 3
                  title: Versatility
                - rank: 6
                  title: Versatility
                - rank: 9
                  title: Versatility
                - rank: 12
                  title: Versatility
          - es:
              name: Entrenamiento de animales
              description: |-
                Esta habilidad permite a un personaje manejar, montar y entrenar un tipo específico de animal (el "Animal principal" seleccionado al comprar la habilidad general). Un personaje también puede usar su rango **Entrenamiento de animales** para interactuar con animales distintos de su animal principal, pero sufre una penalización en la prueba de habilidad según la distancia biológica o de comportamiento de su especialidad:

                * **Tipo idéntico (penalización +0):** Razas diferentes o especies estrechamente relacionadas (por ejemplo, cuarto de milla frente a pura sangre).
                * **Tipo relacionado (penalización +1):** Anatomía o comportamiento similar (p. ej., caballo contra mula, o lobo contra perro doméstico).
                * **Familia diferente (penalización +2):** Diferencias biológicas o de comportamiento significativas (p. ej., mamífero versus reptil, o herbívoro versus carnívoro).
                * **Alien/Xeno-criatura (penalización +3 o más):** Biología o instintos completamente extraños.
        trained_only: false
    trained_only: false
  armor-operation:
    attribute: STR
    cost: 7
    category: Other
    url: /skills/armor-operation
    localized:
      - en:
          name: Armor Operation
          description: |-
            Armor that's bulky, heavy, and cumbersome hinders the character using it. This is reflected by a penalty to the character's action check (AP) and the lessening or negating of a character's **Dexterity** resistance modifier. The Armor Operation broad skill and its specialty skills help to alleviate these penalties.

            ### Base Effect
            Having just the broad skill allows a character to reduce the action check and Dexterity resistance modifier penalty of any type of armor by 1 step.
            - **Example:** A +1 AP penalty is reduced to 0.
            - **Limitation:** This benefit never provides a bonus.

            ### Strenuous Activity
            Some strenuous physical activities (jumping, running, climbing, etc.) while armored may require an **Armor Operation** check.
            - **Ordinary:** Half effect (e.g., run at one-half the normal rate).
            - **Good or better:** Full effect (e.g., run at the normal rate).

            ### Untrained
            Characters **untrained** in Armor Operation suffer the full penalty of any armor.
            - **Restrictions:** They can only walk and make simple attacks (no rank benefits allowed).
            - **Powered Armor:** Untrained characters cannot use powered armor.

            *Note: The AP penalty of armors and shields is cumulative.*
      - es:
          name: Operación de armadura
          description: |-
            La armadura que es voluminosa, pesada y engorrosa dificulta que el personaje la use. Esto se refleja en una penalización a la prueba de acción (AP) del personaje y en la disminución o negación del modificador de resistencia **Destreza** del personaje. La habilidad general Operación Armadura y sus habilidades especiales ayudan a aliviar estas penalizaciones.

            ### Efecto base
            Tener solo la habilidad amplia permite a un personaje reducir la prueba de acción y la penalización del modificador de resistencia a la Destreza de cualquier tipo de armadura en 1 paso.
            - **Ejemplo:** Una penalización de +1 AP se reduce a 0.
            - **Limitación:** Este beneficio nunca proporciona una bonificación.

            ### Actividad extenuante
            Algunas actividades físicas extenuantes (saltar, correr, escalar, etc.) mientras se lleva armadura pueden requerir una prueba de **Operación de armadura**.
            - **Ordinario:** Medio efecto (p. ej., correr a la mitad del ritmo normal).
            - **Bueno o mejor:** Efecto completo (p. ej., correr al ritmo normal).

            ### Sin entrenamiento
            Los personajes **no entrenados** en Operación Armadura sufren la penalización total de cualquier armadura.
            - **Restricciones:** Solo pueden caminar y realizar ataques simples (no se permiten beneficios de rango).
            - **Armadura potenciada:** Los personajes no entrenados no pueden usar armaduras potenciadas.

            *Nota: La penalización de AP de armaduras y escudos es acumulativa.*
    items:
      combat-armor:
        attribute: STR
        cost: 3
        url: /skills/armor-operation#combat-armor
        localized:
          - en:
              name: Combat armor
              description: |-
                This specialty represents the level of mastery in the use of armor, as well as the specialized training needed to use powered armors, allowing the character to obtain the most of any armor.

                ⊗ **Rank 1, 4, 6, 10 [Improved Operation]:** The reduction to action check and Dexterity resistance modifier penalties becomes 2 steps. This improves to 3 steps at **Rank 4**, 4 steps at **Rank 6**, and 5 steps at **Rank 10**.

                ⊗ **Rank 2, 4, 6, 8, 10, 12 [Shaking Off Stuns]:** Stun damage (including secondary) is reduced by 1 point. This increases by 1 for every 2 ranks attained (max 6 points at **Rank 12**).

                ▶ **Rank 7 [Powered Armor Operation]:** The character has mastered the synchronization required to operate Powered Armor suits.
          - es:
              name: Armadura de Combate
              description: |-
                Esta especialidad representa el nivel de dominio en el uso de armaduras, así como el entrenamiento especializado necesario para usar armaduras potenciadas, permitiendo al personaje obtener el máximo provecho de cualquier armadura.

                ⊗ **Rango 1 (Operación mejorada):** La reducción de la prueba de acción y las penalizaciones del modificador de resistencia a la Destreza se convierten en 2 pasos. Esto mejora a 3 pasos en **Rango 4**, 4 pasos en **Rango 6** y 5 pasos en **Rango 10**.

                ⊗ **Rango 2 (Liberarse del aturdimiento):** El daño del aturdimiento (incluido el secundario) se reduce en 1 punto. Esto aumenta en 1 por cada 2 rangos alcanzados (máximo 6 puntos en **Rango 12**).

                ▶ **Rango 7 (Operación de Armadura potenciada):** El personaje ha dominado la sincronización necesaria para operar los trajes Armadura potenciada.
        trained_only: false
        rank_benefits:
          - rank: 1
            title: Improved Operation
          - rank: 2
            title: Shaking Off Stuns
          - rank: 7
            title: Powered Armor Operation
      tactical-armor:
        attribute: INT
        cost: 3
        url: /skills/armor-operation#tactical-armor
        localized:
          - en:
              name: Tactical armor
              description: |-
                This specialty skill enters into play when armors with integrated equipment are used (sensors, communications, etc.). It does not apply to mounted weaponry, which uses its own specific skill. It can also be used to resist electronic attacks like sensor hacking or jamming.

                ▶ **Rank 2 [Tactical Multi-tasking]:** The character can perform one operation with integrated suit equipment (cycling sensors, changing frequencies) without spending an action. One additional free operation is gained at **Rank 6** and **Rank 10**.

                ▶ **Rank 5 [Sensor Proficiency]:** Receive a **-1 step bonus** to checks involving the operation or interpretation of integrated suit sensors.

                ▶ **Rank 7 [Counter-Intrusion]:** Gain a **-1 step bonus** to resist electronic warfare or hacking attempts directed at the suit. This improves to **-2 steps** at **Rank 11**.
          - es:
              name: Armadura Táctica
              description: |-
                Esta habilidad especial entra en juego cuando se utilizan armaduras con equipos integrados (sensores, comunicaciones, etc.). No se aplica al armamento montado, que utiliza su propia habilidad específica. También se puede utilizar para resistir ataques electrónicos como piratería o interferencia de sensores.

                ▶ **Rango 2 (Multitarea táctica):** El personaje puede realizar una operación con el equipo integrado del traje (sensores de ciclismo, cambio de frecuencias) sin gastar una acción. Se obtiene una operación gratuita adicional en **Rango 6** y **Rango 10**.

                ▶ **Rango 5 (Competencia con sensores):** Reciba una **bonificación de -1 paso** en las comprobaciones que involucren el funcionamiento o la interpretación de los sensores integrados del traje.

                ▶ **Rango 7 (Contraintrusión):** Obtén una **bonificación de -1 paso** para resistir la guerra electrónica o los intentos de piratería dirigidos al traje. Esto mejora a **-2 pasos** en **Rango 11**.
        trained_only: false
        rank_benefits:
          - rank: 2
            title: Tactical Multi-tasking
          - rank: 5
            title: Sensor Proficiency
          - rank: 7
            title: Counter-Intrusion
      propulsion-systems:
        attribute: INT
        cost: 3
        url: /skills/armor-operation#propulsion-systems
        localized:
          - en:
              name: Propulsion systems
              description: |-
                This specialty skill represents mastery in the use of integrated propulsion systems, such as jetpacks, underwater drives, or gravitic assisted deceleration systems (GADS).

                ▶ **Rank 2 [Thermal/Fuel Management]:** Optimize fuel or heat dissipation, extending operational time of propulsion units by 50%.

                ▶ **Rank 4 [Vector Calibration & Aerobatics Integration]:** Adjust thrust nozzles for specific tasks, providing a **-1 step bonus** to maneuvering checks. Additionally, the character is sufficiently familiarized with armor propulsion systems to use the **Aerobatics** specialty skill for complex maneuvers while wearing the suit.

                ▶ **Rank 7 [Maximum Burn]:** Make a Propulsion Systems check to increase speed for the round: Ordinary (+25%), Good (+50%), or Amazing (+100%). Each consecutive round of forcing the engine incurs a cumulative +1 step penalty. The penalty is reduced by 1 for each round the propulsion is not used.
          - es:
              name: Sistemas de propulsión
              description: |-
                Esta habilidad especializada representa el dominio en el uso de sistemas de propulsión integrados, como mochilas propulsoras, propulsores submarinos o sistemas de desaceleración asistida por gravedad (GADS).

                ▶ **Rango 2 (Gestión térmica/combustible):** Optimice la disipación de combustible o calor, ampliando el tiempo operativo de las unidades de propulsión en un 50 %.

                ▶ **Rango 4 (Calibración vectorial e integración de acrobacias aéreas):** Ajusta las boquillas de empuje para tareas específicas, lo que proporciona una **bonificación de -1 paso** en las comprobaciones de maniobra. Además, el personaje está lo suficientemente familiarizado con los sistemas de propulsión de armaduras como para usar la habilidad especial **Acrobacias aéreas** para maniobras complejas mientras usa el traje.

                ▶ **Rango 7 (Consumo máximo):** Haz una prueba de Sistemas de propulsión para aumentar la velocidad de la ronda: Ordinario (+25%), Bueno (+50%) o Increíble (+100%). Cada ronda consecutiva de forzar el motor conlleva una penalización acumulativa de +1 paso. La penalización se reduce en 1 por cada ronda en la que no se utiliza la propulsión.
        trained_only: false
        rank_benefits:
          - rank: 2
            title: Thermal/Fuel Management
          - rank: 4
            title: Vector Calibration & Aerobatics Integration
          - rank: 7
            title: Maximum Burn
      shields:
        attribute: STR
        cost: 3
        url: /skills/armor-operation#shields
        localized:
          - en:
              name: Shields
              description: |-
                Focuses on the tactical use of physical, energy, or ballistic shields.

                ▶ **Rank 3 [Reactive Block]:** Spend the next available action to perform an opposed check against an attacker. If successful, the attack is negated. (Note: Only Ballistic or Large shields of the appropriate PL can block ranged fire).

                ⊗ **Rank 4 [Resistance Modifier]:** Provides a **+1 improvement** to the **Strength** resistance modifier. This does not stack with Melee Weapons benefits.

                ▶ **Rank 6 [Tactical Charge]:** Negates the standard +2 step bonus opponents receive to hit a charging target.

                ▶ **Rank 8 [Recoil Anchor]:** Reduce the situation die penalty for Burst or Autofire by 1 step when using one-handed weapons with a shield.

                ▶ **Rank 12 [Overlapping Coverage]:** Share the shield's resistance modifier bonus with an ally within 2 meters against one ranged attack per round.
          - es:
              name: Escudos
              description: |-
                Se centra en el uso táctico de escudos físicos, energéticos o balísticos.

                ▶ **Rango 3 (Bloqueo reactivo):** Gasta la siguiente acción disponible para realizar una prueba enfrentada contra un atacante. Si tiene éxito, el ataque es negado. (Nota: Sólo los escudos balísticos o grandes del PL apropiado pueden bloquear el fuego a distancia).

                ⊗ **Rango 4 (Modificador de resistencia):** Proporciona una **mejora de +1** al modificador de resistencia **Fuerza**. Esto no se acumula con los beneficios de las armas cuerpo a cuerpo.

                ▶ **Rango 6 (Carga táctica):** Anula la bonificación estándar de +2 pasos que reciben los oponentes al golpear a un objetivo que carga.

                ▶ **Rango 8 (Ancla de retroceso):** Reduce la penalización del dado de situación por Explosión o Disparo automático en 1 paso cuando se usan armas de una mano con escudo.

                ▶ **Rango 12 (Cobertura superpuesta):** Comparte la bonificación del modificador de resistencia del escudo con un aliado en un radio de 2 metros contra un ataque a distancia por ronda.
        trained_only: false
        rank_benefits:
          - rank: 3
            title: Reactive Block
          - rank: 4
            title: Resistance Modifier
          - rank: 6
            title: Tactical Charge
          - rank: 8
            title: Recoil Anchor
          - rank: 12
            title: Overlapping Coverage
    trained_only: false
  athletics:
    attribute: STR
    cost: 3
    category: Other
    url: /skills/athletics
    localized:
      - en:
          name: Athletics
          description: |-
            This broad skill provides a character with the abilities of a natural athlete—a competent level of strength, grace, and physical prowess. This skill is used to determine the success of physical actions such as climbing a tree, jumping over a large hole, or throwing an object at a target.
      - es:
          name: Atletismo
          description: |-
            Esta amplia habilidad proporciona al personaje las habilidades de un atleta natural: un nivel competente de fuerza, gracia y destreza física. Esta habilidad se utiliza para determinar el éxito de acciones físicas como trepar a un árbol, saltar sobre un gran agujero o lanzar un objeto a un objetivo.
    items:
      climb:
        attribute: STR
        cost: 2
        url: /skills/athletics#climb
        localized:
          - en:
              name: Climb
              description: |-
                The ability to scale vertical surfaces and navigate difficult terrain.

                ### Combat Climbing
                Movement per phase based on check: Ordinary (1m), Good (2m), Amazing (3m). Critical Failure results in a fall.

                ### Challenge Climbing
                Outside of rounds, climbing is resolved as a **complex skill check**.
          - es:
              name: Trepar
              description: |-
                La capacidad de escalar superficies verticales y navegar por terrenos difíciles.

                **Escalada de combate:** Movimiento por fase según verificación: Ordinario (1 m), Bueno (2 m), Increíble (3 m). La falla crítica resulta en una caída.

                **Desafío de escalada:** Fuera de las rondas, la escalada se resuelve como una **prueba de habilidad compleja**.
        trained_only: false
      jump:
        attribute: STR
        cost: 1
        url: /skills/athletics#jump
        localized:
          - en:
              name: Jump
              description: |-
                The ability to leap over obstacles or across gaps.

                ### Types of Jump
                - **Standing:** Ordinary 1m; Good 2m; Amazing 3m.
                - **Running:** Ordinary 2m; Good 4m; Amazing 6m.
                - **Vertical:** Ordinary 1m; Good 1.5m; Amazing 2m.

                ### Vaulting
                Vertical leap enhanced by a pole or object. Adds +1m (object) or +2m (pole) to the jump.

                ### Rank Benefits
                ▶ **Rank 3, 6, 9, 12 [Increased Running Distance]:** Running distance is increased by +1m.

                ▶ **Rank 4, 7, 10 [Increased Standing Distance]:** Standing distance is increased by +1m.

                ▶ **Rank 5, 8, 11 [Increased Vertical Distance]:** Vertical distance is increased by +0.5m.
          - es:
              name: Saltar
              description: |-
                La capacidad de saltar obstáculos o atravesar brechas.
                **Tipos de Salto:**
                - **De pie:** Ordinario 1m; Bueno 2m; Increíble 3m.
                - **Corriendo:** Ordinario 2m; Bueno 4m; Increíbles 6m.
                - **Vertical:** Ordinario 1m; Bueno 1,5 m; Increíble 2m.

                **Salto:** Salto vertical potenciado por un palo u objeto. Añade +1m (objeto) o +2m (poste) al salto.

                ▶ **Distancia aumentada:** Los rangos proporcionan bonificaciones de distancia: correr (+1 m en los rangos 3, 6, 9, 12), de pie (+1 m en los rangos 4, 7, 10), vertical (+0,5 m en los rangos 5, 8, 11).
        trained_only: false
      swim:
        attribute: STR
        cost: 2
        url: /skills/athletics#swim
        localized:
          - en:
              name: Swim
              description: |-
                Proficiency in moving through liquid environments. Without this skill, a character can only tread water and paddle crudely.

                ▶ **Rank 1, 4, 8, 12 [Improved Breathing]:** Situation die bonus to Stamina checks for holding breath: Rank 1 (-1 step), Rank 4 (-2 steps), Rank 8 (-3 steps), Rank 12 (-4 steps).

                ▶ **Rank 4, 8, 12 [Increased Swim Speed]:** Swim speed increases by 1m at Rank 4, 8, and 12.
          - es:
              name: Nadar
              description: |-
                **Solo entrenado.**
                Competencia para moverse a través de ambientes líquidos. Sin esta habilidad, un personaje sólo puede flotar en el agua y remar toscamente.

                ▶ **Respiración mejorada:** Bonificación del dado de situación a las pruebas de resistencia por contener la respiración: rango 1 (-1), rango 4 (-2), rango 8 (-3), rango 12 (-4).

                ▶ **Tasa de movimiento:** La velocidad de nado aumenta en 1 m en los rangos 4, 8 y 12.
        trained_only: true
      throw:
        attribute: STR
        cost: 2
        url: /skills/athletics#throw
        localized:
          - en:
              name: Throw
              description: |-
                Proficiency in hurling objects (knives, grenades, rocks) at targets. Accuracy is governed by [Table P20: Accuracy by Range]({{< relref "core-mechanics/useful-tables#table-p20-accuracy-by-range" >}}).

                ### Trajectory Control
                A character can attempt advanced maneuvers with a base **+2 step penalty**:
                - **Magnus Curve:** Thrown object curves making hard to predict the trajectory, ignoring 1 step of the target dexterity resistance (if any).
                - **Ricochet:** Bounce off a surface to hit a target (ignore LOS requirements if the path is known).
                - **Sub-Orbital Arc:** Throw over large obstacles.

                ▶ **Rank 3, 6, 9, 12 [Trajectory Mastery]:** Ranks in this specialty reduce the penalty for Trajectory Control maneuvers: **Rank 3 (-1 step)**, **Rank 6 (-2 steps)**, **Rank 9 (-3 steps)**, **Rank 12 (-4 steps)**.

                ▶ **Rank 12 [Deflect]:** Once per round, the character can attempt to deflect away a thrown projectile (like a grenade or knife), for this he needs to be within arm's reach of the projectile and succeed in an opposed Athletics-throw check. An **Amazing** result on the check means they can immediately throw it back as a free action.
          - es:
              name: Lanzar
              description: |-
                Competencia en lanzar objetos (cuchillos, granadas, piedras) a los objetivos. La precisión se rige por la [Tabla P20: Precisión por rango]({{< relref "core-mechanics/useful-tables#table-p20-accuracy-by-range" >}}).

                ### Control de trayectoria
                Un personaje puede intentar maniobras avanzadas con una base **penalización de +2 pasos**:
                - **Curva Magnus:** Lanza una pieza de cobertura (ignora la penalización de cobertura +1).
                - **Rebote:** Rebota en una superficie para alcanzar un objetivo (ignora los requisitos de LOS si conoces el camino).
                - **Arco suborbital:** Lanza grandes obstáculos.

                ▶ **Dominio de la trayectoria:** Los rangos en esta especialidad reducen la penalización por las maniobras de control de trayectoria: **Rango 3 (-1)**, **Rango 6 (-2)**, **Rango 9 (-3)**, **Rango 12 (-4)**.

                ▶ **Inversión cinética (rango 12):** Una vez por ronda, el personaje puede intentar atrapar un proyectil lanzado (como una granada o un cuchillo) con una prueba de lanzamiento atlético **Asombroso**. Si tiene éxito, puede devolverlo inmediatamente como acción gratuita.
        trained_only: false
    trained_only: false
  awareness:
    attribute: WIL
    cost: 3
    category: Other
    url: /skills/awareness
    localized:
      - en:
          name: Awareness
          description: |-
            Free to fraal, human, mechalus, sesheyan, t'sa, and weren characters. This broad skill represents a character's powers of observation, perception, and intuition. Skill checks are called for when the Gamemaster needs to determine if a character notices something—characters themselves never call for a use of this skill.

            Noticing something could be as simple as providing a hint that the character missed in the normal course of play, or help when the character appears totally lost or confused. On a Failure, the character doesn't notice a thing. Otherwise, any success provides the character with at least a small clue. The Gamemaster can decide that the better the level of success achieved, the more details the character becomes aware of.

            ### Guidelines for Use
            The Awareness broad skill and its specialties are examples of how the general rule on dice rolling applies: Dice should only be rolled on a skill check in a situation when the Gamemaster needs to determine if a character is capable of doing something difficult or out of the **Ordinary**.

            More often than not, characters with respectable scores in Awareness or its specialties will automatically succeed when something exists that can be noticed or perceived (e.g., seeing a fallen tree blocking a path). A skill check is called for to see if the character notices subtle details (e.g., a hole in the trunk where an object is concealed).

            ### Modifiers
            - **Sensors:** Some sensor equipment may provide benefits to Awareness checks.
            - **Opponent Skills:** Another character’s use of certain skills (such as Stealth or Security) can add modifiers to an Awareness check.
      - es:
          name: Alerta
          description: |-
            Gratis para personajes fraal, humanos, mechalus, sesheyan, t'sa y weren. Esta amplia habilidad representa los poderes de observación, percepción e intuición de un personaje. Las pruebas de habilidad se realizan cuando el director de juego necesita determinar si un personaje nota algo; los personajes en sí nunca requieren el uso de esta habilidad.

            Notar algo podría ser tan simple como dar una pista que el personaje se perdió en el curso normal del juego, o ayudar cuando el personaje parece totalmente perdido o confundido. En caso de Fallo, el personaje no nota nada. De lo contrario, cualquier éxito proporciona al personaje al menos una pequeña pista. El Director de Juego puede decidir que cuanto mejor sea el nivel de éxito alcanzado, más detalles conocerá el personaje.

            ### Pautas de uso
            La habilidad amplia Conciencia y sus especialidades son ejemplos de cómo se aplica la regla general sobre la tirada de dados: los dados sólo deben tirarse en una prueba de habilidad en una situación en la que el director del juego necesita determinar si un personaje es capaz de hacer algo difícil o fuera de lo **ordinario**.

            La mayoría de las veces, los personajes con puntuaciones respetables en Conciencia o sus especialidades tendrán éxito automáticamente cuando exista algo que pueda notarse o percibirse (por ejemplo, ver un árbol caído bloqueando un camino). Se requiere una prueba de habilidad para ver si el personaje nota detalles sutiles (por ejemplo, un agujero en el baúl donde se esconde un objeto).

            ### Modificadores
            - **Sensores:** Algunos equipos de sensores pueden proporcionar beneficios para las pruebas de Conciencia.
            - **Habilidades del oponente:** El uso de ciertas habilidades por parte de otro personaje (como Sigilo o Seguridad) puede agregar modificadores a una prueba de Conciencia.
    items:
      intuition:
        attribute: WIL
        cost: 1
        url: /skills/awareness#intuition
        localized:
          - en:
              name: Intuition
              description: |-
                This specialty skill represents a character's natural instincts—the ability to sense danger when no obvious signs are evident, to avoid surprise, or to make an intuitive leap of logic without the support of hard facts. It is the ability to make a "best guess" in a given situation.

                ### Avoiding Surprise
                When no obvious signs of danger are evident, a character’s subconscious use of this skill can enable them to avoid being caught by surprise. The Gamemaster calls for intuition checks; players do not request them.
                - **Success:** The character isn't surprised and can act in the surprise phase of the upcoming round.

                ### The "Best Guess"
                When a character wants to make an intuitive "best guess," the Gamemaster may allow a player to call for an intuition skill check on their character’s behalf.
                - **Success:** Yields a beneficial result; the greater the level of success, the more accurate and complete the conclusion.
                *Note: This use is only permitted to characters who have purchased the specialty skill and should not be allowed more than once or twice in an adventure.*
          - es:
              name: Intuición
              description: |-
                Esta habilidad especial representa los instintos naturales de un personaje: la capacidad de sentir el peligro cuando no hay signos evidentes, evitar la sorpresa o dar un salto lógico intuitivo sin el apoyo de hechos concretos. Es la capacidad de hacer una "mejor suposición" en una situación determinada.

                ### Evitar sorpresas
                Cuando no hay señales obvias de peligro, el uso subconsciente de esta habilidad por parte de un personaje puede permitirle evitar ser tomado por sorpresa. El Director de Juego exige pruebas de intuición; los jugadores no los solicitan.
                - **Éxito:** El personaje no se sorprende y puede actuar en la fase sorpresa de la siguiente ronda.

                ### La "mejor suposición"
                Cuando un personaje quiere hacer una "mejor suposición" intuitiva, el Director de Juego puede permitir que un jugador solicite una prueba de habilidad de intuición en nombre de su personaje.
                - **Éxito:** Produce un resultado beneficioso; cuanto mayor sea el nivel de éxito, más precisa y completa será la conclusión.
                *Nota: este uso solo está permitido a personajes que hayan adquirido la habilidad especial y no debe permitirse más de una o dos veces en una aventura.*
        trained_only: false
      perception:
        attribute: WIL
        cost: 3
        url: /skills/awareness#perception
        localized:
          - en:
              name: Perception
              description: |-
                This specialty skill represents a character's alertness and powers of observation—the character notices something either consciously or on a subliminal level. While intuition is a feeling or unexplainable sense, perception works on signs that can be spotted by normal senses (e.g., a broken twig, the click of a gun’s safety, a whisper in the wind).

                ### Spotting Trouble
                When potential danger obviously exists in a situation, a character's subconscious use of this skill can help them avoid being caught by surprise. The Gamemaster calls for perception checks; players do not request them.
                - **Success:** The character isn't surprised and can act in the surprise phase of the upcoming round.
          - es:
              name: Percepción
              description: |-
                Esta habilidad especial representa el estado de alerta y los poderes de observación de un personaje: el personaje nota algo ya sea conscientemente o en un nivel subliminal. Si bien la intuición es un sentimiento o un sentido inexplicable, la percepción funciona con signos que pueden ser detectados por los sentidos normales (por ejemplo, una ramita rota, el clic del seguro de un arma, un susurro en el viento).

                ### Detectar problemas
                Cuando obviamente existe un peligro potencial en una situación, el uso subconsciente de esta habilidad por parte de un personaje puede ayudarlo a evitar ser tomado por sorpresa. El Director de Juego exige controles de percepción; los jugadores no los solicitan.
                - **Éxito:** El personaje no se sorprende y puede actuar en la fase sorpresa de la siguiente ronda.
        trained_only: false
      psionic-sense:
        attribute: WIL
        cost: 4
        url: /skills/awareness#psionic-sense
        localized:
          - en:
              name: Psionic Sense
              description: |-
                Only characters capable of using psionic powers (such as Mindwalkers) or those with the "Psionic Awareness" perk can purchase and use this skill.

                This specialty skill allows a character to detect the activation of psionic powers and the presence of psionic phenomena. It can assist in identifying the type of power, the direction of its source, and the approximate intensity of the psionic user.

                ### Detecting Psionic Powers
                The Gamemaster will call for a check when a psionic power is activated in the character's vicinity, or affect the character or its vicinity.
                - **Ordinary:** The character senses that *some* psionic power was activated nearby.
                - **Good:** If the source is in line of sight, the character can identify the user. Otherwise, they get a general idea of the direction and distance.
                - **Amazing:** The character can detect subtle, ongoing effects (e.g., mental manipulation or psionic illusions).

                ### Identifying and Tracing
                If the character attempts a **Knowledge—Psionics** check to identify  the type of psionic power or an ESP power to trace a detected power, they receive a bonus based on their Psionic Sense result:
                - **Ordinary:** No bonus.
                - **Good:** -1 step bonus.
                - **Amazing:** -3 steps bonus.

                Characters capable of using the **Clairvoyance** or similar ESP power can also apply this bonus to their skill check when tracing the source of a psionic event.
          - es:
              name: Sentido psiónico
              description: |-
                **Solo entrenado.** Solo los personajes capaces de usar poderes psiónicos (como Mindwalkers) o aquellos con la ventaja "Conciencia psiónica" pueden comprar y usar esta habilidad.

                Esta habilidad especial permite a un personaje detectar la activación de poderes psiónicos y la presencia de fenómenos psiónicos. Puede ayudar a identificar el tipo de poder, la dirección de su fuente y la intensidad aproximada del usuario psiónico.

                ### Detectando poderes psiónicos
                El Director de Juego solicitará una verificación cuando se active un poder psiónico en las proximidades del personaje.
                - **Ordinario:** El personaje siente que *algún* poder psiónico fue activado cerca.
                - **Bien:** Si la fuente está en la línea de visión, el personaje puede identificar al usuario. De lo contrario, obtienen una idea general de la dirección y la distancia.
                - **Asombroso:** El personaje puede detectar efectos sutiles y continuos (por ejemplo, manipulación Mental o ilusiones psiónicas).

                ### Identificación y rastreo
                Si el personaje intenta una prueba de **Conocimiento—Psiónica** para identificar o rastrear un poder detectado, recibe una bonificación basada en su resultado de Sentido psiónico:
                - **Ordinario:** Sin bonificación.
                - **Bueno:** -Bono de 1 paso.
                - **Increíble:** -Bonificación de 3 pasos.

                Los personajes capaces de usar el poder de **Clarividencia** también pueden aplicar esta bonificación a su prueba de habilidad al rastrear la fuente de un evento psiónico.
        trained_only: true
    trained_only: false
  business:
    attribute: INT
    cost: 4
    category: Social
    url: /skills/business
    localized:
      - en:
          name: Business
          description: |-
            This broad skill provides a character with basic knowledge of the theories of production, distribution, supply and demand, advertising, inventory control, and business planning.

            ### Uses
            Skill checks are called for when a character wants to:
            - Apply business knowledge to conclude a trade.
            - Attempt an illegal business transaction.
            - Determine the value of goods in their own society.
            - Locate commodity marketplaces.
            - Compute the local fair market value of goods and services.

            ### Interaction and Haggling
            If a character uses Business to haggle over the buying or selling of a commodity, the other party's **Intelligence** resistance modifier is applied to the situation die.
            - **Character vs. Character:** If the other party also has the Business skill, the Gamemaster may handle it as a contested check.
            - **Encounter Skill:** Business can be treated as an [encounter skill](/core-mechanics/characters-in-action/#encounter-scene). If the target's attitude becomes Friendly or better, it provides a bonus to subsequent cooperation checks.

            ### Modifiers
            - **Penalties:** Usually apply when dealing in exotic, rare, or unfamiliar goods; attempting illegal transactions; or dealing with an unfamiliar culture.
            - **Bonuses:** Apply if the character has inside information or is dealing with a familiar commodity or culture.
      - es:
          name: Negocios
          description: |-
            Esta amplia habilidad proporciona al personaje conocimientos básicos de las teorías de producción, distribución, oferta y demanda, publicidad, control de inventarios y planificación empresarial.

            ### Usos
            Se requieren pruebas de habilidad cuando un personaje quiere:
            - Jugar en bolsa.
            - Aplicar conocimientos empresariales para concluir una operación.
            - Intentar una transacción comercial ilegal.
            - Determinar el valor de los bienes en la propia sociedad.
            - Localizar mercados de productos básicos.
            - Calcular el valor justo de mercado local de bienes y servicios.

            ### Interacción y regateo
            Si un personaje usa Negocios para regatear la compra o venta de un bien, el modificador de resistencia **Inteligencia** de la otra parte se aplica al dado de situación.
            - **Personaje contra Personaje:** Si la otra parte también tiene la habilidad Negocios, el Director de Juego puede tratarla como una prueba impugnada.
            - **Habilidad de encuentro:** Los negocios se pueden tratar como una [habilidad de encuentro](/core-mechanics/characters-in-action/#encounter-scene). Si la actitud del objetivo se vuelve Amistosa o mejor, proporciona una bonificación a las pruebas de cooperación posteriores.

            ### Modificadores
            - **Sanciones:** Generalmente se aplican cuando se trata de bienes exóticos, raros o desconocidos; intentar transacciones ilegales; o lidiar con una cultura desconocida.
            - **Bonificaciones:** Se aplica si el personaje tiene información privilegiada o está tratando con un producto o cultura familiar.
    items:
      corporate:
        attribute: INT
        cost: 3
        url: /skills/business#corporate
        localized:
          - en:
              name: Corporate
              description: |-
                This specialty skill improves a character's ability to function in the realm of large-scale trade and commerce. It covers stock markets, mergers, corporate acquisitions, and speculative business. It also provides an understanding of how large organizations and corporations operate.

                ### Rank Benefits
                ⊗ **Rank 1, 4, 7, 10 [Art of the deal]** Gains a number of situation bonus steps based on the ranks in this specialty skill (-1 step at Rank 1, -2 steps at Rank 4, -3 steps at Rank 7, and -4 steps at Rank 10) when making deals, haggling, or bargaining within the scope of corporate finance.
          - es:
              name: Corporativo
              description: |-
                Esta habilidad especializada mejora la capacidad de un personaje para funcionar en el ámbito del comercio a gran escala. Cubre mercados de valores, fusiones, adquisiciones corporativas y negocios especulativos. También proporciona una comprensión de cómo operan las grandes organizaciones y corporaciones.
        trained_only: false
      illicit-business:
        attribute: INT
        cost: 3
        url: /skills/business#illicit-business
        localized:
          - en:
              name: Illicit business
              description: |-
                This specialty skill allows a character to function in the underside of the business world, providing knowledge of extortion, smuggling, fencing stolen goods, and the black market. It is the primary skill of white-collar criminals (embezzlers, insider traders, corporate spies).

                ### Rank Benefits
                ⊗ **Rank 1, 4, 7, 10 [Art of the deal]** Gains a number of situation bonus steps based on the ranks in this specialty skill (-1 step at Rank 1, -2 steps at Rank 4, -3 steps at Rank 7, and -4 steps at Rank 10) when making deals, haggling, or bargaining within the scope of illicit business.
          - es:
              name: Negocios Ilícitos
              description: |-
                Esta habilidad especializada permite al personaje funcionar en la parte oculta del mundo empresarial, proporcionándole conocimientos sobre extorsión, contrabando, vallado de bienes robados y el mercado negro. Es la habilidad principal de los delincuentes de cuello blanco (malversadores, comerciantes de información privilegiada, espías corporativos).

                ### Transacciones ilegales
                Esta habilidad reduce la pena por intentar transacciones ilegales.

                ⊗ **Rango 1, 4, 7, 10 [Arte del trato]** Penalización reducida en -1 paso en el rango uno más un paso adicional en los rangos 4, 7 y 10.

                *Nota: Este beneficio sólo reduce o elimina sanciones; nunca proporciona una bonificación.
        trained_only: false
        rank_benefits: []
      small-business:
        attribute: INT
        cost: 3
        url: /skills/business#small-business
        localized:
          - en:
              name: Small business
              description: |-
                This specialty skill allows a character to function in small-scale trade and commerce. It improves the ability to haggle on the consumer level, determine the value of goods and services, and find buyers and sellers in a local area.

                ### Rank Benefits
                ⊗ **Rank 1, 4, 7, 10 [Art of the deal]** Gains a number of situation bonus steps based on the ranks in this specialty skill (-1 step at Rank 1, -2 steps at Rank 4, -3 steps at Rank 7, and -4 steps at Rank 10) when making deals, haggling, or bargaining within the scope of  small-business finance.
          - es:
              name: Pequeños Negocios
              description: |-
                Esta habilidad especial permite a un personaje funcionar en el comercio y el comercio a pequeña escala. Mejora la capacidad de regatear a nivel del consumidor, determinar el valor de bienes y servicios y encontrar compradores y vendedores en un área local.

                ### Negociación financiera
                Esta habilidad proporciona una bonificación de situación al hacer tratos, regatear o negociar en las finanzas de pequeñas empresas.

                ⊗ **Rango 1, 4, 7, 10 [Arte del trato]** Penalización reducida en -1 paso en el rango uno más un paso adicional en los rangos 4, 7 y 10.
        trained_only: false
        rank_benefits: []
    trained_only: false
  computer-science:
    attribute: INT
    cost: 7
    category: Technical
    url: /skills/computer-science
    localized:
      - en:
          name: Computer Science
          description: |-
            Computers are an integral part of human society, and many alien societies as well, at Progress Level 5 and higher. (For much more information on computers and related material, see Chapter 10: Computers.) Most computers and computer-assisted machines are designed to be user-friendly in routine situations. The broad skill provides a character with a basic understanding of computers and computer systems. (In comparison, the Knowledge—computer operation skill merely gives a character the ability to use a computer effectively, but does not allow any understanding of how the machine does what it does.) The three primary uses for the Computer Science broad skill are information retrieval, computer repair, and programming. These uses are described below.

            > Some computer systems allow users who don't have the broad skill to make skill checks at their base Intelligence score instead of at the untrained score. If such an assist program is installed in a particular piece of equipment, your Gamemaster will let you know.

            ### Information Retrieval
            Most computers are connected to some storehouse of raw data—a large network, a centralized storage system, or the unit’s own drives. Using the Computer Science skill to search for specific information requires a skill check only if that information is protected in some way (user password, encoded data, etc.) or if the information is obscure and hard to locate. In all but the most straightforward of situations, a complex skill check is used to determine the result of a retrieval attempt. The broad skill is useful when a character wants to retrieve information from any unprotected system—but if the system is protected, only programs of Marginal quality and Marginal complexity can be accessed with the broad skill. In order to retrieve information from a protected system of higher quality or greater complexity, the specialty skill hacking is needed. A Critical Failure result on the skill check usually means that safeguards or alarms have been triggered, an unretrievable computer error occurs, or the character makes some other monumental mistake that aborts this computer run.

            ### Computer Repair
            A character with this skill has the ability to fix a damaged computer system, either by replacing defective parts or by rewiring a component or a system to bypass a problem spot. Repairing a computer system is always a complex skill check. For information on how attempts to repair a device are made, see the repair specialty under the Technical Science broad skill (page 89).

            ### Programming
            Computer programs exist to handle almost any task imaginable. Without training in the use of these high-tech tools, the wealth of options and accessories available can be overwhelming to a character trying to employ them. As with information retrieval (above), using Computer Science to navigate and utilize a program almost always involves a complex skill check. A character with just the broad skill can only manipulate the source code of programs of Marginal quality and Marginal complexity. Manipulating programs of better quality and greater complexity requires the programming specialty skill. For more information on how the Computer Science specialty skills are used, see Chapter 10: Computers. Brief descriptions of the specialty skills are given below.
      - es:
          name: Ciencias de la Computación
          description: |-
            Las computadoras son una parte integral de la sociedad humana, y también de muchas sociedades alienígenas, en el nivel de progreso 5 y superior. (Para obtener mucha más información sobre computadoras y material relacionado, consulte el Capítulo 10: Computadoras.) La mayoría de las computadoras y las máquinas asistidas por computadora están diseñadas para ser fáciles de usar en situaciones rutinarias. La habilidad amplia proporciona al personaje una comprensión básica de las computadoras y los sistemas informáticos. (En comparación, la habilidad Conocimiento: operación de computadoras simplemente le da al personaje la capacidad de usar una computadora de manera efectiva, pero no permite ninguna comprensión de cómo la máquina hace lo que hace). Los tres usos principales de la habilidad general de Ciencias de la Computación son la recuperación de información, la reparación de computadoras y la programación. Estos usos se describen a continuación.

            **Nota:** Algunos sistemas informáticos permiten a los usuarios que no tienen las habilidades generales realizar comprobaciones de habilidades con su puntuación de Inteligencia base en lugar de con la puntuación de no entrenado. Si dicho programa de asistencia está instalado en un equipo en particular, su Director de Juego se lo informará.

            **Recuperación de información:** La mayoría de las computadoras están conectadas a algún almacén de datos sin procesar: una red grande, un sistema de almacenamiento centralizado o las propias unidades de disco. Usar la habilidad de Ciencias de la Computación para buscar información específica requiere una prueba de habilidad solo si esa información está protegida de alguna manera (contraseña de usuario, datos codificados, etc.) o si la información es oscura y difícil de localizar. En todas las situaciones, excepto en las más sencillas, se utiliza una prueba de habilidad compleja para determinar el resultado de un intento de recuperación. La habilidad amplia es útil cuando un personaje quiere recuperar información de cualquier sistema desprotegido, pero si el sistema está protegido, sólo se puede acceder a programas de calidad y complejidad marginales con la habilidad amplia. Para recuperar información de un sistema protegido de mayor calidad o mayor complejidad, se necesita la habilidad especializada de piratería. Un resultado de Fallo Crítico en la prueba de habilidad normalmente significa que se han activado salvaguardas o alarmas, que se produce un error informático irreparable o que el personaje comete algún otro error monumental que aborta el funcionamiento de este ordenador.

            **Reparación de computadoras:** Un personaje con esta habilidad tiene la capacidad de reparar un sistema informático dañado, ya sea reemplazando piezas defectuosas o reconectando un componente o un sistema para evitar un punto problemático. Reparar un sistema informático es siempre una prueba de habilidad compleja. Para obtener información sobre cómo se realizan los intentos de reparar un dispositivo, consulte la especialidad de reparación en la habilidad amplia de Ciencias técnicas (página 89).

            **Programación:** Existen programas informáticos para realizar casi cualquier tarea imaginable. Sin formación en el uso de estas herramientas de alta tecnología, la gran cantidad de opciones y accesorios disponibles puede resultar abrumadora para un personaje que intente emplearlas. Al igual que con la recuperación de información (arriba), el uso de la informática para navegar y utilizar un programa casi siempre implica una verificación de habilidades compleja. Un personaje con sólo la habilidad amplia sólo puede manipular el código fuente de programas de calidad Marginal y complejidad Marginal. Manipular programas de mejor calidad y mayor complejidad requiere la habilidad de especialidad en programación. Para obtener más información sobre cómo se utilizan las habilidades de especialidad en Ciencias de la Computación, consulte el Capítulo 10: Computadoras. A continuación se proporcionan breves descripciones de las habilidades especializadas.
    items:
      hacking:
        attribute: INT
        cost: 4
        url: /skills/computer-science#hacking
        localized:
          - en:
              name: Hacking
              description: |-
                Hacking is the ability to break computer codes and bypass computer security for the purposes of gaining access to restricted data or secure computer systems. Hacking can be performed at a computer station that’s physically connected to the data stores in question, or it can be performed from a distant location by creating a link via a network of some kind. It's most often used to retrieve secured data, to enter and take control of a computer system, or to perform some type of sabotage such as erasing files or introducing a virus of some kind. This specialty skill allows a character equipped with a computer to perform the previously mentioned tasks. The character's own skill and any programs being used can help the character navigate computer systems, overcome security, and even defend against other operators hooked into a system.

                ▶ Rank 4, 8, 12 [Increased Effect]: As a character gains ranks in this specialty skill, his ability to perform actions related to hacking improves. This is reflected by a **-1 situation die bonus at rank 4**, a **-2 bonus at rank 8**, and a **-3 bonus at rank 12**.
          - es:
              name: Hacking
              description: |-
                La piratería es la capacidad de descifrar códigos informáticos y eludir la seguridad informática con el fin de obtener acceso a datos restringidos o sistemas informáticos seguros. El hackeo se puede realizar en una estación de computadora que esté físicamente conectada a los almacenes de datos en cuestión, o se puede realizar desde una ubicación distante creando un vínculo a través de una red de algún tipo. Se utiliza con mayor frecuencia para recuperar datos seguros, para ingresar y tomar el control de un sistema informático o para realizar algún tipo de sabotaje, como borrar archivos o introducir algún tipo de virus. Esta habilidad especial permite a un personaje equipado con una computadora realizar las tareas mencionadas anteriormente. La propia habilidad del personaje y cualquier programa que se utilice pueden ayudarlo a navegar por los sistemas informáticos, superar la seguridad e incluso defenderse de otros operadores conectados a un sistema.

                ▶ Rango 4, 8, 12 [Efecto aumentado]: A medida que un personaje gana rangos en esta habilidad especializada, mejora su capacidad para realizar acciones relacionadas con la piratería. Esto se refleja en una **bonificación de dado de situación de -1 en el rango 4**, una bonificación de **-2 en el rango 8** y una bonificación de **-3 en el rango 12**.
        trained_only: true
      hardware:
        attribute: INT
        cost: 3
        url: /skills/computer-science#hardware
        localized:
          - en:
              name: Hardware
              description: |-
                This specialty represents a character's knowledge of and proficiency with the physical components that make up a computer. Understanding how a computer system works, being able to set one up quickly, designing and building your own computer, and repairing computer equipment are some of the tasks covered by this skill.

                ▶ Rank 4, 8, 12 [Increased Effect]: As a character gains ranks in this specialty skill, his ability to repair computer systems and work with computer hardware in other ways improves. This is reflected by a **-1 situation die bonus at rank 4**, a **-2 bonus at rank 8**, and a **-3 bonus at rank 12**.
          - es:
              name: Hardware
              description: |-
                Esta especialidad representa el conocimiento y la competencia de un personaje con los componentes físicos que componen una computadora. Comprender cómo funciona un sistema informático, poder configurar uno rápidamente, diseñar y construir su propia computadora y reparar equipos informáticos son algunas de las tareas que cubre esta habilidad.

                ▶ Rango 4, 8, 12 [Efecto aumentado]: A medida que un personaje gana rangos en esta habilidad especializada, mejora su capacidad para reparar sistemas informáticos y trabajar con hardware informático de otras maneras. Esto se refleja en una **bonificación de dado de situación de -1 en el rango 4**, una bonificación de **-2 en el rango 8** y una bonificación de **-3 en el rango 12**.
        trained_only: false
      programming:
        attribute: INT
        cost: 3
        url: /skills/computer-science#programming
        localized:
          - en:
              name: Programming
              description: |-
                This specialty skill enables a character to improve her ability to analyze computer programs, modify existing programs, and (at higher ranks) create programs by writing her own code. Having rank 1 in this skill enables a character to modify the source code of programs of Ordinary quality and Ordinary complexity.

                **Rank 3, 6 [Modify/Enhance Programs]** A character with rank 3 in this skill is able to modify the code of existing programs of Good quality and Good complexity. When the character achieves rank 6, she can modify any existing program.

                **Rank 3, 6, 9, 12 [Create Programs]:** A character with rank 3 in this skill is able to create new programs of Marginal quality and Marginal complexity. Ordinary programs can be created at rank 6, Good programs at rank 9, and Amazing programs at rank 12.
          - es:
              name: Programación
              description: |-
                Esta habilidad especializada permite a un personaje mejorar su capacidad para analizar programas de computadora, modificar programas existentes y (en rangos superiores) crear programas escribiendo su propio código. Tener el rango 1 en esta habilidad permite a un personaje modificar el código fuente de programas de calidad y complejidad ordinarias.

                Modificar programas existentes: un personaje con rango 3 en esta habilidad puede modificar el código de programas existentes de buena calidad y buena complejidad. Cuando el personaje alcanza el rango 6, puede modificar cualquier programa existente.

                Crear nuevos programas: un personaje con rango 3 en esta habilidad puede crear nuevos programas de calidad marginal y complejidad marginal. Se pueden crear programas ordinarios en el rango 6, programas buenos en el rango 9 y programas increíbles en el rango 12.
        trained_only: false
    trained_only: false
  covert-ops:
    attribute: DEX
    cost: 8
    category: Social
    url: /skills/covert-ops
    localized:
      - en:
          name: Covert Ops
          description: |-
            The **Covert Ops** broad skill focuses on remaining undetected. It consolidates the arts of stealth with the practical skills needed to blend in, conceal items, or pick pockets.
      - es:
          name: Operaciones Encubiertas
          description: |-
            La habilidad amplia **Operaciones encubiertas** se centra en permanecer sin ser detectado. Consolida las artes del sigilo con las habilidades prácticas necesarias para camuflarse, ocultar objetos o robar bolsillos.
    items:
      conceal:
        attribute: DEX
        cost: 3
        url: /skills/covert-ops#conceal
        localized:
          - en:
              name: Conceal
              description: |-
                This specialty skill represents the ability to hide objects from view or sensors. While **Stealth** is used to hide oneself, **Conceal** is used to hide items, such as weapons on one's person, contraband in a vehicle, or secret compartments.

                ### Results
                The degree of success on a Conceal check provides a penalty to an observer's **Awareness-Perception** or **Investigate-Search** check:
                - **Ordinary:** +1 penalty to observer
                - **Good:** +2 penalty to observer
                - **Amazing:** +3 penalty to observer

                ### Hiding Weapons
                A concealed weapon is worn where it is not subject to easy spotting (small of the back, inside the forearm, etc.). This is limited to small handguns or blades. Concealment provides a **+2 penalty** to all but the most intrusive physical searches.
          - es:
              name: Ocultar
              description: |-
                Esta habilidad especial representa la capacidad de ocultar objetos de la vista o de los sensores. Mientras que **Stealth** se usa para esconderse, **Ocultar** se usa para ocultar elementos, como armas en la persona, contrabando en un vehículo o compartimentos secretos.

                ### Resultados
                El grado de éxito en una prueba de Ocultar proporciona una penalización a la prueba de **Conciencia-Percepción** o **Investigar-Buscar** de un observador:
                - **Ordinario:** Penalización +1 al observador
                - **Bueno:** Penalización +2 al observador
                - **Increíble:** Penalización +3 al observador

                ### Esconder armas
                Un arma oculta se usa donde no es fácil de detectar (parte baja de la espalda, dentro del antebrazo, etc.). Esto se limita a pistolas o cuchillas pequeñas. El ocultamiento proporciona una **penalización de +2** para todas las búsquedas físicas excepto las más intrusivas.
        trained_only: false
      disguise:
        attribute: CHA
        cost: 3
        url: /skills/covert-ops#disguise
        localized:
          - en:
              name: Disguise
              description: |-
                Disguise is the ability to change your appearance to look like someone else or blend into a crowd. This covers immediate, practical applications like changing clothes, wearing a wig, or using simple props. A character’s Disguise situation die is modified by the observer's **Awareness-Perception** modifier.

                ▶ **Rank 4, 8, 12 [Improved Disguise]:** You gain a bonus to all disguise attempts: -1 step at Rank 4, -2 at Rank 8, and -3 at Rank 12.
          - es:
              name: Disfraz
              description: |-
                El disfraz es la capacidad de cambiar tu apariencia para parecerte a otra persona o mezclarte con una multitud. Esto cubre aplicaciones prácticas e inmediatas como cambiarse de ropa, usar una peluca o utilizar accesorios sencillos. El dado de situación de Disfraz de un personaje es modificado por el modificador **Conciencia-Percepción** del observador.

                ▶ **Rango 4, 8, 12 [Disfraz mejorado]:** Obtienes una bonificación en todos los intentos de disfrazarte: -1 paso en el rango 4, -2 en el rango 8 y -3 en el rango 12.
        trained_only: false
        rank_benefits:
          - rank: 4
            title: Improved Disguise
          - rank: 8
            title: Improved Disguise
          - rank: 12
            title: Improved Disguise
      pickpocket:
        attribute: DEX
        cost: 3
        url: /skills/covert-ops#pickpocket
        localized:
          - en:
              name: Pickpocket
              description: |-
                This skill allows a character to remove or plant objects on a person undetected. The base situation die is determined by the target's **Will** resistance modifier.

                ### Pickpocket Situation Modifiers
                | Condition | Modifier |
                | :--- | :--- |
                | Object is in direct contact with target's skin | +3 |
                | Object is heavy | +2 |
                | Object is kept in an inner pocket | +1 |
                | Object is light in weight | -1 |
                | Object is kept in an exposed pocket or pack | -1 |
                | Victim is distracted | -1 to -3 |

                ### Results
                - **Failure / Critical Failure:** The attempt fails and the pickpocket is noticed.
                - **Ordinary:** The attempt succeeds.
                - **Good / Amazing:** The attempt succeeds and may offset penalties for repeated attempts against the same target.

                ### Rank Benefits
                ⊗ **Rank 3, 6, 9, 12 [It Takes One to Know One]:** Your **Will** resistance modifier (specifically for spotting pickpocket attempts) improves: +1 penalty to the foe at Rank 3, +2 steps at Rank 6, +3 steps at Rank 9, and +4 steps at Rank 12.
          - es:
              name: Abrir Cerraduras
              description: |-
                Esta habilidad permite a un personaje quitar o colocar objetos sobre una persona sin ser detectado. El dado de situación base está determinado por el modificador de resistencia **Voluntad** del objetivo.

                ### Modificadores de situación de carterista
                | Condición | Modificador |
                | :--- | :--- |
                | El objeto está en contacto directo con la piel del objetivo | +3 |
                | El objeto es pesado | +2 |
                | El objeto se guarda en un bolsillo interior | +1 |
                | El objeto es liviano | -1 |
                | El objeto se guarda en un bolsillo o mochila expuesta | -1 |
                | La víctima está distraída | -1 a -3 |

                ### Resultados
                - **Fallo/Fallo Crítico:** El intento falla y se advierte al carterista.
                - **Ordinario:** El intento tiene éxito.
                - **Bueno / Increíble:** El intento tiene éxito y puede compensar las penalizaciones por intentos repetidos contra el mismo objetivo.

                ### Beneficios de rango
                ⊗ **Rango 3, 6, 9, 12 [Se necesita uno para conocer uno]:** Tu modificador de resistencia de **Voluntad** (específicamente para detectar intentos de carterista) mejora: +1 penalización al enemigo en el rango 3, +2 pasos en el rango 6, +3 pasos en el rango 9 y +4 pasos en el rango 12.
        trained_only: false
        rank_benefits:
          - rank: 3
            title: It Takes One to Know One
          - rank: 6
            title: It Takes One to Know One
          - rank: 9
            title: It Takes One to Know One
          - rank: 12
            title: It Takes One to Know One
      stealth:
        attribute: DEX
        cost: 3
        url: /skills/covert-ops#stealth
        localized:
          - en:
              name: Stealth
              description: |-
                Stealth merges the techniques of hiding, sneaking, and shadowing. It is the art of remaining undetected while stationary or in motion.

                ▶ **Rank 3 [Sneak Attack]:** If you successfully move adjacent to an opponent undetected while **sneaking**, you receive a **-2 step bonus** to your next melee attack. Even if other enemies detect you, they cannot alert your target in time to avoid the sneak attack unless they have special means.

                ▶ **Rank 4, 8, 12 [Improved Stealth]:** You gain a bonus to all stealth attempts: -1 step at Rank 4, -2 at Rank 8, and -3 at Rank 12.

                ### Hide (Stationary)
                The ability to stay unnoticed by staying quiet and using cover or darkness.

                #### Results
                - **Critical Failure:** You make noise or otherwise call attention to yourself.
                - **Failure:** Anyone in the area can make **Awareness-Perception** or **Investigate-Search** checks to see you.
                - **Ordinary or Better:** Observers only get a check if they are actively searching or on guard duty. The penalty to their check is: Ordinary (+1), Good (+2), Amazing (+3).

                ### Sneak (In Motion)
                The ability to move undetected. Moving at more than half speed imposes a **+2 penalty** to the check.

                #### Results
                - **Critical Failure:** You make noise or call attention to yourself.
                - **Failure:** Anyone in the area can make an **Awareness-Perception** check to detect you.
                - **Ordinary or Better:** Observers may attempt an **Awareness-Perception** check with a penalty based on your success: Ordinary (+1), Good (+2), Amazing (+3).

                ### Shadow (Tailing)
                The ability to tail a target or group through crowds. You feign indifference and adjust your clothing without losing your mark.

                #### Results
                - **Critical Failure:** One or more targets notice you immediately; your cover is blown.
                - **Failure:** The targets grow suspicious. Proceed to the **Detection Protocol**.
                - **Ordinary or Better:** Targets may attempt **Awareness-Intuition** checks to sense they are being followed. The penalty to their check is: Ordinary (+1), Good (+2), Amazing (+3). If any target succeeds, proceed to the **Detection Protocol**.

                #### Detection Protocol
                Each member in a position to see you makes an **Awareness-Perception** check (applying penalties from the Shadow result).
                - **If spotted:** Your cover is blown.
                - **If unspotted:** You may attempt a **new check** to resume shadowing, but this recovery check incurs a **+3 step penalty**.
          - es:
              name: Carterear
              description: |-
                Stealth combina las técnicas de esconderse, escabullirse y seguir. Es el arte de pasar desapercibido mientras está parado o en movimiento.

                ▶ **Rango 3 (Ataque furtivo):** Si te mueves con éxito junto a un oponente sin ser detectado mientras **escapas**, recibes una **bonificación de -2 pasos** para tu próximo ataque cuerpo a cuerpo. Incluso si otros enemigos te detectan, no pueden alertar a tu objetivo a tiempo para evitar el ataque furtivo a menos que tengan medios especiales.

                ▶ **Rango 4, 8, 12 [Sigilo mejorado]:** Obtienes una bonificación a todos los intentos de sigilo: -1 paso en el rango 4, -2 en el rango 8 y -3 en el rango 12.

                ### Ocultar (estacionario)
                La capacidad de pasar desapercibido permaneciendo en silencio y a cubierto o en la oscuridad.

                #### Resultados
                - **Fallo crítico:** Haces ruido o llamas la atención de alguna otra manera.
                - **Fallo:** Cualquier persona en el área puede realizar controles de **Conciencia-Percepción** o **Investigar-Buscar** para verte.
                - **Ordinario o mejor:** Los observadores solo reciben un control si están buscando activamente o haciendo guardia. La penalización a su cheque es: Ordinario (+1), Bueno (+2), Sorprendente (+3).

                ### Furtivo (en movimiento)
                La capacidad de moverse sin ser detectado. Moverse a más de la mitad de la velocidad impone una **penalización+2** a la prueba.

                #### Resultados
                - **Fallo Crítico:** Haces ruido o llamas la atención sobre ti mismo.
                - **Fallo:** Cualquier persona en el área puede realizar una prueba de **Conciencia-Percepción** para detectarte.
                - **Ordinario o mejor:** Los observadores pueden intentar una prueba de **Conciencia-Percepción** con una penalización basada en tu éxito: Ordinario (+1), Bueno (+2), Asombroso (+3).

                ### Sombra (cola)
                La capacidad de seguir a un objetivo o grupo a través de la multitud. Finges indiferencia y ajustas tu vestimenta sin perder la marca.

                #### Resultados
                - **Fallo crítico:** Uno o más objetivos te notan inmediatamente; Tu tapadera está descubierta.
                - **Fallo:** Los objetivos se vuelven sospechosos. Continúe con el **Protocolo de detección**.
                - **Ordinario o mejor:** Los objetivos pueden intentar pruebas de **Conciencia-Intuición** para sentir que los están siguiendo. La penalización a su cheque es: Ordinario (+1), Bueno (+2), Sorprendente (+3). Si algún objetivo tiene éxito, continúe con el **Protocolo de detección**.

                #### Protocolo de detección
                Cada miembro que esté en condiciones de verte realiza una prueba de **Conciencia-Percepción** (aplicando penalizaciones por el resultado de la Sombra).
                - **Si te descubren:** Tu tapadera ha sido descubierta.
                - **Si no está manchado:** Puedes intentar una **nueva prueba** para reanudar el seguimiento, pero esta prueba de recuperación incurre en una **penalización de +3 pasos**.
        trained_only: false
        rank_benefits:
          - rank: 3
            title: Sneak Attack
          - rank: 4
            title: Improved Stealth
          - rank: 8
            title: Improved Stealth
          - rank: 12
            title: Improved Stealth
    trained_only: false
  creativity:
    attribute: WIL
    cost: 6
    category: Other
    url: /skills/creativity
    localized:
      - en:
          name: Creativity
          description: |-
            This skill provides a character with training and talent (or knowledge) in a variety of creative endeavors. A character with the Creativity skill has a well-developed sense for the aesthetically pleasing, a facility for communicating with the written word, and the ability to convey and evoke powerful emotions through a chosen medium.

            A character with just the broad skill possesses all of these characteristics, but not to such a degree that he’s able to make a living as an artist, writer, or photographer. Turning the Creativity skill into the basis of a career (or being able to produce work of professional quality, if a character has another career) requires that the character pursue a specialty skill in his chosen field(s).

            ### Creative Synergy
            Creativity can be used as a support check to enhance other skills by providing unique solutions, emotional depth, or unorthodox methods. Possible uses are, but are not limited to the follow:
            - **Creativity + Inspire (Leadership):** Use a creative medium (speech, song, manifesto) to stir followers. A successful check adds a step bonus to the **Inspire** check (-1 for Ordinary, -2 for Good, -3 for Amazing).
            - **Creativity + Invention (Technical Science):** Use lateral thinking to find elegant shortcuts in design. A successful check reduces the successes required for an **Invention** complex check (-1 for Ordinary, -2 for Good, -3 for Amazing).
            - **Creativity + Deception (Bluff/Seduce):** Weave a rich, emotionally resonant narrative. On a successful support check, the target’s **Intelligence or Will resistance modifier** is reduced by 1 step.

            _The Gamemaster has the last word on which specialty skill provide synergy on a particular task_

            ### Using Creativity (Production)
            Creating a work of art or literature involves a **complex skill check**.
            - **Situation Modifiers:** Based on conditions (materials, inspiration, distractions).
            - **Complexity (Successes Required):** Ordinary (2), Good (4-6), Amazing (8+).
            - **Project Failure:** If the check ends in a **Critical Failure** or **three Failure results**, the project is scrapped.
      - es:
          name: Creatividad
          description: |-
            Esta habilidad proporciona al personaje formación y talento (o conocimiento) en una variedad de esfuerzos creativos. Un personaje con la habilidad Creatividad tiene un sentido bien desarrollado para lo estéticamente agradable, facilidad para comunicarse con la palabra escrita y la capacidad de transmitir y evocar emociones poderosas a través del medio elegido.

            Un personaje con habilidades generales posee todas estas características, pero no hasta el punto de poder ganarse la vida como artista, escritor o fotógrafo. Convertir la habilidad de Creatividad en la base de una carrera (o ser capaz de producir un trabajo de calidad profesional, si un personaje tiene otra carrera) requiere que el personaje persiga una habilidad especializada en el campo elegido.

            ### Sinergia creativa
            La creatividad se puede utilizar como prueba de apoyo para mejorar otras habilidades proporcionando soluciones únicas, profundidad emocional o métodos poco ortodoxos. Los usos posibles son, entre otros, los siguientes:
            - **Creatividad + Inspiración (Liderazgo):** Utilice un medio creativo (discurso, canción, manifiesto) para conmover a los seguidores. Una prueba exitosa añade una bonificación de paso a la prueba de **Inspirar** (-1 para Ordinario, -2 para Bueno, -3 para Increíble).
            - **Creatividad + Invención (Ciencias Técnicas):** Utilice el pensamiento lateral para encontrar atajos elegantes en el diseño. Una prueba exitosa reduce los éxitos necesarios para una prueba compleja de **Invención** (-1 para Ordinario, -2 para Bueno, -3 para Increíble).
            - **Creatividad + Engaño (Mentir/Seducir):** Teje una narrativa rica y con resonancia emocional. Tras una prueba de apoyo exitosa, el **modificador de resistencia a la inteligencia o la voluntad** del objetivo se reduce en 1 paso.

            _El Director de Juego tiene la última palabra sobre qué habilidad especial proporciona sinergia en una tarea en particular_

            ### Usando la creatividad (producción)
            Crear una obra de arte o literatura implica una **comprobación de habilidad compleja**.
            - **Modificadores de situación:** Basado en condiciones (materiales, inspiración, distracciones).
            - **Complejidad (Éxitos Requeridos):** Ordinario (2), Bueno (4-6), Increíble (8+).
            - **Falla del proyecto:** Si la verificación finaliza con una **Falla crítica** o **tres resultados de falla**, el proyecto se descarta.
    items:
      creativity-specific-skill:
        attribute: WIL
        cost: 3
        url: /skills/creativity#creativity-specific-skill
        localized:
          - en:
              name: Creativity, Specific Skill
              description: |-
                A blank line is provided under the Creativity skill on the character sheet for a player to use if his character specializes in some aspect of this skill. The Gamemaster will determine if a certain specialty skill is allowable, usually based on whether it defines a narrow enough field of interest. For instance, illustration might be allowed as a Creativity specialty, or it might be necessary for a character to be more specific by singling out computer graphics or holo art as his area of expertise.
          - es:
