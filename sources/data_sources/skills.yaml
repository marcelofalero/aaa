  modern-ranged-weapons:
    attribute: DEX
    cost: 6
    category: Combat
    url: /skills/modern-ranged-weapons
    localized:
    - en:
        name: Modern Ranged Weapons
        description: |-
          This broad skill provides a character with training in the use of modern ranged weapons. This skill covers pistols, rifles, shotguns, and submachine guns of all types, including projectile and energy weapons. All modern weapons have ammunition clips. To change a clip during a combat scene, a character must use an available action. If he wants to change a clip and shoot in the same phase, a +2 penalty applies to the attack action. Other factors that can influence the situation die used in a modern ranged weapon attack are listed under **Ranged Weapon Attack Modifiers** on this page.
          **Weapon Technical Knowledge**: Characters who train seriously with firearms — whether soldiers, mercenaries, or dedicated enthusiasts — inevitably absorb a working technical understanding of their weapons. They learn how their weapons function internally, what can go wrong, how to prevent it, and how to fix it in the field. As well as keep informed of what the market has to offer. A character with the
          **Technical Science** broad skill can use the appropriate Modern Ranged Weapons specialty skill for checks that involve knowing the existence of a particular weapon, customizing weapons and ammo, as well as recognizing, repairing, and maintaining weapons in the field.
          ### Ranged Weapon Attack Modifiers
          When a character uses any ranged weapon, either primitive or modern, a number of factors must be considered to determine the situation die for the skill check:
          - The base situation die of the weapon (either +4 for a broad skill or +0 for a specialty).
          - The weapon''s range modifier (see **TABLE P22: RANGE MODIFIERS BY WEAPON TYPE** below).
          - Any modifier for a target''s Dexterity resistance (–1 step bonus for DEX 11–12, –2 steps for DEX 13–14, –3 steps for DEX 15–16, –4 steps for DEX 17–18, and –5 steps for DEX 19 or higher).
          #### TABLE: COMMON RANGED ATTACK MODIFIERS
          | Condition | Modifier | Weapon Types | Note | | :--- | :--- | :--- | :--- | | **Zero Range** (0–1m) | **-3 steps** | Pistol, SMG, Shotgun | Weapons must be short enough to tuck into a grapple. | | **Point Blank** (1–4m) | **-1 step** | All | See Specialty Rank benefits for improvements. | | **In a Melee Struggle** | **+1 step** | All | Canceled by **Melee Combat** Broad Skill training. | | **Moving & Shooting** | **+1 step** | All | For firing while running or moving fast. | | **Changing Clips** | **+2 steps** | All | To change a clip and fire in the same phase. |
          #### TABLE P22: RANGE MODIFIERS BY WEAPON TYPE
          | Weapon | Short | Medium | Long | | :--- | :--- | :--- | :--- | | Submachine gun | -1 step | +1 step | +2 steps | | Pistol | -1 step | +1 step | +2 steps | | Rifle | -1 step | None | +1 step |
    - es:
        name: Armas a distancia modernas
        description: |-
          Esta habilidad amplia proporciona a un personaje entrenamiento en el uso de armas a distancia modernas. Esta habilidad cubre pistolas, fusiles, escopetas y subfusiles de todos los tipos, incluyendo armas de proyectiles y de energía. Todas las armas modernas tienen cargadores de munición. Para cambiar un cargador durante una escena de combate, un personaje debe usar una acción disponible. Si quiere cambiar el cargador y disparar en el mismo asalto (fase), se aplica una penalización de +2 pasos a la acción de ataque. Otros factores que pueden influir en el dado de situación utilizado en un ataque CON armas modernas a distancia se detallan bajo
          **Modificadores de ataque de armas a distancia** en esta página.
          **Conocimiento técnico de armas**: Los personajes que se entrenan seriamente CON armas de fuego — ya sean soldados, mercenarios o entusiastas dedicados — inevitablemente absorben una comprensión técnica funcional de sus armas. Aprenden cómo funcionan internamente, qué puede fallar, cómo prevenirlo y cómo repararlo en el campo. Así como mantenerse informados de lo que el mercado tiene para ofrecer. Un personaje CON la habilidad amplia de **Ciencia técnica** puede usar la habilidad de especialidad de Armas a distancia modernas apropiada para las tiradas que impliquen conocer la existencia de un arma concreta, personalizar armas y munición, así como reconocer, reparar y mantener armas en el campo.
          ### Modificadores de ataque de armas a distancia
          Cuando un personaje usa cualquier arma a distancia, ya sea primitiva o moderna, se deben considerar varios factores para determinar el dado de situación de la tirada de habilidad:
          - El dado de situación base del arma (+4 para la habilidad amplia o +0 para la especialidad).
          - El modificador de distancia del arma (véase la **TABLA P22: MODIFICADORES DE DISTANCIA POR TIPO DE ARMA** abajo).
          - Cualquier modificador por la resistencia de Destreza del objetivo (bonificación de –1 paso para DES 11–12, –2 pasos para DES 13–14, –3 pasos para DES 15–16, –4 pasos para DES 17–18 y –5 pasos para DES 19 o más).
          #### TABLA: MODIFICADORES COMUNES DE ATAQUE A DISTANCIA
          | Condición | Modificador | Tipos de Arma | Nota | | :--- | :--- | :--- | :--- | | **Alcance Cero** (0–1m) | **-3 pasos** | Pistola, Subfusil, Escopeta | El arma debe ser lo suficientemente corta para un forcejeo. | | **A bocajarro** (1–4m) | **-1 paso** | Todas | Véase beneficios de rango de especialidad para mejoras. | | **En lucha cuerpo a cuerpo** | **+1 paso** | Todas | Cancelado por el entrenamiento de la habilidad de **Combate cuerpo a cuerpo**. | | **En movimiento** | **+1 paso** | Todas | Para disparar mientras se corre o se mueve rápido. | | **Cambiar cargador** | **+2 pasos** | Todas | Para cambiar el cargador y disparar en la misma fase. |
          #### TABLA P22: MODIFICADORES DE DISTANCIA POR TIPO DE ARMA
          | Arma | Corta | Media | Larga | | :--- | :--- | :--- | :--- | | Subfusil | -1 paso | +1 paso | +2 pasos | | Pistola | -1 paso | +1 paso | +2 pasos | | Fusil | -1 paso | Nada | +1 paso |
          # Habilidades de especialidad
    items:
