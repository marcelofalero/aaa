        attribute: WIL
        cost: 3
        url: /skills/navigation#navigationsurface
        localized:
          - en:
              name: Navigation—surface
              description: |-
                This specialty skill covers navigation in a planetary environment, utilizing maps, terrain features, compasses, and GPS systems to move from one point to another.
                ⊗ **Increased Effect:** A character receives a **-1 bonus** at rank 3, **-2** at rank 6, **-3** at rank 9, and **-4** at rank 12 on Navigation—surface checks when using maps and navigation sensors.
          - es:
              name: Navigation—surface
              description: |-
                Esta habilidad especializada cubre la navegación en un entorno planetario, utilizando mapas, características del terreno, brújulas y sistemas GPS para moverse de un punto a otro.
                ⊗ **Efecto aumentado:** Un personaje recibe una bonificación **-1** en el rango 3, **-2** en el rango 6, **-3** en el rango 9 y **-4** en el rango 12 en Navegación: comprobaciones de superficie al usar mapas y sensores de navegación.
