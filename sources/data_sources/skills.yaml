items:
  acrobatics:
    attribute: DEX
    cost: 7
    category: Other
    url: /skills/acrobatics
    localized:
    - en:
        name: Acrobatics
        description: "This broad skill provides a character with basic training in acrobatics. It is used when a character wants to vault over a fence or other obstacle, dodge out of the way of an immediate danger, or try to land safely after a fall.\n\n### Vaulting\n\nVaulting is a vertical leap enhanced by assistance (springing off an object or using a pole). A character may use either Athletics—jump or Acrobatics.\n\n- **Both skills:** Increase distance by 1 meter.\n- **Using a pole:** Increase distance by 2 meters.\n\n---"
    - es:
        name: Acrobacia
        description: "Esta habilidad amplia proporciona a un personaje entrenamiento básico en acrobacias. Se utiliza cuando un personaje desea saltar por encima de una valla u otro obstáculo, esquivar un peligro inmediato o tratar de aterrizar de forma segura después de una caída.\n\n### Saltos (Vaulting)\n\nSaltar es un salto vertical mejorado por asistencia (impulsarse en un objeto o usar una pértiga). Un personaje puede usar tanto **Atletismo—saltar** como **Acrobacia**.\n\n- **Ambas habilidades:** Aumentan la distancia en 1 metro.\n- **Usando una pértiga:** Aumenta la distancia en 2 metros.\n\n---\n\n# Habilidades de Especialidad"
    items:
      aerobatics:
        attribute: DEX
        cost: 3
        url: /skills/acrobatics#aerobatics
        localized:
        - en:
            name: Aerobatics
            description: "This specialty skill represents a character's mastery of complex maneuvers during personal flight, whether through natural wings, specialized jump-packs, or gravitic personal flight devices (GADS). While basic locomotion is covered by the Acrobatics broad skill, Aerobatics is required for high-speed turns, precise landing, evasive maneuvers, and aerial acrobatics. At **Rank 4** in **Armor Operation—Propulsion Systems**, this skill can also be used for complex maneuvers using a powered suit's integrated thrusters.\n\n**Note:** This skill covers *personal* locomotion and complex maneuvers. Operating a larger vehicle through the air or space requires [Vehicle Operation—air](/skills/vehicle-operation/#air-vehicle) or [Vehicle Operation—space](/skills/vehicle-operation/#space-vehicle).\n\n### Results\n\n- **Critical Failure:** Loss of control, potential stall or collision.\n- **Ordinary:** Basic controlled flight; can perform simple maneuvers.\n- **Good:** Increased\
              \ control; can perform evasive maneuvers.\n- **Amazing:** Perfect control; can perform complex aerial or orbital acrobatics.\n\n### Rank Progression\n\n⊗ **Rank 4 (Stealthy Descent):** When using a jump-pack or GADS, the character can descend with minimal noise, receiving a **-2 step bonus** to Stealth checks.\n\n⊗ **Rank 6 (Endurance Flight):** When using natural or cybernetic wings, the character can fly for extended periods, receiving a **-2 step bonus** to Stamina checks for long-distance travel."
        - es:
            name: Acrobacia aérea
            description: "Esta habilidad de especialidad permite a un personaje usar acrobacias como defensa en situaciones de combate. También se usa cuando un personaje se lanza a cubierto o se tira al suelo cuando un ataque de área lo tiene como objetivo. Esquivar permite a un personaje dar volteretas, rodar, agacharse, lanzarse o saltar para apartarse de un ataque.\n\nSe realiza una comprobación de habilidad (que requiere una acción) al comienzo de la primera fase en la que el personaje puede actuar. El resultado dura para todas las fases subsiguientes del asalto. Cualquier acción adicional realizada en el asalto recibe una penalización de +1.\n\n### Ajustes a los Modificadores de Resistencia de Fuerza / Destreza\n- **Fallo Crítico:** -2 pasos\n- **Fallo:** ninguno\n- **Ordinario:** +1 paso\n- **Bueno:** +2 pasos\n- **Asombroso:** +3 pasos\n\n### Progresión de Rango\n▶ **Rango 3 [Beneficio de Acción]:** Esquivar y realizar una acción en la misma fase (+2 de penalización en la acción),\
              \ esto solo consume 1 de las acciones del personaje.\n⊗ **Rango 4, 8, 12 [Modificador de Resistencia]:** El modificador de resistencia de Destreza del personaje mejora en **+1** en cada uno de estos rangos.\n▶ **Rango 7 [Esquiva de Reacción]:** Realizar una esquiva de reacción, permitiendo al personaje defenderse antes en el asalto. En un asalto en el que un personaje realiza una esquiva de reacción, solo puede esquivar; todas las demás acciones se pierden para el asalto.\n\n---"
      daredevil:
        attribute: DEX
        cost: 3
        url: /skills/acrobatics#daredevil
        localized:
        - en:
            name: Daredevil
            description: "This specialty skill enables a character to perform high-risk activities such as skydiving, scuba diving, hang gliding, surfing, bungee jumping, and whitewater rafting.\n\n**Results**\n\n- **Critical Failure:** The action fails and the character could suffer stun or wound damage (equipment failure).\n- **Failure:** The action doesn't succeed, but the character does not necessarily suffer damage (e.g., landing off course).\n- **Ordinary:** The character performs the action but with minimal control.\n- **Good:** The character has limited control and executes the action well.\n- **Amazing:** Everything goes right; the action is executed perfectly without damage.\n\n---"
        - es:
            name: Temerario
            description: "Esta habilidad de especialidad permite a un personaje mejorar su capacidad para sobrevivir a una caída girando su cuerpo, agarrando protuberancias cercanas o frenando de otra manera su descenso, disminuyendo así el daño que sufre por un impacto.\n\nUn personaje CON la especialidad de caída suma su rango en la especialidad a su puntuación de **Acrobacia** y usa ese número para realizar la comprobación de habilidad, CON un dado de situación base de +d0.\n\n---"
      dodge:
        attribute: DEX
        cost: 3
        url: /skills/acrobatics#dodge
        localized:
        - en:
            name: Dodge
            description: "This specialty skill allows a character to use acrobatics as a defense in combat situations. It's also used when a character dives for cover or hits the deck when an area-effect attack targets him. Dodge lets a character tumble, roll, duck, dive, or spring out of the way of an attack.\n\nOne skill check (requiring an action) is made at the beginning of the first phase in which the character can act. The result lasts for all subsequent phases in the round. Any additional actions taken in the round receive a +1 penalty.\n\n**Adjustments to Strength/Dexterity Resistance Modifiers**\n\n- **Critical Failure:** -2 steps\n- **Failure:** none\n- **Ordinary:** +1 step\n- **Good:** +2 steps\n- **Amazing:** +3 steps\n\n**Rank Progression**\n▶ **Rank 3 [Action Benefit]:** Dodge and perform an action in the same phase (+2 penalty on the action), this only uses up 1 of the character actions.\n⊗ **Rank 4, 8, 12 [Resistance Modifier]:** The character’s Dexterity resistance modifier\
              \ improves by +1 at each of these ranks.\n▶ **Rank 7 [Reaction Dodge]:** Perform a reaction dodge, allowing the character to defend earlier in the round. In a round when a character makes a reaction dodge, he can only dodge; all other actions are lost for the round.\n\n---"
        - es:
            name: Esquivar
            description: "Esta habilidad de especialidad permite a un personaje realizar actividades de alto riesgo como paracaidismo, submarinismo (buceo), ala delta, surf, puenting y rafting.\n\n### Resultados\n- **Fallo Crítico:** La acción falla y el personaje podría sufrir daño de aturdimiento o herida (fallo del equipo).\n- **Fallo:** La acción no tiene éxito, pero el personaje no necesariamente sufre daño (p. ej., aterrizar fuera de curso).\n- **Ordinario:** El personaje realiza la acción pero CON un control mínimo.\n- **Bueno:** El personaje tiene un control limitado y ejecuta la acción bien.\n- **Asombroso:** Todo sale bien; la acción se ejecuta perfectamente sin daño.\n\n---"
      fall:
        attribute: DEX
        cost: 3
        url: /skills/acrobatics#fall
        localized:
        - en:
            name: Fall
            description: "This specialty skill allows a character to improve his ability to survive a fall by twisting his body, catching nearby protrusions, or otherwise slowing his descent, thereby decreasing the damage he sustains from an impact.\n\nA character with the fall specialty skill adds his rank in the specialty to his Acrobatics score and uses that number to make the skill check, with a +d0 base situation die.\n\n---"
        - es:
            name: Caída
            description: "Un personaje CON la habilidad de entrenamiento en gravedad cero puede funcionar en condiciones de ingravidez o casi ingravidez mejor que alguien que no tenga esta habilidad. Un personaje no entrenado tiene una penalización de **+3 pasos** en gravedad cero y una penalización de **+1 paso** en gravedad ligera. Comprar esta habilidad reduce inmediatamente la penalización de gravedad cero a **+2 pasos** y elimina la penalización por gravedad ligera.\n\n### Progresión de Rango\n⊗ **Rango 4:** La penalización en gravedad cero se reduce a **+1 paso**, y las acciones en gravedad ligera reciben un **bono de -1 paso**.\n⊗ **Rango 7:** Se elimina la penalización en gravedad cero.\n⊗ **Rango 10:** Las acciones físicas en gravedad cero reciben un **bono de -1 paso**. (El bono de gravedad ligera nunca mejora más allá de -1 paso).\n\n**Ventaja Sesheyan:** Los personajes Sesheyan sin la habilidad de entrenamiento en gravedad cero funcionan como si la tuvieran en rango 1. Si un\
              \ Sesheyan compra esta habilidad, las penalizaciones se reducen en 1 paso y los bonos mejoran en la misma cantidad (bono máximo -2 en gravedad ligera).\n\n---"
      zero-g-training:
        attribute: DEX
        cost: 3
        url: /skills/acrobatics#zero-g-training
        localized:
        - en:
            name: Zero-g Training
            description: "A character with the zero-g training skill can function in weightless or near-weightless conditions better than someone who doesn't have this skill. An untrained character has a +3 step penalty in zero gravity and a +1 step penalty in light gravity. Purchasing this skill immediately reduces the zero-g penalty to +2 steps and eliminates the penalty for light gravity.\n\n**Rank Progression**\n⊗ **Rank 4:** Zero-g penalty is reduced to +1 step, and light gravity actions receive a -1 step bonus.\n⊗ **Rank 7:** Zero-g penalty is eliminated.\n⊗ **Rank 10:** Physical actions in zero-g receive a -1 step bonus. (Light gravity bonus never improves beyond -1 step.)\n\n**Sesheyan Advantage**\nSesheyan characters without the zero-g training skill function as though they have it at rank 1. If a sesheyan purchases this skill, penalties are reduced by 1 step and bonuses are improved by the same amount (max bonus -2 in light gravity).\n\n---"
        - es:
            name: Entrenamiento en gravedad cero
            description: "Esta habilidad de especialidad representa la maestría de un personaje en maniobras complejas durante el vuelo personal, ya sea a través de alas naturales, jump-packs especializados o dispositivos de vuelo personal gravíticos (GADS). Mientras que la locomoción básica está cubierta por la habilidad amplia de **Acrobacia**, la Acrobacia Aérea es necesaria para giros a alta velocidad, aterrizajes precisos, maniobras evasivas y acrobacias aéreas. En el **Rango 4** de **Operación de Armadura—Sistemas de Propulsión**, esta habilidad también se puede usar para maniobras complejas utilizando los propulsores integrados de un traje potenciado.\n\n**Nota:** Esta habilidad cubre la locomoción *personal* y maniobras complejas. Operar un vehículo más grande por el aire o el espacio requiere [Operación de Vehículos—aire](/es/skills/vehicle-operation/#vehículo-aéreo) u [Operación de Vehículos—espacial](/es/skills/vehicle-operation/#vehículo-espacial).\n\n### Resultados\n- **Fallo\
              \ Crítico:** Pérdida de control, posible pérdida de sustentación o colisión.\n- **Ordinario:** Vuelo controlado básico; puede realizar maniobras simples.\n- **Bueno:** Control aumentado; puede realizar maniobras evasivas.\n- **Asombroso:** Control perfecto; puede realizar acrobacias aéreas u orbitales complejas.\n\n### Progresión de Rango\n⊗ **Rango 4 (Descenso Sigiloso):** Cuando se usa un jump-pack o GADS, el personaje puede descender CON un ruido mínimo, recibiendo un **bono de -2 pasos** en las comprobaciones de **Sigilo**.\n⊗ **Rango 6 (Vuelo de Resistencia):** Cuando se usan alas naturales o cibernéticas, el personaje puede volar durante períodos prolongados, recibiendo un **bono de -2 pasos** en las comprobaciones de **Aguante (Aguante)** para viajes de larga distancia."
  administration:
    attribute: INT
    cost: 4
    category: Technical
    url: /skills/administration
    localized:
    - en:
        name: Administration
        description: "This broad skill provides a character with knowledge concerning the forms and procedures that go into running an office or organization of almost any kind. With this skill, a character understands scheduling, personnel and equipment management, and the regulations and laws that apply to such endeavors. Any large organizations, including governments, agencies, and corporations, have some type of administrational bureaucracy that a character may someday be called upon to interact with. This skill allows him to attempt to identify the proper administrators to deal with in a particular situation, the proper procedures to follow, and the best way to cut through red tape.\n\nThe Administration skill can be used in an attempt to change the attitude of an individual employee of some corporation or organization. In such a case, it is treated as an [encounter skill](/core-mechanics/characters-in-action/#encounter-scene). If the use of this skill results in a target's attitude\
          \ being changed to Friendly or better, this can provide a bonus on any subsequent skill check to get information or cooperation out of the organization that is the employer of the target.\n\nUsing this skill, or either of its specialties, to get results out of a bureaucratic organization requires a complex skill check. In this case, the situation modifier for conditions relates to how quickly the character using the skill wants to produce results: It's a condition of Amazing difficulty (+3 penalty) if you need an answer in 1 day; Good, you'll settle for d4+1 days; Ordinary, you can afford to wait d4+2 days; Marginal, you're resigned to not getting an answer for d6+3 days.\n\nThe complexity of this skill check relates to the size of the bureaucratic system and the ease with which the system could process the request: Marginal, small system/extremely easy request; Ordinary, medium-sized system/routine request; Good, large system/complex request; Amazing, extremely large system/restricted\
          \ or illegal request. (These two factors can offset one another to some degree; for instance, trying to get an extremely large bureaucracy to process a routine request would be a feat of Good or Ordinary complexity, depending on the Gamemaster's judgment.)\n\nA character's Administration skill can also be used to hinder someone else's attempt to gain information. In such a case, the modifiers for conditions are transposed: It's a task of Amazing difficulty (+3 penalty) to slow down the process for d6+3 days; Good, if you're trying to gum up the works for d4+2 days; Ordinary, d4+1 days; or Marginal, if you only want to cause a delay of 1 day. Likewise, complexity works the other way around: For instance, slowing down an extremely easy request being processed through a small system is a feat of Amazing complexity, requiring a large number of successes in a relatively short time.\n\n---"
    - es:
        name: Administración
        description: "Esta habilidad general proporciona a un personaje el conocimiento de los formularios y procedimientos para dirigir una oficina u organización de casi cualquier tipo. CON esta habilidad, un personaje comprende la programación, la gestión de personal y equipos, y las regulaciones y leyes que se aplican a tales empresas. Cualquier organización grande, incluidos gobiernos, agencias y corporaciones, tiene algún tipo de burocracia administrativa CON la que un personaje puede tener que interactuar algún día. Esta habilidad le permite intentar identificar a los administradores adecuados CON los que tratar en una situación particular, los procedimientos adecuados a seguir y la mejor manera de eliminar la burocracia.\n\nLa habilidad de Administración se puede usar en un intento de cambiar la actitud de un empleado individual de alguna corporación u organización. En tal caso, se trata como una [habilidad de encuentro](/es/core-mechanics/characters-in-action/#encounter-scene).\
          \ Si el uso de esta habilidad da como resultado que la actitud de un objetivo cambie a Amistosa o mejor, esto puede proporcionar una bonificación en cualquier tirada de habilidad posterior para obtener información o cooperación de la organización que es el empleador del objetivo.\n\nUsar esta habilidad, o cualquiera de sus especialidades, para obtener resultados de una organización burocrática requiere una tirada de habilidad compleja. En este caso, el modificador de situación para las condiciones se relaciona CON la rapidez CON la que el personaje que usa la habilidad quiere producir resultados: es una condición de dificultad Asombrosa (penalización de +3) si necesita una respuesta en 1 día; Bueno, se conformará CON d4+1 días; Ordinario, puede permitirse esperar d4+2 días; Marginal, está resignado a no obtener una respuesta durante d6+3 días.\n\nLa complejidad de esta tirada de habilidad se relaciona CON el tamaño del sistema burocrático y la facilidad CON la que el sistema podría\
          \ procesar la solicitud: Marginal, sistema pequeño/solicitud extremadamente fácil; Ordinario, sistema de tamaño mediano/solicitud rutinaria; Bueno, sistema grande/solicitud compleja; Asombroso, sistema extremadamente grande/solicitud restringida o ilegal. (Estos dos factores pueden compensarse hasta cierto punto; por ejemplo, intentar que una burocracia extremadamente grande procese una solicitud de rutina sería una proeza de complejidad Buena u Ordinaria, según el juicio del Director de Juego).\n\nLa habilidad de Administración de un personaje también se puede usar para obstaculizar el intento de otra persona de obtener información. En tal caso, los modificadores de las condiciones se transponen: es una tarea de dificultad Asombrosa (penalización de +3) para ralentizar el proceso durante d6+3 días; Bueno, si estás tratando de atascar los engranajes durante d4+2 días; Ordinario, d4+1 días; o Marginal, si solo quieres causar un retraso de 1 día. Del mismo modo, la complejidad funciona\
          \ a la inversa: por ejemplo, ralentizar una solicitud extremadamente fácil que se procesa a través de un sistema pequeño es una proeza de complejidad Asombrosa, que requiere una gran cantidad de éxitos en un tiempo relativamente corto.\n\n---"
    items:
      bureaucracy:
        attribute: INT
        cost: 3
        url: /skills/administration#bureaucracy
        localized:
        - en:
            name: Bureaucracy
            description: "This specialty skill measures a character's ability to grease (or clog up) the wheels of bureaucracy. Important applications, permits, clearances, reports, or other bureaucratic requests can be processed faster and more efficiently with the use of this skill. Conversely, this skill can be used to make the same bureaucratic processes slower for others.\n\n---"
        - es:
            name: Burocracia
            description: "Esta especialización mide la capacidad de un personaje para engrasar (o atascar) los engranajes de la burocracia. Las solicitudes importantes, permisos, autorizaciones, informes u otras solicitudes burocráticas se pueden procesar más rápido y de manera más eficiente CON el uso de esta habilidad. Por el contrario, esta habilidad se puede utilizar para hacer que los mismos procesos burocráticos sean más lentos para otros.\n\n---"
      management:
        attribute: INT
        cost: 3
        url: /skills/administration#management
        localized:
        - en:
            name: Management
            description: "This skill indicates a character's ability to manage both personnel and administrative duties. A skilled manager can increase productivity, inspire workers, and supervise the workings of a business or office."
        - es:
            name: Gestión
            description: "Esta habilidad indica la capacidad de un personaje para gestionar tanto al personal como las tareas administrativas. Un gerente capacitado puede aumentar la productividad, inspirar a los trabajadores y supervisar el funcionamiento de un negocio u oficina."
  animal-handling:
    attribute: WIL
    cost: 3
    category: Other
    url: /skills/animal-handling
    localized:
    - en:
        name: Animal Handling
        description: "This broad skill provides a character with the basic ability to train animals to perform a variety of tasks, including doing labor, accepting riders, tracking, and attacking. It's also used to determine if a character can get a trained animal to perform a task, to ride an animal, or to calm, capture, or otherwise handle a wild animal or an unfamiliar domestic animal. Note that the methods of training and the commands used with different animal species can vary widely.\n\nPurchasing the broad skill entitles a character to select one type of animal that he is able to train, subject to the approval of the Gamemaster. For instance, it may be possible for a character to select “horse,” or the Gamemaster may dictate that separate applications of the skill are needed to train quarter horses and draft horses. In such a case, the character would need to have the specialty skill animal training in order to be able to train and handle more than one type of horse.\n\nAny use of\
          \ the Animal Handling broad skill to train a creature requires a complex skill check. Depending on the type of animal being worked with, a modifier is applied to each segment of the complex skill check, and certain types of animals take longer to train (more successes needed) than other types.\n\nTo have a chance of successfully training an animal, a character must spend at least 4 hours a day working with the creature. At the end of each week of continuous work, a skill check indicates how many successes were achieved toward the goal during that week. If the training schedule is interrupted by one or more days of no work, any days of work since the last skill check are lost. At the Gamemaster's discretion, an interruption of a week or more could mean that the training of that animal automatically fails and any successes that had been accumulated are lost.\n\nIf the complex skill check ends in a Critical Failure, the animal goes berserk and attacks its trainer. If the check is\
          \ aborted because of three Failure results, the animal simply refuses to be trained (but a different character might have better results).\n\nAfter an animal has been trained, other situation modifiers (listed in the bottom section of the sidebar) apply to any attempt to have the animal perform a certain task. “Unfamiliar animal” refers to a creature that has been trained by someone other than the character who's trying to make it perform. This modifier is cumulative with those listed under \"Trained animal,” so that trying to get an unfamiliar trained animal to perform a Good task carries a +3 penalty.\n\nSomeone with the Animal Handling skill may be able to get a wild animal or an untrained domestic animal to do something, but in no case will such an animal perform a task of greater than Ordinary difficulty. Ordinary tasks include activities in response to simple, one-word commands such as “Attack,” “Come,” \"Sit,” “Stay,” “Fetch,” “\"Speak,” and \"Quiet.” A Good task could be\
          \ a combination of two Ordinary tasks (in succession or simultaneously), or it could be something more difficult, such as a dog pushing a lever with its paw when directed to do so. An Amazing task is just that—something that very few animals can or will do on command, such as running into a burning building to rescue a child. Of course, the Gamemaster has the final say on whether a task or trick is Ordinary, Good, or Amazing.\n\nThe broad skill also enables a character to ride any animal that can be used for basic ground transportation—generally meaning horses, mules, and other large quadrupeds. When an animal is being ridden, the creature moves in every phase. During a phase in which the character has an action, he can use this skill in an attempt to maneuver the animal. See page 198 in Chapter 12: Vehicles for information on the types of maneuvers—Routine, Moderate, and Extreme—a rider may attempt. (Although an animal is not normally thought of as a vehicle, the same general\
          \ rules apply to riders of animals and drivers of vehicles.)"
    - es:
        name: Manejo de Animales
        description: "Esta habilidad general proporciona a un personaje la habilidad básica para entrenar animales para realizar una variedad de tareas, incluyendo trabajo, aceptar jinetes, rastrear y atacar. También se usa para determinar si un personaje puede hacer que un animal entrenado realice una tarea, para montar un animal, o para calmar, capturar o manejar de otra manera un animal salvaje o un animal doméstico desconocido. Tenga en cuenta que los métodos de entrenamiento y los comandos utilizados CON diferentes especies de animales pueden variar ampliamente.\n\nLa compra de la habilidad general le da derecho a un personaje a seleccionar un tipo de animal que puede entrenar, sujeto a la aprobación del Director de Juego. Por ejemplo, puede ser posible que un personaje seleccione \"caballo\", o el Director de Juego puede dictar que se necesitan aplicaciones separadas de la habilidad para entrenar caballos de cuarto de milla y caballos de tiro. En tal caso, el personaje necesitaría\
          \ tener la especialización de entrenamiento de animales para poder entrenar y manejar más de un tipo de caballo.\n\nCualquier uso de la habilidad general de Manejo de Animales para entrenar a una criatura requiere una tirada de habilidad compleja. Dependiendo del tipo de animal CON el que se trabaje, se aplica un modificador a cada segmento de la tirada de habilidad compleja, y ciertos tipos de animales tardan más en entrenarse (se necesitan más éxitos) que otros tipos.\n\nPara tener la oportunidad de entrenar CON éxito a un animal, un personaje debe pasar al menos 4 horas al día trabajando CON la criatura. Al final de cada semana de trabajo continuo, una tirada de habilidad indica cuántos éxitos se lograron hacia el objetivo durante esa semana. Si el programa de entrenamiento se interrumpe por uno o más días sin trabajo, se pierden los días de trabajo desde la última tirada de habilidad. A discreción del Director de Juego, una interrupción de una semana o más podría significar\
          \ que el entrenamiento de ese animal falla automáticamente y se pierden todos los éxitos que se habían acumulado.\n\nSi la tirada de habilidad compleja termina en un Fallo Crítico, el animal se vuelve loco y ataca a su entrenador. Si la tirada se aborta debido a tres resultados de Fracaso, el animal simplemente se niega a ser entrenado (pero un personaje diferente podría tener mejores resultados).\n\nDespués de que un animal ha sido entrenado, se aplican otros modificadores de situación (enumerados en la sección inferior de la barra lateral) a cualquier intento de que el animal realice una determinada tarea. \"Animal desconocido\" se refiere a una criatura que ha sido entrenada por alguien que no es el personaje que intenta hacer que actúe. Este modificador es acumulativo CON los enumerados en \"Animal entrenado\", de modo que intentar que un animal entrenado desconocido realice una tarea [Buena] conlleva una penalización de +3.\n\nAlguien CON la habilidad de Manejo de Animales\
          \ puede lograr que un animal salvaje o un animal doméstico no entrenado haga algo, pero en ningún caso dicho animal realizará una tarea de dificultad mayor que [Ordinaria]. Las tareas [Ordinarias] incluyen actividades en respuesta a comandos simples de una palabra como \"Atacar\", \"Ven\", \"Siéntate\", \"Quieto\", \"Trae\", \"Habla\" y \"Silencio\". Una tarea [Buena] podría ser una combinación de dos tareas [Ordinarias] (en sucesión o simultáneamente), o podría ser algo más difícil, como un perro empujando una palanca CON su pata cuando se le ordena hacerlo. Una tarea Asombrosa es solo eso: algo que muy pocos animales pueden o harán bajo comando, como correr hacia un edificio en llamas para rescatar a un niño. Por supuesto, el Director de Juego tiene la última palabra sobre si una tarea o truco es Ordinario, Bueno o Asombroso.\n\nLa habilidad general también permite a un personaje montar cualquier animal que pueda usarse para el transporte terrestre básico, lo que generalmente\
          \ significa caballos, mulas y otros grandes cuadrúpedos. Cuando se monta un animal, la criatura se mueve en cada fase. Durante una fase en la que el personaje tiene una acción, puede usar esta habilidad para intentar maniobrar al animal. Consulte la página 198 del Capítulo 12: Vehículos para obtener información sobre los tipos de maniobras (Rutinaria, Moderada y Extrema) que un jinete puede intentar. (Aunque normalmente no se piensa en un animal como un vehículo, las mismas reglas generales se aplican a los jinetes de animales y a los conductores de vehículos)."
    items:
      animal-handling-situation-modifiers:
        attribute: WIL
        cost: 3
        url: /skills/animal-handling#animal-handling-situation-modifiers
        localized:
        - en:
            name: Animal Handling Situation Modifiers
            description: "<div class=\"table-wrapper\">\n<table>\n<thead>\n<tr>\n<th>Type</th>\n<th>Modifier</th>\n<th>Complexity</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"table-category\">\n<td colspan=\"3\"><strong>Herbivores</strong></td>\n</tr>\n<tr>\n<td>Alien</td>\n<td>+2</td>\n<td>Amazing</td>\n</tr>\n<tr>\n<td>Domestic</td>\n<td>-1</td>\n<td>Good</td>\n</tr>\n<tr>\n<td>Wild</td>\n<td>+1</td>\n<td>Amazing</td>\n</tr>\n<tr class=\"table-category\">\n<td colspan=\"3\"><strong>Carnivores</strong></td>\n</tr>\n<tr>\n<td>Alien</td>\n<td>+5</td>\n<td>Amazing</td>\n</tr>\n<tr>\n<td>Domestic</td>\n<td>-2</td>\n<td>Ordinary</td>\n</tr>\n<tr>\n<td>Wild</td>\n<td>+4</td>\n<td>Good</td>\n</tr>\n</tbody>\n</table>\n</div>\n\n### Other Modifiers\n\n<div class=\"table-wrapper\">\n<table>\n<thead>\n<tr>\n<th>Circumstance</th>\n<th>Modifier</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Unfamiliar animal</strong></td>\n<td>+2</td>\n</tr>\n<tr>\n<td><strong>Familiar animal</strong></td>\n<td>0</td>\n\
              </tr>\n<tr class=\"table-category\">\n<td colspan=\"2\"><strong>Trained animal</strong></td>\n</tr>\n<tr>\n<td>    Ordinary task</td>\n<td>-1</td>\n</tr>\n<tr>\n<td>    Good task</td>\n<td>+1</td>\n</tr>\n<tr>\n<td>    Amazing task</td>\n<td>+3</td>\n</tr>\n<tr class=\"table-category\">\n<td colspan=\"2\"><strong>Untrained animal</strong></td>\n</tr>\n<tr>\n<td>    Ordinary task</td>\n<td>+1</td>\n</tr>\n<tr class=\"table-category\">\n<td colspan=\"2\"><strong>Wild animal</strong></td>\n</tr>\n<tr class=\"table-row-last\">\n<td>    Ordinary task</td>\n<td>+3</td>\n</tr>\n</tbody>\n</table>\n</div>"
        - es:
            name: Modificadores de Situación de Manejo de Animales
            description: "| Categoría       | Tipo        | Modificador | Complejidad |\n| :--------------- | :---------- | :---------: | :---------- |\n| **Herbívoros:** | Alienígena |     +2     | Asombroso   |\n|                  | Doméstico  |     -1     | Bueno       |\n|                  | Salvaje     |     +1     | Asombroso   |\n| **Carnívoros:** | Alienígena |     +5     | Asombroso   |\n|                  | Doméstico  |     -2     | Ordinario   |\n|                  | Salvaje     |     +4     | Bueno       |\n\n---\n\n* **Animal desconocido** ........................... +2\n* **Animal familiar** ............................... 0\n* **Animal entrenado:**\n  * Tarea ordinaria ............................... -1\n  * Tarea buena ..................................... +1\n  * Tarea asombrosa ............................... +3\n* **Animal no entrenado:**\n  * Tarea ordinaria ............................... +1\n* **Animal salvaje:**\n  * Tarea ordinaria ...............................\
              \ +3\n\n---"
      animal-riding:
        attribute: WIL
        cost: 1
        url: /skills/animal-handling#animal-riding
        localized:
        - en:
            name: Animal riding
            description: "This specialty skill enables a character to improve this aspect of the Animal Handling broad skill. A character with this skill can attempt racing over dangerous terrain, making jumps or performing other stunts, and engaging in mounted combat.\n\n▶ **Trick Riding:** When a character reaches rank 3 in this specialty, he becomes able to perform trick riding. This allows him to direct his mount to jump fences, leap chasms, or move backward.\n\nOn a Critical Failure result, the animal trips\nFor making **horizontal leaps**, success on a skill check adds to an animal’s natural jumping ability:\n\n- Ordinary, animal leaps normal distance plus 1 meter\n- Good, normal distance plus 2 meters\n- Amazing, normal distance plus 3 meters\n\nFor **jumping over obstructions**, the results are:\n\n- Ordinary, normal distance plus 1 meter\n- Good, normal distance plus 1.5 meters\n- Amazing, normal distance plus 2 meters\n\nFor **moving backward**, an:\n\n- Ordinary, means that the\
              \ animal backs up at one-half of its walk movement rate;\n- Good, animal backs up at its full walk movement rate;\n- Amazing, animal backs up at one and one-half times its walk movement rate.\n\nA character with the trick riding ability can also **use his mount for cover**. This provides a penalty to an opponent's chance to hit the rider, depending on the result of the rider’s skill check:\n\n- Ordinary, +1 step\n- Good, +2 steps\n- Amazing, +3 steps.\n\nOf course, this tactic doesn't protect the mount in any way.\n\nTrick riding can’t be combined with any other action; for instance, it's not possible to make an attack while you're urging your mount to leap over a wall.\n\n---"
        - es:
            name: Montar Animales
            description: "Esta especialización permite a un personaje mejorar este aspecto de la habilidad general de Manejo de Animales. Un personaje CON esta habilidad puede intentar correr por terrenos peligrosos, hacer saltos o realizar otras acrobacias, y participar en combate montado.\n\n» **Equitación de Acrobacias:** Cuando un personaje alcanza el rango 3 en esta especialidad, se vuelve capaz de realizar equitación de acrobacias. Esto le permite dirigir a su montura para saltar vallas, saltar abismos o moverse hacia atrás. CON un resultado de Fallo Crítico, el animal tropieza\n---"
      animal-training:
        attribute: WIL
        cost: 3
        url: /skills/animal-handling#animal-training
        localized:
        - en:
            name: Animal training
            description: "This skill allows a character to become able to handle, ride, and train a specific type of animal. He must purchase and improve this specialty skill separately for each type of animal he wants to train. Types of animals include riding animals, pack animals, attack animals, and guard animals. Your Gamemaster has the final say on how animals are classified, and which ones require separate applications of this skill."
        - es:
            name: Animal training
            description: "This skill allows a character to become able to handle, ride, and train a specific type of animal. He must purchase and improve this specialty skill separately for each type of animal he wants to train. Types of animals include riding animals, pack animals, attack animals, and guard animals. Your Gamemaster has the final say on how animals are classified, and which ones require separate applications of this skill."
  armor-operation:
    attribute: STR
    cost: 7
    category: Other
    url: /skills/armor-operation
    localized:
    - en:
        name: Armor Operation
        description: "Armor that's bulky, heavy, and cumbersome hinders the character using it. This is reflected by a penalty to the character's action check and the lessening or negating of a character's Dexterity resistance modifier. The Armor Operation broad skill and its specialty skills help to alleviate these penalties.\n\nThe Table in the [Armor Section](/equipment/armor) lists the various types of armor available and indicates which ones require the user to take an action check and Dexterity resistance modifier penalty. Under the \"AP” column on that table, an entry of \"0\" means that the Armor Operation skill is not needed to use the armor effectively, and no action check or Dexterity resistance modifier penalty is associated with it.\n\nHaving just the broad skill allows a character to reduce the action check and Dexterity resistance modifier penalty of any type of armor by 1 step. An action check penalty can be reduced from +1 to 0, or from +2 to +1, and so on—but this benefit\
          \ never provides a bonus. A Dexterity resistance modifier penalty can be similarly offset, perhaps returning the character's resistance modifier to its original value.\nIf the value under **AP** is greater than **+1** then ranks in **armor operation-combat** are needed to completely cancel the penalties (refer to the [armor operation-combat armor](/skills/armor-operation/combat-armor) for more details).\n\nA character with the broad skill who is decked out in armor can attempt any actions he wants, though some strenuous physical activities (jumping, running, climbing, etc.) may require an Armor Operation check.\nIn general, an Ordinary result on this skill check indicates a half effect (run at one-half the normal rate, for example), while a Good result or better indicates a full effect (run at the normal rate).\n\nFor a character **untrained** in Armor Operation, an action check and Dexterity resistance modifier penalty associated with any type of armor always applies. An untrained\
          \ character can't do anything but walk and make simple attacks while using any armor that carries an action check and resistance modifier penalty. Simple attacks are just that—no rank benefits, such as the double-strike benefit related to the Melee Weapons specialty skills, can be employed by an untrained character who is wearing cumbersome armor. Also, an untrained character can't use any type of powered armor.\n\n*Note: the AP penalty of armors and shields is cumulative.*"
    - es:
        name: Operación de armadura
        description: "La armadura que es voluminosa, pesada y engorrosa dificulta al personaje que la usa. Esto se refleja en una penalización a la tirada de acción del personaje y la disminución o anulación del modificador de resistencia de Destreza del personaje. La habilidad amplia de Operación de Armadura y sus habilidades de especialidad ayudan a aliviar estas penalizaciones.\n\nLa tabla en la [sección de Armadura](/es/equipment/armor) enumera los diversos tipos de armadura disponibles e indica cuáles requieren que el usuario reciba una penalización en su tirada de acción y en su modificador de resistencia de Destreza. En la columna \"AP\" de esa tabla, una entrada de \"0\" significa que la habilidad de Operación de Armadura no es necesaria para usar la armadura de manera efectiva, y no se asocia a ella ninguna penalización en la tirada de acción ni en el modificador de resistencia de Destreza.\n\nTener solo la habilidad amplia permite a un personaje reducir en 1 paso la penalización\
          \ de la tirada de acción y del modificador de resistencia de Destreza de cualquier tipo de armadura. Una penalización en la tirada de acción puede reducirse de +1 a 0, o de +2 a +1, y así sucesivamente; pero este beneficio nunca proporciona una bonificación. Un modificador de resistencia de Destreza puede compensarse de manera similar, devolviendo quizás el modificador de resistencia del personaje a su valor original.\nSi el valor bajo **AP** es superior a **+1**, se necesitan rangos en **Operación de Armadura-Combate** para cancelar completamente las penalizaciones (consulta la [Armadura de Combate](/es/skills/armor-operation/Combate-armor) para más detalles).\n\nUn personaje CON la habilidad amplia que esté equipado CON armadura puede intentar cualquier acción que desee, aunque algunas actividades físicas extenuantes (saltar, correr, escalar, etc.) pueden requerir una tirada de Operación de Armadura.\nEn general, un resultado Ordinario en esta tirada de habilidad indica un efecto\
          \ a medias (correr a la mitad de la velocidad normal, por ejemplo), mientras que un resultado Bueno o mejor indica un efecto completo (correr a la velocidad normal).\n\nPara un personaje **no entrenado** en Operación de Armadura, siempre se aplica la penalización a la tirada de acción y al modificador de resistencia de Destreza asociada a cualquier tipo de armadura. Un personaje no entrenado no puede hacer nada más que caminar y realizar ataques simples mientras usa cualquier armadura que conlleve una penalización en la tirada de acción y en el modificador de resistencia. Los ataques simples son solo eso: un personaje no entrenado que lleve una armadura engorrosa no puede emplear ningún beneficio de rango, como el beneficio de doble ataque relacionado CON las habilidades de especialidad de Armas Cuerpo a Cuerpo. Además, un personaje no entrenado no puede usar ningún tipo de armadura potenciada.\n\n*Nota: la penalización AP de las armaduras y escudos es acumulativa.*"
