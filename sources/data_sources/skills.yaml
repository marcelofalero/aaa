          - **Example:** A +1 AP penalización is reduced to 0.
          - **Limitation:** This benefit never provides a bono.

          ### Strenuous Activity
          Some strenuous physical activities (jumping, running, climbing, etc.) while armored may require an **Armor Operation** check.
          - **Ordinario:** Half effect (e.g., run at one-half the normal rate).
          - **Bueno or better:** Full effect (e.g., run at the normal rate).

          ### Untrained
          Personajes **untrained** in Armor Operation suffer the full penalización of any armor.
          - **Restrictions:** They can only walk and make simple attacks (no rango benefits allowed).
          - **Powered Armor:** Untrained personajes cannot use powered armor.

          *Note: The AP penalización of armors and shields is cumulative.*
