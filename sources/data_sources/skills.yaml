items:
  acrobatics:
    attribute: DEX
    cost: 7
    category: Other
    url: /skills/acrobatics
    localized:
    - en:
        name: Acrobatics
        description: |-
          This broad skill provides a character with basic training in acrobatics. It is used when a character wants to vault over a fence or other obstacle, dodge out of the way of an immediate danger, or try to land safely after a fall.

          ### Vaulting

          Vaulting is a vertical leap enhanced by assistance (springing off an object or using a pole). A character may use either **Athletics—jump** or **Acrobatics**.
          - **Both skills:** Increase distance by 1 meter.
          - **Using a pole:** Increase distance by 2 meters.
    - es:
        name: Acrobacia
        description: |-
          This broad skill provides a personaje with basic training in acrobatics. It is used when a personaje wants to vault over a fence or other obstacle, dodge out of the way of an immediate danger, or try to land safely after a fall.

          ### Vaulting

          Vaulting is a vertical leap enhanced by assistance (springing off an object or using a pole). A personaje may use either **Athletics—jump** or **Acrobatics**.
          - **Both skills:** Increase distance by 1 meter.
          - **Using a pole:** Increase distance by 2 meters.
    items:
      aerobatics:
        attribute: DEX
        cost: 3
        url: /skills/acrobatics#aerobatics
        localized:
        - en:
            name: Aerobatics
            description: |-
              This specialty skill represents a character's mastery of complex maneuvers during personal flight, whether through natural wings, specialized jump-packs, or gravitic personal flight devices (GADS). While basic locomotion is covered by the Acrobatics broad skill, Aerobatics is required for high-speed turns, precise landing, evasive maneuvers, and aerial acrobatics. At **Rank 4** in **Armor Operation—Propulsion Systems**, this skill can also be used for complex maneuvers using a powered suit's integrated thrusters.

              **Note:** This skill covers *personal* locomotion and complex maneuvers. Operating a larger vehicle through the air or space requires [Vehicle Operation—air](/skills/vehicle-operation/#air-vehicle) or [Vehicle Operation—space](/skills/vehicle-operation/#space-vehicle).
              ### Results
              - **Critical Failure:** Loss of control, potential stall or collision.
              - **Ordinary:** Basic controlled flight; can perform simple maneuvers. Like synchronized flying, or boarding a high speed moving vehicle (assuming it can reach it and enter)
              - **Good:** Increased control; can perform evasive maneuvers. (He can use the dodge skill)
              - **Amazing:** Perfect control; can perform complex aerial or orbital acrobatics.
              ### Rank Benefits
              ▶ **Rank 4 [Stealthy Descent]:** When using a jump-pack or GADS, the character can descend with minimal noise, receiving a **-2 step bonus** to Stealth checks.

              ▶ **Rank 6 [Endurance Flight]:** The character can fly for extended periods, receiving a **-2 step bonus** to Stamina checks for long-distance travel with with natural means or **-2 step bonus** to Armor Operation-Propulsion Systems with armor mounted propulsion.
        - es:
            name: Acrobacia aérea
            description: |-
              This specialty skill represents a personaje's mastery of complex maneuvers during personal flight, whether through natural wings, specialized jump-packs, or gravitic personal flight devices (GADS). While basic locomotion is covered by the Acrobatics broad skill, Aerobatics is required for high-speed turns, precise landing, evasive maneuvers, and aerial acrobatics. At **Rango 4** in **Armor Operation—Propulsion Systems**, this skill can also be used for complex maneuvers using a powered suit's integrated thrusters.
              **Note:** This skill covers *personal* locomotion and complex maneuvers. Operating a larger vehicle through the air or space requires [Vehicle Operation—air](/skills/vehicle-operation/#air-vehicle) or [Vehicle Operation—space](/skills/vehicle-operation/#space-vehicle).
              ### Resultados
              - **Fallo Crítico:** Loss of control, potential stall or collision.
              - **Ordinario:** Basic controlled flight; can perform simple maneuvers. Like synchronized flying, or boarding a high speed moving vehicle (assuming it can reach it and enter)
              - **Bueno:** Increased control; can perform evasive maneuvers. (He can use the dodge skill)
              - **Asombroso:** Perfect control; can perform complex aerial or orbital acrobatics.
              ### Rango Progression
              ▶ **Rango 4 (Stealthy Descent):** When using a jump-pack or GADS, the personaje can descend with minimal noise, receiving a **-2 paso bono** to Stealth checks.

              ▶ **Rango 6 (Endurance Flight):** The personaje can fly for extended periods, receiving a **-2 paso bono** to Stamina checks for long-distance travel with with natural means or **-2 paso bono** to Armor Operation-Propulsion Systems with armor mounted propulsion.
        trained_only: false
        rank_benefits:
        - rank: 4
          title: Stealthy Descent
        - rank: 6
          title: Endurance Flight
      daredevil:
        attribute: DEX
        cost: 3
        url: /skills/acrobatics#daredevil
        localized:
        - en:
            name: Daredevil
            description: |-
              This specialty skill enables a character to perform high-risk activities such as skydiving, scuba diving, hang gliding, surfing, bungee jumping, and whitewater rafting.

              **Results**

              - On a **Critical Failure**, the attempted action fails and the character could suffer stun or wound damage at the Gamemaster's discretion. This outcome generally involves bad luck concerning some aspect of the equipment being used—scuba diving gear springs a leak, a parachute fails to open properly, and so forth.
              - On a **Failure**, the attempted action doesn't succeed, but the character does not necessarily suffer damage—a parachutist goes drastically off course and lands a long distance from his target, perhaps taking damage as well.
              - On an **Ordinary**, the character is basically able to perform the action—he can manipulate a hang glider so that he stays aloft, but he has no control over his direction of travel.
              - On a **Good**, the character has limited control of the action—he opens his parachute at just the right time, and also is able to use it to maneuver so that he lands only a short distance from his target.
              - On an **Amazing**, everything goes right—he rides the raft all the way through the rapids without damage to himself or his equipment.
        - es:
            name: Temerario
            description: |-
              This specialty skill enables a personaje to perform high-risk activities such as skydiving, scuba diving, hang gliding, surfing, bungee jumping, and whitewater rafting.

              **Results**

              - On a **Fallo Crítico**, the attempted action fails and the personaje could suffer stun or wound damage at the Director de Juego's discretion. This outcome generally involves bad luck concerning some aspect of the equipment being used—scuba diving gear springs a leak, a parachute fails to open properly, and so forth.
              - On a **Fallo**, the attempted action doesn't succeed, but the personaje does not necessarily suffer damage—a parachutist goes drastically off course and lands a long distance from his target, perhaps taking damage as well.
              - On an **Ordinario**, the personaje is basically able to perform the action—he can manipulate a hang glider so that he stays aloft, but he has no control over his direction of travel.
              - On a **Bueno**, the personaje has limited control of the action—he opens his parachute at just the right time, and also is able to use it to maneuver so that he lands only a short distance from his target.
              - On an **Asombroso**, everything goes right—he rides the raft all the way through the rapids without damage to himself or his equipment.
        trained_only: false
      dodge:
        attribute: DEX
        cost: 3
        url: /skills/acrobatics#dodge
        localized:
        - en:
            name: Dodge
            description: |-
              This specialty skill allows a character to move in ways that make hard for the adversaries to hit him with melee or ranged attacks. It's also used when a character dives for cover or hits the deck when an area-effect attack targets him. Dodge lets a character tumble, roll, duck, dive, or spring out of the way of an attack. One skill check (requiring an action) is made at the beginning of the first phase in which the character can act. The result lasts for all subsequent phases in the round. Any additional actions taken in the round receive a +1 penalty.

              **Adjustments to Strength/Dexterity Resistance Modifiers**
              - **Critical Failure:** -2 steps
              - **Failure:** none
              - **Ordinary:** +1 step
              - **Good:** +2 steps
              - **Amazing:** +3 steps

              _(This skill can’t be combined with the parry or block rank benefits described under Melee Combat Specialty skills)_
              ### Rank Benefits
              ▶ **Rank 3 [Action Benefit]:** Dodge and perform an action in the same phase (+2 penalty on the both checks), this only uses up 1 of the character actions.

              ⊗ **Rank 4 [Resistance Modifier]:** The character’s Dexterity resistance modifier improves by +1 at each of these ranks.

              ▶ **Rank 7 [Reaction Dodge]:** Perform a reaction dodge, allowing the character to defend earlier in the round. In a round when a character makes a reaction dodge, he can only dodge; all other actions are lost for the round.
        - es:
            name: Esquivar
            description: |-
              This specialty skill allows a personaje to move in ways that make hard for the adversaries to hit him with melee or ranged attacks. It's also used when a personaje dives for cover or hits the deck when an area-effect attack targets him. Dodge lets a personaje tumble, roll, duck, dive, or spring out of the way of an attack. One skill check (requiring an action) is made at the beginning of the first phase in which the personaje can act. The result lasts for all subsequent phases in the round. Any additional actions taken in the round receive a +1 penalización.

              **Adjustments to Strength/Dexterity Resistance Modifiers**
              - **Fallo Crítico:** -2 steps
              - **Fallo:** none
              - **Ordinario:** +1 paso
              - **Bueno:** +2 steps
              - **Asombroso:** +3 steps

              _(This skill can’t be combined with the parry or block rango benefits described under Melee Combat Specialty skills)_

              **Rango Progression**

              ▶ **Rango 3 [Action Benefit]:** Dodge and perform an action in the same phase (+2 penalización on the both checks), this only uses up 1 of the personaje actions.

              ⊗ **Rango 4, 8, 12 [Modificador de Resistencia]:** The personaje’s Dexterity resistance modifier improves by +1 at each of these ranks.

              ▶ **Rango 7 [Reaction Dodge]:** Perform a reaction dodge, allowing the personaje to defend earlier in the round. In a round when a personaje makes a reaction dodge, he can only dodge; all other actions are lost for the round.
        trained_only: false
        rank_benefits:
        - rank: 3
          title: Action Benefit
        - rank: 4
          title: Resistance Modifier
        - rank: 7
          title: Reaction Dodge
        - rank: 8
          title: Resistance Modifier
        - rank: 12
          title: Resistance Modifier
      fall:
        attribute: DEX
        cost: 3
        url: /skills/acrobatics#fall
        localized:
        - en:
            name: Fall
            description: |-
              This specialty skill allows a character to improve his ability to survive a fall by twisting his body, catching nearby protrusions, or otherwise slowing his descent, thereby decreasing the damage he sustains from an impact. A character with the fall specialty skill adds his rank in the specialty to his Acrobatics score and uses that number to make the skill check, with a +d0 base situation die.
        - es:
            name: Caída
            description: |-
              This specialty skill allows a personaje to improve his ability to survive a fall by twisting his body, catching nearby protrusions, or otherwise slowing his descent, thereby decreasing the damage he sustains from an impact. A personaje with the fall specialty skill adds his rango in the specialty to his Acrobatics score and uses that number to make the skill check, with a +d0 base dado de situación.
        trained_only: false
      zero-g-training:
        attribute: DEX
        cost: 3
        url: /skills/acrobatics#zero-g-training
        localized:
        - en:
            name: Zero-g Training
            description: |-
              A character with the zero-g training skill can function in weightless or near-weightless conditions better than someone who doesn't have this skill. An untrained character has a +3 step penalty in zero gravity and a +1 step penalty in light gravity. Purchasing this skill immediately reduces the zero-g penalty to +2 steps and eliminates the penalty for light gravity.
              ### Rank Benefits
              ▶ **Rank 4 [Benefit]:** Zero-g penalty is reduced to +1 step, and light gravity actions receive a -1 step bonus.

              ▶ **Rank 7 [Benefit]:** Zero-g penalty is eliminated.

              ▶ **Rank 1 [Benefit]:** Physical actions in zero-g receive a -1 step bonus. (Light gravity bonus never improves beyond -1 step.)

              **Sesheyan Advantage** Sesheyan characters without the zero-g training skill function as though they have it at rank 1. If a sesheyan purchases this skill, penalties are reduced by 1 step and bonuses are improved by the same amount (max bonus -2 in light gravity).
        - es:
            name: Entrenamiento en gravedad cero
            description: |-
              A personaje with the zero-g training skill can function in weightless or near-weightless conditions better than someone who doesn't have this skill. An untrained personaje has a +3 paso penalización in zero gravity and a +1 paso penalización in light gravity. Purchasing this skill immediately reduces the zero-g penalización to +2 steps and eliminates the penalización for light gravity.

              **Rango Progression**

              ▶ **Rango 4:** Zero-g penalización is reduced to +1 paso, and light gravity actions receive a -1 paso bono.

              ▶ **Rango 7:** Zero-g penalización is eliminated.

              ▶ **Rango 10:** Physical actions in zero-g receive a -1 paso bono. (Light gravity bono never improves beyond -1 paso.)

              **Sesheyan Advantage** Sesheyan personajes without the zero-g training skill function as though they have it at rango 1. If a sesheyan purchases this skill, penalties are reduced by 1 paso and bonuses are improved by the same amount (max bono -2 in light gravity).
        trained_only: true
        rank_benefits: []
    trained_only: false
  administration:
    attribute: WIL
    cost: 4
    category: Technical
    url: /skills/administration
    localized:
    - en:
        name: Administration
        description: |-
          This broad skill provides a character with knowledge concerning the forms and procedures that go into running an office or organization of almost any kind. With this skill, a character understands scheduling, personnel and equipment management, and the regulations and laws that apply to such endeavors. Any large organizations, including governments, agencies, and corporations, have some type of administrational bureaucracy that a character may someday be called upon to interact with. This skill allows him to attempt to identify the proper administrators to deal with in a particular situation, the proper procedures to follow, and the best way to cut through red tape.

          ### Organizational Interaction
          The Administration skill can be used in an attempt to change the attitude of an individual employee of some corporation or organization. In such a case, it is treated as an [encounter skill](/core-mechanics/characters-in-action/#encounter-scene). If the use of this skill results in a target's attitude being changed to Friendly or better, this can provide a bonus on any subsequent skill check to get information or cooperation out of the organization that is the employer of the target.

          ### Getting Results
          Using this skill, or either of its specialties, to get results out of a bureaucratic organization requires a complex skill check.

          **Time Constraints (Situation Modifiers):**
          - **Amazing (+3 penalty):** Answer needed in 1 day.
          - **Good (+2 penalty):** Answer in d4+1 days.
          - **Ordinary (+1 penalty):** Answer in d4+2 days.
          - **Marginal (no penalty):** Answer in d6+3 days.

          **Bureaucratic Complexity:**
          - **Marginal:** Small system/extremely easy request.
          - **Ordinary:** Medium-sized system/routine request.
          - **Good:** Large system/complex request.
          - **Amazing:** Extremely large system/restricted or illegal request.

          *Note: These factors can offset one another. For instance, a routine request in an extremely large bureaucracy might be Good or Ordinary complexity.*

          ### Hindering Others
          A character's Administration skill can also be used to hinder someone else’s attempt to gain information. The modifiers for conditions are transposed:
          - **Amazing (+3 penalty):** Slow down for d6+3 days.
          - **Good (+2 penalty):** Slow down for d4+2 days.
          - **Ordinary (+1 penalty):** Slow down for d4+1 days.
          - **Marginal (no penalty):** Delay of 1 day.

          Likewise, complexity works the other way around: slowing down an extremely easy request in a small system is a feat of **Amazing** complexity.
    - es:
        name: Administración
        description: |-
          This broad skill provides a personaje with knowledge concerning the forms and procedures that go into running an office or organization of almost any kind. With this skill, a personaje understands scheduling, personnel and equipment management, and the regulations and laws that apply to such endeavors. Any large organizations, including governments, agencies, and corporations, have some type of administrational bureaucracy that a personaje may someday be called upon to interact with. This skill allows him to attempt to identify the proper administrators to deal with in a particular situation, the proper procedures to follow, and the best way to cut through red tape.

          ### Organizational Interaction
