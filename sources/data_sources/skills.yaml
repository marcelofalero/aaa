  vehicle-operation:
    attribute: DEX
    cost: 3
    category: Technical
    url: /skills/vehicle-operation
    localized:
    - en:
        name: Vehicle Operation
        description: |-
          This broad skill provides a character with a basic understanding of and proficiency with modern vehicles. Using this skill, a character can attempt to operate most normal land and water vehicles. Some military or specialized land and water vehicles may have controls that are too complex for the broad skill to cover, requiring at least some level of specialization before a character is able to operate them successfully. The ordinary operation of any normal land or water vehicle doesn''t require a skill check. During chases, races, or vehicle combat, or when navigating through challenging obstacles, skill checks may be called for. When a character purchases any of the **Vehicle Operation** specialty skills, he selects a specific type of vehicle. For more details on vehicles, see the section on [Vehicles and Vessels](/core-mechanics/vehicles-and-vessels/).
    - es:
        name: Operación de Vehículos
        description: |-
          Esta habilidad amplia proporciona a un personaje una comprensión básica y competencia CON los vehículos modernos. Usando esta habilidad, un personaje puede intentar operar la mayoría de los vehículos terrestres y acuáticos normales. Algunos vehículos terrestres y acuáticos militares o especializados pueden tener controles que son demasiado complejos para que la habilidad amplia los cubra, requiriendo al menos algún nivel de especialización antes de que un personaje sea capaz de operarlos CON éxito. La operación ordinaria de cualquier vehículo terrestre o acuático normal no requiere una comprobación de habilidad. Durante persecuciones, carreras o combate de vehículos, o cuando se navega a través de obstáculos desafiantes, se pueden solicitar comprobaciones de habilidad. Cuando un personaje adquiere cualquiera de las habilidades de especialidad de **Operación de Vehículos**, selecciona un tipo específico de vehículo. Para más detalles sobre vehículos, consulte la sección de [Vehículos y Naves](/core-mechanics/vehicles-and-vessels/).
          # Habilidades de Especialidad
    items:
      air-vehicle:
        attribute: DEX
        cost: 5
        url: /skills/vehicle-operation#air-vehicle
        localized:
        - en:
            name: Air vehicle
            description: |-
              This specialty skill enables a character to become trained in the use of a specific type of air vehicle. If he wants to be skilled in the operation of more than one type of air vehicle, he must purchase and improve each specialty skill separately. Types of air vehicles include propeller planes, helicopters, private jets, commercial jets, and jet fighters.
        - es:
            name: Vehículo Aéreo
            description: |-
              Esta habilidad de especialidad permite a un personaje estar entrenado en el uso de un tipo específico de vehículo aéreo. Si desea ser experto en la operación de más de un tipo de vehículo aéreo, debe comprar y mejorar cada habilidad de especialidad por separado. Los tipos de vehículos aéreos incluyen aviones de hélice, helicópteros, jets privados, jets comerciales y aviones de combate.
        trained_only: true
      land-vehicle:
        attribute: DEX
        cost: 3
        url: /skills/vehicle-operation#land-vehicle
        localized:
        - en:
            name: Land vehicle
            description: |-
              This specialty skill enables a character to become trained in the use of a specific type of land vehicle. If he wants to be skilled in the operation of more than one type of land vehicle, he must purchase and improve each specialty skill separately. Types of land vehicles include automobiles, motorcycles, race cars, large trucks, and tanks and other heavy military vehicles.
        - es:
            name: Vehículo Terrestre
            description: |-
              Esta habilidad de especialidad permite a un personaje estar entrenado en el uso de un tipo específico de vehículo terrestre. Si desea ser experto en la operación de más de un tipo de vehículo terrestre, debe comprar y mejorar cada habilidad de especialidad por separado. Los tipos de vehículos terrestres incluyen automóviles, motocicletas, coches de carreras, camiones grandes y tanques y otros vehículos militares pesados.
        trained_only: false
      space-vehicle:
        attribute: DEX
        cost: 5
        url: /skills/vehicle-operation#space-vehicle
        localized:
        - en:
            name: Space vehicle
            description: |-
              This specialty skill enables a character to become trained in the use of a specific type of space vehicle. If he wants to be skilled in the operation of more than one type of space vehicle, he must purchase and improve each specialty skill separately. This skill is also used to operate the helm of large, multicrewed space vessels. Other systems on space vessels require the specialized functions of the **[System Operation](/skills/system-operation/)** broad skill. Types of space vehicles include:
              - **Space fighters:** ships of 10 durability or less.
              - **Scouts and light freighters:** ships of 11–32 durability.
              - **Medium freighters and corvettes:** ships of 33–60 durability.
              - **Capital ships:** ships of 60+ durability.
        - es:
            name: Vehículo Espacial
            description: |-
              Esta habilidad de especialidad permite a un personaje estar entrenado en el uso de un tipo específico de vehículo espacial. Si desea ser experto en la operación de más de un tipo de vehículo espacial, debe comprar y mejorar cada habilidad de especialidad por separado. Esta habilidad también se usa para operar el timón de naves espaciales grandes CON tripulación múltiple. Otros sistemas en naves espaciales requieren las funciones especializadas de la habilidad amplia de **[Operación de Sistemas](/skills/system-operation/)**. Los tipos de vehículos espaciales incluyen:
              - **Cazas espaciales:** naves de 10 de durabilidad o menos.
              - **Exploradores y cargueros ligeros:** naves de 11–32 de durabilidad.
              - **Cargueros medios y corbetas:** naves de 33–60 de durabilidad.
              - **Naves capitales:** naves de más de 60 de durabilidad.
        trained_only: true
      water-vehicle:
        attribute: DEX
        cost: 3
        url: /skills/vehicle-operation#water-vehicle
        localized:
        - en:
            name: Water vehicle
            description: |-
              This specialty skill enables a character to become trained in the use of a specific type of water vehicle. If he wants to be skilled in the operation of more than one type of water vehicle, he must purchase and improve each specialty skill separately. This skill is also used to operate the helm of large, multicrewed water vessels (such as battleships, submarines, and oil tankers); these require a version of the specialized functions of the **[System Operation](/skills/system-operation/)** broad skill. Types of water vehicles include canoes, rafts and rowboats, powerboats, jet skis, sailboats, large commercial vessels, large military vessels, and submersible craft.
              ### Rank Benefits
              ▶ **Rank 3 [Vehicle Operation]:** specialty skills, he becomes even more adept at operating the specific types of vehicles he has specialized in.

              ▶ **Rank 4, 8, 12 [Benefit]:** The character receives a situation die bonus to checks involving the specialized craft:
              - **-1 step** at rank 4.
              - **-2 step** at rank 8.
              - **-3 step** at rank 12.
        - es:
            name: Vehículo Acuático
            description: |-
              Esta habilidad de especialidad permite a un personaje estar entrenado en el uso de un tipo específico de vehículo acuático. Si desea ser experto en la operación de más de un tipo de vehículo acuático, debe comprar y mejorar cada habilidad de especialidad por separado. Esta habilidad también se usa para operar el timón de naves acuáticas grandes CON tripulación múltiple (como acorazados, submarinos y petroleros); estos requieren una versión de las funciones especializadas de la habilidad amplia de **[Operación de Sistemas](/skills/system-operation/)**. Los tipos de vehículos acuáticos incluyen canoas, balsas y botes de remos, lanchas motoras, motos de agua, veleros, grandes barcos comerciales, grandes barcos militares y embarcaciones sumergibles.
              ### Beneficios de Rango: Competencia Mejorada
              A medida que un personaje alcanza rangos más altos en una o más de las habilidades de especialidad de **Operación de Vehículos**, se vuelve aún más adepto a operar los tipos específicos de vehículos en los que se ha especializado.
              ⊗ **Beneficio de Rango:** El personaje recibe un bono de dado de situación a las comprobaciones que involucran el vehículo especializado:
              - **-1 paso** al rango 4.
              - **-2 pasos** al rango 8.
              - **-3 pasos** al rango 12.
        trained_only: false
    trained_only: false
