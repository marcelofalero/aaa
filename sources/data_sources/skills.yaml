  modern-ranged-weapons:
    attribute: DEX
    cost: 6
    category: Combat
    url: /skills/modern-ranged-weapons
    localized:
      - en:
          name: Modern Ranged Weapons
          description: |-
            This broad skill provides a character with training in the use of modern ranged weapons. This skill covers pistols, rifles, shotguns, and submachine guns of all types, including projectile and energy weapons. All modern weapons have ammunition clips. To change a clip during a combat scene, a character must use an available action. If he wants to change a clip and shoot in the same phase, a +2 penalty applies to the attack action. Other factors that can influence the situation die used in a modern ranged weapon attack are listed under **Ranged Weapon Attack Modifiers** on this page.

            Having rank in any Modern Ranged Weapons specialty skill act as having half the ranks in any other Modern Ranged Weapons specialty skill, unless the character has more ranks in the specialty skill itself. This virtual ranks do not apply to rank based benefits.

            ### Weapon Technical Knowledge
            Characters who train seriously with firearms — whether soldiers, mercenaries, or dedicated enthusiasts — inevitably absorb a working technical understanding of their weapons. They learn how their weapons function internally, what can go wrong, how to prevent it, and how to fix it in the field. As well as keep informed of what the market has to offer. A character with the **Technical Science** broad skill can use the appropriate Modern Ranged Weapons specialty skill for checks that involve knowing the existence of a particular weapon, customizing weapons and ammo, as well as recognizing, repairing, and maintaining weapons in the field.

            ### Ranged Weapon Attack Modifiers
            When a character uses any ranged weapon, either primitive or modern, a number of factors must be considered to determine the situation die for the skill check:
            - The base situation die of the weapon (either +d4 for a broad skill or +0 for a specialty).
            - The weapon’s range modifier (see **TABLE: RANGE MODIFIERS BY WEAPON TYPE** below).
            - Any modifier for a target’s Dexterity resistance (–1 step bonus for DEX 11–12, –2 steps for DEX 13–14, –3 steps for DEX 15–16, –4 steps for DEX 17–18, and –5 steps for DEX 19 or higher).

            #### TABLE: COMMON RANGED ATTACK MODIFIERS
            | Condition             | Modifier | Note                                                               |
            | :---                  | :---     | :---                                                               |
            | In a Melee Struggle   | +2 steps | Canceled by **Melee Combat** Broad Skill training.                 |
            | Poor Lighting         | +1 step  | Low light conditions                                               |
            | Poor Visibility       | +2 steps | Heavy fog, smoke, or dust                                          |
            | Poor Weapon Condition | +1 step  | Weapon is damaged or malfunctioning.                               |
            | Unstable footing      | -2 steps | Target is running at high speed or performing acrobatic maneuvers. |

            #### TABLE: RANGE MODIFIERS BY WEAPON TYPE
            | Weapon         | Zero-range | Short    | Medium  | Long     |
            | :---           | :---       | :---     | :---    | :---     |
            | Submachine gun | None       | -1 step  | +1 step | +3 steps |
            | Pistol         | -3 steps   | -1 step  | +1 step | +3 steps |
            | Rifle          | +3 steps   | -1 step  | None    | +1 step  |
            | Assault Rifle  | +3 steps   | -1 step  | +1 step | +2 steps |
            | Shotgun        | -3 steps   | -1 step  | +1 step | +3 steps |
      - es:
          name: Armas a distancia modernas
          description: |-
            Esta amplia habilidad proporciona al Personaje capacitación en el uso de Armas a distancia modernas. Esta habilidad cubre pistolas, rifles, escopetas y metralletas de todo tipo, incluidas armas de proyectiles y de energía. Todas las armas modernas tienen cargadores de munición. Para cambiar un clip durante una escena Combate, un Personaje debe usar una acción disponible. Si quiere cambiar de clip y disparar en la misma fase, se aplica una penalización de +2 a la acción de ataque. Los factores Otros que pueden influir en el Dado de Situación utilizado en un ataque con armas a distancia moderno se enumeran en **Modificadores de ataques con armas a distancia** en esta página.

            Tener Rango en cualquier Armas a distancia modernas Especialidad actúa como tener la mitad de Rangos en cualquier Otros Armas a distancia modernas Especialidad, a menos que el Personaje tenga más Rangos en el propio Especialidad. Este Rangos virtual no se aplica a los beneficios basados ​​en Rango.

            ### Conocimiento técnico de armas
            Los personajes que entrenan seriamente con armas de fuego, ya sean soldados, mercenarios o entusiastas dedicados, inevitablemente absorben una comprensión práctica de sus armas. Aprenden cómo funcionan internamente sus armas, qué puede salir mal, cómo prevenirlo y cómo solucionarlo en el campo. Así como mantenerse informado de lo que el mercado tiene para ofrecer. Un Personaje con la habilidad amplia **Ciencia técnica** puede usar el Armas a distancia modernas Especialidad apropiado para comprobaciones que implican conocer la existencia de un arma en particular, personalizar armas y municiones, así como reconocer, reparar y mantener armas en el campo.

            ### Modificadores de ataques con armas a distancia
            Cuando un Personaje usa cualquier arma a distancia, ya sea primitiva o moderna, se deben considerar una serie de factores para determinar el Dado de Situación para la prueba de habilidad:
            - El Dado de Situación base del arma (ya sea +d4 para una habilidad amplia o +0 para una especialidad).
            - El modificador de alcance del arma (ver **TABLA: MODIFICADORES DE ALCANCE POR TIPO DE ARMA** a continuación).
            - Cualquier modificador para la resistencia a la Destreza de un objetivo (–1 Bonificación de paso para DES 11–12, –2 pasos para DES 13–14, –3 pasos para DES 15–16, –4 pasos para DES 17–18 y –5 pasos para DES 19 o superior).

            #### TABLA: MODIFICADORES DE ATAQUE A DISTANCIA COMUNES
            | Condición | Modificador | Nota |
            | :--- | :--- | :--- |
            | En una lucha cuerpo a cuerpo | +2 pasos | Cancelado por **Combate cuerpo a cuerpo** Entrenamiento de habilidades amplias.                 |
            | Mala iluminación | +1 paso | Condiciones de poca luz |
            | Mala visibilidad | +2 pasos | Niebla densa, humo o polvo |
            | Malas condiciones del arma | +1 paso | El arma está dañada o no funciona correctamente.                               |
            | Pie inestable | -2 pasos | El objetivo corre a gran velocidad o realiza maniobras acrobáticas. |

            #### TABLA: MODIFICADORES DE ALCANCE POR TIPO DE ARMA
            | Arma | Rango cero | Corto | Medio | Largo |
            | :--- | :--- | :--- | :--- | :--- |
            | Subfusil | Ninguno | -1 paso | +1 paso | +3 pasos |
            | Pistola | -3 pasos | -1 paso | +1 paso | +3 pasos |
            | Fusil | +3 pasos | -1 paso | Ninguno | +1 paso |
            | Fusil de asalto | +3 pasos | -1 paso | +1 paso | +2 pasos |
            | Escopeta | -3 pasos | -1 paso | +1 paso | +3 pasos |
    items:
      assault-rifle:
        attribute: DEX
        cost: 3
        url: /skills/modern-ranged-weapons#assault-rifle
        localized:
          - en:
              name: Assault Rifle
              description: |-
                This specialty skill covers automatic rifles—standard infantry weapons capable of selective fire and automatic modes using rifle-caliber cartridges or standard energy cells. Each weapon's description will indicate its allowed fire modes and its specific Autofire profile.

                ### Attack Modes
                Assault rifles provide a character with up to three attack options per action phase:

                **Fire** A single, precise attack at a single target. (Resolution: Standard control + situation die. Ammo Cost: 1 round).

                **Burst** A tight, controlled hail of ammunition aimed at a single target to ensure a hit before recoil shifts the barrel. (Resolution: The character receives a -1 step bonus to their skill check against the target. Ammo Cost: 3 rounds).

                **Autofire** A continuous barrage meant to saturate an area or cut through a vector. The weapon's description dictates whether it uses the Spread or Line profile. (Ammo Cost: 10 rounds or equivalent energy drain).

                **Profile A: Spread**
                The Area (Target and adjacent squares): The player targets a single square. The attack affects that center square and all 8 immediately adjacent squares.
                Resolution: The player makes a single attack roll with a -1 step bonus against the primary target in the center square.
                The Spread: All other entities (friend or foe) in the adjacent squares automatically take Ordinary damage.
                Reaction: Targets in the adjacent squares may avoid the damage if they succeed on a Dodge check or use an action to make a Hit the Deck check. This action is used instead of their normal action for the turn.

                **Profile B: Line**
                The Area (Linear): The player designates a straight line across the grid. The attack affects every entity occupying a square touched by that line.
                Resolution: The player makes a single attack roll to determine damage against the targets caught in the beam.
                The attacker applies a -1 step bonus against the nearest target in the line, no modifier against the second, and a +1 step penalty against the third furthest target. The beam loses lethal coherence after the third target.

                ### Rank Benefits

                ▶ **Rank 3 [Rock-n-Roll]** When a character reaches rank 3 in this specialty, they learn to change clips more efficiently. The penalty for changing a clip and firing in the same action is reduced to a +1 step.

                ⊗ **Rank 4 [Distance Precision]** When a character reaches rank 4 in this specialty, they know how to compensate for bullet drop and optical alignment. The step penalty for a medium-range shot is eliminated, and the penalty for a long-range shot is lessened by 1 step.

                ▶ **Rank 6 [Suppressive Angles]** When a character reaches rank 6, they know exactly how to walk their fire to trap an enemy. When the character uses the Autofire (Spread) profile, enemies caught in the adjacent squares (Ring 2) suffer a +1 step penalty to their Dodge check or their reaction to Hit the Deck.

                ⊗ **Rank 9 [Absolute Recoil Control]** When a character reaches rank 9 in this specialty, they achieve perfect physical mastery over the weapon's action. The step bonus for using the Burst attack mode is increased from a -1 step to a -2 step bonus, massively increasing the probability of dealing high-tier damage to a single target.
          - es:
              name: Fusil de asalto
              description: |-
                Este Especialidad cubre rifles automáticos: armas de infantería estándar capaces de realizar disparos selectivos y modos automáticos que utilizan cartuchos de calibre de rifle o celdas de energía estándar. La descripción de cada arma indicará sus modos de disparo permitidos y su perfil de Autofire específico.

                ### Modos de ataque
                Los rifles de asalto brindan al Personaje hasta tres opciones de ataque por fase de acción:

                **Disparo** Un ataque único y preciso a un único objetivo. (Resolución: control estándar + Dado de Situación. Costo de munición: 1 ronda).

                **Explosión** Una lluvia de munición ajustada y controlada dirigida a un solo objetivo para garantizar un impacto antes de que el retroceso desplace el cañón. (Resolución: El Personaje recibe un -1 Bonificación de paso en su prueba de habilidad contra el objetivo. Costo de munición: 3 rondas).

                **Autodisparo** Un bombardeo continuo destinado a saturar un área o atravesar un vector. La descripción del arma determina si utiliza el perfil Extendido o Línea. (Costo de munición: 10 rondas o drenaje de energía equivalente).

                **Perfil A: Distribución**
                El área (objetivo y cuadrados adyacentes): el jugador apunta a un solo cuadrado. El ataque afecta a esa casilla central y a las 8 casillas inmediatamente adyacentes.
                Resolución: El jugador realiza una única tirada de ataque con un -1 Bonificación de paso contra el objetivo principal en el cuadrado central.
                La propagación: todas las entidades Otros (amigas o enemigas) en los cuadrados adyacentes reciben automáticamente daño Ordinario.
                Reacción: Los objetivos en las casillas adyacentes pueden evitar el daño si tienen éxito en una prueba de Esquivar o usan una acción para realizar una prueba de Golpear la cubierta. Esta acción se utiliza en lugar de su acción normal del turno.

                **Perfil B: Línea**
                El área (lineal): el jugador designa una línea recta a lo largo de la cuadrícula. El ataque afecta a todas las entidades que ocupan una casilla tocada por esa línea.
                Resolución: el jugador realiza una única tirada de ataque para determinar el daño contra los objetivos atrapados en el rayo.
                El atacante aplica un -1 Bonificación de paso contra el objetivo más cercano en la línea, ningún modificador contra el segundo y un +1 Penalización de paso contra el tercer objetivo más lejano. El rayo pierde coherencia letal después del tercer objetivo.

                ### Beneficios de Rango

                ▶ **Rango 3 [Rock-n-Roll]** Cuando un Personaje alcanza Rango 3 en esta especialidad, aprende a cambiar clips de manera más eficiente. La penalización por cambiar un cargador y disparar en la misma acción se reduce a un paso de +1.

                ⊗ **Rango 4 [Precisión de distancia]** Cuando un Personaje alcanza Rango 4 en esta especialidad, saben cómo compensar la caída de la bala y la alineación óptica. Se elimina el Penalización de paso por un tiro de media distancia y la penalización por un tiro de larga distancia se reduce en 1 paso.

                ▶ **Rango 6 [Ángulos de supresión]** Cuando un Personaje alcanza Rango 6, sabe exactamente cómo dirigir su fuego para atrapar a un enemigo. Cuando el Personaje usa el perfil Autofire (Spread), los enemigos atrapados en los cuadrados adyacentes (Anillo 2) sufren un +1 Penalización de paso en su prueba de Esquivar o en su reacción al golpear la cubierta.

                ⊗ **Rango 9 [Control de retroceso absoluto]** Cuando un Personaje alcanza Rango 9 en esta especialidad, logra un dominio perfecto de Físico sobre la acción del arma. El Bonificación de paso para usar el modo de ataque Burst aumenta de un paso de -1 a un Bonificación de paso -2, lo que aumenta enormemente la probabilidad de infligir daño de alto nivel a un solo objetivo.
        trained_only: false
      pistol:
        attribute: DEX
        cost: 3
        url: /skills/modern-ranged-weapons#pistol
        localized:
          - en:
              name: Pistol
              description: |-
                This specialty skill allows a character to improve their proficiency with modern pistols of all types. These weapons lack the range of rifles and the volume of heavy weapons, but they excel in mobility, reaction time, and close-quarters action economy.

                ## Attack Modes

                ### Single Handgun Attack Modes
                When wielding a single pistol, a character is limited by the physical action of the weapon's trigger and cycle rate. They have two options:

                **Snap Fire** A quick attack at a single target. (Action Cost: 1 Action Phase. Resolution: Standard control + situation die. Ammo Cost: 1 round).

                **Double Tap** The character rapidly cycles the weapon twice, either at the same target or transitioning to a second target in the same general direction. (Action Cost: 2 Actions spent in the same phase. Resolution: The character makes two separate attack rolls, both suffering a +2 step penalty. Ammo Cost: 2 rounds).

                ### Dual Wield Attack Modes (Akimbo)
                When wielding two pistols, the character combines their ammunition pools and unlocks the ability to bend the action economy, substituting sequential time with simultaneous fire:

                **Focus Target** The character points both weapons at a single target and fires at the exact same moment to ensure a concentrated hit. (Action Cost: 1 Action Phase. Resolution: The character receives a -1 step bonus to their skill check against the target. Ammo Cost: 2 rounds—1 from each weapon).

                **Split Target** The character simultaneously engages two separate targets. (Action Cost: 1 Action Phase. Resolution: The character makes two separate attack rolls. The primary hand suffers a +2 step penalty, and the off-hand suffers a +4 step penalty. If the character possesses the Ambidexterity trait, the off-hand penalty is reduced, making the rolls +2 / +2. Ammo Cost: 2 rounds—1 from each weapon).

                ## Rank Benefits
                ⊗ **Rank 1 [Pistol CQB]** When a character reaches rank 2 in this specialty, the check receives -3 step bonus while firing at zero-range.

                ▶ **Rank 3 [Quick Draw]** When a character reaches rank 3 in this specialty, they can clear their holster rapidly. The character can draw their pistol (or pistols) and fire in the same action phase with only a +1 step penalty.

                ▶ **Rank 4 [Lightning Draw]** When a character reaches rank 4, the draw becomes instinctual. The character can draw and fire in the same action phase without any penalty.

                ▶ **Rank 6 [Dual-Wield Coordination]** When a character reaches rank 6, their peripheral vision and recoil control improve drastically. When using the Split Target dual-wield modes, the penalty for both shots is reduced by 1 step (e.g., a character with Ambidexterity using Split Target now rolls at +1 / +1).

                ▶ **Rank 9 [Akimbo Mastery]** When a character reaches rank 9, they can operate two weapons as flawlessly as one. When using the Split Target dual-wield mode, the penalty for both shots is reduced by 2 steps (the character fire at +0 / +2. Or +0 / +0 for a character with Ambidexterity).
          - es:
              name: Pistola
              description: |-
                Este Especialidad permite que un Personaje mejore su competencia con pistolas modernas de todo tipo. Estas armas carecen del alcance de los rifles y del volumen del Armas pesadas, pero destacan en movilidad, tiempo de reacción y economía de acción en espacios reducidos.

                ## Modos de ataque

                ### Modos de ataque con pistola única
                Al empuñar un solo Pistola, un Personaje está limitado por la acción Físico del gatillo y la velocidad de ciclo del arma. Tienen dos opciones:

                **Snap Fire** Un ataque rápido a un solo objetivo. (Costo de acción: 1 fase de acción. Resolución: control estándar + Dado de Situación. Costo de munición: 1 ronda).

                **Doble toque** El Personaje gira rápidamente el arma dos veces, ya sea en el mismo objetivo o en transición a un segundo objetivo en la misma dirección general. (Coste de acción: 2 acciones realizadas en la misma fase. Resolución: El Personaje realiza dos tiradas de ataque separadas, ambas sufriendo un +2 Penalización de paso. Costo de munición: 2 rondas).

                ### Modos de ataque con doble empuñadura (Akimbo)
                Al empuñar dos pistolas, el Personaje combina sus reservas de municiones y desbloquea la capacidad de alterar la economía de la acción, sustituyendo el tiempo secuencial por disparos simultáneos:

                **Enfocar objetivo** El Personaje apunta ambas armas a un solo objetivo y dispara exactamente en el mismo momento para garantizar un impacto concentrado. (Costo de acción: 1 fase de acción. Resolución: el Personaje recibe un Bonificación de paso de -1 en su prueba de habilidad contra el objetivo. Costo de munición: 2 rondas, 1 de cada arma).

                **Objetivo dividido** El Personaje ataca simultáneamente dos objetivos separados. (Costo de acción: 1 fase de acción. Resolución: el Personaje realiza dos tiradas de ataque separadas. La mano principal sufre un Penalización de paso +2 y la mano secundaria sufre un Penalización de paso +4. Si el Personaje posee el rasgo Ambidestreza, la penalización de la mano secundaria se reduce, lo que hace que las tiradas sean +2 / +2. Costo de munición: 2 rondas, 1 de cada arma).

                ## Beneficios de Rango
