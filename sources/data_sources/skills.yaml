    items:
      animal-riding:
        attribute: WIL
        cost: 1
        url: /skills/animal-handling#animal-riding
        localized:
        - en:
            name: Animal riding
            description: |-
              This specialty skill enables a character to improve this aspect of the Animal Handling broad skill. A character with this skill can attempt racing over dangerous terrain, making jumps or performing other stunts, and engaging in mounted combat.
              ### Rank Benefits
              ▶ **Rank 3 [Critical Failure]:** The animal trips (damage as an Extremely Short fall for both).
              - **Failure:** The animal refuses to perform.

              **Horizontal Leaps:**
              - **Ordinary:** Normal distance + 1 meter.
              - **Good:** Normal distance + 2 meters.
              - **Amazing:** Normal distance + 3 meters.

              **Jumping Obstructions:**
              - **Ordinary:** Normal distance + 1 meter.
              - **Good:** Normal distance + 1.5 meters.
              - **Amazing:** Normal distance + 2 meters.

              **Moving Backward:**
              - **Ordinary:** Half walk movement rate.
              - **Good:** Full walk movement rate.
              - **Amazing:** 1.5x walk movement rate.

              **Mounted Cover:** The character can use their mount for cover. This provides a penalty to an opponent's chance to hit the rider:
              - **Ordinary:** +1 step.
              - **Good:** +2 steps.
              - **Amazing:** +3 steps.

              *Note: This does not protect the mount. Trick riding cannot be combined with other actions (e.g., attacking while leaping).*
        - es:
            name: Montar Animales
            description: |-
              This specialty skill enables a personaje to improve this aspect of the Animal Handling broad skill. A personaje with this skill can attempt racing over dangerous terrain, making jumps or performing other stunts, and engaging in mounted combat.

              ▶ At rango 3 the personaje learns to perform special stunts or tricks while mounted. See trick riding.

              ### Trick Riding
              The personaje can direct their mount to jump fences, leap chasms, or move backward.
              - **Fallo Crítico:** The animal trips (damage as an Extremely Short fall for both).
              - **Fallo:** The animal refuses to perform.

              **Horizontal Leaps:**
              - **Ordinario:** Normal distance + 1 meter.
              - **Bueno:** Normal distance + 2 meters.
              - **Asombroso:** Normal distance + 3 meters.

              **Jumping Obstructions:**
              - **Ordinario:** Normal distance + 1 meter.
              - **Bueno:** Normal distance + 1.5 meters.
              - **Asombroso:** Normal distance + 2 meters.

              **Moving Backward:**
              - **Ordinario:** Half walk movement rate.
              - **Bueno:** Full walk movement rate.
              - **Asombroso:** 1.5x walk movement rate.

              **Mounted Cover:** The personaje can use their mount for cover. This provides a penalización to an opponent's chance to hit the rider:
              - **Ordinario:** +1 paso.
              - **Bueno:** +2 steps.
              - **Asombroso:** +3 steps.

              *Note: This does not protect the mount. Trick riding cannot be combined with other actions (e.g., attacking while leaping).*
