  primitive-ranged-weapons:
    attribute: DEX
    cost: 7
    category: Combat
    url: /skills/primitive-ranged-weapons
    localized:
      - en:
          name: Primitive Ranged Weapons
          description: |-
            This broad skill provides a character with training in the use of primitive ranged weapons, including bows and crossbows, slings, and even primitive firearms such as flintlock pistols and rifles. Other factors that can influence the situation die used in a primitive ranged weapon attack are listed under "Ranged Weapon Attack Modifiers" in the Modern Ranged Weapons skill section.

            **Weapon Technical Knowledge**: Mastery of primitive ranged weapons goes far beyond pulling a trigger or releasing a string. Experienced practitioners — hunters, archers, and survivalists — inevitably absorb a working technical understanding of their weapons. They know how the feathering affects arrow trajectories, how the stiffness of a bow''s limbs affects draw weight, and how different materials react to humidity and damage. As well as keeping informed of the various craftsmanship and weapon types that exist. A character with the **Technical Science** broad skill can use the appropriate Primitive Ranged Weapons specialty skill for checks that involve knowing the existence (and quality) of a particular weapon, customizing weapons and ammunition, as well as recognizing, repairing, and maintaining primitive weapons in the field.

            #### TABLE: RANGE MODIFIERS BY WEAPON TYPE
            | Weapon                 | Short    | Medium  | Long     |
            | :--------------------- | :------- | :-----  | :------- |
            | Flintlock Pistol       | -1 step  | +1 step | +3 steps |
            | Bow, Crossbow, Sling   | -1 step  | None    | +2 step  |
            | Musket                 | -1 step  | None    | +1 step  |
      - es:
          name: Armas a distancia primitivas
          description: |-
            Esta amplia habilidad proporciona a un Personaje entrenamiento en el uso de Armas a distancia primitivas, incluidos arcos y ballestas, hondas e incluso armas de fuego primitivas como pistolas y rifles Arma de chispa. Los factores Otros que pueden influir en el Dado de Situación utilizado en un ataque con arma a distancia primitivo se enumeran en "Modificadores de ataque con arma a distancia" en la sección de habilidades Armas a distancia modernas.

            **Conocimiento técnico de armas**: El dominio de Armas a distancia primitivas va mucho más allá de apretar un gatillo o soltar una cuerda. Los practicantes experimentados (cazadores, arqueros y supervivientes) inevitablemente absorben una comprensión práctica de sus armas. Saben cómo el difuminado afecta las trayectorias de las flechas, cómo la rigidez de las palas de un arco afecta el peso del arco y cómo reaccionan los diferentes materiales a la humedad y los daños. Así como también mantenerse informado de las diversas artesanías y tipos de armas que existen. Un Personaje con la habilidad amplia **Ciencia técnica** puede usar el Armas a distancia primitivas Especialidad apropiado para comprobaciones que implican conocer la existencia (y calidad) de un arma en particular, personalizar armas y municiones, así como reconocer, reparar y mantener armas primitivas en el campo.

            #### TABLA: MODIFICADORES DE ALCANCE POR TIPO DE ARMA
            | Arma | Corto | Medio | Largo |
            | :--------------------- | :------- | :----- | :------- |
            | Pistola de chispa | -1 paso | +1 paso | +3 pasos |
            | Arco, Ballesta, Honda | -1 paso | Ninguno | +2 paso |
            | Mosquete | -1 paso | Ninguno | +1 paso |
    items:
      bow:
        attribute: DEX
        cost: 3
        url: /skills/primitive-ranged-weapons#bow
        localized:
          - en:
              name: Bow
              description: |-
                With the bow skill, a character can become proficient with long bows and short bows. Although there are significant differences between them See [Weapons]({{< relref "equipment/weapons" >}}) section for more information.

                ### Rank Benefits
                ⊗ **Rank 3 [Distance Precision]** When a character reaches rank 3 in this specialty, he knows how to compensate for distance. The step penalty for a medium-range shot is eliminated, and the penalty for a long-range shot is lessened by 1 step.

                ▶ **Rank 6 [Double-Shot]** When a character reaches rank 6 in this specialty, he becomes able to fire his weapon twice in the same action. A double-shot works as follows: First, the base modifier for the attack is determined. Then the character rolls the control die and two situation dice to make his double-shot attack. The first situation die is the base modifier needed to make an attack with an additional **+1 step penalty**; the second is the base modifier with an additional **+2 step penalty**. When two targets are involved, the base modifier for the attack is that of the more difficult target. A character using a bow can aim at two different targets.

                * **Example of double-shot:** Darsen has the double-shot special attack benefit and a skill score of 14. His base situation die after all modifiers have been considered is +d4. He rolls a control die (d20), a +d6, and a +d8. The numbers 11, 4, and 2 come up on the dice. This gives Darsen skill check results of 15 (11 + 4) and 13 (11 + 2). The first shot misses its target, but the second one scores an Ordinary hit.
          - es:
              name: Arco
              description: |-
                Con la habilidad con el arco, un Personaje puede volverse competente con arcos largos y cortos. Aunque existen diferencias significativas entre ellos. Consulta la sección [Weapons]({{< relref "equipment/weapons" >}})] para obtener más información.

                ### Beneficios de Rango
                ⊗ **Rango 3 [Precisión de distancia]** Cuando un Personaje alcanza Rango 3 en esta especialidad, sabe cómo compensar la distancia. Se elimina el Penalización de paso por un tiro de media distancia y la penalización por un tiro de larga distancia se reduce en 1 paso.

                ▶ **Rango 6 [Doble disparo]** Cuando un Personaje alcanza Rango 6 en esta especialidad, puede disparar su arma dos veces en la misma acción. Un doble disparo funciona de la siguiente manera: primero, se determina el modificador base para el ataque. Luego, el Personaje tira el Dado de Control y dos dados de situación para realizar su ataque de doble disparo. El primer Dado de Situación es el modificador base necesario para realizar un ataque con un **+1 Penalización de paso** adicional; el segundo es el modificador base con un **+2 Penalización de paso** adicional. Cuando hay dos objetivos involucrados, el modificador base para el ataque es el del objetivo más difícil. Un Personaje que usa un arco puede apuntar a dos objetivos diferentes.

                * **Ejemplo de doble disparo:** Darsen tiene el beneficio de ataque especial de doble disparo y una puntuación de habilidad de 14. Su Dado de Situación base después de haber considerado todos los modificadores es +d4. Tira un Dado de Control (d20), un +d6 y un +d8. En los dados aparecen los números 11, 4 y 2. Esto le da a Darsen resultados de prueba de habilidades de 15 (11 + 4) y 13 (11 + 2). El primer disparo no da en el blanco, pero el segundo logra un impacto Ordinario.
