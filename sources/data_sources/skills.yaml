              description: |-
                The talent for playing roles and impersonation.

                ### Rank Benefits
                ▶ **Rank 4 [Disguise]** The ability to use makeup and techniques to change appearance. Applying a disguise is a **complex skill check**. Success determines the penalty (+1 to +3) to observers' Awareness checks to see through it. Contrary to the Deception-Disguise this skill allows to impersonate someone, copying mannerism and voice. Not just look different to not be recognized.

                ⊗ **Rank 1, 4, 8, 12 [Skill Synergy]** Entertainment specialties can be combined with other skills for greater effect. The character receives a situation die bonus to the supported skill:
                - **Rank 1:** -1 step bonus.
                - **Rank 4:** -2 steps bonus.
                - **Rank 8:** -3 steps bonus.
                - **Rank 12:** -4 steps bonus.
                *Examples: Act + Seduce; Dance + Pickpocket; Sing + Taunt; Instrument + Inspire.*
          - es:
              name: Musical instrument
              description: |-
                El talento para interpretar papeles y personificar.

                ### Beneficios de Rango
                ▶ **Rango 4 [Disfraz]** La capacidad de usar maquillaje y técnicas para cambiar la apariencia. Aplicar un disfraz es una **prueba de habilidad compleja**. El éxito determina la penalización (+1 a +3) a las pruebas Alerta de los observadores para ver a través de él. A diferencia del Engaño-Disguise, esta habilidad permite hacerse pasar por alguien, copiando gestos y voz. No sólo verse diferente para no ser reconocido.

                ⊗ **Rango 1, 4, 8, 12 [Skill Synergy]** Las especialidades de entretenimiento se pueden combinar con las habilidades Otros para lograr un mayor efecto. El Personaje recibe una bonificación Dado de Situación a la habilidad admitida:
                - **Rango 1:** -1 Bonificación de paso.
                - **Rango 4:** -Bono de 2 pasos.
                - **Rango 8:** -Bonificación de 3 pasos.
                - **Rango 12:** -Bono de 4 pasos.
                *Ejemplos: Actuar + Seducir; Danza + Carterista; Cantar + Burlarse; Instrumento + Inspirar.*
        trained_only: false
