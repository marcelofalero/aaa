items:
  Biokinesis:
    attribute: CON
    url: /psionics/biokinesis/
    cost: 6
    localized:
    - en:
        name: Biokinesis
        description: Manipulate the user's or another living being's biology and physiology.
    - es:
        name: Biokinesis
        description: Manipula la biología y fisiología del usuario o de otro ser vivo.
    items:
      bio-armor:
        attribute: CON
        cost: 3
        url: /psionics/biokinesis/#bio-armor
        localized:
        - en:
            name: Bio-armor
            description: |-
              This skill psionically reinforces a character's skin, helping to protect from damage. This "body armor" provides protection against physical and energy damage, but does not protect against psionic attacks. (See Telepathy for ways to avoid psionic attacks.)

              The protection afforded by bio-armor is based on the user's skill check:

              | Result | LI | HI | En |
              | :--- | :---: | :---: | :---: |
              | **Ordinary** | d4 | d4–1 | d4–1 |
              | **Good** | d6 | d6–1 | d6–1 |
              | **Amazing** | d6+1 | d6 | d6 |

              **Increased Effect:**
              - **At rank 3**, the protection afforded by bio-armor increases by 1 point (add 1 to whatever is rolled on the table above).
              - **At rank 6**, this value further increases by 1 point (a total of +2).
              - **At rank 9**, the armor is treated as being of Good toughness.
              - **At rank 12**, the armor value increases again by 1 point (a total of +3).

              ---
        - es:
            name: Bioarmadura
            description: |-
              Esta habilidad refuerza psiónicamente la piel de un personaje, ayudando a protegerlo del daño. Esta "armadura corporal" proporciona protección contra daños físicos y de energía, pero no protege contra ataques psiónicos. (Consulta Telepatía para conocer formas de evitar los ataques psiónicos).

              La protección proporcionada por la bioarmadura se basa en la tirada de habilidad del usuario:

              | Resultado | LI | HI | En |
              | :--- | :---: | :---: | :---: |
              | **Ordinario** | d4 | d4–1 | d4–1 |
              | **Bueno** | d6 | d6–1 | d6–1 |
              | **Asombroso** | d6+1 | d6 | d6 |

              **Efecto Incrementado:**
              - **Al rango 3**, la protección proporcionada por la bioarmadura aumenta en 1 punto (añade 1 a lo que se tire en la tabla anterior).
              - **Al rango 6**, este valor aumenta de nuevo en 1 punto (un total de +2).
              - **Al rango 9**, la armadura se trata como si tuviera Dureza Buena (Good toughness).
              - **Al rango 12**, el valor de la armadura aumenta una vez más en 1 punto (un total de +3).

              ---
        trained_only: true
      bioweapon:
        attribute: CON
        cost: 3
        url: /psionics/biokinesis/#bioweapon
        localized:
        - en:
            name: Bioweapon
            description: "When employing this skill, a character generates a field\
              \ of kinetic energy emanating from his or her hands. This energy manifests\
              \ in one of two ways, to be chosen by the player at the time the character\
              \ makes a successful skill check: a staff or a sword.\n\nThe player\
              \ may alter the shape of the staff to a club, and the sword to a particular\
              \ type of sword (katana, saber, broadsword, and so on). These changes\
              \ neither damage the bioweapon will do, nor do they grant any special\
              \ properties to the weapon; they are cosmetic only.\n\nThe principal\
              \ difference in the two forms is in the sort of damage they do. A character\
              \ who wishes just to knock out an opponent would be best served creating\
              \ a staff; those who mean to inflict more serious harm on an opponent\
              \ will likely create the sword.\n\n| Form | Base Damage | Type |\n|\
              \ :--- | :--- | :---: |\n| **Staff** | d8s/d8+2s/d12+2s | LI/O |\n|\
              \ **Sword** | d6w/d6+2w/d6m | LI/O |\n\nThe character uses one of two\
              \ skills to wield the bioweapon: **Melee Weapons—bludgeon** for the\
              \ staff or **Melee Weapons—blade** for the sword. \n\nThe result of\
              \ the bioweapon skill check may add a bonus to the appropriate Melee\
              \ Weapon skill check as follows:\n- **Ordinary:** –1 step bonus\n- **Good:**\
              \ –2 step bonus\n- **Amazing:** –3 step bonus\n\nThis bonus lasts until\
              \ the character chooses not to maintain the bioweapon.\n\n**Increased\
              \ Damage:** \n- **At rank 3**, the damage of the bioweapon increases\
              \ by +1.\n- **At rank 6**, it increases again (to a total of +2).\n\
              - **At rank 9**, it increases by another +1 (to a total of +3).\n- **At\
              \ rank 12**, all attacks made with the bioweapon are considered to deliver\
              \ **Good damage**.\n\n---"
        - es:
            name: Bioarma
            description: |-
              Al emplear esta habilidad, un personaje genera un campo de energía cinética que emana de sus manos. Esta energía se manifiesta de una de dos maneras, que el jugador debe elegir en el momento en que el personaje realiza con éxito una prueba de habilidad: una vara o una espada.

              El jugador puede alterar la forma de la vara para que sea un mazo, y la de la espada para que sea de un tipo particular (katana, sable, espada ancha, etc.). Estos cambios no afectan el daño que causará la bioarma ni le otorgan ninguna propiedad especial; son puramente cosméticos.

              La principal diferencia entre las dos formas está en el tipo de daño que causan. Un personaje que solo desee noquear a un oponente haría mejor en crear una vara; aquellos que pretendan infligir un daño más serio probablemente crearán la espada.

              | Forma | Daño Base | Tipo |
              | :--- | :--- | :---: |
              | **Vara** | d8s/d8+2s/d12+2s | LI/O |
              | **Espada** | d6w/d6+2w/d6m | LI/O |

              El personaje utiliza una de dos habilidades para blandir la bioarma: **Combate cuerpo a cuerpo (Melee Weapons)—contundente** para la vara o **Combate cuerpo a cuerpo (Melee Weapons)—filo** para la espada.

              El resultado de la tirada de habilidad de la bioarma puede añadir una bonificación a la tirada de la habilidad de armas cuerpo a cuerpo correspondiente de la siguiente manera:
              - **Ordinario:** bonificación de –1 paso
              - **Bueno:** bonificación de –2 pasos
              - **Asombroso:** bonificación de –3 pasos

              Esta bonificación dura hasta que el personaje decida no seguir manteniendo la bioarma.

              **Daño Incrementado:**
              - **Al rango 3**, el daño de la bioarma aumenta en +1.
              - **Al rango 6**, aumenta de nuevo (hasta un total de +2).
              - **Al rango 9**, aumenta otro +1 (hasta un total de +3).
              - **Al rango 12**, todos los ataques realizados con la bioarma se consideran para infligir **daño Bueno** (Good damage).

              ---
        trained_only: true
      clamber:
        attribute: CON
        cost: 2
        url: /psionics/biokinesis/#clamber
        localized:
        - en:
            name: Clamber
            description: |-
              In the distant past, certain t'sa psions developed the **clamber** skill—usually those who dwelled in the mountainous regions of the t'sa homeworld. With it, the psionic t'sa (or a psion trained by t'sa) generates thousands of tiny suckers on the palms of his hands and the soles of his or her feet. The character can then move up and down nearly vertical surfaces with ease, and can even move across inverted surfaces for short distances. In the steep mountains of the t'sa homeworld, this often meant survival.

              The degree of success with this skill determines the modifier to a psion's **Athletics—climb** attempt. The psion gains a **–1, –2, or –3 step bonus**, depending on the degree of success (Ordinary, Good, or Amazing). Further, if the distance is within the user's walk rate, the character can dash across inverted surfaces, effectively running across the ceiling. The character cannot stop or change direction before traveling the full distance without falling. The same will happen if the character has nothing to hold onto on reaching his or her destination.

              **Rank Benefits:**
              - **At rank 4 [Increased Distance]**, the distance the user can travel while climbing or running across inverted surfaces is doubled.
              - **At rank 8**, the distance is three times the base rate.
              - **At rank 12**, the distance is four times the base rate.

              ---
        - es:
            name: Trepado
            description: |-
              En un pasado lejano, ciertos psiónicos t'sa desarrollaron la habilidad de **trepado**, normalmente los que vivían en las regiones montañosas del planeta de origen de los t'sa. Con ella, el t'sa psiónico (o un psiónico entrenado por los t'sa) genera miles de minúsculas ventosas en las palmas de sus manos y en las plantas de sus pies. El personaje puede entonces subir y bajar por superficies casi verticales con facilidad, e incluso desplazarse por superficies invertidas en distancias cortas. En las escarpadas montañas del planeta t'sa, esto significaba a menudo la supervivencia.

              El grado de éxito con esta habilidad determina el modificador de un intento de **Atletismo—trepar** del psiónico. El psiónico obtiene una **bonificación de –1, –2 ó –3 pasos**, dependiendo del grado de éxito (Ordinario, Bueno o Asombroso). Además, si la distancia está dentro de la velocidad de paso del usuario, el personaje puede correr por superficies invertidas, corriendo de hecho por el techo. El personaje no puede detenerse ni cambiar de dirección antes de recorrer toda la distancia sin caerse. Lo mismo ocurrirá si el personaje no tiene nada a lo que agarrarse al llegar a su destino.

              **Beneficios de Rango:**
              - **Al rango 4 [Distancia Incrementada (Increased Distance)]**, la distancia que el usuario puede recorrer mientras trepa o corre por superficies invertidas se duplica.
              - **Al rango 8**, la distancia es el triple de la velocidad base.
              - **Al rango 12**, la distancia es cuatro veces la velocidad base al rango 12.

              ---
        trained_only: false
      control-metabolism:
        attribute: CON
        cost: 2
        url: /psionics/biokinesis/#control-metabolism
        localized:
        - en:
            name: Control Metabolism
            description: "Through the use of this skill, a character can regulate\
              \ his or her metabolic processes. This allows longer survival without\
              \ food and water, in extreme climates, and in other hostile conditions.\
              \ The character can also slow bodily functions to the point of pretending\
              \ to be dead, should he or she need to fool others in some situation.\n\
              \nA check is made when a character enters a hostile environment or otherwise\
              \ wants to employ this skill.\n\n#### Hostile Environments\nIn the case\
              \ of a hostile environment, the result of a skill check determines the\
              \ type of protection a character can simulate:\n- **Ordinary:** vacuum\
              \ mask\n- **Good:** vacuum suit\n- **Amazing:** soft e-suit\n\nAfter\
              \ the initial use of the skill, the level of protection can be maintained\
              \ thereafter for a cost of 1 psionic energy point per hour.\n\n####\
              \ Adrenal boost\n*Extended duration.*\nThe character can mentally boost\
              \ adrenaline output, giving an action check bonus. \n- **Ordinary:**\
              \ +1 to action check score.\n- **Good:** +2 to action check score.\n\
              - **Amazing:** +3 to action check score.\n\nThis bonus lasts for the\
              \ duration of the round in which the power is activated and through\
              \ all of the next round. A character may extend the duration 1 round\
              \ for every psionic energy point spent to do so.\n\n#### Endorphin release\n\
              *Extended duration.*\nThe character can mentally stimulate the production\
              \ of endorphins, increasing his or her resistance to pain and fatigue.\n\
              - **Ordinary:** -1 step bonus to Stamina checks.\n- **Good:** -2 step\
              \ bonus to Stamina checks.\n- **Amazing:** -3 step bonus to Stamina\
              \ checks.\n\nThe duration is one hour; the duration may be extended\
              \ by one hour per extra psionic energy point spent to do so.\n\n---"
        - es:
            name: Control del Metabolismo
            description: |-
              A través del uso de esta habilidad, un personaje puede regular sus procesos metabólicos. Esto permite una supervivencia más prolongada sin comida ni agua, en climas extremos y en otras condiciones hostiles. El personaje también puede ralentizar sus funciones corporales hasta el punto de fingir que está muerto, si necesita engañar a otros en alguna situación.

              Se realiza una tirada cuando un personaje entra en un entorno hostil o si desea emplear esta habilidad de alguna otra manera.

              #### Entornos Hostiles
              En el caso de un entorno hostil, el resultado de una tirada de habilidad determina el tipo de protección que un personaje puede simular:
              - **Ordinario:** máscara de vacío
              - **Bueno:** traje de vacío (vacuum suit)
              - **Asombroso:** traje electrónico ligero (soft e-suit)

              Después del uso inicial de la habilidad, el nivel de protección se puede mantener posteriormente a un coste de 1 punto de energía psiónica por hora.

              #### Impulso de adrenalina (Adrenal boost)
              *Duración extendida.*
              El personaje puede aumentar mentalmente la producción de adrenalina, otorgando una bonificación a las tiradas de acción.
              - **Ordinario:** +1 a la puntuación de la tirada de acción.
              - **Bueno:** +2 a la puntuación de la tirada de acción.
              - **Asombroso:** +3 a la puntuación de la tirada de acción.

              Esta bonificación dura lo que reste del asalto en el que se activó el poder y todo el asalto siguiente. Un personaje puede extender la duración 1 asalto por cada punto de energía psiónica gastado para ello.

              #### Liberación de endorfinas (Endorphin release)
              *Duración extendida.*
              El personaje puede estimular mentalmente la producción de endorfinas, aumentando su resistencia al dolor y la fatiga.
              - **Ordinario:** bonificación de –1 paso a las tiradas de Firmeza (Stamina).
              - **Bueno:** bonificación de –2 pasos a las tiradas de Firmeza (Stamina).
              - **Asombroso:** bonificación de –3 pasos a las tiradas de Firmeza (Stamina).

              La duración es de una hora; la duración puede extenderse una hora más por cada punto de energía psiónica adicional gastado para ello.

              ---
        trained_only: false
      heal:
        attribute: CON
        cost: 4
        url: /psionics/biokinesis/#heal
        trained_only: true
        localized:
        - en:
            name: Heal
            description: "By concentrating, a character using this skill can heal\
              \ wounds or disease. How much damage can be healed depends on the result\
              \ of a skill check:\n- **Ordinary:** 1 wound point\n- **Good:** 2 points\n\
              - **Amazing:** 3 points\n\n#### Disease\nFor disease, the following\
              \ results apply:\n- **Ordinary:** reduce the degree of illness by one\
              \ grade (from Good to Ordinary, for instance).\n- **Good:** reduce by\
              \ two grades.\n- **Amazing:** reduce by three grades. \nDiseases reduced\
              \ below Marginal are considered cured.\n\n#### Timing\nPsionic healing\
              \ requires time. The results are immediate, but the body's reaction\
              \ to the use of the skill lasts one hour. For this reason, the heal\
              \ skill can't be attempted more than once per hour, even if the check\
              \ result is a Failure.\n\n**Rank Benefits:**\n- **At rank 4 [Treating\
              \ Poison]**, a character may counteract the effect of poisons or drugs\
              \ in his or her system before the end of their onset time, reducing\
              \ the impact they may have. The degree of success acts as a bonus to\
              \ the Constitution feat check required: **Ordinary:** –2 step bonus,\
              \ **Good:** –3 step bonus, **Amazing:** –4 step bonus.\n- **At rank\
              \ 6 [Healing Mortal Damage]**, a character becomes able to heal mortal\
              \ damage. Skill check results change to: **Ordinary:** 2 wounds, **Good:**\
              \ 3 wounds or 1 mortal, **Amazing:** 4 wounds or 2 mortals.\n- **At\
              \ rank 8 [Improved Effect]**, a character's ability to heal improves\
              \ further: **Ordinary:** 3 wounds or 1 mortal, **Good:** 4 wounds or\
              \ 2 mortals, **Amazing:** 6 wounds or 3 mortals.\n- **At rank 8 [Laying\
              \ On Hands]**, a character becomes able to heal damage in others. The\
              \ subject to be healed must be in physical contact with the character\
              \ using this ability.\n\n---"
        - es:
            name: Sanar
            description: |-
              Al concentrarse, un personaje puede curarse a sí mismo el daño por heridas o una enfermedad. La cantidad de daño que puede curarse depende del resultado de una tirada de habilidad:
              - **Ordinario:** 1 punto de herida
              - **Bueno:** 2 puntos de herida
              - **Asombroso:** 3 puntos de herida

              #### Enfermedad
              Para las enfermedades, se aplican los siguientes resultados:
              - **Ordinario:** reduce el grado de la enfermedad en un nivel (de Bueno a Ordinario, por ejemplo).
              - **Bueno:** reduce en dos niveles.
              - **Asombroso:** reduce en tres niveles.
              Las enfermedades reducidas por debajo de Marginal se consideran curadas.

              #### Tiempos
              La curación psiónica requiere tiempo. Los resultados son inmediatos, pero la reacción del cuerpo al uso de la habilidad dura una hora. Por esta razón, la habilidad de sanar no se puede intentar más de una vez por hora, incluso si el resultado de la tirada es un Fallo.

              **Beneficios de Rango:**
              - **Al rango 4 [Tratar Venenos]**, un personaje puede contrarrestar el efecto de venenos o drogas en su sistema antes de que finalice su tiempo de reacción, reduciendo el impacto que puedan tener. El grado de éxito actúa como una bonificación a la tirada de dote de Constitución requerida: **Ordinario:** bonificación de –2 pasos, **Bueno:** bonificación de –3 pasos, **Asombroso:** bonificación de –4 pasos.
              - **Al rango 6 [Curar Daño Mortal]**, un personaje es capaz de curar el daño mortal. Los resultados de la tirada cambian a: **Ordinario:** 2 heridas, **Bueno:** 3 heridas o 1 mortal, **Asombroso:** 4 heridas o 2 mortales.
              - **Al rango 8 [Efecto Mejorado]**, la capacidad de curación del personaje mejora aún más: **Ordinario:** 3 heridas o 1 mortal, **Bueno:** 4 heridas o 2 mortales, **Asombroso:** 6 heridas o 3 mortales.
              - **Al rango 8 [Imposición de manos]**, un personaje se vuelve capaz de curar el daño en otros. El sujeto a ser curado debe estar en contacto físico con el personaje que utiliza esta habilidad.

              ---
      intangibility:
        attribute: CON
        cost: 4
        url: /psionics/biokinesis/#intangibility
        localized:
        - en:
            name: Intangibility
            description: |-
              By mentally reordering the molecules of his or her body, the character can concentrate and become immaterial and thus pass through solid objects. This ability affects the character's clothing (including light armor—any armor that does not require the Armor Operation skill) and up to one kilogram per skill rank of additional equipment carried in the hands.

              Intangibility lasts for one phase, plus one additional phase per psionic energy point spent to maintain it.

              An intangible character appears as a slightly less vivid, three-dimensional image of himself or herself, which others can see but not otherwise perceive.

              The character can move about as normal, though passing through solid objects slows the character to the "easy swim" rate. The character cannot pass through living matter (although he may pass through organic matter—the wood of a door, for example).

              While intangible, the character falls at a greatly reduced rate: roughly three meters per phase. A character could leap off a building and land as if he were a feather. Falling 20 meters while intangible requires eight psionic energy points: one to activate it, and one more per three meters of distance fallen.

              **Rank Benefits:**
              - **At rank 4 [Movement Bonus]**, the character can move through solid objects at the **walk rate**.
              - **At rank 6 [Dodge]**, the character can "dodge attacks" by becoming intangible. This is accomplished in the same fashion as a reaction parry.
              - **At rank 8 [Movement Bonus]**, the character can move through solid objects at the **run rate**.
              - **At rank 12 [Selective Intangibility]**, the character can choose to render only part of his or her body intangible. Doing so adds a +2 step penalty to the skill check, and if the character attempts to touch or otherwise manipulate a solid object while only partially tangible, this modifier increases up to +4.

              ---
        - es:
            name: Intangibilidad
            description: |-
              Al reordenar mentalmente las moléculas de su cuerpo, el personaje puede concentrarse y volverse inmaterial, y así atravesar objetos sólidos. Esta habilidad afecta a la ropa del personaje (incluyendo la armadura ligera—cualquier armadura que no requiera la habilidad de Operación de Armaduras) y hasta un kilogramo por rango de habilidad de equipo adicional que se lleve en las manos.

              La intangibilidad dura una fase, más una fase adicional por cada punto de energía psiónica gastado para mantenerla.

              Un personaje intangible aparece como una imagen tridimensional de sí mismo, ligeramente menos vívida, que otros pueden ver pero no percibir de otra manera.

              El personaje puede moverse de forma normal, aunque atravesar objetos sólidos lo ralentiza a un ritmo de "nado suave" (easy swim). El personaje no puede atravesar materia viva (aunque sí materia orgánica—la madera de una puerta, por ejemplo).

              Mientras sea intangible, el personaje cae a un ritmo muy reducido: aproximadamente tres metros por fase. Un personaje podría saltar desde un edificio y aterrizar como si fuera una pluma. Caer 20 metros mientras se es inmaterial requiere ocho puntos de energía psiónica: uno para activarla y uno más por cada tres metros de distancia caída.

              **Beneficios de Rango:**
              - **Al rango 4 [Bonificación de Movimiento]**, el personaje puede moverse a través de objetos sólidos a **ritmo de caminata** (walk rate).
              - **Al rango 6 [Esquivar]**, el personaje puede "esquivar ataques" volviéndose intangible. Esto se logra de la misma manera que un desvío (parry) de reacción.
              - **Al rango 8 [Bonificación de Movimiento]**, el personaje puede moverse a través de objetos sólidos a **ritmo de carrera** (run rate).
              - **Al rango 12 [Intangibilidad Selectiva]**, el personaje puede elegir volver inmaterial solo una parte de su cuerpo. Hacerlo añade una penalización de +2 pasos a la tirada de habilidad, y si el personaje intenta tocar o manipular un objeto sólido mientras es solo parcialmente tangible, este modificador aumenta hasta +4.

              ---
        trained_only: true
      morph:
        attribute: CON
        cost: 4
        url: /psionics/biokinesis/#morph
        trained_only: true
        localized:
        - en:
            name: Morph
            description: "By using this skill, a character can alter his or her physical\
              \ features so as to be disguised or to accomplish something otherwise\
              \ impossible, such as squeeze into a small hole, reach higher than his\
              \ or her height normally allows, or slip loose of bonds.\n\nMorphing\
              \ requires an entire round (4 phases) to complete, from the moment the\
              \ skill is activated to the moment the alteration is finished. The character\
              \ can do nothing else while this process is taking place.\n\nThe initial\
              \ skill check determines how long the morphed form lasts:\n- **Ordinary:**\
              \ 1 round\n- **Good:** 2 rounds\n- **Amazing:** 3 rounds\n\nThereafter,\
              \ a character can extend the duration by spending 1 psionic energy point\
              \ per round (or other time unit as designated by the Gamemaster).\n\n\
              A morphed body part retains its original characteristics; no game statistics\
              \ change, except for those directly related to the morphing. Morphing\
              \ has no effect on a character's clothing or possessions.\n\n**Rank\
              \ Benefits:** \n- **At rank 1 and 3**, select one of these forms:\n\
              \    - **Elongate fingers:** add +0.5 meters to reach (for example,\
              \ to get -1 step bonus to Manipulation-pickpocket skill checks).\n \
              \   - **Elongate arms:** add +1 meter to reach.\n    - **Elongate legs:**\
              \ add +1 meter to height.\n- **At skill ranks 5 and 7**, choose one\
              \ of these forms:\n    - **Disguise:** alter facial features to hide\
              \ identity (+2 step penalty to Awareness checks involving an attempt\
              \ to recognize the character).\n    - **Elongate arms and legs** simultaneously.\n\
              \    - **Skeleton alterations:** alter entire body and bone construction\
              \ to allow passage through small openings (as small as one-half meter\
              \ wide).\n- **At skill ranks 10 and 12**, choose one of these forms:\n\
              \    - **Improved disguise:** alter facial and body features to resemble\
              \ a specific person (+2 step penalty to Awareness checks) or to completely\
              \ hide identity (+4 step penalty).\n    - **Lessen damage:** become\
              \ so flexible and malleable as to reduce the effects of low-impact damage.\
              \ A skill check determines how much damage is reduced (at no extra PP\
              \ cost): **Ordinary:** d4, **Good:** d4+2, **Amazing:** d6+2.\n- **At\
              \ rank 12**, the character can select one of these benefits:\n    -\
              \ **Morph control:** activate any two forms simultaneously.\n\n---"
        - es:
            name: Metamorfosis
            description: "Mediante el uso de esta habilidad, un personaje puede alterar\
              \ sus rasgos físicos para disfrazarse o para lograr algo que de otro\
              \ modo sería imposible, como apretujarse en un agujero pequeño, llegar\
              \ más alto de lo que su estatura permite normalmente o soltarse de unas\
              \ ataduras.\n\nLa metamorfosis requiere un asalto entero (4 fases) para\
              \ completarse, desde el momento en que se activa la habilidad hasta\
              \ el momento en que finaliza la alteración. El personaje no puede hacer\
              \ nada más mientras se lleva a cabo este proceso.\n\nLa tirada de habilidad\
              \ inicial determina cuánto tiempo dura la forma metamorfoseada:\n- **Ordinario:**\
              \ 1 asalto\n- **Bueno:** 2 asaltos\n- **Asombroso:** 3 asaltos\n\nA\
              \ partir de entonces, el personaje puede ampliar la duración gastando\
              \ 1 punto de energía psiónica por asalto (u otra unidad de tiempo designada\
              \ por el Director de Juego).\n\nUna parte del cuerpo metamorfoseada\
              \ conserva sus características originales; no cambia ninguna estadística\
              \ de juego, excepto las directamente relacionadas con la metamorfosis.\
              \ La metamorfosis no tiene ningún efecto sobre la ropa o las posesiones\
              \ del personaje.\n\n**Beneficios de Rango:** \n- **A los rangos 1 y\
              \ 3**, selecciona una de estas formas:\n    - **Alargar dedos:** añade\
              \ +0.5 metros al alcance (por ejemplo, para obtener una bonificación\
              \ de -1 paso a las tiradas de la habilidad Manipulación—robaperlar).\n\
              \    - **Alargar brazos:** añade +1 metro al alcance.\n    - **Alargar\
              \ piernas:** añade +1 metro a la altura.\n- **A los rangos de habilidad\
              \ 5 y 7**, elige una de estas formas:\n    - **Disfrazarse:** altera\
              \ los rasgos faciales para ocultar la identidad (penalización de +2\
              \ pasos a las tiradas de Alerta que impliquen un intento de reconocer\
              \ al personaje).\n    - **Alargar brazos y piernas** simultáneamente.\n\
              \    - **Alteraciones del esqueleto:** altera todo el cuerpo y la estructura\
              \ ósea para permitir el paso a través de aberturas pequeñas (tan pequeñas\
              \ como medio metro de ancho).\n- **A los rangos de habilidad 10 y 12**,\
              \ elige una de estas formas:\n    - **Disfraz mejorado:** altera los\
              \ rasgos faciales y corporales para parecerse a una persona específica\
              \ (penalización de +2 pasos a la Alerta) o para ocultar completamente\
              \ la identidad (penalización de +4 pasos).\n    - **Reducir daño:**\
              \ volverse tan flexible y maleable que reduzca los efectos del daño\
              \ de bajo impacto. Una tirada de habilidad determina cuánto daño se\
              \ reduce (sin coste adicional de PP): **Ordinario:** d4, **Bueno:**\
              \ d4+2, **Asombroso:** d6+2.\n- **Al rango 12**, el personaje puede\
              \ seleccionar uno de estos beneficios:\n    - **Control de metamorfosis:**\
              \ activar dos formas cualesquiera simultáneamente.\n\n---"
      rejuvenate:
        attribute: CON
        cost: 3
        url: /psionics/biokinesis/#rejuvenate
        localized:
        - en:
            name: Rejuvenate
            description: |-
              When using this skill, a character can offset fatigue or stun damage, or some of each, that he or she has suffered. The skill does nothing to alleviate psionic energy loss.

              A successful skill check provides the character with a certain number of "rejuvenation points." It costs 2 of these points to restore 1 point of fatigue damage, and 1 of these points to restore 1 point of stun damage. On an Ordinary success, the character receives 2 "rejuvenation points"; on a Good success, 4 points; and on an Amazing success, 6 points. The character can use these points in any combination to restore stun points, fatigue points, or some of each. "Rejuvenation points" that can't be used immediately are lost.

              Psionic rejuvenation requires time. The results are immediate, but the body's reaction to the use of the skill lasts one hour. For this reason, the rejuvenate skill can't be attempted more than once per hour.

              **Rank Benefits:**
              - **At rank 4 [Improved Effect]**, the effect of a successful skill roll improves as follows: **Ordinary:** 4 points, **Good:** 6 points, **Amazing:** 8 points.
              - **At rank 8 [Laying On Hands]**, a character becomes able to heal fatigue or stun damage in others. The subject to be healed must be in physical contact with the character using this ability.
              - **At rank 12 [Two Recipients]**, a character using rejuvenate may affect two individuals with a single use of the skill. This can be on two other people or on the character and one other person. Each gains whatever benefit is determined by the Biokinesis-rejuvenate skill check.

              ---
        - es:
            name: Rejuvenecer
            description: |-
              Al usar esta habilidad, un personaje puede compensar la fatiga o el daño por aturdimiento, o una parte de cada uno, que haya sufrido. La habilidad no hace nada para aliviar la pérdida de energía psiónica.

              Una tirada de habilidad de éxito proporciona al personaje un cierto número de "puntos de rejuvenecimiento". Cuesta 2 de estos puntos restaurar 1 punto de daño por fatiga y 1 de estos puntos para restaurar 1 punto de daño por aturdimiento. En un éxito Ordinario, el personaje recibe 2 "puntos de rejuvenecimiento"; en un éxito Bueno, 4 puntos; y en un éxito Asombroso, 6 puntos. El personaje puede usar estos puntos en cualquier combinación para restaurar puntos de aturdimiento, puntos de fatiga o parte de cada uno. Los "puntos de rejuvenecimiento" que no puedan usarse inmediatamente se perderán.

              El rejuvenecimiento psiónico requiere tiempo. Los resultados son inmediatos, pero la reacción del cuerpo al uso de la habilidad dura una hora. Por esta razón, la habilidad de rejuvenecer no se puede intentar más de una vez por hora.

              **Beneficios de Rango:**
              - **Al rango 4 [Efecto Mejorado]**, la eficacia de una tirada de habilidad exitosa mejora de la siguiente manera: **Ordinario:** 4 puntos, **Bueno:** 6 puntos, **Asombroso:** 8 puntos.
              - **Al rango 8 [Imposición de manos]**, un personaje se vuelve capaz de curar la fatiga o el daño por aturdimiento en otros. El sujeto a ser curado debe estar en contacto físico con el personaje que utiliza esta habilidad.
              - **Al rango 12 [Dos Destinatarios]**, un personaje que utilice rejuvenecer puede afectar a dos individuos con un solo uso de la habilidad. Esto puede ser en otras dos personas o en el personaje y otra persona. Cada uno gana el beneficio que determine la tirada de habilidad de bioquinesis-rejuvenecer.

              ---
        trained_only: true
      shatter:
        attribute: CON
        cost: 3
        url: /psionics/biokinesis/#shatter
        localized:
        - en:
            name: Shatter
            description: |-
              Weren history tells of a clan that used armor to conquer the other clans. Having fashioned plates of crude armor from boiled marrizhe hide, this clan was despised by the other clans—but they were also unstoppable. Then came a great character—posthumously claimed by every other clan—who dueled the warlord of the armored clan for all his land, herds, and wives. In the midst of the duel, the mystery weren suddenly brought both fists down on his opponent's armored chest, and the leather plates shattered. At best an average fighter without his armor, the warlord quickly succumbed, and the weren warrior mysteriously vanished—though not, of course, without claiming his prizes.

              Weren warriors have long attempted to emulate that legendary fighter, though the only successes have been by psionics-users gifted with Biokinesis. They are able to direct bio-energy at solid surfaces—usually armor—in such a way that the surface breaks. To use this ability, the weren psion must first attempt a Biokinesis—shatter skill check. If the check is successful, the next bare-fisted blow the weren lands inflicts damage to the opponent's armor, if any, rather than than to the opponent. If the weren fails to strike armor before the end of the next round, the effect dissipates, though the character can try again.

              If the shatter skill check yielded an Ordinary result, the armor he strikes absorbs 1 fewer point of damage. On a Good result, the armor absorbs 2 fewer points of damage. And on an Amazing result, the armor absorbs 3 fewer points of damage. See Table G13: Object Armor in the Gamemaster Guide for information on how well non-armor objects absorb damage.

              **Rank Benefits:**
              - **At rank 4 [Increased Effect]**, this skill can only affect armor or objects of Ordinary toughness. At rank 4, the psion can affect armor or objects of Good toughness. At rank 8, the armor absorbs 2 fewer points of damage on an Ordinary success, 3 fewer on a Good result, and 4 fewer on an Amazing result.
              - **At rank 8**, the armor absorbs 3 fewer points of damage on an Ordinary success, 4 fewer on a Good result, and 5 fewer on an Amazing result.
              - **At rank 12**, the psion can affect objects of Amazing toughness.

              ---
        - es:
            name: Destrozar
            description: |-
              La historia weren habla de un clan que utilizó la armadura para conquistar a los demás clanes. Habiendo fabricado placas de armadura rudimentaria con piel de marrizhe hervida, este clan era despreciado por los demás clanes, pero también era imparable. Entonces llegó un gran personaje —reclamado póstumamente por todos los demás clanes— que se batió en duelo con el señor de la guerra del clan acorazado por todas sus tierras, rebaños y esposas. En medio del duelo, el misterioso weren descargó de repente ambos puños sobre el pecho acorazado de su oponente, y las placas de cuero se destrozaron. El señor de la guerra, que en el mejor de los casos era un luchador mediocre sin su armadura, sucumbió rápidamente, y el guerrero weren desapareció misteriosamente, aunque no, por supuesto, sin reclamar sus premios.

              Los guerreros weren han intentado durante mucho tiempo emular a aquel luchador legendario, aunque los únicos éxitos han sido de usuarios de psiónica dotados de Biocinesis. Son capaces de dirigir la bioenergía hacia superficies sólidas —normalmente armaduras — de tal forma que la superficie se rompa. Para utilizar esta capacidad, el psiónico weren debe intentar primero una tirada de la especialidad de Biocinesis—destrozar. Si la tirada tiene éxito, el siguiente golpe a puño descubierto (bare-fisted) que aseste el weren infligirá daño a la armadura del oponente, si la tiene, en lugar de al oponente. Si el weren no logra golpear la armadura antes del final del siguiente asalto, el efecto se disipa, aunque el personaje puede volver a intentarlo.

              Si la tirada de la habilidad destrozar arrojó un resultado Ordinario, la armadura que golpee absorberá 1 punto menos de daño. En un resultado Bueno, la armadura absorbe 2 puntos menos de daño. Y en un resultado Asombroso, la armadura absorbe 3 puntos menos de daño. Consulta la Tabla G13: Armadura de Objetos en la Guía del Director de Juego para obtener información sobre lo bien que absorben el daño los objetos que no son armaduras.

              **Beneficios de Rango:**
              - **Al rango 4 [Efecto Incrementado (Increased Effect)]**, esta habilidad sólo puede afectar a armaduras u objetos de dureza Ordinaria. Al rango 4, el psiónico puede afectar a armaduras u objetos de dureza Buena. Con un éxito Ordinario, la armadura absorbe 2 puntos menos de daño, 3 menos con un resultado Bueno y 4 menos con un resultado Asombroso.
              - **Al rango 8 [Efecto Incrementado (Increased Effect)]**, con un éxito Ordinario se absorben 3 puntos menos, 4 menos con un resultado Bueno y 5 menos con un resultado Asombroso.
              - **Al rango 12 [Efecto Incrementado (Increased Effect)]**, el usuario puede afectar a objetos de dureza Asombrosa.

              ---
        trained_only: false
      transfer-damage:
        attribute: CON
        cost: 2
        url: /psionics/biokinesis/#transfer-damage
        localized:
        - en:
            name: Transfer Damage
            description: |-
              By laying hands upon another character and making a successful skill check, the psion alleviates that character's damage or disease by absorbing it.

              The damage that can be absorbed is tied to the result of a skill check:

              | Result | Damage Absorbed | Illness Reduced |
              | :--- | :--- | :--- |
              | **Critical Failure** | Psion suffers 1 wound. | No effect. |
              | **Ordinary** | Character absorbs 1 wound. | Reduce illness by one grade (e.g., Amazing to Good), simultaneously infecting the psion with that grade. |
              | **Good** | Character absorbs 2 wounds or 1 mortal. | Reduce illness by two grades, transferring the ailment into the psion. |
              | **Amazing** | Character absorbs 3 wounds or 1 mortal. | Transfers any illness from the patient into the psion. |

              Once the character absorbs the damage or disease, he or she must either use the **Biokinesis—heal** specialty skill, heal naturally, or receive medical or psionic attention to alleviate the damage or cure the disease.

              **Rank Benefits:**
              - **At rank 6 [Displace Damage]**, the psionic character can transfer the damage to a different character, who must also be in physical contact with the psion, and who must be willing to take the damage. Any attempt to transfer the damage to a creature that does not consciously desire to accept the damage (such as a hostile character, or an unconscious one) results in the psion receiving the damage, as normal.
              - **At rank 12 [Unwilling Transfer]**, the character can transfer the damage to an unwilling character. The psion must be touching both characters. Both characters must be alive when the skill is activated. The "donor" character will be healed of a number of damage points determined by the Biokinesis—transfer damage skill check. The damage points are then applied to the unwilling recipient. **Note that this benefit isn't received if the psion is wearing armor.**
        - es:
            name: Transferir Daño
            description: |-
              Al imponer las manos sobre otro personaje y realizar con éxito una tirada de habilidad, el psiónico alivia el daño o la enfermedad de ese personaje absorbiéndolos.

              El daño que se puede absorber está ligado al resultado de una tirada de habilidad:

              | Resultado | Daño Absorbido | Enfermedad Reducida |
              | :--- | :--- | :--- |
              | **Fallo Crítico** | El personaje sufre 1 herida. | Sin efecto sobre el paciente. |
              | **Ordinario** | El personaje absorbe 1 herida. | Reduce la enfermedad del paciente en un grado (por ejemplo, de Asombroso a Bueno), infectando simultáneamente al psiónico con ese grado de enfermedad. |
              | **Bueno** | El personaje absorbe 2 heridas o 1 mortal. | Reduce la enfermedad del paciente en dos grados, transfiriendo la dolencia al psiónico. |
              | **Asombroso** | El personaje absorbe 3 heridas o 1 mortal. | Transfiere cualquier enfermedad del paciente al psiónico. |

              Una vez que el personaje absorbe el daño o la enfermedad, debe utilizar la especialidad de **Bioquinesis—sanar**, curarse de forma natural o recibir atención médica o psiónica para aliviar el daño o curar la enfermedad.

              **Beneficios de Rango:**
              - **Al rango 6 [Desplazar Daño (Displace Damage)]**, el personaje psiónico puede transferir el daño a un personaje diferente, que también deba estar en contacto físico con el psiónico y que deba estar dispuesto a recibir el daño. Cualquier intento de transferir el daño a una criatura que no desee conscientemente aceptar el daño (como un personaje hostil o uno inconsciente) hace que el psiónico reciba el daño, como es normal.
              - **Al rango 12 [Transferencia Involuntaria (Unwilling Transfer)]**, el personaje puede transferir el daño a un personaje involuntario. El psiónico debe estar tocando a ambos personajes. Ambos personajes deben estar vivos tras activar la habilidad. El personaje "donante" será sanado de una cantidad de puntos de daño determinados por la tirada de habilidad de bioquinesis-transferir daño. Los puntos de daño se aplican entonces al receptor involuntario. **Ten en cuenta que este beneficio no se recibe si el psiónico lleva puesta una armadura.**
        trained_only: false
  ESP:
    attribute: INT
    url: /psionics/esp/
