        - es:
            name: Empatía
            description: |-
              Permite "leer" las emociones superficiales de otro personaje en el rango visual. Otorga una bonificación a las habilidades de encuentro:
              - **Ordinario:** –1 paso.
              - **Bueno:** –2 pasos.
              - **Asombroso:** –3 pasos.

              **Beneficios de Rango:**
              - **Al rango 6 [Lectura de Aura]**, permite ver el campo bioeléctrico para evaluar la salud (bonificación de –1, –2 o –3 pasos a tiradas médicas).
              - **Al rango 9 [Conexión]**, permite mantener una conexión permanente para usar la habilidad más allá del rango visual (hasta 1.5 km por rango).

              ---
        trained_only: false
      mind-reading:
        attribute: INT
        cost: 3
        url: /psionics/esp/#mind-reading
        localized:
        - en:
            name: Mind Reading
            description: |-
              This skill allows a psion to "read" the surface thoughts of another character within 500 meters. The contact lasts for a limited time:
              - **Ordinary:** 1 phase (random thoughts)
              - **Good:** 2 phases (coherent context)
              - **Amazing:** 3 phases (full surface thoughts)

              **Rank Benefits:**
              - **At rank 3 [Extra Time]**, duration increases to 2/3/4 phases.
              - **At rank 6 [Probe]**, search the mind for specific information (+2 step penalty for alien species).
              - **At rank 12 [Extra Time]**, duration increases to 1/2/3 minutes.

              ---
        - es:
            name: Lectura de Mente
            description: |-
              Permite leer pensamientos superficiales a menos de 500 metros. La duración es:
              - **Ordinario:** 1 fase (pensamientos inconexos).
              - **Bueno:** 2 fases (contexto coherente).
              - **Asombroso:** 3 fases (pensamientos superficiales completos).

              **Beneficios de Rango:**
              - **Al rango 6 [Sonda]**, permite buscar información específica en la mente (+2 pasos para alienígenas).
              - **Al rango 12**, la duración aumenta a 1/2/3 minutos.

              ---
        trained_only: false
      navcognition:
        attribute: INT
        cost: 3
        url: /psionics/esp/#navcognition
        trained_only: true
        localized:
        - en:
            name: Navcognition
            description: |-
              This specialty skill represents a psion's innate ability to know exactly where he or she is in relation to a fixed location. This allows for astrogation and mapping without specialized equipment.

              **Rank Benefits:**
              - **At rank 1**, select one specialty: **Surface Navigation**, **System Astrogation**, or **Drivespace Astrogation**.
              - **At rank 6 [Clarity of Mind]**, –4 step bonus to navigation during extreme conditions (chases, combat).
              - **At rank 12 [Tracking]**, track the most likely destination of a target subject, even through drivespace.

              ---
        - es:
            name: Navcognición
            description: |-
              Capacidad innata para conocer la posición exacta respecto a un punto fijo. Permite astrografía y cartografía sin equipo.

              **Beneficios de Rango:**
              - **Al rango 1**, selecciona una especialidad: **Navegación de Superficie**, **Astrografía de Sistema** o **Astrografía de Curvatura**.
              - **Al rango 6**, bonificación de –4 pasos en condiciones extremas (persecuciones, combate).
              - **Al rango 12 [Rastreo]**, permite rastrear el destino probable de un sujeto a través del espacio de curvatura.

              ---
      postcognition:
        attribute: INT
        cost: 3
        url: /psionics/esp/#postcognition
        localized:
        - en:
            name: Postcognition
            description: |-
              The character can sense the psychic residue of an area or object to see past events:
              - **Ordinary:** sensing general emotions.
              - **Good:** brief flashes of events.
              - **Amazing:** experiencing a full scene as an observer.

              In general, a character can see a number of days into the past equal to his or her skill rank.

              **Rank Benefits:**
              - **At rank 3, 6, 9, 12 [Extended Reach]**, the past-viewing window increases to weeks, months, years, and then decades.

              ---
        - es:
            name: Postcognición
            description: |-
              Siente la resonancia psíquica de un área u objeto:
              - **Ordinario:** emociones generales.
              - **Bueno:** destellos breves.
              - **Asombroso:** escena completa como observador.

              Se puede ver hacia el pasado tantos días como el rango de habilidad.

              **Beneficios de Rango:**
              - **Al rango 3, 6, 9, 12**, el alcance aumenta a semanas, meses, años y décadas.

              ---
        trained_only: false
      precognition:
        attribute: INT
        cost: 4
        url: /psionics/esp/#precognition
        trained_only: true
        localized:
        - en:
            name: Precognition
            description: |-
              Receive impressions about possible future events. Usually triggered by the Gamemaster, but can be forced at double PP cost and a +3 step penalty. Success grants a "last resort point" usable only in that scene.

              **Rank Benefits:**
              - **At rank 3, 6, 9, 12 [Increased Time]**, the future-viewing window increases from hours to days, weeks, months, and then years.

              ---
        - es:
            name: Precognición
            description: |-
              Recibe impresiones sobre sucesos futuros. Suele ser activada por el Director de Juego. El éxito otorga un "punto de último recurso" para la escena.

              **Beneficios de Rango:**
              - **Al rango 3, 6, 9, 12**, el alcance futuro aumenta de horas a días, semanas, meses y años.

              ---
      psychometry:
        attribute: INT
        cost: 3
        url: /psionics/esp/#psychometry
        localized:
        - en:
            name: Psychometry
            description: |-
              Read psychic impressions from inanimate objects through touch:
              - **Ordinary:** receive simple emotions.
              - **Good:** receive simple images.
              - **Amazing:** experience a brief encounter as the owner.
        - es:
            name: Psicometría
            description: |-
              Lee impresiones psíquicas de objetos inanimados mediante el tacto:
              - **Ordinario:** emociones simples.
              - **Bueno:** imágenes simples.
              - **Asombroso:** encuentro breve como el propietario.
        trained_only: false
  Psychoportation:
    attribute: WIL
    url: /psionics/psychoportation/
    cost: 7
    localized:
    - en:
        name: Psychoportation
        description: Control time and space through mental discipline.
    - es:
        name: Psychoportation
        description: Controla el tiempo y el espacio mediante la disciplina mental.
    items:
      alter-speed:
        attribute: WIL
        cost: 4
        url: /psionics/psychoportation/#alter-speed
        trained_only: true
        localized:
        - en:
            name: Alter Speed
            description: |-
              This skill allows a character to accelerate or decelerate an object or living being within a limited range (25/50/100 meters). The result of the skill check determines the percentage of the target's current speed that is affected:
              - **Ordinary:** 10%
              - **Good:** 25%
              - **Amazing:** 50%

              **Rank Benefits:**
              - **At rank 4 [Increased Effect]**, percentages increase to 25/50/75%.
              - **At rank 8 [Increased Effect]**, percentages increase to 50/75/100%.
              - **At rank 12 [Instant Stop/Start]**, the psion can instantly stop a moving object or bring a stationary object to its maximum speed.

              ---
        - es:
            name: Alterar Velocidad
            description: |-
              Permite acelerar o desacelerar un objeto o ser vivo dentro de un rango limitado (25/50/100 metros). El éxito determina el porcentaje de cambio de velocidad:
              - **Ordinario:** 10%
              - **Bueno:** 25%
              - **Asombroso:** 50%

              **Beneficios de Rango:**
              - **Al rango 4 [Efecto Incrementado]**, porcentajes aumentan a 25/50/75%.
              - **Al rango 8 [Efecto Incrementado]**, porcentajes aumentan a 50/75/100%.
              - **Al rango 12 [Parar/Arrancar Instantáneo]**, permite detener instantáneamente o llevar a velocidad máxima a un objeto.

              ---
      apportation:
        attribute: WIL
        cost: 6
        url: /psionics/psychoportation/#apportation
        trained_only: true
        localized:
        - en:
            name: Apportation
            description: |-
              The psion can mentally transport objects or living beings from one location to another within limited range (25/50/100 meters). This differs from Teleportation in that the psion does not travel with the target.

              **Rank Benefits:**
              - **At rank 4 [Increased Range]**, range increases to 1 kilometer.
              - **At rank 12 [Increased Range]**, range increases to 100 kilometers.

              ---
        - es:
            name: Aportación
            description: |-
              El psiónico puede transportar mentalmente objetos o seres vivos de un lugar a otro dentro de un rango de 100 metros. A diferencia de la Teletransportación, el psiónico no viaja con el objetivo.

              **Beneficios de Rango:**
              - **Al rango 4 [Alcance Incrementado]**, el rango aumenta a 1 kilómetro.
              - **Al rango 12 [Alcance Incrementado]**, el rango aumenta a 100 kilómetros.

              ---
      duplicate:
        attribute: WIL
        cost: 6
        url: /psionics/psychoportation/#duplicate
        trained_only: true
        localized:
        - en:
            name: Duplicate
            description: |-
              The character can reach into an alternate timeline and bring a future version of himself or herself into the present. This future self acts as an independent entity and can assist the character.

              - **Ordinary:** Future self lasts 1 round; copy has +1 rank in one skill.
              - **Good:** Future self lasts 2 rounds; +2 ranks in skills and one Achievement benefit.
              - **Amazing:** Future self lasts 3 rounds; +3 ranks in skills and two Achievement benefits.

              **Critical Failure:** The character returns from the attempt having suffered damage or loss of equipment.

              ---
        - es:
            name: Duplicado
            description: |-
              El personaje trae una versión futura de sí mismo desde una línea temporal alternativa al presente para que le ayude.

              - **Ordinario:** El yo futuro dura 1 asalto; tiene +1 rango en una habilidad.
              - **Bueno:** Dura 2 asaltos; +2 rangos en habilidades y un beneficio de Logro.
              - **Asombroso:** Dura 3 asaltos; +3 rangos en habilidades y dos beneficios de Logro.

              **Fallo Crítico:** El personaje sufre daños, aturdimiento o pérdida de equipo.

              ---
      teleportation:
        attribute: WIL
        cost: 5
        url: /psionics/psychoportation/#teleportation
        trained_only: true
        localized:
        - en:
            name: Teleportation
            description: |-
              Instantly travel from one location to another within 100 meters. The psion must be familiar with the target location.

              **Rank Benefits:**
              - **At rank 3, 6, 9, 12 [Increased Mass]**, the weight of passengers/equipment increases from 1x Will to 2x, 5x, 10x, and finally 20x Will score.
              - **At rank 4, 8, 12 [Increased Distance]**, maximum distance increases to 1 km, 100 km, and 1000 km.

              ---
        - es:
            name: Teletransportación
            description: |-
              Viaje instantáneo a una ubicación conocida en un radio de 100 metros.

              **Beneficios de Rango:**
              - **Al rango 3, 6, 9, 12 [Masa Incrementada]**, la masa transportada aumenta de 1x Voluntad a 2x, 5x, 10x y 20x el valor de Voluntad.
              - **Al rango 4, 8, 12 [Distancia Incrementada]**, la distancia máxima aumenta a 1 km, 100 km y 1000 km.

              ---
      timeslip:
        attribute: WIL
        cost: 6
        url: /psionics/psychoportation/#timeslip
        trained_only: true
        localized:
        - en:
            name: Timeslip
            description: |-
              Jump forward in time by moments, minutes, or even hours. The character disappears and reappears at the same local coordinates at the specified future time.

              - **Ordinary:** Travel 1 time unit forward.
              - **Good:** Travel 2 time units.
              - **Amazing:** Travel 3 time units.

              **Rank Benefits:**
              - **At rank 4, 8, 12 [Extended Slip]**, the base time unit increases from 1 round to 1 minute, 1 hour, and finally 1 day.
              - **At rank 6 [Dodge]**, perform a reaction timeslip to avoid an attack.
        - es:
            name: Salto Temporal
            description: |-
              "Salta" hacia adelante en el tiempo momentos, minutos u horas. El personaje desaparece y reaparece en las mismas coordenadas locales en el momento futuro elegido.

              - **Ordinario:** Viaja 1 unidad de tiempo al futuro.
              - **Bueno:** Viaja 2 unidades.
              - **Asombroso:** Viaja 3 unidades.

              **Beneficios de Rango:**
              - **Al rango 4, 8, 12 [Salto Extendido]**, la unidad de tiempo aumenta de 1 asalto a 1 minuto, 1 hora y 1 día.
              - **Al rango 6 [Esquiva]**, permite realizar un salto temporal como reacción para esquivar un ataque.
      dimension-walk:
        attribute: WIL
        cost: 6
        trained_only: true
        url: /psionics/psychoportation/#dimension-walk
        localized:
        - en:
            name: Dimension Walk
            description: Jump between parallel dimensions or tangent timelines.
        - es:
            name: Caminar entre Dimensiones
            description: Salto entre dimensiones paralelas o líneas temporales tangentes.
  Telekinesis:
    attribute: WIL
    url: /psionics/telekinesis/
    cost: 6
    localized:
    - en:
        name: Telekinesis
        description: Manipulate and move physical objects using the power of the mind.
    - es:
        name: Telekinesis
        description: Manipula y mueve objetos físicos usando el poder de la mente.
    items:
      cryokinetics:
        attribute: WIL
        cost: 3
        url: /psionics/telekinesis/#cryokinetics
        trained_only: true
        localized:
        - en:
            name: Cryokinetics
            description: |-
              Absorb thermal energy from an object or area (up to 30 meters), causing it to freeze. Success inflicts energy damage and can potentially freeze mechanisms or targets.

              **Rank Benefits:**
              - **At rank 5, 9 [Increased Damage]**, damage increases from initial levels to higher tiers.

              ---
        - es:
            name: Crioquinesis
            description: |-
              Absorbe la energía térmica de un objeto o zona (hasta 30 metros), haciendo que se congele. El éxito inflige daño de energía y puede congelar mecanismos.

              **Beneficios de Rango:**
              - **Al rango 5, 9 [Daño Incrementado]**, los niveles de daño aumentan.

              ---
      electrokinetics:
        attribute: WIL
        cost: 3
        url: /psionics/telekinesis/#electrokinetics
        trained_only: true
        localized:
        - en:
            name: Electrokinetics
            description: |-
              Control and generate electrical energy (range 30 meters). Can be used to power devices or attack targets. Success inflicts energy damage and can short-circuit electronics.

              **Rank Benefits:**
              - **At rank 5, 9 [Increased Damage]**, electrical damage tiers increase.

              ---
        - es:
            name: Electroquinesis
            description: |-
              Controla y genera energía eléctrica (rango 30 metros). Puede usarse para alimentar dispositivos o atacar. El éxito inflige daño de energía y puede cortocircuitar la electrónica.

              **Beneficios de Rango:**
              - **Al rango 5, 9 [Daño Incrementado]**, los niveles de daño eléctrico aumentan.

              ---
      kinetic-blow:
        attribute: WIL
        cost: 3
        url: /psionics/telekinesis/#kinetic-blow
        trained_only: true
        localized:
        - en:
            name: Kinetic Blow
            description: |-
              Focus kinetic energy into a single physical strike. This adds to the damage of an unarmed attack.
              - **Ordinary:** +d4s damage
              - **Good:** +d6s damage
              - **Amazing:** +d4w damage

              ---
        - es:
            name: Golpe Kinético
            description: |-
              Enfoca la energía cinética en un único golpe físico que se añade al daño de un ataque sin armas.
              - **Ordinario:** +d4s de daño.
              - **Bueno:** +d6s de daño.
              - **Asombroso:** +d4w de daño.

              ---
      kinetic-shield:
        attribute: WIL
        cost: 2
        url: /psionics/telekinesis/#kinetic-shield
        localized:
        - en:
            name: Kinetic Shield
            description: |-
              Create a field of force to deflect physical and energy attacks (but not psionic ones). The shield acts as armor.

              **Rank Benefits:**
              - **At rank 4, 8, 12 [Improved Protection]**, the LI/HI/En protection values increase.

              ---
        - es:
            name: Escudo Kinético
            description: |-
              Crea un campo de fuerza para desviar ataques físicos y de energía (pero no psiónicos). El escudo actúa como armadura.

              **Beneficios de Rango:**
              - **Al rango 4, 8, 12 [Protección Mejorada]**, los valores de protección LI/HI/En aumentan.

              ---
        trained_only: false
      levitation:
        attribute: WIL
        cost: 2
        url: /psionics/telekinesis/#levitation
        localized:
        - en:
            name: Levitation
            description: |-
              Defy gravity to lift oneself or others. The character can move vertically at a specified rate (initially 2 meters/phase).

              **Rank Benefits:**
              - **At rank 4, 8, 12 [Increased Speed/Carry]**, vertical speed and carry capacity increase.

              ---
        - es:
            name: Levitación
            description: |-
              Desafía la gravedad para elevarse a sí mismo o a otros. El personaje se mueve verticalmente a una velocidad inicial de 2 metros por fase.

              **Beneficios de Rango:**
              - **Al rango 4, 8, 12 [Velocidad/Carga Incrementada]**, la velocidad vertical y la capacidad de carga aumentan.

              ---
        trained_only: false
      photokinetics:
        attribute: WIL
        cost: 1
        url: /psionics/telekinesis/#photokinetics
        trained_only: true
        localized:
        - en:
            name: Photokinetics
            description: |-
              Manipulate light to create flashes, illuminate areas, or even create laser-like bolts (range 100 meters).

              **Rank Benefits:**
              - **At rank 4 [Invisibility]**, bend light around the character for a stealth bonus (–4 step).
              - **At rank 12 [Holographic Projection]**, create complex visual illusions.

              ---
        - es:
            name: Fotoquinesis
            description: |-
              Manipula la luz para crear destellos, iluminar áreas o lanzar rayos láser (rango 100 metros).

              **Beneficios de Rango:**
              - **Al rango 4 [Invisibilidad]**, desvía la luz para obtener una bonificación de sigilo (–4 pasos).
              - **Al rango 12 [Proyección Holográfica]**, crea ilusiones visuales complejas.

              ---
      psychokinetics:
        attribute: WIL
        cost: 3
        url: /psionics/telekinesis/#psychokinetics
        trained_only: true
        localized:
        - en:
            name: Psychokinetics
            description: |-
              Move and manipulate solid objects at a distance. Can also be used to throw objects for damage.

              **Rank Benefits:**
              - **At rank 3 [Manipulate]**, operate mechanisms like locks or computer keys remotely.
              - **At rank 6 [Batter]**, grab and damage living beings physically.
              - **At rank 8 [Puppeteering]**, control the movements of another character.
              - **At rank 9, 12 [Increased Damage]**, damage from thrown objects increases.

              ---
        - es:
            name: Psicoquinesis
            description: |-
              Mueve y manipula objetos sólidos a distancia. Puede usarse para lanzar objetos y causar daño.

              **Beneficios de Rango:**
              - **Al rango 3 [Manipular]**, opera mecanismos remotos (cerraduras, teclados).
              - **Al rango 6 [Batir]**, apresa y daña físicamente a seres vivos.
              - **Al rango 8 [Marioneta]**, controla los movimientos de otro personaje.
              - **Al rango 9, 12 [Daño Incrementado]**, el daño por objetos lanzados aumenta.

              ---
      pyrokinesis:
        attribute: WIL
        cost: 4
        url: /psionics/telekinesis/#pyrokinesis
        trained_only: true
        localized:
        - en:
            name: Pyrokinesis
            description: |-
              Excite molecules to generate heat and fire (range 30 meters). Targets burst into flames, taking energy damage over time.

              **Rank Benefits:**
              - **At rank 5, 9 [Increased Damage]**, fire damage tiers increase.

              ---
        - es:
            name: Piroquinesis
            description: |-
              Excita las moléculas para generar calor y fuego (rango 30 metros). Los objetivos estallan en llamas, sufriendo daños de energía con el tiempo.

              **Beneficios de Rango:**
              - **Al rango 5, 9 [Daño Incrementado]**, los niveles de daño por fuego aumentan.

              ---
      sheya's-clutch:
        attribute: WIL
        cost: 5
        url: /psionics/telekinesis/#sheyas-clutch
        trained_only: true
        localized:
        - en:
            name: Sheya's Clutch
            description: |-
              Mentally crush the heart or internal organs of a living being (range 40 meters). Bypasses all non-psionic armor. This is physically draining for the user, who also takes damage.

              **Rank Benefits:**
              - **At rank 5, 9 [Increased Damage]**, damage to the victim increases while the relative cost to the user decreases slightly.
        - es:
            name: Presa de Sheya
            description: |-
              Aplasta mentalmente el corazón u órganos internos de un ser vivo (rango 40 metros). Ignora toda armadura no psiónica. Es agotador para el usuario, que también recibe daño.

              **Beneficios de Rango:**
              - **Al rango 5, 9 [Daño Incrementado]**, el daño a la víctima aumenta mientras el coste relativo para el usuario disminuye ligeramente.
        alien_only: true
  Telepathy:
    attribute: PER
    url: /psionics/telepathy/
    cost: 5
    localized:
    - en:
        name: Telepathy
        description: Communicate and interact directly with the minds of others.
    - es:
        name: Telepathy
        description: Comunícate e interactúa directamente con la mente de los demás.
    items:
      contact:
        attribute: PER
        cost: 3
        url: /psionics/telepathy/#contact
        localized:
        - en:
            name: Contact
            description: |-
              Establish a mental link with another character within visual range. This link allows for two-way communication and is often a prerequisite for other telepathic powers.

              **Rank Benefits:**
              - **At rank 4 [Multiple Contacts]**, contact up to 4 individuals simultaneously.
              - **At rank 8 [Non-Visual Contact]**, contact individuals out of sight if their location is known.
              - **At rank 12 [Group Link]**, create a mental network for a large group.

              ---
        - es:
            name: Contacto
            description: |-
              Establece un vínculo mental con otro personaje en el rango visual. Permite comunicación bidireccional y es requisito para otros poderes.

              **Beneficios de Rango:**
              - **Al rango 4**, contacta a 4 individuos simultáneamente.
              - **Al rango 8**, contacta a individuos fuera de la vista si se conoce su ubicación.

              ---
        trained_only: false
      datalink:
        attribute: PER
        cost: 4
        url: /psionics/telepathy/#datalink
        localized:
        - en:
            name: Datalink
            description: |-
              Interface directly with computer systems using the mind. Perform computer-related tasks (Access, Hacking, etc.) at a distance without a physical terminal.

              **Rank Benefits:**
              - **At rank 5 [Increased Range]**, range increases to 100 meters.
              - **At rank 9 [Deep Link]**, –2 step bonus to computer-related checks.

              ---
        - es:
            name: Enlace de Datos
            description: |-
              Interfaz directa con sistemas informáticos. Realiza tareas de computación (Acceso, Hackeo, etc.) a distancia sin terminal física.

              **Beneficios de Rango:**
              - **Al rango 9**, bonificación de –2 pasos a tiradas de informática.

              ---
        trained_only: false
      drain:
        attribute: PER
        cost: 4
        url: /psionics/telepathy/#drain
        trained_only: true
        localized:
        - en:
            name: Drain
            description: |-
              Mentally sap the health of another character (range 30 meters). Success inflicts wound damage while potentially healing the user.

              **Rank Benefits:**
              - **At rank 6 [Life Drain]**, can drain Mortal damage.
              - **At rank 12 [Mass Drain]**, affect multiple targets in a small area.

              ---
        - es:
            name: Drenar
            description: |-
              Sapa la salud de otro personaje (rango 30 metros). El éxito inflige daño de heridas y puede curar al usuario.

              ---
      empathic-projection:
        attribute: PER
        cost: 3
        url: /psionics/telepathy/#empathic-projection
        localized:
        - en:
            name: Empathic Projection
            description: |-
              Project emotions into the mind of another character to influence their attitude (Friendly, Hostile, etc.).

              **Rank Benefits:**
              - **At rank 6 [Emotional Overload]**, stun the target with overwhelming emotion.

              ---
        - es:
            name: Proyección Empática
            description: |-
              Proyecta emociones en la mente de otro para influir en su actitud (Amistoso, Hostil, etc.).

              ---
        trained_only: false
      guidance:
        attribute: PER
        cost: 4
        url: /psionics/telepathy/#guidance
        localized:
        - en:
            name: Guidance
            description: |-
              Provide mental assistance to another character, granting them a bonus to a specific specialty skill check.

              **Rank Benefits:**
              - **At rank 4, 8, 12 [Improved Guidance]**, the step bonus increases.

              ---
        - es:
            name: Guía
            description: |-
              Ayuda mental a otro personaje, otorgando una bonificación a una tirada de habilidad específica.

              ---
        trained_only: false
      illusion:
        attribute: PER
        cost: 3
        url: /psionics/telepathy/#illusion
        localized:
        - en:
            name: Illusion
            description: |-
              Create mental images and sensations that trick the target's perception. The illusion exists only in the target's mind.

              **Rank Benefits:**
              - **At rank 6 [Multi-Sensory]**, include sound, smell, and touch in the illusion.
              - **At rank 12 [Mass Illusion]**, affect everyone in a specified area.

              ---
        - es:
            name: Ilusión
            description: |-
              Crea imágenes y sensaciones mentales que engañan la percepción del objetivo. Solo existe en la mente del objetivo.

              ---
        trained_only: false
      mind-blast:
        attribute: PER
        cost: 4
        url: /psionics/telepathy/#mind-blast
        trained_only: true
        localized:
        - en:
            name: Mind Blast
            description: |-
              Deliver a powerful telepathic strike to stun an opponent (range 30 meters). Bypasses physical armor.

              ---
        - es:
            name: Explosión Mental
            description: |-
              Ataque telepático para aturdir a un oponente (rango 30 metros). Ignora armadura física.

              ---
      mind-shield:
        attribute: PER
        cost: 2
        url: /psionics/telepathy/#mind-shield
        localized:
        - en:
            name: Mind Shield
            description: |-
              Protect the mind against telepathic intrusion and psychic attacks. Provides a bonus to Willpower resistance.

              ---
        - es:
            name: Escudo Mental
            description: |-
              Protege la mente contra intrusiones y ataques psíquicos. Otorga bonificación a la resistencia de Voluntad.

              ---
        trained_only: false
      mind-wipe:
        attribute: PER
        cost: 4
        url: /psionics/telepathy/#mind-wipe
        trained_only: true
