        trained_only: false
      dream-hunt:
        attribute: INT
        cost: 3
        url: /psionics/esp/#dream-hunt
        localized:
        - en:
            name: Dream Hunt
            description: "Mindwalkers take the role of mystics and shamans in sesheyan\
              \ society. Though originally developed for hunting animals, the technique\
              \ works on any living being. The sesheyan (or sesheyan-trained) psion\
              \ concentrates on the subject and mentally engages in a hunt. The better\
              \ the subject's habits are known, the easier the hunt. If the skill\
              \ check is successful, the psion determines the place where the quarry\
              \ will be at any single locale in the next 24 hours, though not when\
              \ the prey will be there.\n\nThe degree of success determines how accurately\
              \ the psion can pinpoint the location:\n- **Ordinary:** within 1000\
              \ meters.\n- **Good:** within 500 meters.\n- **Amazing:** within 100\
              \ meters.\n\n**Rank Benefits:**\n- **At rank 3 [Improved Accuracy]**,\
              \ the psion is able to narrow a given locale to within 3 hours.\n- **At\
              \ rank 6**, an **Ordinary** success narrows the location to within 500\
              \ meters, a **Good** success narrows it to within 100 meters, and an\
              \ **Amazing** success narrows it to within 50 meters.\n- **At rank 9**,\
              \ the psion can determine **when** the prey will be at a particular\
              \ location to within 30 minutes. \n- **At rank 12**, accuracy improves\
              \ further: **Ordinary:** 100 meters, **Good:** 50 meters, **Amazing:**\
              \ 10 meters.\n\n---"
        - es:
            name: Caza Onírica
            description: |-
              Utilizada originalmente para la caza, esta técnica permite localizar a cualquier ser vivo. El psiónico se concentra en el objetivo; cuanto más conozca sus hábitos, más fácil será la caza.

              Precisión según el éxito:
              - **Ordinario:** radio de 1000 metros.
              - **Bueno:** radio de 500 metros.
              - **Asombroso:** radio de 100 metros.

              **Beneficios de Rango:**
