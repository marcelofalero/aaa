          description: |-
            This skill allows a character to experience the environment through an agency
            beyond the normal senses, using the power of the mind. With just the broad
            skill, a character can attempt to use any of the related specialty skills
            except those that can't be used untrained.
      - es:
          name: ESP
          description: |-
            Esta habilidad permite a un personaje experimentar el entorno a través de un
            medio más allá de los sentidos normales, usando el poder de la mente. Con solo
            la habilidad de base, un personaje puede intentar usar cualquiera de las
            habilidades de especialidad relacionadas, excepto aquellas que no pueden
            usarse sin entrenamiento.
    items:
      battle-mind:
        attribute: INT
        cost: 4
        url: /psionics/esp/#battle-mind
        trained_only: true
        rank_benefits:
          - rank: 4
            title: Increased Effect
          - rank: 8
            title: Move Like Water
          - rank: 12
            title: Unerring Accuracy
        extended_duration: true
        localized:
          - en:
              name: Battle Mind
              description: |-
                To use this skill, a psion focuses on the battle at hand and makes a skill
                check. The success achieved indicates the benefit while the current
                application of the skill remains active. A successful skill check gives the
                user a bonus to his or her action checks:
                - **Ordinary:** -1 step bonus.
                - **Good:** -2 step bonus.
                - **Amazing:** -3 step bonus. 

                For purposes of using this skill, “battle” is defined as any situation in which the character has made an action check in the same round he or she uses the battle mind skill.

                ### Rank Benefits
                ▶ **Rank 4 [Increased Effect]** whenever you are allowed an action check, you are also allowed to make a [[ESP-Battle Mind]] check to activate this power and gain its benefits to the first round. This check consumes one of your actions for the round, unless the result is amazing, then it doesn't cost an action. 

                ▶ **Rank 8 [Move Like Water]** the character employing this ability gains a temporary last resort point, which he or she must use before the ability’s duration ends or lose it. This point can only be used to offset damage.

                ▶ **Rank 12 [Unerring Accuracy]** the character gains a temporary last resort point, which must be used before the ability’s duration ends or it becomes lost. This point can only be used to increase the success of an attack made by the character using this ability.
          - es:
              name: Mente de Batalla
              description: |-
                Para usar esta habilidad, un psion se concentra en la batalla en cuestión y desarrolla una habilidad.
                cheque. El éxito alcanzado indica el beneficio, mientras que el actual
                La aplicación de la habilidad permanece activa. Una prueba de habilidad exitosa le da al
                usuario una bonificación a sus comprobaciones de acción:
                - **Ordinario:** -1 Bonificación de paso.
                - **Bueno:** -2 Bonificación de paso.
                - **Asombroso:** -3 Bonificación de paso.

                A los efectos del uso de esta habilidad, “batalla” se define como cualquier situación en la que Personaje haya realizado un Tirada de Acción en la misma ronda en la que usa la habilidad mental de batalla.

                ### Beneficios de Rango
