items:
  Biokinesis:
    attribute: CON
    url: /psionics/biokinesis/
    cost: 6
    localized:
      - en:
          name: Biokinesis
          description: |-
            Using this skill allows a character to harness the power of the mind to
            enhance his or her performance. With just the broad skill, a character can
            attempt to use any of the related specialty skills except those that can't be
            used untrained.
      - es:
          name: Biokinesis
          description: |-
            El uso de esta habilidad permite a un personaje aprovechar el poder de la
            mente para mejorar su rendimiento. Con solo la habilidad de base, un personaje
            puede intentar usar cualquiera de las habilidades de especialidad
            relacionadas, excepto aquellas que no pueden usarse sin entrenamiento.
    items:
      bio-armor:
        attribute: CON
        cost: 3
        url: /psionics/biokinesis/#bio-armor
        trained_only: false
        rank_benefits:
          - rank: 3
            title: Increased Effect
          - rank: 6
            title: Increased Effect
          - rank: 9
            title: Increased Toughness
          - rank: 12
            title: Increased Effect
        extended_duration: false
        localized:
          - en:
              name: Bio-armor
              description: |-
                This skill psionically reinforces a character's skin, helping to protect from damage. This "body armor" provides (LI d6/HI d6/En d4) points of protection against damage, but does not protect against psionic attacks. (See Telepathy for ways to avoid psionic attacks.)

                The result of the skill check determines the duration of the bio-armor:
                - **Ordinary:** 10 minutes.
                - **Good:** 1 hour.
                - **Amazing:** 6 hours.

                The skin hardening impairs the character's movement in the same way as worn armor with AP 1, but a lighter version can be achieved by sacrificing 1 point of armor on each category, this eliminates the armor penalty.

                ### Rank Benefits
                ▶ **Rank 3 [Increased Effect]** the protection afforded by bio-armor increases to (LI d8 / HI d6 / En d4+1).

                ▶ **Rank 6 [Increased Effect]** this value further increases to (LI d8 / HI d6+1 / En d6)b .

                ▶ **Rank 9 [Increased Toughness]** the armor is treated as being of Good toughness.

                ▶ **Rank 12 [Increased Effect]** the armor value increases again to (LI 2d4 / HI 2d4 / En d8).
          - es:
              name: Bioarmadura
              description: |-
                Esta habilidad refuerza psiónicamente la piel de Personaje, ayudando a protegerla del daño. Esta "armadura corporal" proporciona (LI d6/HI d6/En d4) puntos de protección contra daños, pero no protege contra ataques psiónicos. (Consulte Telepatía para conocer formas de evitar ataques psiónicos).

                El resultado de la prueba de habilidad determina la duración de la bioarmadura:
                - **Ordinario:** 10 minutos.
                - **Bueno:** 1 hora.
                - **Asombroso:** 6 horas.

                El endurecimiento de la piel perjudica el movimiento del Personaje de la misma manera que una armadura desgastada con AP 1, pero se puede lograr una versión más ligera sacrificando 1 punto de armadura en cada categoría, esto elimina la penalización de armadura.

                ### Beneficios de Rango
                ▶ **Rango 3 [Efecto aumentado]** la protección brindada por la bioarmadura aumenta a (LI d8 / HI d6 / En d4+1).

                ▶ **Rango 6 [Efecto aumentado]** este valor aumenta aún más a (LI d8 / HI d6+1 / En d6)b.

                ▶ **Rango 9 [Dureza aumentada]** la armadura se trata como si tuviera dureza Bueno.

                ▶ **Rango 12 [Efecto aumentado]** el valor de la armadura aumenta nuevamente a (LI 2d4 / HI 2d4 / En d8).
      bioweapon:
        attribute: CON
        cost: 3
        url: /psionics/biokinesis/#bioweapon
        trained_only: false
        rank_benefits:
          - rank: 3
            title: Increased Damage
          - rank: 6
            title: Increased Damage
          - rank: 9
            title: Increased Damage
          - rank: 12
            title: Improved Damage
        extended_duration: true
        localized:
          - en:
              name: Bioweapon
              description: |-
                When employing this skill, a character generates a field of kinetic energy emanating from his or her hands. This energy manifests in one of two ways, to be chosen by the player at the time the character makes a successful skill check: a staff or a sword.

                The player may alter the shape of the staff to a club, and the sword to a particular type of sword (katana, saber, broadsword, and so on). These changes neither affect the damage the bioweapon will do, nor do they grant any special properties to the weapon; they are cosmetic only.

                The principal difference in the two forms is in the sort of damage they do. A character who wishes just to knock out an opponent would be best served creating a staff; those who mean to inflict more serious harm on an opponent will likely create the sword.

                | Form | Base Damage | Type |
                | :--- | :--- | :---: |
                | **Staff** | d8s/d8+2s/d12+2s | LI/O |
                | **Sword** | d6w/d6+2w/d6m | LI/O |

                The character uses the [[melee combat—powered]] specialty skill to wield the bioweapon, regardless of its form.

                The result of the bioweapon skill check may add a bonus to the attack check as follows:
                - **Ordinary:** –1 step bonus
                - **Good:** –2 step bonus
                - **Amazing:** –3 step bonus

                This bonus lasts until the character chooses not to maintain the bioweapon.

                ### Rank Benefits:
                ▶ **Rank 3 [Increased Damage]** the damage of the bioweapon increases by +1.

                ▶ **Rank 6 [Increased Damage]** it increases again (to a total of +2).

                ▶ **Rank 9 [Increased Damage]** all attacks made with the bioweapon are considered to deliver **Good damage**.

                ▶ **Rank 12 [Improved Damage]** it increases by another +1 (to a total of +3).
          - es:
              name: Bioarma
              description: |-
                Al emplear esta habilidad, un Personaje genera un campo de energía cinética que emana de sus manos. Esta energía se manifiesta de dos maneras, que el jugador elegirá en el momento en que Personaje realice una prueba de habilidad exitosa: un bastón o una espada.

                El jugador puede alterar la forma del bastón a un garrote y la espada a un tipo particular de espada (katana, sable, espada ancha, etc.). Estos cambios no afectan el daño que causará el arma biológica ni le otorgan propiedades especiales; son sólo cosméticos.

                La principal diferencia entre las dos formas está en el tipo de daño que causan. Un Personaje que simplemente desee noquear a un oponente sería mejor si creara un bastón; aquellos que pretenden infligir un daño más grave a un oponente probablemente crearán la espada.

                | Formulario | Daño base | Tipo |
                | :--- | :--- | :---: |
                | **Personal** | d8s/d8+2s/d12+2s | LI/O |
                | **Espada** | d6w/d6+2w/d6m | LI/O |

                El Personaje usa el [[Combate cuerpo a cuerpo—Armas de energía]] Especialidad para empuñar el arma biológica, independientemente de su forma.

                El resultado de la prueba de habilidad con arma biológica puede añadir una bonificación a la prueba de ataque de la siguiente manera:
                - **Ordinario:** –1 Bonificación de paso
                - **Bueno:** –2 Bonificación de paso
                - **Asombroso:** –3 Bonificación de paso

                Esta bonificación dura hasta que Personaje decida no mantener el arma biológica.

                ### Beneficios de Rango:
                ▶ **Rango 3 [Daño aumentado]** el daño del arma biológica aumenta en +1.

                ▶ **Rango 6 [Daño aumentado]** aumenta nuevamente (a un total de +2).

                ▶ **Rango 9 [Daño aumentado]** se considera que todos los ataques realizados con el arma biológica causan **daño Bueno**.

                ▶ **Rango 12 [Daño mejorado]** aumenta en otro +1 (hasta un total de +3).
      control-metabolism:
        attribute: CON
        cost: 2
        url: /psionics/biokinesis/#control-metabolism
        trained_only: false
        extended_duration: true
        localized:
          - en:
              name: Control Metabolism
              description: |-
                Through the use of this skill, a character can regulate his or her metabolic
                processes. This allows longer survival without food and water, in extreme
                climates, and in other hostile conditions. The character can also slow bodily
                functions to the point of pretending to be dead, should he or she need to fool
                others in some situation.

                A check is made when a character enters a hostile environment or otherwise
                wants to employ this skill.

                #### Hostile Environments
                In the case of a hostile environment, the result of a skill check determines
                the type of protection a character can simulate:
                - **Ordinary:** vacuum suit
                - **Good:** soft e-suit
                - **Amazing:** hard e-suit

                By spending an extra point of psionic energy, the character can treat the skill use as if he has one step better result. He can also spend an extra point of psionic energy to treat the extended duration as one step better.

                #### Adrenal boost
                The character can mentally boost adrenaline output, giving an action check
                bonus.
                - **Ordinary:** +1 to action check score.
                - **Good:** +2 to action check score.
                - **Amazing:** +3 to action check score.

                #### Endorphin release
                The character can mentally stimulate the production of endorphins, increasing
                his or her resistance to pain and fatigue.
                - **Ordinary:** -1 step bonus to Stamina checks.
                - **Good:** -2 step bonus to Stamina checks.
                - **Amazing:** -3 step bonus to Stamina checks.

                > Only one use of the skill is allowed at the same time (hostile environments, adrenal boost, or endorphin release)
          - es:
              name: Control del Metabolismo
              description: |-
                Mediante el uso de esta habilidad, un Personaje puede regular su metabolismo
                procesos. Esto permite una supervivencia más prolongada sin comida ni agua, en casos extremos.
                climas y en condiciones hostiles. El Personaje también puede ralentizar el movimiento corporal.
                funciona hasta el punto de fingir estar muerto, en caso de que necesite engañar
                otros en alguna situación.

                Se realiza una verificación cuando un Personaje ingresa a un entorno hostil o de otra manera
                quiere emplear esta habilidad.

                #### Ambientes hostiles
                En el caso de un entorno hostil, el resultado de una prueba de habilidad determina
                El tipo de protección que un Personaje puede simular:
                - **Ordinario:** traje de vacío
                - **Bueno:** traje eléctrico suave
                - **Asombroso:** traje electrónico duro

                Al gastar un punto extra de energía psiónica, el Personaje puede tratar el uso de la habilidad como si tuviera un resultado un paso mejor. También puede gastar un punto extra de energía psiónica para tratar la duración extendida como un paso mejor.

                #### Impulso suprarrenal
                El Personaje puede aumentar mentalmente la producción de adrenalina, dando un Tirada de Acción
                bonificación.
                - **Ordinario:** +1 a la puntuación Tirada de Acción.
                - **Bueno:** +2 a la puntuación Tirada de Acción.
                - **Asombroso:** +3 a la puntuación Tirada de Acción.

                #### Liberación de endorfinas
                El Personaje puede estimular mentalmente la producción de endorfinas, aumentando
                su resistencia al dolor y Fatiga.
                - **Ordinario:** -1 comprobaciones de Bonificación de paso a Aguante.
                - **Bueno:** -2 comprobaciones de Bonificación de paso a Aguante.
                - **Asombroso:** -3 comprobaciones de Bonificación de paso a Aguante.

                > Solo se permite un uso de la habilidad al mismo tiempo (entornos hostiles, impulso suprarrenal o liberación de endorfinas)
      heal:
        attribute: CON
        cost: 4
        url: /psionics/biokinesis/#heal
        trained_only: true
        rank_benefits:
          - rank: 4
            title: Treating Poison
          - rank: 6
            title: Healing Mortal Damage
          - rank: 8
            title: Improved Effect
          - rank: 8
            title: Laying On Hands
          - rank: 12
            title: Master Healer
        extended_duration: false
        localized:
          - en:
              name: Heal
              description: |-
                By concentrating, a character using this skill can heal wounds or disease. The character can treat wounds or diseases, healing the subject a number of wound points based on the skill check result.

                ### Wounds
                - **Ordinary:** 1 wound point
                - **Good:** 2 wound points
                - **Amazing:** 3 wound points

                ### Disease
                For disease, the following results apply:
                - **Ordinary:** reduce the degree of illness by one grade (from Good to Ordinary, for instance).
                - **Good:** reduce by two grades.
                - **Amazing:** reduce by three grades.

                Diseases reduced below Marginal are considered cured.

                ### Timing
                Psionic healing imposes heavy strain on the body, so the skill can't be attempted more than once per hour, any attempt of using the skill more than once per hour will result in a level of exhaustion that cannot be recovered from until 24 hours have passed since the last attempt.

                ### Rank Benefits
                ▶ **Rank 4 [Treating Poison]**, a character may counteract the effect of poisons or drugs in his or her system before the end of their onset time, reducing the impact they may have. The degree of success acts as a bonus to the Constitution feat check required: **Ordinary:** –2 step bonus, **Good:** –3 step bonus, **Amazing:** –4 step bonus.

                ▶ **Rank 6 [Healing Mortal Damage]**, a character becomes able to heal mortal damage. Skill check results change to: **Ordinary:** 2 wounds, **Good:** 3 wounds or 1 mortal, **Amazing:** 4 wounds or 2 mortals.

                ▶ **Rank 8 [Improved Effect]**, a character's ability to heal improves further: **Ordinary:** 3 wounds or 1 mortal, **Good:** 4 wounds or 2 mortals, **Amazing:** 6 wounds or 3 mortals.

                ▶ **Rank 8 [Laying On Hands]**, a character becomes able to heal damage in others. The subject to be healed must be in physical contact with the character using this ability.

                ▶ **Rank 12 [Master Healer]**, a character reduces the strain of psionic healing, the skill can be attempted once every 10 minutes without causing exhaustion. Additionally, the character can double the number of mortals healed at the cost of 1 additional psionic energy per mortal healed and one point of exhaustion on both healer and subject.
          - es:
              name: Sanar
              description: |-
                Al concentrarse, un Personaje que utilice esta habilidad puede curar heridas o enfermedades. El Personaje puede tratar heridas o enfermedades, curando al sujeto una cantidad de puntos Herida según el resultado de la prueba de habilidad.

                ### Heridas
                - **Ordinario:** 1 punto Herida
                - **Bueno:** 2 puntos Herida
                - **Asombroso:** 3 puntos Herida

                ### Enfermedad
                Para la enfermedad, se aplican los siguientes resultados:
                - **Ordinario:** reduce el grado de enfermedad en un grado (de Bueno a Ordinario, por ejemplo).
                - **Bueno:** reducir en dos grados.
                - **Asombroso:** reducir en tres grados.

                Las enfermedades reducidas por debajo del Marginal se consideran curadas.

                ### Momento
                La curación psiónica impone una gran tensión en el cuerpo, por lo que la habilidad no se puede intentar más de una vez por hora; cualquier intento de usar la habilidad más de una vez por hora resultará en un nivel de agotamiento del que no se podrá recuperar hasta que hayan pasado 24 horas desde el último intento.

                ### Beneficios de Rango
                ▶ **Rango 4 [Tratamiento del Veneno]**, un Personaje puede contrarrestar el efecto de los venenos o drogas en su sistema antes de que finalice su tiempo de aparición, reduciendo el impacto que puedan tener. El grado de éxito actúa como una bonificación a la prueba de dote de Constitución requerida: **Ordinario:** –2 Bonificación de paso, **Bueno:** –3 Bonificación de paso, **Asombroso:** –4 Bonificación de paso.

                ▶ **Rango 6 [Curación del daño de Mortal]**, un Personaje puede curar el daño de Mortal. Los resultados de la prueba de habilidad cambian a: **Ordinario:** 2 heridas, **Bueno:** 3 heridas o 1 Mortal, **Asombroso:** 4 heridas o 2 mortales.

                ▶ **Rango 8 [Efecto mejorado]**, la capacidad de curación de un Personaje mejora aún más: **Ordinario:** 3 heridas o 1 Mortal, **Bueno:** 4 heridas o 2 mortales, **Asombroso:** 6 heridas o 3 mortales.

                ▶ **Rango 8 [Imposición de manos]**, un Personaje se vuelve capaz de curar el daño de otros. El sujeto a curar debe estar en contacto Físico con el Personaje usando esta habilidad.

                ▶ **Rango 12 [Master Healer]**, un Personaje reduce la tensión de la curación psiónica, la habilidad se puede intentar una vez cada 10 minutos sin causar agotamiento. Además, el Personaje puede duplicar el número de mortales curados a costa de 1 energía psiónica adicional por cada Mortal curado y un punto de agotamiento tanto para el sanador como para el sujeto.
      morph:
        attribute: CON
        cost: 4
        url: /psionics/biokinesis/#morph
        trained_only: true
        rank_benefits:
          - rank: 1
            title: Check Skill
            extended_duration: true
        extended_duration: false
        localized:
          - en:
              name: Morph
              description: |-
                By using this skill, a **character** can alter physical features to avoid recognition, impersonate, or achieve feats otherwise impossible (e.g., squeeze into a small hole, reach high places, or slip free of bonds).

                Morphing requires an entire round (4 phases) to complete. The character can do nothing else while this process is taking place.

                The initial skill check determines how long the morphed form lasts:
                - **Ordinary:** 1 round
                - **Good:** 2 rounds
                - **Amazing:** 3 rounds

                A morphed body part retains its original characteristics; no game statistics change except those directly related to the morphing. Morphing has no effect on a character's clothing or possessions.

                ### Rank Benefits
                #### Disguise (ranks 5, 7, 9, 12)
                ▶ **Rank 5** – Facial disguise: +2 step penalty to Awareness checks when trying to recognize the character.

                ▶ **Rank 7** – Limb‑length adaptation: alter limb length to aid impersonation.

                ▶ **Rank 9** – Body‑volume change: shrink or expand to fit unusually shaped spaces.

                ▶ **Rank 12** – Improved disguise: +4 step penalty, can mimic a specific person.

                #### Impersonation (ranks 5, 7, 9)
                ▶ **Rank 5** – Voice mimicry: copy another's speech patterns. -1 step bonus to Entertainment-Act checks.

                ▶ **Rank 7** – Mannerism replication: an additional -1 step bonus to Entertainment-Act checks due to the ability of freely replicating the subject's mannerisms.

                ▶ **Rank 9** – Full persona adoption: combine voice, mannerisms, and appearance for a convincing impersonation. Due to the ability to completely separate his mental state from the visible persona, the character gains an additional -1 step bonus to Interaction and Entertainment-Act checks.

                #### Mechanical Alteration (ranks 5, 7, 9, 12)
                ▶ **Rank 5** – Increase flexibility: +0.5 m reach for a specific limb.

                ▶ **Rank 7** – Reduce stun damage taken from blunt attacks and secondary damage by 1.

                ▶ **Rank 9** – Soft landing: halve damage from falling.

                ▶ **Rank 12** – Reduce stun damage taken from blunt attacks and secondary damage by 2.

                #### Small‑Space Passage (Ranks 5, 7, 9)
                ▶ **Rank 5** – Squeeze through cracks (up to 30 cm wide).

                ▶ **Rank 7** – Pass through tight spaces as if you have no bones up to 25cm diameter.

                ▶ **Rank 9** – Able to pass a arm through a 1 cm wide crack or space, allowing to pass the arm under a door and combine with elongate arms reach the lock from the inside.

                #### Reach & Height (Ranks 5, 7, 9)
                ▶ **Rank 5** – Elongate fingers: +0.5 m reach.

                ▶ **Rank 7** – Elongate arms: +1 m reach.

                ▶ **Rank 9** – Elongate legs: +1 m height.

                #### Contortion and Compression (Ranks 5, 7, 9)
                ▶ **Rank 5** – Fit into a container of similar "volume" as your body. The volume of an average human male can fit in a 50cm side cube with a limited degree of movement.

                ▶ **Rank 7** – Fit into a container of 3/4 the volume of your body, movement is not hindered.

                ▶ **Rank 9** – Fit into a container of 1/2 the volume of your body, movement is not hindered.
          - es:
              name: Metamorfosis
              description: |-
                Al usar esta habilidad, un **Personaje** puede alterar las características de Físico para evitar el reconocimiento, hacerse pasar por alguien o lograr hazañas que de otro modo serían imposibles (por ejemplo, meterse en un pequeño agujero, alcanzar lugares altos o liberarse de ataduras).

                La transformación requiere una ronda completa (4 fases) para completarse. El Personaje no puede hacer nada más mientras se lleva a cabo este proceso.

                La prueba de habilidad inicial determina cuánto dura la forma transformada:
                - **Ordinario:** 1 ronda
                - **Bueno:** 2 rondas
                - **Asombroso:** 3 rondas

                Una parte del cuerpo transformada conserva sus características originales; No cambian las estadísticas del juego, excepto aquellas directamente relacionadas con la transformación. La transformación no tiene ningún efecto sobre la ropa o las posesiones de un Personaje.

                ### Beneficios de Rango
                #### Disfraz (Rangos 5, 7, 9, 12)
                ▶ **Rango 5** – Disfraz facial: +2 controles de Penalización de paso a Alerta al intentar reconocer el Personaje.

                ▶ **Rango 7** – Adaptación de la longitud de las extremidades: modifique la longitud de las extremidades para facilitar la suplantación.

                ▶ **Rango 9** – Cambio de volumen corporal: encoge o expande para adaptarse a espacios con formas inusuales.

                ▶ **Rango 12** – Disfraz mejorado: +4 Penalización de paso, puede imitar a una persona específica.

                #### Suplantación (Rangos 5, 7, 9)
                ▶ **Rango 5** – Mimetismo de voz: copia los patrones de habla de otra persona. -1 Bonificación de paso a las comprobaciones de la Ley de Entretenimiento.

                ▶ **Rango 7** – Replicación de manierismos: un -1 Bonificación de paso adicional a las pruebas de Ley de entretenimiento debido a la capacidad de replicar libremente los manierismos del sujeto.

                ▶ **Rango 9** – Adopción total de la persona: combina voz, gestos y apariencia para una personificación convincente. Debido a la capacidad de separar completamente su estado Mental de la persona visible, el Personaje gana -1 Bonificación de paso adicional a Interacción y controles de Ley de Entretenimiento.

                #### Alteración mecánica (Rangos 5, 7, 9, 12)
                ▶ **Rango 5** – Aumenta la flexibilidad: +0,5 m de alcance para una extremidad específica.

                ▶ **Rango 7** – Reduce en 1 el daño de Aturdimiento recibido por ataques de Arma contundente y el daño secundario.

                ▶ **Rango 9** – Aterrizaje suave: reduce a la mitad el daño por caída.

                ▶ **Rango 12** – Reduce en 2 el daño de Aturdimiento recibido por ataques de Arma contundente y el daño secundario.

                #### Pasaje para espacios pequeños (Rangos 5, 7, 9)
                ▶ **Rango 5** – Exprimir a través de grietas (hasta 30 cm de ancho).

                ▶ **Rango 7** – Pasa por espacios reducidos como si no tuvieras huesos de hasta 25 cm de diámetro.

                ▶ **Rango 9** – Capaz de pasar un brazo a través de una grieta o espacio de 1 cm de ancho, lo que permite pasar el brazo por debajo de una puerta y, combinado con brazos alargados, llegar a la cerradura desde el interior.

                #### Alcance y altura (Rangos 5, 7, 9)
                ▶ **Rango 5** – Dedos alargados: +0,5 m de alcance.

                ▶ **Rango 7** – Brazos alargados: +1m de alcance.

                ▶ **Rango 9** – Patas alargadas: +1m de altura.

                #### Contorsión y Compresión (Rangos 5, 7, 9)
                ▶ **Rango 5** – Colóquelo en un recipiente de "volumen" similar al de su cuerpo. El volumen de un hombre humano promedio puede caber en un cubo de 50 cm de lado con un grado limitado de movimiento.

                ▶ **Rango 7** – Cabe en un recipiente de 3/4 del volumen de su cuerpo, no se obstaculiza el movimiento.

                ▶ **Rango 9** – Cabe en un recipiente de la mitad del volumen de su cuerpo, no se obstaculiza el movimiento.
      rejuvenate:
        attribute: CON
        cost: 3
        url: /psionics/biokinesis/#rejuvenate
        trained_only: false
        rank_benefits:
          - rank: 3
            title: Improved Effect
          - rank: 3
            title: Treating Disease
          - rank: 6
            title: Laying On Hands
          - rank: 12
            title: Two Recipients
        extended_duration: false
        localized:
          - en:
              name: Rejuvenate
              description: |-
                When using this skill, a character can offset fatigue or stun damage, or some of each, that he or she has suffered. The skill does nothing to alleviate
                psionic energy loss.

                A successful skill check provides the character with a certain number of
                "rejuvenation points." It costs 2 of these points to restore 1 point of
                fatigue damage, and 1 of these points to restore 1 point of stun damage. On an
                Ordinary success, the character receives 2 "rejuvenation points"; on a Good
                success, 4 points; and on an Amazing success, 6 points. The character can use
                these points in any combination to restore stun points, fatigue points, or
                some of each. "Rejuvenation points" that can't be used immediately are lost.

                Psionic rejuvenation requires time. The results are immediate, but the body's
                reaction to the use of the skill lasts one hour. For this reason, the
                rejuvenate skill can't be attempted more than once per hour.

                ### Rank Benefits:

                ▶ **Rank 3 [Improved Effect]** the effect of a successful skill roll improves as follows:
                - **Ordinary:** 4 points
                - **Good:** 6 points
                - **Amazing:** 8 points

                ▶ **Rank 3 [Treating Disease]** a character may counteract the effect of disease in his or her system. The result of the skill check determines how much the disease is reduced. The disease is reduced by one grade on **Good** success, and 2 grades on an **Amazing** success. An **Ordinary** success is not enough to help recover from the disease, but it eliminates all penalties the disease may be causing for a day. Only one successful check per day may be made to treat a disease.

                ▶ **Rank 6 [Laying On Hands]** a character becomes able to heal fatigue or stun damage, as well as disease, in others. The subject to be healed must be in physical contact with the character using this ability.

                ▶ **Rank 12 [Two Recipients]** a character using rejuvenate may affect two individuals with a single use of the skill. This can be on two other people or on the character and one other person. Each gains whatever benefit is determined by the Biokinesis-rejuvenate skill check.
          - es:
              name: Rejuvenecer
              description: |-
                Al usar esta habilidad, un Personaje puede compensar el daño de Fatiga o Aturdimiento, o parte de cada uno, que haya sufrido. La habilidad no hace nada para aliviar
                Pérdida de energía psiónica.

                Una prueba de habilidad exitosa proporciona al Personaje una cierta cantidad de
                "puntos de rejuvenecimiento". Cuesta 2 de estos puntos restaurar 1 punto de
                Daño Fatiga, y 1 de estos puntos para restaurar 1 punto de daño Aturdimiento. en un
                Éxito de Ordinario, el Personaje recibe 2 "puntos de rejuvenecimiento"; en un Bueno
                éxito, 4 puntos; y con un éxito Asombroso, 6 puntos. El Personaje puede utilizar
                estos puntos en cualquier combinación para restaurar puntos Aturdimiento, puntos Fatiga o
                algo de cada uno. Los "puntos de rejuvenecimiento" que no se pueden utilizar inmediatamente se pierden.

                El rejuvenecimiento psiónico requiere tiempo. Los resultados son inmediatos, pero el cuerpo
                La reacción al uso de la habilidad dura una hora. Por esta razón, el
                La habilidad de rejuvenecer no se puede intentar más de una vez por hora.

                ### Beneficios de Rango:

                ▶ **Rango 3 [Efecto mejorado]** el efecto de una tirada de habilidad exitosa mejora de la siguiente manera:
                - **Ordinario:** 4 puntos
                - **Bueno:** 6 puntos
                - **Asombroso:** 8 puntos

                ▶ **Rango 3 [Tratamiento de enfermedades]** un Personaje puede contrarrestar el efecto de la enfermedad en su sistema. El resultado de la prueba de habilidad determina cuánto se reduce la enfermedad. La enfermedad se reduce en un grado si se logra **Bueno** y en 2 grados si se logra **Asombroso**. Un éxito **Ordinario** no es suficiente para ayudar a recuperarse de la enfermedad, pero elimina todas las penalizaciones que la enfermedad pueda estar causando durante un día. Sólo se podrá realizar un control exitoso por día para tratar una enfermedad.

                ▶ **Rango 6 [Imposición de manos]** un Personaje se vuelve capaz de curar daños Fatiga o Aturdimiento, así como enfermedades, en otros. El sujeto a curar debe estar en contacto Físico con el Personaje usando esta habilidad.

                ▶ **Rango 12 [Dos destinatarios]** un Personaje que usa rejuvenecer puede afectar a dos personas con un solo uso de la habilidad. Esto puede ser en dos personas Otros o en Personaje y una persona Otros. Cada uno obtiene el beneficio que determine la prueba de habilidad de rejuvenecimiento de Biokinesis.
      clamber:
        attribute: CON
        cost: 2
        url: /psionics/biokinesis/#clamber
        trained_only: false
        rank_benefits:
          - rank: 4
            title: Increased Distance
          - rank: 8
            title: Increased Distance
          - rank: 12
            title: Increased Distance
        extended_duration: true
        localized:
          - en:
              name: Clamber
              description: |-
                In the distant past, certain t'sa psions developed the **clamber**
                skill—usually those who dwelled in the mountainous regions of the t'sa
                homeworld. With it, the psionic t'sa (or a psion trained by t'sa) generates
                thousands of tiny suckers on the palms of his hands and the soles of his or
                her feet. The character can then move up and down nearly vertical surfaces
                with ease, and can even move across inverted surfaces for short distances. In
                the steep mountains of the t'sa homeworld, this often meant survival.

                The degree of success with this skill determines the modifier to a psion's
                [[athletics—climb]] attempt. The psion gains a **–1, –2, or –3 step bonus**,
                depending on the degree of success (Ordinary, Good, or Amazing). Further, if
                the distance is within the user's walk rate, the character can dash across
                inverted surfaces, effectively running across the ceiling. The character
                cannot stop or change direction before traveling the full distance without
                falling. The same will happen if the character has nothing to hold onto on
                reaching his or her destination.

                ### Rank Benefits
                ▶ **Rank 4 [Increased Distance]** the distance the user can travel while climbing or running across inverted surfaces is doubled.

                ▶ **Rank 8 [Increased Distance]** the distance is three times the base rate.

                ▶ **Rank 12 [Increased Distance]** the distance is four times the base rate.
          - es:
              description: |-
                En el pasado lejano, ciertos t'sa psions desarrollaron la **trepa**
                habilidad, generalmente aquellos que habitaban en las regiones montañosas de los t'sa
                mundo natal. Con él, el t'sa psiónico (o un psion entrenado por t'sa) genera
                miles de pequeñas ventosas en las palmas de sus manos y en las plantas de sus
                sus pies. Luego, el Personaje puede moverse hacia arriba y hacia abajo en superficies casi verticales.
                con facilidad e incluso puede moverse a través de superficies invertidas en distancias cortas. en
                En las escarpadas montañas del mundo natal de los t'sa, esto a menudo significaba supervivencia.

                El grado de éxito con esta habilidad determina el modificador de la habilidad de un psion.
                [[atletismo—escalada]] intento. El psion gana un **–1, –2 o –3 Bonificación de paso**,
                dependiendo del grado de éxito (Ordinario, Bueno o Asombroso). Además, si
                la distancia está dentro de la velocidad de caminata del usuario, el Personaje puede cruzar
                superficies invertidas, recorriendo efectivamente el techo. El Personaje
                No puede detenerse ni cambiar de dirección antes de recorrer la distancia completa sin
                cayendo. Lo mismo ocurrirá si el Personaje no tiene nada a qué agarrarse
                llegando a su destino.

                ### Beneficios de Rango
                ▶ **Rango 4 [Distancia aumentada]** la distancia que el usuario puede recorrer mientras trepa o corre por superficies invertidas se duplica.

                ▶ **Rango 8 [Distancia aumentada]** la distancia es tres veces la tarifa base.

                ▶ **Rango 12 [Distancia aumentada]** la distancia es cuatro veces la tarifa base.
              name: Trepado
      shatter:
        attribute: CON
        cost: 3
        url: /psionics/biokinesis/#shatter
        trained_only: false
        rank_benefits:
          - rank: 6
            title: Increased Quality
          - rank: 8
            title: Improved Destabilization
          - rank: 12
            title: Armor Degradation
        extended_duration: false
        localized:
          - en:
              name: Shatter
              description: |-
                Weren history tells of a clan that used armor to conquer the other clans.
                Having fashioned plates of crude armor from boiled marrizhe hide, this clan
                was despised by the other clans—but they were also unstoppable. Then came a
                great character—posthumously claimed by every other clan—who duelled the
                warlord of the armored clan for all his land, herds, and wives. In the midst
                of the duel, the mystery weren suddenly brought both fists down on his
                opponent's armored chest, and the leather plates shattered. At best an average
                fighter without his armor, the warlord quickly succumbed, and the weren
                warrior mysteriously vanished—though not, of course, without claiming his
                prizes.

                Weren warriors have long attempted to emulate that legendary fighter, though
                the only successes have been by psionics‑users gifted with Biokinesis. They
                are able to direct bio‑energy in a way that strenthens there claws, while deteriorate
                the surfaces they hit, in such a way that the surface softens, deforms, or breaks.

                To use this ability, the user must have some sort of cutting natural armor (e.g. claws, spurs, horns). If the check is successful, the character natural weapons get strengthened, and charged with bioenergy. This energy increases the damage dealt and on an attack result of amazing the armor of the target gets infected by bioenergy, temporarily compromising its integrity. Until the start of the next round the armor rolls include a reroll, taking the worst result. Only armors of ordinary toughness are affected by this power.

                Claw/Spur/Horn attacks are made while this power is active, inflict additional damage based on the check result:
                - **Ordinary:** +1 damage
                - **Good:** +2 damage
                - **Amazing:** +3 damage

                ### Rank Benefits
                ▶ **Rank 6 [Increased Quality]** claws/spurs/horns attacks are now considered good quality.

                ▶ **Rank 8 [Improved Destabilization]** From this onwards the good success on attacks are enough to destabilize an armor. This effect now works on good quality armors as well.

                ▶ **Rank 12 [Armor Degradation]** On an amazing success the armor integrity is now so compromised that its toughness is also reduced, from Amazing to Good, from Good to Ordinary, Ordinary armor stop protecting until the effect ends.
          - es:
              description: |-
                La historia de Weren habla de un clan que usó armaduras para conquistar a los clanes Otros.
                Habiendo fabricado placas de armadura tosca con piel de marrizhe hervida, este clan
                Fue despreciado por los clanes Otros, pero también eran imparables. Luego vino un
                gran Personaje, reclamado póstumamente por cada clan Otros, que se batió en duelo
                Señor de la guerra del clan acorazado para todas sus tierras, rebaños y esposas. en medio
                del duelo, el misterio de repente cayó con ambos puños sobre su
                pecho blindado del oponente y las placas de cuero se hicieron añicos. En el mejor de los casos, un promedio
                guerrero sin su armadura, el señor de la guerra sucumbió rápidamente, y los hombres
                guerrero desapareció misteriosamente, aunque no, por supuesto, sin reclamar su
                premios.

                Los guerreros Weren han intentado durante mucho tiempo emular a ese luchador legendario, aunque
                los únicos Éxitos han sido realizados por usuarios de psiónica dotados de Biokinesis. ellos
                son capaces de dirigir la bioenergía de una manera que fortalece las garras, mientras se deterioran
                las superficies que golpean, de tal manera que la superficie se ablanda, se deforma o se rompe.

                Para utilizar esta habilidad, el usuario debe tener algún tipo de armadura natural cortante (por ejemplo, garras, espuelas, cuernos). Si la prueba tiene éxito, las armas naturales Personaje se fortalecen y se cargan con bioenergía. Esta energía aumenta el daño infligido y, tras un ataque de Asombroso, la armadura del objetivo se infecta con bioenergía, comprometiendo temporalmente su integridad. Hasta el inicio de la siguiente ronda, las tiradas de armadura incluyen una repetición, obteniendo el peor resultado. Sólo las armaduras de dureza Ordinario se ven afectadas por este poder.

                Los ataques de garra/espuela/cuerno se realizan mientras este poder está activo e infligen daño adicional según el resultado de la prueba:
                - **Ordinario:** +1 daño
                - **Bueno:** +2 de daño
                - **Asombroso:** +3 de daño

                ### Beneficios de Rango
                ▶ **Rango 6 [Calidad aumentada]** los ataques de garras/espuelas/cuernos ahora se consideran calidad Bueno.

                ▶ **Rango 8 [Desestabilización mejorada]** A partir de ahora, el éxito de los ataques de Bueno es suficiente para desestabilizar una armadura. Este efecto ahora también funciona en armaduras de calidad Bueno.

                ▶ **Rango 12 [Degradación de armadura]** Con un éxito de Asombroso, la integridad de la armadura ahora está tan comprometida que su resistencia también se reduce, de Asombroso a Bueno, de Bueno a Ordinario, la armadura Ordinario deja de proteger hasta que finaliza el efecto.
              name: Destrozar
      visual-enhancement:
        attribute: CON
        cost: 3
        url: /psionics/biokinesis/#visual-enhancement
        trained_only: false
        localized:
          - en:
              name: Visual Enhancement
              description: |-
                By psionically reshaping your visual organs and rewriting the neural pathways of the visual cortex, the character can shift their vision across different bands of the electromagnetic spectrum and map structural environments through biological signatures.

                To activate this power, the character makes a skill check. For the duration of the power, the character gains **low-light vision** (equivalent to a feline's *tapetum lucidum*), allowing them to see in near-total darkness as if it were twilight. Additionally, the character receives a step bonus to all Awareness-perception checks involving sight (normal or augmented) based on the level of success:

                * **Ordinary Success:** Grants a -1 step bonus.
                * **Good Success:** Grants a -2 step bonus.
                * **Amazing Success:** Grants a -3 step bonus.

                **Physiological Side Effects:** The activation of this power causes visible, often disturbing biological shifts. At a minimum, the character’s pupils dilate fully and a reflective membrane covers the iris, making the eyes glow in ambient light. Specific modes (see below) may cause the eyes to become faceted, multi-lensed, or cause sensory pits to open on the face, which can impair social interactions at the Gamemaster's discretion.

                **Operational Limitation:** Only one additional sight mode can be active at any given time. Shifting ocular biology is mutually exclusive; if the eyes are currently modified for infrared pit detection, they cannot simultaneously utilize the compound structure like those of mantis shrimp.  Switching between active modes requires a new activation of the power.

                Navigating while actively scanning through solid barriers slows the character to the "easy swim" rate.

                **Rank Benefits:**

                ▶ **Rank 3 [Infrared Pit Detection]**, modeled after the loreal pits of vipers, the character integrates thermal imaging into their visual field. Specialized heat-sensing pits may visibly open near the tear ducts or temples. The character can trace heat signatures, detect thermal footprints, and see living targets through low-density barriers (such as thin walls or foliage).

                ▶ **Rank 6 [Foveal Resolution]**, utilizing the dual-fovea structure and deep-pit anatomy found in raptors like eagles, the character’s eyes function as an integrated telescopic scope. The character ignores the first +1 step penalty for range (Medium or Long). This benefit does **not** stack with scopes or binoculars. Additionally, the high-resolution clarity allows the character to detect involuntary microexpressions, granting a -1 step bonus to [[awareness—perception]] or [[interaction—empathy]] checks made to discern lies or emotional states. And [[investigation—search]] checks.

                ▶ **Rank 8 [Wide-Spectrum Sensorium]**, replicating the advanced eyes of the mantis shrimp, the character’s eyes become visibly faceted and compound. They can simultaneously perceive polarized light, ultraviolet radiation, and active electromagnetic emissions (radio waves and sensor frequencies). This allows them to "see" active transmittors, like radio equipment, active sensors.

                ▶ **Rank 12 [Cortical Integration]**, the character's is able to seamlessly morph this visual organs making impossible to notice them at plain sight, eliminating any social penalty. Additionally, the character can switch between modes as an action.
          - es:
              name: Mejora Visual
              description: |-
                Al remodelar psiónicamente sus órganos visuales y reescribir las vías neuronales de la corteza visual, el Personaje puede cambiar su visión a través de diferentes bandas del espectro electromagnético y mapear entornos estructurales a través de firmas biológicas.

                Para activar este poder, el Personaje realiza una prueba de habilidad. Mientras dura el poder, el Personaje gana **visión en condiciones de poca luz** (equivalente al *tapetum lucidum* de un felino), lo que les permite ver en una oscuridad casi total como si fuera el crepúsculo. Además, el Personaje recibe un Bonificación de paso en todas las comprobaciones Alerta-Percepción que involucran la vista (normal o aumentada) según el nivel de éxito:

                * **Éxito de Ordinario:** Otorga un -1 Bonificación de paso.
                * **Éxito de Bueno:** Otorga un -2 Bonificación de paso.
                * **Éxito de Asombroso:** Otorga un -3 Bonificación de paso.

                **Efectos secundarios fisiológicos:** La activación de este poder provoca cambios biológicos visibles y a menudo perturbadores. Como mínimo, las pupilas del Personaje se dilatan por completo y una membrana reflectante cubre el iris, lo que hace que los ojos brillen con la luz ambiental. Los modos específicos (ver a continuación) pueden hacer que los ojos se vuelvan facetados, multilentes o que se abran fosas sensoriales en El Rostro, lo que puede afectar las interacciones de Social a discreción de Director de Juego.

                **Limitación operativa:** Solo se puede activar un modo de visión adicional en un momento dado. La biología ocular cambiante es mutuamente excluyente; Si los ojos están actualmente modificados para la detección de hoyos por infrarrojos, no pueden utilizar simultáneamente la estructura compuesta como los del camarón mantis.  El cambio entre modos activos requiere una nueva activación de la alimentación.

                Navegar mientras se escanea activamente a través de barreras sólidas ralentiza el Personaje a la velocidad de "nado fácil".

                **Beneficios de Rango:**

                ▶ **Rango 3 [Detección de hoyos por infrarrojos]**, modelado a partir de los hoyos reales de las víboras, el Personaje integra imágenes térmicas en su campo visual. Es posible que se abran visiblemente fosas especializadas sensibles al calor cerca de los conductos lagrimales o las sienes. El Personaje puede rastrear firmas de calor, detectar huellas térmicas y ver objetivos vivos a través de barreras de baja densidad (como paredes delgadas o follaje).

                ▶ **Rango 6 [Resolución foveal]**, utilizando la estructura de fóvea dual y la anatomía profunda que se encuentran en aves rapaces como las águilas, los ojos del Personaje funcionan como un telescopio telescópico integrado. El Personaje ignora el primer +1 Penalización de paso para alcance (Medio o Largo). Este beneficio **no** se acumula con telescopios o binoculares. Además, la claridad de alta resolución permite que Personaje detecte microexpresiones involuntarias, otorgando un -1 Bonificación de paso a [[Alerta—Percepción]] o [[Interacción—empathy]] controles realizados para discernir mentiras o estados emocionales. Y [[Investigar—search]] comprobaciones.

                ▶ **Rango 8 [Sensor de amplio espectro]**, que replica los ojos avanzados del camarón mantis, los ojos del Personaje se vuelven visiblemente facetados y compuestos. Pueden percibir simultáneamente luz polarizada, radiación ultravioleta y emisiones electromagnéticas activas (ondas de radio y frecuencias de sensores). Esto les permite "ver" transmisores activos, como equipos de radio, sensores activos.

                ▶ **Rango 12 [Integración cortical]**, el Personaje es capaz de transformar perfectamente estos órganos visuales haciendo imposible notarlos a simple vista, eliminando cualquier penalización por Social. Además, el Personaje puede cambiar entre modos como una acción.
        rank_benefits:
          - rank: 3
            title: Infrared Pit Detection
          - rank: 6
            title: Foveal Resolution
          - rank: 8
            title: Wide-Spectrum Sensorium
          - rank: 12
            title: Cortical Integration
        extended_duration: true
      transfer-vitality:
        attribute: CON
        cost: 2
        url: /psionics/biokinesis/#transfer-vitality
        trained_only: false
        localized:
          - en:
              name: Transfer Vitality
              description: |-
                By establishing physical contact, the psion forces a parasitic bio-electric link that violently siphons biological energy from the target. The target suffers immediate metabolic collapse while the psion experiences a temporary surge in biological efficiency.

                **The Drain:** To activate this power, the character must be adjacent to an organic target around the same size or bigger than themself. A successful skill check imposes a step penalty on the target's [[stamina—endurance]] and [[stamina—resist pain]] specialty checks, while the psion receives a corresponding step bonus to the same specialty skills.

                | Result | Target Penalty | Psion Bonus |
                | :--- | :--- | :--- |
                | **Crit. Failure** | No effect. | Psion suffers a +1 step penalty to CON checks |
                | **Ordinary** | +1 step penalty. | -1 step bonus. |
                | **Good** | +2 step penalty. | -2 step bonus. |
                | **Amazing** | +3 step penalty. | -3 step bonus. |

                The effect lasts until the end of the next round.

                ### Rank Benefits
                ▶ **Rank 6 [Symbiotic Absorption]**, the psion can choose to convert the siphoned energy into raw regenerative material. Instead of taking the step bonus for themselves, the psion can heal:
                - **Good:** 2 wounds
                - **Amazing:** 3 wounds

                ▶ **Rank 9 [Channel Vitality]**, the psion can use this power to restore vitality to an ally instead of the psion. Both the recipient and the donor must be adjacent to the psion when the power is activated.

                ▶ **Rank 12 [Systemic Overdrive]**, the siphoning becomes so efficient that the psion can even use the energy to heal mortal damage:
                - **Ordinary:** 1 wound
                - **Good:** 2 wounds or 1 mortal
                - **Amazing:** 4 wounds or 2 mortals
          - es:
              name: "Transferir Vitalidad"
              description: |-
                Al establecer contacto Físico, el psion fuerza un vínculo bioeléctrico parásito que extrae violentamente energía biológica del objetivo. El objetivo sufre un colapso metabólico inmediato mientras que el psion experimenta un aumento temporal en la eficiencia biológica.

                **El Drenaje:** Para activar este poder, el Personaje debe estar adyacente a un objetivo orgánico aproximadamente del mismo tamaño o más grande que él. Una prueba de habilidad exitosa impone un Penalización de paso en las pruebas de especialidad [[Aguante—Resistencia]] y [[Aguante—resist dolor]] del objetivo, mientras que el psion recibe un Bonificación de paso correspondiente a las mismas habilidades especiales.

                | Resultado | Penalización de objetivo | Bono Psión |
                | :--- | :--- | :--- |
                | **Crítico. Fracaso** | Ningún efecto. | Psion sufre un control de +1 Penalización de paso a CON |
                | **Ordinario** | +1 Penalización de paso. | -1 Bonificación de paso. |
                | **Bueno** | +2 Penalización de paso. | -2 Bonificación de paso. |
                | **Asombroso** | +3 Penalización de paso. | -3 Bonificación de paso. |

                El efecto dura hasta el final de la siguiente ronda.

                ### Beneficios de Rango
                ▶ **Rango 6 [Absorción simbiótica]**, el psion puede optar por convertir la energía desviada en material regenerativo en bruto. En lugar de tomar Bonificación de paso usted mismo, Psion puede curar:
                - **Bueno:** 2 heridas
                - **Asombroso:** 3 heridas

                ▶ **Rango 9 [Channel Vitality]**, el psion puede usar este poder para restaurar la vitalidad de un aliado en lugar del psion. Tanto el receptor como el donante deben estar adyacentes al psion cuando se activa el poder.

                ▶ **Rango 12 [Systemic Overdrive]**, el sifón se vuelve tan eficiente que el psion puede incluso usar la energía para curar el daño de Mortal:
                - **Ordinario:** 1 Herida
                - **Bueno:** 2 heridas o 1 Mortal
                - **Asombroso:** 4 heridas o 2 mortales
        rank_benefits:
          - rank: 6
            title: Symbiotic Absorption
          - rank: 9
            title: Channel Vitality
          - rank: 12
            title: Systemic Overdrive
        extended_duration: false
    trained_only: true
  ESP:
