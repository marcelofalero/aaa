items:
  Biokinesis:
    attribute: CON
    url: /psionics/biokinesis/
    cost: 6
    localized:
      - en:
          name: Biokinesis
          description: |-
            Using this skill allows a character to harness the power of the mind to
            enhance his or her performance. With just the broad skill, a character can
            attempt to use any of the related specialty skills except those that can't be
            used untrained.
      - es:
          name: Biokinesis
          description: |-
            El uso de esta habilidad permite a un personaje aprovechar el poder de la
            mente para mejorar su rendimiento. Con solo la habilidad de base, un personaje
            puede intentar usar cualquiera de las habilidades de especialidad
            relacionadas, excepto aquellas que no pueden usarse sin entrenamiento.
    items:
      bio-armor:
        attribute: CON
        cost: 3
        url: /psionics/biokinesis/#bio-armor
        trained_only: false
        rank_benefits:
          - rank: 3
            title: Increased Effect
          - rank: 6
            title: Increased Effect
          - rank: 9
            title: Increased Toughness
          - rank: 12
            title: Increased Effect
        extended_duration: false
        localized:
          - en:
              name: Bio-armor
              description: |-
                This skill psionically reinforces a character's skin, helping to protect from damage. This "body armor" provides (LI d6/HI d6/En d4) points of protection against damage, but does not protect against psionic attacks. (See Telepathy for ways to avoid psionic attacks.)

                The result of the skill check determines the duration of the bio-armor:
                - **Ordinary:** 10 minutes.
                - **Good:** 1 hour.
                - **Amazing:** 6 hours.

                The skin hardening impairs the character's movement in the same way as worn armor with AP 1, but a lighter version can be achieved by sacrificing 1 point of armor on each category, this eliminates the armor penalty.

                ### Rank Benefits
                - **Rank 3 [Increased Effect]:** the protection afforded by bio-armor increases to (LI d8 / HI d6 / En d4+1).
                - **Rank 6 [Increased Effect]:** this value further increases to (LI d8 / HI d6+1 / En d6)b .
                - **Rank 9 [Increased Toughness]:** the armor is treated as being of Good toughness.
                - **Rank 12 [Increased Effect]:** the armor value increases again to (LI 2d4 / HI 2d4 / En d8).
          - es:
              name: Bioarmadura
              description: |-
                Esta habilidad refuerza psiónicamente la piel de Personaje, ayudando a protegerla del daño. Esta "armadura corporal" proporciona (LI d6/HI d6/En d4) puntos de protección contra daños, pero no protege contra ataques psiónicos. (Consulte Telepatía para conocer formas de evitar ataques psiónicos).

                El resultado de la prueba de habilidad determina la duración de la bioarmadura:
                - **Ordinario:** 10 minutos.
                - **Bueno:** 1 hora.
                - **Asombroso:** 6 horas.

                El endurecimiento de la piel perjudica el movimiento del Personaje de la misma manera que una armadura desgastada con AP 1, pero se puede lograr una versión más ligera sacrificando 1 punto de armadura en cada categoría, esto elimina la penalización de armadura.

                ### Beneficios de Rango
                - **Rango 3 [Efecto aumentado]:** la protección brindada por la bioarmadura aumenta a (LI d8 / HI d6 / En d4+1).
                - **Rango 6 [Efecto aumentado]:** este valor aumenta aún más a (LI d8 / HI d6+1 / En d6)b.
                - **Rango 9 [Dureza aumentada]:** la armadura se trata como si tuviera dureza Bueno.
                - **Rango 12 [Efecto aumentado]:** el valor de la armadura aumenta nuevamente a (LI 2d4 / HI 2d4 / En d8).
      bioweapon:
        attribute: CON
        cost: 3
        url: /psionics/biokinesis/#bioweapon
        trained_only: false
        rank_benefits:
          - rank: 3
            title: Increased Damage
          - rank: 6
            title: Increased Damage
          - rank: 9
            title: Improved Damage
          - rank: 12
            title: Increased Damage
        extended_duration: true
        localized:
          - en:
              name: Bioweapon
              description: "When employing this skill, a character generates a field of kinetic energy emanating from his or her hands. This energy manifests in one of two ways, to be chosen by the player at the time the character makes a successful skill check: a staff or a sword.\n\nThe player may alter the shape of the staff to a club, and the sword to a particular type of sword (katana, saber, broadsword, and so on). These changes neither affect the damage the bioweapon will do, nor do they grant any special properties to the weapon; they are cosmetic only.\n\nThe principal difference in the two forms is in the sort of damage they do. A character who wishes just to knock out an opponent would be best served creating a staff; those who mean to inflict more serious harm on an opponent will likely create the sword.\n\n| Form | Base Damage | Type |\n| :--- | :--- | :---: |\n| **Staff** | d8s/d8+2s/d12+2s | LI/O |\n| **Sword** | d6w/d6+2w/d6m | LI/O |\n\nThe character uses the **Melee Combat—powered**
                specialty skill to wield the bioweapon, regardless of its form.\n\nThe result of the bioweapon skill check may add a bonus to the Melee Combat—powered skill check as follows:\n- **Ordinary:** –1 step bonus\n- **Good:** –2 step bonus\n- **Amazing:** –3 step bonus\n\nThis bonus lasts until the character chooses not to maintain the bioweapon.\n\n**Rank Benefits:**\n- **Rank 3 [Increased Damage]** the damage of the bioweapon increases by +1.\n- **Rank 6 [Increased Damage]** it increases again (to a total of +2).\n- **Rank 9 [Increased Damage]** all attacks made with the bioweapon are considered to deliver **Good damage**.\n- **Rank 12 [Improved Damage]** it increases by another +1 (to a total of +3)."
          - es:
              name: Bioarma
              description: |-
                Al emplear esta habilidad, un Personaje genera un campo de energía cinética que emana de sus manos. Esta energía se manifiesta de dos maneras, que el jugador elegirá en el momento en que Personaje realice una prueba de habilidad exitosa: un bastón o una espada.

                El jugador puede alterar la forma del bastón a un garrote y la espada a un tipo particular de espada (katana, sable, espada ancha, etc.). Estos cambios no afectan el daño que causará el arma biológica ni le otorgan propiedades especiales; son sólo cosméticos.

                La principal diferencia entre las dos formas está en el tipo de daño que causan. Un Personaje que simplemente desee noquear a un oponente sería mejor si creara un bastón; aquellos que pretenden infligir un daño más grave a un oponente probablemente crearán la espada.

                | Formulario | Daño base | Tipo |
                | :--- | :--- | :---: |
                | **Personal** | d8s/d8+2s/d12+2s | LI/O |
                | **Espada** | d6w/d6+2w/d6m | LI/O |

                El Personaje usa el **Combate cuerpo a cuerpo—Armas de energía** Especialidad para empuñar el arma biológica, independientemente de su forma.

                El resultado de la prueba de habilidad con arma biológica puede agregar una bonificación a la prueba de habilidad Combate cuerpo a cuerpo—Armas de energía de la siguiente manera:
                - **Ordinario:** –1 Bonificación de paso
                - **Bueno:** –2 Bonificación de paso
                - **Asombroso:** –3 Bonificación de paso

                Esta bonificación dura hasta que Personaje decida no mantener el arma biológica.

                **Beneficios de Rango:**
                - **Rango 3 [Daño aumentado]** el daño del arma biológica aumenta en +1.
                - **Rango 6 [Daño aumentado]** aumenta nuevamente (a un total de +2).
                - **Rango 9 [Daño aumentado]** se considera que todos los ataques realizados con el arma biológica causan **daño Bueno**.
                - **Rango 12 [Daño mejorado]** aumenta en otro +1 (hasta un total de +3).
      control-metabolism:
        attribute: CON
        cost: 2
        url: /psionics/biokinesis/#control-metabolism
        trained_only: false
        extended_duration: true
        localized:
          - en:
              name: Control Metabolism
              description: "Through the use of this skill, a character can regulate his or her metabolic\nprocesses. This allows longer survival without food and water, in extreme\nclimates, and in other hostile conditions. The character can also slow bodily\nfunctions to the point of pretending to be dead, should he or she need to fool\nothers in some situation.\n\nA check is made when a character enters a hostile environment or otherwise\nwants to employ this skill.\n\n#### Hostile Environments\nIn the case of a hostile environment, the result of a skill check determines\nthe type of protection a character can simulate:\n- **Ordinary:** vacuum suit\n- **Good:** soft e-suit\n- **Amazing:** hard e-suit\n\nBy spending an extra point of psionic energy, the character can treat the skill use as if he has one step better result. He can also spend an extra point of psionic energy to treat the extended duration as one step better.\n\n#### Adrenal boost\nThe character can mentally boost adrenaline
                output, giving an action check\nbonus. \n- **Ordinary:** +1 to action check score.\n- **Good:** +2 to action check score.\n- **Amazing:** +3 to action check score.\n\n#### Endorphin release\nThe character can mentally stimulate the production of endorphins, increasing\nhis or her resistance to pain and fatigue.\n- **Ordinary:** -1 step bonus to Stamina checks.\n- **Good:** -2 step bonus to Stamina checks.\n- **Amazing:** -3 step bonus to Stamina checks.\n\n> Only one use of the skill is allowed at the same time (hostile environments, adrenal boost, or endorphin release)."
          - es:
              name: Control del Metabolismo
              description: |-
                Mediante el uso de esta habilidad, un Personaje puede regular su metabolismo
                procesos. Esto permite una supervivencia más prolongada sin comida ni agua, en casos extremos.
                climas y en condiciones hostiles. El Personaje también puede ralentizar el movimiento corporal.
                funciona hasta el punto de fingir estar muerto, en caso de que necesite engañar
                otros en alguna situación.

                Se realiza una verificación cuando un Personaje ingresa a un entorno hostil o de otra manera
                quiere emplear esta habilidad.

                #### Ambientes hostiles
                En el caso de un entorno hostil, el resultado de una prueba de habilidad determina
                El tipo de protección que un Personaje puede simular:
                - **Ordinario:** traje de vacío
                - **Bueno:** traje eléctrico suave
                - **Asombroso:** traje electrónico duro

                Al gastar un punto extra de energía psiónica, el Personaje puede tratar el uso de la habilidad como si tuviera un resultado un paso mejor. También puede gastar un punto extra de energía psiónica para tratar la duración extendida como un paso mejor.

                #### Impulso suprarrenal
                El Personaje puede aumentar mentalmente la producción de adrenalina, dando un Tirada de Acción
                bonificación. 
                - **Ordinario:** +1 a la puntuación Tirada de Acción.
                - **Bueno:** +2 a la puntuación Tirada de Acción.
                - **Asombroso:** +3 a la puntuación Tirada de Acción.

                #### Liberación de endorfinas
                El Personaje puede estimular mentalmente la producción de endorfinas, aumentando
                su resistencia al dolor y Fatiga.
                - **Ordinario:** -1 comprobaciones de Bonificación de paso a Aguante.
                - **Bueno:** -2 comprobaciones de Bonificación de paso a Aguante.
                - **Asombroso:** -3 comprobaciones de Bonificación de paso a Aguante.

                > Solo se permite un uso de la habilidad al mismo tiempo (entornos hostiles, impulso suprarrenal o liberación de endorfinas).
      heal:
        attribute: CON
        cost: 4
        url: /psionics/biokinesis/#heal
        trained_only: true
        rank_benefits:
          - rank: 4
            title: Treat Poison
          - rank: 6
            title: Heal Mortal
          - rank: 8
            title: Laying On Hands
          - rank: 12
            title: Master Healer
        extended_duration: false
        localized:
          - en:
              name: Heal
              description: "By concentrating, a character using this skill can heal wounds or disease. The character can treat wounds or diseases, healing the subject a number of wound points based on the skill check result.\n\n### Wounds\n- **Ordinary:** 1 wound point\n- **Good:** 2 wound points\n- **Amazing:** 3 wound points\n\n### Disease\nFor disease, the following results apply:\n- **Ordinary:** reduce the degree of illness by one grade (from Good to Ordinary, for instance).\n- **Good:** reduce by two grades.\n- **Amazing:** reduce by three grades. \n\nDiseases reduced below Marginal are considered cured.\n\n### Timing\nPsionic healing imposes heavy strain on the body, so the skill can't be attempted more than once per hour, any attempt of using the skill more than once per hour will result in a level of exhaustion that cannot be recovered from until 24 hours have passed since the last attempt.\n\n### Rank Benefits\n- **Rank 4 [Treating Poison]**, a character may counteract the effect
                of poisons or drugs in his or her system before the end of their onset time, reducing the impact they may have. The degree of success acts as a bonus to the Constitution feat check required: **Ordinary:** –2 step bonus, **Good:** –3 step bonus, **Amazing:** –4 step bonus.\n- **Rank 6 [Healing Mortal Damage]**, a character becomes able to heal mortal damage. Skill check results change to: **Ordinary:** 2 wounds, **Good:** 3 wounds or 1 mortal, **Amazing:** 4 wounds or 2 mortals.\n- **Rank 8 [Improved Effect]**, a character's ability to heal improves further: **Ordinary:** 3 wounds or 1 mortal, **Good:** 4 wounds or 2 mortals, **Amazing:** 6 wounds or 3 mortals.\n- **Rank 8 [Laying On Hands]**, a character becomes able to heal damage in others. The subject to be healed must be in physical contact with the character using this ability.\n- **Rank 12 [Master Healer]**, a character reduces the strain of psionic healing, the skill can be attempted once every 10 minutes without causing
                exhaustion. Additionally, the character can double the number of mortals healed at the cost of 1 additional psionic energy per mortal healed and one point of exhaustion on both healer and subject."
          - es:
              name: Sanar
              description: |-
                Al concentrarse, un Personaje que utilice esta habilidad puede curar heridas o enfermedades. El Personaje puede tratar heridas o enfermedades, curando al sujeto una cantidad de puntos Herida según el resultado de la prueba de habilidad.

                ### Heridas
                - **Ordinario:** 1 punto Herida
                - **Bueno:** 2 puntos Herida
                - **Asombroso:** 3 puntos Herida

                ### Enfermedad
                Para la enfermedad, se aplican los siguientes resultados:
                - **Ordinario:** reduce el grado de enfermedad en un grado (de Bueno a Ordinario, por ejemplo).
                - **Bueno:** reducir en dos grados.
                - **Asombroso:** reducir en tres grados.

                Las enfermedades reducidas por debajo del Marginal se consideran curadas.

                ### Momento
                La curación psiónica impone una gran tensión en el cuerpo, por lo que la habilidad no se puede intentar más de una vez por hora; cualquier intento de usar la habilidad más de una vez por hora resultará en un nivel de agotamiento del que no se podrá recuperar hasta que hayan pasado 24 horas desde el último intento.

                ### Beneficios de Rango
                - **Rango 4 [Tratamiento del Veneno]**, un Personaje puede contrarrestar el efecto de los venenos o drogas en su sistema antes de que finalice su tiempo de aparición, reduciendo el impacto que puedan tener. El grado de éxito actúa como una bonificación a la prueba de dote de Constitución requerida: **Ordinario:** –2 Bonificación de paso, **Bueno:** –3 Bonificación de paso, **Asombroso:** –4 Bonificación de paso.
                - **Rango 6 [Curación del daño de Mortal]**, un Personaje puede curar el daño de Mortal. Los resultados de la prueba de habilidad cambian a: **Ordinario:** 2 heridas, **Bueno:** 3 heridas o 1 Mortal, **Asombroso:** 4 heridas o 2 mortales.
                - **Rango 8 [Efecto mejorado]**, la capacidad de curación de un Personaje mejora aún más: **Ordinario:** 3 heridas o 1 Mortal, **Bueno:** 4 heridas o 2 mortales, **Asombroso:** 6 heridas o 3 mortales.
                - **Rango 8 [Imposición de manos]**, un Personaje se vuelve capaz de curar el daño de otros. El sujeto a curar debe estar en contacto Físico con el Personaje usando esta habilidad.
                - **Rango 12 [Master Healer]**, un Personaje reduce la tensión de la curación psiónica, la habilidad se puede intentar una vez cada 10 minutos sin causar agotamiento. Además, el Personaje puede duplicar el número de mortales curados a costa de 1 energía psiónica adicional por cada Mortal curado y un punto de agotamiento tanto para el sanador como para el sujeto.
      morph:
        attribute: CON
        cost: 4
        url: /psionics/biokinesis/#morph
        trained_only: true
        rank_benefits:
          - rank: 12
            title: Morph Control
            extended_duration: true
        extended_duration: false
        localized:
          - en:
              name: Morph
              description: "By using this skill, a **character** can alter physical features to avoid recognition, impersonate, or achieve feats otherwise impossible (e.g., squeeze into a small hole, reach high places, or slip free of bonds).\n\nMorphing requires an entire round (4 phases) to complete. The character can do nothing else while this process is taking place.\n\nThe initial skill check determines how long the morphed form lasts:\n- **Ordinary:** 1 round\n- **Good:** 2 rounds\n- **Amazing:** 3 rounds\n\nA morphed body part retains its original characteristics; no game statistics change except those directly related to the morphing. Morphing has no effect on a character's clothing or possessions.\n\n### Rank Benefits\n#### Disguise (ranks 5, 7, 9, 12)\n**Rank 5** – Facial disguise: +2 step penalty to Awareness checks when trying to recognize the character.\n\n**Rank 7** – Limb‑length adaptation: alter limb length to aid impersonation.\n\n**Rank 9** – Body‑volume change: shrink
                or expand to fit unusually shaped spaces.\n\n**Rank 12** – Improved disguise: +4 step penalty, can mimic a specific person.\n\n#### Impersonation (ranks 5, 7, 9)\n**Rank 5** – Voice mimicry: copy another's speech patterns. -1 step bonus to Entertainment-Act checks.\n\n**Rank 7** – Mannerism replication: an additional -1 step bonus to Entertainment-Act checks due to the ability of freely replicating the subject's mannerisms.\n\n**Rank 9** – Full persona adoption: combine voice, mannerisms, and appearance for a convincing impersonation. Due to the ability to completely separate his mental state from the visible persona, the character gains an additional -1 step bonus to Interaction and Entertainment-Act checks.\n\n#### Mechanical Alteration (ranks 5, 7, 9, 12)\n**Rank 5** – Increase flexibility: +0.5 m reach for a specific limb.\n\n**Rank 7** – Reduce stun damage taken from blunt attacks and secondary damage by 1.\n\n**Rank 9** – Soft landing: halve damage from falling.\n\n\
                **Rank 12** – Reduce stun damage taken from blunt attacks and secondary damage by 2.\n\n#### Small‑Space Passage (Ranks 5, 7, 9)\n**Rank 5** – Squeeze through cracks (up to 30 cm wide).\n\n**Rank 7** – Pass through tight spaces as if you have no bones up to 25cm diameter.\n\n**Rank 9** – Able to pass a arm through a 1 cm wide crack or space, allowing to pass the arm under a door and combine with elongate arms reach the lock from the inside.\n\n#### Reach & Height (Ranks 5, 7, 9)\n**Rank 5** – Elongate fingers: +0.5 m reach.\n\n**Rank 7** – Elongate arms: +1 m reach.\n\n**Rank 9** – Elongate legs: +1 m height.\n\n#### Contortion and Compression (Ranks 5, 7, 9)\n**Rank 5** – Fit into a container of similar \"volume\" as your body. The volume of an average human male can fit in a 50cm side cube with a limited degree of movement. \n\n**Rank 7** – Fit into a container of 3/4 the volume of your body, movement is not hindered. \n\n**Rank 9** – Fit into a container of 1/2 the volume
                of your body, movement is not hindered."
          - es:
              name: Metamorfosis
              description: |-
                Al usar esta habilidad, un **Personaje** puede alterar las características de Físico para evitar el reconocimiento, hacerse pasar por alguien o lograr hazañas que de otro modo serían imposibles (por ejemplo, meterse en un pequeño agujero, alcanzar lugares altos o liberarse de ataduras).

                La transformación requiere una ronda completa (4 fases) para completarse. El Personaje no puede hacer nada más mientras se lleva a cabo este proceso.

                La prueba de habilidad inicial determina cuánto dura la forma transformada:
                - **Ordinario:** 1 ronda
                - **Bueno:** 2 rondas
                - **Asombroso:** 3 rondas

                Una parte del cuerpo transformada conserva sus características originales; No cambian las estadísticas del juego, excepto aquellas directamente relacionadas con la transformación. La transformación no tiene ningún efecto sobre la ropa o las posesiones de un Personaje.

                ### Beneficios de Rango
                #### Disfraz (Rangos 5, 7, 9, 12)
                **Rango 5** – Disfraz facial: +2 controles de Penalización de paso a Alerta al intentar reconocer el Personaje.

                **Rango 7** – Adaptación de la longitud de las extremidades: modifique la longitud de las extremidades para facilitar la suplantación.

                **Rango 9** – Cambio de volumen corporal: encoge o expande para adaptarse a espacios con formas inusuales.

                **Rango 12** – Disfraz mejorado: +4 Penalización de paso, puede imitar a una persona específica.

                #### Suplantación (Rangos 5, 7, 9)
                **Rango 5** – Mimetismo de voz: copia los patrones de habla de otra persona. -1 Bonificación de paso a las comprobaciones de la Ley de Entretenimiento.

                **Rango 7** – Replicación de manierismos: -1 Bonificación de paso adicional a las pruebas de Ley de entretenimiento debido a la capacidad de replicar libremente los manierismos del sujeto.

                **Rango 9** – Adopción total de la persona: combina voz, gestos y apariencia para una personificación convincente. Debido a la capacidad de separar completamente su estado Mental de la persona visible, el Personaje gana -1 Bonificación de paso adicional a Interacción y controles de Ley de Entretenimiento.

                #### Alteración mecánica (Rangos 5, 7, 9, 12)
                **Rango 5** – Aumenta la flexibilidad: +0,5 m de alcance para una extremidad específica.

                **Rango 7** – Reduce en 1 el daño Aturdimiento recibido por ataques Arma contundente y el daño secundario.

                **Rango 9** – Aterrizaje suave: reduce a la mitad el daño por caída.

                **Rango 12** – Reduce el daño Aturdimiento recibido de los ataques Arma contundente y el daño secundario en 2.

                #### Pasaje para espacios pequeños (Rangos 5, 7, 9)
                **Rango 5** – Exprimir a través de grietas (hasta 30 cm de ancho).

                **Rango 7** – Pasa por espacios reducidos como si no tuvieras huesos de hasta 25 cm de diámetro.

                **Rango 9** – Capaz de pasar un brazo a través de una grieta o espacio de 1 cm de ancho, permitiendo pasar el brazo debajo de una puerta y combinado con brazos alargados llegar a la cerradura desde el interior.

                #### Alcance y altura (Rangos 5, 7, 9)
                **Rango 5** – Dedos alargados: +0,5 m de alcance.

                **Rango 7** – Brazos alargados: +1m de alcance.

                **Rango 9** – Patas alargadas: +1m de altura.

                #### Contorsión y Compresión (Rangos 5, 7, 9)
                **Rango 5** – Colóquelo en un recipiente de "volumen" similar al de su cuerpo. El volumen de un hombre humano promedio puede caber en un cubo de 50 cm de lado con un grado limitado de movimiento.

                **Rango 7** – Cabe en un recipiente de 3/4 del volumen de su cuerpo, no obstaculiza el movimiento.

                **Rango 9** – Cabe en un recipiente de la mitad del volumen de su cuerpo, no se obstaculiza el movimiento.
      rejuvenate:
        attribute: CON
        cost: 3
        url: /psionics/biokinesis/#rejuvenate
        trained_only: false
        rank_benefits:
          - rank: 4
            title: Improved Effect
          - rank: 8
            title: Laying On Hands
          - rank: 12
            title: Two Recipients
        extended_duration: false
        localized:
          - en:
              name: Rejuvenate
              description: |-
                When using this skill, a character can offset fatigue or stun damage, or some of each, that he or she has suffered. The skill does nothing to alleviate
                psionic energy loss.

                A successful skill check provides the character with a certain number of
                "rejuvenation points." It costs 2 of these points to restore 1 point of
                fatigue damage, and 1 of these points to restore 1 point of stun damage. On an
                Ordinary success, the character receives 2 "rejuvenation points"; on a Good
                success, 4 points; and on an Amazing success, 6 points. The character can use
                these points in any combination to restore stun points, fatigue points, or
                some of each. "Rejuvenation points" that can't be used immediately are lost.

                Psionic rejuvenation requires time. The results are immediate, but the body's
                reaction to the use of the skill lasts one hour. For this reason, the
                rejuvenate skill can't be attempted more than once per hour.

                ### Rank Benefits:

                **Rank 3 [Improved Effect]** the effect of a successful skill roll improves as follows:
                - **Ordinary:** 4 points
                - **Good:** 6 points
                - **Amazing:** 8 points

                **Rank 3 [Treating Disease]** a character may counteract the effect of disease in his or her system. The result of the skill check determines how much the disease is reduced. The disease is reduced by one grade on **Good** success, and 2 grades on an **Amazing** success. An **Ordinary** success is not enough to help recover from the disease, but it eliminates all penalties the disease may be causing for a day. Only one successful check per day may be made to treat a disease.

                **Rank 6 [Laying On Hands]** a character becomes able to heal fatigue or stun damage, as well as disease, in others. The subject to be healed must be in physical contact with the character using this ability.

                **Rank 12 [Two Recipients]** a character using rejuvenate may affect two individuals with a single use of the skill. This can be on two other people or on the character and one other person. Each gains whatever benefit is determined by the Biokinesis-rejuvenate skill check.

                ---
          - es:
              name: Rejuvenecer
              description: |-
                Al usar esta habilidad, un Personaje puede compensar el daño de Fatiga o Aturdimiento, o parte de cada uno, que haya sufrido. La habilidad no hace nada para aliviar
                Pérdida de energía psiónica.

                Una prueba de habilidad exitosa proporciona al Personaje una cierta cantidad de
                "puntos de rejuvenecimiento". Cuesta 2 de estos puntos restaurar 1 punto de
                Daño Fatiga, y 1 de estos puntos para restaurar 1 punto de daño Aturdimiento. en un
                Éxito de Ordinario, el Personaje recibe 2 "puntos de rejuvenecimiento"; en un Bueno
                éxito, 4 puntos; y con un éxito Asombroso, 6 puntos. El Personaje puede utilizar
                estos puntos en cualquier combinación para restaurar puntos Aturdimiento, puntos Fatiga o
                algo de cada uno. Los "puntos de rejuvenecimiento" que no se pueden utilizar inmediatamente se pierden.

                El rejuvenecimiento psiónico requiere tiempo. Los resultados son inmediatos, pero el cuerpo
                La reacción al uso de la habilidad dura una hora. Por esta razón, el
                La habilidad de rejuvenecer no se puede intentar más de una vez por hora.

                ### Beneficios de Rango:

                **Rango 3 [Efecto mejorado]** el efecto de una tirada de habilidad exitosa mejora de la siguiente manera:
                - **Ordinario:** 4 puntos
                - **Bueno:** 6 puntos
                - **Asombroso:** 8 puntos

                **Rango 3 [Tratamiento de enfermedades]** un Personaje puede contrarrestar el efecto de la enfermedad en su sistema. El resultado de la prueba de habilidad determina cuánto se reduce la enfermedad. La enfermedad se reduce en un grado si se logra **Bueno** y en 2 grados si se logra **Asombroso**. Un éxito **Ordinario** no es suficiente para ayudar a recuperarse de la enfermedad, pero elimina todas las penalizaciones que la enfermedad pueda estar causando durante un día. Sólo se podrá realizar un control exitoso por día para tratar una enfermedad.

                **Rango 6 [Imposición de manos]** un Personaje se vuelve capaz de curar daños Fatiga o Aturdimiento, así como enfermedades, en otros. El sujeto a curar debe estar en contacto Físico con el Personaje usando esta habilidad.

                **Rango 12 [Dos destinatarios]** un Personaje que usa rejuvenecer puede afectar a dos personas con un solo uso de la habilidad. Esto puede ser en dos personas Otros o en Personaje y una persona Otros. Cada uno obtiene el beneficio que determine la prueba de habilidad de rejuvenecimiento de Biokinesis.

                ---
      clamber:
        attribute: CON
        cost: 2
        url: /psionics/biokinesis/#clamber
        trained_only: false
        rank_benefits:
          - rank: 4
            title: Increased Distance
          - rank: 8
            title: Increased Distance
          - rank: 12
            title: Increased Distance
        extended_duration: true
        localized:
          - en:
              name: Clamber
              description: |-
                In the distant past, certain t'sa psions developed the **clamber**
                skill—usually those who dwelled in the mountainous regions of the t'sa
                homeworld. With it, the psionic t'sa (or a psion trained by t'sa) generates
                thousands of tiny suckers on the palms of his hands and the soles of his or
                her feet. The character can then move up and down nearly vertical surfaces
                with ease, and can even move across inverted surfaces for short distances. In
                the steep mountains of the t'sa homeworld, this often meant survival.

                The degree of success with this skill determines the modifier to a psion's
                **Athletics—climb** attempt. The psion gains a **–1, –2, or –3 step bonus**,
                depending on the degree of success (Ordinary, Good, or Amazing). Further, if
                the distance is within the user's walk rate, the character can dash across
                inverted surfaces, effectively running across the ceiling. The character
                cannot stop or change direction before traveling the full distance without
                falling. The same will happen if the character has nothing to hold onto on
                reaching his or her destination.

                **Rank Benefits:**
                - **Rank 4 [Increased Distance]** the distance the user can travel while climbing or running across inverted surfaces is doubled.
                - **Rank 8 [Increased Distance]** the distance is three times the base rate.
                - **Rank 12 [Increased Distance]** the distance is four times the base rate.
          - es:
              description: |-
                En el pasado lejano, ciertos t'sa psions desarrollaron la **trepa**
                habilidad, generalmente aquellos que habitaban en las regiones montañosas de los t'sa
                mundo natal. Con él, el t'sa psiónico (o un psion entrenado por t'sa) genera
                miles de pequeñas ventosas en las palmas de sus manos y en las plantas de sus
                sus pies. Luego, el Personaje puede moverse hacia arriba y hacia abajo en superficies casi verticales.
                con facilidad e incluso puede moverse a través de superficies invertidas en distancias cortas. en
                En las escarpadas montañas del mundo natal de los t'sa, esto a menudo significaba supervivencia.

                El grado de éxito con esta habilidad determina el modificador de la habilidad de un psion.
                **Atletismo—intento de escalada**. El psion gana un **–1, –2 o –3 Bonificación de paso**,
                dependiendo del grado de éxito (Ordinario, Bueno o Asombroso). Además, si
                la distancia está dentro de la velocidad de caminata del usuario, el Personaje puede cruzar
                superficies invertidas, recorriendo efectivamente el techo. El Personaje
                No puede detenerse ni cambiar de dirección antes de recorrer la distancia completa sin
                cayendo. Lo mismo ocurrirá si el Personaje no tiene nada a qué agarrarse
                llegando a su destino.

                **Beneficios de Rango:**
                - **Rango 4 [Distancia aumentada]** se duplica la distancia que el usuario puede recorrer mientras trepa o corre por superficies invertidas.
                - **Rango 8 [Distancia aumentada]** la distancia es tres veces la tarifa base.
                - **Rango 12 [Distancia aumentada]** la distancia es cuatro veces la tarifa base.
              name: Trepado
      shatter:
        attribute: CON
        cost: 3
        url: /psionics/biokinesis/#shatter
        trained_only: false
        rank_benefits:
          - rank: 6
            title: Increased Quality
          - rank: 8
            title: Improved Destabilization
          - rank: 12
            title: Armor Degradation
        extended_duration: false
        localized:
          - en:
              name: Shatter
              description: |-
                Weren history tells of a clan that used armor to conquer the other clans.
                Having fashioned plates of crude armor from boiled marrizhe hide, this clan
                was despised by the other clans—but they were also unstoppable. Then came a
                great character—posthumously claimed by every other clan—who duelled the
                warlord of the armored clan for all his land, herds, and wives. In the midst
                of the duel, the mystery weren suddenly brought both fists down on his
                opponent's armored chest, and the leather plates shattered. At best an average
                fighter without his armor, the warlord quickly succumbed, and the weren
                warrior mysteriously vanished—though not, of course, without claiming his
                prizes.

                Weren warriors have long attempted to emulate that legendary fighter, though
                the only successes have been by psionics‑users gifted with Biokinesis. They
                are able to direct bio‑energy in a way that strenthens there claws, while deteriorate
                the surfaces they hit, in such a way that the surface softens, deforms, or breaks.

                To use this ability, the user must have some sort of cutting natural armor (e.g. claws, spurs, horns). If the check is successful, the character natural weapons get strengthened, and charged with bioenergy. This energy increases the damage dealt and on an attack result of amazing the armor of the target gets infected by bioenergy, temporarily compromising its integrity. Until the start of the next round the armor rolls include a reroll, taking the worst result. Only armors of ordinary toughness are affected by this power.

                Claw/Spur/Horn attacks are made while this power is active, inflict additional damage based on the check result:
                - **Ordinary:** +1 damage
                - **Good:** +2 damage
                - **Amazing:** +3 damage

                ### Rank Benefits
                **Rank 6 [Increased Quality]** claws/spurs/horns attacks are now considered good quality. 

                **Rank 8 [Improved Destabilization]** From this onwards the good success on attacks are enough to destabilize an armor. This effect now works on good quality armors as well.

                **Rank 12 [Armor Degradation]** On an amazing success the armor integrity is now so compromised that its toughness is also reduced, from Amazing to Good, from Good to Ordinary, Ordinary armor stop protecting until the effect ends.
          - es:
              description: |-
                La historia de Weren habla de un clan que usó armaduras para conquistar a los clanes Otros.
                Habiendo fabricado placas de armadura tosca con piel de marrizhe hervida, este clan
                Fue despreciado por los clanes Otros, pero también eran imparables. Luego vino un
                gran Personaje, reclamado póstumamente por cada clan Otros, que se batió en duelo
                Señor de la guerra del clan acorazado para todas sus tierras, rebaños y esposas. en medio
                del duelo, el misterio de repente cayó con ambos puños sobre su
                pecho blindado del oponente y las placas de cuero se hicieron añicos. En el mejor de los casos, un promedio
                guerrero sin su armadura, el señor de la guerra sucumbió rápidamente, y los hombres
                guerrero desapareció misteriosamente, aunque no, por supuesto, sin reclamar su
                premios.

                Los guerreros Weren han intentado durante mucho tiempo emular a ese luchador legendario, aunque
                los únicos Éxitos han sido realizados por usuarios de psiónica dotados de Biokinesis. ellos
                son capaces de dirigir la bioenergía de una manera que fortalece las garras, mientras se deterioran
                las superficies que golpean, de tal manera que la superficie se ablanda, se deforma o se rompe.

                Para utilizar esta habilidad, el usuario debe tener algún tipo de armadura natural cortante (por ejemplo, garras, espuelas, cuernos). Si la prueba tiene éxito, las armas naturales Personaje se fortalecen y se cargan con bioenergía. Esta energía aumenta el daño infligido y, tras un ataque de Asombroso, la armadura del objetivo se infecta con bioenergía, comprometiendo temporalmente su integridad. Hasta el inicio de la siguiente ronda, las tiradas de armadura incluyen una repetición, obteniendo el peor resultado. Sólo las armaduras de dureza Ordinario se ven afectadas por este poder.

                Los ataques de garra/espuela/cuerno se realizan mientras este poder está activo e infligen daño adicional según el resultado de la prueba:
                - **Ordinario:** +1 daño
                - **Bueno:** +2 de daño
                - **Asombroso:** +3 de daño

                ### Beneficios de Rango
                **Rango 6 [Calidad aumentada]** Los ataques de garras, espuelas y cuernos ahora se consideran de calidad Bueno.

                **Rango 8 [Desestabilización mejorada]** A partir de ahora, el éxito de los ataques de Bueno es suficiente para desestabilizar una armadura. Este efecto ahora también funciona en armaduras de calidad Bueno.

                **Rango 12 [Degradación de armadura]** Con un éxito de Asombroso, la integridad de la armadura ahora está tan comprometida que su dureza también se reduce, de Asombroso a Bueno, de Bueno a Ordinario, la armadura Ordinario deja de proteger hasta que finaliza el efecto.
              name: Destrozar
      visual-enhancement:
        attribute: CON
        cost: 3
        url: /psionics/biokinesis/#visual-enhancement
        trained_only: false
        localized:
          - en:
              name: Visual Enhancement
              description: "By psionically reshaping your visual organs and rewriting the neural pathways of the visual cortex, the character can shift their vision across different bands of the electromagnetic spectrum and map structural environments through biological signatures.\n\nTo activate this power, the character makes a skill check. For the duration of the power, the character gains **low-light vision** (equivalent to a feline's *tapetum lucidum*), allowing them to see in near-total darkness as if it were twilight. Additionally, the character receives a step bonus to all Awareness-perception checks involving sight (normal or augmented) based on the level of success:\n\n* **Ordinary Success:** Grants a -1 step bonus.\n* **Good Success:** Grants a -2 step bonus.\n* **Amazing Success:** Grants a -3 step bonus.\n\n**Physiological Side Effects:** The activation of this power causes visible, often disturbing biological shifts. At a minimum, the character’s pupils dilate fully and a reflective
                membrane covers the iris, making the eyes glow in ambient light. Specific modes (see below) may cause the eyes to become faceted, multi-lensed, or cause sensory pits to open on the face, which can impair social interactions at the Gamemaster's discretion.\n\n**Operational Limitation:** Only one additional sight mode can be active at any given time. Shifting ocular biology is mutually exclusive; if the eyes are currently modified for infrared pit detection, they cannot simultaneously utilize the compound structure like those of mantis shrimp.  Switching between active modes requires a new activation of the power.\n\nNavigating while actively scanning through solid barriers slows the character to the \"easy swim\" rate.\n\n**Rank Benefits:**\n\n* **At rank 3 [Infrared Pit Detection]**, modeled after the loreal pits of vipers, the character integrates thermal imaging into their visual field. Specialized heat-sensing pits may visibly open near the tear ducts or temples. The character
                can trace heat signatures, detect thermal footprints, and see living targets through low-density barriers (such as thin walls or foliage).\n\n* **At rank 6 [Foveal Resolution]**, utilizing the dual-fovea structure and deep-pit anatomy found in raptors like eagles, the character’s eyes function as an integrated telescopic scope. The character ignores the first +1 step penalty for range (Medium or Long). This benefit does **not** stack with scopes or binoculars. Additionally, the high-resolution clarity allows the character to detect involuntary microexpressions, granting a -1 step bonus to Awareness or Interaction checks made to discern lies or emotional states. And Investigation-Search checks.\n\n* **At rank 8 [Wide-Spectrum Sensorium]**, replicating the advanced eyes of the mantis shrimp, the character’s eyes become visibly faceted and compound. They can simultaneously perceive polarized light, ultraviolet radiation, and active electromagnetic emissions (radio waves and
                sensor frequencies). This allows them to \"see\" active transmittors, like radio equipment, active sensors.\n\n* **At rank 12 [Cortical Integration]**, the character's is able to seamlessly morph this visual organs making impossible to notice them at plain sight, eliminating any social penalty. Additionally, the character can switch between modes as an action."
          - es:
              name: Mejora Visual
              description: |-
                Al remodelar psiónicamente sus órganos visuales y reescribir las vías neuronales de la corteza visual, el Personaje puede cambiar su visión a través de diferentes bandas del espectro electromagnético y mapear entornos estructurales a través de firmas biológicas.

                Para activar este poder, el Personaje realiza una prueba de habilidad. Mientras dure el poder, el Personaje gana **visión en condiciones de poca luz** (equivalente al *tapetum lucidum* de un felino), lo que les permite ver en una oscuridad casi total como si fuera el crepúsculo. Además, el Personaje recibe un Bonificación de paso en todas las comprobaciones Alerta-Percepción que involucran la vista (normal o aumentada) según el nivel de éxito:

                * **Éxito de Ordinario:** Otorga un -1 Bonificación de paso.
                * **Éxito de Bueno:** Otorga un -2 Bonificación de paso.
                * **Éxito de Asombroso:** Otorga un -3 Bonificación de paso.

                **Efectos secundarios fisiológicos:** La activación de este poder provoca cambios biológicos visibles, a menudo perturbadores. Como mínimo, las pupilas del Personaje se dilatan por completo y una membrana reflectante cubre el iris, lo que hace que los ojos brillen con la luz ambiental. Los modos específicos (ver a continuación) pueden hacer que los ojos se vuelvan facetados, multilentes o que se abran fosas sensoriales en El Rostro, lo que puede afectar las interacciones de Social a discreción de Director de Juego.

                **Limitación operativa:** Solo se puede activar un modo de visión adicional en un momento dado. La biología ocular cambiante es mutuamente excluyente; Si los ojos están actualmente modificados para la detección de hoyos por infrarrojos, no pueden utilizar simultáneamente la estructura compuesta como los del camarón mantis.  El cambio entre modos activos requiere una nueva activación de la alimentación.

                Navegar mientras se escanea activamente a través de barreras sólidas ralentiza el Personaje a la velocidad de "nado fácil".

                **Beneficios de Rango:**

                * **En Rango 3 [Detección de hoyos por infrarrojos]**, modelado a partir de los hoyos reales de las víboras, el Personaje integra imágenes térmicas en su campo visual. Es posible que se abran visiblemente fosas especializadas sensibles al calor cerca de los conductos lagrimales o las sienes. El Personaje puede rastrear firmas de calor, detectar huellas térmicas y ver objetivos vivos a través de barreras de baja densidad (como paredes delgadas o follaje).

                * **En Rango 6 [Resolución Foveal]**, utilizando la estructura de fóvea dual y la anatomía profunda que se encuentran en aves rapaces como las águilas, los ojos del Personaje funcionan como un telescopio telescópico integrado. El Personaje ignora el primer +1 Penalización de paso para alcance (Medio o Largo). Este beneficio **no** se acumula con telescopios o binoculares. Además, la claridad de alta resolución permite al Personaje detectar microexpresiones involuntarias, otorgando un -1 Bonificación de paso a Alerta o Interacción en las comprobaciones realizadas para discernir mentiras o estados emocionales. Y comprobaciones Investigar-Search.

                * **En Rango 8 [Wide-Spectrum Sensorium]**, replicando los ojos avanzados del camarón mantis, los ojos del Personaje se vuelven visiblemente facetados y compuestos. Pueden percibir simultáneamente luz polarizada, radiación ultravioleta y emisiones electromagnéticas activas (ondas de radio y frecuencias de sensores). Esto les permite "ver" transmisores activos, como equipos de radio, sensores activos.

                * **En Rango 12 [Integración Cortical]**, el Personaje es capaz de transformar perfectamente estos órganos visuales haciendo imposible notarlos a simple vista, eliminando cualquier penalización de Social. Además, el Personaje puede cambiar entre modos como una acción.
        rank_benefits:
          - rank: 3
            title: Infrared Pit Detection
          - rank: 6
            title: Foveal Resolution
          - rank: 8
            title: Wide-Spectrum Sensorium
          - rank: 12
            title: Cortical Integration
        extended_duration: true
      transfer-vitality:
        attribute: CON
        cost: 2
        url: /psionics/biokinesis/#transfer-vitality
        trained_only: false
        localized:
          - en:
              name: Transfer Vitality
              description: "By establishing physical contact, the psion forces a parasitic bio-electric link that violently siphons biological energy from the target. The target suffers immediate metabolic collapse while the psion experiences a temporary surge in biological efficiency.\n\n**The Drain:** To activate this power, the character must be adjacent to an organic target around the same size or bigger than themself. A successful skill check imposes a step penalty on the target's **Stamina—endurance** and **Stamina—resist pain** checks, while the psion receives a corresponding step bonus to the same specialty skills.\n\n| Result | Target Penalty | Psion Bonus |\n| :--- | :--- | :--- |\n| **Crit. Failure** | No effect. | Psion suffers a +1 step penalty to CON checks |\n| **Ordinary** | +1 step penalty. | -1 step bonus. |\n| **Good** | +2 step penalty. | -2 step bonus. |\n| **Amazing** | +3 step penalty. | -3 step bonus. |\n\nThe effect lasts until the end of the next round. \n\n###
                Rank Benefits\n**Rank 6 [Symbiotic Absorption]**, the psion can choose to convert the siphoned energy into raw regenerative material. Instead of taking the step bonus for themselves, the psion can heal:\n- **Good:** 2 wounds\n- **Amazing:** 3 wounds\n\n**Rank 9 [Channel Vitality]**, the psion can use this power to restore vitality to an ally instead of the psion. Both the recipient and the donor must be adjacent to the psion when the power is activated.\n\n**Rank 12 [Systemic Overdrive]**, the siphoning becomes so efficient that the psion can even use the energy to heal mortal damage:\n- **Ordinary:** 1 wound\n- **Good:** 2 wounds or 1 mortal\n- **Amazing:** 4 wounds or 2 mortals"
          - es:
              name: "Transferir Vitalidad"
              description: "Al establecer contacto físico, el psión fuerza un vínculo bio‑eléctrico parasitario que sifona violentamente energía biológica del objetivo. El objetivo sufre un colapso metabólico inmediato mientras el psión experimenta un impulso temporal en su eficiencia biológica.\n\n**La Drenaje:** Para activar este poder, el personaje debe estar adyacente a un objetivo orgánico de tamaño similar o mayor. Una tirada de habilidad exitosa impone una penalización de paso a los chequeos de **Resistencia—aguante** y **Resistencia—resistir dolor** del objetivo, mientras que el psión recibe un bonificador de paso correspondiente a esas mismas habilidades.\n\n| Resultado | Penalización del objetivo | Bonificación del psión |\n| :--- | :--- | :--- |\n| **Fallo crítico** | No hay efecto. | El psión sufre una penalización de +1 paso a chequeos de CON |\n| **Ordinario** | Penalización de +1 paso. | Bonificación de -1 paso. |\n| **Bueno** | Penalización de +2 pasos. | Bonificación de
                -2 pasos. |\n| **Asombroso** | Penalización de +3 pasos. | Bonificación de -3 pasos. |\n\nEl efecto dura hasta el final del siguiente asalto.\n\n### Beneficios de Rango\n**Rango 6 [Absorción simbiótica]**, el psión puede convertir la energía sifonada en material regenerativo. En lugar de tomar el bonificador de paso, el psión puede curar:\n- **Bueno:** 2 heridas\n- **Asombroso:** 3 heridas\n\n**Rango 9 [Canalizar vitalidad]**, el psión puede usar este poder para restaurar vitalidad a un aliado en lugar del psión. Tanto el receptor como el donante deben estar adyacentes al psión al activar el poder.\n\n**Rango 12 [Sobrecarga sistémica]**, la sifonación se vuelve tan eficiente que el psión puede incluso usar la energía para curar daño mortal:\n- **Ordinario:** 1 herida\n- **Bueno:** 2 heridas o 1 mortal\n- **Asombroso:** 4 heridas o 2 mortales"
        rank_benefits:
          - rank: 6
            title: Symbiotic Absorption
          - rank: 9
            title: Channel Vitality
          - rank: 12
            title: Systemic Overdrive
        extended_duration: false
    trained_only: true
  ESP:
    attribute: INT
    url: /psionics/esp/
    cost: 5
    localized:
      - en:
          name: ESP
          description: |-
            This skill allows a character to experience the environment through an agency
            beyond the normal senses, using the power of the mind. With just the broad
            skill, a character can attempt to use any of the related specialty skills
            except those that can't be used untrained.
      - es:
          name: ESP
          description: |-
            Esta habilidad permite a un personaje experimentar el entorno a través de un
            medio más allá de los sentidos normales, usando el poder de la mente. Con solo
            la habilidad de base, un personaje puede intentar usar cualquiera de las
            habilidades de especialidad relacionadas, excepto aquellas que no pueden
            usarse sin entrenamiento.
    items:
      battle-mind:
        attribute: INT
        cost: 4
        url: /psionics/esp/#battle-mind
        trained_only: true
        rank_benefits:
          - rank: 4
            title: Increased Effect
          - rank: 8
            title: Move Like Water
          - rank: 12
            title: Unerring Accuracy
        extended_duration: true
        localized:
          - en:
              name: Battle Mind
              description: |-
                To use this skill, a psion focuses on the battle at hand and makes a skill
                check. The success achieved indicates the benefit while the current
                application of the skill remains active. A successful skill check gives the
                user a bonus to his or her action checks:
                - **Ordinary:** -1 step bonus.
                - **Good:** -2 step bonus.
                - **Amazing:** -3 step bonus. For purposes of using this skill, “battle” is defined as any situation in which the character has made an action check in the same round he or she uses the battle mind skill.
                **Rank Benefits:**
                - **At rank 4 [Increased Effect]:** the bonus to action checks improves: Ordinary, -2 steps; Good, -3 steps; Amazing, -4 steps.
                - **At rank 8 [Move Like Water]:** the character employing this ability gains a temporary last resort point, which he or she must use before the ability’s duration ends or lose it. This point can only be used to offset damage.
                - **At rank 12 [Unerring Accuracy]:** the character gains a temporary last resort point, which must be used before the ability’s duration ends or it becomes lost. This point can only be used to increase the success of an attack made by the character using this ability.
          - es:
              name: Mente de Batalla
              description: |-
                Para usar esta habilidad, un psiónico se concentra en la batalla actual y
                realiza una tirada de habilidad. El éxito logrado indica el beneficio mientras
                la aplicación actual de la habilidad permanezca activa. Una tirada con éxito
                otorga al usuario un bonificador a sus tiradas de acción:
                - **Ordinario:** bonificador de -1 paso.
                - **Bueno:** bonificador de -2 pasos.
                - **Asombroso:** bonificador de -3 pasos. A efectos del uso de esta habilidad, "batalla" se define como cualquier situación en la que el personaje haya realizado una tirada de acción en el mismo asalto en que usa la habilidad de mente de batalla.
                **Beneficios de Rango:**
                - **Al rango 4 [Efecto Incrementado]:** el bonificador a las tiradas de acción mejora: Ordinario, -2 pasos; Bueno, -3 pasos; Asombroso, -4 pasos.
                - **Al rango 8 [Moverse como el Agua]:** el personaje que emplea esta capacidad gana un punto de último recurso temporal, que debe usar antes de que termine la duración de la capacidad o lo perderá. Este punto solo puede usarse para compensar daño.
                - **Al rango 12 [Precisión Infalible]:** el personaje gana un punto de último recurso temporal, que debe usarse antes de que termine la duración de la capacidad o se perderá. Este punto solo puede usarse para aumentar el éxito de un ataque realizado por el personaje que usa esta capacidad.
      clairaudience:
        attribute: INT
        cost: 2
        url: /psionics/esp/#clairaudience
        trained_only: false
        rank_benefits:
          - rank: 4
            title: Increased Duration
          - rank: 6
            title: Change of Perspective
          - rank: 8
            title: Increased Duration
          - rank: 12
            title: Increased Duration
        extended_duration: true
        localized:
          - en:
              name: Clairaudience
              description: |-
                With this skill, a character selects a location and projects his or her mind
                to that spot, hearing sounds as though physically present.

                Clairaudience does not filter out ambient noise, so the user might have
                trouble distinguishing particular sounds. It provides no help in interpreting
                unfamiliar languages or recognizing unfamiliar sounds, and the mental ear
                can't move from the selected spot. The location itself can be moving (a
                vehicle, for example), but such a target requires additional skill checks if
                the range to the target increases.

                The user remains conscious within his or her body and is aware of what's
                happening around it.

                The better the result of the skill check, the longer the ability lasts:
                - **Ordinary:** 1 round
                - **Good:** 2 rounds
                - **Amazing:** 3 rounds

                This duration can be extended by spending 1 psionic energy point for every
                additional round. Situation modifiers for the familiarity of the location and
                the distance at which clairaudience is being used are as follows:

                | Situation/distance | Modifier |
                | :--- | :---: |-
                | Familiar location | –1 |
                | Unfamiliar location | none |
                | 1–10 meters | –1 |
                | 11–100 meters | none |
                | 101 m–1 km | +1 |
                | 2–10 km | +2 |
                | 11–100 km | +3 |
                | 101–1,000 km (low orbit) | +4 |
                | 1,001–10,000 km (high orbit) | +5 |

                **Rank Benefits:**
                - **At rank 4 [Increased Duration]**, the time increment for a successful use of the skill increases to minutes (**Ordinary:** 1 minute; **Good:** 2 minutes; **Amazing:** 3 minutes). Each additional psionic energy point used to extend the duration adds 1 minute to the duration.
                - **At rank 6 [Change of Perspective]**, the character can attempt another ESP-clairaudience skill check to shift the location to which the mental ear has been projected. The new check is modified by the distance from the current location that the psion is listening to, rather than the physical distance the psion is from the target area.
                - **At rank 8 [Increased Duration]**, the time increment increases again: **Ordinary:** 5 minutes; **Good:** 10 minutes; **Amazing:** 15 minutes. Each additional psionic energy point adds 5 minutes.
                - **At rank 12 [Increased Duration]**, the time increment becomes: **Ordinary:** 30 minutes; **Good:** 60 minutes; **Amazing:** 90 minutes. Each additional psionic energy point adds 30 minutes.

                ---
          - es:
              name: Clariaudiencia
              description: |-
                Con esta habilidad, un Personaje selecciona una ubicación y proyecta su mente.
                a ese lugar, escuchando sonidos como si estuvieran físicamente presentes.

                La clariaudiencia no filtra el ruido ambiental, por lo que es posible que el usuario tenga
                dificultad para distinguir sonidos particulares. No proporciona ninguna ayuda en la interpretación.
                idiomas desconocidos o reconocer sonidos desconocidos, y el oído Mental
                No puedo moverme del lugar seleccionado. La ubicación en sí puede estar en movimiento (un
                vehículo, por ejemplo), pero tal objetivo requiere controles de habilidad adicionales si
                el alcance hasta el objetivo aumenta.

                El usuario permanece consciente dentro de su cuerpo y es consciente de lo que está
                sucediendo a su alrededor.

                Cuanto mejor sea el resultado de la prueba de habilidad, más durará la habilidad:
                - **Ordinario:** 1 ronda
                - **Bueno:** 2 rondas
                - **Asombroso:** 3 rondas

                Esta duración se puede ampliar gastando 1 punto de energía psiónica por cada
                ronda adicional. Modificadores de situación por la familiaridad de la ubicación y
                La distancia a la que se utiliza la clariaudiencia es la siguiente:

                | Situación/distancia | Modificador |
                | :--- | :---: |-
                | Ubicación familiar | –1 |
                | Ubicación desconocida | ninguno |
                | 1–10 metros | –1 |
                | 11–100 metros | ninguno |
                | 101 m–1 km | +1 |
                | 2–10 kilómetros | +2 |
                | 11-100 kilómetros | +3 |
                | 101-1.000 km (órbita baja) | +4 |
                | 1.001-10.000 km (órbita alta) | +5 |

                **Beneficios de Rango:**
                - **En Rango 4 [Duración aumentada]**, el incremento de tiempo para un uso exitoso de la habilidad aumenta a minutos (**Ordinario:** 1 minuto; **Bueno:** 2 minutos; **Asombroso:** 3 minutos). Cada punto de energía psiónica adicional utilizado para extender la duración agrega 1 minuto a la duración.
                - **En Rango 6 [Cambio de perspectiva]**, el Personaje puede intentar otra prueba de habilidad de clariaudiencia ESP para cambiar la ubicación a la que se ha proyectado el oído Mental. La nueva verificación se modifica por la distancia desde la ubicación actual que el psion está escuchando, en lugar de la distancia Físico entre el psion y el área objetivo.
                - **En Rango 8 [Duración aumentada]**, el incremento de tiempo aumenta nuevamente: **Ordinario:** 5 minutos; **Bueno:** 10 minutos; **Asombroso:** 15 minutos. Cada punto de energía psiónica adicional suma 5 minutos.
                - **En Rango 12 [Duración aumentada]**, el incremento de tiempo pasa a ser: **Ordinario:** 30 minutos; **Bueno:** 60 minutos; **Asombroso:** 90 minutos. Cada punto de energía psiónica adicional suma 30 minutos.

                ---
      clairvoyance:
        attribute: INT
        cost: 2
        url: /psionics/esp/#clairvoyance
        trained_only: false
        rank_benefits:
          - rank: 4
            title: Increased Duration
          - rank: 6
            title: Change of Perspective
          - rank: 8
            title: Increased Duration
          - rank: 12
            title: Increased Duration
        extended_duration: true
        localized:
          - en:
              name: Clairvoyance
              description: |-
                To employ this skill, a character selects a location and projects his or her
                mind to that spot, seeing everything going on around that spot as though
                physically there. Clairvoyance doesn't block normal vision, so the user sees
                double images unless his or her eyes are closed. It also provides no help in
                seeing through obscuring elements, such as walls, closed doors, or darkness,
                and the mental eye can't move from the selected spot. The location itself may
                be moving (a vehicle, for example), but such a target necessitates additional
                skill checks if the range to the target increases. The better the result of
                the skill check, the longer the ability lasts: Ordinary, 1 round; Good, 2
                rounds; Amazing, 3 rounds. This duration can be extended by spending 1 psionic
                energy point for every additional round. Situation modifiers for distance and
                familiarity are the same as for Clairaudience.
                **Rank Benefits:**
                - **At rank 4 [Increased Duration]:** the time increment increases to minutes (Ordinary, 1 minute; Good, 2 minutes, Amazing, 3 minutes).
                - **At rank 6 [Change of Perspective]:** the character can attempt another check to shift the location of the mental eye. The new check is modified by the distance from the current location being viewed.
                - **At rank 8 [Increased Duration]:** the time increment becomes 5 minutes (Ordinary, 5 minutes; Good, 10 minutes; Amazing, 15 minutes).
                - **At rank 12 [Increased Duration]:** the increment becomes 30 minutes (Ordinary, 30 minutes; Good, 60 minutes; Amazing, 90 minutes).
          - es:
              name: Clarividencia
              description: |-
                Para emplear esta habilidad, un personaje selecciona una ubicación y proyecta
                su mente a ese lugar, viendo todo lo que sucede alrededor de ese punto como si
                estuviera físicamente allí. La clarividencia no bloquea la visión normal, por
                lo que el usuario ve imágenes dobles a menos que tenga los ojos cerrados.
                Tampoco proporciona ayuda para ver a través de elementos que oscurezcan la
                visión, como paredes, puertas cerradas o oscuridad, y el ojo mental no puede
                moverse del lugar seleccionado. La ubicación en sí puede estar en movimiento
                (un vehículo, por ejemplo), pero tal objetivo requiere tiradas de habilidad
                adicionales si el rango al objetivo aumenta. Cuanto mejor sea el resultado de
                la tirada de habilidad, más tiempo durará la capacidad: Ordinario, 1 asalto;
                Bueno, 2 asaltos; Asombroso, 3 asaltos. Esta duración se puede extender
                gastando 1 punto de energía psiónica por cada asalto adicional. Los
                modificadores de situación por distancia y familiaridad son los mismos que
                para la Clariaudiencia.
                **Beneficios de Rango:**
                - **Al rango 4 [Duración Incrementada]:** el incremento de tiempo aumenta a minutos (Ordinario, 1 minuto; Bueno, 2 minutos, Asombroso, 3 minutos).
                - **Al rango 6 [Cambio de Perspectiva]:** el personaje puede intentar otra tirada para mover la ubicación del ojo mental. La nueva tirada se modifica por la distancia desde la ubicación actual que se está viendo.
                - **Al rango 8 [Duración Incrementada]:** el incremento de tiempo pasa a ser de 5 minutos (Ordinario, 5 minutos; Bueno, 10 minutos; Asombroso, 15 minutos).
                - **Al rango 12 [Duración Incrementada]:** el incremento pasa a ser de 30 minutos (Ordinario, 30 minutos; Bueno, 60 minutos; Asombroso, 90 minutos).
      dream-hunt:
        attribute: INT
        cost: 3
        url: /psionics/esp/#dream-hunt
        trained_only: true
        rank_benefits:
          - rank: 3
            title: Improved Accuracy
          - rank: 6
            title: Improved Accuracy
          - rank: 9
            title: Improved Timing
          - rank: 12
            title: Improved Accuracy
        extended_duration: false
        localized:
          - en:
              name: Dream Hunt
              description: |-
                Though originally developed for hunting animals, the technique works on any
                living being. The sesheyan (or sesheyan-trained) psion concentrates on the
                subject and mentally engages in a hunt. The better the subject’s habits are
                known, the easier the hunt. If the skill check is successful, the psion
                determines the place where the quarry will be at any single locale in the next
                24 hours (though not when). The better the target's habits are known, the
                easier the hunt:
                - **Familiar target / territory:** -2 / -1 step bonus.
                - **Described / Unknown target:** +1 / +2 step penalty. The degree of success determines how accurately the psion can pinpoint the location:
                - **Ordinary:** within 1000 meters.
                - **Good:** within 500 meters.
                - **Amazing:** within 100 meters. Characters who receive this information can make Awareness-perception checks or Investigate-search checks with a -1, -2, or -3 step bonus to locate or avoid being surprised by the quarry.
                **Rank Benefits:**
                - **At rank 3 [Improved Accuracy]:** the psion is able to narrow down the time the prey will be at a given locale to within 3 hours.
                - **At rank 6 [Improved Accuracy]:** pinpointing improved: Ordinary 500m; Good 100m; Amazing 50m.
                - **At rank 9 [Improved Timing]:** the psion can determine when the prey will be at a particular location to within 30 minutes.
                - **At rank 12 [Improved Accuracy]:** pinpointing improved: Ordinary 100m; Good 50m; Amazing 10m.
          - es:
              name: Caza Onírica
              description: |-
                Aunque originalmente desarrollada para cazar animales, esta técnica funciona
                en cualquier ser vivo. El psiónico se concentra en el sujeto y se involucra
                mentalmente en una caza. Si la tirada de habilidad tiene éxito, el psiónico
                determina el lugar donde estará la presa en cualquier ubicación única en las
                próximas 24 horas (aunque no cuándo). Cuanto mejor se conozcan los hábitos del
                objetivo, más fácil será la caza:
                - **Objetivo / territorio familiar:** bonificador de -2 / -1 pasos.
                - **Objetivo descrito / desconocido:** penalizador de +1 / +2 pasos. El grado de éxito determina con qué precisión el psiónico puede identificar la ubicación:
                - **Ordinario:** dentro de 1000 metros.
                - **Bueno:** dentro de 500 metros.
                - **Asombroso:** dentro de 100 metros. Los personajes que reciben esta información pueden realizar tiradas de Percepción-avistar o Investigar-buscar con un bonificador de -1,
                -2 o -3 pasos para localizar o evitar ser sorprendidos por la presa.
                **Beneficios de Rango:**
                - **Al rango 3 [Precisión Mejorada]:** el psiónico reduce el tiempo en que la presa estará en un lugar a un margen de 3 horas.
                - **Al rango 6 [Precisión Mejorada]:** identificación mejorada: Ordinario 500m; Bueno 100m; Asombroso 50m.
                - **Al rango 9 [Sincronización Mejorada]:** el psiónico determina cuándo estará la presa en un lugar con un margen de 30 minutos.
                - **Al rango 12 [Precisión Mejorada]:** identificación mejorada: Ordinario 100m; Bueno 50m; Asombroso 10m.
      empathy:
        attribute: INT
        cost: 1
        url: /psionics/esp/#empathy
        trained_only: false
        rank_benefits:
          - rank: 4
            title: Relationship
          - rank: 6
            title: Aura Reading
          - rank: 8
            title: Relationship
          - rank: 9
            title: Connection
          - rank: 12
            title: Relationship
        extended_duration: false
        localized:
          - en:
              name: Empathy
              description: |-
                This skill allows a psion to “read” the surface emotions of another character.
                This ability assists the user in encounter situations. The target must be
                within visual range. A successful use of empathy provides an understanding of
                the target's emotional state (Combative, Hostile, Neutral, Friendly, Charmed,
                or Fanatic) and provides a bonus when using encounter skills upon that target
                character:
                - **Ordinary:** -1 step bonus.
                - **Good:** -2 step bonus.
                - **Amazing:** -3 step bonus.
                **Rank Benefits:**
                - **At rank 4 [Relationship]:** the empath can sense the surface emotions of two other characters toward each other.
                - **At rank 6 [Aura Reading]:** evaluate health state (healthy, injured, sick, dying, insane, etc.). Grants a -1 to -3 step bonus to Medical Science, Knowledge-first aid, or Biokinesis-transfer damage (or heal if at rank 8+) checks used to treat the target. Attempts on different species suffer a +1 step penalty.
                - **At rank 8 [Relationship]:** the empath can apply this skill to three other characters.
                - **At rank 9 [Connection]:** develop a connection with an individual to sense emotions even when not in visual range, up to 1 mile per rank away.
                - **At rank 12 [Relationship]:** the empath can apply this skill to four other characters.
          - es:
              name: Empatía
              description: |-
                Esta habilidad permite a un psiónico "leer" las emociones superficiales de
                otro personaje. Esta capacidad ayuda al usuario en situaciones de encuentro.
                El objetivo debe estar dentro del rango visual. Un uso exitoso de la empatía
                proporciona una comprensión del estado emocional del objetivo (Combativo,
                Hostil, Neutral, Amistoso, Encantado o Fanático) y otorga un bonificador al
                usar habilidades de encuentro sobre ese personaje objetivo:
                - **Ordinario:** bonificador de -1 paso.
                - **Bueno:** bonificador de -2 pasos.
                - **Asombroso:** bonificador de -3 pasos.
                **Beneficios de Rango:**
                - **Al rango 4 [Relación]:** el empático puede sentir las emociones superficiales de otros dos personajes entre sí.
                - **Al rango 6 [Lectura de Aura]:** evalúa el estado de salud (sano, herido, enfermo, moribundo, demente, etc.). Otorga un bonificador de -1 a -3 pasos a las tiradas de Ciencia Médica, Conocimiento-primeros auxilios o Biokinesis-transferir daño (o curar si tiene rango 8+) usadas para tratar al objetivo. Los intentos sobre especies distintas sufren un penalizador de +1 paso.
                - **Al rango 8 [Relación]:** el empático puede aplicar esta habilidad a otros tres personajes.
                - **Al rango 9 [Conexión]:** desarrolla una conexión con un individuo para sentir sus emociones incluso cuando no está en el rango visual, a una distancia de hasta 1,5 km por rango.
                - **Al rango 12 [Relación]:** el empático puede aplicar esta habilidad a otros cuatro personajes.
      mind-reading:
        attribute: INT
        cost: 3
        url: /psionics/esp/#mind-reading
        trained_only: false
        rank_benefits:
          - rank: 3
            title: Extra Time
          - rank: 6
            title: Probe
          - rank: 9
            title: Extra Time
          - rank: 12
            title: Extra Time
        extended_duration: false
        localized:
          - en:
              name: Mind Reading
              description: |-
                This skill enables a psion to “read” the surface thoughts of another
                character. The target must be within 500 meters (100m/200m/500m) of the
                psionics-user. The mental contact remains in effect for a limited time and
                can't be extended by the use of psionic energy points.
                - **Ordinary:** contact lasts for 1 phase after the skill check is made. Only random and disjointed thoughts are perceived.
                - **Good:** contact lasts for 2 phases. In addition to random thoughts, more detail and coherence is received, such as why the target is thinking about someone or something.
                - **Amazing:** contact lasts for 3 phases. Complete surface thoughts can be read, plus some key fact related to what the psionics-user hoped to discover.
                **Rank Benefits:**
                - **At rank 3 [Extra Time]:** the character may add an additional phase to the duration: Ordinary, 2 phases; Good, 3 phases; Amazing, 4 phases.
                - **At rank 6 [Probe]:** focused search through a target’s mind for a specific piece of information. (+2 step penalty for aliens). Will resistance applies.
                - **At rank 9 [Extra Time]:** duration increases: Ordinary, 1 round; Good, 2 rounds; Amazing, 3 rounds.
                - **At rank 12 [Extra Time]:** duration increases: Ordinary, 1 minute; Good, 2 minutes; Amazing, 3 minutes.
          - es:
              name: Lectura Mental
              description: |-
                Esta habilidad permite a un psiónico "leer" los pensamientos superficiales de
                otro personaje. El objetivo debe estar dentro de los 500 metros
                (100m/200m/500m) del usuario. El contacto mental permanece en vigor por un
                tiempo limitado y no puede extenderse mediante el uso de puntos de energía
                psiónica.
                - **Ordinario:** el contacto dura 1 fase después de realizar la tirada. Solo se perciben pensamientos aleatorios e inconexos.
                - **Bueno:** el contacto dura 2 fases. Además de los pensamientos aleatorios, se recibe más detalle y coherencia, como por qué el objetivo piensa en algo o alguien.
                - **Asombroso:** el contacto dura 3 fases. Se pueden leer los pensamientos superficiales completos, además de algún dato clave relacionado con lo que el usuario esperaba descubrir.
                **Beneficios de Rango:**
                - **Al rango 3 [Tiempo Extra]:** el personaje puede añadir una fase adicional a la duración: Ordinario, 2 fases; Bueno, 3 fases; Asombroso, 4 fases.
                - **Al rango 6 [Sonda]:** búsqueda enfocada en la mente de un objetivo para obtener una pieza específica de información (+2 pasos de penalización para alienígenas). Se aplican modificadores de resistencia de Voluntad.
                - **Al rango 9 [Tiempo Extra]:** la duración aumenta: Ordinario, 1 asalto; Bueno, 2 asaltos; Asombroso, 3 asaltos.
                - **Al rango 12 [Tiempo Extra]:** la duración aumenta: Ordinario, 1 minuto; Bueno, 2 minutos; Asombroso, 3 minutos.
      navcognition:
        attribute: INT
        cost: 3
        url: /psionics/esp/#navcognition
        trained_only: true
        rank_benefits:
          - rank: 4
            title: Travel Time
          - rank: 4
            title: Travel Distance
          - rank: 5
            title: Extra Specialties
          - rank: 6
            title: Clarity of Mind
          - rank: 9
            title: Extra Specialties
          - rank: 12
            title: Tracking
        extended_duration: false
        localized:
          - en:
              name: Navcognition
              description: |-
                A character who uses this skill can instinctively determine his or her present
                location and mentally plot a course. This can be accomplished on a planetary
                surface, in normal space, and even through drivespace. This mental ability
                replaces the use of the Navigation skill. At rank 1, the character selects one
                specialty: surface navigation, system astrogation, or drivespace astrogation.
                | Situation/Condition | Modifier | | :--- | :---: | | Combat / Hostile
                conditions | +4 / +2 | | Unexplored / Partially explored territory | +4 / +2 |
                | Less than 5 minutes plotting | +1 per min. | | More than 5 minutes plotting
                | -1 per min. |
                **Rank Benefits:**
                - **At rank 4 [Travel Time]:** becomes able to determine the clearest way to the destination. Cuts travel time (surface/system): Ordinary 75%; Good 50%; Amazing 25% of normal.
                - **At rank 4 [Travel Distance]:** for drivespace, travel distance is multiplied: Ordinary x2; Good x5; Amazing x10.
                - **At rank 5 [Extra Specialties]:** a second Navigation specialty can be selected.
                - **At rank 6 [Clarity of Mind]:** allows a -4 step bonus during chases, races, or vehicle combat for reducing situational penalties.
                - **At rank 9 [Extra Specialties]:** the remaining specialty becomes available.
                - **At rank 12 [Tracking]:** attempt to track the most likely destination of a target subject, even through drivespace. (+2 seen, +4 witness/recorded).
          - es:
              name: Navcognición
              description: |-
                Un personaje que usa esta habilidad puede determinar instintivamente su
                ubicación actual y trazar mentalmente un curso. Esto puede lograrse en una
                superficie planetaria, en el espacio normal e incluso a través del espacio de
                curvatura. Esta capacidad mental sustituye al uso de la habilidad de
                Navegación. Al rango 1, el personaje selecciona una especialidad: navegación
                de superficie, astrografía de sistema o astrografía de motores de curvatura. |
                Situación/Condición | Modificador | | :--- | :---: | | Condiciones de combate
                / hostiles | +4 / +2 | | Territorio inexplorado / parcialmente explorado | +4
                / +2 | | Menos de 5 minutos trazando | +1 por min. | | Más de 5 minutos
                trazando |
                -1 por min. |
                **Beneficios de Rango:**
                - **Al rango 4 [Tiempo de Viaje]:** capaz de determinar el camino más claro. Reduce el tiempo de viaje (superficie/sistema): Ordinario 75%; Bueno 50%; Asombroso 25% del normal.
                - **Al rango 4 [Distancia de Viaje]:** para espacio de curvatura, la distancia de viaje se multiplica: Ordinario x2; Bueno x5; Asombroso x10.
                - **Al rango 5 [Especialidades Extra]:** se puede seleccionar una segunda especialidad de Navegación.
                - **Al rango 6 [Claridad Mental]:** permite un bonificador de -4 pasos durante persecuciones, carreras o combate de vehículos para reducir penalizadores circunstanciales.
                - **Al rango 9 [Especialidades Extra]:** la especialidad restante de Navegación queda disponible.
                - **Al rango 12 [Rastreo]:** intenta rastrear el destino más probable de un sujeto, incluso a través del espacio de curvatura (+2 si fue visto, +4 si fue presenciado por otro/grabado).
      postcognition:
        attribute: INT
        cost: 3
        url: /psionics/esp/#postcognition
        trained_only: false
        rank_benefits:
          - rank: 3
            title: Extended Reach
          - rank: 6
            title: Extended Reach
          - rank: 9
            title: Extended Reach
          - rank: 12
            title: Extended Reach
        extended_duration: false
        localized:
          - en:
              name: Postcognition
              description: |-
                With this skill, a character can sense the mood of an area and even “see”
                events that happened there in the recent past. The character must be in the
                actual area to sense psychic resonance. In general, a character can see a
                number of days into the past equal to his or her skill rank.
                - **Ordinary:** the character senses general emotions that have been left in an area.
                - **Good:** the psion also receives brief flashes of events that may or may not make sense.
                - **Amazing:** the character actually experiences a brief encounter as though at the scene when the events occurred.
                **Rank Benefits:**
                - **At rank 3 [Extended Reach]:** the character can see a number of weeks into the past equal to his skill rank.
                - **At rank 6 [Extended Reach]:** view months into the past equal to rank.
                - **At rank 9 [Extended Reach]:** view years into the past equal to rank.
                - **At rank 12 [Extended Reach]:** view decades into the past equal to rank.
          - es:
              name: Postcognición
              description: |-
                Con esta habilidad, un personaje puede sentir el ambiente de un área e incluso
                "ver" eventos que ocurrieron allí en el pasado reciente. El personaje debe
                estar en la ubicación real para sentir la resonancia psíquica. En general, un
                personaje puede ver tantos días en el pasado como su rango de habilidad.
                - **Ordinario:** el personaje siente emociones generales que han quedado en un área.
                - **Bueno:** el psiónico también recibe breves destellos de eventos que pueden o no tener sentido.
                - **Asombroso:** el personaje experimenta realmente un breve encuentro como si estuviera en la escena cuando ocurrieron los hechos.
                **Beneficios de Rango:**
                - **Al rango 3 [Alcance Extendido]:** el personaje puede ver tantas semanas en el pasado como su rango de habilidad.
                - **Al rango 6 [Alcance Extendido]:** ve meses en el pasado por rango.
                - **Al rango 9 [Alcance Extendido]:** ve años en el pasado por rango.
                - **Al rango 12 [Alcance Extendido]:** ve décadas en el pasado por rango.
      precognition:
        attribute: INT
        cost: 4
        url: /psionics/esp/#precognition
        trained_only: true
        rank_benefits:
          - rank: 3
            title: Increased Time
          - rank: 6
            title: Increased Time
          - rank: 9
            title: Increased Time
          - rank: 12
            title: Increased Time
        extended_duration: false
        localized:
          - en:
              name: Precognition
              description: |-
                This skill is the ability to receive impressions about possible future
                events—what the psion sees will probably happen if no one takes action to
                change it. In general, a character can see a number of hours into the future
                equal to his or her skill rank. On a successful skill check, the character
                gains information about the event as well as a free last resort point (LRP),
                which can only be used during the scene.
                - **Ordinary:** perceptions of vague images. The LRP can only be used to modify a check which directly affects the psion (e.g. reducing an opponent's attack roll).
                - **Good:** brief flashes of coming events. The LRP may be used to modify the result of any action made against or by him or her during the scene.
                - **Amazing:** mentally experiences a brief encounter as though seeing events transpire. The LRP can be applied to any skill check made by any character involved in the scene. Forcing a flash doubles the cost in energy points, applies a +3 step penalty, and the skill can't be used again consciously for 2d6 days.
                **Rank Benefits:**
                - **At rank 3 [Increased Time]:** extend precognitive ability to a number of days equal to skill rank.
                - **At rank 6 [Increased Time]:** extend to weeks equal to rank.
                - **At rank 9 [Increased Time]:** extend to months equal to rank.
                - **At rank 12 [Increased Time]:** extend to years equal to rank.
          - es:
              name: Precognición
              description: |-
                Esta habilidad es la capacidad de recibir impresiones sobre posibles eventos
                futuros: lo que el psiónico ve probablemente sucederá si nadie toma medidas
                para cambiarlo. En general, un personaje puede ver tantas horas en el futuro
                como su rango de habilidad. En una tirada de habilidad exitosa, el personaje
                gana información sobre el evento, así como un punto de último recurso (LRP)
                gratuito, que solo puede usarse durante la escena.
                - **Ordinario:** percepciones de imágenes vagas. El LRP solo puede usarse para modificar una tirada que afecte directamente al psiónico (por ejemplo, reducir la tirada de ataque de un oponente).
                - **Bueno:** breves destellos de eventos venideros. El LRP puede usarse para modificar el resultado de cualquier acción realizada contra él/ella o por él/ella durante la escena.
                - **Asombroso:** experimenta mentalmente un breve encuentro como si viera los hechos transcurrir. El LRP puede aplicarse a cualquier tirada de habilidad realizada por cualquier personaje involucrado en la escena. Forzar un destello dobla el coste en puntos de energía, aplica un penalizador de +3 pasos, y la habilidad no podrá volver a usarse conscientemente durante 2d6 días.
                **Beneficios de Rango:**
                - **Al rango 3 [Tiempo Incrementado]:** extiende la capacidad precognitiva a un número de días igual al rango de habilidad.
                - **Al rango 6 [Tiempo Incrementado]:** extiende a semanas igual al rango.
                - **Al rango 9 [Tiempo Incrementado]:** extiende a meses igual al rango.
                - **Al rango 12 [Tiempo Incrementado]:** extiende a años igual al rango.
      psychometry:
        attribute: INT
        cost: 3
        url: /psionics/esp/#psychometry
        trained_only: false
        rank_benefits:
          - rank: 1
            title: Treasured
          - rank: 4
            title: Regular Use
          - rank: 8
            title: Frequent Use
          - rank: 12
            title: Minimal Use
        extended_duration: false
        localized:
          - en:
              name: Psychometry
              description: |-
                This skill gives its user the ability to read psychic impressions from
                inanimate objects. The character must touch the object to gain insight into
                who has used it and in what context. Tools, weapons, clothing, jewelry, books,
                other personal items, and even dead bodies can be studied. Living people and
                creatures can't be studied with this skill.
                - **Ordinary:** the character receives simple emotions associated with the object.
                - **Good:** he or she receives simple images associated with the object.
                - **Amazing:** the character experiences a brief encounter as though he or she is the person using the object or its owner.
                **Rank Benefits:**
                - **At rank 1 [Treasured]:** the item in question must be something special to the owner (e.g. wedding ring).
                - **At rank 4 [Regular Use]:** the item can be merely something the owner used regularly (e.g. watch).
                - **At rank 8 [Frequent Use]:** something the owner merely used frequently (e.g. pen, or keys).
                - **At rank 12 [Minimal Use]:** nearly anything belonging to the owner, as long as he or she used it for at least an hour in total.
          - es:
              name: Psicometría
              description: |-
                Esta habilidad otorga a su usuario la capacidad de leer impresiones psíquicas
                de objetos inanimados. El personaje debe tocar el objeto para obtener
                información sobre quién lo ha usado y en qué contexto. Se pueden estudiar
                herramientas, armas, ropa, joyas, libros, otros artículos personales e incluso
                cadáveres. Las personas y criaturas vivas no pueden ser estudiadas con esta
                habilidad.
                - **Ordinario:** el personaje recibe emociones simples asociadas al objeto.
                - **Bueno:** recibe imágenes simples asociadas al objeto.
                - **Asombroso:** el personaje experimenta un breve encuentro como si fuera la persona que usa el objeto o su dueño.
                **Beneficios de Rango:**
                - **Al rango 1 [Tesoros]:** el objeto en cuestión debe ser algo especial para el dueño (por ejemplo, un anillo de bodas).
                - **Al rango 4 [Uso Regular]:** el objeto puede ser simplemente algo que el dueño usaba regularmente (por ejemplo, un reloj).
                - **Al rango 8 [Uso Frecuente]:** algo que el dueño simplemente usaba con frecuencia (por ejemplo, un bolígrafo o llaves).
                - **Al rango 12 [Uso Mínimo]:** casi cualquier cosa perteneciente al dueño, siempre que la haya usado durante al menos una hora en total.
    trained_only: true
  Psychoportation:
    attribute: WIL
    url: /psionics/psychoportation/
    cost: 7
    localized:
      - en:
          name: Psychoportation
          description: |-
            Psychoportation is the psionic specialty of moving material from one location
            to another. Many psychoportation skills allow a psion to move himself or
            herself, and at higher ranks, some of these skills allow the character to move
            others as well.
      - es:
          name: Psicoportación
          description: |-
            La psicoportación es la especialidad psiónica de mover materia de un lugar a
            otro. Muchas habilidades de psicoportación permiten a un psiónico desplazarse
            a sí mismo y, en rangos superiores, algunas de estas habilidades permiten al
            personaje mover también a otros. Esta habilidad básica no puede usarse sin
            entrenamiento.
    items:
      alter-speed:
        attribute: WIL
        cost: 4
        url: /psionics/psychoportation/#alter-speed
        trained_only: true
        rank_benefits:
          - rank: 6
            title: Action Points
          - rank: 12
            title: Instant Stop/Start
        extended_duration: true
        localized:
          - en:
              name: Alter Speed
              description: |-
                By concentrating, the character can accelerate or decelerate himself or
                herself or another living target within 8 meters. The psion must decide
                whether he or she is accelerating or decelerating before making the skill
                check. The effect on the target's action check score depends on the success:
                - **Ordinary:** +1 or -1 to the action check score.
                - **Good:** +2 or -2 to the action check score.
                - **Amazing:** +3 or -3 to the action check score. The ability lasts for one round, but the duration can be extended by spending 1 psionic energy point for each additional round.
                **Rank Benefits:**
                - **At rank 6 [Action Points]:** the target gains or loses one action per round (to a maximum of 4 actions) while the effect lasts.
                - **At rank 12 [Instant Stop/Start]:** the target gains or loses another action (to a maximum of 4, minimum of 0).
          - es:
              name: Alterar Velocidad
              description: |-
                Al concentrarse, el personaje puede acelerar o desacelerar a sí mismo o a otro
                objetivo vivo dentro de un radio de 8 metros. El psiónico debe decidir si está
                acelerando o desacelerando antes de realizar la tirada de habilidad. El efecto
                sobre la puntuación de la tirada de acción del objetivo depende del éxito:
                - **Ordinario:** +1 o -1 a la puntuación de la tirada de acción.
                - **Bueno:** +2 o -2 a la puntuación de la tirada de acción.
                - **Asombroso:** +3 o -3 a la puntuación de la tirada de acción. La capacidad dura un asalto, pero la duración puede extenderse gastando 1 punto de energía psiónica por cada asalto adicional.
                **Beneficios de Rango:**
                - **Al rango 6 [Puntos de Acción]:** el objetivo gana o pierde una acción por asalto (hasta un máximo de 4 acciones) mientras dure el efecto.
                - **Al rango 12 [Parar/Arrancar Instantáneo]:** el objetivo gana o pierde otra acción (hasta un máximo de 4, mínimo de 0).
      apportation:
        attribute: WIL
        cost: 6
        url: /psionics/psychoportation/#apportation
        trained_only: true
        rank_benefits:
          - rank: 3
            title: Living Matter
          - rank: 4
            title: Increased weight
          - rank: 6
            title: Precise Apportation
          - rank: 8
            title: Increased weight
          - rank: 9
            title: Large Apports
          - rank: 12
            title: Increased weight
          - rank: 12
            title: Distant Apports
        extended_duration: false
        localized:
          - en:
              name: Apportation
              description: |-
                This ability allows a character to summon an inanimate object from a distant
                location or to banish an object to another location. The psion must have seen
                the object he or she is attempting to apport. The weight of the object that
                can be apported depends on the skill rank and the success:
                - **Ordinary:** 1 kilogram per rank.
                - **Good:** 2 kilograms per rank.
                - **Amazing:** 5 kilograms per rank. The object appears or disappears instantaneously.
                **Rank Benefits:**
                - **At rank 3 [Living Matter]:** the psion can apport living matter.
                - **At rank 4 [Increased weight]:** the weight limit increases: Ordinary, 2kg/rank; Good, 5kg/rank; Amazing, 10kg/rank.
                - **At rank 6 [Precise Apportation]:** the psion can apport an object exactly to a specific location with no drift.
                - **At rank 8 [Increased weight]:** the weight limit increases: Ordinary, 5kg/rank; Good, 10kg/rank; Amazing, 20kg/rank.
                - **At rank 9 [Large Apports]:** the psion can apport objects that are up to 1 cubic meter in volume.
                - **At rank 12 [Increased weight]:** the weight limit increases: Ordinary, 10kg/rank; Good, 20kg/rank; Amazing, 40kg/rank.
                - **At rank 12 [Distant Apports]:** the psion can apport objects from locations he or she has never seen, as long as he or she has a clear description.
          - es:
              name: Aportación
              description: |-
                Esta capacidad permite a un personaje invocar un objeto inanimado desde una
                ubicación distante o desterrar un objeto a otra ubicación. El psiónico debe
                haber visto el objeto que intenta aportar. El peso del objeto que se puede
                aportar depende del rango de habilidad y del éxito:
                - **Ordinario:** 1 kilogramo por rango.
                - **Bueno:** 2 kilogramos por rango.
                - **Asombroso:** 5 kilogramos por rango. El objeto aparece o desaparece instantáneamente.
                **Beneficios de Rango:**
                - **Al rango 3 [Materia Viva]:** el psiónico puede aportar materia viva.
                - **Al rango 4 [Peso Incrementado]:** el límite de peso aumenta: Ordinario, 2kg/rango; Bueno, 5kg/rango; Asombroso, 10kg/rango.
                - **Al rango 6 [Aportación Precisa]:** el psiónico puede aportar un objeto exactamente a una ubicación específica sin desviación.
                - **Al rango 8 [Peso Incrementado]:** el límite de peso aumenta: Ordinario, 5kg/rango; Bueno, 10kg/rango; Asombroso, 20kg/rango.
                - **Al rango 9 [Aportaciones Grandes]:** el psiónico puede aportar objetos de hasta 1 metro cúbico de volumen.
                - **Al rango 12 [Peso Incrementado]:** el límite de peso aumenta: Ordinario, 10kg/rango; Bueno, 20kg/rango; Asombroso, 40kg/rango.
                - **Al rango 12 [Aportaciones Distantes]:** el psiónico puede aportar objetos de lugares que nunca ha visto, siempre que tenga una descripción clara.
      duplicate:
        attribute: WIL
        cost: 6
        url: /psionics/psychoportation/#duplicate
        trained_only: true
        rank_benefits:
          - rank: 4
            title: Duration
          - rank: 8
            title: Independent Action
          - rank: 12
            title: Multiple Duplicates
        extended_duration: false
        localized:
          - en:
              name: Duplicate
              description: |-
                This ability allows a character to summon a duplicate of himself or herself
                from another location in the multiverse. The duplicate is identical in every
                way and possesses the same skills and attributes as the psion. The duration
                that the duplicate persists depends on the success:
                - **Ordinary:** 1 round.
                - **Good:** 2 rounds.
                - **Amazing:** 5 rounds.
                **Rank Benefits:**
                - **At rank 4 [Duration]:** the duration of the duplicate's existence increases by 2 rounds.
                - **At rank 8 [Independent Action]:** the duplicate can act independently of the psion, although they still share the same psionic energy pool.
                - **At rank 12 [Multiple Duplicates]:** the psion can summon up to three duplicates at once.
          - es:
              name: Duplicado
              description: |-
                Esta capacidad permite a un personaje convocar un duplicado de sí mismo desde
                otra ubicación del multiverso. El duplicado es idéntico en todos los sentidos
                y posee las mismas habilidades y atributos que el psiónico. La duración que
                persiste el duplicado depende del éxito:
                - **Ordinario:** 1 asalto.
                - **Bueno:** 2 asaltos.
                - **Asombroso:** 5 asaltos.
                **Beneficios de Rango:**
                - **Al rango 4 [Duración]:** la duración de la existencia del duplicado aumenta en 2 asaltos.
                - **Al rango 8 [Acción Independiente]:** el duplicado puede actuar independientemente del psiónico, aunque siguen compartiendo la misma reserva de energía psiónica.
                - **Al rango 12 [Duplicados Múltiples]:** el psiónico puede convocar hasta tres duplicados a la vez.
      teleportation:
        attribute: WIL
        cost: 5
        url: /psionics/psychoportation/#teleportation
        trained_only: true
        rank_benefits:
          - rank: 4
            title: Increased Distance
          - rank: 8
            title: Increased Distance
          - rank: 12
            title: Increased Distance
        extended_duration: false
        localized:
          - en:
              name: Teleportation
              description: |-
                Teleportation allows a psion to instantaneously move from his or her current
                location to another. The psion can also teleport objects or other characters.
                The range and weight limit depend on the skill rank and the success:
                - **Range:** 10/100/1000 meters.
                - **Weight:** 10 kilograms per rank (Ordinary success), 20 kilograms per rank (Good success), or 40 kilograms per rank (Amazing success).
                **Rank Benefits:**
                - **At rank 4 [Increased Distance]:** the range increases: 1km/10km/100km.
                - **At rank 8 [Increased Distance]:** the range increases: 100km/1000km/World.
                - **At rank 12 [Increased Distance]:** the range increases: World/Galaxy/Universe.
          - es:
              name: Teletransportación
              description: |-
                La teletransportación permite a un psiónico moverse instantáneamente desde su
                ubicación actual a otra. El psiónico también puede teletransportar objetos u
                otros personajes. El rango y el límite de peso dependen del rango de habilidad
                y del éxito:
                - **Rango:** 10/100/1000 metros.
                - **Peso:** 10 kilogramos por rango (éxito Ordinario), 20 kilogramos por rango (éxito Bueno) o 40 kilogramos por rango (éxito Asombroso).
                **Beneficios de Rango:**
                - **Al rango 4 [Distancia Incrementada]:** el rango aumenta: 1km/10km/100km.
                - **Al rango 8 [Distancia Incrementada]:** el rango aumenta: 100km/1000km/Mundo.
                - **Al rango 12 [Distancia Incrementada]:** el rango aumenta: Mundo/Galaxia/Universo.
      timeslip:
        attribute: WIL
        cost: 6
        url: /psionics/psychoportation/#timeslip
        trained_only: true
        rank_benefits:
          - rank: 4
            title: Amazing success
          - rank: 8
            title: Amazing success
          - rank: 12
            title: Amazing success
        extended_duration: false
        localized:
          - en:
              name: Timeslip
              description: |-
                This ability allows a psion to move himself or herself forward in time. To
                everyone else, the psion appears to vanish instantaneously and then reappear
                later. The duration of the jump depends on the success:
                - **Ordinary:** 1 phase.
                - **Good:** 1 round.
                - **Amazing:** 2 rounds.
                **Rank Benefits:**
                - **At rank 4 [Amazing success]:** the jump increases to 1 minute.
                - **At rank 8 [Amazing success]:** the jump increases to 1 hour.
                - **At rank 12 [Amazing success]:** the jump increases to 1 day.
          - es:
              name: Salto Temporal
              description: |-
                Esta capacidad permite a un psiónico desplazarse a sí mismo hacia adelante en
                el tiempo. Para todos los demás, el psiónico parece desaparecer
                instantáneamente y reaparecer más tarde. La duración del salto depende del
                éxito:
                - **Ordinario:** 1 fase.
                - **Bueno:** 1 asalto.
                - **Asombroso:** 2 asaltos.
                **Beneficios de Rango:**
                - **Al rango 4 [éxito Asombroso]:** el salto aumenta a 1 minuto.
                - **Al rango 8 [éxito Asombroso]:** el salto aumenta a 1 hora.
                - **Al rango 12 [éxito Asombroso]:** el salto aumenta a 1 día.
      dimension-walk:
        attribute: WIL
        cost: 6
        trained_only: true
        url: /psionics/psychoportation/#dimension-walk
        localized:
          - en:
              name: Dimension Walk
              description: Jump between parallel dimensions or tangent timelines.
          - es:
              name: Caminar entre Dimensiones
              description: Salto entre dimensiones paralelas o líneas temporales tangentes.
    trained_only: true
  Telekinesis:
    attribute: WIL
    url: /psionics/telekinesis/
    cost: 5
    localized:
      - en:
          name: Telekinesis
          description: |-
            This skill allows a psion to manipulate the physical environment with only the
            power of the mind. With just the broad skill, a character can attempt to use
            any of the related specialty skills except those that can't be used untrained.
      - es:
          name: Telequinesis
          description: |-
            Esta habilidad permite a un psiónico manipular el entorno físico únicamente
            con el poder de la mente. Con solo la habilidad de base, un personaje puede
            intentar usar cualquiera de las habilidades de especialidad relacionadas,
            excepto aquellas que no pueden usarse sin entrenamiento.
    items:
      cryokinetics:
        attribute: WIL
        cost: 3
        url: /psionics/telekinesis/#cryokinetics
        trained_only: true
        rank_benefits:
          - rank: 5
            title: Increased Damage
          - rank: 6
            title: Encasement
          - rank: 9
            title: Increased Damage
          - rank: 9
            title: Cryogenic Suspension
        extended_duration: false
        localized:
          - en:
              name: Cryokinetics
              description: |-
                By concentrating, the character can generate fields of intense cold, freezing
                most liquids and damaging living tissue. The effective range is 24 meters
                (range 6/12/24), and the cold affects all materials within a 2 meter diameter.
                The energy damage inflicted to living beings by this power depends on the
                result of the skill check. When a character first acquires this skill, he or
                she is able to cause damage of d4s/d4+2s/d4w.
                **Rank Benefits:**
                - **At rank 5 [Increased Damage]:** the damage becomes d4+2s/d6+2s/d4+2w.
                - **At rank 6 [Encasement]:** the character is able to generate cold so quickly that objects or creatures in a moist or wet environment become unable to move. The character’s skill check has a -2 step bonus if the target is completely wet (immersed in water, for example). The skill check determines the difficulty of the Strength feat required to break free.
                - **At rank 9 [Increased Damage]:** the damage increases to d6+2s/d4+2w/d6+2w.
                - **At rank 9 [Cryogenic Suspension]:** the character can freeze living beings so quickly and completely that they effectively enter a temporary state of suspended animation. The target is allowed its Dexterity resistance modifier to avoid being targeted by this ability.
          - es:
              name: Crioquinesis
              description: |-
                Al concentrarse, el personaje puede generar campos de frío intenso, congelando
                la mayoría de los líquidos y dañando el tejido vivo. El rango efectivo es de
                24 metros (rango 6/12/24), y el frío afecta a todos los materiales dentro de
                un diámetro de 2 metros. El daño de energía infligido a los seres vivos por
                este poder depende del resultado de la tirada de habilidad. Cuando un
                personaje adquiere por primera vez esta habilidad, es capaz de causar un daño
                de d4s/d4+2s/d4w.
                **Beneficios de Rango:**
                - **Al rango 5 [Daño Incrementado]:** el daño pasa a ser d4+2s/d6+2s/d4+2w.
                - **Al rango 6 [Encapsulamiento]:** el personaje es capaz de generar frío tan rápidamente que los objetos o criaturas en un ambiente húmedo o mojado se vuelven incapaces de moverse. La tirada de habilidad del personaje tiene un bonificador de -2 pasos si el objetivo está completamente mojado (sumergido en agua, por ejemplo). La tirada de habilidad determina la dificultad de la proeza de Fuerza requerida para liberarse.
                - **Al rango 9 [Daño Incrementado]:** el daño aumenta a d6+2s/d4+2w/d6+2w.
                - **Al rango 9 [Suspensión Criogénica]:** el personaje puede congelar a los seres vivos tan rápida y completamente que entran efectivamente en un estado temporal de animación suspendida. El objetivo puede usar su modificador de resistencia de Destreza para evitar ser el blanco de esta capacidad.
      electrokinetics:
        attribute: WIL
        cost: 3
        url: /psionics/telekinesis/#electrokinetics
        trained_only: true
        rank_benefits:
          - rank: 3
            title: Datawipe
          - rank: 5
            title: Increased Damage
          - rank: 6
            title: Tamper
          - rank: 9
            title: Increased Damage
          - rank: 9
            title: Bypass
          - rank: 12
            title: Jamming
        extended_duration: false
        localized:
          - en:
              name: Electrokinetics
              description: |-
                By concentrating, the character can build and direct an electrical charge to a
                target within range of 16 meters (range 4/8/16). The charge persists into the
                round following its application, allowing the psion to discharge the energy at
                any point during those two rounds. The energy damage inflicted to living
                beings depends on the success of the skill check. When the skill is first
                acquired, it causes d4+2s/d6+2s/d4w damage.
                **Rank Benefits:**
                - **At rank 3 [Datawipe]:** the character can bulk-erase computer media. Unless the psion is touching the media, there is a penalty to the skill check based on the distance: within 1 meter, +1 step; within 2 meters, +2 steps; within 3 meters, +3 steps.
                - **At rank 5 [Increased Damage]:** the damage increases to d6+2s/d4w/d4+2w.
                - **At rank 6 [Tamper]:** the character can use the skill to fool electronic sensors and cameras within his or her line of sight.
                - **At rank 9 [Increased Damage]:** the damage increases to d4+2w/d6+2w/d8+2w.
                - **At rank 9 [Bypass]:** the character can bypass electronic locks by overloading or rerouting their circuitry.
                - **At rank 12 [Jamming]:** the character can jam radio or sensor signals within a 20 meter radius. This radius can be extended by 20 meters for each additional psionic energy point spent.
          - es:
              name: Electroquinesis
              description: |-
                Al concentrarse, el personaje puede generar y dirigir una descarga eléctrica a
                un objetivo dentro de un rango de 16 metros (rango 4/8/16). La carga persiste
                en el asalto posterior a su aplicación, lo que permite al psiónico descargar
                la energía en cualquier momento durante esos dos asaltos. El daño de energía
                infligido a los seres vivos depende del éxito de la tirada de habilidad.
                Cuando se adquiere la habilidad por primera vez, causa un daño de
                d4+2s/d6+2s/d4w.
                **Beneficios de Rango:**
                - **Al rango 3 [Borrado de Datos]:** el personaje puede borrar masivamente soportes informáticos. A menos que el psiónico esté tocando el soporte, hay un penalizador a la tirada de habilidad basado en la distancia: a menos de 1 metro, +1 paso; a menos de 2 metros, +2 pasos; a menos de 3 metros, +3 pasos.
                - **Al rango 5 [Daño Incrementado]:** el daño aumenta a d6+2s/d4w/d4+2w.
                - **Al rango 6 [Sabotaje]:** el personaje puede usar la habilidad para engañar a sensores electrónicos y cámaras dentro de su línea de visión.
                - **Al rango 9 [Daño Incrementado]:** el daño aumenta a d4+2w/d6+2w/d8+2w.
                - **Al rango 9 [Bypass]:** el personaje puede anular cerraduras electrónicas sobrecargando o redirigiendo su circuitería.
                - **Al rango 12 [Interferencia]:** el personaje puede interferir señales de radio o sensores en un radio de 20 metros. Este radio puede extenderse 20 metros por cada punto de energía psiónica adicional gastado.
      kinetic-blow:
        attribute: WIL
        cost: 3
        url: /psionics/telekinesis/#kinetic-blow
        trained_only: true
        rank_benefits:
          - rank: 4
            title: Increased Damage
          - rank: 8
            title: Knockdown
          - rank: 12
            title: Increased Damage
        extended_duration: false
        localized:
          - en:
              name: Kinetic Blow
              description: |-
                This ability allows a psion to project a wave of kinetic energy at a target.
                The effective range is 16 meters (range 4/8/16). The impact of the energy wave
                can cause significant physical damage. When first acquired, Kinetic Blow
                inflicts d4s/d4+2s/d4w damage.
                **Rank Benefits:**
                - **At rank 4 [Increased Damage]:** the damage increases to d4+2s/d6+2s/d4+2w.
                - **At rank 8 [Knockdown]:** if the psion scores a Good or Amazing success, the target must make a Strength feat check or be knocked prone.
                - **At rank 12 [Increased Damage]:** the damage increases to d6+2s/d4+2w/d6+2w.
          - es:
              name: Golpe Cinético
              description: |-
                Esta capacidad permite a un psiónico proyectar una onda de energía cinética
                hacia un objetivo. El rango efectivo es de 16 metros (rango 4/8/16). El
                impacto de la onda de energía puede causar un daño físico significativo.
                Cuando se adquiere por primera vez, Golpe Cinético inflige un daño de
                d4s/d4+2s/d4w.
                **Beneficios de Rango:**
                - **Al rango 4 [Daño Incrementado]:** el daño aumenta a d4+2s/d6+2s/d4+2w.
                - **Al rango 8 [Derribo]:** si el psiónico logra un éxito Bueno o Asombroso, el objetivo debe realizar una tirada de proeza de Fuerza o quedará derribado.
                - **Al rango 12 [Daño Incrementado]:** el daño aumenta a d6+2s/d4+2w/d6+2w.
      kinetic-shield:
        attribute: WIL
        cost: 3
        url: /psionics/telekinesis/#kinetic-shield
        trained_only: true
        rank_benefits:
          - rank: 4
            title: Improved Protection
          - rank: 8
            title: Broad Shield
          - rank: 12
            title: Reflect Attacks
        extended_duration: true
        localized:
          - en:
              name: Kinetic Shield
              description: |-
                By concentrating, the character can create a field of kinetic energy that
                surrounds his or her body, protecting it from physical attacks. The shield
                reflects or absorbs kinetic energy from incoming attacks. The effectiveness of
                the shield depends on the success of the skill check:
                - **Ordinary:** the shield provides 1 point of protection against all physical attacks.
                - **Good:** the shield provides 2 points of protection against all physical attacks.
                - **Amazing:** the shield provides 3 points of protection against all physical attacks. The shield lasts for one round, but the duration can be extended by spending 1 psionic energy point for each additional round.
                **Rank Benefits:**
                - **At rank 4 [Improved Protection]:** the protection provided by the shield increases: Ordinary, 2 points; Good, 3 points; Amazing, 4 points.
                - **At rank 8 [Broad Shield]:** the psion can extend the shield to protect one additional character who is within 2 meters.
                - **At rank 12 [Reflect Attacks]:** the psion can use the shield to reflect incoming physical attacks back at the attacker. This requires an Amazing success on the skill check. The reflected attack deals the same amount of damage that would have been dealt to the psion.
          - es:
              name: Escudo Cinético
              description: |-
                Al concentrarse, el personaje puede crear un campo de energía cinética que
                rodea su cuerpo, protegiéndolo de ataques físicos. El escudo refleja o absorbe
                la energía cinética de los ataques entrantes. La efectividad del escudo
                depende del éxito de la tirada de habilidad:
                - **Ordinario:** el escudo proporciona 1 punto de protección contra todos los ataques físicos.
                - **Bueno:** el escudo proporciona 2 puntos de protección contra todos los ataques físicos.
                - **Asombroso:** el escudo proporciona 3 puntos de protección contra todos los ataques físicos. El escudo dura un asalto, pero la duración puede extenderse gastando 1 punto de energía psiónica por cada asalto adicional.
                **Beneficios de Rango:**
                - **Al rango 4 [Protección Mejorada]:** la protección proporcionada por el escudo aumenta: Ordinario, 2 puntos; Bueno, 3 puntos; Asombroso, 4 puntos.
                - **Al rango 8 [Escudo Amplio]:** el psiónico puede extender el escudo para proteger a un personaje adicional que esté a menos de 2 metros.
                - **Al rango 12 [Reflejar Ataques]:** el psiónico puede usar el escudo para reflejar los ataques físicos entrantes hacia el atacante. Esto requiere un éxito Asombroso en la tirada de habilidad. El ataque reflejado inflige la misma cantidad de daño que se le habría infligido al psiónico.
      levitation:
        attribute: WIL
        cost: 3
        url: /psionics/telekinesis/#levitation
        trained_only: false
        rank_benefits:
          - rank: 4
            title: Increased Speed
          - rank: 8
            title: Lift Object
          - rank: 12
            title: Flight
        extended_duration: true
        localized:
          - en:
              name: Levitation
              description: |-
                With this skill, a psion can mentally lift himself or herself off the ground
                and move through the air. The speed of movement depends on the result of the
                skill check:
                - **Ordinary:** the character can move at one-quarter his or her normal walk rate.
                - **Good:** the character can move at one-half his or her normal walk rate.
                - **Amazing:** the character can move at his or her full walk rate. The ability lasts for one minute, but the duration can be extended by spending 1 psionic energy point for each additional minute.
                **Rank Benefits:**
                - **At rank 4 [Increased Speed]:** the movement rate while levitating increases: Ordinary, one-half walk; Good, full walk; Amazing, full run.
                - **At rank 8 [Lift Object]:** the psion can use levitation to lift and move an object weighing up to 10 kilograms per rank.
                - **At rank 12 [Flight]:** the psion can move through the air as easily as if walking on the ground, with no penalties or loss of actions.
          - es:
              name: Levitación
              description: |-
                Con esta habilidad, un psiónico puede elevarse mentalmente del suelo y moverse
                por el aire. La velocidad de movimiento depende del resultado de la tirada de
                habilidad:
                - **Ordinario:** el personaje puede moverse a una cuarta parte de su ritmo normal de caminata.
                - **Bueno:** el personaje puede moverse a la mitad de su ritmo normal de caminata.
                - **Asombroso:** el personaje puede moverse a su ritmo normal de caminata. La capacidad dura un minuto, pero la duración puede extenderse gastando 1 punto de energía psiónica por cada minuto adicional.
                **Beneficios de Rango:**
                - **Al rango 4 [Velocidad Incrementada]:** el ritmo de movimiento mientras levita aumenta: Ordinario, media caminata; Bueno, caminata completa; Asombroso, carrera completa.
                - **Al rango 8 [Levantar Objeto]:** el psiónico puede usar la levitación para levantar y mover un objeto que pese hasta 10 kilogramos por rango.
                - **Al rango 12 [Vuelo]:** el psiónico puede moverse por el aire tan fácilmente como si caminara por el suelo, sin penalizaciones ni pérdida de acciones.
      photokinetics:
        attribute: WIL
        cost: 1
        url: /psionics/telekinesis/#photokinetics
        trained_only: false
        rank_benefits:
          - rank: 3
            title: Simple Illusion
          - rank: 4
            title: ''
          - rank: 6
            title: Flash
          - rank: 8
            title: ''
          - rank: 9
            title: Gargantuan Illusion
          - rank: 12
            title: ''
          - rank: 12
            title: Improved Illusion
        extended_duration: true
        localized:
          - en:
              name: Photokinetics
              description: |-
                With this skill, a character can excite or reduce the amount of light in a
                specific area. The area affected is a diameter of 2 meters (Ordinary success),
                4 meters (Good success), or 6 meters (Amazing success). The duration of the
                effect depends on the success of the skill check: Marginal success, 1 phase;
                Ordinary success, 1 round; Good success, 2 rounds; Amazing success, 1 minute.
                The duration can be extended by spending 1 psionic energy point for each
                additional duration unit.
                **Rank Benefits:**
                - **At rank 3 [Simple Illusion]:** the psion can create toy-sized visual illusions.
                - **At rank 4 []:** the unit of duration becomes 5 minutes.
                - **At rank 6 [Flash]:** the character can trigger a sudden flash of light that blinds anyone looking in that direction for d4 phases (Ordinary success), d4+1 phases (Good success), or d6+1 phases (Amazing success).
                - **At rank 8 []:** the unit of duration becomes 30 minutes.
                - **At rank 9 [Gargantuan Illusion]:** the psion can create an illusion anywhere within his or her line of sight, as long as it fits within a cube that is 2 meters per skill rank.
                - **At rank 12 []:** the unit of duration becomes 1 hour.
                - **At rank 12 [Improved Illusion]:** anyone attempting to recognize that the illusion is fake suffers a penalty to their Awareness—intuition skill checks: Ordinary success, +2 steps; Good success, +3 steps; Amazing success, +4 steps.
          - es:
              name: Fotoquinesis
              description: |-
                Con esta habilidad, un personaje puede excitar o reducir la cantidad de luz en
                un área específica. El área afectada tiene un diámetro de 2 metros (éxito
                Ordinario), 4 metros (éxito Bueno) o 6 metros (éxito Asombroso). La duración
                del efecto depende del éxito de la tirada de habilidad: éxito Marginal, 1
                fase; éxito Ordinario, 1 asalto; éxito Bueno, 2 asaltos; éxito Asombroso, 1
                minuto. La duración puede extenderse gastando 1 punto de energía psiónica por
                cada unidad de duración adicional.
                **Beneficios de Rango:**
                - **Al rango 3 [Ilusión Simple]:** el psiónico puede crear ilusiones visuales de tamaño pequeño.
                - **Al rango 4 [Duración Extendida]:** la unidad de duración pasa a ser de 5 minutos.
                - **Al rango 6 [Destello]:** el personaje puede activar un destello repentino de luz que ciega a cualquiera que mire en esa dirección durante d4 fases (éxito Ordinario), d4+1 fases (éxito Bueno) o d6+1 fases (éxito Asombroso).
                - **Al rango 8 [Duración Extendida]:** la unidad de duración pasa a ser de 30 minutos.
                - **Al rango 9 [Ilusión Gigantesca]:** el psiónico puede crear una ilusión en cualquier lugar dentro de su línea de visión, siempre que quepa en un cubo de 2 metros por rango de habilidad.
                - **Al rango 12 [Duración Extendida]:** la unidad de duración pasa a ser de 1 hora.
                - **Al rango 12 [Ilusión Mejorada]:** cualquiera que intente reconocer que la ilusión es falsa sufre un penalizador en sus tiradas de Intuición: éxito Ordinario, +2 pasos; éxito Bueno, +3 pasos; éxito Asombroso, +4 pasos.
      psychokinetics:
        attribute: WIL
        cost: 3
        url: /psionics/telekinesis/#psychokinetics
        trained_only: false
        rank_benefits:
          - rank: 4
            title: Movement Rate
          - rank: 5
            title: Increased Damage
          - rank: 8
            title: Movement Rate
          - rank: 9
            title: Increased Damage
          - rank: 12
            title: Fine Manipulation
        extended_duration: true
        localized:
          - en:
              name: Psychokinetics
              description: |-
                Psychokinetics is the ability to move objects. Before making the skill check,
                the psion must choose whether he or she is attempting to move an object or to
                attack with one. The amount of weight that can be moved depends on the skill
                rank and the success:
                - **Ordinary:** 10 kilograms per rank.
                - **Good:** 20 kilograms per rank.
                - **Amazing:** 40 kilograms per rank. The effective range is 10/20/50 meters. The ability lasts for one round, but the duration can be extended by spending 1 psionic energy point for each additional round. When used to attack, the damage inflicted depends on the success: Ordinary, d4s; Good, d4+2s; Amazing, d4w.
                **Rank Benefits:**
                - **At rank 4 [Movement Rate]:** the psion can move an object at his or her walk rate.
                - **At rank 5 [Increased Damage]:** the damage increases to d4w/d4+1w/d6w.
                - **At rank 8 [Movement Rate]:** the psion can move an object at his or her run rate.
                - **At rank 9 [Increased Damage]:** the damage increases to d4+1w/d6w/d4m.
                - **At rank 12 [Fine Manipulation]:** the psion can perform delicate tasks (e.g., tying a knot) with no penalties.
          - es:
              name: Psicocinesis
              description: |-
                La psicocinesis es la capacidad de mover objetos. Antes de realizar la tirada
                de habilidad, el psiónico debe elegir si está intentando mover un objeto o
                atacar con uno. La cantidad de peso que se puede mover depende del rango de
                habilidad y del éxito:
                - **Ordinario:** 10 kilogramos por rango.
                - **Bueno:** 20 kilogramos por rango.
                - **Asombroso:** 40 kilogramos por rango. El rango efectivo es de 10/20/50 metros. La capacidad dura un asalto, pero la duración puede extenderse gastando 1 punto de energía psiónica por cada asalto adicional. Cuando se usa para atacar, el daño infligido depende del éxito: Ordinario, d4s; Bueno, d4+2s; Asombroso, d4w.
                **Beneficios de Rango:**
                - **Al rango 4 [Ritmo de Movimiento]:** el psiónico puede mover un objeto a su ritmo de caminata.
                - **Al rango 5 [Daño Incrementado]:** el daño aumenta a d4w/d4+1w/d6w.
                - **Al rango 8 [Ritmo de Movimiento]:** el psiónico puede mover un objeto a su ritmo de carrera.
                - **Al rango 9 [Daño Incrementado]:** el daño aumenta a d4+1w/d6w/d4m.
                - **Al rango 12 [Manipulación Fina]:** el psiónico puede realizar tareas delicadas (por ejemplo, hacer un nudo) sin penalizaciones.
      pyrokinesis:
        attribute: WIL
        cost: 3
        url: /psionics/telekinesis/#pyrokinesis
        trained_only: true
        rank_benefits:
          - rank: 4
            title: Increased Damage
          - rank: 8
            title: Increased Damage
          - rank: 12
            title: Fireball
        extended_duration: false
        localized:
          - en:
              name: Pyrokinesis
              description: |-
                By concentrating, the character can excite the molecules of an object, causing
                it to burst into flame or inflicting damage on a living creature. The
                effective range is 24 meters (range 6/12/24). The energy damage inflicted on
                living tissue depends on the success of the skill check. When first acquired,
                Pyrokinetics inflicts d4s/d4+2s/d4w damage.
                **Rank Benefits:**
                - **At rank 4 [Increased Damage]:** the damage increases to d4+2s/d6+2s/d4+2w.
                - **At rank 8 [Increased Damage]:** the damage increases to d6+2s/d4+2w/d6+2w.
                - **At rank 12 [Fireball]:** the psion can cause an explosion of fire that affects all targets within a 4 meter diameter.
          - es:
              name: Piroquinesis
              description: |-
                Al concentrarse, el personaje puede excitar las moléculas de un objeto,
                haciendo que estalle en llamas o infligiendo daño a una criatura viva. El
                rango efectivo es de 24 metros (rango 6/12/24). El daño de energía infligido
                al tejido vivo depende del éxito de la tirada de habilidad. Cuando se adquiere
                por primera vez, Piroquinesis inflige un daño de d4s/d4+2s/d4w.
                **Beneficios de Rango:**
                - **Al rango 4 [Daño Incrementado]:** el daño aumenta a d4+2s/d6+2s/d4+2w.
                - **Al rango 8 [Daño Incrementado]:** el daño aumenta a d6+2s/d4+2w/d6+2w.
                - **Al rango 12 [Bola de Fuego]:** el psiónico puede provocar una explosión de fuego que afecta a todos los objetivos en un diámetro de 4 metros.
      sheyas-clutch:
        attribute: WIL
        cost: 5
        url: /psionics/telekinesis/#sheyas-clutch
        trained_only: true
        localized:
          - en:
              name: Sheya's Clutch
              description: |-
                Mentally crush the heart or internal organs of a living being (range 40
                meters). Bypasses all non-psionic armor. This is physically draining for the
                user, who also takes damage.

                **Rank Benefits:**
                - **At rank 5, 9 [Increased Damage]**, damage to the victim increases while the relative cost to the user decreases slightly.
          - es:
              name: Presa de Sheya
              description: |-
                Aplasta mentalmente el corazón u órganos internos de un ser vivo (rango 40
                metros). Ignora toda armadura no psiónica. Es agotador para el usuario, que
                también recibe daño.

                **Beneficios de Rango:**
                - **Al rango 5, 9 [Daño Incrementado]**, el daño a la víctima aumenta mientras el coste relativo para el usuario disminuye ligeramente.
        alien_only: true
    trained_only: true
  Telepathy:
    attribute: PER
    url: /psionics/telepathy/
    cost: 5
    localized:
      - en:
          name: Telepathy
          description: |-
            This skill allows a character to open his or her mind to the thoughts of
            others or send thoughts into the minds of others. With just the broad skill, a
            character can attempt to use any of the related specialty skills except those
            that can't be used untrained. The difficulty of such an action is reflected in
            the increased psionic energy cost and the higher base situation die for using
            just the broad skill.
      - es:
          name: Telepatía
          description: |-
            Esta habilidad permite a un personaje abrir su mente a los pensamientos de los
            demás o enviar pensamientos a las mentes de los demás. Con solo la habilidad
            de base, un personaje puede intentar usar cualquiera de las habilidades de
            especialidad relacionadas, excepto aquellas que no pueden usarse sin
            entrenamiento. La dificultad de tal acción se refleja en el mayor costo de
            energía psiónica y en el dado de situación base más alto por utilizar solo la
            habilidad de base.
    items:
      contact:
        attribute: PER
        cost: 3
        url: /psionics/telepathy/#contact
        trained_only: false
        rank_benefits:
          - rank: 4
            title: Increased Duration
          - rank: 6
            title: Language
          - rank: 12
            title: Switch
        extended_duration: true
        localized:
          - en:
              name: Contact
              description: |-
                With this skill, a character can send and receive thoughts to and from another
                character, usually for the purpose of exchanging information. Modifiers may
                apply, depending on the range, familiarity, and willingness of the target mind
                to be contacted. The type of thoughts that can be exchanged depends on the
                result of a skill check:
                - **Ordinary:** simple concepts (brief questions and one-word answers) can be exchanged.
                - **Good:** moderate discussion (pass notes back and forth, one note per 2 phases) can occur.
                - **Amazing:** the communicating characters can have a detailed discussion, as though they were conversing vocally. If the psionics-user's intended target isn't willing to communicate, the target's Will resistance modifier is applied as a penalty to the skill check, in addition to any other situation modifiers. If contact is established anyway, an unwilling mind can expel the user by making a successful Will feat check or a Resolve-mental resolve skill check, with a penalty (+1, +2, or +3 steps) depending on the psionics-user's degree of success.
                **Rank Benefits:**
                - **At rank 4 [Increased Duration]:** the unit of duration is 1 minute, plus an additional minute per psionic energy point spent to extend it. At rank 8, this duration becomes 5 minutes, and at rank 12, the base unit of duration becomes 30 minutes.
                - **At rank 6 [Language]:** a telepath learns to comprehend the meaning underlying ideas expressed even in languages he or she does not understand. The character may attempt an Intelligence feat check to understand the gist of the concept being communicated, or to make his or her own thoughts clearer to the target. At the Gamemaster's discretion, a +2 step penalty applies to attempting to communicate with alien minds.
                - **At rank 12 [Switch]:** A telepath who reaches rank 12 in contact can attempt to switch his or her consciousness with that of the target—effectively trading bodies.
          - es:
              name: Contacto
              description: |-
                Con esta habilidad, un personaje puede enviar y recibir pensamientos de otro
                personaje, generalmente con el propósito de intercambiar información. Se
                pueden aplicar modificadores, dependiendo de la distancia, la familiaridad y
                la disposición de la mente objetivo a ser contactada. El tipo de pensamientos
                que se pueden intercambiar depende del resultado de una tirada de habilidad:
                - **Ordinario:** se pueden intercambiar conceptos simples (preguntas breves y respuestas de una palabra).
                - **Bueno:** puede haber una discusión moderada (intercambiar notas, una nota cada 2 fases).
                - **Asombroso:** los personajes que se comunican pueden tener una discusión detallada, como si estuvieran conversando vocalmente. Si el objetivo previsto por el usuario psiónico no está dispuesto a comunicarse, el modificador de resistencia de Voluntad del objetivo se aplica como un penalizador a la tirada de habilidad, además de cualquier otro modificador de situación. Si se establece contacto de todos modos, una mente involuntaria puede expulsar al usuario realizando una proeza de Voluntad exitosa o una tirada de la habilidad Resolución Mental, con un penalizador (+1, +2 o +3 pasos) dependiendo del grado de éxito del usuario psiónico.
                **Beneficios de Rango:**
                - **Al rango 4 [Duración Incrementada]:** la unidad de duración es de 1 minuto, más un minuto adicional por cada punto de energía psiónica gastado para extenderla. Al rango 8, esta duración se convierte en 5 minutos, y al rango 12, la unidad base de duración se convierte en 30 minutos.
                - **Al rango 6 [Idioma]:** un telépata aprende a comprender el significado subyacente de ideas expresadas incluso en idiomas que no entiende. El personaje puede intentar una tirada de proeza de Inteligencia para comprender la idea general del concepto que se comunica, o para aclarar sus propios pensamientos al objetivo. A discreción del Director de Juego, se aplica un penalizador de +2 pasos al intentar comunicarse con mentes alienígenas.
                - **Al rango 12 [Intercambio]:** Un telépata que alcanza el rango 12 en contacto puede intentar intercambiar su conciencia con la del objetivo, intercambiando cuerpos de manera efectiva.
      datalink:
        attribute: PER
        cost: 4
        url: /psionics/telepathy/#datalink
        trained_only: true
        rank_benefits:
          - rank: 3
            title: Increased Distance
          - rank: 3
            title: Memory Slots
          - rank: 4
            title: Increased Duration
          - rank: 4
            title: Edit
          - rank: 6
            title: Robolink
        extended_duration: true
        localized:
          - en:
              name: Datalink
              description: |-
                This skill is the ability to link one's mind with a computer (or a cybernetic
                machine, if the optional rules for cybertech are being used) without using a
                physical connection of any kind. The datalink skill can be used to operate
                computers or cybernetic machinery with mental commands, to project one's mind
                into the datastream without using a neural interface jack (NIJack) or
                gridcaster, or to examine computer data by mentally scanning the storage unit.
                In game terms, the character is able to use the same functions provided by a
                computer operating system: copy, delete, error recognition, file management,
                protection, protocol, and save.
                **Rank Benefits:**
                - **At rank 3 [Increased Distance]:** the distance at which the character can use the datalink skill increases to 4 (no penalty)/ 8 (+1 step penalty)/ 12 (+2 step penalty) meters. At rank 6, this becomes 8/16/25 meters. At rank 9, it increases again to 15/30/50 meters, and at rank 12, it improves to 30/60/100 meters.
                - **At rank 3 [Memory Slots]:** the character effectively has 1 slot of active memory, which can be used to store data or programs. At rank 6, the active memory increases to 2 slots, to 3 slots at rank 9, and 4 slots at rank 12.
                - **At rank 4 [Increased Duration]:** the base unit of duration increases to 1 minute, plus an additional minute per psionic energy point spent to maintain it. At rank 8, this unit of duration becomes 5 minutes, and at rank 12, it increases to 30 minutes.
                - **At rank 4 [Edit]:** the character can edit information stored on computers, deleting, resequencing, or otherwise changing the appearance of the data.
                - **At rank 6 [Robolink]:** the character can temporarily seize control of robots. On a successful skill check, the character can implant commands in a single robot, which then behaves as though it had been affected by Telepathy-suggest.
          - es:
              name: Enlace de Datos
              description: |-
                Esta habilidad es la capacidad de vincular la propia mente con un ordenador (o
                una máquina cibernética, si se usan las reglas opcionales para
                cibertecnología) sin usar una conexión física de ningún tipo. La habilidad
                enlace de datos se puede utilizar para operar ordenadores o maquinaria
                cibernética con órdenes mentales, para proyectar la propia mente en el flujo
                de datos sin utilizar un conector de interfaz neuronal (NIJack) o integrador
                de red, o para examinar los datos de un ordenador explorando mentalmente la
                unidad de almacenamiento. En términos de juego, el personaje puede usar las
                mismas funciones proporcionadas por un sistema operativo de ordenador: copiar,
                eliminar, reconocimiento de errores, gestión de archivos, protección,
                protocolo y guardar.
                **Beneficios de Rango:**
                - **Al rango 3 [Distancia Incrementada]:** la distancia a la que el personaje puede usar la habilidad de enlace de datos aumenta a 4 (sin penalizador) / 8 (penalizador de +1 paso) / 12 (penalizador de +2 pasos) metros. Al rango 6, esto se convierte en 8/16/25 metros. Al rango 9, aumenta nuevamente a 15/30/50 metros, y al rango 12, mejora a 30/60/100 metros.
                - **Al rango 3 [Ranuras de Memoria]:** el personaje tiene efectivamente 1 ranura de memoria activa, que puede usarse para almacenar datos o programas. Al rango 6, la memoria activa aumenta a 2 ranuras, a 3 ranuras al rango 9 y a 4 ranuras al rango 12.
                - **Al rango 4 [Duración Incrementada]:** la unidad de duración base aumenta a 1 minuto, más un minuto adicional por punto de energía psiónica gastado para mantenerla. Al rango 8, esta unidad de duración pasa a ser de 5 minutos, y al rango 12, aumenta a 30 minutos.
                - **Al rango 4 [Editar]:** el personaje puede editar la información almacenada en los ordenadores, borrando, resecuenciando o cambiando la apariencia de los datos.
                - **Al rango 6 [Roboenlace]:** el personaje puede tomar el control temporal de los robots. Con una tirada de habilidad exitosa, el personaje puede implantar comandos en un solo robot, que luego se comporta como si hubiera sido afectado por una Sugerencia de Telepatía.
      drain:
        attribute: PER
        cost: 4
        url: /psionics/telepathy/#drain
        trained_only: true
        rank_benefits:
          - rank: 1
            title: Attribute Select
          - rank: 6
            title: Transference
        extended_duration: false
        localized:
          - en:
              name: Drain
              description: |-
                The character becomes able to sap the energy of another living being from a
                short distance away (range 1/2/4). When the psion purchases the skill, he or
                she selects one of the target's attributes (STR, DEX, CON, INT, or WIL) to
                govern the effect type. Any success on the skill check results in the target
                losing 1 point of the related attribute. If the target reaches a 0 score in
                the affected ability, he or she is helpless and unable to do anything until
                his or her score improves to at least 1.
                **Rank Benefits:**
                - **At rank 1 [Attribute Select]:** At ranks 1, 4, 8, and 12, the character can pick a new attribute to sap. The specific attribute affected is chosen before the skill check is made.
                - **At rank 6 [Transference]:** the user can temporarily gain the use of the drained attribute points. The benefit lasts until the victim recovers the lost points (to a maximum of 24 hours).
          - es:
              name: Drenar
              description: |-
                El personaje se vuelve capaz de absorber la energía de otro ser vivo desde una
                corta distancia (rango 1/2/4). Cuando el psiónico adquiere la habilidad,
                selecciona una de las características del objetivo (FUE, DES, CON, INT o VOL)
                para gobernar el tipo de efecto. Cualquier éxito en la tirada de habilidad da
                como resultado que el objetivo pierda 1 punto de la característica
                relacionada. Si el objetivo llega a una puntuación de 0 en la capacidad
                afectada, queda indefenso e incapaz de hacer nada hasta que su puntuación
                mejore al menos a 1.
                **Beneficios de Rango:**
                - **Al rango 1 [Selección de Característica]:** Al rango 1, 4, 8 y 12, el personaje puede elegir una nueva característica para absorber. La característica específica afectada se elige antes de realizar la tirada de habilidad.
                - **Al rango 6 [Transferencia]:** el usuario puede obtener temporalmente el uso de los puntos de característica drenados. El beneficio dura hasta que la víctima recupera los puntos perdidos (hasta un máximo de 24 horas).
      empathic-projection:
        attribute: PER
        cost: 3
        url: /psionics/telepathy/#empathic-projection
        trained_only: false
        rank_benefits:
          - rank: 4
            title: Increased Duration
          - rank: 4
            title: Ignore penalty
        extended_duration: false
        localized:
          - en:
              name: Empathic Projection
              description: |-
                With this skill, a character may alter the mood of other beings—even those
                with whom the character does not share a language, such as foreigners, aliens,
                or animals. In game terms, this shifts the emotional state of the target
                (Combative, Hostile, Neutral, Friendly, Charmed, or Fanatic) by one, two, or
                three steps, depending on the success (Ordinary, Good, or Amazing). In the
                event of a Critical Failure, the target's emotional state shifts two steps in
                the direction opposite of what was desired. The target must be within visual
                range of the psion. Minimum duration is d4 phases; add an additional number of
                phases equal to the user's skill rank. Multiple targets can be selected, but
                each additional target beyond the first provides a cumulative +1 step penalty
                to the skill check.
                **Rank Benefits:**
                - **At rank 4 [Increased Duration]:** the duration is in rounds (modified by an additional number of rounds equal to the user's skill rank). At rank 8, the duration increases to minutes. Finally, at rank 12, the duration is in 5-minute intervals.
                - **At rank 4 [Ignore penalty]:** the user can ignore one penalty step for either the target's current emotional state, or the number of intended targets. At rank 8, the character can ignore two such penalty steps, and at rank 12, the character can ignore three.
          - es:
              name: Proyección Empática
              description: |-
                Con esta habilidad, un personaje puede alterar el estado de ánimo de otros
                seres, incluso de aquellos con quienes no comparte un idioma, como
                extranjeros, alienígenas o animales. En términos de juego, esto cambia el
                estado emocional del objetivo (Combativo, Hostil, Neutral, Amistoso, Encantado
                o Fanático) en uno, dos o tres pasos, dependiendo del éxito (Ordinario, Bueno
                o Asombroso). En caso de un Fallo Crítico, el estado emocional del objetivo
                cambia dos pasos en la dirección opuesta a la deseada. El objetivo debe estar
                dentro del rango visual del psiónico. La duración mínima es de d4 fases; añada
                un número adicional de fases igual al rango de habilidad del usuario. Se
                pueden seleccionar múltiples objetivos, pero cada objetivo adicional más allá
                del primero proporciona un penalizador acumulativo de +1 paso a la tirada de
                habilidad.
                **Beneficios de Rango:**
                - **Al rango 4 [Duración Incrementada]:** la duración es en asaltos (modificada por un número adicional de asaltos igual al rango de habilidad del usuario). Al rango 8, la duración aumenta a minutos. Finalmente, al rango 12, la duración es en intervalos de 5 minutos.
                - **Al rango 4 [Ignorar penalizador]:** el usuario puede ignorar un paso de penalizador, ya sea por el estado emocional actual del objetivo o por el número de objetivos previstos. Al rango 8, el personaje puede ignorar dos pasos de penalizador, y al rango 12, el personaje puede ignorar tres.
      illusion:
        attribute: PER
        cost: 3
        url: /psionics/telepathy/#illusion
        trained_only: false
        rank_benefits:
          - rank: 5
            title: Vanish
          - rank: 9
            title: Delusion
        extended_duration: true
        localized:
          - en:
              name: Illusion
              description: |-
                This skill enables a character to fool a target's mind by projecting an
                illusion into it. An illusion can be a sight or a sound, but no other senses
                can be affected. An illusion is not capable of directly causing damage, but
                might do so indirectly. The skill is usable only against targets the character
                can see, and it has a maximum range of 5 meters per skill rank of the user.
                Any actions the user attempts while maintaining an illusion receive a +1 step
                penalty. The result of the character's skill check determines how powerful the
                illusion is, which provides a penalty to the target's Awareness-intuition
                skill check to recognize the illusion: Ordinary, +1 step ; Good, +2 steps;
                Amazing, +3 steps. Multiple targets can be selected to receive a single
                illusion, but each additional target beyond the first one provides a
                cumulative +1 step penalty to the psionics-user's skill check. Each target is
                entitled to make an Awareness- intuition check to see if the illusion is
                effective against that individual.
                **Rank Benefits:**
                - **At rank 5 [Vanish]:** a character who reaches rank 5 can mask his or her presence, effectively becoming invisible. The ability affects a number of observers equal to the psionics-user's rank in illusion without a penalty to the skill check; each additional target provides a cumulative +1 step penalty to the user's skill check.
                - **At rank 9 [Delusion]:** the user becomes capable of projecting an illusion that the target helps create. The user supplies the barest outline of a suggestion, and the target's mind fills in the details. (Treat this as a Telepathy-suggest skill check, though it carries a +1 bonus instead of a penalty). If the delusion takes effect, the target responds as though to physical stimuli.
          - es:
              name: Ilusión
              description: |-
                Esta habilidad permite a un personaje engañar la mente de un objetivo
                proyectando una ilusión en ella. Una ilusión puede ser visual o sonora, pero
                no puede afectar ningún otro sentido. Una ilusión no es capaz de causar daño
                directamente, pero puede hacerlo indirectamente. La habilidad solo se puede
                usar contra objetivos que el personaje pueda ver, y tiene un rango máximo de 5
                metros por rango de habilidad del usuario. Cualquier acción que intente el
                usuario mientras mantiene una ilusión recibe un penalizador de +1 paso. El
                resultado de la tirada de habilidad del personaje determina cuán poderosa es
                la ilusión, lo que proporciona un penalizador a la tirada de Percepción-
                intuición del objetivo para reconocer la ilusión: Ordinario, +1 paso; Bueno,
                +2 pasos; Asombroso, +3 pasos. Se pueden seleccionar múltiples objetivos para
                recibir una sola ilusión, pero cada objetivo adicional más allá del primero
                proporciona un penalizador acumulativo de +1 paso a la tirada de habilidad del
                usuario psiónico. Cada objetivo tiene derecho a hacer una tirada de
                Percepción-intuición para ver si la ilusión es efectiva contra ese individuo.
                **Beneficios de Rango:**
                - **Al rango 5 [Desaparecer]:** un personaje que alcanza el rango 5 puede ocultar su presencia, haciéndose efectivamente invisible. La habilidad afecta a un número de observadores igual al rango del usuario psiónico en Ilusión sin penalizador a la tirada de habilidad; cada objetivo adicional proporciona un penalizador acumulativo de +1 paso a la tirada de habilidad del usuario.
                - **Al rango 9 [Delirio]:** el usuario se vuelve capaz de proyectar una ilusión que el objetivo ayuda a crear. El usuario proporciona el esquema más básico de una sugerencia, y la mente del objetivo completa los detalles. (Trátelo como una tirada de habilidad de Telepatía-sugerencia, aunque conlleva un bonificador de +1 en lugar de un penalizador). Si el delirio surte efecto, el objetivo responde como si se tratara de estímulos físicos.
      mind-blast:
        attribute: PER
        cost: 4
        url: /psionics/telepathy/#mind-blast
        trained_only: true
        rank_benefits:
          - rank: 5
            title: Increased Damage
          - rank: 12
            title: Additional Targets
        extended_duration: false
        localized:
          - en:
              name: Mind Blast
              description: |-
                This skill allows the user to direct a powerful blast of pure mental energy at
                another mind. The target must be within visual contact and no more than 40
                meters away (range 10/20/40). Penalties for medium and long range are +1 and
                +2, respectively. Damage depends on the result of a skill check and the user's
                rank in the skill. Armor doesn't protect against a mind blast. When a
                character first acquires this skill, he or she is able to cause damage of
                d4+1s/d4+2s/d8+2s.
                **Rank Benefits:**
                - **At rank 5 [Increased Damage]:** damage becomes d4+2s/d6+2s/d8+2s. At rank 9, the damage caused by the skill goes to 2d4+2s/2d6+2s/2d8+2s.
                - **At rank 12 [Additional Targets]:** the telepath can affect an additional target, who must also be within range. The range modifier for the skill use is based on the range to the farthest target.
          - es:
              name: Explosión Mental
              description: |-
                Esta habilidad permite al usuario dirigir una poderosa explosión de energía
                mental pura a otra mente. El objetivo debe estar dentro del contacto visual y
                a no más de 40 metros de distancia (rango 10/20/40). Los penalizadores para el
                rango medio y largo son +1 y +2, respectivamente. El daño depende del
                resultado de una tirada de habilidad y del rango del usuario en la habilidad.
                La armadura no protege contra una explosión mental. Cuando un personaje
                adquiere esta habilidad por primera vez, es capaz de causar un daño de
                d4+1s/d4+2s/d8+2s.
                **Beneficios de Rango:**
                - **Al rango 5 [Daño Incrementado]:** el daño pasa a ser d4+2s/d6+2s/d8+2s. Al rango 9, el daño causado por la habilidad aumenta a 2d4+2s/2d6+2s/2d8+2s.
                - **Al rango 12 [Objetivos Adicionales]:** el telépata puede afectar a un objetivo adicional, que también debe estar dentro del rango. El modificador de rango para el uso de la habilidad se basa en el rango del objetivo más lejano.
      mind-shield:
        attribute: PER
        cost: 2
        url: /psionics/telepathy/#mind-shield
        trained_only: false
        rank_benefits:
          - rank: 4
            title: Parry
          - rank: 8
            title: Defend
          - rank: 12
            title: Redirect
        extended_duration: false
        localized:
          - en:
              name: Mind Shield
              description: |-
                This skill allows a character to establish a mental defense against psionic
                powers. Mind shield protects against these psionic skills: contact, drain,
                empathy, illusion, mind reading, mind blast, mind wipe, suggest, and tire.
                Mind shield provides a penalty to the skill check of another psionic character
                who's attempting to use any of the above-mentioned skills. The amount of the
                penalty depends on the result of the user's skill check: Ordinary, +1 step;
                Good, +2 steps; Amazing, +3 steps. These penalties are cumulative with any
                other resistances or protections a character might have. The shield created by
                this skill remains in place for 5-8 hours (d4+4) or until it fails to stop a
                psionic power directed against it, at which point it collapses.
                **Rank Benefits:**
                - **At rank 4 [Parry]:** he or she can attempt to mentally parry the use of contact, illusion, mind reading, mind blast, mind wipe, suggest, or tire against him or her. The parry attempt uses up the character's next available action, but if the Telepathy-mind shield skill check is successful, the opposing skill automatically fails. Further, on an Amazing success using this ability, the parry attempt costs the character no psionic energy points.
                - **At rank 8 [Defend]:** the character may extend the mind shield to protect others within 10 meters. For each additional person, the psion must expend 1 psionic energy point, in exchange for which he or she can apply his own mind shield modifier to psionic attacks directed at the subject. At rank 12, the psion can also attempt to parry such attacks directed at any of the subjects being protected.
                - **At rank 12 [Redirect]:** the character can use mind shield to redirect an attack back on an attacker. The defender must make a mind shield skill check (modified by the attacker's Will resistance modifier) to determine the effect of the redirection. This requires the user to spend 1 psionic energy point; an Amazing result eliminates the need to spend this point. A psion cannot redirect an attack directed at another character.
          - es:
              name: Escudo Mental
              description: |-
                Esta habilidad permite a un personaje establecer una defensa mental contra los
                poderes psiónicos. Escudo mental protege contra estas habilidades psiónicas:
                Contacto, Drenar, Empatía, Ilusión, Leer la mente, Explosión mental, Borrado
                mental, Sugerencia y Agotar. Escudo mental proporciona un penalizador a la
                tirada de habilidad de otro personaje psiónico que intenta usar cualquiera de
                las habilidades mencionadas anteriormente. La cantidad del penalizador depende
                del resultado de la tirada de habilidad del usuario: Ordinario, +1 paso;
                Bueno, +2 pasos; Asombroso, +3 pasos. Estos penalizadores son acumulativos con
                cualquier otra resistencia o protección que pueda tener un personaje. El
                escudo creado por esta habilidad permanece en su lugar durante 5-8 horas
                (d4+4) o hasta que no logra detener un poder psiónico dirigido contra él,
                momento en el que colapsa.
                **Beneficios de Rango:**
                - **Al rango 4 [Parada]:** puede intentar desviar mentalmente el uso de Contacto, Ilusión, Leer la mente, Explosión mental, Borrado mental, Sugerencia o Agotar en su contra. El intento de parada consume la próxima acción disponible del personaje, pero si la tirada de habilidad de Telepatía-escudo mental tiene éxito, la habilidad contraria falla automáticamente. Además, con un éxito Asombroso al usar esta habilidad, el intento de parada no le cuesta puntos de energía psiónica al personaje.
                - **Al rango 8 [Defender]:** el personaje puede extender el escudo mental para proteger a otros a 10 metros. Por cada persona adicional, el psiónico debe gastar 1 punto de energía psiónica, a cambio de lo cual puede aplicar su propio modificador de escudo mental a los ataques psiónicos dirigidos al sujeto. Al rango 12, el psiónico también puede intentar desviar dichos ataques dirigidos a cualquiera de los sujetos protegidos.
                - **Al rango 12 [Redirigir]:** el personaje puede usar escudo mental para devolver un ataque a un atacante. El defensor debe hacer una tirada de habilidad de escudo mental (modificada por el modificador de resistencia de Voluntad del atacante) para determinar el efecto de la redirección. Esto requiere que el usuario gaste 1 punto de energía psiónica; un resultado Asombroso elimina la necesidad de gastar este punto. Un psiónico no puede redirigir un ataque dirigido a otro personaje.
      mind-wipe:
        attribute: PER
        cost: 5
        url: /psionics/telepathy/#mind-wipe
        trained_only: true
        rank_benefits:
          - rank: 3
            title: Extended Reach
          - rank: 6
            title: Edit
          - rank: 12
            title: Unlearn
        extended_duration: false
        localized:
          - en:
              name: Mind Wipe
              description: |-
                With this skill, a psionic character can erase memories from a target's mind.
                One minute's memories can be erased for every rank the character has in mind
                wipe. The target must be within visual range, and no more than 10 meters away
                (range 2/5/10). The memories must be no older than 1 day per rank of the
                psionics-user. The character's skill check determines how difficult it is for
                the target to recall events during the 'erased' time. On an Ordinary success,
                the target receives a +1 step penalty on Intelligence feat checks to recall
                anything that happened during that time. On a Good success, the target
                receives a +2 step penalty. And on an Amazing success, the target receives a
                +3 step penalty. In any case, characters with erased memories will definitely
                know that something is wrong, assuming they are aware of the passage of time
                or of changes to themselves or their environment. They simply will not quite
                remember how these things happened.
                **Rank Benefits:**
                - **At rank 3 [Extended Reach]:** the character can "see" a number of weeks into the past equal to his or her skill rank. At rank 6, this becomes months; at rank 9, it becomes years; and at rank 12, it increases to decades.
                - **At rank 6 [Edit]:** the character can supply false memories to fill in the gaps in the target's mind. The success of the skill check determines the modifier for attempts to spot the false memories: Ordinary, +1, Good, +2, Amazing, +3.
                - **At rank 12 [Unlearn]:** a character who reaches rank 12 with this skill can remove specific knowledge from the target's mind. A successful skill check—resisted by the target's Will modifier—removes 1, 2, or 3 skill ranks (with an Ordinary, Good, or Amazing success) from the target's mind.
          - es:
              name: Borrado Mental
              description: |-
                Con esta habilidad, un personaje psiónico puede borrar recuerdos de la mente
                de un objetivo. Se pueden borrar los recuerdos de un minuto por cada rango que
                el personaje tenga en Borrado mental. El objetivo debe estar dentro del rango
                visual, y a no más de 10 metros de distancia (rango 2/5/10). Los recuerdos no
                deben tener más de 1 día por rango del usuario psiónico. El resultado de la
                tirada de habilidad del personaje determina lo difícil que es para el objetivo
                recordar eventos durante el tiempo "borrado". En un éxito Ordinario, el
                objetivo recibe un penalizador de +1 paso en las proezas de Inteligencia para
                recordar lo que sucedió durante ese tiempo. En un éxito Bueno, recibe un
                penalizador de +2 pasos. Y en un éxito Asombroso, recibe un penalizador de +3
                pasos. En cualquier caso, los personajes con recuerdos borrados sabrán que
                algo anda mal. Simplemente no recordarán exactamente cómo sucedieron las
                cosas.
                **Beneficios de Rango:**
                - **Al rango 3 [Alcance Extendido]:** el personaje puede "ver" en el pasado un número de semanas igual a su rango de habilidad. Al rango 6, esto se convierte en meses; al 9 en años; y al 12 aumenta a décadas.
                - **Al rango 6 [Editar]:** el personaje puede proporcionar recuerdos falsos para llenar los vacíos en la mente del objetivo. El éxito de la tirada de habilidad determina el modificador para los intentos de identificar los recuerdos falsos: Ordinario, +1, Bueno, +2, Asombroso, +3.
                - **Al rango 12 [Desaprender]:** un personaje que alcanza el rango 12 con esta habilidad puede eliminar conocimientos específicos de la mente del objetivo. Una tirada de habilidad exitosa (resistida por el modificador de Voluntad del objetivo) elimina 1, 2 o 3 rangos de habilidad (con un éxito Ordinario, Bueno o Asombroso) de la mente del objetivo.
      psychic-armor:
        attribute: PER
        cost: 2
        url: /psionics/telepathy/#psychic-armor
        trained_only: false
        rank_benefits:
          - rank: 4
            title: Increased Effect
        extended_duration: false
        localized:
          - en:
              name: Psychic Armor
              description: |-
                This skill creates a psychic "buffer zone" around the character, which helps
                to lessen the effect of drain, mind blast, and tire attacks directed at him or
                her. Psychic armor provides the character with a number of "psionic defense
                points". An Ordinary success gives the character d6 defense points; a Good
                success gives him d6+2 defense points; and an Amazing success gives the
                character d8+2 defense points. Defense points remain for d4+4 hours, or until
                they are used. A character cannot use this skill to gain more defense points
                until any previous defense points are lost. These points are used to reduce
                the amount of damage suffered from mind blast (on a one-for-one basis) or to
                give the character another option for resisting tire, drain, or empathic
                projection attacks. Two defense points reduce one point of fatigue loss caused
                by Telepathy-tire, and three defense points reduce one point of attribute loss
                caused by Telepathy-drain. Four defense points reduce by one degree the extent
                to which a character's emotional state has been altered by Telepathy-empathic
                projection.
                **Rank Benefits:**
                - **At rank 4 [Increased Effect]:** the character gains d6+2 defense points on an Ordinary success, d8+2 on a Good success, and d8+4 on an Amazing success. At rank 8, the character gains d8+2 defense points on an Ordinary success, d8+4 on a Good success, and d12+4 on an Amazing success. At rank 12, the character gains d8+4 defense points on an Ordinary success, d12+4 on a Good success, and d12+6 on an Amazing success.
          - es:
              name: Armadura Psíquica
              description: |-
                Esta habilidad crea una "zona de amortiguamiento" psíquica alrededor del
                personaje, que ayuda a disminuir el efecto de los ataques de Drenar, Explosión
                mental y Agotar dirigidos hacia él. La armadura psíquica le proporciona al
                personaje una serie de "puntos de defensa psiónica". Un éxito Ordinario le da
                al personaje d6 puntos de defensa; uno Bueno le da d6+2 puntos de defensa; y
                uno Asombroso le da d8+2. Los puntos de defensa se mantienen durante d4+4
                horas o hasta que se usan. Un personaje no puede usar esta habilidad para
                ganar más puntos de defensa hasta que se pierdan los anteriores. Estos puntos
                se usan para reducir la cantidad de daño sufrido por Explosión Mntal (uno a
                uno) o para darle al personaje otra opción para resistirse a los ataques de
                Agotar, Drenar o Proyección empática. Dos puntos de defensa reducen un punto
                de fatiga causado por Telepatía-agotar, y tres puntos de defensa reducen un
                punto de pérdida de característica causado por Telepatía-drenar. Cuatro puntos
                de defensa reducen en un grado la medida en la que el estado emocional de un
                personaje ha sido alterado por Telepatía-proyección empática.
                **Beneficios de Rango:**
                - **Al rango 4 [Efecto Incrementado]:** el personaje gana d6+2 puntos de defensa en un éxito Ordinario, d8+2 en un éxito Bueno, y d8+4 en un éxito Asombroso. Al rango 8, el personaje gana d8+2 puntos de defensa en un éxito Ordinario, d8+4 en un éxito Bueno, y d12+4 en un éxito Asombroso. Al rango 12, el personaje gana d8+4 puntos de defensa en un éxito Ordinario, d12+4 en un éxito Bueno, y d12+6 en un éxito Asombroso.
      psychic-projection:
        attribute: PER
        cost: 5
        url: /psionics/telepathy/#psychic-projection
        trained_only: false
        rank_benefits:
          - rank: 12
            title: Body-Riding
        extended_duration: false
        localized:
          - en:
              name: Psychic Projection
              description: |-
                With this skill, a character can separate mind from body and travel wherever
                desired, leaving his or her physical form behind. The psion's consciousness is
                able to fly and to pass through solid objects. The character's mental form is
                invisible and intangible, though his or her physical body is still vulnerable.
                While travelling psychically, the character's movement rate is equal to (INT +
                WIL) x 2. The character is effectively naked—being unable to bring physical
                objects such as clothing or weapons along—though he or she can appear however
                desired. Only other psychically projected beings can perceive the character in
                any fashion, though he or she can perceive the real world via sight and sound.
                A projected individual can return to his or her physical body at any time
                desired, simply by traveling back to it and successfully performing another
                Telepathy-psychic projection skill check.
                **Rank Benefits:**
                - **At rank 12 [Body-Riding]:** the character can attempt to seize control of a body that is already occupied, by making a Telepathy-psychic projection skill check, modified by the target's Will resistance modifier. The result determines how much control the character has over the new form.
          - es:
              name: Proyección Psíquica
              description: |-
                Con esta habilidad, un personaje puede separar la mente del cuerpo y viajar a
                donde desee, dejando atrás su forma física. La conciencia del psiónico es
                capaz de volar y atravesar objetos sólidos. La forma mental del personaje es
                invisible e intangible, aunque su cuerpo físico sigue siendo vulnerable. Al
                viajar psíquicamente, la velocidad de movimiento del personaje es igual a (INT
                + VOL) x 2. El personaje está efectivamente desnudo, siendo incapaz de llevar
                consigo objetos físicos como ropa o armas, aunque puede aparecer como desee.
                Solo otros seres proyectados psíquicamente pueden percibir al personaje de
                alguna manera, aunque el personaje puede percibir el mundo real a través de la
                vista y el oído. Un individuo proyectado puede regresar a su cuerpo físico en
                cualquier momento deseado, simplemente viajando de regreso a él y realizando
                con éxito otra tirada de habilidad de Telepatía-proyección psíquica.
                **Beneficios de Rango:**
                - **Al rango 12 [Posesión de Cuerpos]:** el personaje puede intentar tomar el control de un cuerpo que ya está ocupado haciendo una tirada de habilidad de Telepatía-proyección psíquica, modificada por el modificador de resistencia de Voluntad del objetivo. El resultado determina cuánto control tiene el personaje sobre la nueva forma.
      suggest:
        attribute: PER
        cost: 3
        url: /psionics/telepathy/#suggest
        trained_only: false
        rank_benefits:
          - rank: 6
            title: Programmed Suggestion
        extended_duration: false
        localized:
          - en:
              name: Suggest
              description: |-
                This specialty skill allows a character to mesmerize another person. If
                successful, suggest plants a thought into another person's mind and convinces
                that person that the thought is his or her own. The target must be within
                visual range of the psion. No suggestion can have a permanent or immediately
                detrimental effect on the character it's directed at. A suggestion lasts for
                as long as 1, 2, or 3 hours, depending on the degree of success of the user's
                skill check (Ordinary, Good, or Amazing). It could expire before its time
                limit is reached, but it can't be extended without another successful
                application of the skill at precisely the time when the original suggestion is
                due to run out. The Gamemaster will assign a bonus or a penalty to the user's
                skill check to reflect how extreme the suggestion is (e.g. opposed to the
                character's nature would provide a severe penalty of +3 steps or more).
                **Rank Benefits:**
                - **At rank 6 [Programmed Suggestion]:** the character can implant a suggestion that does not immediately take effect. Instead, when the subject experiences some kind of sensory cue, the subject acts upon the suggestion. The triggering event can be as long as 1 hour, 1 day, or 1 month later, depending on the result of the user's skill check.
          - es:
              name: Sugerir
              description: |-
                Esta habilidad especializada permite al personaje hipnotizar a otra persona.
                Si tiene éxito, sugiere implantar un pensamiento en la mente de otra persona y
                convencer a esa persona de que el pensamiento es propio. El objetivo debe
                estar dentro del rango visual del psiónico. Ninguna sugerencia puede tener un
                efecto permanente o inmediatamente perjudicial en el personaje al que está
                dirigida. Una sugerencia dura 1, 2 o 3 horas, dependiendo del grado de éxito
                de la tirada de habilidad del usuario (Ordinario, Bueno o Asombroso). Puede
                expirar antes de que se alcance su límite de tiempo, pero no se puede extender
                sin otra aplicación exitosa de la habilidad exactamente en el momento en que
                la sugerencia original debe terminar. El Director de Juego asignará una
                bonificación o penalizador a la tirada de habilidad del usuario para reflejar
                lo extrema que es la sugerencia (p. ej., oponerse a la naturaleza del
                personaje proporcionaría un penalizador de +3 pasos o más).
                **Beneficios de Rango:**
                - **Al rango 6 [Sugerencia Programada]:** el personaje puede implantar una sugerencia que no hace efecto de inmediato. En cambio, cuando el sujeto experimenta algún tipo de señal sensorial, actúa según la sugerencia. El evento desencadenante puede ser hasta 1 hora, 1 día o 1 mes después, dependiendo del resultado de la tirada de habilidad.
      tire:
        attribute: PER
        cost: 2
        url: /psionics/telepathy/#tire
        trained_only: false
        rank_benefits:
          - rank: 4
            title: Increased Effect
          - rank: 9
            title: Transference
        extended_duration: false
        localized:
          - en:
              name: Tire
              description: |-
                This skill inflicts fatigue damage upon a target, perhaps prompting that
                character to decide that he or she is in need of rest. The target must be
                within visual contact and no more than 30 meters away (range 10/20/30).
                Penalties for medium and long range are +1 and +2 respectively. The amount of
                damage inflicted depends on the result of a skill check: Ordinary, 1 fatigue
                point; Good, 2 points; Amazing, 3 points.
                **Rank Benefits:**
                - **At rank 4 [Increased Effect]:** the range increases to 15/30/50 meters. At rank 8, an Ordinary result inflicts 2 points of fatigue damage, a Good inflicts 3 points, and an Amazing 4 points. At rank 12, the range increases again to 20/40/60 meters.
                - **At rank 9 [Transference]:** the character can take fatigue points drained from the target and use them. The fatigue points can exceed the character's normal fatigue point total, and remain until lost through normal activity, or until 24 hours have passed—whichever occurs first.
          - es:
              name: Agotar
              description: |-
                Esta habilidad inflige daño por fatiga al objetivo, quizás provocando que
                decida que necesita descansar. El objetivo debe estar a la vista y a no más de
                30 metros de distancia (rango 10/20/30). Los penalizadores a medio y largo
                alcance son de +1 y +2 respectivamente. La cantidad de daño infligido depende
                del resultado de una tirada de habilidad: Ordinario, 1 punto de fatiga; Bueno,
                2 puntos; Asombroso, 3 puntos.
                **Beneficios de Rango:**
                - **Al rango 4 [Efecto Incrementado]:** el alcance se incrementa a 15/30/50 metros. Al rango 8, un éxito Ordinario inflige 2 puntos de fatiga, 3 si es Bueno y 4 si es Asombroso. Al rango 12, el alcance aumenta de nuevo a 20/40/60 metros.
                - **Al rango 9 [Transferencia]:** el personaje puede tomar los puntos de fatiga extraídos del objetivo y usarlos. Los puntos de fatiga pueden exceder el total de fatiga normal del personaje, y permanecen hasta perderse por la actividad normal, o han pasado 24 horas, lo que ocurra primero.
      undo:
        attribute: PER
        cost: 3
        url: /psionics/telepathy/#undo
        trained_only: false
        extended_duration: false
        localized:
          - en:
              name: Undo
              description: |-
                With this skill, a telepath can reverse the effects of a successful use of
                Telepathy-illusion, mind wipe, or suggest. The telepath must achieve a better
                result than the user of the original telepathic skill, with a +1 step modifier
                per rank of difference if the original user's rank is higher, or a
                -1 step modifier per rank of difference if the original user's rank is lower. Only one attempt is allowed each day.
          - es:
              name: Deshacer
              description: |-
                Con esta habilidad, un telépata puede revertir los efectos de un uso exitoso
                de Telepatía-ilusión, borrado mental o sugerir. El telépata debe lograr un
                mejor resultado que el usuario de la habilidad telepática original, con un
                modificador de +1 paso por rango de diferencia si el rango del usuario
                original es mayor, o un modificador de -1 paso por rango de diferencia si el
                rango del usuario original es menor. Solo se permite un intento por día.
      guidance:
        attribute: PER
        cost: 4
        url: /psionics/telepathy/#guidance
        trained_only: true
        rank_benefits:
          - rank: 6
            title: Extended Time
          - rank: 12
            title: Conduit
        extended_duration: true
        localized:
          - en:
              name: Guidance
              description: |-
                With a successful skill check, the telepath can implant one of his or her
                non-psionic skills in the mind of a subject for as long as he or she continues
                to expend psionic energy points. The attempt carries the same situational
                modifiers as the contact skill. The target must be within visual range of the
                psion using this skill. The subject gains access to the appropriate broad
                skill on an Ordinary success, half the telepath's rank (rounded down) in the
                appropriate specialty skill on a Good success, or the telepath's rank -1 on an
                Amazing success. Obviously, the telepath cannot use guidance to confer skills
                he or she does not possess—and cannot confer skills learned via another
                telepath using guidance!
                **Rank Benefits:**
                - **At rank 6 [Extended Time]:** the user only needs to expend psionic energy points every 5 rounds in order to continue granting the skill to the subject.
                - **At rank 12 [Conduit]:** the user can transfer a non-psionic skill he or she does not possess by taking it from the mind of a willing "donor."
          - es:
              name: Guía
              description: |-
                Con una tirada de habilidad exitosa, el telépata puede implantar una de sus
                habilidades no psiónicas en la mente de un objetivo durante el tiempo que
                continúe gastando puntos de energía psiónica. El intento conlleva los mismos
                modificadores situacionales que la habilidad Contacto. El objetivo debe estar
                dentro del rango visual del psiónico. El sujeto adquiere acceso a la habilidad
                general apropiada en un éxito Ordinario, la mitad del rango del telépata
                (redondeado hacia abajo) en la habilidad especializada con un éxito Bueno, o
                el rango del telépata -1 en un éxito Asombroso. Está claro que el telépata no
                puede conferir habilidades que no posee él mismo, y no puede conferir
                habilidades adquiridas a través de la Guía de otra persona.
                **Beneficios de Rango:**
                - **Al rango 6 [Tiempo Extendido]:** el usuario solo necesita gastar puntos de energía psiónica cada 5 asaltos para poder seguir concediendo la habilidad al objetivo.
                - **Al rango 12 [Conducto]:** el usuario puede transferir una habilidad no psiónica que no posee sacándola de la mente de un donante dispuesto.
      subdual:
        attribute: PER
        cost: 3
        url: /psionics/telepathy/#subdual
        trained_only: true
        rank_benefits:
          - rank: 4
            title: Increased Effect
        extended_duration: false
        localized:
          - en:
              name: Subdual
              description: |-
                This skill allows the user to engender feelings of calm, or even detachment,
                in any intelligent species. The target must be within visual range. With an
                Ordinary result, the target becomes less violent, suffering a +1 step penalty
                to combat skill checks, including action checks. On a Good success, the
                reaction is even stronger, conferring a +3 step penalty to combat skill checks
                and action checks. And on an Amazing success, the subject becomes incapable of
                launching an attack against another living being, and will hesitate for a
                phase before attacking objects, structures, or other nonliving things. Most
                Aleerins, incidentally, would never dream of using this ability to take
                advantage of another being. To do so requires that the Aleerin succeed at a
                Resolve-mental resolve check.
                **Rank Benefits:**
                - **At rank 4 [Increased Effect]:** the user can affect two targets with the same skill check. At rank 8, he or she can affect four targets, and eight targets at rank 12.
          - es:
              name: Sometimiento
              description: |-
                Esta habilidad permite al usuario engendrar sentimientos de calma o incluso
                distanciamiento en cualquier especie inteligente. El objetivo debe encontrarse
                dentro del alcance visual. Con un resultado Ordinario, el objetivo se vuelve
                menos violento y recibe un penalizador de +1 a las tiradas de combate,
                incluyendo las de acción. En un éxito Bueno, la reacción es aún mayor,
                otorgando un penalizador de +3 a las tiradas de combate y de acción. Y en un
                éxito Asombroso, el objetivo se vuelve incapaz de iniciar un ataque contra
                otro ser vivo y dudará una fase antes de atacar objetos, estructuras o
                elementos inanimados. Dicho sea de paso, la mayoría de los Aleerin nunca
                soñarían con usar esta habilidad para aprovecharse de otro ser. Para hacerlo,
                es necesario que el Aleerin supere una tirada de Resolución Mental.
                **Beneficios de Rango:**
                - **Al rango 4 [Efecto Incrementado]:** el usuario puede afectar a dos objetivos con la misma tirada de habilidad. Al rango 8, puede afectar a cuatro objetivos, y a ocho objetivos al rango
                  12.
    trained_only: true
