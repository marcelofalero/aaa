        extended_duration: false
        localized:
          - en:
              name: Dream Hunt
              description: |-
                Though originally developed for hunting animals, the technique works on any
                living being. The sesheyan (or sesheyan-trained) psion concentrates on the
                subject and mentally engages in a hunt. The better the subject’s habits are
                known, the easier the hunt. If the skill check is successful, the psion
                determines the place where the quarry will be at any single locale in the next
                24 hours (though not when). The better the target's habits are known, the
                easier the hunt:

                - **Familiar target / territory:** -2 / -1 step bonus.
                - **Described / Unknown target:** +1 / +2 step penalty. The degree of success determines how accurately the psion can pinpoint the location:
                - **Ordinary:** within 1000 meters.
                - **Good:** within 500 meters.
                - **Amazing:** within 100 meters. 

                Characters who receive this information can make Awareness-perception checks or Investigate-search checks with a -1, -2, or -3 step bonus to locate or avoid being surprised by the quarry.

                ### Rank Benefits

                ▶ **Rank 3 [Improved Accuracy]:** the psion is able to narrow down the time the prey will be at a given locale to within 3 hours.

                ▶ **Rank 6 [Improved Accuracy]:** pinpointing improved: Ordinary 500m; Good 100m; Amazing 50m.

                ▶ **Rank 9 [Improved Timing]:** the psion can determine when the prey will be at a particular location to within 30 minutes.

                ▶ **Rank 12 [Improved Accuracy]:** pinpointing improved: Ordinary 100m; Good 50m; Amazing 10m.
          - es:
              name: Caza Onírica
              description: |-
                Aunque originalmente fue desarrollada para la caza de animales, la técnica funciona en cualquier
                ser vivo. El psion sesheyan (o entrenado por sesheyan) se concentra en el
                sujeto y mentalmente se involucra en una cacería. Cuanto mejores sean los hábitos del sujeto
                conocido, más fácil será la caza. Si la prueba de habilidad tiene éxito, el psion
                determina el lugar donde estará la cantera en cualquier lugar en el próximo
                24 horas (aunque no cuando). Cuanto mejor se conozcan los hábitos del objetivo, más
                más fácil la caza:

                - **Objetivo/territorio familiar:** -2 / -1 Bonificación de paso.
                - **Objetivo descrito/desconocido:** +1 / +2 Penalización de paso. El grado de éxito determina la precisión con la que el psion puede señalar la ubicación:
                - **Ordinario:** dentro de 1000 metros.
                - **Bueno:** a menos de 500 metros.
                - **Asombroso:** dentro de 100 metros.

                Los personajes que reciban esta información pueden realizar pruebas de Alerta-Percepción o pruebas de Investigar-buscar con un -1, -2 o -3 Bonificación de paso para localizar o evitar ser sorprendidos por la presa.

                ### Beneficios de Rango

                ▶ **Rango 3 (Precisión mejorada):** el psion puede reducir el tiempo que la presa estará en un lugar determinado a 3 horas.

                ▶ **Rango 6 (Precisión mejorada):** localización mejorada: Ordinario 500m; Bueno 100m; Asombroso 50m.

                ▶ **Rango 9 (Tiempo mejorado):** el psion puede determinar cuándo estará la presa en un lugar particular en un plazo de 30 minutos.

                ▶ **Rango 12 (Precisión mejorada):** localización mejorada: Ordinario 100m; Bueno 50m; Asombroso 10m.
      empathy:
        attribute: INT
        cost: 1
        url: /psionics/esp/#empathy
        trained_only: false
        rank_benefits:
          - rank: 4
            title: Relationship
          - rank: 6
            title: Aura Reading
          - rank: 8
            title: Relationship
          - rank: 9
            title: Connection
          - rank: 12
            title: Relationship
        extended_duration: true
        localized:
          - en:
              name: Empathy
              description: |-
                This skill allows a psion to “read” the surface emotions of another character.
                This ability assists the user in encounter situations. The target must be
                within visual range. A successful use of empathy provides an understanding of
                the target's emotional state (Combative, Hostile, Neutral, Friendly, Charmed,
                or Fanatic) and provides a bonus when using encounter skills upon that target
                character:
                - **Ordinary:** -1 step bonus.
                - **Good:** -2 step bonus.
                - **Amazing:** -3 step bonus.

                ### Rank Benefits
                ▶ **Rank 4 [Relationship]:** the empath can sense the surface emotions of two other characters toward each other.

                ▶ **Rank 6 [Aura Reading]:** evaluate health state (healthy, injured, sick, dying, insane, etc.). Grants a -1 to -3 step bonus to Medical Science, Knowledge-first aid, or [[Biokinesis-Heal]] or [[Biokinasis-Rejuvenate]] checks used to treat the target. Attempts on different species suffer a +1 step penalty.

                ▶ **Rank 8 [Relationship]:** the empath can apply this skill to three other characters.

                ▶ **Rank 9 [Connection]:** develop a connection with an individual to sense emotions even when not in visual range, up to 1 mile per rank away.

                ▶ **Rank 12 [Relationship]:** the empath can apply this skill to four other characters.
          - es:
              name: Empatía
              description: |-
                Esta habilidad permite a un psion "leer" las emociones superficiales de otro Personaje.
                Esta habilidad ayuda al usuario en situaciones de encuentro. El objetivo debe ser
                dentro del alcance visual. Un uso exitoso de la empatía proporciona una comprensión de
                el estado emocional del objetivo (Combativo, Hostil, Neutral, Amistoso, Encantado,
                o Fanático) y proporciona una bonificación al usar habilidades de encuentro sobre ese objetivo.
                Personaje:
                - **Ordinario:** -1 Bonificación de paso.
                - **Bueno:** -2 Bonificación de paso.
                - **Asombroso:** -3 Bonificación de paso.

                ### Beneficios de Rango
                ▶ **Rango 4 (Relación):** el empático puede sentir las emociones superficiales de dos personajes Otros hacia cada Otros.

                ▶ **Rango 6 (Lectura de Aura):** evaluar el estado de salud (sano, herido, enfermo, moribundo, demente, etc.). Otorga de -1 a -3 Bonificación de paso a Ciencias médicas, conocimientos de primeros auxilios o pruebas de [[Biokinesis-Heal]] o [[Biokinasis-Rejuvenate]] utilizadas para tratar al objetivo. Los intentos sobre diferentes especies sufren un +1 Penalización de paso.

                ▶ **Rango 8 (Relación):** el empático puede aplicar esta habilidad a tres personajes Otros.

                ▶ **Rango 9 (Conexión):** desarrolle una conexión con un individuo para sentir emociones incluso cuando no esté en el alcance visual, hasta 1 milla por Rango de distancia.

                ▶ **Rango 12 (Relación):** el empático puede aplicar esta habilidad a cuatro personajes Otros.
      mind-reading:
        attribute: INT
        cost: 3
        url: /psionics/esp/#mind-reading
        trained_only: false
        rank_benefits:
          - rank: 3
            title: Extra Time
          - rank: 6
            title: Probe
          - rank: 9
            title: Extra Time
          - rank: 12
            title: Extra Time
        extended_duration: false
        localized:
          - en:
              name: Mind Reading
              description: |-
                This skill enables a psion to “read” the surface thoughts of another
                character. The target must be within 500 meters (100m/200m/500m) of the
                psionics-user. The mental contact remains in effect for a limited time and
                can't be extended by the use of psionic energy points.
                ### Check Results
                - **Ordinary:** contact lasts for 1 phase after the skill check is made. Only random and disjointed thoughts are perceived.
                - **Good:** contact lasts for 2 phases. In addition to random thoughts, more detail and coherence is received, such as why the target is thinking about someone or something.
                - **Amazing:** contact lasts for 3 phases. Complete surface thoughts can be read, plus some key fact related to what the psionics-user hoped to discover.

                ### Rank Benefits
                ▶ **Rank 3 [Extra Time]:** the character may add an additional phase to the duration: Ordinary, 2 phases; Good, 3 phases; Amazing, 4 phases.

                ▶ **Rank 6 [Probe]:** focused search through a target’s mind for a specific piece of information. (+2 step penalty for aliens). Will resistance applies.

                ▶ **Rank 9 [Extra Time]:** duration increases: Ordinary, 1 round; Good, 2 rounds; Amazing, 3 rounds.

                ▶ **Rank 12 [Extra Time]:** duration increases: Ordinary, 1 minute; Good, 2 minutes; Amazing, 3 minutes.
          - es:
              name: Lectura Mental
              description: |-
                Esta habilidad permite a un psion "leer" los pensamientos superficiales de otro.
                Personaje. El objetivo debe estar a menos de 500 metros (100 m/200 m/500 m) del
                usuario psiónico. El contacto Mental permanece vigente por tiempo limitado y
                No se puede ampliar mediante el uso de puntos de energía psiónica.
                ### Verificar resultados
                - **Ordinario:** el contacto dura 1 fase después de realizar la prueba de habilidad. Sólo se perciben pensamientos aleatorios e inconexos.
                - **Bueno:** el contacto tiene una duración de 2 fases. Además de los pensamientos aleatorios, se reciben más detalles y coherencia, como por ejemplo por qué el objetivo está pensando en alguien o algo.
                - **Asombroso:** el contacto tiene una duración de 3 fases. Se pueden leer pensamientos superficiales completos, además de algún hecho clave relacionado con lo que el usuario psiónico esperaba descubrir.

                ### Beneficios de Rango
                ▶ **Rango 3 (Tiempo Extra):** el Personaje puede agregar una fase adicional a la duración: Ordinario, 2 fases; Bueno, 3 fases; Asombroso, 4 fases.

                ▶ **Rango 6 (Sonda):** búsqueda enfocada a través de la mente de un objetivo para obtener una información específica. (+2 Penalización de paso para extraterrestres). Se aplica la resistencia a la voluntad.

                ▶ **Rango 9 (Tiempo extra):** aumentos de duración: Ordinario, 1 ronda; Bueno, 2 rondas; Asombroso, 3 rondas.

                ▶ **Rango 12 (Tiempo extra):** aumentos de duración: Ordinario, 1 minuto; Bueno, 2 minutos; Asombroso, 3 minutos.
      navcognition:
        attribute: INT
        cost: 3
        url: /psionics/esp/#navcognition
        trained_only: true
        rank_benefits:
          - rank: 4
            title: Travel Time
          - rank: 4
            title: Travel Distance
          - rank: 5
            title: System Navigation
          - rank: 6
            title: Clarity of Mind
          - rank: 9
            title: Drivespace Navigation
          - rank: 12
            title: Tracking
        extended_duration: false
        localized:
          - en:
              name: Navcognition
              description: |-
                A character who uses this skill can instinctively determine his or her present
                location and mentally plot a course. This can be accomplished on a planetary
                surface, in normal space, and even through drivespace. This mental ability
                replaces the use of the Navigation skill. On it's basic form it can only be as a
                substitute for the [[navigation-surface]] skill. But by spending 1 psionic it can work
                at system scale, and by spending 2 it can plot courses through drivespace.

                | Situation/Condition | Modifier |
                | :--- | :---: |
                | Combat / Hostile conditions | +4 / +2 |
                | Unexplored / Partially explored territory | +4 / +2 |
                | Less than 5 minutes plotting | +1 per min. |
                | More than 5 minutes plotting | -1 per min. |

                ### Rank Benefits
                ▶ **Rank 4 [Travel Time]:** becomes able to determine the clearest way to the destination . Cuts travel time (surface/system): Ordinary 10%; Good 25%; Amazing 50% of normal. A critical failure results in 50% longer travel time.

                ▶ **Rank 4 [Drivespace Distance]:** when used for drivespace the skill allows for plotting courses using the otherwise unpreditable drivespace faults. The travel distance is increased by: Ordinary +5ly; Good +10ly; Amazing +20ly. A critical failure results in -10ly shorter travel distance.

                ▶ **Rank 5 [Improved Navigation]:** reduce the cost of using the skill at system scale and to drivespace by 1. The character can also gain a -1 step bonus when using the skill by spending 1 additional psionic energy point.

                ▶ **Rank 6 [Clarity of Mind]:** During combat is the psion is the pilot, copilot or navigator, he can use this power to reduce the penalties for situational conditions up to 4 step. For example navigating through an asteroid field, combat while avoiding debris, ships, or other hazards.

                ▶ **Rank 9 [Advanced Navigation]:** allows the character to use the skill at drivespace without additional cost. The character can ear a -2 step bonus when using the skill by spending 1 additional psionic energy point.

                ▶ **Rank 12 [Tracking]:** may use navcognition to attempt to track the most likely
                destination of a target subject.
                This ability may even be attempted through drivespace.
                Using this ability requires that the character begin at a location where the target was last seen. Either by the character, or by a witness. The character must attempt a navcognition skill
                check, with a +2 step penalty if he or she witnessed the subject, or a +4 step penalty if the subject was witnessed by someone else, or merely recorded. These penalties are cumulative with other navcognition situational modifiers.
          - es:
              name: Navcognición
              description: |-
                Un Personaje que usa esta habilidad puede determinar instintivamente su presente
                ubicación y trazar mentalmente un rumbo. Esto se puede lograr en un planeta
                superficie, en el espacio normal e incluso a través del espacio del disco. Esta habilidad Mental
                reemplaza el uso de la habilidad Navegación. En su forma básica sólo puede ser como un
                sustituto de la habilidad [[Navegación-surface]]. Pero gastando 1 psiónico puede funcionar.
                a escala del sistema, y al gastar 2 puede trazar cursos a través del espacio de conducción.

                | Situación/Condición | Modificador |
                | :--- | :---: |
                | Combate / Condiciones hostiles | +4 / +2 |
                | Territorio inexplorado/parcialmente explorado | +4 / +2 |
                | Menos de 5 minutos tramando | +1 por minuto. |
                | Más de 5 minutos tramando | -1 por minuto. |

                ### Beneficios de Rango
                ▶ **Rango 4 (Tiempo de viaje):** puede determinar el camino más claro hacia el destino. Reduce el tiempo de viaje (superficie/sistema): Ordinario 10%; Bueno 25%; Asombroso 50% de lo normal. Un Fallo Crítico da como resultado un tiempo de viaje un 50% más largo.

                ▶ **Rango 4 (Distancia del espacio de conducción):** cuando se usa para el espacio de conducción, la habilidad permite trazar cursos utilizando las fallas del espacio de conducción que de otro modo serían impredecibles. La distancia recorrida aumenta en: Ordinario +5ly; Bueno +10ly; Asombroso +20ly. Un Fallo Crítico da como resultado una distancia de recorrido -10 veces más corta.

                ▶ **Rango 5 (Navegación mejorado):** reduce el costo de usar la habilidad a escala del sistema y en el espacio de conducción en 1. El Personaje también puede obtener un -1 Bonificación de paso al usar la habilidad gastando 1 punto de energía psiónica adicional.

                ▶ **Rango 6 (Claridad mental):** Durante Combate, si el psion es el piloto, copiloto o navegante, puede usar este poder para reducir las penalizaciones por condiciones situacionales hasta 4 pasos. Por ejemplo, navegar a través de un campo de asteroides, Combate mientras evita escombros, barcos o peligros Otros.

                ▶ **Rango 9 (Navegación avanzado):** permite que Personaje use la habilidad en el espacio de conducción sin costo adicional. El Personaje puede obtener un -2 Bonificación de paso cuando usa la habilidad gastando 1 punto de energía psiónica adicional.

                ▶ **Rango 12 (Seguimiento):** puede usar navcognition para intentar Rastrear lo más probable
                destino de un sujeto objetivo.
                Esta habilidad puede incluso intentarse a través del espacio del disco.
                El uso de esta habilidad requiere que el Personaje comience en el lugar donde se vio el objetivo por última vez. Ya sea por el Personaje, o por un testigo. El Personaje debe intentar una habilidad de navegación
                marque, con un +2 Penalización de paso si fue testigo del sujeto, o un +4 Penalización de paso si el sujeto fue presenciado por otra persona, o simplemente grabado. Estas penalizaciones son acumulativas con los modificadores situacionales de navegación Otros.
      postcognition:
        attribute: INT
        cost: 4
        url: /psionics/esp/#postcognition
        trained_only: false
        rank_benefits:
          - rank: 3
            title: Extended Reach
          - rank: 6
            title: Extended Reach
          - rank: 9
            title: Extended Reach
          - rank: 12
            title: Extended Reach
        extended_duration: false
        localized:
          - en:
              name: Postcognition
              description: |-
                With this skill, a character can sense the mood of an area and even "see" events that happened there in the recent past. What a character senses depends on the result of a skill check:

                ### Check Results
                - **Ordinary:** The character senses general emotions that have been left in an area.
                - **Good:** The psion also receives brief flashes of events that may or may not make sense.
                - **Amazing:** The character actually experiences a brief encounter as though at the scene when the events occurred.

                One successful skill check can be made in an area, and the character must be in the actual area to sense psychic resonance. In general, a character can see a number of days into the past equal to his or her skill rank. (With just the broad skill, less than one time unit is available to the character.)

                Players can use this skill to gain clues for their characters, or the Gamemaster can use it to direct story elements in a certain direction. The Gamemaster can automatically activate this skill (no psionic energy point cost) to provide clues.

                ### Rank Benefits

                ▶ **Rank 3 [Extended Reach]** At rank 3, the character can see a number of weeks into the past equal to his skill rank.

                ▶ **Rank 6 [Extended Reach]** At rank 6, this increases to months.

                ▶ **Rank 9 [Extended Reach]** At rank 9, this increases to years.

                ▶ **Rank 12 [Extended Reach]** At rank 12, this increases to decades.
          - es:
              name: Postcognición
              description: |-
                Con esta habilidad, un Personaje puede sentir el estado de ánimo de un área e incluso "ver" eventos que sucedieron allí en el pasado reciente. Lo que detecta un Personaje depende del resultado de una prueba de habilidad:

                ### Verificar resultados
                - **Ordinario:** El Personaje detecta emociones generales que han quedado en un área.
                - **Bueno:** El psion también recibe breves destellos de eventos que pueden o no tener sentido.
                - **Asombroso:** El Personaje en realidad experimenta un breve encuentro como si estuviera en el lugar donde ocurrieron los hechos.

                Se puede realizar una prueba de habilidad exitosa en un área, y el Personaje debe estar en el área real para detectar la resonancia psíquica. En general, un Personaje puede ver una cantidad de días en el pasado igual a su habilidad Rango. (Con solo la habilidad amplia, el Personaje dispone de menos de una unidad de tiempo).

                Los jugadores pueden usar esta habilidad para obtener pistas para sus personajes, o el Director de Juego puede usarla para dirigir elementos de la historia en una dirección determinada. El Director de Juego puede activar automáticamente esta habilidad (sin costo de puntos de energía psiónica) para proporcionar pistas.

                ### Beneficios de Rango

                ▶ **Rango 3 [Alcance extendido]** En Rango 3, el Personaje puede ver un número de semanas en el pasado igual a su habilidad Rango.

                ▶ **Rango 6 [Alcance extendido]** En Rango 6, esto aumenta a meses.

                ▶ **Rango 9 [Alcance extendido]** En Rango 9, esto aumenta a años.

                ▶ **Rango 12 [Alcance extendido]** En Rango 12, esto aumenta a décadas.
      precognition:
        attribute: INT
        cost: 4
        url: /psionics/esp/#precognition
        trained_only: true
        rank_benefits:
          - rank: 3
            title: Tactical Horizon
          - rank: 6
            title: Operational Horizon
          - rank: 9
            title: Strategic Horizon
          - rank: 12
            title: Causal Horizon
        extended_duration: false
        localized:
          - en:
              name: Precognition
              description: |-
                > [!NOTE]
                > **Requires Perk:** Precog.

                ### The Session Flash

                At the start of each session, the Gamemaster makes three secret rolls to determine the nature of the "Fixed Point" that the psion will sense during the session. Normally, the psion needs to be in a calm state of mind to receive a vision, while some can only receive them in dreams. For that reason, it is possible that in some sessions the psion does not receive a vision. The psion's visions are usually unclear and might make no sense when they occur; instead, they experience a persistent sense of déjà vu or intuitive dread as events unfold toward the Point.

                #### 1. Scope (The Breadth of the Ripple)

                | Result | Scope | Description |
                | :---: | :--- | :--- |
                | **20** | Systemic | Affecting an entire station, city, or population. |
                | **15–19** | Social | Involving a group of acquaintances or public figures. |
                | **10–14** | Localized | Affecting someone close to the psion or a specific small group. |
                | **1–9** | Isolated | A single point of interaction. |

                #### 2. Weight (The Entropy of the Event)

                | Result | Weight | Description |
                | :---: | :--- | :--- |
                | **18–20** | Catastrophic | A high-entropy event forcing a massive shift in reality. |
                | **10–17** | Significant | A major hazard, turning point, or dangerous obstacle. |
                | **2–9** | Moderate | A standard complication or minor opportunity. |
                | **1** | Beneficial | A rare "constructive" fixed point; a moment of great advantage. |

                #### 3. Closeness (The Temporal Anchor)

                | Result | Closeness | Description |
                | :---: | :--- | :--- |
                | **17–20** | Personal | The event involves the psion directly. |
                | **11–16** | Intimate | Involves a crewmate or loved one. |
                | **6–10** | Connected | Involves a known acquaintance, rival, or ally. |
                | **1–5** | Disconnected | Unrelated to the psion (a background world hook). |

                ### Causal Navigation

                The player may make an ESP-precognition skill check to sensitize themselves to the reverse flow of causality. A success grants one Last Resort Point (LRP). This LRP represents a déjà vu that allows the psion to adjust actions to navigate the immediate causal path.

                ### Check Results
                - **Ordinary:** The LRP can only be used defensively, worsening an enemy attack against the psion or improving an active defense like a dodge or hit-the-deck check.
                - **Good:** The LRP can also be used to improve any action made by the psion.
                - **Amazing:** The LRP also applies to any check in the scene as long as the psion can intervene.

                ### Overuse

                Once the LRP is used, the character can exert to reactivate the power, but doing so carries its own risks. Forcing another activation in the same session requires a [[resolve—mental resolve]] check with a +3 step penalty. Failure results in the loss of all remaining psionic energy, while a critical failure renders the psion unconscious for as many hours as their Will score.

                ### Rank Benefits

                ▶ **Rank 3 [Tactical Horizon]:** The Overuse penalty is reduced to +2 steps.

                ▶ **Rank 6 [Operational Horizon]:** The Overuse penalty is reduced to +1 step. Precognition skill checks receive a -1 step bonus.

                ▶ **Rank 9 [Strategic Horizon]:** There is no penalty for Overuse.

                ▶ **Rank 12 [Causal Horizon]:** The GM provides precise timing for the event described in the session flash (ranging from minutes for imminent events to a specific day for events months away).
          - es:
              name: Precognición
              description: |-
                > [!NOTA]
                > **Requiere Ventaja:** Precog.

                ### El flash de la sesión

                Al comienzo de cada sesión, el Director de Juego realiza tres tiradas secretas para determinar la naturaleza del "Punto Fijo" que el psion detectará durante la sesión. Normalmente, el psion necesita estar en un estado mental tranquilo para recibir una visión, mientras que algunos sólo pueden recibirla en sueños. Por ese motivo, es posible que en algunas sesiones el psion no reciba visión. Las visiones del psion suelen ser confusas y pueden no tener sentido cuando ocurren; en cambio, experimentan una sensación persistente de déjà vu o temor intuitivo a medida que los acontecimientos se desarrollan hacia el Punto.

                #### 1. Alcance (La amplitud de la onda expansiva)

                | Resultado | Alcance | Descripción |
                | :---: | :--- | :--- |
                | **20** | Sistémico | Afectando a toda una estación, ciudad o población. |
                | **15–19** | Social | Involucrar a un grupo de conocidos o figuras públicas. |
                | **10–14** | Localizado | Afectar a alguien cercano al psion o a un pequeño grupo específico. |
                | **1–9** | Aislado | Un solo punto de Interacción. |

                #### 2. Peso (La entropía del evento)

                | Resultado | Peso | Descripción |
                | :---: | :--- | :--- |
                | **18–20** | Catastrófico | Un evento de alta entropía que obliga a un cambio masivo en la realidad. |
                | **10–17** | Significativo | Un peligro importante, un punto de inflexión u obstáculo peligroso. |
                | **2–9** | Moderado | Una complicación estándar u oportunidad menor. |
                | **1** | Beneficioso | Un punto fijo "constructivo" Raro; un momento de gran ventaja. |

                #### 3. Cercanía (El Ancla Temporal)

                | Resultado | Cercanía | Descripción |
                | :---: | :--- | :--- |
                | **17–20** | Personales | El evento involucra directamente a la psion. |
                | **11–16** | Íntimo | Involucra a un compañero de tripulación o un ser querido. |
                | **6–10** | Conectado | Involucra a un conocido, rival o aliado conocido. |
                | **1–5** | Desconectado | No relacionado con el psion (un gancho mundial de fondo). |

                ### Causal Navegación

                El jugador puede realizar una prueba de habilidad de precognición ESP para sensibilizarse al flujo inverso de causalidad. Un éxito otorga un punto Último Recurso (LRP). Este LRP representa un déjà vu que permite al psion ajustar sus acciones para navegar por el camino causal inmediato.

                ### Verificar resultados
                - **Ordinario:** El LRP solo se puede usar de forma defensiva, empeorando un ataque enemigo contra el psion o mejorando una defensa activa como un Esquivar o un control de ataque.
                - **Bueno:** El LRP también se puede utilizar para mejorar cualquier acción realizada por el psion.
                - **Asombroso:** El LRP también se aplica a cualquier check en la escena siempre y cuando el psion pueda intervenir.

                ### Uso excesivo

                Una vez que se utiliza el LRP, el Personaje puede esforzarse para reactivar la energía, pero hacerlo conlleva sus propios riesgos. Forzar otra activación en la misma sesión requiere una verificación de [[Firmeza—Mental Firmeza]] con un +3 Penalización de paso. El fallo resulta en la pérdida de toda la energía psiónica restante, mientras que un Fallo Crítico deja al psion inconsciente durante tantas horas como su puntuación de Voluntad.

                ### Beneficios de Rango

                ▶ **Rango 3 (Horizonte Táctico):** La penalización por uso excesivo se reduce a +2 pasos.

                ▶ **Rango 6 (Horizonte operativo):** La penalización por uso excesivo se reduce a +1 paso. Las pruebas de habilidades de precognición reciben un -1 Bonificación de paso.

                ▶ **Rango 9 (Horizonte estratégico):** No hay penalización por uso excesivo.

                ▶ **Rango 12 (Horizonte Causal):** El GM proporciona tiempos precisos para el evento descrito en el flash de la sesión (que van desde minutos para eventos inminentes hasta un día específico para eventos que faltan meses).
      psychometry:
        attribute: INT
        cost: 3
        url: /psionics/esp/#psychometry
        trained_only: false
        rank_benefits:
          - rank: 1
            title: Treasured
          - rank: 4
            title: Regular Use
          - rank: 8
            title: Frequent Use
          - rank: 12
            title: Minimal Use
        extended_duration: false
        localized:
          - en:
              name: Psychometry
              description: |-
                This skill gives its user the ability to read psychic impressions from inanimate objects. The character must touch the object to gain insight into who has used it and in what context. What a character senses depends on the result of a skill check:

                ### Check Results
                - **Ordinary:** The character receives simple emotions associated with the object.
                - **Good:** He or she receives simple images associated with the object.
                - **Amazing:** The character experiences a brief encounter as though he or she is the person using the object or its owner.

                To be affected by this skill, an object must be an item that the character can hold and manipulate to pick up psionic impressions. Tools, weapons, clothing, jewelry, books, other personal items, and even dead bodies can be studied using psychometry. Living people and creatures can't be studied with this skill.

                Dirt, the ground, dust, or other casually encountered objects aren't affected because people don't make the sorts of connections with these objects that result in psionic residue being left behind (though postcognition picks up impressions left in an area).

                The Gamemaster can automatically activate this skill (no psionic energy point cost) to provide a clue or otherwise direct a story.

                ### Rank Benefits

                ▶ **Rank 1 [Treasured]** At rank 1 in this skill, the item in question must be something special to the owner (an item he or she treasured, such as a wedding ring).

                ▶ **Rank 4 [Regular Use]** At rank 4, the item can be merely something the owner used regularly (such as a watch, or spectacles).

                ▶ **Rank 8 [Frequent Use]** At rank 8, the item can be something the owner merely used frequently (such as a pen, or keys).

                ▶ **Rank 12 [Minimal Use]** At rank 12, the item can be nearly anything belonging to the owner, as long as he or she used it for at least an hour in total (such as a weapon, or a book).
          - es:
              name: Psicometría
              description: |-
                Esta habilidad le da a su usuario la capacidad de leer impresiones psíquicas de objetos inanimados. El Personaje debe tocar el objeto para saber quién lo ha utilizado y en qué contexto. Lo que detecta un Personaje depende del resultado de una prueba de habilidad:

                ### Verificar resultados
                - **Ordinario:** El Personaje recibe emociones simples asociadas con el objeto.
                - **Bueno:** Recibe imágenes simples asociadas al objeto.
                - **Asombroso:** El Personaje experimenta un breve encuentro como si fuera la persona que utiliza el objeto o su dueño.

                Para verse afectado por esta habilidad, un objeto debe ser un elemento que el Personaje pueda sostener y manipular para captar impresiones psiónicas. Se pueden estudiar herramientas, armas, ropa, joyas, libros, objetos personales e incluso cadáveres mediante la psicometría. Las personas y criaturas vivas no se pueden estudiar con esta habilidad.

                La suciedad, el suelo, el polvo o los objetos encontrados casualmente no se ven afectados porque las personas no hacen el tipo de conexiones con estos objetos que resultan en residuos psiónicos que quedan (aunque la poscognición recoge las impresiones dejadas en un área).

                El Director de Juego puede activar automáticamente esta habilidad (sin costo de puntos de energía psiónica) para proporcionar una pista o dirigir una historia.

                ### Beneficios de Rango

                ▶ **Rango 1 [Atesorado]** En Rango 1 en esta habilidad, el objeto en cuestión debe ser algo especial para el propietario (un objeto que atesora, como un anillo de bodas).

                ▶ **Rango 4 [Uso regular]** En Rango 4, el artículo puede ser simplemente algo que el propietario usó regularmente (como un reloj o gafas).

                ▶ **Rango 8 [Uso frecuente]** En Rango 8, el artículo puede ser algo que el propietario simplemente usó con frecuencia (como un bolígrafo o llaves).

                ▶ **Rango 12 [Uso mínimo]** En Rango 12, el artículo puede ser casi cualquier cosa que pertenezca al propietario, siempre y cuando lo haya usado durante al menos una hora en total (como un arma o un libro).
      clairsentience:
        attribute: INT
        cost: 2
        url: /psionics/esp/#clairsentience
        trained_only: false
        localized:
          - en:
              name: Clairsentience
              description: |-
                To employ this skill, a character selects a location and projects his or her mind to that spot, seeing or hearing everything going on around that spot as though physically there. The spot can be a absolute coordinate, but is more commonly used to relative one, inside a house, a meter over a vehicle, or even a person. This last case would need an additional -1 penalty to the skill check, and is resisted by the target's [[Will defense modifier]].

                Clairsentience doesn't block normal vision or hearing, so the user sees double images unless his or her eyes are closed and hears overlapping ambient sounds. It also provides no help in seeing through obscuring elements (such as walls, closed doors, or darkness) or interpreting unfamiliar languages, and the mental sensor can't move from the selected spot. The location itself can be moving (a vehicle, for example), but such a target requires additional skill checks if the range to the target increases.

                The user remains conscious within his or her body and is aware of what's happening around it.

                ### Check results
                - **Ordinary:** the sensor field of view is fixed, while the user can hear all around he can only see in a direction. He can easily pick de direction if the target is in a predictable position(let say inside a room in a nearby building). but doing so in a ship in space would be a lot harder as he could easily end up looking at the ceiling.
                - **Good:** While the sensor cannot move, the user can change the direction it is pointing at. As the sensor is a single point in space judging size and distances can be deceiving.
                - **Amazing:** In addition to the good effect, the user have good stereo-scopic vision allowing him to easily judge distances and sizes.

                Situation modifiers for the familiarity of the location and the distance at which clairsentience is being used are as follows:

                | Situation/distance | Modifier |
                | :--- | :---: |-
                | Familiar location | –1 |
                | Unfamiliar location | none |
                | 1–10 meters | –1 |
                | 11–100 meters | none |
                | 101 m–1 km | +1 |
                | 2–10 km | +2 |
                | 11–100 km | +3 |
                | 101–1,000 km (low orbit) | +4 |
                | 1,001–10,000 km (high orbit) | +5 |

                ### Rank Benefits

                ▶ **Rank 4 [Combined Senses]** The psionic sensor can see and hear at the same time.

                ▶ **Rank 6 [Change of Perspective]** The character can attempt another ESP-clairsentience skill check to shift the location to which the mental projection has been projected. The new check is modified by the distance from the current location that the psion is viewing and listening to, rather than the physical distance the psion is from the target area.

                ▶ **Rank 8 [Sensitivity]** The sensor can now also perceive psionic impressions.

                ▶ **Rank 12 [Power Projection]** The psion can perform [[ESP-postcognition]], [[ESP-empathy]] or [[ESP-psychometry]] at the location of the sensor. But doing so incurs an additional -2 penalty on the skill check.
          - es:
              name: 'Clarisensibilidad'
              description: |-
                Para emplear esta habilidad, un Personaje selecciona una ubicación y proyecta su mente en ese lugar, viendo o escuchando todo lo que sucede a su alrededor como si estuviera físicamente allí. El punto puede ser una coordenada absoluta, pero se usa más comúnmente para una relativa, dentro de una casa, un metro por encima de un vehículo o incluso una persona. Este último caso necesitaría una penalización adicional de -1 a la prueba de habilidad, y es resistido por el [[modificador de defensa de voluntad]] del objetivo.

                La clarisentiencia no bloquea la visión o la audición normales, por lo que el usuario ve imágenes dobles a menos que tenga los ojos cerrados y escuche sonidos ambientales superpuestos. Tampoco proporciona ayuda para ver a través de elementos que oscurecen (como paredes, puertas cerradas u oscuridad) o para interpretar idiomas desconocidos, y el sensor Mental no puede moverse del lugar seleccionado. La ubicación en sí puede estar en movimiento (un vehículo, por ejemplo), pero dicho objetivo requiere pruebas de habilidad adicionales si el alcance hasta el objetivo aumenta.

                El usuario permanece consciente dentro de su cuerpo y es consciente de lo que sucede a su alrededor.

                ### Verificar resultados
                - **Ordinario:** el campo de visión del sensor es fijo, mientras que el usuario puede escuchar todo a su alrededor y solo puede ver en una dirección. Puede elegir fácilmente la dirección si el objetivo está en una posición predecible (digamos dentro de una habitación en un edificio cercano). pero hacerlo en una nave en el espacio sería mucho más difícil ya que fácilmente podría terminar mirando al techo.
                - **Bueno:** Mientras el sensor no se pueda mover, el usuario puede cambiar la dirección a la que apunta. Como el sensor es un único punto en el espacio, juzgar el tamaño y las distancias puede ser engañoso.
                - **Asombroso:** Además del efecto Bueno, el usuario tiene visión estereoscópica Bueno que le permite juzgar fácilmente distancias y tamaños.

                Los modificadores de situación por la familiaridad con la ubicación y la distancia a la que se utiliza la clarisentiencia son los siguientes:

                | Situación/distancia | Modificador |
                | :--- | :---: |-
                | Ubicación familiar | –1 |
                | Ubicación desconocida | ninguno |
                | 1–10 metros | –1 |
                | 11–100 metros | ninguno |
                | 101 m–1 km | +1 |
                | 2–10 kilómetros | +2 |
                | 11-100 kilómetros | +3 |
                | 101-1.000 km (órbita baja) | +4 |
                | 1.001-10.000 km (órbita alta) | +5 |

                ### Beneficios de Rango

                ▶ **Rango 4 [Sentidos combinados]** El sensor psiónico puede ver y oír al mismo tiempo.

                ▶ **Rango 6 [Cambio de perspectiva]** El Personaje puede intentar otra prueba de habilidad de clarisentiencia ESP para cambiar la ubicación a la que se ha proyectado la proyección Mental. La nueva verificación se modifica por la distancia desde la ubicación actual que el psion está viendo y escuchando, en lugar de la distancia Físico entre el psion y el área objetivo.

                ▶ **Rango 8 [Sensibilidad]** El sensor ahora también puede percibir impresiones psiónicas.

                ▶ **Rango 12 [Proyección de energía]** El psion puede realizar [[ESP-postcognición]], [[ESP-empatía]] o [[ESP-psicometría]] en la ubicación del sensor. Pero hacerlo conlleva una penalización adicional de -2 en la prueba de habilidad.
        rank_benefits:
          - rank: 4
            title: Increased Duration
          - rank: 6
            title: Change of Perspective
          - rank: 8
            title: Increased Duration
          - rank: 12
            title: Increased Duration
        extended_duration: true
    trained_only: true
  Psychoportation:
    attribute: WIL
    url: /psionics/psychoportation/
    cost: 7
    localized:
      - en:
          name: Psychoportation
          description: |-
            Psychoportation is the psionic specialty of moving material from one location
            to another. Many psychoportation skills allow a psion to move himself or
            herself, and at higher ranks, some of these skills allow the character to move
            others as well.
      - es:
          name: Psicoportación
          description: |-
            La psicoportación es la especialidad psiónica de mover materia de un lugar a
            otro. Muchas habilidades de psicoportación permiten a un psiónico desplazarse
            a sí mismo y, en rangos superiores, algunas de estas habilidades permiten al
            personaje mover también a otros. Esta habilidad básica no puede usarse sin
            entrenamiento.
    items:
      alter-speed:
        attribute: WIL
        cost: 4
        url: /psionics/psychoportation/#alter-speed
        trained_only: true
        rank_benefits:
          - rank: 6
            title: Action Points
          - rank: 12
            title: Instant Stop/Start
        extended_duration: true
        localized:
          - en:
              name: Alter Speed
              description: |-
                By concentrating, the character can accelerate or decelerate himself or
                herself or another living target within 8 meters. The psion must decide
                whether he or she is accelerating or decelerating before making the skill
                check. The effect on the target's action check score depends on the success:
                - **Ordinary:** +1 or -1 to the action check score.
                - **Good:** +2 or -2 to the action check score.
                - **Amazing:** +3 or -3 to the action check score. The ability lasts for one round, but the duration can be extended by spending 1 psionic energy point for each additional round.
                **Rank Benefits:**
                - **At rank 6 [Action Points]:** the target gains or loses one action per round (to a maximum of 4 actions) while the effect lasts.
                - **At rank 12 [Instant Stop/Start]:** the target gains or loses another action (to a maximum of 4, minimum of 0).
          - es:
              name: Alterar Velocidad
              description: |-
                Al concentrarse, el personaje puede acelerar o desacelerar a sí mismo o a otro
                objetivo vivo dentro de un radio de 8 metros. El psiónico debe decidir si está
                acelerando o desacelerando antes de realizar la tirada de habilidad. El efecto
                sobre la puntuación de la tirada de acción del objetivo depende del éxito:
                - **Ordinario:** +1 o -1 a la puntuación de la tirada de acción.
                - **Bueno:** +2 o -2 a la puntuación de la tirada de acción.
                - **Asombroso:** +3 o -3 a la puntuación de la tirada de acción. La capacidad dura un asalto, pero la duración puede extenderse gastando 1 punto de energía psiónica por cada asalto adicional.
                **Beneficios de Rango:**
                - **Al rango 6 [Puntos de Acción]:** el objetivo gana o pierde una acción por asalto (hasta un máximo de 4 acciones) mientras dure el efecto.
                - **Al rango 12 [Parar/Arrancar Instantáneo]:** el objetivo gana o pierde otra acción (hasta un máximo de 4, mínimo de 0).
      apportation:
        attribute: WIL
        cost: 6
        url: /psionics/psychoportation/#apportation
        trained_only: true
        rank_benefits:
          - rank: 3
            title: Living Matter
          - rank: 4
            title: Increased weight
          - rank: 6
            title: Precise Apportation
          - rank: 8
            title: Increased weight
          - rank: 9
            title: Large Apports
          - rank: 12
            title: Increased weight
          - rank: 12
            title: Distant Apports
        extended_duration: false
        localized:
          - en:
              name: Apportation
              description: |-
                This ability allows a character to summon an inanimate object from a distant
                location or to banish an object to another location. The psion must have seen
                the object he or she is attempting to apport. The weight of the object that
                can be apported depends on the skill rank and the success:
                - **Ordinary:** 1 kilogram per rank.
                - **Good:** 2 kilograms per rank.
                - **Amazing:** 5 kilograms per rank. The object appears or disappears instantaneously.
                **Rank Benefits:**
                - **At rank 3 [Living Matter]:** the psion can apport living matter.
                - **At rank 4 [Increased weight]:** the weight limit increases: Ordinary, 2kg/rank; Good, 5kg/rank; Amazing, 10kg/rank.
                - **At rank 6 [Precise Apportation]:** the psion can apport an object exactly to a specific location with no drift.
                - **At rank 8 [Increased weight]:** the weight limit increases: Ordinary, 5kg/rank; Good, 10kg/rank; Amazing, 20kg/rank.
                - **At rank 9 [Large Apports]:** the psion can apport objects that are up to 1 cubic meter in volume.
                - **At rank 12 [Increased weight]:** the weight limit increases: Ordinary, 10kg/rank; Good, 20kg/rank; Amazing, 40kg/rank.
                - **At rank 12 [Distant Apports]:** the psion can apport objects from locations he or she has never seen, as long as he or she has a clear description.
          - es:
              name: Aportación
              description: |-
                Esta capacidad permite a un personaje invocar un objeto inanimado desde una
                ubicación distante o desterrar un objeto a otra ubicación. El psiónico debe
                haber visto el objeto que intenta aportar. El peso del objeto que se puede
                aportar depende del rango de habilidad y del éxito:
                - **Ordinario:** 1 kilogramo por rango.
                - **Bueno:** 2 kilogramos por rango.
                - **Asombroso:** 5 kilogramos por rango. El objeto aparece o desaparece instantáneamente.
                **Beneficios de Rango:**
                - **Al rango 3 [Materia Viva]:** el psiónico puede aportar materia viva.
                - **Al rango 4 [Peso Incrementado]:** el límite de peso aumenta: Ordinario, 2kg/rango; Bueno, 5kg/rango; Asombroso, 10kg/rango.
                - **Al rango 6 [Aportación Precisa]:** el psiónico puede aportar un objeto exactamente a una ubicación específica sin desviación.
                - **Al rango 8 [Peso Incrementado]:** el límite de peso aumenta: Ordinario, 5kg/rango; Bueno, 10kg/rango; Asombroso, 20kg/rango.
                - **Al rango 9 [Aportaciones Grandes]:** el psiónico puede aportar objetos de hasta 1 metro cúbico de volumen.
                - **Al rango 12 [Peso Incrementado]:** el límite de peso aumenta: Ordinario, 10kg/rango; Bueno, 20kg/rango; Asombroso, 40kg/rango.
                - **Al rango 12 [Aportaciones Distantes]:** el psiónico puede aportar objetos de lugares que nunca ha visto, siempre que tenga una descripción clara.
      duplicate:
        attribute: WIL
        cost: 6
        url: /psionics/psychoportation/#duplicate
        trained_only: true
        rank_benefits:
          - rank: 4
            title: Duration
          - rank: 8
            title: Independent Action
          - rank: 12
            title: Multiple Duplicates
        extended_duration: false
        localized:
          - en:
              name: Duplicate
              description: |-
                This ability allows a character to summon a duplicate of himself or herself
                from another location in the multiverse. The duplicate is identical in every
                way and possesses the same skills and attributes as the psion. The duration
                that the duplicate persists depends on the success:
                - **Ordinary:** 1 round.
                - **Good:** 2 rounds.
                - **Amazing:** 5 rounds.
                **Rank Benefits:**
                - **At rank 4 [Duration]:** the duration of the duplicate's existence increases by 2 rounds.
                - **At rank 8 [Independent Action]:** the duplicate can act independently of the psion, although they still share the same psionic energy pool.
                - **At rank 12 [Multiple Duplicates]:** the psion can summon up to three duplicates at once.
          - es:
              name: Duplicado
              description: |-
                Esta capacidad permite a un personaje convocar un duplicado de sí mismo desde
                otra ubicación del multiverso. El duplicado es idéntico en todos los sentidos
                y posee las mismas habilidades y atributos que el psiónico. La duración que
                persiste el duplicado depende del éxito:
                - **Ordinario:** 1 asalto.
                - **Bueno:** 2 asaltos.
                - **Asombroso:** 5 asaltos.
                **Beneficios de Rango:**
                - **Al rango 4 [Duración]:** la duración de la existencia del duplicado aumenta en 2 asaltos.
                - **Al rango 8 [Acción Independiente]:** el duplicado puede actuar independientemente del psiónico, aunque siguen compartiendo la misma reserva de energía psiónica.
                - **Al rango 12 [Duplicados Múltiples]:** el psiónico puede convocar hasta tres duplicados a la vez.
      teleportation:
        attribute: WIL
        cost: 5
        url: /psionics/psychoportation/#teleportation
        trained_only: true
        rank_benefits:
          - rank: 4
            title: Increased Distance
          - rank: 8
            title: Increased Distance
          - rank: 12
            title: Increased Distance
        extended_duration: false
        localized:
          - en:
              name: Teleportation
              description: |-
                Teleportation allows a psion to instantaneously move from his or her current
                location to another. The psion can also teleport objects or other characters.
                The range and weight limit depend on the skill rank and the success:
                - **Range:** 10/100/1000 meters.
                - **Weight:** 10 kilograms per rank (Ordinary success), 20 kilograms per rank (Good success), or 40 kilograms per rank (Amazing success).
                **Rank Benefits:**
                - **At rank 4 [Increased Distance]:** the range increases: 1km/10km/100km.
                - **At rank 8 [Increased Distance]:** the range increases: 100km/1000km/World.
                - **At rank 12 [Increased Distance]:** the range increases: World/Galaxy/Universe.
          - es:
              name: Teletransportación
              description: |-
                La teletransportación permite a un psiónico moverse instantáneamente desde su
                ubicación actual a otra. El psiónico también puede teletransportar objetos u
                otros personajes. El rango y el límite de peso dependen del rango de habilidad
                y del éxito:
                - **Rango:** 10/100/1000 metros.
                - **Peso:** 10 kilogramos por rango (éxito Ordinario), 20 kilogramos por rango (éxito Bueno) o 40 kilogramos por rango (éxito Asombroso).
                **Beneficios de Rango:**
                - **Al rango 4 [Distancia Incrementada]:** el rango aumenta: 1km/10km/100km.
                - **Al rango 8 [Distancia Incrementada]:** el rango aumenta: 100km/1000km/Mundo.
                - **Al rango 12 [Distancia Incrementada]:** el rango aumenta: Mundo/Galaxia/Universo.
      timeslip:
        attribute: WIL
        cost: 6
        url: /psionics/psychoportation/#timeslip
        trained_only: true
        rank_benefits:
          - rank: 4
            title: Amazing success
          - rank: 8
            title: Amazing success
          - rank: 12
            title: Amazing success
        extended_duration: false
        localized:
          - en:
              name: Timeslip
              description: |-
                This ability allows a psion to move himself or herself forward in time. To
                everyone else, the psion appears to vanish instantaneously and then reappear
                later. The duration of the jump depends on the success:
                - **Ordinary:** 1 phase.
                - **Good:** 1 round.
                - **Amazing:** 2 rounds.
                **Rank Benefits:**
                - **At rank 4 [Amazing success]:** the jump increases to 1 minute.
                - **At rank 8 [Amazing success]:** the jump increases to 1 hour.
                - **At rank 12 [Amazing success]:** the jump increases to 1 day.
          - es:
              name: Salto Temporal
              description: |-
                Esta capacidad permite a un psiónico desplazarse a sí mismo hacia adelante en
                el tiempo. Para todos los demás, el psiónico parece desaparecer
                instantáneamente y reaparecer más tarde. La duración del salto depende del
                éxito:
                - **Ordinario:** 1 fase.
                - **Bueno:** 1 asalto.
                - **Asombroso:** 2 asaltos.
                **Beneficios de Rango:**
                - **Al rango 4 [éxito Asombroso]:** el salto aumenta a 1 minuto.
                - **Al rango 8 [éxito Asombroso]:** el salto aumenta a 1 hora.
                - **Al rango 12 [éxito Asombroso]:** el salto aumenta a 1 día.
      dimension-walk:
        attribute: WIL
        cost: 6
        trained_only: true
        url: /psionics/psychoportation/#dimension-walk
        localized:
          - en:
              name: Dimension Walk
              description: Jump between parallel dimensions or tangent timelines.
          - es:
              name: Caminar entre Dimensiones
              description: Salto entre dimensiones paralelas o líneas temporales tangentes.
    trained_only: true
  Telekinesis:
    attribute: WIL
    url: /psionics/telekinesis/
    cost: 5
    localized:
      - en:
          name: Telekinesis
          description: |-
            This skill allows a psion to manipulate the physical environment with only the
            power of the mind. With just the broad skill, a character can attempt to use
            any of the related specialty skills except those that can't be used untrained.
      - es:
          name: Telequinesis
          description: |-
            Esta habilidad permite a un psiónico manipular el entorno físico únicamente
            con el poder de la mente. Con solo la habilidad de base, un personaje puede
            intentar usar cualquiera de las habilidades de especialidad relacionadas,
            excepto aquellas que no pueden usarse sin entrenamiento.
    items:
      cryokinetics:
        attribute: WIL
        cost: 3
        url: /psionics/telekinesis/#cryokinetics
        trained_only: true
        rank_benefits:
          - rank: 5
            title: Increased Damage
          - rank: 6
            title: Encasement
          - rank: 9
            title: Increased Damage
          - rank: 9
            title: Cryogenic Suspension
        extended_duration: false
        localized:
          - en:
              name: Cryokinetics
              description: |-
                By concentrating, the character can generate fields of intense cold, freezing
                most liquids and damaging living tissue. The effective range is 24 meters
                (range 6/12/24), and the cold affects all materials within a 2 meter diameter.
                The energy damage inflicted to living beings by this power depends on the
                result of the skill check. When a character first acquires this skill, he or
                she is able to cause damage of d4s/d4+2s/d4w.
                **Rank Benefits:**
                - **At rank 5 [Increased Damage]:** the damage becomes d4+2s/d6+2s/d4+2w.
                - **At rank 6 [Encasement]:** the character is able to generate cold so quickly that objects or creatures in a moist or wet environment become unable to move. The character’s skill check has a -2 step bonus if the target is completely wet (immersed in water, for example). The skill check determines the difficulty of the Strength feat required to break free.
                - **At rank 9 [Increased Damage]:** the damage increases to d6+2s/d4+2w/d6+2w.
                - **At rank 9 [Cryogenic Suspension]:** the character can freeze living beings so quickly and completely that they effectively enter a temporary state of suspended animation. The target is allowed its Dexterity resistance modifier to avoid being targeted by this ability.
          - es:
              name: Crioquinesis
              description: |-
                Al concentrarse, el personaje puede generar campos de frío intenso, congelando
                la mayoría de los líquidos y dañando el tejido vivo. El rango efectivo es de
                24 metros (rango 6/12/24), y el frío afecta a todos los materiales dentro de
                un diámetro de 2 metros. El daño de energía infligido a los seres vivos por
                este poder depende del resultado de la tirada de habilidad. Cuando un
                personaje adquiere por primera vez esta habilidad, es capaz de causar un daño
                de d4s/d4+2s/d4w.
                **Beneficios de Rango:**
                - **Al rango 5 [Daño Incrementado]:** el daño pasa a ser d4+2s/d6+2s/d4+2w.
                - **Al rango 6 [Encapsulamiento]:** el personaje es capaz de generar frío tan rápidamente que los objetos o criaturas en un ambiente húmedo o mojado se vuelven incapaces de moverse. La tirada de habilidad del personaje tiene un bonificador de -2 pasos si el objetivo está completamente mojado (sumergido en agua, por ejemplo). La tirada de habilidad determina la dificultad de la proeza de Fuerza requerida para liberarse.
                - **Al rango 9 [Daño Incrementado]:** el daño aumenta a d6+2s/d4+2w/d6+2w.
                - **Al rango 9 [Suspensión Criogénica]:** el personaje puede congelar a los seres vivos tan rápida y completamente que entran efectivamente en un estado temporal de animación suspendida. El objetivo puede usar su modificador de resistencia de Destreza para evitar ser el blanco de esta capacidad.
      electrokinetics:
        attribute: WIL
        cost: 3
        url: /psionics/telekinesis/#electrokinetics
        trained_only: true
        rank_benefits:
          - rank: 3
            title: Datawipe
          - rank: 5
            title: Increased Damage
          - rank: 6
            title: Tamper
          - rank: 9
            title: Increased Damage
          - rank: 9
            title: Bypass
          - rank: 12
            title: Jamming
        extended_duration: false
        localized:
          - en:
              name: Electrokinetics
              description: |-
                By concentrating, the character can build and direct an electrical charge to a
                target within range of 16 meters (range 4/8/16). The charge persists into the
                round following its application, allowing the psion to discharge the energy at
                any point during those two rounds. The energy damage inflicted to living
                beings depends on the success of the skill check. When the skill is first
                acquired, it causes d4+2s/d6+2s/d4w damage.
                **Rank Benefits:**
                - **At rank 3 [Datawipe]:** the character can bulk-erase computer media. Unless the psion is touching the media, there is a penalty to the skill check based on the distance: within 1 meter, +1 step; within 2 meters, +2 steps; within 3 meters, +3 steps.
                - **At rank 5 [Increased Damage]:** the damage increases to d6+2s/d4w/d4+2w.
                - **At rank 6 [Tamper]:** the character can use the skill to fool electronic sensors and cameras within his or her line of sight.
                - **At rank 9 [Increased Damage]:** the damage increases to d4+2w/d6+2w/d8+2w.
                - **At rank 9 [Bypass]:** the character can bypass electronic locks by overloading or rerouting their circuitry.
                - **At rank 12 [Jamming]:** the character can jam radio or sensor signals within a 20 meter radius. This radius can be extended by 20 meters for each additional psionic energy point spent.
          - es:
              name: Electroquinesis
              description: |-
                Al concentrarse, el personaje puede generar y dirigir una descarga eléctrica a
                un objetivo dentro de un rango de 16 metros (rango 4/8/16). La carga persiste
                en el asalto posterior a su aplicación, lo que permite al psiónico descargar
                la energía en cualquier momento durante esos dos asaltos. El daño de energía
                infligido a los seres vivos depende del éxito de la tirada de habilidad.
                Cuando se adquiere la habilidad por primera vez, causa un daño de
                d4+2s/d6+2s/d4w.
                **Beneficios de Rango:**
                - **Al rango 3 [Borrado de Datos]:** el personaje puede borrar masivamente soportes informáticos. A menos que el psiónico esté tocando el soporte, hay un penalizador a la tirada de habilidad basado en la distancia: a menos de 1 metro, +1 paso; a menos de 2 metros, +2 pasos; a menos de 3 metros, +3 pasos.
                - **Al rango 5 [Daño Incrementado]:** el daño aumenta a d6+2s/d4w/d4+2w.
                - **Al rango 6 [Sabotaje]:** el personaje puede usar la habilidad para engañar a sensores electrónicos y cámaras dentro de su línea de visión.
                - **Al rango 9 [Daño Incrementado]:** el daño aumenta a d4+2w/d6+2w/d8+2w.
                - **Al rango 9 [Bypass]:** el personaje puede anular cerraduras electrónicas sobrecargando o redirigiendo su circuitería.
                - **Al rango 12 [Interferencia]:** el personaje puede interferir señales de radio o sensores en un radio de 20 metros. Este radio puede extenderse 20 metros por cada punto de energía psiónica adicional gastado.
      kinetic-blow:
        attribute: WIL
        cost: 3
        url: /psionics/telekinesis/#kinetic-blow
        trained_only: true
        rank_benefits:
          - rank: 4
            title: Increased Damage
          - rank: 8
            title: Knockdown
          - rank: 12
            title: Increased Damage
        extended_duration: false
        localized:
          - en:
              name: Kinetic Blow
              description: |-
                This ability allows a psion to project a wave of kinetic energy at a target.
                The effective range is 16 meters (range 4/8/16). The impact of the energy wave
                can cause significant physical damage. When first acquired, Kinetic Blow
                inflicts d4s/d4+2s/d4w damage.
                **Rank Benefits:**
                - **At rank 4 [Increased Damage]:** the damage increases to d4+2s/d6+2s/d4+2w.
                - **At rank 8 [Knockdown]:** if the psion scores a Good or Amazing success, the target must make a Strength feat check or be knocked prone.
                - **At rank 12 [Increased Damage]:** the damage increases to d6+2s/d4+2w/d6+2w.
          - es:
              name: Golpe Cinético
              description: |-
                Esta capacidad permite a un psiónico proyectar una onda de energía cinética
                hacia un objetivo. El rango efectivo es de 16 metros (rango 4/8/16). El
                impacto de la onda de energía puede causar un daño físico significativo.
                Cuando se adquiere por primera vez, Golpe Cinético inflige un daño de
                d4s/d4+2s/d4w.
                **Beneficios de Rango:**
                - **Al rango 4 [Daño Incrementado]:** el daño aumenta a d4+2s/d6+2s/d4+2w.
                - **Al rango 8 [Derribo]:** si el psiónico logra un éxito Bueno o Asombroso, el objetivo debe realizar una tirada de proeza de Fuerza o quedará derribado.
                - **Al rango 12 [Daño Incrementado]:** el daño aumenta a d6+2s/d4+2w/d6+2w.
      kinetic-shield:
        attribute: WIL
        cost: 3
        url: /psionics/telekinesis/#kinetic-shield
        trained_only: true
        rank_benefits:
          - rank: 4
            title: Improved Protection
          - rank: 8
            title: Broad Shield
          - rank: 12
            title: Reflect Attacks
        extended_duration: true
        localized:
          - en:
              name: Kinetic Shield
              description: |-
                By concentrating, the character can create a field of kinetic energy that
                surrounds his or her body, protecting it from physical attacks. The shield
                reflects or absorbs kinetic energy from incoming attacks. The effectiveness of
                the shield depends on the success of the skill check:
                - **Ordinary:** the shield provides 1 point of protection against all physical attacks.
                - **Good:** the shield provides 2 points of protection against all physical attacks.
                - **Amazing:** the shield provides 3 points of protection against all physical attacks. The shield lasts for one round, but the duration can be extended by spending 1 psionic energy point for each additional round.
                **Rank Benefits:**
                - **At rank 4 [Improved Protection]:** the protection provided by the shield increases: Ordinary, 2 points; Good, 3 points; Amazing, 4 points.
                - **At rank 8 [Broad Shield]:** the psion can extend the shield to protect one additional character who is within 2 meters.
                - **At rank 12 [Reflect Attacks]:** the psion can use the shield to reflect incoming physical attacks back at the attacker. This requires an Amazing success on the skill check. The reflected attack deals the same amount of damage that would have been dealt to the psion.
          - es:
              name: Escudo Cinético
              description: |-
                Al concentrarse, el personaje puede crear un campo de energía cinética que
                rodea su cuerpo, protegiéndolo de ataques físicos. El escudo refleja o absorbe
                la energía cinética de los ataques entrantes. La efectividad del escudo
                depende del éxito de la tirada de habilidad:
                - **Ordinario:** el escudo proporciona 1 punto de protección contra todos los ataques físicos.
                - **Bueno:** el escudo proporciona 2 puntos de protección contra todos los ataques físicos.
                - **Asombroso:** el escudo proporciona 3 puntos de protección contra todos los ataques físicos. El escudo dura un asalto, pero la duración puede extenderse gastando 1 punto de energía psiónica por cada asalto adicional.
                **Beneficios de Rango:**
                - **Al rango 4 [Protección Mejorada]:** la protección proporcionada por el escudo aumenta: Ordinario, 2 puntos; Bueno, 3 puntos; Asombroso, 4 puntos.
                - **Al rango 8 [Escudo Amplio]:** el psiónico puede extender el escudo para proteger a un personaje adicional que esté a menos de 2 metros.
                - **Al rango 12 [Reflejar Ataques]:** el psiónico puede usar el escudo para reflejar los ataques físicos entrantes hacia el atacante. Esto requiere un éxito Asombroso en la tirada de habilidad. El ataque reflejado inflige la misma cantidad de daño que se le habría infligido al psiónico.
      levitation:
        attribute: WIL
        cost: 3
        url: /psionics/telekinesis/#levitation
        trained_only: false
        rank_benefits:
          - rank: 4
            title: Increased Speed
          - rank: 8
            title: Lift Object
          - rank: 12
            title: Flight
        extended_duration: true
        localized:
          - en:
              name: Levitation
              description: |-
                With this skill, a psion can mentally lift himself or herself off the ground
                and move through the air. The speed of movement depends on the result of the
                skill check:
                - **Ordinary:** the character can move at one-quarter his or her normal walk rate.
                - **Good:** the character can move at one-half his or her normal walk rate.
                - **Amazing:** the character can move at his or her full walk rate. The ability lasts for one minute, but the duration can be extended by spending 1 psionic energy point for each additional minute.
                **Rank Benefits:**
                - **At rank 4 [Increased Speed]:** the movement rate while levitating increases: Ordinary, one-half walk; Good, full walk; Amazing, full run.
                - **At rank 8 [Lift Object]:** the psion can use levitation to lift and move an object weighing up to 10 kilograms per rank.
                - **At rank 12 [Flight]:** the psion can move through the air as easily as if walking on the ground, with no penalties or loss of actions.
          - es:
              name: Levitación
              description: |-
                Con esta habilidad, un psiónico puede elevarse mentalmente del suelo y moverse
                por el aire. La velocidad de movimiento depende del resultado de la tirada de
                habilidad:
                - **Ordinario:** el personaje puede moverse a una cuarta parte de su ritmo normal de caminata.
                - **Bueno:** el personaje puede moverse a la mitad de su ritmo normal de caminata.
                - **Asombroso:** el personaje puede moverse a su ritmo normal de caminata. La capacidad dura un minuto, pero la duración puede extenderse gastando 1 punto de energía psiónica por cada minuto adicional.
                **Beneficios de Rango:**
                - **Al rango 4 [Velocidad Incrementada]:** el ritmo de movimiento mientras levita aumenta: Ordinario, media caminata; Bueno, caminata completa; Asombroso, carrera completa.
                - **Al rango 8 [Levantar Objeto]:** el psiónico puede usar la levitación para levantar y mover un objeto que pese hasta 10 kilogramos por rango.
                - **Al rango 12 [Vuelo]:** el psiónico puede moverse por el aire tan fácilmente como si caminara por el suelo, sin penalizaciones ni pérdida de acciones.
      photokinetics:
        attribute: WIL
        cost: 1
        url: /psionics/telekinesis/#photokinetics
        trained_only: false
        rank_benefits:
          - rank: 3
            title: Simple Illusion
          - rank: 6
            title: Flash
          - rank: 9
            title: Gargantuan Illusion
          - rank: 12
            title: Improved Illusion
        extended_duration: true
        localized:
          - en:
              name: Photokinetics
              description: |-
                With this skill, a character can excite or reduce the amount of light in a
                specific area. The area affected is a diameter of 2 meters (Ordinary success),
                4 meters (Good success), or 6 meters (Amazing success). The duration of the
                effect depends on the success of the skill check: Marginal success, 1 phase;
                Ordinary success, 1 round; Good success, 2 rounds; Amazing success, 1 minute.
                The duration can be extended by spending 1 psionic energy point for each
                additional duration unit.
                **Rank Benefits:**
                - **At rank 3 [Simple Illusion]:** the psion can create toy-sized visual illusions.
                - **At rank 4 []:** the unit of duration becomes 5 minutes.
                - **At rank 6 [Flash]:** the character can trigger a sudden flash of light that blinds anyone looking in that direction for d4 phases (Ordinary success), d4+1 phases (Good success), or d6+1 phases (Amazing success).
                - **At rank 8 []:** the unit of duration becomes 30 minutes.
                - **At rank 9 [Gargantuan Illusion]:** the psion can create an illusion anywhere within his or her line of sight, as long as it fits within a cube that is 2 meters per skill rank.
                - **At rank 12 []:** the unit of duration becomes 1 hour.
                - **At rank 12 [Improved Illusion]:** anyone attempting to recognize that the illusion is fake suffers a penalty to their Awareness—intuition skill checks: Ordinary success, +2 steps; Good success, +3 steps; Amazing success, +4 steps.
          - es:
              name: Fotoquinesis
              description: |-
                Con esta habilidad, un personaje puede excitar o reducir la cantidad de luz en
                un área específica. El área afectada tiene un diámetro de 2 metros (éxito
                Ordinario), 4 metros (éxito Bueno) o 6 metros (éxito Asombroso). La duración
                del efecto depende del éxito de la tirada de habilidad: éxito Marginal, 1
                fase; éxito Ordinario, 1 asalto; éxito Bueno, 2 asaltos; éxito Asombroso, 1
                minuto. La duración puede extenderse gastando 1 punto de energía psiónica por
                cada unidad de duración adicional.
                **Beneficios de Rango:**
                - **Al rango 3 [Ilusión Simple]:** el psiónico puede crear ilusiones visuales de tamaño pequeño.
                - **Al rango 4 [Duración Extendida]:** la unidad de duración pasa a ser de 5 minutos.
                - **Al rango 6 [Destello]:** el personaje puede activar un destello repentino de luz que ciega a cualquiera que mire en esa dirección durante d4 fases (éxito Ordinario), d4+1 fases (éxito Bueno) o d6+1 fases (éxito Asombroso).
                - **Al rango 8 [Duración Extendida]:** la unidad de duración pasa a ser de 30 minutos.
                - **Al rango 9 [Ilusión Gigantesca]:** el psiónico puede crear una ilusión en cualquier lugar dentro de su línea de visión, siempre que quepa en un cubo de 2 metros por rango de habilidad.
                - **Al rango 12 [Duración Extendida]:** la unidad de duración pasa a ser de 1 hora.
                - **Al rango 12 [Ilusión Mejorada]:** cualquiera que intente reconocer que la ilusión es falsa sufre un penalizador en sus tiradas de Intuición: éxito Ordinario, +2 pasos; éxito Bueno, +3 pasos; éxito Asombroso, +4 pasos.
      psychokinetics:
        attribute: WIL
        cost: 3
        url: /psionics/telekinesis/#psychokinetics
        trained_only: false
        rank_benefits:
          - rank: 4
            title: Movement Rate
          - rank: 5
            title: Increased Damage
          - rank: 8
            title: Movement Rate
          - rank: 9
            title: Increased Damage
          - rank: 12
            title: Fine Manipulation
        extended_duration: true
        localized:
          - en:
              name: Psychokinetics
              description: |-
                Psychokinetics is the ability to move objects. Before making the skill check,
                the psion must choose whether he or she is attempting to move an object or to
                attack with one. The amount of weight that can be moved depends on the skill
                rank and the success:
                - **Ordinary:** 10 kilograms per rank.
                - **Good:** 20 kilograms per rank.
                - **Amazing:** 40 kilograms per rank. The effective range is 10/20/50 meters. The ability lasts for one round, but the duration can be extended by spending 1 psionic energy point for each additional round. When used to attack, the damage inflicted depends on the success: Ordinary, d4s; Good, d4+2s; Amazing, d4w.
                **Rank Benefits:**
                - **At rank 4 [Movement Rate]:** the psion can move an object at his or her walk rate.
                - **At rank 5 [Increased Damage]:** the damage increases to d4w/d4+1w/d6w.
                - **At rank 8 [Movement Rate]:** the psion can move an object at his or her run rate.
                - **At rank 9 [Increased Damage]:** the damage increases to d4+1w/d6w/d4m.
                - **At rank 12 [Fine Manipulation]:** the psion can perform delicate tasks (e.g., tying a knot) with no penalties.
          - es:
              name: Psicocinesis
              description: |-
                La psicocinesis es la capacidad de mover objetos. Antes de realizar la tirada
                de habilidad, el psiónico debe elegir si está intentando mover un objeto o
                atacar con uno. La cantidad de peso que se puede mover depende del rango de
                habilidad y del éxito:
                - **Ordinario:** 10 kilogramos por rango.
                - **Bueno:** 20 kilogramos por rango.
                - **Asombroso:** 40 kilogramos por rango. El rango efectivo es de 10/20/50 metros. La capacidad dura un asalto, pero la duración puede extenderse gastando 1 punto de energía psiónica por cada asalto adicional. Cuando se usa para atacar, el daño infligido depende del éxito: Ordinario, d4s; Bueno, d4+2s; Asombroso, d4w.
                **Beneficios de Rango:**
                - **Al rango 4 [Ritmo de Movimiento]:** el psiónico puede mover un objeto a su ritmo de caminata.
                - **Al rango 5 [Daño Incrementado]:** el daño aumenta a d4w/d4+1w/d6w.
                - **Al rango 8 [Ritmo de Movimiento]:** el psiónico puede mover un objeto a su ritmo de carrera.
                - **Al rango 9 [Daño Incrementado]:** el daño aumenta a d4+1w/d6w/d4m.
                - **Al rango 12 [Manipulación Fina]:** el psiónico puede realizar tareas delicadas (por ejemplo, hacer un nudo) sin penalizaciones.
      pyrokinesis:
        attribute: WIL
        cost: 3
        url: /psionics/telekinesis/#pyrokinesis
        trained_only: true
        rank_benefits:
          - rank: 4
            title: Increased Damage
          - rank: 8
            title: Increased Damage
          - rank: 12
            title: Fireball
        extended_duration: false
        localized:
          - en:
              name: Pyrokinesis
              description: |-
                By concentrating, the character can excite the molecules of an object, causing
                it to burst into flame or inflicting damage on a living creature. The
                effective range is 24 meters (range 6/12/24). The energy damage inflicted on
                living tissue depends on the success of the skill check. When first acquired,
                Pyrokinetics inflicts d4s/d4+2s/d4w damage.
                **Rank Benefits:**
                - **At rank 4 [Increased Damage]:** the damage increases to d4+2s/d6+2s/d4+2w.
                - **At rank 8 [Increased Damage]:** the damage increases to d6+2s/d4+2w/d6+2w.
                - **At rank 12 [Fireball]:** the psion can cause an explosion of fire that affects all targets within a 4 meter diameter.
          - es:
              name: Piroquinesis
              description: |-
                Al concentrarse, el personaje puede excitar las moléculas de un objeto,
                haciendo que estalle en llamas o infligiendo daño a una criatura viva. El
                rango efectivo es de 24 metros (rango 6/12/24). El daño de energía infligido
                al tejido vivo depende del éxito de la tirada de habilidad. Cuando se adquiere
                por primera vez, Piroquinesis inflige un daño de d4s/d4+2s/d4w.
                **Beneficios de Rango:**
                - **Al rango 4 [Daño Incrementado]:** el daño aumenta a d4+2s/d6+2s/d4+2w.
                - **Al rango 8 [Daño Incrementado]:** el daño aumenta a d6+2s/d4+2w/d6+2w.
                - **Al rango 12 [Bola de Fuego]:** el psiónico puede provocar una explosión de fuego que afecta a todos los objetivos en un diámetro de 4 metros.
      sheyas-clutch:
        attribute: WIL
        cost: 5
        url: /psionics/telekinesis/#sheyas-clutch
        trained_only: true
        localized:
          - en:
              name: Sheya's Clutch
              description: |-
                Mentally crush the heart or internal organs of a living being (range 40
                meters). Bypasses all non-psionic armor. This is physically draining for the
                user, who also takes damage.

                **Rank Benefits:**
                - **At rank 5, 9 [Increased Damage]**, damage to the victim increases while the relative cost to the user decreases slightly.
          - es:
              name: Presa de Sheya
              description: |-
                Aplasta mentalmente el corazón u órganos internos de un ser vivo (rango 40
                metros). Ignora toda armadura no psiónica. Es agotador para el usuario, que
                también recibe daño.

                **Beneficios de Rango:**
                - **Al rango 5, 9 [Daño Incrementado]**, el daño a la víctima aumenta mientras el coste relativo para el usuario disminuye ligeramente.
        alien_only: true
        rank_benefits:
          - rank: 5
            title: Increased Damage
          - rank: 9
            title: Increased Damage
    trained_only: true
  Telepathy:
    attribute: PER
    url: /psionics/telepathy/
    cost: 5
    localized:
      - en:
          name: Telepathy
          description: |-
            This skill allows a character to open his or her mind to the thoughts of
            others or send thoughts into the minds of others. With just the broad skill, a
            character can attempt to use any of the related specialty skills except those
            that can't be used untrained. The difficulty of such an action is reflected in
            the increased psionic energy cost and the higher base situation die for using
            just the broad skill.
      - es:
          name: Telepatía
          description: |-
            Esta habilidad permite a un personaje abrir su mente a los pensamientos de los
            demás o enviar pensamientos a las mentes de los demás. Con solo la habilidad
            de base, un personaje puede intentar usar cualquiera de las habilidades de
            especialidad relacionadas, excepto aquellas que no pueden usarse sin
            entrenamiento. La dificultad de tal acción se refleja en el mayor costo de
            energía psiónica y en el dado de situación base más alto por utilizar solo la
            habilidad de base.
    items:
      contact:
        attribute: PER
        cost: 3
        url: /psionics/telepathy/#contact
        trained_only: false
        rank_benefits:
          - rank: 4
            title: Multiple Targets
          - rank: 6
            title: Language
          - rank: 12
            title: Switch
        extended_duration: true
        localized:
          - en:
              name: Contact
              description: |-
                With this skill, a character can send and receive thoughts to and from another character, usually for the purpose of exchanging information. Modifiers may apply, depending on the range, familiarity, and willingness of the target mind to be contacted. The type of thoughts that can be exchanged depends on the result of a skill check.

                ### Check Results
                - **Ordinary:** simple concepts (brief questions and one-word answers) can be exchanged.
                - **Good:** moderate discussion (pass notes back and forth, one note per 2 phases) can occur.
                - **Amazing:** the communicating characters can have a detailed discussion, as though they were conversing vocally. If the psionics-user's intended target isn't willing to communicate, the target's Will resistance modifier is applied as a penalty to the skill check, in addition to any other situation modifiers. If contact is established anyway, an unwilling mind can expel the user by making a successful Will feat check or a Resolve-mental resolve skill check, with a penalty (+1, +2, or +3 steps) depending on the psionics-user's degree of success.

                Situation modifiers for the familiarity of the mind and the distance at which contact is being used are as follows:

                | Situation/distance | Modifier |
                | :--- | :---: |
                | Familiar mind | –1 |
                | Unfamiliar mind | none |
                | Combative mind | +2 |
                | Hostile mind | +1 |
                | 1–10 meters | –1 |
                | 11–100 meters | none |
                | 101 m–1 km | +1 |
                | 2–10 km | +2 |
                | 11–100 km | +3 |
                | 101–1,000 km (low orbit) | +4 |
                | 1,001–10,000 km (high orbit) | +5 |

                ### Rank Benefits
                ▶ **Rank 4 [Multiple Targets]** The character can establish contact with additional targets: equal to the number of ranks in this skill, but the skill suffers a -1 step penalty.

                ▶ **Rank 6 [Language]** A telepath learns to comprehend the meaning underlying ideas expressed even in languages he or she does not understand. The character may attempt an Intelligence feat check to understand the gist of the concept being communicated, or to make his or her own thoughts clearer to the target. At the Gamemaster's discretion, a +2 step penalty applies to attempting to communicate with alien minds.

                ⊗ **Rank 12 [Switch]** A telepath who reaches rank 12 in contact can attempt to switch his or her consciousness with that of the target—effectively trading bodies.
          - es:
              name: Contacto
              description: |-
                Con esta habilidad, un Personaje puede enviar y recibir pensamientos hacia y desde otro Personaje, generalmente con el fin de intercambiar información. Se pueden aplicar modificadores, dependiendo del alcance, la familiaridad y la voluntad de la mente objetivo con la que se contacta. El tipo de pensamientos que se pueden intercambiar depende del resultado de una prueba de habilidad.

                ### Verificar resultados
                - **Ordinario:** se pueden intercambiar conceptos simples (preguntas breves y respuestas de una palabra).
                - **Bueno:** puede ocurrir una discusión moderada (pasar notas de un lado a otro, una nota por 2 fases).
                - **Asombroso:** los personajes que se comunican pueden tener una discusión detallada, como si estuvieran conversando vocalmente. Si el objetivo previsto del usuario de psionics no está dispuesto a comunicarse, el modificador de resistencia a la voluntad del objetivo se aplica como penalización a la prueba de habilidad, además de cualquier modificador de situación Otros. Si se establece contacto de todos modos, una mente renuente puede expulsar al usuario realizando una prueba exitosa de dote de Voluntad o una prueba de habilidad Firmeza-Mental Firmeza, con una penalización (+1, +2 o +3 pasos) dependiendo del grado de éxito del usuario psiónico.

                Los modificadores de situación según la familiaridad de la mente y la distancia a la que se utiliza el contacto son los siguientes:

                | Situación/distancia | Modificador |
                | :--- | :---: |
                | Mente familiar | –1 |
                | Mente desconocida | ninguno |
                | Mente combativa | +2 |
                | Mente hostil | +1 |
                | 1–10 metros | –1 |
                | 11–100 metros | ninguno |
                | 101 m–1 km | +1 |
                | 2–10 kilómetros | +2 |
                | 11-100 kilómetros | +3 |
                | 101-1.000 km (órbita baja) | +4 |
                | 1.001-10.000 km (órbita alta) | +5 |

                ### Beneficios de Rango
                ▶ **Rango 4 [Múltiples objetivos]** El Personaje puede establecer contacto con objetivos adicionales: igual al número de Rangos en esta habilidad, pero la habilidad sufre un -1 Penalización de paso.

                ▶ **Rango 6 [Idioma]** Un telépata aprende a comprender el significado subyacente de las ideas expresadas incluso en idiomas que no comprende. El Personaje puede intentar una prueba de dote de Inteligencia para comprender la esencia del concepto que se comunica o para aclarar sus propios pensamientos al objetivo. A discreción del Director de Juego, se aplica un +2 Penalización de paso al intentar comunicarse con mentes alienígenas.

                ⊗ **Rango 12 [Cambiar]** Un telépata que alcanza Rango 12 en contacto puede intentar cambiar su conciencia con la del objetivo, intercambiando cuerpos de manera efectiva.
      empathic-projection:
        attribute: PER
        cost: 3
        url: /psionics/telepathy/#empathic-projection
        trained_only: false
        rank_benefits:
          - rank: 3
            title: Ignore penalty
          - rank: 4
            title: Extended Duration
          - rank: 6
            title: Ignore penalty
          - rank: 9
            title: Ignore penalty
          - rank: 12
            title: Ignore penalty
        extended_duration: false
        localized:
          - en:
              name: Empathic Projection
              description: |-
                With this skill, a character may alter the mood of other beings, even those with whom the character does not share a language, such as foreigners, aliens, or animals. 

                In the event of a Critical Failure, the target's emotional state shifts two steps in the direction opposite of what was desired. 

                The target must be within visual range of the psion. 

                This power last until the begining of the next turn and a number of extra turns equal to half the ranks in this skill. Multiple targets can be selected, but each additional target beyond the first provides a cumulative +1 step penalty to the skill check.

                ### Check Results
                - **Ordinary:** the user shifts the emotional state of the target by 1 step.
                - **Good:** the user shifts the emotional state of the target by 2 steps.
                - **Amazing:** the user shifts the emotional state of the target by 3 steps.

                Situation modifiers for the current attitude of the target are as follows:

                | Attitude | Modifier |
                | :--- | :---: |
                | Combative | +3 |
                | Hostile | +2 |
                | Neutral | 0 |
                | Friendly | +1 |
                | Charmed | +2 |
                | Fanatic | +3 |

                ### Rank Benefits

                ▶ **Rank 3 [Extended Duration]** The skill is now considered extended duration.

                ▶ **Rank 5 [Subtlety]** using this skill is now very hard to detect, only characters with psionic sensitivity have a chance of detecting it, but they still suffer +3 step penalty yo their [[awareness-psionic sense]] skill roll.

                ▶ **Rank 6, 9, 12 [Ignore penalty]** The user can ignore one step of penalty for either the target's current emotional state, or the number of intended targets. At rank 6, the character can ignore two such penalty steps, and at rank 12, the character can ignore three.

                ### Stress Relief
                When the persistent stress rules are in play, the character can use this skill to help the surrounding people to resist the effects of stress, doing so require the character to be trained in this specialty skill and spend at least one hour a day in the presence of the people he wants to help.

                The result of the skill check is translated into a bonus on the [[resolve-mental resolve]] skill check used to resist stress. The bonus applies to each person in the group, include the psion.
          - es:
              name: Proyección Empática
              description: |-
                Con esta habilidad, un Personaje puede alterar el estado de ánimo de los seres Otros, incluso aquellos con quienes el Personaje no comparte idioma, como extranjeros, extraterrestres o animales.

                En el caso de un Fallo Crítico, el estado emocional del objetivo cambia dos pasos en la dirección opuesta a la deseada.

                El objetivo debe estar dentro del alcance visual del psion.

                Este poder dura hasta el inicio del siguiente turno y un número de turnos extra igual a la mitad del Rangos en esta habilidad. Se pueden seleccionar varios objetivos, pero cada objetivo adicional más allá del primero proporciona un +1 Penalización de paso acumulativo a la prueba de habilidad.

                ### Verificar resultados
                - **Ordinario:** el usuario cambia el estado emocional del objetivo en 1 paso.
                - **Bueno:** el usuario cambia el estado emocional del objetivo en 2 pasos.
                - **Asombroso:** el usuario cambia el estado emocional del objetivo en 3 pasos.

                Los modificadores de situación para la actitud actual del objetivo son los siguientes:

                | Actitud | Modificador |
                | :--- | :---: |
                | Combativo | +3 |
                | Hostil | +2 |
                | Neutro | 0 |
                | Amistoso | +1 |
                | Encantada | +2 |
                | Fanático | +3 |

                ### Beneficios de Rango

                ▶ **Rango 3 [Duración extendida]** La habilidad ahora se considera de duración extendida.

                ▶ **Rango 5 [Sutileza]** usar esta habilidad ahora es muy difícil de detectar, solo los personajes con sensibilidad psiónica tienen la posibilidad de detectarla, pero aún sufren +3 Penalización de paso en su tirada de habilidad [[Alerta-Sentido psiónico]].

                ▶ **Rango 6, 9, 12 [Ignorar penalización]** El usuario puede ignorar un paso de penalización ya sea por el estado emocional actual del objetivo o por la cantidad de objetivos previstos. En Rango 6, el Personaje puede ignorar dos de esos pasos de penalización, y en Rango 12, el Personaje puede ignorar tres.

                ### Alivio del estrés
                Cuando las reglas del estrés persistente están en juego, el Personaje puede usar esta habilidad para ayudar a las personas que lo rodean a resistir los efectos del estrés, para ello es necesario que el Personaje esté entrenado en este Especialidad y pase al menos una hora al día en presencia de las personas a las que quiere ayudar.

                El resultado de la prueba de habilidad se traduce en una bonificación en la prueba de habilidad [[Firmeza-Mental Firmeza]] utilizada para resistir el estrés. El bono aplica para cada persona del grupo, incluye el psion.
      illusion:
        attribute: PER
        cost: 3
        url: /psionics/telepathy/#illusion
        trained_only: false
        rank_benefits:
          - rank: 5
            title: Vanish
          - rank: 9
            title: Delusion
        extended_duration: true
        localized:
          - en:
              name: Illusion
              description: |-
                This skill enables a character to fool a target's mind by projecting an
                illusion into it. An illusion can be a sight or a sound, but no other senses
                can be affected. An illusion is not capable of directly causing damage, but
                might do so indirectly. The skill is usable only against targets the character
                can see, and it has a maximum range of 5 meters per skill rank of the user.
                Any actions the user attempts while maintaining an illusion receive a +1 step
                penalty. The result of the character's skill check determines how powerful the
                illusion is, which provides a penalty to the target's Awareness-intuition
                skill check to recognize the illusion: Ordinary, +1 step ; Good, +2 steps;
                Amazing, +3 steps. Multiple targets can be selected to receive a single
                illusion, but each additional target beyond the first one provides a
                cumulative +1 step penalty to the psionics-user's skill check. Each target is
                entitled to make an Awareness- intuition check to see if the illusion is
                effective against that individual.
                **Rank Benefits:**
                - **At rank 5 [Vanish]:** a character who reaches rank 5 can mask his or her presence, effectively becoming invisible. The ability affects a number of observers equal to the psionics-user's rank in illusion without a penalty to the skill check; each additional target provides a cumulative +1 step penalty to the user's skill check.
                - **At rank 9 [Delusion]:** the illusion created is so convincing that the target mentally supplies nonsensory details, such as emotion, and intangibles, such as a sense of freedom or peace. With a successful illusion skill check, the psion can include a suggestion in the illusion, as per the Telepathy specialty skill suggest.
          - es:
              name: Ilusión
              description: |-
                Esta habilidad permite a un personaje engañar la mente de un objetivo
                proyectando una ilusión en ella. Una ilusión puede ser visual o sonora, pero
                no puede afectar ningún otro sentido. Una ilusión no es capaz de causar daño
                directamente, pero puede hacerlo indirectamente. La habilidad solo se puede
                usar contra objetivos que el personaje pueda ver, y tiene un rango máximo de 5
                metros por rango de habilidad del usuario. Cualquier acción que intente el
                usuario mientras mantiene una ilusión recibe un penalizador de +1 paso. El
                resultado de la tirada de habilidad del personaje determina cuán poderosa es
                la ilusión, lo que proporciona un penalizador a la tirada de Percepción-
                intuición del objetivo para reconocer la ilusión: Ordinario, +1 paso; Bueno,
                +2 pasos; Asombroso, +3 pasos. Se pueden seleccionar múltiples objetivos para
                recibir una sola ilusión, pero cada objetivo adicional más allá del primero
                proporciona un penalizador acumulativo de +1 paso a la tirada de habilidad del
                usuario psiónico. Cada objetivo tiene derecho a hacer una tirada de
                Percepción-intuición para ver si la ilusión es efectiva contra ese individuo.
                **Beneficios de Rango:**
                - **Al rango 5 [Desaparecer]:** un personaje que alcanza el rango 5 puede ocultar su presencia, haciéndose efectivamente invisible. La habilidad afecta a un número de observadores igual al rango del usuario psiónico en Ilusión sin penalizador a la tirada de habilidad; cada objetivo adicional proporciona un penalizador acumulativo de +1 paso a la tirada de habilidad del usuario.
                - **Al rango 9 [Delirio]:** la ilusión creada es tan convincente que el objetivo suministra mentalmente detalles no sensoriales, como emociones, e intangibles, como una sensación de libertad o paz. Con una prueba de habilidad de ilusión exitosa, el psiónico puede incluir una sugerencia en la ilusión, según la habilidad especializada de Telepatía Sugerir.
      mind-blast:
        attribute: PER
        cost: 4
        url: /psionics/telepathy/#mind-blast
        trained_only: true
        rank_benefits:
          - rank: 5
            title: Increased Damage
          - rank: 12
            title: Additional Targets
        extended_duration: false
        localized:
          - en:
              name: Mind Blast
              description: |-
                This skill allows the user to direct a powerful blast of pure mental energy at
                another mind. The target must be within visual contact and no more than 40
                meters away (range 10/20/40). Penalties for medium and long range are +1 and
                +2, respectively. Damage depends on the result of a skill check and the user's
                rank in the skill. Armor doesn't protect against a mind blast. When a
                character first acquires this skill, he or she is able to cause damage of
                d4+1s/d4+2s/d8+2s.
                **Rank Benefits:**
                - **At rank 5 [Increased Damage]:** damage becomes d4+2s/d6+2s/d8+2s. At rank 9, the damage caused by the skill goes to 2d4+2s/2d6+2s/2d8+2s.
                - **At rank 12 [Additional Targets]:** the telepath can affect an additional target, who must also be within range. The range modifier for the skill use is based on the range to the farthest target.
          - es:
              name: Explosión Mental
              description: |-
                Esta habilidad permite al usuario dirigir una poderosa explosión de energía
                mental pura a otra mente. El objetivo debe estar dentro del contacto visual y
                a no más de 40 metros de distancia (rango 10/20/40). Los penalizadores para el
                rango medio y largo son +1 y +2, respectivamente. El daño depende del
                resultado de una tirada de habilidad y del rango del usuario en la habilidad.
                La armadura no protege contra una explosión mental. Cuando un personaje
                adquiere esta habilidad por primera vez, es capaz de causar un daño de
                d4+1s/d4+2s/d8+2s.
                **Beneficios de Rango:**
                - **Al rango 5 [Daño Incrementado]:** el daño pasa a ser d4+2s/d6+2s/d8+2s. Al rango 9, el daño causado por la habilidad aumenta a 2d4+2s/2d6+2s/2d8+2s.
                - **Al rango 12 [Objetivos Adicionales]:** el telépata puede afectar a un objetivo adicional, que también debe estar dentro del rango. El modificador de rango para el uso de la habilidad se basa en el rango del objetivo más lejano.
      mind-shield:
        attribute: PER
        cost: 2
        url: /psionics/telepathy/#mind-shield
        trained_only: false
        rank_benefits:
          - rank: 4
            title: Parry
          - rank: 8
            title: Defend
          - rank: 12
            title: Redirect
        extended_duration: false
        localized:
          - en:
              name: Mind Shield
              description: |-
                This skill allows a character to establish a mental defense against psionic
                powers. Mind shield protects against these psionic skills: contact, drain,
                empathy, illusion, mind reading, mind blast, mind wipe, suggest, and tire.
                Mind shield provides a penalty to the skill check of another psionic character
                who's attempting to use any of the above-mentioned skills. The amount of the
                penalty depends on the result of the user's skill check: Ordinary, +1 step;
                Good, +2 steps; Amazing, +3 steps. These penalties are cumulative with any
                other resistances or protections a character might have. The shield created by
                this skill remains in place for 5-8 hours (d4+4) or until it fails to stop a
                psionic power directed against it, at which point it collapses.
                **Rank Benefits:**
                - **At rank 4 [Parry]:** he or she can attempt to mentally parry the use of contact, illusion, mind reading, mind blast, mind wipe, suggest, or tire against him or her. The parry attempt uses up the character's next available action, but if the Telepathy-mind shield skill check is successful, the opposing skill automatically fails. Further, on an Amazing success using this ability, the parry attempt costs the character no psionic energy points.
                - **At rank 8 [Defend]:** the character may extend the mind shield to protect others within 10 meters. For each additional person, the psion must expend 1 psionic energy point, in exchange for which he or she can apply his own mind shield modifier to psionic attacks directed at the subject. At rank 12, the psion can also attempt to parry such attacks directed at any of the subjects being protected.
                - **At rank 12 [Redirect]:** the character can use mind shield to redirect an attack back on an attacker. The defender must make a mind shield skill check (modified by the attacker's Will resistance modifier) to determine the effect of the redirection. This requires the user to spend 1 psionic energy point; an Amazing result eliminates the need to spend this point. A psion cannot redirect an attack directed at another character.
          - es:
              name: Escudo Mental
              description: |-
                Esta habilidad permite a un personaje establecer una defensa mental contra los
                poderes psiónicos. Escudo mental protege contra estas habilidades psiónicas:
                Contacto, Drenar, Empatía, Ilusión, Leer la mente, Explosión mental, Borrado
                mental, Sugerencia y Agotar. Escudo mental proporciona un penalizador a la
                tirada de habilidad de otro personaje psiónico que intenta usar cualquiera de
                las habilidades mencionadas anteriormente. La cantidad del penalizador depende
                del resultado de la tirada de habilidad del usuario: Ordinario, +1 paso;
                Bueno, +2 pasos; Asombroso, +3 pasos. Estos penalizadores son acumulativos con
                cualquier otra resistencia o protección que pueda tener un personaje. El
                escudo creado por esta habilidad permanece en su lugar durante 5-8 horas
                (d4+4) o hasta que no logra detener un poder psiónico dirigido contra él,
                momento en el que colapsa.
                **Beneficios de Rango:**
                - **Al rango 4 [Parada]:** puede intentar desviar mentalmente el uso de Contacto, Ilusión, Leer la mente, Explosión mental, Borrado mental, Sugerencia o Agotar en su contra. El intento de parada consume la próxima acción disponible del personaje, pero si la tirada de habilidad de Telepatía-escudo mental tiene éxito, la habilidad contraria falla automáticamente. Además, con un éxito Asombroso al usar esta habilidad, el intento de parada no le cuesta puntos de energía psiónica al personaje.
                - **Al rango 8 [Defender]:** el personaje puede extender el escudo mental para proteger a otros a 10 metros. Por cada persona adicional, el psiónico debe gastar 1 punto de energía psiónica, a cambio de lo cual puede aplicar su propio modificador de escudo mental a los ataques psiónicos dirigidos al sujeto. Al rango 12, el psiónico también puede intentar desviar dichos ataques dirigidos a cualquiera de los sujetos protegidos.
                - **Al rango 12 [Redirigir]:** el personaje puede usar escudo mental para devolver un ataque a un atacante. El defensor debe hacer una tirada de habilidad de escudo mental (modificada por el modificador de resistencia de Voluntad del atacante) para determinar el efecto de la redirección. Esto requiere que el usuario gaste 1 punto de energía psiónica; un resultado Asombroso elimina la necesidad de gastar este punto. Un psiónico no puede redirigir un ataque dirigido a otro personaje.
      mind-wipe:
        attribute: PER
        cost: 5
        url: /psionics/telepathy/#mind-wipe
        trained_only: true
        rank_benefits:
          - rank: 3
            title: Extended Reach
          - rank: 6
            title: Edit
          - rank: 12
            title: Unlearn
        extended_duration: false
        localized:
          - en:
              name: Mind Wipe
              description: |-
                With this skill, a psionic character can erase memories from a target's mind.
                One minute's memories can be erased for every rank the character has in mind
                wipe. The target must be within visual range, and no more than 10 meters away
                (range 2/5/10). The memories must be no older than 1 day per rank of the
                psionics-user. The character's skill check determines how difficult it is for
                the target to recall events during the 'erased' time. On an Ordinary success,
                the target receives a +1 step penalty on Intelligence feat checks to recall
                anything that happened during that time. On a Good success, the target
                receives a +2 step penalty. And on an Amazing success, the target receives a
                +3 step penalty. In any case, characters with erased memories will definitely
                know that something is wrong, assuming they are aware of the passage of time
                or of changes to themselves or their environment. They simply will not quite
                remember how these things happened.
                **Rank Benefits:**
                - **At rank 3 [Extended Reach]:** the character can "see" a number of weeks into the past equal to his or her skill rank. At rank 6, this becomes months; at rank 9, it becomes years; and at rank 12, it increases to decades.
                - **At rank 6 [Edit]:** the character can supply false memories to fill in the gaps in the target's mind. The success of the skill check determines the modifier for attempts to spot the false memories: Ordinary, +1, Good, +2, Amazing, +3.
                - **At rank 12 [Unlearn]:** a character who reaches rank 12 with this skill can remove specific knowledge from the target's mind. A successful skill check—resisted by the target's Will modifier—removes 1, 2, or 3 skill ranks (with an Ordinary, Good, or Amazing success) from the target's mind.
          - es:
              name: Borrado Mental
              description: |-
                Con esta habilidad, un personaje psiónico puede borrar recuerdos de la mente
                de un objetivo. Se pueden borrar los recuerdos de un minuto por cada rango que
                el personaje tenga en Borrado mental. El objetivo debe estar dentro del rango
                visual, y a no más de 10 metros de distancia (rango 2/5/10). Los recuerdos no
                deben tener más de 1 día por rango del usuario psiónico. El resultado de la
                tirada de habilidad del personaje determina lo difícil que es para el objetivo
                recordar eventos durante el tiempo "borrado". En un éxito Ordinario, el
                objetivo recibe un penalizador de +1 paso en las proezas de Inteligencia para
                recordar lo que sucedió durante ese tiempo. En un éxito Bueno, recibe un
                penalizador de +2 pasos. Y en un éxito Asombroso, recibe un penalizador de +3
                pasos. En cualquier caso, los personajes con recuerdos borrados sabrán que
                algo anda mal. Simplemente no recordarán exactamente cómo sucedieron las
                cosas.
                **Beneficios de Rango:**
                - **Al rango 3 [Alcance Extendido]:** el personaje puede "ver" en el pasado un número de semanas igual a su rango de habilidad. Al rango 6, esto se convierte en meses; al 9 en años; y al 12 aumenta a décadas.
                - **Al rango 6 [Editar]:** el personaje puede proporcionar recuerdos falsos para llenar los vacíos en la mente del objetivo. El éxito de la tirada de habilidad determina el modificador para los intentos de identificar los recuerdos falsos: Ordinario, +1, Bueno, +2, Asombroso, +3.
                - **Al rango 12 [Desaprender]:** un personaje que alcanza el rango 12 con esta habilidad puede eliminar conocimientos específicos de la mente del objetivo. Una tirada de habilidad exitosa (resistida por el modificador de Voluntad del objetivo) elimina 1, 2 o 3 rangos de habilidad (con un éxito Ordinario, Bueno o Asombroso) de la mente del objetivo.
      psychic-armor:
        attribute: PER
        cost: 2
        url: /psionics/telepathy/#psychic-armor
        trained_only: false
        rank_benefits:
          - rank: 4
            title: Increased Effect
        extended_duration: false
        localized:
          - en:
              name: Psychic Armor
              description: |-
                This skill creates a psychic "buffer zone" around the character, which helps
                to lessen the effect of drain, mind blast, and tire attacks directed at him or
                her. Psychic armor provides the character with a number of "psionic defense
                points". An Ordinary success gives the character d6 defense points; a Good
                success gives him d6+2 defense points; and an Amazing success gives the
                character d8+2 defense points. Defense points remain for d4+4 hours, or until
                they are used. A character cannot use this skill to gain more defense points
                until any previous defense points are lost. These points are used to reduce
                the amount of damage suffered from mind blast (on a one-for-one basis) or to
                give the character another option for resisting tire, drain, or empathic
                projection attacks. Two defense points reduce one point of fatigue loss caused
                by Telepathy-tire, and three defense points reduce one point of attribute loss
                caused by Telepathy-drain. Four defense points reduce by one degree the extent
                to which a character's emotional state has been altered by Telepathy-empathic
                projection.
                **Rank Benefits:**
                - **At rank 4 [Increased Effect]:** the character gains d6+2 defense points on an Ordinary success, d8+2 on a Good success, and d8+4 on an Amazing success. At rank 8, the character gains d8+2 defense points on an Ordinary success, d8+4 on a Good success, and d12+4 on an Amazing success. At rank 12, the character gains d8+4 defense points on an Ordinary success, d12+4 on a Good success, and d12+6 on an Amazing success.
          - es:
              name: Armadura Psíquica
              description: |-
                Esta habilidad crea una "zona de amortiguamiento" psíquica alrededor del
                personaje, que ayuda a disminuir el efecto de los ataques de Drenar, Explosión
                mental y Agotar dirigidos hacia él. La armadura psíquica le proporciona al
                personaje una serie de "puntos de defensa psiónica". Un éxito Ordinario le da
                al personaje d6 puntos de defensa; uno Bueno le da d6+2 puntos de defensa; y
                uno Asombroso le da d8+2. Los puntos de defensa se mantienen durante d4+4
                horas o hasta que se usan. Un personaje no puede usar esta habilidad para
                ganar más puntos de defensa hasta que se pierdan los anteriores. Estos puntos
                se usan para reducir la cantidad de daño sufrido por Explosión Mntal (uno a
                uno) o para darle al personaje otra opción para resistirse a los ataques de
                Agotar, Drenar o Proyección empática. Dos puntos de defensa reducen un punto
                de fatiga causado por Telepatía-agotar, y tres puntos de defensa reducen un
                punto de pérdida de característica causado por Telepatía-drenar. Cuatro puntos
                de defensa reducen en un grado la medida en la que el estado emocional de un
                personaje ha sido alterado por Telepatía-proyección empática.
                **Beneficios de Rango:**
                - **Al rango 4 [Efecto Incrementado]:** el personaje gana d6+2 puntos de defensa en un éxito Ordinario, d8+2 en un éxito Bueno, y d8+4 en un éxito Asombroso. Al rango 8, el personaje gana d8+2 puntos de defensa en un éxito Ordinario, d8+4 en un éxito Bueno, y d12+4 en un éxito Asombroso. Al rango 12, el personaje gana d8+4 puntos de defensa en un éxito Ordinario, d12+4 en un éxito Bueno, y d12+6 en un éxito Asombroso.
      psychic-projection:
        attribute: PER
        cost: 5
        url: /psionics/telepathy/#psychic-projection
        trained_only: false
        rank_benefits:
          - rank: 12
            title: Body-Riding
        extended_duration: false
        localized:
          - en:
              name: Psychic Projection
              description: |-
                With this skill, a character can separate mind from body and travel wherever desired, leaving his or her physical form behind. The psion's consciousness is able to fly and to pass through solid objects. The character's mental form is invisible and intangible, though his or her physical body is still vulnerable, making psychic "joyriding" a less intriguing prospect. Many psions endowed with this ability make use of a bodyguard (literally).

                While travelling psychically, the character's movement rate is equal to (INT + WIL) x 2. The character is effectively naked—being unable to bring physical objects such as clothing or weapons along—though he or she can appear however desired. Only other psychically projected beings can perceive the character in any fashion, though he or she can perceive the real world via sight and sound. Other senses are effectively inactive—except for perceiving contact with other psychically projected beings as a sort of tingling sensation, which is either pleasant or unpleasant, depending on the reaction of the other being toward the character.

                While projected individuals can pass through solid real-world objects, they cannot pass through one another. This makes it possible for such characters to attack one another, though they will ordinarily only be able to do so with unarmed combat techniques, or with psionic abilities. See "Mental Combat", later in this chapter, for more information.

                A projected individual can return to his or her physical body at any time desired, simply by traveling back to it and successfully performing another Telepathy-psychic projection skill check. A character who runs out of psionic energy points while attempting to return becomes trapped in non-corporeal form until such time as he or she is able to recover enough psionic energy to try again. In the meantime, the body is effectively comatose, and will begin to deteriorate unless care is somehow provided.

                The major danger of psychic projection is that one will return to one's corporeal form only to find it already inhabited by someone else. In such dire circumstances, the character will be unable to reenter his or her body, and must find another physical body to occupy. The alternative is living forever after as a kind of ghost, able to perceive the real world, but unable to affect it in any way.

                Characters can enter any "unoccupied" living being they encounter, by the same means they reenter their own bodies. However, a character occupying an unfamiliar form will be unable to "operate" it as well as his or her own. While in another person's body, a character retains his or her own memories and skill ranks, but uses the Ability Scores for the occupied body. (See the description of ESP-contact for more information.)

                **Rank Benefits:**
                - **At rank 12 [Body-Riding]:** the character can attempt to seize control of a body that is already occupied, by making a Telepathy-psychic projection skill check, modified by the target's Will resistance modifier. The result determines how much control the character has over the new form, if any. On an Amazing result, the character has complete control of the target's body, and the target's consciousness is effectively "shut off." On a Good success, the character can only partially operate the body, as described above under entering unoccupied bodies. On an Ordinary success, the character can control the target's body only when the target is unconscious, or otherwise voluntarily relinquishes "control." On a Failure, the character merely remains noncorporeal. With a Critical Failure, the character enters the body, but becomes buried in the target's subconscious, unable to influence the target's body or mind (except perhaps as a sort of vague nagging sensation). The character can attempt to "escape" once per day, by making another Telepathy-psychic projection skill check.
          - es: {}
          - es: {}
          - es: {}
      suggest:
        attribute: PER
        cost: 3
        url: /psionics/telepathy/#suggest
        trained_only: false
        rank_benefits:
          - rank: 6
            title: Programmed Suggestion
        extended_duration: false
        localized:
          - en:
              name: Suggest
              description: |-
                This specialty skill allows a character to mesmerize another person. If
                successful, suggest plants a thought into another person's mind and convinces
                that person that the thought is his or her own. The target must be within
                visual range of the psion. No suggestion can have a permanent or immediately
                detrimental effect on the character it's directed at. A suggestion lasts for
                as long as 1, 2, or 3 hours, depending on the degree of success of the user's
                skill check (Ordinary, Good, or Amazing). It could expire before its time
                limit is reached, but it can't be extended without another successful
                application of the skill at precisely the time when the original suggestion is
                due to run out. The Gamemaster will assign a bonus or a penalty to the user's
                skill check to reflect how extreme the suggestion is (e.g. opposed to the
                character's nature would provide a severe penalty of +3 steps or more).
                **Rank Benefits:**
                - **At rank 6 [Programmed Suggestion]:** the character can implant a suggestion that does not immediately take effect. Instead, when the subject experiences some kind of sensory cue, the subject acts upon the suggestion. The triggering event can be as long as 1 hour, 1 day, or 1 month later, depending on the result of the user's skill check.
          - es:
              name: Sugerir
              description: |-
                Esta habilidad especializada permite al personaje hipnotizar a otra persona.
                Si tiene éxito, sugiere implantar un pensamiento en la mente de otra persona y
                convencer a esa persona de que el pensamiento es propio. El objetivo debe
                estar dentro del rango visual del psiónico. Ninguna sugerencia puede tener un
                efecto permanente o inmediatamente perjudicial en el personaje al que está
                dirigida. Una sugerencia dura 1, 2 o 3 horas, dependiendo del grado de éxito
                de la tirada de habilidad del usuario (Ordinario, Bueno o Asombroso). Puede
                expirar antes de que se alcance su límite de tiempo, pero no se puede extender
                sin otra aplicación exitosa de la habilidad exactamente en el momento en que
                la sugerencia original debe terminar. El Director de Juego asignará una
                bonificación o penalizador a la tirada de habilidad del usuario para reflejar
                lo extrema que es la sugerencia (p. ej., oponerse a la naturaleza del
                personaje proporcionaría un penalizador de +3 pasos o más).
                **Beneficios de Rango:**
                - **Al rango 6 [Sugerencia Programada]:** el personaje puede implantar una sugerencia que no hace efecto de inmediato. En cambio, cuando el sujeto experimenta algún tipo de señal sensorial, actúa según la sugerencia. El evento desencadenante puede ser hasta 1 hora, 1 día o 1 mes después, dependiendo del resultado de la tirada de habilidad.
      tire:
        attribute: PER
        cost: 2
        url: /psionics/telepathy/#tire
        trained_only: false
        rank_benefits:
          - rank: 4
            title: Increased Effect
          - rank: 9
            title: Transference
        extended_duration: false
        localized:
          - en:
              name: Tire
              description: |-
                This skill inflicts fatigue damage upon a target, perhaps prompting that
                character to decide that he or she is in need of rest. The target must be
                within visual contact and no more than 30 meters away (range 10/20/30).
                Penalties for medium and long range are +1 and +2 respectively. The amount of
                damage inflicted depends on the result of a skill check: Ordinary, 1 fatigue
                point; Good, 2 points; Amazing, 3 points.
                **Rank Benefits:**
                - **At rank 4 [Increased Effect]:** the range increases to 15/30/50 meters. At rank 8, an Ordinary result inflicts 2 points of fatigue damage, a Good inflicts 3 points, and an Amazing 4 points. At rank 12, the range increases again to 20/40/60 meters.
                - **At rank 9 [Transference]:** the character can take fatigue points drained from the target and use them. The fatigue points can exceed the character's normal fatigue point total, and remain until lost through normal activity, or until 24 hours have passed—whichever occurs first.
          - es:
              name: Agotar
              description: |-
                Esta habilidad inflige daño por fatiga al objetivo, quizás provocando que
                decida que necesita descansar. El objetivo debe estar a la vista y a no más de
                30 metros de distancia (rango 10/20/30). Los penalizadores a medio y largo
                alcance son de +1 y +2 respectivamente. La cantidad de daño infligido depende
                del resultado de una tirada de habilidad: Ordinario, 1 punto de fatiga; Bueno,
                2 puntos; Asombroso, 3 puntos.
                **Beneficios de Rango:**
                - **Al rango 4 [Efecto Incrementado]:** el alcance se incrementa a 15/30/50 metros. Al rango 8, un éxito Ordinario inflige 2 puntos de fatiga, 3 si es Bueno y 4 si es Asombroso. Al rango 12, el alcance aumenta de nuevo a 20/40/60 metros.
                - **Al rango 9 [Transferencia]:** el personaje puede tomar los puntos de fatiga extraídos del objetivo y usarlos. Los puntos de fatiga pueden exceder el total de fatiga normal del personaje, y permanecen hasta perderse por la actividad normal, o han pasado 24 horas, lo que ocurra primero.
      undo:
        attribute: PER
        cost: 3
        url: /psionics/telepathy/#undo
        trained_only: false
        extended_duration: false
        localized:
          - en:
              name: Undo
              description: |-
                With this skill, a telepath can reverse the effects of a successful use of
                Telepathy-illusion, mind wipe, or suggest. The telepath must achieve a better
                result than the user of the original telepathic skill, with a +1 step modifier
                per rank of difference if the original user's rank is higher, or a
                -1 step modifier per rank of difference if the original user's rank is lower. Only one attempt is allowed each day.
          - es:
              name: Deshacer
              description: |-
                Con esta habilidad, un telépata puede revertir los efectos de un uso exitoso
                de Telepatía-ilusión, borrado mental o sugerir. El telépata debe lograr un
                mejor resultado que el usuario de la habilidad telepática original, con un
                modificador de +1 paso por rango de diferencia si el rango del usuario
                original es mayor, o un modificador de -1 paso por rango de diferencia si el
                rango del usuario original es menor. Solo se permite un intento por día.
      guidance:
        attribute: PER
        cost: 4
        url: /psionics/telepathy/#guidance
        trained_only: true
        rank_benefits:
          - rank: 3
            title: Prolonged Session
          - rank: 4
            title: Foundational Competence
          - rank: 6
            title: Foundational Competence
          - rank: 8
            title: Prolonged Session
          - rank: 12
            title: Restricted Access
        extended_duration: true
        localized:
          - en:
              name: Guidance
              description: |-
                Requires Perk: Fraal Psionics Schooling (Exclusive Perk).

                The psion reaches into the Idea Dimension—an ancient, semi-sentient Fraal repository of knowledge. The psion queries the construct for general guidance on the situation at hand. If successful, the dimension projects a "virtual assistant" into the psion's mind, providing abstract and practical knowledge, as well as insightful tip in real-time.

                The assistant resist helping with actions with the intent of harming sentient being (+3 steps penalty to the activation test), while is eager to help with action which have a clear, and in the short term will save people (-3 step bonus to the activation test), like for example disarming a bomb. The power last until the beginning of the next round, but it can be extended by spending a psionic power point at the beginning of the round. Out of combat it last 1 minute per rank, or until the task for which it was invoked is resolved.

                The depth of the construct's guidance—and thus the resulting Assist Score—is determined by the psion's activation check.

                # Check Results
                - Ordinary: The construct is partially engaged. The Assist Score is equal to 12/6/3.
                - Good: The construct shows willingness to help. The Assist Score is 16/8/4.
                - Amazing: The construct help to the best of his abilities 20/10/5.

                Once the Assist Score is determined, the psion must acts as a channel for the construct. He doesn’t spend actions to assist that he makes, but while assisting other rolls he still needs to spend an action to communicate the assistant advice. If the character is capable of using the contact power he can treat the assistant as another target an avoid needing using his time or actions to assist. Resolve the assistance as usual, replacing the skill used to assist with the Assist Score.

                ### Rank Benefits
                ▶ **Rank 3, 8 [Prolonged Session]** At rank 3 the out of combat duration increases to 10 minutes per rank. At rank 8 the duration increase once again to 1 hour per rank.

                ▶ **Rank 4, 6 [Foundational Competence]** The virtual assistant provides such clear foundational instructions, if the character making the main check does not possess the required Broad Skill for the task, he counts as having it for the assisted checks. At rank 6, if he is not trained in the required specialty skill he counts as having 1 rank.

                ▶ **Rank 12 [Restricted Access]** The sentient dimension recognizes the psion as a trusted user. Giving him access to secret and restricted information. Reaching rank 12 is not enough to use this benefit, it also requires authorization from the Fraal governing body in charge of the construct. It is usually granted after a rigorous background check and an oath(tied to the construct).
          - es:
              name: Guía
              description: |-
                Requiere Ventaja: Fraal Psionics Schooling (exclusivo Ventaja).

                La psion llega a la Dimensión de las Ideas, un antiguo depósito Fraal de conocimiento semi-sensible. El psion consulta al constructo para obtener orientación general sobre la situación actual. Si tiene éxito, la dimensión proyecta un "asistente virtual" en la mente del psion, proporcionando conocimiento abstracto y práctico, así como consejos interesantes en tiempo real.

                El asistente se resiste a ayudar con acciones con la intención de dañar a seres sensibles (penalización de +3 pasos a la prueba de activación), mientras que está ansioso por ayudar con acciones que tienen un objetivo claro y que en el corto plazo salvarán a las personas (-3 Bonificación de paso a la prueba de activación), como por ejemplo desarmar una bomba. El poder dura hasta el comienzo de la siguiente ronda, pero se puede extender gastando un punto de poder psiónico al comienzo de la ronda. Fuera de Combate dura 1 minuto por Rango, o hasta que se resuelva la tarea para la que fue invocado.

                La profundidad de la guía del constructo (y, por tanto, la puntuación de asistencia resultante) está determinada por la comprobación de activación del psion.

                # Verificar resultados
                - Ordinario: La construcción está parcialmente comprometida. La puntuación de asistencia es igual a 12/6/3.
                - Bueno: El constructo muestra voluntad de ayudar. La puntuación de asistencia es 16/8/4.
                - Asombroso: El constructo ayuda lo mejor que puede 20/10/5.

                Una vez que se determina la puntuación de asistencia, el psion debe actuar como canal para la construcción. No gasta acciones para ayudar a lo que hace, pero mientras ayuda en las tiradas de Otros aún necesita gastar una acción para comunicar el consejo del asistente. Si el Personaje es capaz de utilizar el poder de contacto, puede tratar al asistente como otro objetivo y evitar la necesidad de utilizar su tiempo o acciones para ayudar. Firmeza la asistencia como de costumbre, reemplazando la habilidad utilizada para ayudar con Assist Score.

                ### Beneficios de Rango
                ▶ **Rango 3, 8 [Sesión prolongada]** En Rango 3, la duración fuera de Combate aumenta a 10 minutos por Rango. En Rango 8, la duración aumenta una vez más a 1 hora por Rango.

                ▶ **Rango 4, 6 [Competencia fundamental]** El asistente virtual proporciona instrucciones fundamentales tan claras que si el Personaje que realiza la comprobación principal no posee la habilidad amplia requerida para la tarea, cuenta como si la tuviera para las comprobaciones asistidas. En Rango 6, si no está capacitado en el Especialidad requerido, cuenta como si tuviera 1 Rango.

                ▶ **Rango 12 [Acceso restringido]** La dimensión sensible reconoce psion como un usuario confiable. Dándole acceso a información secreta y restringida. Llegar a Rango 12 no es suficiente para utilizar este beneficio, también requiere autorización del organismo rector de Fraal a cargo de la construcción. Por lo general, se otorga después de una rigurosa verificación de antecedentes y un juramento (vinculado a la construcción).
      subdual:
        attribute: PER
        cost: 3
        url: /psionics/telepathy/#subdual
        trained_only: true
        rank_benefits:
          - rank: 4
            title: Increased Effect
        extended_duration: false
        localized:
          - en:
              name: Subdual
              description: |-
                This skill allows the user to engender feelings of calm, or even detachment,
                in any intelligent species. The target must be within visual range. With an
                Ordinary result, the target becomes less violent, suffering a +1 step penalty
                to combat skill checks, including action checks. On a Good success, the
                reaction is even stronger, conferring a +3 step penalty to combat skill checks
                and action checks. And on an Amazing success, the subject becomes incapable of
                launching an attack against another living being, and will hesitate for a
                phase before attacking objects, structures, or other nonliving things. Most
                Aleerins, incidentally, would never dream of using this ability to take
                advantage of another being. To do so requires that the Aleerin succeed at a
                Resolve-mental resolve check.
                **Rank Benefits:**
                - **At rank 4 [Increased Effect]:** the user can affect two targets with the same skill check. At rank 8, he or she can affect four targets, and eight targets at rank 12.
          - es:
              name: Sometimiento
              description: |-
                Esta habilidad permite al usuario engendrar sentimientos de calma o incluso
                distanciamiento en cualquier especie inteligente. El objetivo debe encontrarse
                dentro del alcance visual. Con un resultado Ordinario, el objetivo se vuelve
                menos violento y recibe un penalizador de +1 a las tiradas de combate,
                incluyendo las de acción. En un éxito Bueno, la reacción es aún mayor,
                otorgando un penalizador de +3 a las tiradas de combate y de acción. Y en un
                éxito Asombroso, el objetivo se vuelve incapaz de iniciar un ataque contra
                otro ser vivo y dudará una fase antes de atacar objetos, estructuras o
                elementos inanimados. Dicho sea de paso, la mayoría de los Aleerin nunca
                soñarían con usar esta habilidad para aprovecharse de otro ser. Para hacerlo,
                es necesario que el Aleerin supere una tirada de Resolución Mental.
                **Beneficios de Rango:**
                - **Al rango 4 [Efecto Incrementado]:** el usuario puede afectar a dos objetivos con la misma tirada de habilidad. Al rango 8, puede afectar a cuatro objetivos, y a ocho objetivos al rango
                  12.
      thought-worm:
        attribute: PER
        cost: 4
        url: /psionics/telepathy/#thought-worm
        trained_only: true
        localized:
          - en:
              name: Thought Worm
              description: |-
                The psion inserts a mental construct into the mind of another being. This worm consumes the target's cognitive energy, making mental tasks harder while allowing the psion to force the target's mind to process tasks for them.

                The target must be within 30 meters and in line of sight, or an active target of the [Telepathy-contact]({{< relref "/psionics/telepathy#contact" >}}) power. Upon activation, the target's Will defense imposes a penalty to the activation check. If successful, the worm is implanted and the psion selects one of the target's Intelligence-based skills. While the power lasts, the psion can use that selected skill, utilizing the target's ranks and Intelligence score.

                **Awareness & Control:** The target is aware of the psion's presence as alien thoughts pop up in their mind. If the target is unwilling, whenever the psion wants to use the borrowed skill, the psion must make a new skill check (penalized by the target's Will defense modifier) to force the target's mind to comply. Failing this check means the task is not processed, but the worm remains; only a Critical Failure frees the target.

                ### Check Results

                - **Ordinary:** The target suffers a -1 step penalty to all Intelligence-based skill and feat checks.
                - **Good:** The penalty is -2 steps.
                - **Amazing:** The penalty is -3 steps.

                ### Rank Benefits
                ▶ **Rank 3 [Broad Selection]** You can now select up to 3 of the target's specialty skills instead of a single one.

                ▶ **Rank 6 [Psionic Link]** If the target is a psion, you can choose one of their psionic skills instead of a standard skill. Because you are only drawing upon their knowledge rather than utilizing their remote mind to process it, you use your own ability score combined with the target's ranks. The power point cost comes from your own reserves and is doubled.

                ▶ **Rank 9 [Improved Link]** Using the target's psionic skill via Psionic Link no longer costs double power points.

                ▶ **Rank 12 [Improved Worm]** You are no longer limited to Intelligence. You can now select any Intelligence, Will, or Personality-based specialty skill. All selected skills must share the same ability score, and the step penalty from the Check Results is applied to all checks using that chosen ability score.
          - es:
              name: 'Gusano del pensamiento'
              description: |-
                El psion inserta una construcción Mental en la mente de otro ser. Este gusano consume la energía cognitiva del objetivo, lo que dificulta las tareas de Mental y permite que el psion fuerce la mente del objetivo a procesar las tareas por él.

                El objetivo debe estar dentro de un rango de 30 metros y en la línea de visión, o ser un objetivo activo del poder [Telepatía-contacto]({{< relref "/psionics/telepathy#contact" >}}). Tras la activación, la defensa de Voluntad del objetivo impone una penalización a la prueba de activación. Si tiene éxito, se implanta el gusano y el psion selecciona una de las habilidades basadas en Inteligencia del objetivo. Mientras dure el poder, el psion puede usar esa habilidad seleccionada, utilizando el Rangos y la puntuación de Inteligencia del objetivo.

                **Alerta y Control:** El objetivo es consciente de la presencia del psion cuando pensamientos alienígenas aparecen en su mente. Si el objetivo no está dispuesto, siempre que el psion quiera usar la habilidad prestada, debe realizar una nueva prueba de habilidad (penalizada por el modificador de defensa de Voluntad del objetivo) para obligar a la mente del objetivo a obedecer. Si no se supera esta verificación, la tarea no se procesa, pero el gusano permanece; sólo un Fallo Crítico libera al objetivo.

                ### Verificar resultados

                - **Ordinario:** El objetivo sufre un -1 Penalización de paso en todas las pruebas de habilidades y dotes basadas en Inteligencia.
                - **Bueno:** La penalización es de -2 pasos.
                - **Asombroso:** La penalización es de -3 pasos.

                ### Beneficios de Rango
                ▶ **Rango 3 [Selección amplia]** Ahora puedes seleccionar hasta 3 de las habilidades especiales del objetivo en lugar de una sola.

                ▶ **Rango 6 [Psionic Link]** Si el objetivo es un psion, puedes elegir una de sus habilidades psiónicas en lugar de una habilidad estándar. Debido a que solo estás aprovechando su conocimiento en lugar de utilizar su mente remota para procesarlo, usas tu propia puntuación de habilidad combinada con el Rangos del objetivo. El coste del power point proviene de tus propias reservas y se duplica.

                ▶ **Rango 9 [Enlace mejorado]** Usar la habilidad psiónica del objetivo a través de Enlace psiónico ya no cuesta el doble de puntos de poder.

                ▶ **Rango 12 [Gusano mejorado]** Ya no estás limitado a la Inteligencia. Ahora puede seleccionar cualquier Especialidad basado en Inteligencia, Voluntad o Personalidad. Todas las habilidades seleccionadas deben compartir la misma puntuación de habilidad, y el Penalización de paso de los resultados de la verificación se aplica a todas las comprobaciones que utilizan esa puntuación de habilidad elegida.
        rank_benefits:
          - rank: 3
            title: Broad Selection
          - rank: 6
            title: Psionic Link
          - rank: 9
            title: Improved Link
          - rank: 12
            title: Improved Worm
        extended_duration: true
    trained_only: true
