config:
  default:
    name: Default
    columns:
      en:
        - name: Armor
          key: name
        - name: Mass
          key: mass
        - name: Pen.
          key: ap
        - name: LI/HI/En
          key: lhe
        - name: Type
          key: type
        - name: Hide
          key: hide
        - name: Avail.
          key: avail
        - name: Cost ($)
          key: cost
        - name: Description
          key: description
          hidden: true
      es:
        - name: Armadura
          key: name
        - name: Masa
          key: mass
        - name: Pena.
          key: ap
        - name: IL/IP/En
          key: lhe
        - name: Tipo
          key: type
        - name: Ocult.
          key: hide
        - name: Disp.
          key: avail
        - name: Coste ($)
