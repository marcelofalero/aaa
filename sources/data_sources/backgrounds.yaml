          flaw: |-
            [Temperamento]({{< relref "/perks_flaws/#temper" >}}) (Un ego artístico volátil que estalla impredeciblemente cuando su trabajo, visión o estatus es criticado o interrumpido).
          name: El Virtuoso
          special_ability: |-
            **Favor del Patrón y Catarsis:** Puedes aprovechar tu prestigio artístico para obtener acceso a eventos exclusivos o asegurar financiación. Recibes una bonificación de -1 paso a las tiradas de habilidad de [Interacción-Encanto]({{< relref "/skills/interaction/#charm" >}}) o [Cultura- Etiqueta]({{< relref "/skills/culture/#etiquette-specific" >}}) al tratar con patrones de la alta sociedad o entusiastas del arte (esta bonificación mejora a -2 pasos si posees la ventaja [Asquerosamente Rico]({{< relref "/perks_flaws/#filthy-rich" >}}) ). Además, participar en tu arte proporciona alivio psicológico: si se utilizan las reglas opcionales de Estrés Persistente, una tirada exitosa de [Creatividad-Expresión Artística]({{< relref "/skills/creativity/#artistic-expression" >}}) otorga una bonificación de +1 (Ordinario), +2 (Bueno) o +3 (Asombroso) pasos a las proezas de Personalidad realizadas para resistir las penalizaciones por estrés.
