            **Captain and Commander:** You begin the game in possession of a starship capable of interstellar travel and accommodating the entire party.
          tendencies: |-
            **The Bottom Line:** Make a tactical or narrative decision strictly based on financial gain or the physical preservation of your ship, ignoring moral pleas or personal risks.<br>**My Ship, My Rules:** Assert your absolute authority over a situation or passenger while aboard your vessel, even when deferring to an ally or expert would be significantly safer.
      - es:
          description: |-
            Tienes las llaves del activo más valioso de la galaxia: una nave estelar. Sin embargo, ese tipo de hardware no es barato, y vendiste tu alma a un cártel, banco o benefactor sombrío para conseguirlo.
