items:
  academy-graduate:
    favored_broad_skill: ''
    localized:
      - en:
          description: |-
            You represent the elite tier of institutional training. You didn't just join the service; you were forged by it, learning that leadership is a burden and doctrine is a shield.
          equipment: |-
            A pristine dress uniform, a standard-issue officer's sidearm, a tactical holomap projector, and a low-level clearance badge.
          favored_perks: |-
            [Reputation]({{< relref "/perks_flaws/#reputation" >}})
          favored_specialty_skills: |-
            [Leadership-Command]({{< relref "/skills/leadership/#command" >}}) <br> [Tactics-Infantry Tactics]({{< relref "/skills/tactics/#infantry-tactics" >}}) <br> [Administration-Management]({{< relref "/skills/administration/#management" >}}) <br> [Culture-Etiquette]({{< relref "/skills/culture/#etiquette-specific" >}})
          flaw: |-
            [Code of Honor]({{< relref "/perks_flaws/#code-of-honor" >}})
          name: The Academy Graduate
          special_ability: |-
            **Tactical Evaluation:** You have a -1 step bonus to [Awareness-Perception]({{< relref "/skills/awareness/#perception" >}}) or [Tactics-Infantry Tactics]({{< relref "/skills/tactics/#infantry-tactics" >}}) checks made specifically to evaluate an opponent's combat formation, defensive weaknesses, or equipment quality before an engagement begins.
          tendencies: |-
            **The Officer in Charge:** Assert your rank or authority to take command of a chaotic situation, even when doing so makes you the primary target for enemies or social scrutiny.<br>**The Strategist:** Refuse to deviate from a sophisticated or "correct" tactical plan even when a simpler, more "rugged" solution is available, prioritizing the doctrine you were taught.
      - es:
          description: |-
            Representas el nivel de élite de la formación institucional. No solo te uniste al servicio; fuiste forjado por él, aprendiendo que el liderazgo es una carga y la doctrina un escudo.
          equipment: |-
            Un uniforme de gala impecable, un arma de fuego de oficial estándar, un proyector de holomapa táctico y una credencial de autorización de bajo nivel.
          favored_perks: |-
            [Reputación]({{< relref "/perks_flaws/#reputation" >}})
          favored_specialty_skills: |-
            [Liderazgo-Mando]({{< relref "/skills/leadership/#command" >}}) <br> [Tácticas-Tácticas de Infantería]({{< relref "/skills/tactics/#infantry-tactics" >}}) <br> [Administración-Gestión]({{< relref "/skills/administration/#management" >}}) <br> [Cultura-Etiqueta]({{< relref "/skills/culture/#etiquette-specific" >}})
          flaw: |-
            [Código de Honor]({{< relref "/perks_flaws/#code-of-honor" >}})
          name: El Graduado de la Academia
          special_ability: |-
            **Evaluación Táctica:** Tienes una bonificación de -1 paso a las tiradas de [Conciencia-Percepción]({{< relref "/skills/awareness/#perception" >}}) o [Tácticas-Tácticas de Infantería]({{< relref "/skills/tactics/#infantry-tactics" >}}) realizadas específicamente para evaluar la formación de combate de un oponente, sus debilidades defensivas o la calidad de su equipo antes de que comience un enfrentamiento.
          tendencies: |-
            **El Oficial al Mando:** Afirma tu rango o autoridad para tomar el control de una situación caótica, incluso cuando hacerlo te convierte en el objetivo principal de enemigos o del escrutinio social.<br>**El Estratega:** Se niega a desviarse de un plan táctico sofisticado o "correcto" incluso cuando una solución más simple y "ruda" está disponible, priorizando la doctrina que le enseñaron.
    url: /backgrounds/academy-graduate/
  austin-combat-school:
    favored_broad_skill: |-
      [Tactics]({{< relref "/skills/tactics/" >}})
    localized:
      - en:
          description: |-
            A graduate of a premier military academy known for producing disciplined and tactically brilliant soldiers.
          equipment: |-
            A dress uniform, a graduation ring or medal.
          favored_perks: |-
            [Reputation]({{< relref "/perks_flaws/#reputation" >}})
          favored_specialty_skills: |-
            [Leadership-Command]({{< relref "/skills/leadership/#command" >}}) <br> [Armor Operation]({{< relref "/skills/armor-operation/" >}}) <br> [Heavy Weapons-Direct Fire]({{< relref "/skills/heavy-weapons/#direct-fire" >}}) <br> [Resolve-Mental Resolve]({{< relref "/skills/resolve/#mental-resolve" >}})
          flaw: |-
            [Code of Honor]({{< relref "/perks_flaws/#code-of-honor" >}})
          name: Austin Combat School Graduate
          special_ability: |-
            **Academy Discipline:** Receive a -1 step bonus to all [Tactics]({{< relref "/skills/tactics/" >}}) or [Leadership]({{< relref "/skills/leadership/" >}}) checks after assessing the situation for one round.
          tendencies: ''
      - es:
          description: |-
            Un graduado de una academia militar de élite conocida por producir soldados disciplinados y brillantes.
          equipment: |-
            Un uniforme de gala, un anillo de graduación o medalla.
          favored_perks: |-
            [Reputación]({{< relref "/perks_flaws/#reputation" >}})
          favored_specialty_skills: |-
            [Liderazgo-Mando]({{< relref "/skills/leadership/#command" >}}) <br> [Operación de Armadura]({{< relref "/skills/armor-operation/" >}}) <br> [Armas Pesadas-Fuego Directo]({{< relref "/skills/heavy-weapons/#direct-fire" >}}) <br> [Voluntad-Voluntad Mental]({{< relref "/skills/resolve/#mental-resolve" >}})
          flaw: |-
            [Código de Honor]({{< relref "/perks_flaws/#code-of-honor" >}})
          name: Graduado de la Escuela de Combate Austin
          special_ability: |-
            **Disciplina de la Academia:** Recibe un bono de -1 paso en todos los chequeos de [Táctica]({{< relref "/skills/tactics/" >}}) o [Liderazgo]({{< relref "/skills/leadership/" >}}) tras evaluar la situación.
          tendencies: ''
    url: /backgrounds/austin-combat-school/
  bounty-hunter:
    favored_broad_skill: ''
    localized:
      - en:
          description: |-
            The galaxy is vast, but for you, it is just a series of footprints and digital trails. You live for the contract and the satisfaction of a closed case.
          equipment: |-
            An armored longcoat, two sets of heavy-duty binders, a tracking fob/scanner, and a heavy pistol or stun baton.
          favored_perks: |-
            [Observant]({{< relref "/perks_flaws/#observant" >}})
          favored_specialty_skills: |-
            [Investigate-Track]({{< relref "/skills/investigate/#track" >}}) <br> [Law-Law Enforcement Procedures]({{< relref "/skills/law/#law-enforcement-procedures" >}}) <br> [Awareness-Perception]({{< relref "/skills/awareness/#perception" >}}) <br> [Street Smart-Street Knowledge]({{< relref "/skills/street-smart/#street-knowledge" >}})
          flaw: |-
            [Powerful Enemy]({{< relref "/perks_flaws/#powerful-enemy" >}}) (Someone you caught, or someone you’re currently hunting who has the upper hand).
          name: The Bounty Hunter
          special_ability: |-
            **Skip Tracer:** You have a -1 step bonus to [Investigate-Search]({{< relref "/skills/investigate/#search" >}}) checks when looking for information regarding a specific individual's current location or recent history.
          tendencies: |-
            **The Single-Minded:** Pursue a target or a lead into a clearly dangerous or disadvantageous situation instead of choosing a safer, slower path.<br>**The Professional:** Honor the specific letter of a contract even when offered a more profitable "side deal" or an easier moral out.
      - es:
          description: |-
            La galaxia es vasta, pero para ti, es solo una serie de huellas y rastros digitales. Vives por el contrato y la satisfacción de un caso cerrado.
          equipment: |-
            Un abrigo blindado, dos juegos de ataduras de alta resistencia, un localizador/escáner de rastreo y una pistola pesada o porra aturdidora.
          favored_perks: |-
            [Observador]({{< relref "/perks_flaws/#observant" >}})
          favored_specialty_skills: |-
            [Investigar-Rastrear]({{< relref "/skills/investigate/#track" >}}) <br> [Ley- Procedimientos de Aplicación de la Ley]({{< relref "/skills/law/#law-enforcement-procedures" >}}) <br> [Conciencia- Percepción]({{< relref "/skills/awareness/#perception" >}}) <br> [Pillería-Conocimiento Callejero]({{< relref "/skills/street-smart/#street-knowledge" >}})
          flaw: |-
            [Enemigo Poderoso]({{< relref "/perks_flaws/#powerful-enemy" >}}) (Alguien a quien atrapaste, o alguien a quien estás cazando actualmente y tiene la ventaja).
          name: El Cazarrecompensas
          special_ability: |-
            **Rastreador de Fugitivos:** Tienes una bonificación de
            -1 paso a las tiradas de [Investigar-Buscar]({{< relref "/skills/investigate/#search" >}}) al buscar información sobre la ubicación actual o el historial reciente de un individuo específico.
          tendencies: |-
            **El Obsesivo:** Persigue un objetivo o una pista en una situación claramente peligrosa o desventajosa en lugar de elegir un camino más seguro y lento.<br>**El Profesional:** Honra la letra específica de un contrato incluso cuando se le ofrece un "trato secundario" más rentable o una salida moral más fácil.
    url: /backgrounds/bounty-hunter/
  breacher:
    favored_broad_skill: ''
    localized:
      - en:
          description: |-
            Specialist in bypassing physical barriers and initiating tactical entries.
          equipment: |-
            Entry kit, breaching charge, tactical shotgun.
          favored_perks: |-
            [Tough as Nails]({{< relref "/perks_flaws/#tough-as-nails" >}})
          favored_specialty_skills: |-
            [Security-Security Devices]({{< relref "/skills/security/#security-devices" >}}) <br> [Tactics-Infantry Tactics]({{< relref "/skills/tactics/#infantry-tactics" >}}) <br> [Modern Ranged Weapons]({{< relref "/skills/modern-ranged-weapons/" >}}) <br> [Athletics-Climb]({{< relref "/skills/athletics/#climb" >}})
          flaw: |-
            [Old Injury]({{< relref "/perks_flaws/#old-injury" >}})
          name: The Breacher
          special_ability: |-
            **Tactical Entry:** -1 step bonus to [Security]({{< relref "/skills/security/" >}}) or [Tactics]({{< relref "/skills/tactics/" >}}) when initiating combat or bypassing barriers.
          tendencies: ''
      - es:
          description: |-
            Especialista en sortear barreras físicas e iniciar entradas tácticas.
          equipment: |-
            Kit de entrada, carga de brecha, escopeta táctica.
          favored_perks: |-
            [Duro como un Clavo]({{< relref "/perks_flaws/#tough-as-nails" >}})
          favored_specialty_skills: |-
            [Seguridad-Dispositivos de Seguridad]({{< relref "/skills/security/#security-devices" >}}) <br> [Táctica-Táctica de Infantería]({{< relref "/skills/tactics/#infantry-tactics" >}}) <br> [Armas a Distancia Modernas]({{< relref "/skills/modern-ranged-weapons/" >}}) <br> [Atletismo-Escalar]({{< relref "/skills/athletics/#climb" >}})
          flaw: |-
            [Vieja Herida]({{< relref "/perks_flaws/#old-injury" >}})
          name: El Especialista en Brechas
          special_ability: |-
            **Entrada Táctica:** Bono de -1 paso a [Seguridad]({{< relref "/skills/security/" >}}) o [Táctica]({{< relref "/skills/tactics/" >}}) al iniciar combate.
          tendencies: ''
    url: /backgrounds/breacher/
  certified-psychic:
    favored_broad_skill: ''
    localized:
      - en:
          description: |-
            You are an autonomous legal entity, granted the rare authority to use psionic powers openly. You act as an arbiter in high-stakes negotiations and possess the legal right to probe minds in situ if you determine there is reasonable cause.
          equipment: |-
            An official arbiter's badge/warrant, a portable recording device, formal professional wear, and mild sedatives/stimulants for psychic strain.
          favored_perks: |-
            [Reputation]({{< relref "/perks_flaws/#reputation" >}})
          favored_specialty_skills: |-
            [Telepathy-Mind Reading]({{< relref "/psionics/telepathy/#mind-reading" >}}) <br> [Law-Court Procedures]({{< relref "/skills/law/#court-procedures" >}}) <br> [Interaction-Interview]({{< relref "/skills/interaction/#interview" >}}) <br> [Resolve-Mental Resolve]({{< relref "/skills/resolve/#mental-resolve" >}})
          flaw: |-
            [Code of Honor]({{< relref "/perks_flaws/#code-of-honor" >}}) (Absolute neutrality and adherence to the strict ethical guidelines of your autonomous certification).
          name: The Certified Psychic
          special_ability: |-
            **Autonomous Arbiter:** Your psionic verification is legally binding. You receive a -1 step bonus to [Interaction]({{< relref "/skills/interaction/" >}}) or [Law]({{< relref "/skills/law/" >}}) checks when acting as a neutral third party in negotiations or when asserting your legal right to verify the truth of a statement in the field.
          tendencies: |-
            **The Absolute Truth:** Force a harsh or dangerous truth out into the open to maintain your absolute neutrality, even when a polite lie or deception would have made things easier for the party.<br>**The Unwanted Judge:** Complicate a situation by acting on a crime or dark secret you gleaned from someone's mind, using your autonomous authority to intervene when it wasn't your fight.
      - es:
          description: |-
            Eres una entidad legal autónoma, con la rara autoridad de usar poderes psiónicos abiertamente. Actúas como árbitro en negociaciones de alto riesgo y posees el derecho legal de sondear mentes in situ si determinas que hay una causa razonable.
          equipment: |-
            Una insignia/orden de árbitro oficial, un dispositivo de grabación portátil, vestimenta profesional formal y sedantes/estimulantes suaves para la tensión psíquica.
          favored_perks: |-
            [Reputación]({{< relref "/perks_flaws/#reputation" >}})
          favored_specialty_skills: |-
            [Telepatía-Lectura Mental]({{< relref "/psionics/telepathy/#mind-reading" >}}) <br> [Ley-Procedimientos Judiciales]({{< relref "/skills/law/#court-procedures" >}}) <br> [Interacción-Entrevista]({{< relref "/skills/interaction/#interview" >}}) <br> [Resolución-Resolución Mental]({{< relref "/skills/resolve/#mental-resolve" >}})
          flaw: |-
            [Código de Honor]({{< relref "/perks_flaws/#code-of-honor" >}}) (Neutralidad absoluta y adhesión a las estrictas pautas éticas de tu certificación autónoma).
          name: El Psíquico Certificado
          special_ability: |-
            **Árbitro Autónomo:** Tu verificación psiónica es legalmente vinculante. Recibes una bonificación de -1 paso a las tiradas de [Interacción]({{< relref "/skills/interaction/" >}}) o [Ley]({{< relref "/skills/law/" >}}) al actuar como tercero neutral en negociaciones o al hacer valer tu derecho legal a verificar la veracidad de una declaración en el campo.
          tendencies: |-
            **La Verdad Absoluta:** Fuerza una verdad dura o peligrosa a la luz para mantener tu neutralidad absoluta, incluso cuando una mentira educada o un engaño habrían facilitado las cosas para la parte.<br>**El Juez No Deseado:** Complica una situación actuando sobre un crimen o un secreto oscuro que obtuviste de la mente de alguien, usando tu autoridad autónoma para intervenir cuando no era tu lucha.
    url: /backgrounds/certified-psychic/
  corporate-enforcer:
    favored_broad_skill: ''
    localized:
      - en:
          description: |-
            Muscle for megacorporations, specializing in asset protection and dispute resolution.
          equipment: |-
            Armored business suit, high-caliber sidearm.
          favored_perks: |-
            [Reputation]({{< relref "/perks_flaws/#reputation" >}})
          favored_specialty_skills: |-
            [Security-Protection Protocols]({{< relref "/skills/security/#protection-protocols" >}}) <br> [Law-Law Enforcement Procedures]({{< relref "/skills/law/#law-enforcement-procedures" >}}) <br> [Interaction- Intimidate]({{< relref "/skills/interaction/#intimidate" >}}) <br> [Modern Ranged Weapons-Pistol]({{< relref "/skills/modern-ranged-weapons/#pistol" >}})
          flaw: |-
            [Powerful Enemy]({{< relref "/perks_flaws/#powerful-enemy" >}})
          name: The Corporate Enforcer
          special_ability: |-
            **Asset Protection:** -1 step bonus to [Interaction-Intimidate]({{< relref "/skills/interaction/#intimidate" >}}) or [Security]({{< relref "/skills/security/" >}}) when protecting assets.
          tendencies: ''
      - es:
          description: |-
            Músculo para megacorporaciones, especializado en protección de activos y resolución de disputas.
          equipment: |-
            Traje de negocios blindado, arma de mano de alto calibre.
          favored_perks: |-
            [Reputación]({{< relref "/perks_flaws/#reputation" >}})
          favored_specialty_skills: |-
            [Seguridad-Protocolos de Protección]({{< relref "/skills/security/#protection-protocols" >}}) <br> [Derecho-Procedimientos de Aplicación de la Ley]({{< relref "/skills/law/#law-enforcement-procedures" >}}) <br> [Interacción-Intimidar]({{< relref "/skills/interaction/#intimidate" >}}) <br> [Armas a Distancia Modernas- Pistola]({{< relref "/skills/modern-ranged-weapons/#pistol" >}})
          flaw: |-
            [Enemigo Poderoso]({{< relref "/perks_flaws/#powerful-enemy" >}})
          name: El Ejecutor Corporativo
          special_ability: |-
            **Protección de Activos:** Bono de -1 paso a [Interacción-Intimidar]({{< relref "/skills/interaction/#intimidate" >}}) o [Seguridad]({{< relref "/skills/security/" >}}) al proteger activos.
          tendencies: ''
    url: /backgrounds/corporate-enforcer/
  criminal-urchin:
    favored_broad_skill: |-
      [Street Smart]({{< relref "/skills/street-smart/" >}})
    localized:
      - en:
          description: |-
            Life on the streets taught you how to survive, but it left you with a name that the authorities won't forget.
          equipment: |-
            A well-used physical or electronic entry kit, a burner comm-link, a forged low-tier ID, and a reliable street-made weapon (like a shiv or a holdout pistol).
          favored_perks: None.
          favored_specialty_skills: |-
            [Street Smart-Street Knowledge]({{< relref "/skills/street-smart/#street-knowledge" >}}) <br> [Covert Ops-Pickpocket]({{< relref "/skills/covert-ops/#pickpocket" >}}) <br> [Covert Ops-Stealth]({{< relref "/skills/covert-ops/#stealth" >}}) <br> [Deception-Bribe]({{< relref "/skills/deception/#bribe" >}}) <br> [Security- Security Devices]({{< relref "/skills/security/#security-devices" >}})
          flaw: |-
            [Infamy]({{< relref "/perks_flaws/#infamy" >}})
          name: The Criminal / Urchin
          special_ability: |-
            None. (Your raw survival instincts are instead reflected mechanically by receiving a free broad skill to represent your foundational street upbringing).
          tendencies: |-
            **The Opportunist:** Take an unnecessary risk to secure a personal profit or an "angle."<br>**The Paranoiac:** Compromise a plan to ensure you have a clear escape route.
      - es:
          description: |-
            La vida en las calles te enseñó a sobrevivir, pero te dejó con un nombre que las autoridades no olvidarán.
          equipment: |-
            Un kit de entrada físico o electrónico muy usado, un comunicador desechable, una identificación de bajo nivel falsificada y un arma de fabricación callejera fiable (como una navaja o una pistola de bolsillo).
          favored_perks: Ninguna.
          favored_specialty_skills: |-
            [Pillería-Conocimiento Callejero]({{< relref "/skills/street-smart/#street-knowledge" >}}) <br> [Operaciones Encubiertas- Carterista]({{< relref "/skills/covert-ops/#pickpocket" >}}) <br> [Operaciones Encubiertas-Sigilo]({{< relref "/skills/covert-ops/#stealth" >}}) <br> [Engaño- Soborno]({{< relref "/skills/deception/#bribe" >}}) <br> [Seguridad-Dispositivos de Seguridad]({{< relref "/skills/security/#security-devices" >}})
          flaw: |-
            [Infamia]({{< relref "/perks_flaws/#infamy" >}})
          name: El Criminal / Golfillo
          special_ability: |-
            Ninguna. (Tus instintos de supervivencia brutos se reflejan mecánicamente al recibir una habilidad amplia gratuita para representar tu formación fundamental en la calle).
          tendencies: |-
            **El Oportunista:** Asume un riesgo innecesario para asegurar un beneficio personal o una "ventaja".<br>**El Paranoico:** Compromete un plan para asegurar una ruta de escape clara.
    url: /backgrounds/criminal-urchin/
  deserter:
    favored_broad_skill: ''
    localized:
      - en:
          description: |-
            You are a ghost in the machine. You have the reflexes of a soldier but the soul of a fugitive.
          equipment: |-
            A military-grade weapon (with filed-off serial numbers), a rugged survival tent or sleeping roll, and a high-quality fake ident-card.
          favored_perks: |-
            [Reflexes]({{< relref "/perks_flaws/#reflexes" >}})
          favored_specialty_skills: |-
            [Survival-Survival Training]({{< relref "/skills/survival/#survival-training" >}}) <br> [Deception-Bluff]({{< relref "/skills/deception/#bluff" >}}) <br> [Covert Ops-Conceal]({{< relref "/skills/covert-ops/#conceal" >}})
          flaw: |-
            [Powerful Enemy]({{< relref "/perks_flaws/#powerful-enemy" >}}) (The entity you abandoned).
          name: The Deserter
          special_ability: |-
            **Safehouse Intuition:** You have a -1 step bonus to find makeshift shelter, black-market supplies, or sympathetic contacts in hostile territory.
          tendencies: |-
            **The Pragmatic Escape:** Abandon a cause when the risks become "unacceptable" to ensure your survival.<br>**The Hidden Hand:** Pass up fame or reward to ensure your identity remains undiscovered.
      - es:
          description: |-
            Hiciste el juramento, recibiste el entrenamiento y luego viste la verdad. Abandonaste tu puesto porque ya no podías justificar las órdenes que te daban. Ahora eres un fugitivo, o al menos un paria, que vive con el peso de lo que dejaste atrás.
          equipment: |-
            Partes de un uniforme militar despojado de insignias, un arma de autodefensa básica, una identificación falsa de baja calidad y un pequeño recuerdo personal de tu antigua unidad.
          favored_perks: |-
            [Observador]({{< relref "/perks_flaws/#observant" >}})
          favored_specialty_skills: |-
            [Supervivencia-Supervivencia en el Desierto]({{< relref "/skills/survival/#wilderness-survival" >}}) <br> [Operaciones Encubiertas-Sigilo]({{< relref "/skills/covert-ops/#stealth" >}}) <br> [Resolución-Resolución Física]({{< relref "/skills/resolve/#physical-resolve" >}}) <br> [Conciencia-Intuición]({{< relref "/skills/awareness/#intuition" >}})
          flaw: |-
            [Infamia]({{< relref "/perks_flaws/#infamy" >}}) (Desertor)
          name: El Desertor
          special_ability: |-
            **Instinto de Supervivencia:** Bono de -1 paso en tiradas de Supervivencia o Sigilo cuando eres perseguido activamente por autoridades.
          tendencies: |-
            **La Fuga Pragmática:** Abandona una causa cuando los riesgos se vuelven "inaceptables" para asegurar tu supervivencia.<br>**La Mano Oculta:** Renuncia a la fama o la recompensa para asegurar que tu identidad permanezca sin descubrir.
    url: /backgrounds/deserter/
  diplomat:
    favored_broad_skill: ''
    localized:
      - en:
          description: |-
            You were raised in the halls of power, where protocol is a weapon and reputation is everything.
          equipment: |-
            A tailored high-society suit, an encrypted datapad with a localized legal codex, and a ceremonial or easily concealable sidearm.
          favored_perks: |-
            [Reputation]({{< relref "/perks_flaws/#reputation" >}})
          favored_specialty_skills: |-
            [Culture-Etiquette]({{< relref "/skills/culture/#etiquette-specific" >}}) <br> [Administration-Bureaucracy]({{< relref "/skills/administration/#bureaucracy" >}}) <br> [Interaction-Charm]({{< relref "/skills/interaction/#charm" >}}) <br> [Interaction-Bargain]({{< relref "/skills/interaction/#bargain" >}})
          flaw: None.
          name: The Diplomat
          special_ability: |-
            **Diplomatic Immunity:** In settled systems, you are often exempt from minor local laws and routine searches while on official business. This immunity extends strictly to your person and your personal cabin aboard a vessel, unless the ship itself is registered as a diplomatic transport. You receive a -1 step bonus to checks involving legal navigation.
          tendencies: |-
            **The Mediator:** Attempt to resolve a hostile situation through negotiation even when combat is easier.<br>**The Architect:** Delay action to ensure every social variable or consequence is accounted for.
      - es:
          description: |-
            Estás entrenado para hablar el lenguaje del poder y el protocolo. Ya sea representando a una megacorporación o a un gobierno planetario, tu trabajo es evitar guerras (o iniciarlas) con las palabras adecuadas en el momento adecuado.
          equipment: |-
