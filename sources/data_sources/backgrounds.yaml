          flaw: |-
            [Endeudado]({{< relref "/perks_flaws/#debt-ridden" >}}) (Debes una deuda masiva por tu nave. A diferencia de otras desventajas, esta no se puede comprar con XP durante el avance del personaje; solo se puede eliminar pagando físicamente al acreedor en el juego. Además, si no realizas un pago, el acreedor puede hacer demandas, obligándote a aceptar trabajos peligrosos o a favorecer sus intereses para conservar la nave).
          name: El Propietario de Nave
