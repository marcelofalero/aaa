          tendencies: |-
            **The Aesthete:** Choose a course of action based purely on its aesthetic appeal or dramatic flair rather than its tactical soundness or efficiency.<br>**The Diva:** Refuse to cooperate or compromise with the party until your specific, often petty, demands regarding comfort or artistic integrity are met.
