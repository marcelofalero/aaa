items:
  alien-artifact:
    cost: '8'
    ability: —
    type: Special
    localized:
      - en:
          name: Alien Artifact
          description: |-
            An alien artifact is a strange device or relic that the character doesn't know anything about. It could be an object of alien origin, a one-of-a-kind experimental gadget, or even an experimental process used on the character at some point in the past. Somewhere in his travels, the character came to possess the artifact. Any alien artifact that is an item is small enough to be easily carried around or worn. The character doesn't know his item's function or purpose; he has to discover exactly what the artifact does as the campaign progresses. As a perk, an alien artifact provides mostly advantages—but every artifact also has its negative side. Some provide a constant benefit; others require that the character make a perk check to activate the artifact. An artifact’s negative side can be a flaw that manifests when the character least expects it; the downside can also be the simple fact that alien artifacts are extremely rare, exceedingly valuable, and highly coveted. Someone wants the one your character possesses, and will stop at nothing to get it. Alien artifacts are listed and described in the Gamemaster Guide. After you select this perk, the Gamemaster will design an alien artifact for your character.
      - es:
          name: Artefacto alienígena
          description: |-
            Un artefacto alienígena es un dispositivo o reliquia extraño del que el personaje no sabe nada. Podría ser un objeto de origen extraterrestre, un dispositivo experimental único en su tipo o incluso un proceso experimental utilizado en el personaje en algún momento del pasado. En algún momento de sus viajes, el personaje llegó a poseer el artefacto. Cualquier artefacto alienígena que sea un objeto es lo suficientemente pequeño como para transportarlo o usarlo fácilmente. El personaje no conoce la función o el propósito de su objeto; tiene que descubrir exactamente qué hace el artefacto a medida que avanza la campaña. Como ventaja, un artefacto alienígena ofrece principalmente beneficios, pero cada artefacto también tiene su lado negativo. Algunos proporcionan una ventaja constante; otros requieren que el personaje haga una prueba de ventaja para activar el artefacto. El lado negativo de un artefacto puede ser un defecto que se manifiesta cuando el personaje menos lo espera; La desventaja también puede ser el simple hecho de que los artefactos alienígenas son extremadamente raros, sumamente valiosos y muy codiciados. Alguien quiere el que posee tu personaje y no se detendrá ante nada para conseguirlo. Los artefactos alienígenas se enumeran y describen en la Guía del Gamemaster. Después de seleccionar esta ventaja, el Gamemaster diseñará un artefacto alienígena para tu personaje.
  ambidextrous:
    cost: '4'
    ability: DEX
    type: Active
    localized:
      - en:
          name: Ambidextrous  
          description: |-
            A character with this perk can use both hands at the same time with more ease than someone who is not ambidextrous. A character without this perk suffers penalties when using his off hand or when attempting to use two weapons in combat. (See “Attacking with Two Weapons" on page 57 in Chapter 3: characters in Action.) With this perk, the penalty for the action using the off hand is reduced to +2 steps, and the penalty for the primary hand is eliminated.
      - es:
          name: Ambidextro
          description: |-
            Un personaje con esta ventaja puede usar ambas manos al mismo tiempo con más facilidad que alguien que no sea ambidiestro. Un personaje sin esta ventaja sufre penalizaciones cuando usa su mano izquierda o cuando intenta usar dos armas en combate. (Consulta “Atacar con dos armas" en la página 57 en el Capítulo 3: personajes en acción). Con esta ventaja, la penalización por la acción con la mano torpe se reduce a +2 pasos y la penalización por la mano principal se elimina.
  animal-friend:
    cost: '4'
    ability: WIL
    type: Conscious
    localized:
      - en:
          name: Animal Friend
          description: |-
            Animals of all kinds innately trust a character who has this perk. The character can easily befriend animals, and he makes all encounter rolls involving normal animals with a -2 bonus (use the situation modifiers for the Animal Handling skill, page 91). The character makes Animal Handling skill checks with a -1 bonus, in addition to other modifiers that may apply. This bonus has the effect of making it possible for the character to train an animal in less time than would be needed by a character who does not have this perk. The perk has no effect on sentient or unintelligent creatures.
      - es:
          name: Amigo animal
          description: |-
            Los animales de todo tipo confían de forma innata en un personaje que tiene esta ventaja. El personaje puede hacerse amigo de los animales fácilmente y realiza todas las tiradas de encuentro que involucren animales normales con una bonificación de -2 (usa los modificadores de situación para la habilidad Manejo de animales, página 91). El personaje realiza pruebas de habilidad de Manejo de animales con una bonificación de -1, además de otros modificadores que puedan aplicarse. Esta bonificación tiene el efecto de hacer posible que el personaje entrene a un animal en menos tiempo del que necesitaría un personaje que no tiene esta ventaja. la ventaja no tiene ningún efecto sobre criaturas sensibles o poco inteligentes.
  celebrity:
    cost: '3'
    ability: PER
    type: Conscious
    localized:
      - en:
          name: Celebrity
          description: |-
            This perk indicates that the character is famous in certain circles, as chosen by the player and Gamemaster. The character can be an entertainment celebrity, a renowned scientist, doctor, or war character, or he can enjoy celebrity status for another reason that the Gamemaster approves. In a circumstance when a character’s Celebrity might have an effect, the Gamemaster may call for a perk check at the start of a scene to determine if the perk makes any difference in what's about to happen. A movie star may be adored by those who watch his films, but his celebrity status means nothing to those who have never seen a movie or read a personality profile of the star. Check results: Critical Failure, celebrity status backfires and the character is mobbed by the crowd; Failure, +2 penalty to any Personality-based skill checks made by the character during the upcoming scene; Marginal, no modifier; Ordinary, -1 bonus; Good, -2 bonus; Amazing, -3 bonus. As a celebrity’s achievement level improves, so does the bonus applied to the perk check: At level 5, the base situation die for any Celebrity check becomes -d4; at level 10 it becomes -d6; and at level 15 it becomes -d8.
      - es:
          name: Celebridad
          description: |-
            Esta ventaja indica que el personaje es famoso en ciertos círculos, según lo elegido por el jugador y el Gamemaster. El personaje puede ser una celebridad del entretenimiento, un científico de renombre, un médico o un personaje de guerra, o puede disfrutar del estatus de celebridad por otra razón que el Gamemaster apruebe. En una circunstancia en la que la celebridad de un personaje pueda tener un efecto, el Gamemaster puede solicitar una verificación de ventajas al comienzo de una escena para determinar si la ventaja hace alguna diferencia en lo que está a punto de suceder. Una estrella de cine puede ser adorada por quienes ven sus películas, pero su estatus de celebridad no significa nada para aquellos que nunca han visto una película o leído el perfil de personalidad de la estrella. Compruebe los resultados: fracaso crítico, el estatus de celebridad resulta contraproducente y el personaje es acosado por la multitud; Fallo, penalización de +2 a cualquier prueba de habilidad basada en la Personalidad realizada por el personaje durante la siguiente escena; Marginal, sin modificador; Ordinario, bonificación -1; Bien, bonificación -2; Increíble, bonificación de -3. A medida que mejora el nivel de logros de una celebridad, también mejora la bonificación aplicada a la prueba de ventajas: en el nivel 5, el dado de situación base para cualquier prueba de Celebridad se convierte en -d4; en el nivel 10 pasa a ser -d6; y en el nivel 15 se convierte en -d8.
  concentration:
    cost: '3'
    ability: INT
    type: Conscious
    localized:
      - en:
          name: Concentration
          description: |-
            This perk provides a character with the ability to concentrate on the task at hand. By using it as an action, the character makes a Concentration check to improve a stated task that he wants to attempt as his next action. On a Failure result, the character's next action is made with no modifier for Concentration. On an Ordinary, his ability to concentrate provides him a -1 bonus; Good, -2 bonus; Amazing, -3 bonus. If a character is disturbed in any way prior to attempting the stated task, the Concentration perk bonus is lost.
      - es:
          name: Concentración
          description: |-
            Esta ventaja proporciona al personaje la capacidad de concentrarse en la tarea que tiene entre manos. Al usarlo como acción, el personaje realiza una prueba de Concentración para mejorar una tarea establecida que quiere intentar como su próxima acción. Con un resultado de Fracaso, la siguiente acción del personaje se realiza sin modificador de Concentración. En un Ordinario, su capacidad de concentración le proporciona una bonificación de -1; Bien, bonificación -2; Increíble, bonificación -3. Si un personaje es molestado de alguna manera antes de intentar la tarea indicada, la bonificación de concentración se pierde.
  danger-sense:
    cost: '4'
    ability: WIL
    type: Active
    localized:
      - en:
          name: Danger Sense
          description: |-
            This perk provides a character with the innate ability to anticipate danger. This translates as a -2 bonus to all Awareness—intuition checks.
      - es:
          name: Sentido de peligro
          description: |-
            Esta ventaja proporciona al personaje la capacidad innata de anticipar el peligro. Esto se traduce en un bonificador -2 a todas las pruebas de Conciencia e intuición.
  faith:
    cost: '5'
    ability: WIL
    type: Conscious
    localized:
      - en:
          name: Faith
          description: |-
            This perk provides a character with belief in either himself or a power or agency greater than himself. The player must select what the character has faith in and the basic tenets of that faith. Examples include a nation, a religion, or a specific organization. This faith must be strong and all-encompassing. The character must truly be fervent in his belief in this faith, not just be a casual observer of form and ritual. A character with this perk who doesn't show extreme devotion loses the benefits it provides. The first time the Faith perk is called upon during an adventure, the character’s base situation die for the perk check is -d4. Each additional use of this perk in the same adventure receives a cumulative +1 penalty. The moment a character fails a perk check, he can't call upon the benefits of this perk until the next adventure or the next game session, as determined by the Gamemaster. With the Faith perk, a character can appear to perform miracles when the perk is used in conjunction with a skill that doesn't go against the tenets of the character's faith. For example, a member of the clergy can call on Faith to help him solve a problem, apply medical aid to a character, or settle a dispute, but the benefits can't be applied to firing a weapon at a living foe. The benefits of Faith depend on a perk check: On a Critical Failure, the character fails not only the perk check but the skill check that follows it, and this perk can't be used again until the next adventure or game session (as the Gamemaster determines). On a Failure, the perk provides no benefit and it can't be used again until the next adventure or game session (as the Gamemaster determines). On an Ordinary, the result of the character’s subsequent skill check is improved by one degree of success. On a Good, the next skill check result is improved by two degrees of success. On an Amazing, the next skill check result is improved by three degrees of success. (Of course, a result can never be improved to any degree greater than Amazing.)
            **Example:** The weren shaman Gorrarl must apply first aid to a badly wounded companion. He calls on his Faith perk first, achieving a Good on the perk check. This grants him an improvement of two degrees of success on his first aid check result. The dice indicate that his first aid check is a Critical Failure, but because of his perk it instead becomes an Ordinary.
      - es:
          name: Fe
          description: |-
            Esta ventaja le proporciona al personaje la confianza en sí mismo o en un poder o agencia mayor que él mismo. El jugador debe seleccionar en qué tiene fe el personaje y los principios básicos de esa fe. Los ejemplos incluyen una nación, una religión o una organización específica. Esta fe debe ser fuerte y abarcadora. El personaje debe ser verdaderamente ferviente en su creencia en esta fe, no ser simplemente un observador casual de las formas y los rituales. Un personaje con esta ventaja que no muestra una devoción extrema pierde las ventajas que proporciona. La primera vez que se invoca la ventaja Fe durante una aventura, la situación base del personaje para la prueba de ventaja es -d4. Cada uso adicional de esta ventaja en la misma aventura recibe una penalización acumulativa de +1. En el momento en que un personaje falla una prueba de ventaja, no puede recurrir a los beneficios de esta ventaja hasta la siguiente aventura o la siguiente sesión de juego, según lo determine el director del juego. Con la ventaja Fe, un personaje puede parecer que realiza milagros cuando la ventaja se usa junto con una habilidad que no va en contra de los principios de la fe del personaje. Por ejemplo, un miembro del clero puede recurrir a Faith para que le ayude a resolver un problema, aplicar ayuda médica a un personaje o resolver una disputa, pero las ventajas no se pueden aplicar a disparar un arma contra un enemigo vivo. las ventajas de Faith dependen de una prueba de ventaja: en un fallo crítico, el personaje no sólo falla la prueba de ventaja sino también la prueba de habilidad que le sigue, y esta ventaja no se puede volver a utilizar hasta la siguiente aventura o sesión de juego (según lo determine el Gamemaster). En caso de fallo, la ventaja no proporciona ninguna ventaja y no se puede volver a utilizar hasta la siguiente aventura o sesión de juego (según lo determine el director del juego). En un Ordinario, el resultado de la siguiente prueba de habilidad del personaje mejora en un grado de éxito. Si es Bueno, el resultado de la siguiente prueba de habilidad mejora en dos grados de éxito. En un Asombroso, el resultado de la siguiente prueba de habilidad mejora en tres grados de éxito. (Por supuesto, un resultado nunca puede mejorarse en ningún grado mayor que Asombroso.)
            **Ejemplo:** El chamán hombre Gorrarl debe aplicar primeros auxilios a un compañero gravemente herido. Primero recurre a su ventaja Fe y logra un Bien en la prueba de ventaja. Esto le otorga una mejora de dos grados de éxito en el resultado de su prueba de primeros auxilios. Los dados indican que su prueba de primeros auxilios es un Fallo Crítico, pero debido a su ventaja se convierte en Ordinaria.
  filthy-rich:
    cost: '6'
    ability: PER
    type: Conscious
    localized:
      - en:
          name: Filthy Rich
          description: |-
            This perk suggests a lot about a character’s background and usually indicates a connection to a wealthy (and perhaps influential) family. This perk influences a character's starting funds, as described in Chapter 9: Goods & Services. If the character ever needs to acquire funds, he can make a Filthy Rich check (with the permission of the Gamemaster). Failure indicates that the funds aren't forthcoming; an Ordinary or better indicates that the funds he needs are available. The more the character asks for, however, the greater the situation die penalty. Finally, Filthy Rich characters have other advantages due to their social and financial status. This translates into a bonus to Personality-based skills when the character decides to reveal his status. A perk check is made at the start of a scene. Results follow: On a Critical Failure, the character’s status backfires, resulting in a +1 penalty to all checks related to Personality skills; Failure, no effect; Ordinary, -1 bonus; Good, -2 bonus; Amazing, -3 bonus. The Gamemaster can determine that in some situations the Filthy Rich perk can operate as a flaw—especially among those who have a strong dislike for the wealthy and the upper classes. If a character reveals his status in such a situation, perk check results become penalties instead of bonuses (or vice versa).
      - es:
          name: Asquerosamente rico
          description: |-
            Esta ventaja sugiere mucho sobre los antecedentes de un personaje y generalmente indica una conexión con una familia rica (y quizás influyente). Esta ventaja influye en los fondos iniciales de un personaje, como se describe en el Capítulo 9: Bienes y servicios. Si el personaje alguna vez necesita adquirir fondos, puede realizar una prueba de Asquerosamente Rico (con el permiso del Director de Juego). El fracaso indica que los fondos no llegan; un Ordinario o mejor indica que los fondos que necesita están disponibles. Sin embargo, cuanto más pide el personaje, mayor será la penalización de la situación. Finalmente, los personajes Filthy Rich tienen otras ventajas debido a su estatus social y financiero. Esto se traduce en una bonificación a las habilidades basadas en la personalidad cuando el personaje decide revelar su estado. Se realiza una verificación de ventajas al comienzo de una escena. A continuación se muestran los resultados: ante un fallo crítico, el estado del personaje resulta contraproducente, lo que resulta en una penalización de +1 a todas las pruebas relacionadas con las habilidades de personalidad; Fracaso, ningún efecto; Ordinario, bonificación -1; Bien, bonificación -2; Increíble, bonificación -3. El Gamemaster puede determinar que en algunas situaciones la ventaja Asquerosamente rico puede funcionar como un defecto, especialmente entre aquellos que sienten una fuerte aversión por los ricos y las clases altas. Si un personaje revela su estado en tal situación, los resultados de la prueba de ventajas se convierten en penalizaciones en lugar de bonificaciones (o viceversa).
  fists-of-iron:
    cost: 2/5
    ability: STR
    type: Active
    localized:
      - en:
          name: Fists of Iron
          description: |-
            This perk provides a character with a 1-point increase to the damage he inflicts on a successful Unarmed Attack skill check. The use of this perk requires a perk check at the start of a combat scene. This check requires the character to spend one action concentrating to increase the power of his punches. A character with the power martial arts specialty skill can spend 5 skill points for Improved Fists of Iron. The result of the check determines his bonus for the scene: Critical Failure, no benefit; Marginal, 1-point increase to damage; Ordinary, 2-point increase; Good, 3-point increase; Amazing, 4-point increase.
            **Example:** A character normally dishes out d4s/d4+2s/d6+2s in damage when he makes an Unarmed Attack. If that same character has Fists of Iron, he inflicts d4+1s/d4+3s/d6+3s. With Improved Fists of Iron, the damage can be as high as d4+4s/d4+6s/ d6+6s on an Amazing perk check result.
      - es:
          name: Puños de hierro
          description: |-
            Esta ventaja proporciona al personaje un aumento de 1 punto en el daño que inflige al superar con éxito una prueba de habilidad de Ataque desarmado. El uso de esta ventaja requiere una verificación de ventaja al comienzo de una escena de combate. Esta prueba requiere que el personaje gaste una acción concentrándose para aumentar el poder de sus golpes. Un personaje con la habilidad especializada en artes marciales de poder puede gastar 5 puntos de habilidad en Puños de Hierro mejorados. El resultado de la prueba determina su bonificación para la escena: Fallo crítico, sin ventaja; Marginal, aumento de 1 punto al daño; Ordinario, aumento de 2 puntos; Bueno, aumento de 3 puntos; Increíble aumento de 4 puntos.
            **Ejemplo:** Un personaje normalmente inflige daño d4s/d4+2s/d6+2s cuando realiza un ataque sin armas. Si ese mismo personaje tiene Puños de Hierro, inflige d4+1s/d4+3s/d6+3s. Con Puños de Hierro mejorados, el daño puede ser tan alto como d4+4s/d4+6s/ d6+6s con un resultado de prueba de ventaja Increíble.
  fortitude:
    cost: '4'
    ability: CON
    type: Active
    localized:
      - en:
          name: Fortitude
          description: |-
            A character with Fortitude receives a -1 bonus whenever he is required to make a Stamina-endurance check.
      - es:
          name: Fortaleza
          description: |-
            Un personaje con Fortaleza recibe una bonificación de -1 cada vez que se le pide que realice una prueba de resistencia.
  good-luck:
    cost: '3'
    ability: WIL
    type: Conscious
    localized:
      - en:
          name: Good Luck
          description: |-
            A character with the Good Luck perk can make use of this benefit once during a scene. Immediately before attempting some other type of action (usually a skill check, an action check, or a feat check), the character can make a Good Luck perk check. The result of this check provides a modifier to the next activity the character undertakes: On a Critical Failure, bad luck occurs instead, and the character takes a +3 penalty. On a Marginal success, his next activity receives a -1 bonus; Ordinary, -2 bonus; Good, -3 bonus; and Amazing, -4 bonus.
      - es:
          name: Buena suerte
          description: |-
            Un personaje con la ventaja Buena Suerte puede hacer uso de esta ventaja una vez durante una escena. Inmediatamente antes de intentar algún otro tipo de acción (normalmente una prueba de habilidad, una prueba de acción o una prueba de hazaña), el personaje puede realizar una prueba de la ventaja de Buena Suerte. El resultado de esta prueba proporciona un modificador a la siguiente actividad que emprende el personaje: en caso de un Fallo Crítico, ocurre mala suerte y el personaje sufre una penalización de +3. Con un éxito marginal, su siguiente actividad recibe una bonificación de -1; Ordinario, bonificación -2; Bien, bonificación -3; y Sorprendente, bonificación -4.
  great-looks:
    cost: '3'
    ability: PER
    type: Active
    localized:
      - en:
          name: Great Looks
          description: |-
            A character with the Great Looks perk receives a -1 bonus to any Personality-based skill check made when his appearance could have a positive effect on an encounter. Bear in mind that a human character's great looks might not impress an alien, and even some other human cultures may have a different idea of what Great Looks are—it's a very subjective perk. The Gamemaster determines when the perk's bonus is applied and when it isn't.
      - es:
          name: Gran apariencia
          description: |-
            Un personaje con la ventaja Gran apariencia recibe una bonificación de -1 a cualquier prueba de habilidad basada en la personalidad realizada cuando su apariencia podría tener un efecto positivo en un encuentro. Tenga en cuenta que la gran apariencia de un personaje humano puede no impresionar a un extraterrestre, e incluso algunas otras culturas humanas pueden tener una idea diferente de lo que es la gran apariencia; es una ventaja muy subjetiva. El Gamemaster determina cuándo se aplica la bonificación de la ventaja y cuándo no.
  heightened-ability:
    cost: '10'
    ability: Special
    type: Active
    localized:
      - en:
          name: Heightened Ability
          description: |-
            This perk provides a character with 1 extra point in the Ability Score of his choice. It can't be used to increase any Ability Score beyond the character’s species maximum. When this perk is purchased, the player raises the character’s Ability Score by 1 point, adjusting the Ability’s resistance modifier and any bonuses if necessary.
      - es:
          name: Mayor capacidad
          description: |-
            Esta ventaja proporciona al personaje 1 punto extra en la puntuación de habilidad de su elección. No se puede utilizar para aumentar ninguna puntuación de habilidad más allá del máximo de especie del personaje. Cuando se compra esta ventaja, el jugador aumenta la puntuación de habilidad del personaje en 1 punto, ajustando el modificador de resistencia de la habilidad y cualquier bonificación si es necesario.
  observant:
    cost: '3'
    ability: WIL
    type: Active
    localized:
      - en:
          name: Observant
          description: |-
            This perk provides a character with exceptional powers of observation, giving him a -1 bonus to any Awareness-perception check.
      - es:
          name: Observante
          description: |-
            Esta ventaja proporciona al personaje poderes excepcionales de observación, lo que le otorga un bono de -1 a cualquier prueba de percepción de Conciencia.
  photo-memory:
    cost: '3'
    ability: INT
    type: Conscious
    localized:
      - en:
          name: Photo Memory
          description: |-
            This perk gives a character an extraordinary memory. When a player wants to determine what his character remembers, or if he wants his character to remember a specific detail (such as a license plate number or details of a document he glanced at), then a perk check is made. An Ordinary is usually enough to provide some of the details the character wants. The Gamemaster sets the situation die according to the type of detail and memory the character is trying to recall. For example, an attempt to remember something the character knows extremely well might receive a -3 bonus or might not even require a check at all, while recalling the image of a face glimpsed briefly in the dark might receive a +3 penalty.
      - es:
          name: Memoria fotográfica
          description: |-
            Esta ventaja le da al personaje un recuerdo extraordinario. Cuando un jugador quiere determinar qué recuerda su personaje, o si quiere que su personaje recuerde un detalle específico (como el número de placa o los detalles de un documento que miró), se realiza una verificación de ventajas. Un Ordinario suele ser suficiente para proporcionar algunos de los detalles que desea el personaje. El director de juego establece la situación de acuerdo con el tipo de detalle y recuerdo que el personaje intenta recordar. Por ejemplo, un intento de recordar algo que el personaje sabe muy bien puede recibir una bonificación de -3 o puede que ni siquiera requiera ninguna prueba, mientras que recordar la imagen de una cara vislumbrada brevemente en la oscuridad puede recibir una penalización de +3.
  powerful-ally:
    cost: '4'
    ability: PER
    type: Conscious
    localized:
      - en:
          name: Powerful Ally
          description: |-
            When this perk is selected, the Gamemaster and the player should discuss the nature and identity of this ally. There might also be some sort of cost involved for the continued assistance of an ally—the ally might be the character's patron, who can call on the character for help as often as the character calls on him, or the ally might just collect favors and call them in at some future time. When in trouble, a character can call on his Powerful Ally for favors or help. A perk check determines what kind of aid the ally provides. Bear in mind that the character needs a way to contact his ally, and the ally needs a way to respond. Check results: Failure, no aid is forthcoming; Ordinary, Ordinary help; Good, Good help; Amazing, Amazing help. (These terms are defined in the Gamemaster Guide.)
      - es:
          name: Poderoso aliado
          description: |-
            Cuando se selecciona esta ventaja, el Gamemaster y el jugador deben discutir la naturaleza y la identidad de este aliado. También puede haber algún tipo de costo involucrado por la asistencia continua de un aliado: el aliado podría ser el patrón del personaje, quien puede pedir ayuda al personaje tan a menudo como el personaje lo pide, o el aliado podría simplemente recolectar favores y llamarlos en algún momento futuro. Cuando está en problemas, un personaje puede pedir favores o ayuda a su poderoso aliado. Una verificación de ventajas determina qué tipo de ayuda proporciona el aliado. Tenga en cuenta que el personaje necesita una manera de contactar a su aliado, y el aliado necesita una manera de responder. Compruebe los resultados: Fallo, no llega ayuda; Ayuda ordinaria, ordinaria; Bien, buena ayuda; Increíble, increíble ayuda. (Estos términos están definidos en la Guía del Gamemaster).
  psionic-awareness:
    cost: '3'
    ability: INT
    type: Active
    localized:
      - en:
          name: Psionic Awareness
          description: |-
            This perk allows a character to purchase ranks in the Awareness - Psionic Sense specialty skill, enabling them to detect and identify psionic powers and phenomena. The skill is also treated as favored, reducing its cost by one. This perk is only useful for characters without psionic abilities. This perk can only be selected if the Gamemaster allows the use of psionics.
      - es:
          name: Conciencia psiónica
          description: |-
            Esta ventaja permite a un personaje comprar rangos en la habilidad de especialidad Conciencia - Sentido Psiónico, lo que le permite detectar e identificar poderes y fenómenos psiónicos. La habilidad también se considera favorecida, reduciendo su costo en uno. Esta ventaja solo es útil para personajes sin habilidades psiónicas. Esta ventaja solo se puede seleccionar si el Gamemaster permite el uso de psiónicos.
  reflexes:
    cost: '4'
    ability: DEX
    type: Active
    localized:
      - en:
          name: Reflexes
          description: |-
            A character with the Reflexes perk receives a +1 increase to his Dexterity resistance modifier. So, a character with a Dexterity score of 11 who has a resistance modifier of +1 step increases the modifier to +2 steps with this perk.
      - es:
          name: Reflejos
          description: |-
            Un personaje con la ventaja Reflejos recibe un aumento de +1 en su modificador de resistencia a Destreza. Entonces, un personaje con una puntuación de Destreza de 11 que tiene un modificador de resistencia de +1 paso aumenta el modificador a +2 pasos con esta ventaja.
  reputation:
    cost: '3'
    ability: WIL
    type: Active
    localized:
      - en:
          name: Reputation
          description: |-
            This perk provides a character with a reputation that's known far and wide. Unlike the Celebrity, perk, which indicates a positive reaction due to the influence of a character’s Personality, the Reputation perk helps a character by making others fearful of or impressed by his supposed accomplishments. In game terms, this perk provides a situation die bonus whenever the character attempts to use certain encounter skills. The player and the Gamemaster need to work out just what the character's reputation is, and which encounter skills it provides a bonus to. As a character’s achievement level improves, he becomes better able to take advantage of his reputation: At level 5, the base situation die for any Reputation perk check becomes -d4; at level 10 it becomes -d6; and at level 15 it becomes -d8.
      - es:
          name: Reputación
          description: |-
            Esta ventaja proporciona al personaje una reputación conocida en todas partes. A diferencia de la ventaja Celebridad, que indica una reacción positiva debido a la influencia de la Personalidad de un personaje, la ventaja Reputación ayuda al personaje al hacer que otros teman o se impresionen por sus supuestos logros. En términos de juego, esta ventaja proporciona una bonificación de dado de situación cada vez que el personaje intenta usar ciertas habilidades de encuentro. El jugador y el director de juego deben determinar cuál es la reputación del personaje y a qué habilidades de encuentro proporciona una bonificación. A medida que mejora el nivel de logro de un personaje, éste se vuelve más capaz de aprovechar su reputación: en el nivel 5, el dado de situación base para cualquier prueba de ventaja de reputación se convierte en -d4; en el nivel 10 pasa a ser -d6; y en el nivel 15 se convierte en -d8.
  specialty-skill-focus-skill:
    cost: '5'
    ability: —
    type: Special
    localized:
      - en:
          name: Specialty Skill Focus (Skill)
          description: |-
            This perk alters how rank benefits are earned for a specific specialty skill. A character with this perk is always one rank benefit ahead in their chosen skill. For example, if a skill provides benefits at ranks 2, 5, and 7, and the character has 3 ranks in that skill, they already enjoy the benefits for both rank 2 and rank 5. If they later increase the skill to rank 5, they instead gain the rank 7 benefit. If no further benefits can be earned, the character instead receives a permanent -1 step bonus to all checks with that skill. Not all rank benefits can be earned ahead of time; those that are restricted are typically marked with a hollow bullet convention ○ instead of the standard ⊗ or a specific rank-based header. This perk costs 5 points, requires 3 ranks in the chosen specialty skill, Seasoned rank, and is considered favored if the chosen specialty skill is favored by the character's profession.
      - es:
          name: Enfoque en Habilidad de Especialidad (Habilidad)
          description: |-
            Esta ventaja altera cómo se obtienen las ventajas de rango para una habilidad de especialidad específica. Un personaje con esta ventaja siempre está una ventaja de rango por delante en su habilidad elegida. Por ejemplo, si una habilidad ofrece ventajas en los rangos 2, 5 y 7, y el personaje tiene rango 3, ya disfruta de las ventajas de los rangos 2 y 5. Si luego aumenta la habilidad al rango 5, en su lugar obtiene la ventaja del rango 7. Si no quedan más ventajas por obtener, el personaje recibe una bonificación permanente de -1 paso a todas las tiradas con esa habilidad. No todos las ventajas de rango pueden obtenerse por adelantado; aquellos que están restringidos suelen estar marcados con una convención de bala hueca ○ en lugar de la estándar ⊗ o un encabezado de rango específico. Esta ventaja cuesta 5 puntos, requiere 3 rangos en la habilidad de especialidad elegida, el rango de Experimentado (Seasoned), y se considera favorecida si la habilidad de especialidad elegida es favorecida por la profesión del personaje.
  tough-as-nails:
    cost: '4'
    ability: STR
    type: Active
    localized:
      - en:
          name: Tough as Nails
          description: |-
            This perk provide a character with a +1 step increase to his Strength resistance modifier. So, a character with a Strength score of 11 who has a resistance modifier of +1 step (the penalty to his opponent's rolls) increases the modifier to +2 steps with this perk.
      - es:
          name: Duro como las uñas
          description: |-
            Esta ventaja proporciona al personaje un aumento de +1 paso en su modificador de resistencia a la Fuerza. Entonces, un personaje con una puntuación de Fuerza de 11 que tiene un modificador de resistencia de +1 paso (la penalización a las tiradas de su oponente) aumenta el modificador a +2 pasos con esta ventaja.
  vigor:
    cost: 2/3/4
    ability: CON
    type: Active
    localized:
      - en:
          name: Vigor
          description: |-
            This perk allows a character to increase the amount of damage he can sustain.
            * For 2 skill points, a character can increase his stun rating by 1 point.
            * For 3 skill points, a character can increase his wound rating by 1 point.
            * For 4 skill points, a character can increase his mortal rating and his fatigue rating by 1 point each. Each of these benefits may be purchased once. So, if a character spends 9 skill points, he can increase all of his durability ratings (stun, wound, mortal, and fatigue) by 1 point each.
      - es:
          name: Vigor
          description: |-
            Esta ventaja permite a un personaje aumentar la cantidad de daño que puede soportar.
            * Por 2 puntos de habilidad, un personaje puede aumentar su índice de aturdimiento en 1 punto.
            * Por 3 puntos de habilidad, un personaje puede aumentar su índice de heridas en 1 punto.
            * Por 4 puntos de habilidad, un personaje puede aumentar su índice mortal y su índice de fatiga en 1 punto cada uno. Cada uno de estos ventajas se puede comprar una vez. Entonces, si un personaje gasta 9 puntos de habilidad, puede aumentar todos sus índices de durabilidad (aturdimiento, herida, mortal y fatiga) en 1 punto cada uno.
  willpower:
    cost: '4'
    ability: WIL
    type: Active
    localized:
      - en:
          name: Willpower
          description: |-
            This perk provides a character with a +1 step increase to his Will resistance modifier. So, a character with a Will score of 11 who has a resistance modifier of +1 step (the penalty to his opponent’s rolls) increases the modifier to +2 steps with this perk.
      - es:
          name: Fuerza de voluntad
          description: |-
            Esta ventaja proporciona al personaje un aumento de +1 paso en su modificador de resistencia a la voluntad. Entonces, un personaje con una puntuación de Voluntad de 11 que tiene un modificador de resistencia de +1 paso (la penalización a las tiradas de su oponente) aumenta el modificador a +2 pasos con esta ventaja.
  extra-psionic-energy:
    cost: '3'
    ability: WIL
    type: Active
    localized:
      - en:
          name: Extra Psionic Energy
          description: |-
            This perk provides a character with 2 extra Psionic Energy Points (PP). This perk can only be purchased once.
      - es:
          name: Energía Psiónica Extra
          description: |-
            Esta ventaja proporciona al personaje 2 Puntos de Energía Psiónica (PP) adicionales. Esta ventaja solo puede comprarse una vez.
