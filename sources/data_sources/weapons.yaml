              name: Sword, short
              description: |-
                A versatile close-quarters weapon. Reliable for both thrusting and
                slashing.
          - es:
              name: Espada corta
              description: |-
                Un arma versátil para espacios cerrados. Fiable tanto para estocadas
                como para tajos.
