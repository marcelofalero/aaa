          - es:
              name: Daga
              description: |-
                Una hoja pequeña de doble filo. Fácilmente ocultable y rápida de
                desenvainar.
        spear:
          acc: '0'
          range: '—'
          damage: d6w/d8w/d4+1m
          mass: '2'
          hide: '-1'
          avail: Com
          cost: '30'
          localized:
          - en:
              name: Spear
              description: |-
                A more advanced spear with a metal head. Standard infantry equipment
                in ancient warfare.
          - es:
              name: Lanza
              description: |-
                Una lanza más avanzada con una cabeza de metal. Equipo estándar de
