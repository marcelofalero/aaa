        laser-rifle:
          skill: Rifle
          acc: '+2'
          range: 60/150/600
          damage: d6+1w/d8+1w/d10+1w
          act: '2'
          clip: '40'
          mass: '3.5'
          hide: '-'
          avail: Mil
          cost: '2000'
          localized:
