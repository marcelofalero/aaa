          skill: Ranged-SMG
          acc: '0'
          range: 30/80/200
          damage: d4+1w/d6+1w/d8w
          act: '3'
          clip: '40 dispa.'
          mass: '3.5'
          hide: '0'
          avail: Mil
          cost: '2200'
          localized:
          - en:
              name: MAG Carbine "Falcata"
              description: |-
                Magnetic pulse rifle with high fire rate. Its recoil is almost
                negated by gravity compensators.
          - es:
              name: Carabina MAG "Falcata"
              description: |-
                Rifle de pulso magnético con alta cadencia de fuego. Su retroceso es
                casi anulado por compensadores de gravedad.
        pulse-rifle-blue-bolt:
          skill: Ranged-rifle
          acc: '-1'
          range: 20/40/100
          damage: d8+1s/d8w/d6+3w
          act: '2'
          clip: '12 dispa.'
          mass: '10'
          hide: '-'
          avail: Mil
          cost: '2750'
          localized:
          - en:
              name: Pulse Rifle "Blue Bolt"
              description: |-
                Can switch between lethal and non-lethal modes. Includes a wireless
                taser mode for crowd control.
          - es:
              name: Rifle de Pulso "Blue Bolt"
              description: |-
                Tanto las pistolas de arco como los lanzallamas son de alto peligro de
                cerca. El Blue Bolt tiene una curiosidad inusual y es un modo taser
                inalámbrico. Una vez activado un láser mide la densidad protectora del
                objetivo y calcula un aturdimiento. Cambiar de letal/no letal gasta una
                acción.
