          acc: '0'
          range: 10/25/60
          damage: d6w/d8+2w/d4+1m
          act: '2'
          clip: '15'
          mass: '1.5'
          hide: '0'
          avail: Mil
          cost: '3000'
          localized:
          - en:
              name: Mass pistol
              description: |-
                Utilizes gravity pulses to accelerate projectiles. High penetration
