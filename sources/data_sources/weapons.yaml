          mass: '1'
          hide: '0'
          avail: Com
          cost: '—'
          localized:
          - en:
              name: Club
              description: |-
                A simple club made of wood or bone. Useful for personal defense and
                hunting animals.
          - es:
              name: Garrote
              description: |-
                Un simple garrote de madera o hueso. Útil para defensa personal y caza
                de animales.
        knife-stone:
          acc: '0'
          range: '—'
          damage: d4-1w/d4w/d4+1w
          mass: '0.5'
          hide: '+2'
          avail: Com
          cost: '10'
          localized:
          - en:
              name: Knife, stone
              description: |-
                A primitive knife made of flint or obsidian. Effective for cutting and
                basic combat.
          - es:
              name: Cuchillo de piedra
              description: |-
                Un cuchillo primitivo hecho de sílex u obsidiana. Eficaz para cortar y
                combate básico.
        spear-stone:
          acc: '0'
          range: '—'
          damage: d4w/d6w/d4+1w
          mass: '2'
          hide: '-1'
          avail: Com
          cost: '15'
          localized:
          - en:
              name: Spear, stone
              description: |-
                A long shaft with a stone head. Offers reach and lethal potential in
                primitive societies.
          - es:
              name: Lanza de piedra
              description: |-
                Un eje largo con una cabeza de piedra. Ofrece alcance y potencial letal
                en sociedades primitivas.
    pl-1-agricultural-age:
      localized:
      - en:
          name: "PL 1: Agricultural Age"
      - es:
          name: "PL 1: Edad Agrícola"
      items:
