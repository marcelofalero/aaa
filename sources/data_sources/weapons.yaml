          cost: '200'
          localized:
          - en:
              name: Sword, long
              description: |-
                A powerful one-handed or two-handed blade. Requires proper training to
                master.
          - es:
              name: Espada larga
              description: |-
                Una poderosa hoja de una o dos manos. Requiere entrenamiento adecuado
                para dominarla.
        rapier:
          acc: '+1'
          range: '—'
          damage: d6w/d6+1w/d6+2w
          mass: '1'
          hide: '0'
          avail: Com
          cost: '150'
          localized:
          - en:
              name: Rapier
              description: |-
                A light, thin sword designed for dueling. Emphasizes accuracy and
                fencing technique.
          - es:
              name: Rapier
              description: |-
                Una espada ligera y delgada diseñada para el duelo. Enfatiza la
                precisión y la técnica de esgrima.
    pl-4-industrial-age:
      localized:
      - en:
          name: "PL 4: Industrial Age"
      - es:
          name: "PL 4: Era Industrial"
      items:
        bayonet:
          acc: '0'
          range: '—'
          damage: d6w/d6+1w/d4+1m
          mass: '0.5'
          hide: '+1'
          avail: Com
          cost: '30'
          localized:
          - en:
              name: Bayonet
              description: |-
                A blade attached to the muzzle of a rifle. Allows ranged combatants to
                fight effectively in melee.
          - es:
              name: Bayoneta
              description: |-
                Una hoja unida a la boca de un rifle. Permite a los combatientes a
                distancia luchar eficazmente en el cuerpo a cuerpo.
        combat-knife:
          acc: '0'
          range: '—'
          damage: d4+1w/d4+2w/d4+3w
          mass: '0.5'
          hide: '+2'
          avail: Com
          cost: '40'
          localized:
          - en:
              name: Combat knife
              description: |-
                A sturdy knife designed for tactical use. A reliable fallback for any
                soldier.
          - es:
              name: Cuchillo de combate
              description: |-
                Un cuchillo robusto diseñado para uso táctico. Un recurso fiable para
                cualquier soldado.
    pl-5-information-age:
      localized:
      - en:
          name: "PL 5: Information Age"
      - es:
          name: "PL 5: Era de la Información"
      items:
        stun-baton:
          acc: '0'
          range: '—'
          damage: d6s/d8s/d6+1w
          mass: '1'
          hide: '0'
          avail: Res
          cost: '150'
          localized:
          - en:
              name: Stun baton
              description: |-
                A non-lethal compliance tool. Delivers an electrical discharge to
                incapacitate targets.
          - es:
              name: Porra aturdidora
              description: |-
                Una herramienta de cumplimiento no letal. Emite una descarga eléctrica
                para incapacitar a los objetivos.
    pl-6-fusion-age:
      localized:
      - en:
          name: "PL 6: Fusion Age"
      - es:
          name: "PL 6: Era de la Fusión"
      items:
        charge-knife:
          acc: '0'
          range: '—'
          damage: d4+1w/d6+2w/d8+2w
          mass: '0.5'
          hide: '+2'
          avail: Res
          cost: '250'
          localized:
          - en:
              name: Charge knife
              description: |-
                A high-tech blade with a localized energy charge. Slices through most
                personal armor.
          - es:
              name: Cuchillo de carga
              description: |-
                Una hoja de alta tecnología con una carga de energía localizada. Corta
                la mayoría de las armaduras personales.
        charge-sword:
          acc: '0'
          range: '—'
          damage: d8w/d8+2w/d4+2m
          mass: '1'
          hide: '0'
          avail: Mil
          cost: '1000'
          localized:
          - en:
              name: Charge sword
              description: |-
                A formidable energy weapon. The vibrating blade tears through dense
                materials with ease.
          - es:
              name: Espada de carga
              description: |-
                Una formidable arma de energía. La hoja vibrante atraviesa materiales
                densos con facilidad.
    pl-7-gravity-age:
      localized:
      - en:
          name: "PL 7: Gravity Age"
      - es:
          name: "PL 7: Era de la Gravedad"
      items:
        gravity-mace:
          acc: '0'
          range: '—'
          damage: d6w/d12w/d8m
          mass: '2'
          hide: '-1'
          avail: Mil
          cost: '2500'
          localized:
          - en:
              name: Gravity mace
              description: |-
                A heavy mace that utilizes gravity pulses. Capable of crushing even the
                heaviest armor.
          - es:
              name: Maza de gravedad
              description: |-
                Una maza pesada que utiliza pulsos de gravedad. Capaz de aplastar
                incluso la armadura más pesada.
        mass-blade:
          acc: '+1'
          range: '—'
          damage: d8w/d8+3w/d12+3w
          mass: '1.5'
          hide: '0'
          avail: Mil
          cost: '4000'
          localized:
          - en:
              name: Mass blade
              description: |-
                An advanced gravity weapon. The localized field ensures maximum damage
                on every impact.
          - es:
              name: Hoja de masa
              description: |-
                Un arma de gravedad avanzada. El campo localizado garantiza el máximo
                daño en cada impacto.
        v-blade:
          acc: '+2'
          range: '—'
          damage: d4+1w/d8+1w/d8+3w
          mass: '0.5'
          hide: '+2'
          avail: Mil
          cost: '1200'
          localized:
          - en:
              name: V-blade
              description: |-
                A small, high-frequency vibratory knife. Extremely lethal in close
                combat.
          - es:
              name: V-blade
              description: |-
                Un pequeño cuchillo vibratorio de alta frecuencia. Extremadamente letal
                en combate cercano.
        monofilament-sword-orion-v:
          acc: '+1'
          range: '—'
          damage: d8w/2d6w/d8m
          mass: '1'
          hide: '-1'
          avail: Res
          cost: '2500'
          localized:
          - en:
              name: "Monofilament Sword \"Orion V\""
              description: |-
                The edge is molecule-thin, held in place by a containment field. It
                bypasses 2 steps of armor.
          - es:
              name: "Espada Monofilamento \"Orion V\""
              description: |-
                El filo tiene el grosor de una molécula, mantenido en su lugar por un
                campo de contención. Ignora 2 pasos de armadura.
        combat-hammer-kh-12:
          acc: '-1'
          range: '—'
          damage: d6+2w/d8+3w/2d6+2w
          mass: '4.5'
          hide: '-'
          avail: Mil
          cost: '1200'
          localized:
          - en:
              name: Combat Hammer KH-12
              description: |-
                A kinetic impact hammer. Used by assault troops to breach doors and
                crustoskins alike.
          - es:
              name: Martillo de Combate KH-12
              description: |-
                Un martillo de impacto cinético. Utilizado por las tropas de asalto
                para romper puertas y caparazones por igual.
        cryo-axe-thrym-7:
          acc: '0'
          range: '—'
          damage: d8w/d8+2w/d4+1m
          mass: '3'
          hide: '-'
          avail: Mil
          cost: '5000'
          localized:
          - en:
              name: Cryo-Axe Thrym-7
              description: |-
                Releases a flash-freeze charge on impact. Targets suffer -1 step
                penalty to DEX for d4 rounds.
          - es:
              name: Criohacha Thrym-7
              description: |-
                Libera una carga de congelación instantánea al impactar. Los objetivos
                sufren una penalización de -1 paso a DEX durante d4 asaltos.
