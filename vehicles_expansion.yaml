items:
- name: VacMaster 77 Vacuum Mask
  pl: '7'
  mass: 2,650 kg
  cost: $55,595
  avail: Common
  description:
    en: 'The VacMaster has two main components: a hood of soft, transparent polyurethane
      and a respirator cartridge. The hood is loosely made and easy to pull off, and
      once in place, transparent numaplas channels inflate to form a firm seal around
      the neck and add rigidity to the helmet. The respirator cartridge is a miniature
      version of the oxygena-tors/rebreathers found on full e-suits, connected by
      two circulation tubes to the mask itself. Pull the pin, and you''ve got 4 hours
      of air in one quick blink!'
    es: 'El VacMaster cuenta con dos componentes principales: una máscara de poliamida
      delgada y transparente y un cartucho respiratorio. La máscara es de piezas fáciles
      de soltar y, una vez en su lugar, los canales numaplas se inflan para formar
      un sello duro alrededor del cuello y añaden rigidez a la máscara. El cartucho
      respiratorio es una versión minuciosa de los torsones/rebreathers oxygena que
      se encuentran en las sudaderas eléctricas completas, conectados por dos tubos
      de circulación a la máscara misma. Suelte el clavo y tendrá 4 horas de aire
      en un instante!'
  name_es: Máscara de Aire VacMaster 77
- name: Solar X Grizzly ATV Groundcar
  pl: '7'
  mass: 1,040 kg
  cost: $41,225
  avail: Common
  description:
    en: The Solar X Grizzly ATV Groundcar is a powerful ground vehicle with an impressive
      set of performance characteristics. It provides a comfortable seating capacity
      for five passengers and has an impressive durability.
    es: El automóvil de tierra Solar X Grizzly ATV es un vehículo terrestre potente
      con un conjunto impresionante de características de desempeño. Proporciona una
      capacidad de sentarse cómoda para cinco pasajeros y tiene una durabilidad impresionante.
  name_es: ATV de Coche de Tierra Solar X Grizly
- name: Solar X Falcon
  pl: '7'
  mass: 15 kg
  cost: $10,935
  avail: Common
  description:
    en: El Solar X Falcón is an efficient aircraft that provides energy using a Thomsen
      X70 fuel cell motor. It can fly for 5 hours and optionally, it can be recharged
      with a single flashlight battery for 4 hours of flight.
    es: El Solar X Falcón es un avión de alta eficiencia que proporciona energía mediante
      el uso de un motor de celda de combustible Thomsen X70. Puede volar durante
      5 horas y opcionalmente, puede alimentarse con una sola batería lanterna para
      4 horas de vuelo.
  name_es: X Falcón Solar
- name: EcoTour Camping Accessories
  pl: '7'
  mass: 2 kg
  cost: $495
  avail: Common
  description:
    en: TrailTech EcoTour camp-ing accessories are built to rigorous standards for
      durability, ergonomic design, and simplicity. No matter where you are or what
      you're doing, you can't go wrong with TrailTech!
    es: Las prendas de camping EcoTour TrailTech están diseñadas para estándares rigurosos
      de durabilidad, diseño ergonómico y sencillez. ¡No te equivocas con TrailTech
      en lo que hagas!
  name_es: Accesorios de camping para Ecoturismo
- name: HOTSPOT
  pl: '7'
  mass: 60 grams
  cost: $25
  avail: Common
  description:
    en: Pocket-sized igniter is powered by a lanthanide cell guaranteed for one hundred
      lights. Instead of producing an open flame, the HotSpot heats an ignition over
      80 meters in diameter.
    es: El tanque pequeño encendedor está alimentado por una célula lantánida garantizada
      para cien luces. En vez de producir un fuego abierto, el HotSpot calienta una
      prenda de ignición con un diámetro de 80 metros.
  name_es: Hotspot
- name: TRAILLTECH BuGcZar
  pl: '7'
  mass: 1 kg
  cost: '#85'
  avail: Cornmon
  description:
    en: Trailltech BugcZar is a potion of stone used for climbing equipment. It offers
      a -1 step bonus to any recovery checks the climber must make after a miscue
      in his climb. The pitons should be spaced no more than 5 meters apart.
    es: Trailltech BugcZar es una poción de piedra utilizada para equipo de escalada.
      Otorga un bonificador -1 en los cheques de recuperación, que el ascensor debe
      realizar después de un error en su escalada. Los pitones deben estar espaciados
      a más de 5 metros entre sí.
  name_es: Trailltech Bugazar
- name: Nike-class Gunboat
  pl: '7'
  mass: Mass not specified in the text
  cost: '2,395,000 or #10,435,000'
  avail: Available for purchase at Solar X shipyard
  description:
    en: A Nike-class Gunboat is a heavy armored craft with eight compartments. It
      has a maneuver rating of zero, an acceleration of two and a minute per move
      (Mpp) of one. The cruising speed is 1.5 AU/hr and the berthing time is special
      for this class.
    es: Un Nike-class Gunboat es un buque de armadura pesado con ocho compartimentos.
      Tiene una clasificación de maniobra cero, una aceleración de dos y un minuto
      por movimiento (Mpp) uno. La velocidad de crucero es de 1.5 AU/hr y el tiempo
      de estacionamiento es especial para esta clase.
  name_es: Boato de Escopeta Nike
- name: Exact Name
  pl: '7'
  mass: Mass (kg)
  cost: 'Cost ($ or #)'
  avail: Availability
  description:
    en: VERBATIM TRANSCRIPTION of the text. Include all rules, mechanics, flavor,
      and stats mentioned.
    es: VERBATIM TRANSCRIPTION del texto en español. Incluya todas las reglas, mecánicas,
      sabor y estadísticas mencionadas.
  name_es: Nombre Exacto
- name: Expedition D8 Armored E-Suit
  pl: '7'
  mass: 125 kg
  cost: '4500 #'
  avail: Available from Sol starbase and all other starbases in the Star*Drive.
  description:
    en: A high-tech and heavy-duty space suit providing good protection against most
      threats that an explorer can face during their journey. It also grants additional
      capabilities such as improved speed, strength, and agility.
    es: Un traje de espacio de alta tecnología y armadura pesada que proporciona una
      buena protección frente a la mayoría de las amenazas que un explorador pueda
      enfrentar durante su viaje. También otorga capacidades adicionales como velocidad,
      fuerza y agilidad mejoradas.
  name_es: Sudorio de expedición D8 armado cuero E
