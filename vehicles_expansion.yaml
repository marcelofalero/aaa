- name: SESHEYANS
  pl: '7'
  mass: ''
  cost: ''
  avail: ''
  description:
    en: The Sesheyans maintain their claim that the moon of Grith in the Corrivale
      system is their ancestral home, they are not native to the planet Sheya (which
      is under VoidCorp rule), and thus they have the right to travel throughout the
      known universe.
    es: Los Sesheyans mantienen su reivindicación que la luna de Grith en el sistema
      Corrivale es su hogar ancestral, no son nativos del planeta Sheya (que está
      bajo la regencia de VoidCorp), y por lo tanto tienen derecho a viajar a través
      del universo conocido.
  name_es: ESHEYAN
