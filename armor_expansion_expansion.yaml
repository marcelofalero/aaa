items:
- name: Battlehawk Zero-G
  pl: '7'
  mass: 8 kg
  cost: ¥3,250
  avail: Controlled
  description:
    en: Battlehawk assault gear is designed especially for use in low-gravity situations.
      Like the standard ship's jumpsuit, it seals against vacuum and includes a vacuum
      mask with an B-hour supply of oxygen. A zero-g web with hip and boot thrusters
      is built into the armor, allowing omnidirectional free movement at a rate of
      up to 30 meters per phase. The stabilizing effect of the armor reduces penalties
      for zero-g activities by 1 step.
    es: La armadura de asalto batalla está diseñada especialmente para su uso en situaciones
      de baja gravedad. Como la chaqueta del barco estándar, cierra contra el vacío
      y incluye un máscara de vacío con una cantidad de oxigeno B-hora. Se ha construido
      una web zero-g con las fuerzas hipopotamos y pierna esférica dentro del armamento,
      permitiendo un movimiento libre omnidireccional a una tasa máxima de 30 metros
      por fase. El efecto de la estabilización del armado reduce los penalizaciones
      para las actividades zero-g en 1 nivel.
  name_es: Cuchilla de Batalla Cero-G
- name: Boby Guard Ballistic Vest
  pl: 7
  mass: 3 kg
  cost: '#750'
  avail: Common
  description:
    en: The BodyGuard vest is one of the most popular personal armors available. It's
      significantly lighter and more durable than its predecessors, capable of stopping
      an 11mm charge rifle round at point-blank range.
    es: La tunilla del cuerpo guardia es una de las armaduras más populares disponibles.
      Es ligeramente más liviana y duradera que sus predecesores, capaz de detener
      un tiro de bala 11mm a rango de punta.
  name_es: Vestido de Armadura de Proyección Bobby
- name: Milano GX CF Bobysuit
  pl: '7'
  mass: 3 kg
  cost: 2,250
  avail: Controlled
  description:
    en: The Milano is the top of the line in this type of armor. It offers outstanding
      durability, comfort and protective value. This piece does not include a vacuum
      mask.
    es: El Milano es la línea superior de este tipo de armadura. Ofrece una durabilidad
      excepcional, comodidad y valor protector. Este artículo no incluye un máscara
      para el vacío.
  name_es: Pechera para el juego de rol Milano GX CF Bobysuit
- name: CERAMETAL ARMOR
  pl: '7'
  mass: 10 kg
  cost: '#2,000'
  avail: Military
  description:
    en: The best non-powered armor available, cerametal consists of flexible, overlapping
      bands of ceramometallic (or cerametal, for short) plate. This advanced composite
      is lighter than the earlier polymeres but offers significantly better protection
      against energy weapons—the ceramics used in this composite material can withstand
      incredible temperatures and dissipate heat very well.
    es: La mejor armadura no impulsada disponible es el cerametal, que está compuesto
      de bandas flexibles y sobrepuestas de placas de ceramometallicas (o simplemente
      cerametales). Este material avanzado es más ligero que los polímeros anteriores
      pero ofrece una mejor protección frente a las armas eléctricas. El material
      utilizado en este compuesto se adapta a inciertas temperaturas y descansa muy
      bien.
  name_es: ARMADURA DE CERÁMICO
- name: Paladin
  pl: '7'
  mass: 60 kg
  cost: ¥25,000 or $35,000
  avail: Restricted
  description:
    en: El Paladín es el casco de armadura potenciado estándar de la Unidad de Marines
      Concord y la Forza Defensiva Planetaria. Sus motores servomecánicos proporcionan
      una fuerza efectivamente de 16 al usuario para fines de elevar, llevar, ajuste
      de daño en mano a mano y romper cosas. Los sistemas on-board del Paladín están
      descritos en la caja adjunta. Además de los sistemas de tanque estándar, el
      Paladín tiene motores hidráulicos que permiten un desplazamiento de 20 metros
      por fase en terreno destruido o 40 metros por fase en terreno abierto, sin fatigar
      al usuario.
    es: El Paladín es el casco estándar de armadura potenciado del Ejército de Marines
      Concord y la Fuerza Defensiva Planetaria. Sus motores servomecánicos proporcionan
      una fuerza efectivamente de 16 al usuario para fines de sostener, llevar, ajustar
      el daño en mano a mano y romper cosas. Los sistemas on-board del Paladín están
      descritos en la caja adjunta. Además de los sistemas estándar del cuerpo, los
      motores hidráulicos del Paladín permiten un desplazamiento de 2<｜begin▁of▁sentence｜>20
      metros por fase en terreno destruido o 40 metros por fase en terreno abierto,
      sin desgastar al usuario.
  name_es: Paladín
- name: Rockets
  pl: '7'
  mass: Mass (kg)
  cost: '#50,000'
  avail: Availability
  description:
    en: A powerful weapon that can be used to destroy all enemies in its path. This
      item is equipped by shooting a rocket at an enemy unit. It has a high rate of
      successful hits, but it may not hit any target due to the distance.
    es: Una arma potente que se puede usar para destruir a todos los enemigos en su
      camino. Este artículo se equipa disparando un cohete en una unidad enemiga.
      Tiene una tasa alta de aciertos, pero es posible que no lo atinquen debido a
      la distancia.
  name_es: Raquetes
- name: DEFLECTION SCREENS
  pl: '7'
  mass: 1.2 kg
  cost: $1,350
  avail: Controlled
  description:
    en: With the advent of man-portable high-powered capacitors in the form of lanthanide
      cells, the first practical energy screens become possible. They're not impervious—controlling
      and shaping an energy field capable of deflecting or absorbing small arms fire
      takes up most of the unit's power, and even the best personal shields may not
      stop a powerful handgun.
    es: Con el ascenso de los capacitadores de alta potencia portátiles en forma de
      células lantánidas homólogos, se consigue la primera pantalla de energía práctica.
      No son inmunes—controlando y formando un campo de energía capaz de reflejar
      o absorber el fuego de las armas pequeñas consume la mayor parte de la potencia
      del dispositivo, y aun con los mejores protectoras personales, no detendría
      una pistola muy potente.
  name_es: PARRERÍAS DE LA DEFLECCIÓN
- name: SCM-16 CAPACITOR SCREEN
  pl: '7'
  mass: 8.5 kg
  cost: '#15,750'
  avail: Restricted
  description:
    en: A particle screen that creates a field of ionized particles from the air molecules
      in the user's vicinity. It provides good protection against low impact and high
      impact attacks but is amazingly effective against energy attacks. It automatically
      reduces the damage of an attack by the amount listed, and can absorb d6+1 attacks
      before its capacitors are full.
    es: Una pantalla de partículas que crea un campo de partículas ionizadas a partir
      de las moléculas del aire cercanas. Proporciona buena protección contra los
      golpes bajos y altos pero es increíblemente efectiva frente a los ataques por
      energía. Automaticamente reduce el daño de un golpe en la cantidad indicada,
      y puede absorber d6+1 golpes antes que sus condensadores estén llenos.
  name_es: PANTALLA DE DISIPADORA SCM-16
- name: Ptokh K'se
  pl: '7'
  mass: 2 kg
  cost: 86,500
  avail: Controlled
  description:
    en: The Ptokh K’se is a protective garment that embodies some of the elegance
      and aesthetics of the species. It consists of a light armored suit made of Malecule
      weave. While its mass is noticeable, the vest is thin and flexible enough to
      be worn under almost any other garment. Few people like to wear heavy battle
      armor, but the Ptokh K’se is a good compromise between ease of movement and
      protection.
    es: El Ptokh K'se es una prenda de protección que expresa algunos de los elegantismos
      y estética de la especie. Está compuesto por un traje armado ligero hecho de
      tejido de Malecule. Mientras su peso es visible, el vestido es fino y flexible
      o suficientemente flexible para poder llevarlo bajo cualquier otro prenda. Pocas
      personas como las prefieren la armadura bélica pesada, pero el Ptokh K'se es
      una buena opción entre la facilidad de movimiento y la protección.
  name_es: Escudo Ptok’kh Kse
- name: Calefir Family Corporation
  pl: '7'
  mass: 10 kg (units) to 25 kg (large units)
  cost: '$, # (depends on size and type of item)'
  avail: Alaundril's Verge
  description:
    en: The Calefirs are a powerful entity in the Alaundril system. They have been
      colonizing the Tendril system since the earliest settlements were among the
      first people. They have seen the fall and rise of numerous interstellar bodies,
      including VoidCorp, Rigunmors, StarMech, etc. In Alaundril, they are one of
      the major forces that can threaten peace. The presence of them in other systems
      like Old Space suggests their return to this location.
    es: Los Calefirs son una entidad poderosa en el sistema de Alaundril. Han estado
      colonizando el sistema Tendril desde que los primeros pueblos fueron las primeras
      personas. Han visto la caída y ascenso de numerosos corpos corporales interstelares,
      incluyendo VoidCorp, Rigunmors, StarMech, etc. En Alaundril, son una de las
      principales fuerzas que pueden amenazar la paz. La presencia de ellos en otros
      sistemas como Old Space indican su regreso a este lugar.
  name_es: Corporación Familia Calefir
- name: TerrainMaster 5§ Portable Cabin
  pl: '7'
  mass: 30 kg
  cost: 1,175 (80% of listed price)
  avail: Any
  description:
    en: The TerrainMaster stows in a convenient backpack frame. While it is a serious
      load for one hiker, the stowage frame includes a built-in mass neutralizer that
      reduces its mass to 5 kilograms when activated. The neutralizer has an endurance
      of 20 hours at this setting or 50 hours if set to reduce to 15 kg.
    es: El TerrainMaster se acopla en un marco de maletín cómodo. Mientras que es
      una carga importante para uno senderista, el marco de almacenamiento incluye
      un desenrollador de masa incorporado que reduce su masa a 5 kilogramos cuando
      está activado. El desenrollador tiene una duración de 20 horas en este ajuste
      o 50 horas si se lo establece para reducirlo a 15 kg.
  name_es: Cabina Portátil Master 5§
- name: Gliese 300 habitat dome
  pl: '7'
  mass: 50 kg
  cost: $1,750
  avail: Any
  description:
    en: The Gliese 300 habitat dome is made of microengineered numaplas—a tough, heavy
      plastic fabric chambered with self-inflating pneumatic bladders. A single standard
      COg cartridge (two are included) can deploy the dome in moments. When inflated,
      the dome is 2 meters tall and 5 meters in diameter.
    es: El domo de habitat Gliese 300 está hecho de numaplas micromejorados—un plástico
      pesado y denso con cierres de tejido forjados y cámaras pneumétricas de inflación
      automática. Un solo cartucho estándar COg (dos están incluidos) puede desplegar
      el domo en momentos. Cuando se infla, el domo mide 2 metros de altura y 5 metros
      de diámetro.
  name_es: Conjunto de habitación Gliese 300
- name: ARMADILLO MPT Two-MAN TENT
  pl: '7'
  mass: 1 kg
  cost: $135
  avail: Any
  description:
    en: The ARMADILLO MPT Two-MAN TENT is a lightweight, easy to use tent that offers
      comfort and durability. It provides support for two people with a single numaplas
      support matrix, which inflates with a handy foot-pedal providing it with a structure
      lighter and stronger than aluminum. The tent weighs 1 kg and costs $135. It's
      available in any location.
    es: El ARMADILLO MPT Two-MAN TENT es un toldo ligero, fácil de usar que ofrece
      comodidad y durabilidad. Proporciona apoyo para dos personas con una sola matriz
      de soporte numaplas, la cual inflama con un pedal pie útil para darle una estructura
      más ligera y más robusta que el aluminio. El tentáculo pesa 1 kg y cuesta $135.
      Está disponible en cualquier lugar.
  name_es: CUERDA DE GUARDAMORTE DOS-PERSONAS ALBERGUE CALIENTE
- name: Unner 60 CLIMATE SuIT
  pl: '7'
  mass: 1 kg
  cost: '#825'
  avail: Common
  description:
    en: The Unner 60 Climate Suit is a versatile, lightweight and comfortable suit
      designed to keep you safe and cool in non-vacuum extraterrestrial environments.
      Its heating/cooling elements allow for long-endurance work and travel in environments
      with toxic, thin, dense, or mildly corrosive atmospheres.
    es: El Unner 60 Climate Suit es una chaqueta versátil, ligera y cómoda diseñada
      para mantenerte saludable y fresco en entornos extraterrestres sin vacío. Sus
      elementos de calentamiento/cooling permiten trabajar y viajar durante longitudes
      de tiempo en ambientes con atmósfera tóxica, delgado, densa o moderadamente
      corrosiva.
  name_es: Botas de Unner 60 CLIMATE SuIT
- name: Explorer D9 Armored E-Suit
  pl: '7'
  mass: 5 kg
  cost: $25 each, and additional power cells cost $50 each.
  avail: Any
  description:
    en: The Explorer's armored E-Suit is lined with a self-sealing, puncture-resistant
      inner layer. It provides protection against environmental hazards like vacuum,
      gravity, radiation, and atmospheric pressure changes. The suit loses its integrity
      if the wearer suffers 4 points or more of primary wound or mortal damage.
    es: El traje armado E-Suit del Explorador está llevado por un capa de aire aire,
      puntuada con resistencia al agujero y algodón. Proporciona protección contra
      los peligros ambientales como el vacío, la gravedad, la radiación y las alteraciones
      de presión atmosférica. Deja de ser útil si el portador sufre 4 puntos o más
      de heridas primarias o mortales.
  name_es: Cinturón de armadura E-Suit Explorador D9
