            description: "As a Personaje improves his ability in the Armas de energía Especialidad, he gains rank benefits as described below. Note: These benefits only apply when the Personaje is using a weapon covered by this skill.\n\nDue to the inherent complexity of Armas de energía weapons they are more fragile than their counterparts; this requires the user to be more careful when parrying, resulting in a +2 step penalty on parry checks.\n\n⊗ Resistance Modifier: At higher ranks, the skill provides an improvement to a Personaje's Strength resistance modifier. It improves by +1 at rank 4, by +1 again at rank 8, and by +1 again at rank 12. This increase doesn't stack with similar bonuses provided by Otros Combate cuerpo a cuerpo specialty skills.\n\n▶ Reaction Parry: When a Personaje reaches rank 4, he can attempt to parry whenever a melee or unarmed attack is used against him. The parry attempt uses up the Personaje's next available action.\n\n▶ Double-Strike: When a Personaje reaches\
              \ skill rank 6, he learns to make a double-strike against a target with a successful skill check. The player rolls one Dado de Control and two situation dice. The first Dado de Situación is the base modifier with a +1 step penalty; the second Dado de Situación is the base modifier with a +2 step penalty.\n\n▶ Multistrike: When a Personaje reaches skill rank 9, he learns to make multiple attacks in a single phase. The Personaje can strike with a melee weapon three times in a phase. These attacks can be directed at a single target or at up to three separate targets within two meters of the Personaje."
  modern-ranged-weapons:
    attribute: DEX
    cost: 6
    category: Combat
    url: /skills/modern-ranged-weapons
    localized:
    - en:
        name: Modern Ranged Weapons
        description: "This broad skill provides a character with training in the use of modern ranged weapons. This skill covers pistols, rifles, shotguns, and submachine guns of all types, including projectile and energy weapons.\n\nAll modern weapons have ammunition clips. To change a clip during a combat scene, a character must use an available action. If he wants to change a clip and shoot in the same phase, a +2 penalty applies to the attack action.\n\nOther factors that can influence the situation die used in a modern ranged weapon attack are listed under **Ranged Weapon Attack Modifiers** on this page.\n\n**Weapon Technical Knowledge**: Characters who train seriously with firearms — whether soldiers, mercenaries, or dedicated enthusiasts — inevitably absorb a working technical understanding of their weapons. They learn how their weapons function internally, what can go wrong, how to prevent it, and how to fix it in the field. As well as keep informed of what the market has to offer.\
          \ A character with the **Technical Science** broad skill can use the appropriate Modern Ranged Weapons specialty skill for checks that involve knowing the existence of a particular weapon, customizing weapons and ammo, as well as recognizing, repairing, and maintaining weapons in the field.\n\n\n\n### Ranged Weapon Attack Modifiers\n\nWhen a character uses any ranged weapon, either primitive or modern, a number of factors must be considered to determine the situation die for the skill check:\n- The base situation die of the weapon (either +4 for a broad skill or +0 for a specialty).\n- The weapon's range modifier (see **TABLE P22: RANGE MODIFIERS BY WEAPON TYPE** below).\n- Any modifier for a target's Dexterity resistance (–1 step bonus for DEX 11–12, –2 steps for DEX 13–14, –3 steps for DEX 15–16, –4 steps for DEX 17–18, and –5 steps for DEX 19 or higher).\n\n#### TABLE: COMMON RANGED ATTACK MODIFIERS\n\n| Condition | Modifier | Weapon Types | Note |\n| :--- | :--- | :--- | :---\
          \ |\n| **Zero Range** (0–1m) | **-3 steps** | Pistol, SMG, Shotgun | Weapons must be short enough to tuck into a grapple. |\n| **Point Blank** (1–4m) | **-1 step** | All | See Specialty Rank benefits for improvements. |\n| **In a Melee Struggle** | **+1 step** | All | Canceled by **Melee Combat** Broad Skill training. |\n| **Moving & Shooting** | **+1 step** | All | For firing while running or moving fast. |\n| **Changing Clips** | **+2 steps** | All | To change a clip and fire in the same phase. |\n\n#### TABLE P22: RANGE MODIFIERS BY WEAPON TYPE\n\n| Weapon | Short | Medium | Long |\n| :--- | :--- | :--- | :--- |\n| Submachine gun | -1 step | +1 step | +2 steps |\n| Pistol | -1 step | +1 step | +2 steps |\n| Rifle | -1 step | None | +1 step |\n\n---"
    - es:
        name: Armas a distancia modernas
        description: "Esta habilidad amplia proporciona a un personaje entrenamiento en el uso de armas a distancia modernas. Esta habilidad cubre pistolas, fusiles, escopetas y subfusiles de todos los tipos, incluyendo armas de proyectiles y de energía.\n\nTodas las armas modernas tienen cargadores de munición. Para cambiar un cargador durante una escena de combate, un personaje debe usar una acción disponible. Si quiere cambiar el cargador y disparar en el mismo asalto (fase), se aplica una penalización de +2 pasos a la acción de ataque.\n\nOtros factores que pueden influir en el dado de situación utilizado en un ataque CON armas modernas a distancia se detallan bajo **Modificadores de ataque de armas a distancia** en esta página.\n\n**Conocimiento técnico de armas**: Los personajes que se entrenan seriamente CON armas de fuego — ya sean soldados, mercenarios o entusiastas dedicados — inevitablemente absorben una comprensión técnica funcional de sus armas. Aprenden cómo funcionan internamente,\
          \ qué puede fallar, cómo prevenirlo y cómo repararlo en el campo. Así como mantenerse informados de lo que el mercado tiene para ofrecer. Un personaje CON la habilidad amplia de **Ciencia técnica** puede usar la habilidad de especialidad de Armas a distancia modernas apropiada para las tiradas que impliquen conocer la existencia de un arma concreta, personalizar armas y munición, así como reconocer, reparar y mantener armas en el campo.\n\n\n\n### Modificadores de ataque de armas a distancia\n\nCuando un personaje usa cualquier arma a distancia, ya sea primitiva o moderna, se deben considerar varios factores para determinar el dado de situación de la tirada de habilidad:\n- El dado de situación base del arma (+4 para la habilidad amplia o +0 para la especialidad).\n- El modificador de distancia del arma (véase la **TABLA P22: MODIFICADORES DE DISTANCIA POR TIPO DE ARMA** abajo).\n- Cualquier modificador por la resistencia de Destreza del objetivo (bonificación de –1 paso para DES\
          \ 11–12, –2 pasos para DES 13–14, –3 pasos para DES 15–16, –4 pasos para DES 17–18 y –5 pasos para DES 19 o más).\n\n#### TABLA: MODIFICADORES COMUNES DE ATAQUE A DISTANCIA\n\n| Condición | Modificador | Tipos de Arma | Nota |\n| :--- | :--- | :--- | :--- |\n| **Alcance Cero** (0–1m) | **-3 pasos** | Pistola, Subfusil, Escopeta | El arma debe ser lo suficientemente corta para un forcejeo. |\n| **A bocajarro** (1–4m) | **-1 paso** | Todas | Véase beneficios de rango de especialidad para mejoras. |\n| **En lucha cuerpo a cuerpo** | **+1 paso** | Todas | Cancelado por el entrenamiento de la habilidad de **Combate cuerpo a cuerpo**. |\n| **En movimiento** | **+1 paso** | Todas | Para disparar mientras se corre o se mueve rápido. |\n| **Cambiar cargador** | **+2 pasos** | Todas | Para cambiar el cargador y disparar en la misma fase. |\n\n#### TABLA P22: MODIFICADORES DE DISTANCIA POR TIPO DE ARMA\n\n| Arma | Corta | Media | Larga |\n| :--- | :--- | :--- | :--- |\n| Subfusil | -1 paso\
          \ | +1 paso | +2 pasos |\n| Pistola | -1 paso | +1 paso | +2 pasos |\n| Fusil | -1 paso | Nada | +1 paso |\n\n---\n\n# Habilidades de especialidad"
    items:
      assault-rifle:
        attribute: DEX
        cost: 3
        url: /skills/modern-ranged-weapons#assault-rifle
        localized:
        - en:
            name: Assault Rifle
            description: "This specialty skill covers automatic rifles—standard infantry weapons capable of selective fire and automatic modes using rifle-caliber cartridges.\n\n### Automatic Weapon Attack Modes\nAssault rifles provide a character with up to three attack options per action phase:\n- **Fire:** A single attack at a single target. (Standard control + situation die).\n- **Burst:** A hail of ammunition aimed at a single target. The character receives a **-1 step bonus** to his skill check. On a Critical Failure, the weapon jams and requires a Technical Science—repair check to unjam.\n- **Autofire:** A spray of ammunition walked across a wide area. Up to three different targets within 6 meters of each other can be affected. \n  - To resolve autofire, the player rolls one control die and three situation dice at once. \n  - The results are read off the control die, modified by the individual situation dice: **+1 step** for the first target, **+2 steps** for the second, and **+3\
              \ steps** for the third. \n\n▶ **Rock-n-Roll:** When a character reaches rank 3 in this specialty, he learns to change clips more efficiently. The penalty for changing a clip and firing in the same action is reduced to +1 step.\n\n---"
        - es:
            name: Fusil de asalto
            description: "Esta habilidad de especialidad permite a un personaje mejorar su competencia CON pistolas modernas de todo tipo, incluyendo armas de proyectiles y de energía.\n\n▶ **Desenfundado rápido:** Después de que un personaje alcanza el rango 3 en esta especialidad, puede realizar un desenfundado rápido CON su pistola. Esto le permite desenfundar su arma y dispararla en el mismo asalto CON solo una penalización de +1. Al alcanzar el rango 4, puede desenfundar y disparar en el mismo asalto sin ninguna penalización.\n\n---"
      pistol:
        attribute: DEX
        cost: 3
        url: /skills/modern-ranged-weapons#pistol
        localized:
        - en:
            name: Pistol
            description: "This specialty skill allows a character to improve his proficiency with modern pistols of all types, including projectile and energy weapons.\n\n▶ **Quick Draw:** After a character reaches rank 3 in this specialty, he can perform a quick draw with his pistol. This allows him to draw his weapon and fire it in the same phase with only a +1 penalty. As a character reaches rank 4, he can draw and fire in the same phase without any penalty.\n\n---"
        - es:
            name: Pistola
            description: "Esta habilidad de especialidad permite a un personaje mejorar su competencia CON subfusiles modernos de todo tipo (armas automáticas pequeñas que disparan cartuchos de tamaño de pistola), así como subfusiles equivalentes de energía.\n\n### Modos de ataque de armas automáticas\nLos subfusiles (y los fusiles de asalto) proporcionan a un personaje hasta tres opciones de ataque por fase de acción:\n- **Disparar:** Un solo ataque a un solo objetivo. (Control estándar + dado de situación).\n- **Ráfaga:** Una lluvia de munición dirigida a un solo objetivo. El personaje recibe una **bonificación de –1 paso** a su tirada de habilidad. En caso de fallo crítico, el arma se encasquilla y requiere una prueba de Ciencia técnica—reparación para desatascarla.\n- **Fuego automático:** Una ráfaga de munición barrida sobre un área amplia. Se pueden ver afectados hasta tres objetivos diferentes a menos de 6 metros entre sí.\n- Para resolver el fuego automático, el jugador tira un dado\
              \ de control y tres dados de situación a la vez.\n- Los resultados se leen del dado de control, modificados por los dados de situación individuales: **+1 paso** para el primer objetivo, **+2 pasos** para el segundo y **+3 pasos** para el tercero.\n\n▶ **Rock-n-Roll:** Cuando un personaje alcanza el rango 3 en esta especialidad, aprende a cambiar los cargadores CON mayor eficiencia. La penalización por cambiar un cargador y disparar en la misma acción se reduce a +1 paso.\n\n---"
      rifle:
        attribute: DEX
        cost: 3
        url: /skills/modern-ranged-weapons#rifle
        localized:
        - en:
--
      street-knowledge:
        attribute: WIL
        cost: 3
        url: /skills/street-smart#street-knowledge
        localized:
