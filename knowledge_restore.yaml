  law:
    attribute: INT
    cost: 0
    category: Social
    url: /skills/law
    localized:
    - en:
        name: Law
        description: "This broad skill provides a character with general knowledge of the laws and legal systems of her native society. It can be a branch of human civilization on Earth or a colony planet; it could also be a specific alien society or culture.\n\nThe Law skill can be used as an encounter skill to change the attitude of an individual. If this results in an attitude of **Friendly** or better, it provides a **-1 step bonus** on subsequent skill checks to get information or cooperation out of that individual.\n\nWith a successful skill check, a character can avoid legal entanglements, understand court procedures, and have a working knowledge of the techniques used by a specific society's law enforcers. In a courtroom drama or legal issue, a Law skill check can be used to determine the outcome.\n\n### Courtroom Resolution\nWhen a legal battle is played out \"off camera,\" the GM may call for Law skill checks. In a competing check:\n- **Critical Failure:** Opposing lawyer receives\
          \ a -3 bonus; or the character loses the case outright.\n- **Failure:** Opposing lawyer receives a -1 bonus to his skill check.\n- **Ordinary:** Success made with no modifier.\n- **Good:** Opponent takes a +1 penalty.\n- **Amazing:** Opponent takes a +3 penalty, or the character wins the case outright.\n\n---"
    - es:
        name: Ley
        description: "Esta habilidad general proporciona a un personaje conocimientos generales sobre las leyes y sistemas legales de su sociedad nativa. También puede tratarse como una habilidad de encuentro para cambiar la actitud de un individuo.\n\nEn una acción legal, el personaje y el oponente realizan tiradas de habilidad alternas hasta que alguien obtiene un Fallo Crítico o un resultado Asombroso."
    items:
      psionic-law:
        attribute: INT
        cost: 3
        url: /skills/law#psionic-law
        localized:
        - en:
            name: Psionic Law
            description: "Lawyers, judges, and others use this skill to interact in courtrooms and in legislative meetings. This aspect of the Law broad skill is used to argue a case or a point of view in an official proceeding."
        - es:
            name: Habilidades de Especialidad
            description: "Abogados, jueces y otros utilizan esta habilidad para interactuar en un entorno judicial. Esta especialidad se usa para defender un caso o punto de vista en un procedimiento oficial.\n\n### Ley [Específica]\n*No se puede usar sin estar entrenado.*\n\nPara cada compra por separado de esta especialidad, un personaje selecciona una cultura o tipo de ley específico\n### Beneficios de Rango\n- **Efecto Mejorado:** Bonificación de -1 en el rango 3, -2 en el rango 6, -3 en el rango 9 y -4 en el rango 12.\n\n### Procedimientos de aplicación de la ley\nOficiales de policía, detectives, cazarrecompensas y otros utilizan esta habilidad para seguir (o eludir) los procedimientos legales de aplicación de la ley. Los temas incluyen vigilancia, registro e incautación, arresto y detención, y redacción de informes.\nEsta especialidad también se utiliza para determinar qué tan \"legal\" o sólido es un arresto.\n### Ley psiónica\n*No se puede usar sin estar entrenado.*\n\nLos abogados,\
              \ jueces y otros utilizan esta habilidad para interactuar en salas de tribunales y en reuniones legislativas. Este aspecto de la habilidad amplia de Ley se utiliza para argumentar un caso o un punto de vista en un procedimiento oficial."
      court-procedures:
        attribute: INT
        cost: 3
        url: /skills/law#court-procedures
        localized:
        - en:
            name: Court procedures
            description: "Lawyers, judges, and others use this skill to interact in a courtroom setting. This specialty is used to argue a case or point of view in an official proceeding.\n\n---"
        - es:
            name: Law enforcement procedures
            description: "Police officers, detectives, bounty hunters, and others use this skill to follow (or bend) legal law enforcement procedures. Topics covered include:\n- Knowing laws concerning surveillance, search, and seizure.\n- Proper arrest and detainment procedures.\n- Filling out reports and Otros official paperwork.\n\nThis specialty is also used to determine how \"Bueno\" an arrest is (providing ammunition to the lawyers who will try to make the arrest stick).\n\n---"
      law-enforcement-procedures:
        attribute: INT
        cost: 3
        url: /skills/law#law-enforcement-procedures
        localized:
        - en:
            name: Law enforcement procedures
            description: "Police officers, detectives, bounty hunters, and others use this skill to follow (or bend) legal law enforcement procedures. Topics covered include:\n- Knowing laws concerning surveillance, search, and seizure.\n- Proper arrest and detainment procedures.\n- Filling out reports and other official paperwork.\n\nThis specialty is also used to determine how \"good\" an arrest is (providing ammunition to the lawyers who will try to make the arrest stick).\n\n---"
        - es:
            name: Law, specific skill
            description: "For each separate purchase of this specialty, a Personaje selects a specific Cultura or a specific type of law (maritime law, salvage law, etc.). As the Especialidad is improved, the Personaje gains a progressively stronger grasp on the laws and legal systems of that Cultura or specialty.\n\n⊗ **Increased Effect:** At higher ranks, the Personaje becomes more proficient within the legal system of the Cultura in question. Using the specific skill provides a reduction to the Dado de Situación:\n- **-1 bonus at Rank 3**\n- **-2 bonus at Rank 6**\n- **-3 bonus at Rank 9**\n- **-4 bonus at Rank 12**\n---"
      law-specific-skill:
        attribute: INT
        cost: 2
        url: /skills/law#law-specific-skill
        localized:
        - en:
            name: Law, specific skill
            description: "For each separate purchase of this specialty, a character selects a specific culture or a specific type of law (maritime law, salvage law, etc.). As the specialty skill is improved, the character gains a progressively stronger grasp on the laws and legal systems of that culture or specialty.\n\n⊗ **Increased Effect:** At higher ranks, the character becomes more proficient within the legal system of the culture in question. Using the specific skill provides a reduction to the situation die:\n- **-1 bonus at Rank 3**\n- **-2 bonus at Rank 6**\n- **-3 bonus at Rank 9**\n- **-4 bonus at Rank 12**\n---"
        - es:
            name: Law, specific skill
            description: "For each separate purchase of this specialty, a character selects a specific culture or a specific type of law (maritime law, salvage law, etc.). As the specialty skill is improved, the character gains a progressively stronger grasp on the laws and legal systems of that culture or specialty.\n\n⊗ **Increased Effect:** At higher ranks, the character becomes more proficient within the legal system of the culture in question. Using the specific skill provides a reduction to the situation die:\n- **-1 bonus at Rank 3**\n- **-2 bonus at Rank 6**\n- **-3 bonus at Rank 9**\n- **-4 bonus at Rank 12**\n---"
  leadership:
    attribute: PER
    cost: 4
    category: Social
    url: /skills/leadership
    localized:
    - en:
        name: Leadership
        description: "This broad skill provides a character with the abilities and talents of a leader. With leadership training, a character can coordinate a group to get it to perform better or work as a team. Only one character can assume the role of leader at a time, and conflicting orders cancel each other out.\n\nA leader, by using an action to attempt a Leadership skill check and then achieving a degree of success on the check, provides a **-1 bonus** to all actions performed in the remainder of the current round and all of the following round by a certain number of followers.\n\n### Leadership Situation Modifiers\nThe check is modified by the attitude of the targets, plus any other factors determined by the GM:\n\n| Situation | Modifier |\n| :--- | :--- |\n| **Targets are accustomed to being led** | -2 steps |\n| **Targets recognize leader's authority** | 0 |\n| **Targets don't recognize leader's authority** | +2 steps |\n\n- **Note:** Leadership broad skill can't be used on targets\
          \ who are **Combative**.\n\n---\n\n### Results\n- **Critical Failure:** The leader confuses his followers, who receive a **+1 penalty** for the remainder of the current round and all of the following round. No further Leadership checks can be made in this scene.\n- **Failure:** The followers receive no bonus in the current round, but the leader can make another check in the next round.\n- **Ordinary:** As many as **two followers** receive the leadership bonus.\n- **Good:** As many as **four followers** receive the leadership bonus.\n- **Amazing:** As many as **six followers** receive the leadership bonus.\n\n---"
    - es:
        name: Liderazgo
        description: "Esta habilidad general proporciona a un personaje las capacidades y talentos de un líder. Un líder puede coordinar a un grupo para rendir mejor o trabajar en equipo. Solo un personaje puede asumir el papel de líder a la vez.\n\nLa tirada de acción de un líder proporciona una bonificación a todas las acciones realizadas en el resto del asalto y en todos los asaltos siguientes por parte de sus seguidores. No se puede usar sobre objetivos que estén Combativos.\n\n### Resultados\n- **Fallo Crítico:** El líder confunde a sus seguidores, quienes reciben una penalización de +1 para el resto del asalto.\n- **Fallo:** Los seguidores no reciben bonificación; el líder puede realizar otra tirada en el siguiente asalto.\n- **Ordinario:** Hasta dos seguidores reciben la bonificación de liderazgo.\n- **Bueno:** Hasta cuatro seguidores reciben la bonificación de liderazgo.\n- **Asombroso:** Hasta seis seguidores reciben la bonificación de liderazgo."
    items:
      command:
        attribute: PER
        cost: 4
        url: /skills/leadership#command
        localized:
        - en:
            name: Command
            description: "This specialty skill represents the character's ability to lead others by virtue of sheer authoritativeness and persuasive ability. This is the skill used by military officers, elected officials, and law enforcers to issue orders and see that they're carried out.\n\n**Note:** Command can't be used on targets who are Hostile or Combative; before such targets can be led, their attitude must be shifted (perhaps by the use of the Inspire skill).\n\n⊗ **Increased Effect:** As a character achieves higher ranks in this specialty, the bonus to his or her Leadership skill checks improves to **-1 at rank 4**, **-2 at rank 8**, and **-3 at rank 12**. (Note: This bonus is not cumulative.)\n\n---"
        - es:
            name: Habilidades de Especialidad
            description: "{{% list %}}\n- **Mando\n- **Inspirar:** Liderar mediante el ejemplo; puede usarse sobre objetivos Hostiles o Combativos.\n| Resultados | Descripción |\n| :--- | :--- |\n| **Ordinario** | El éxito indica que hasta dos seguidores reciben la bonificación de liderazgo. |\n| **Bueno** | El éxito indica que hasta cuatro seguidores reciben la bonificación de liderazgo. |\n| **Asombroso** | El éxito indica que hasta seis seguidores reciben la bonificación de liderazgo. |"
      inspire:
        attribute: PER
        cost: 3
        url: /skills/leadership#inspire
        localized:
        - en:
            name: Inspire
            description: "This specialty skill represents the ability to command by example. This skill can be used by military officers, elected officials, and law enforcers who also have the command specialty, but inspire is more often used by those who are trying to lead civil disobedience movements and other types of nonviolent activities.\n\nOne major difference is that **Inspire can be used on targets who are Hostile or Combative**, favorably altering the attitude of the target(s) toward the user of the skill.\n\n⊗ **Increased Effect:** As a character achieves higher ranks in this specialty, the bonus to his or her Leadership skill checks improves to **-1 at rank 4**, **-2 at rank 8**, and **-3 at rank 12**. (Note: This bonus is not cumulative.)\n\n---"
        - es:
            name: Inspirar
            description: "This Especialidad represents the ability to command by example. This skill can be used by military officers, elected officials, and law enforcers who also have the command specialty, but Inspirar is more often used by those who are trying to lead civil disobedience movements and Otros types of nonviolent activities.\n\nOne major difference is that **Inspirar can be used on targets who are Hostile or Combative**, favorably altering the attitude of the target(s) toward the user of the skill.\n\n⊗ **Increased Effect:** As a Personaje achieves higher ranks in this specialty, the bonus to his or her Liderazgo skill checks improves to **-1 at rank 4**, **-2 at rank 8**, and **-3 at rank 12**. (Note: This bonus is not cumulative.)\n\n---"
  life-science:
    attribute: INT
    cost: 7
    category: Technical
    url: /skills/life-science
    localized:
    - en:
        name: Life Science
        description: "This broad skill represents a character's training in the life sciences. Skill checks involving this skill are made the same as Knowledge skill checks.\n\n---"
    - es:
        name: Ciencias de la vida
        description: "Esta habilidad amplia representa la formación de un personaje en las ciencias de la vida. Las tiradas de habilidad que involucran esta habilidad se realizan de la misma manera que las tiradas de la habilidad de Conocimiento.\n\n---"
    items:
      biology-botany-zoology:
        attribute: INT
        cost: 3
        url: /skills/life-science#biology-botany-zoology
        localized:
        - en:
            name: Biology, Botany, Zoology
            description: "These specialty skills must be purchased separately.\n- **Biology:** The study of organisms and biochemical processes.\n- **Botany:** The study of plants and identification.\n- **Zoology:** The study of animals and animal life.\n\n⊗ **Increased Effect:** A character receives a **-1 bonus** at rank 3, **-2** at rank 6, **-3** at rank 9, and **-4** at rank 12 on certain other skill checks that can be assisted by this specialty. These skills include Survival, Animal Handling, and Medical Science—treatment."
        - es:
            name: Biología, Botánica, Zoología
            description: "Estas habilidades de especialidad deben comprarse por separado.\n- **Biología:** El estudio de los organismos y sus procesos bioquímicos.\n- **Botánica:** El estudio e identificación de las plantas.\n- **Zoología:** El estudio de los animales y la vida animal.\n\n⊗ **Efecto incrementado:** Un personaje recibe una **bonificación de -1 paso** en el rango 3, **-2** en el rango 6, **-3** en el rango 9 y **-4** en el rango 12 en ciertas otras tiradas de habilidad que puedan ser asistidas por esta especialidad. Estas habilidades incluyen Supervivencia, Manejo de animales y Ciencias médicas—tratamiento.\n\n---"
      psionics:
        attribute: INT
        cost: 3
        url: /skills/life-science#psionics
        localized:
        - en:
            name: Psionics
