            description: "La genética es el estudio de la herencia y los genes, formando la base de la ingeniería genética y la clonación.\n\n⊗ **Efecto incrementado:** Un personaje recibe una **bonificación de -1 paso** en el rango 3, **-2** en el rango 6, **-3** en el rango 9 y **-4** en el rango 12 en ciertas otras tiradas de habilidad que puedan ser asistidas por esta especialidad. Estas habilidades incluyen Ciencias médicas—tratamiento, Ciencias forenses y ciertas tiradas de Biocinesis o Mutación.\n\n---"
